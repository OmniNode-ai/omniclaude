# Public-repository hygiene gate — this repo's declaration (OMN-18014).
#
# Layer (a) of the gate: the TOP-LEVEL PATH ALLOWLIST. Anything tracked at the
# repository root that is not named below fails. This is the half that refuses
# .onex/, .onex_state/, .evidence/, drift/, merge-sweep/ and the next junk
# directory nobody has invented yet — a denylist must anticipate that
# directory, an allowlist does not.
#
# Adopting the gate is one decision per repo: declare the root once, and hold
# it. Adding an entry here is a decision to publish that directory.
#
# DELIBERATELY ABSENT, and they must stay absent: .evidence and .onex_state.
# Both are tracked in this repo today and both are OMN-17992 wave-A deletion
# targets (plan section 6.1). Listing them would convert a finding this gate
# exists to raise into a decision nobody made.

mode: report
suppression_registry: ".public-repo-hygiene-suppressions.yaml"

# OMN-19835: these five classes FAIL the run, on the lines a change ADDS.
# The tree already carries a residue in each of them (counted in OMN-19836 at
# 1531 findings in 377 files across the first four classes on dev 6ccd525e2,
# plus 193 private-network findings added by OMN-19837, measured on the real
# CI-fetched private vocabulary against dev 9a58ef705), so a whole-tree
# enforce would fail every unrelated pull request, and report mode is how
# internal content reached public dev and main unnoticed. With
# enforce_scope: added-lines a pull request that adds a private repository
# name, internal knowledge-base prose, a lab lane id, a person's name or a lab
# address/host nickname goes red; one that touches none of them stays green.
# The scan and the report stay whole-tree, so the residue is still counted on
# every run. When OMN-19836 brings a class to zero, it stays in this list and
# the scope question for it is moot; drop enforce_scope only when all five are
# at zero.
enforce_scope: added-lines
enforce_classes:
  - "private-repo-name"
  - "internal-kb-prose"
  - "lab-config"
  - "person-name"
  - "private-network"

allowed_top_level:
  - ".bandit"
  - ".claude"
  - ".claude-plugin"
  - ".cross-repo-policy.yaml"
  - ".env.allowlist"
  - ".env.example"
  - ".github"
  - ".gitignore"
  - ".kb-doc-gate.yaml"
  - ".markdown-link-check.json"
  - ".onex_ratchets"
  - ".pre-commit-config.yaml"
  - ".pre-commit-hooks"
  - ".pre-commit-hooks.yaml"
  - ".public-repo-hygiene.yaml"
  - ".public-repo-hygiene-suppressions.yaml"
  - ".ruffignore"
  - ".secrets.baseline"
  - ".yamllint.yml"
  - "app"
  - "architecture-handshakes"
  - "CLAUDE.md"
  - "config"
  - "conftest.py"
  - "consumers"
  - "contracts"
  - "deployment"
  - "docker"
  - "docker-compose.yml"
  - "docs"
  - "examples"
  - "grafana"
  - "LICENSE"
  - "monitoring"
  - "mypy.ini"
  - "plugins"
  - "pyproject.toml"
  - "pyrightconfig.json"
  - "README.md"
  - "schemas"
