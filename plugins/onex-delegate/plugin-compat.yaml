#
# plugin-compat.yaml — onex-delegate (consumer-facing delegation) plugin
# compatibility matrix.
#
# This is the slim, consumer-distributed plugin's OWN compat surface — separate
# from plugins/onex/plugin-compat.yaml, which remains the compat matrix for the
# full internal/dev skill tree (plugins/onex, not marketplace-distributed as of
# OMN-14688). Both are read independently; do not merge them.
#
# Read by: test_marketplace_cli_pin.py (this plugin's copy, under
# plugins/onex-delegate/tests/) as the source of truth for the `onex` CLI pin
# that plugin.json and marketplace.json must agree with.
#
# OMN-14688 established the physically-slim customer package. OMN-17354 adds
# the cloud sibling needed by beta U4 without publishing internal tooling.

plugin: onex
plugin_version: "0.2.1"

# Compatibility window: plugin works with runtimes in [min, max).
min_runtime_version: "0.2.0"
max_runtime_version: "1.0.0"

# `onex` CLI pin (OMN-8799, SD-12) — must match plugin.json requires.onex_cli
# and marketplace.json plugins[0].requires.onex_cli.
#
# OMN-16041 CORRECTION. This block previously declared
# `package: omnibase-core, min_version: 0.39.0` with the hint
# `pipx install 'omnibase-core>=0.39.0'`. That was factually wrong and it made
# the plugin's ONLY command un-runnable on a clean machine:
#
#   * `omnibase-core` ships the `onex` CONSOLE SCRIPT
#     (omnibase_core/pyproject.toml [project.scripts] onex = ...cli_commands:cli)
#     and the loader that discovers the `onex.cli` entry-point group.
#   * `omnibase-infra` ships the `delegate` SUBCOMMAND
#     (omnibase_infra/pyproject.toml [project.entry-points."onex.cli"]
#      delegate = omnibase_infra.cli.cli_delegate:delegate_command).
#
#   Installing only omnibase-core therefore yields, verbatim:
#     Error: No such command 'delegate'. Did you mean 'gate'?   (exit 2)
#
# Both packages must be present IN THE SAME environment. `package` names the
# package that provides this plugin's only command; `console_script_package`
# names the package that provides the `onex` executable itself. The keys are
# flat (never nested) because session_start_onex_cli_pin_check.sh parses this
# block with an awk state machine, not a YAML parser.
onex_cli:
  package: "omnibase-infra"
  min_version: "0.38.4"
  console_script_package: "omnibase-core"
  console_script_min_version: "0.46.8"
  # The package that ships the BACKING NODE (OMN-16191). `package` and
  # `console_script_package` between them produce an `onex` with a `delegate`
  # subcommand, but the subcommand dispatches node_delegate_skill_orchestrator,
  # which lives in neither of them. Node lookup is `onex.nodes` entry-point
  # resolution over INSTALLED distributions (omnibase_core cli_node.py
  # _resolve_packaged_contract), so the node is reachable only when omnimarket
  # is installed into the SAME environment. Omitting it produced, verbatim:
  #   Error: Unknown node 'node_delegate_skill_orchestrator'
  # on a byte-for-byte-as-documented clean install — with ~130 other nodes
  # listed as "known", which made it read like a registry bug rather than a
  # missing package. There is no workspace-root requirement here at all: the
  # entry point resolves out of site-packages.
  node_package: "omnimarket"
  node_package_min_version: "0.4.205"
  # OMN-19367: the hints install all three packages from PyPI, byte-for-byte the
  # command in step 1 of the public quickstart
  # (knowledge-base guides/onex-plugin-quickstart.md). They previously pinned
  # omnimarket to a git direct reference on the unreleased `dev` branch and
  # pointed at a workspace-clone recipe, which is internal tooling a customer
  # machine never has. `node_package_min_version` is the floor the quickstart
  # names. The hints name no directory and no environment variable, so there is
  # nothing for them to resolve against the caller's working directory.
  #
  # Proven in CI by
  # `test_install_works.py::test_declared_pins_install_and_delegate_runs`, which
  # installs exactly the requirements parsed out of `install_hint` into a clean
  # venv and resolves `node_delegate_skill_orchestrator` from the installed
  # distribution.
  # Do NOT document `uv run onex delegate` — `uv run` resolves the venv of
  # whatever project the CURRENT directory belongs to, so it only works inside
  # a repo that happens to co-install omnibase-infra (see cwd_independent below).
  install_hint: "uv tool install --with 'omnibase-infra>=0.38.4' --with 'omnimarket>=0.4.205' 'omnibase-core>=0.46.8'"
  install_hint_pipx: "pipx install 'omnibase-core>=0.46.8' && pipx inject omnibase-core 'omnibase-infra>=0.38.4' 'omnimarket>=0.4.205'"
  cwd_independent: true
  # GAP CLOSED 2026-08-16 (OMN-16041); RE-QUALIFIED 2026-08-18 (OMN-16191).
  # Literally true again as of OMN-19367: every package in the recipe is a
  # PyPI version pin. The paired xfail marker in test_install_works.py stays
  # absent while this is true.
  installable_from_pypi: true

# delegate's only backing node. Topic/schema entries intentionally omitted:
# node_delegate_skill_orchestrator dispatches via `onex delegate` (CLI ->
# omnibase_infra cli_delegate.py -> node dispatch), not through the runtime
# dispatch-engine topic matrix this file otherwise tracks for plugins/onex.
nodes: []
