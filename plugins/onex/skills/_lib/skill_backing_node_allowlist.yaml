---
# Skill backing-node liveness validator allowlist (<TICKET>).
#
# Each entry exempts a single skill from ``validate_skill_backing_node``.
# Every entry MUST carry a non-empty ``reason`` string explaining WHY the
# skill is allowed to declare a backing node that does not pass liveness
# checks.  The loader rejects blank or missing reasons.
#
# Adding a skill here is a deliberate ownership statement.  Drop-in
# additions to silence the gate are not allowed and will be caught in
# code review.
#
# Schema:
#   allowlist:
#     - skill: <directory name under plugins/onex/skills/>
#       reason: <free-text justification, non-empty>

allowlist:
  - skill: pr_review
    reason: >
      The skill now dispatches through the live omniclaude shell node
      node_skill_pr_review_orchestrator, but the current validator still resolves
      backing nodes only under omnimarket node roots. The omniclaude node contract
      and implementation live under src/omniclaude/nodes/node_skill_pr_review_orchestrator;
      keep this allowlist until the validator learns omniclaude-local skill
      orchestrator roots.
  - skill: pr_review_bot
    reason: >
      The skill now dispatches through the live omniclaude shell node
      node_skill_pr_review_bot_orchestrator, but the current validator still
      resolves backing nodes only under omnimarket node roots. The omniclaude node
      contract and implementation live under
      src/omniclaude/nodes/node_skill_pr_review_bot_orchestrator; keep this
      allowlist until the validator learns omniclaude-local skill orchestrator
      roots.
