#
# hook_edge_lane.yaml — THE declared bus lane for the Claude Code hook edge (OMN-17204).
#
# ---------------------------------------------------------------------------
# Why this file exists
# ---------------------------------------------------------------------------
# Before OMN-17204 there was no declared answer to "which lane does the hook
# edge publish to, and which lane does the cloud relay consume from." The
# answer was produced, per invocation, by shell sourcing order:
# `plugins/onex/hooks/scripts/common.sh` sources ~/.omnibase/.env under
# `set -a` AFTER the Claude session env is already in place, so that file beat
# ~/.claude/settings.json's own KAFKA_BOOTSTRAP_SERVERS export — and a third
# surface, omnibase_infra/config/overlays/mac-dev.yaml, which the emit node's
# own contract.yaml names as the authority, declared a fourth value
# (localhost:19092) that matched neither live surface.
#
# That undeclared fact cost real time three times:
#   * OMN-16162 flipped Done -> Backlog on a probe run against the wrong lane.
#   * OMN-16996 was filed ("hooks report publish SUCCESS while zero events
#     reach the broker") and later falsified for the same reason.
#   * beta/GOAL.md row 0's hook clause named a lane it could never observe.
#
# This file is the single authority. `scripts/hook_edge_lane.sh` applies it
# AFTER common.sh in every *_bus_mirror.sh, so no .env can pick a lane, and
# `scripts/validation/validate_hook_edge_lane.py` fails the build if any of
# that stops being true.
#
# ---------------------------------------------------------------------------
# Scope boundary: this file was the RULE; OMN-17034 owned the INSTANCE
# ---------------------------------------------------------------------------
# OMN-17204 declared the pairing and made a publisher/consumer split a failing
# check, but deliberately left the lane CHOICE open. The instance defect was
# real: the live `omninode-gateway-forwarder` was attached to the DEV lane
# network while the hook edge published to the STABILITY lane, so no hook
# event could cross to the cloud relay on its own. Repointing the publisher is
# a behaviour decision, not a declaration cleanup, so this file recorded that
# it would not make that decision silently — it belonged to OMN-17034. What
# OMN-17204 shipped is that the mismatch became a check failure with a named
# cause instead of a zero row count someone had to interpret.
#
# ---------------------------------------------------------------------------
# THE RULING — the operator, 2026-09-10, in session (OMN-17034)
# ---------------------------------------------------------------------------
# The local hook producer targets the DEV lane DIRECTLY. `lane` is therefore
# "dev", and relay.required_network is the dev lane's network. The decision is
# recorded durably as an OPERATOR-CONSENT row in the fleet coordination
# ledger (docs/tracking/ROLLING_WORK_LEDGER.md) timestamped
# 2026-09-10T16:45:39Z, whose approved scope reads in part: "standing ruling:
# the local hook producer targets the dev lane directly (OMN-17034)".
#
# The projection concern the pre-ruling revision of this header raised is now
# resolved in the direction that FAVOURS the ruling rather than against it.
# `node_projection_work_events` reads the bare-canonical hook topics on the
# DEV lane — that is the lane `omninode_internal.work_events` is written from.
# Measured on the lab host at 2026-09-10T18:17Z: the dev-lane tool-executed topic
# advanced 599687 -> 599711 while omninode_internal.work_events took real
# INSERTs over the same window (n_tup_ins 71208 -> 71237) carrying fresh
# emitted_at values in that minute. Publishing to dev therefore puts hook rows
# ON the lane the projection already reads, instead of off it.
#
# The stability -> dev gateway mirror is RETAINED as a SECONDARY path, not
# deleted. It is what carried hook rows across while the producer sat on the
# stability lane, and it went dark from 2026-09-06: the lab dev broker moved
# to SASL-only (OMN-18012) while the forwarder's dev legs stayed plaintext, so
# they were refused at handshake while the forwarder still logged "delivered".
# That leg was repaired on 2026-09-10T18:17Z — the forwarder now authenticates
# as the dev-lane SCRAM identity and the mirror delivers again. It stays in
# place as a secondary path until OMN-18134 brings the gateway compose project
# under the deploy agent's dev scope, at which point that path is governed
# rather than hand-maintained and can be re-assessed on its own merits.
#
# ---------------------------------------------------------------------------
# Maintenance
# ---------------------------------------------------------------------------
# `known_lanes` is derived from the canonical compose lane files in
# omnibase_infra (`docker/docker-compose.infra.yml` for dev,
# `docker/docker-compose.stability-test.yml`, `docker/docker-compose.prod.yml`).
# When a lane's external broker port or network name changes there, update it
# here in the same PR — omnibase_infra's deploy/lane-census/lane-manifest.yaml
# carries a `hook_edge:` pointer back to this file so an audit reads the lane
# fact from the lane map instead of re-deriving it from .env sourcing order.
#
# verified: 2026-08-30 via
#   grep -nE '9092|name: omnibase-infra' omnibase_infra/docker/docker-compose.{infra,stability-test,prod}.yml
# (dev 19092 / omnibase-infra-network; stability 39092 /
#  omnibase-infra-stability-test-network; prod ${PROD_REDPANDA_EXTERNAL_PORT:-49092}
#  / omnibase-infra-prod-network)
---
schema_version: "1.0.0"
name: hook_edge_lane
ticket_id: "OMN-17204"
summary: >
  Declares the one bus lane the Claude Code hook edge publishes to and the
  cloud relay must consume from. Replaces resolution-by-shell-sourcing-order
  across ~/.omnibase/.env, ~/.claude/settings.json and the mac-dev overlay.

# ---------------------------------------------------------------------------
# The pairing. ONE lane name, read by BOTH sides.
# ---------------------------------------------------------------------------
# The publisher's broker and the relay's required network are both DERIVED
# from this single field via `known_lanes`, so a declaration in which the
# publisher and the consumer disagree is unrepresentable.
lane: "dev"

# The host the operator Mac dials. Lane ports below are host-side published
# ports on that host; containers on a lane network use redpanda:9092 instead.
lane_host: "192.168.86.201"  # onex-allow-internal-ip

# ---------------------------------------------------------------------------
# TRANSPORT IS DECLARED, NEVER INFERRED (OMN-17284, following OMN-18012)
# ---------------------------------------------------------------------------
# Each lane declares HOW its broker is spoken to, beside WHICH broker it is.
# The vocabulary is copied deliberately from the two surfaces that settled
# this after the 2026-09-07 outage -- omnimarket `config/ci_bus_lanes.yaml`
# and omnibase_infra `scripts/deploy-agent/deploy_agent/kafka_config.py` --
# so a lane declaration reads identically wherever a reader meets one:
#
#   security_protocol -> PLAINTEXT | SSL | SASL_PLAINTEXT | SASL_SSL, spelled
#                        as librdkafka spells it. REQUIRED on every lane. The
#                        loader refuses to guess.
#   sasl_mechanism    -> REQUIRED beside a SASL_* protocol, REJECTED beside a
#                        non-SASL one. A declaration that says two things is
#                        not a declaration.
#   sasl_env_prefix   -> a REFERENCE, never a value. It names the prefix this
#                        host stores the credential under, so the four names
#                        ModelKafkaEventBusConfig.apply_environment_overrides()
#                        reads can be resolved at run time from the operator
#                        env file (OMNIBASE_OPERATOR_ENV_FILE, default
#                        ~/.omnibase/.env) -- the same surface
#                        `deploy-runtime.sh` resolves the lane's principal
#                        from on the lab host.
#
# CONFIG HERE, SECRET ELSEWHERE. `ci_bus_lanes.yaml` states the line this file
# also holds: SASL credential VALUES are never stored in a checked-in lane
# declaration. Only the prefix is.
#
# WHY IT MATTERS HERE AND NOT BEFORE: this producer is the SIXTEENTH dev-lane
# Kafka client. omnibase_infra#3276 (squash d7c5585314a751689e705e09e32c9e4565671ef2,
# OMN-18012 phase B, merged 2026-09-07) flipped the dev broker's EXTERNAL
# listener to SASL/SCRAM-SHA-256 and bound the credential on the fifteen
# dev-lane COMPOSE services. This one lives outside that compose project and
# was not brought along, so it kept bootstrapping in the clear. A Redpanda
# that requires SASL closes the connection rather than answering, so the
# symptom was `KafkaConnectionError: Unable to bootstrap from [...]` on a 30s
# loop -- in a log, indistinguishable from a broker that is simply down. The
# gateway forwarder's dev legs failed the same way from 2026-09-06 while still
# logging "delivered" (repaired 2026-09-10; see the header above), and the
# deploy agent restarted 53 times by 2026-09-08T04:12Z.
#
# verified: 2026-09-15 on the lab host --
#   `rpk cluster info` inside `omnibase-infra-redpanda` returns "broker closed
#   the connection immediately after a request was issued, which happens when
#   SASL is required but not provided"; the same command inside
#   `omnibase-infra-stability-test-redpanda` returns cluster info, which is
#   the positive control that makes the dev refusal a fact about SASL rather
#   than about the probe.
known_lanes:
  dev:
    compose_project: "omnibase-infra"
    network: "omnibase-infra-network"
    bootstrap_servers: "192.168.86.201:19092"  # onex-allow-internal-ip onex-allow-kafka-broker
    # SASL over PLAINTEXT: :19092 carries no TLS. Declaring SASL_SSL here
    # would reproduce the CI publishers' 2026-09-07 failure verbatim
    # ("SSL handshake failed ... connecting to a PLAINTEXT broker listener?").
    security_protocol: "SASL_PLAINTEXT"
    sasl_mechanism: "SCRAM-SHA-256"
    # -> DEV_KAFKA_SASL_USERNAME / DEV_KAFKA_SASL_PASSWORD in the operator env
    # file. The same two names docker-compose.dev-lane.yml resolves for all
    # fifteen compose clients. A pointer, not a credential.
    sasl_env_prefix: "DEV_"
  stability-test:
    compose_project: "omnibase-infra-stability-test"
    network: "omnibase-infra-stability-test-network"
    bootstrap_servers: "192.168.86.201:39092"  # onex-allow-internal-ip onex-allow-kafka-broker
    # No SASL: OMN-18012 phase B deliberately scoped the flip to the dev lane
    # only, because the redpanda service is declared in the BASE compose file
    # that four other lanes merge. Measured 2026-09-15: an unauthenticated
    # client bootstraps against :39092 and is refused on :19092.
    security_protocol: "PLAINTEXT"
  prod:
    compose_project: "omnibase-infra-prod"
    network: "omnibase-infra-prod-network"
    bootstrap_servers: "192.168.86.201:49092"  # onex-allow-internal-ip onex-allow-kafka-broker
    # Last-known transport, NOT currently verifiable: the lab compose prod
    # lane was retired under OMN-18320 and removed from the census manifest,
    # so there is no listener to probe. Recorded rather than deleted because
    # the entry is what makes `lane: "prod"` a refusable value instead of an
    # unknown one; this producer never selects it.
    security_protocol: "PLAINTEXT"

# ---------------------------------------------------------------------------
# Consumer side of the same pairing.
# ---------------------------------------------------------------------------
# `required_network` MUST equal known_lanes[lane].network. The validator
# enforces that equality, which is what turns "publisher and consumer are on
# different lanes" from an offset-reading exercise into a failing check.
relay:
  container: "omninode-gateway-forwarder"
  required_network: "omnibase-infra-network"
  role: >
    Sole process bridging a local .201 broker to the cloud MSK relay. Anything
    it cannot see on its attached lane network can never reach the cloud
    gateway, independent of every other link in the hooks->relay chain.

# ---------------------------------------------------------------------------
# The hook topics this pairing governs.
# ---------------------------------------------------------------------------
# Named by their canonical-registry constant, never by literal. The topic
# STRING has exactly one home -- src/omniclaude/hooks/topic_registry.yaml,
# which is what TopicBase and emit_client_wrapper already read -- so this file
# cannot become a second place a topic name is spelled, and a rename in the
# registry cannot leave a stale literal behind here. The validator resolves
# these constants through the registry and cross-checks the resolved strings
# against the --event-type each *_bus_mirror.sh actually emits, so a new hook
# cannot join the edge without joining the lane policy.
topic_registry: "src/omniclaude/hooks/topic_registry.yaml"
governed_topics:
  - "SESSION_STARTED"
  - "SESSION_ENDED"
  - "TOOL_EXECUTED"
  - "PROMPT_SUBMITTED"

# ---------------------------------------------------------------------------
# Surfaces explicitly demoted from authority (AC3).
# ---------------------------------------------------------------------------
# These are not banned — they still carry bootstrap-class config for other
# consumers. They are simply no longer the hook edge's answer. The resolver
# overrides whatever they set, and `validate_hook_edge_lane.py --live` reports
# which of them disagree so the disagreement is legible rather than decisive.
non_authoritative_surfaces:
  - "~/.omnibase/.env"
  - "~/.claude/settings.json"
  - "omnibase_infra/config/overlays/mac-dev.yaml"

# ---------------------------------------------------------------------------
# Golden path — the behaviour this contract is responsible for.
# ---------------------------------------------------------------------------
golden_path:
  - A *_bus_mirror.sh sources common.sh (which loads ~/.omnibase/.env under `set -a`), then sources hook_edge_lane.sh — the declared lane wins and KAFKA_BOOTSTRAP_SERVERS is the contract's answer, whatever .env said
  - A hook invoked with KAFKA_BOOTSTRAP_SERVERS preset to another lane still publishes to the declared lane — proven live 2026-08-30T15:50:34Z, marker OMN17204LaneProof-1788105033 read back 8 hits on the then-declared lane (stability at that date), 0 on the other; the proof is of resolver precedence, and it does not move when the declared lane moves
  - relay.required_network disagrees with known_lanes[lane].network — validate_hook_edge_lane.py exits 1 naming the publisher/consumer split (the OMN-17034 defect, made checkable)
  - A bus-mirror script drops the resolver, or sources it BEFORE common.sh — validate_hook_edge_lane.py exits 1 naming the file and both line numbers
  - A governed topic constant leaves src/omniclaude/hooks/topic_registry.yaml — validate_hook_edge_lane.py exits 1 rather than governing an empty topic set
  - The contract is unreadable at hook time — the resolver leaves the environment untouched and returns 0, degrading to pre-OMN-17204 behaviour for one invocation instead of killing the session; the merge gate is what keeps a malformed contract off a machine
  - A demoted host surface (~/.omnibase/.env, ~/.claude/settings.json) disagrees — `--live` names it and exits 1 on the operator Mac; the contract still wins at hook time, and CI never runs --live because neither file exists on a runner

dod_evidence:
  - kind: tests
    description: "Contract, resolver, and gate proven, including both mismatch directions"
    command: "uv run pytest tests/hooks/test_hook_edge_lane.py -v"
  - kind: ci
    description: "hook-edge-lane-gate is a required check"
    command: "gh pr checks"
