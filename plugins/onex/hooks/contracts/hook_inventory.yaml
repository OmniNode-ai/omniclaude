      a backtick pair is command substitution, and markdown quotes command
      names in backticks, so a note ABOUT a command executes it. Measured
      twice on 2026-09-18: two lanes wrote a checkpoint note quoting the onex
      CLI, the shell ran it, the quoted words were lost from the note, and the
      spawn error read as a broken PostToolUse hook until every hook in the
      plugin had been run against a fixture payload. Registered LAST on the
      existing Bash matcher, after pre_tool_use_pr_body_stamp_guard.sh.
    enforcement: true
    lite_mode_exit: false
    mask:
      # BORROWED BIT. BASH_GUARD already governs the Bash-matcher guards on
      # this edge and every default-mask ordinal is allocated, so a new bit is
      # a cross-repo release chain. Recorded here rather than left to be
      # inferred: clearing BASH_GUARD disables this guard along with its
      # neighbours, and a disabled run is LOGGED rather than silent.
      gate_call: "BASH_GUARD"
      bit_defined: true
    canary:
      kind: "block"
      stdin:
        tool_name: "Bash"
        tool_input:
          command: 'echo "note: `uv run onex` misread" >> hook-inventory-canary.md'
      env: {}
      fixtures: {}
      expect:
        exit_code: 2
        stdout_contains:
          - '"decision": "block"'
          - "OMN-18750"
        stdout_absent: []

