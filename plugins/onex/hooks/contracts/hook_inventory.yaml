# ---------------------------------------------------------------------------
# disabled_hooks — every script deliberately on disk and NOT registered.
# ---------------------------------------------------------------------------
# This is the half OMN-13244 never wrote down. Each entry carries the four
# fields OMN-17006 made a standing rule, now typed and machine-checked rather
# than a sentence in a description:
#
#   owner        — the person or lane accountable for restoring it
#   reason       — why THIS hook is off, not merely that it is
#   review_by    — an absolute date. When it passes, the gate FAILS and names
#                  the entry. This is what OMN-13244 lacked; a disable with no
#                  date is indistinguishable from a decision.
#   restoration  — what puts it back: a typed kind, a re-enable ticket, and
#                  the action. `re_register` additionally requires the script
#                  to still be on disk, so the restoration it names is
#                  actually a one-line config add and not a rewrite.
#
# The gate also refuses a disabled entry that IS registered — a contradiction
# between the two halves of this file is drift, not a preference.
disabled_hooks:
  - script: "hook_dispatch_claim_pretool.sh"
    owner: "omniclaude hooks lane"
    reason: >
      Probed 2026-08-29 with four independent defects, any one of which makes
      re-registration unsafe: its `exit 2` is converted to `exit 0` by the
      error-guard EXIT trap because it never calls `trap - EXIT`; its deny
      payload uses a {"type":"permissionDenied"} shape this harness does not
      honour; AGENT_ID falls back to the shared constant `session` so two
      anonymous lanes are the same claimant and never collide; and the lease
      is a fixed non-renewable 300s whose expiry deletes the claim file
      instead of recording CLAIM_EXPIRED.
    review_by: "2026-10-31"
    restoration:
      kind: "re_register"
      reenable_ticket: "OMN-17005"
      action: >
        OMN-17005 ACs 1-8 all hold with individual live probes — renewable
        leases, fencing tokens, a real per-lane claimant identity, durable
        CLAIM_EXPIRED evidence, and the A17 canary in this file proving the
        registered hook actually refuses — then re-register the pair in one
        change. No partial re-registration. If AC3 (per-lane identity) cannot
        be produced, OMN-17005 closes won't-fix and this entry converts to
        kind delete; a guard that cannot identify a lane is not a guard.

  - script: "hook_dispatch_claim_posttool.sh"
    owner: "omniclaude hooks lane"
    reason: >
      The release half of the same OMN-8928/8929 pair. It is unregistered for
      the same reason and must be restored, or deleted, together with its
      pre-tool sibling — a release path registered without its acquire path
      would report `not_owner` on every call.
    review_by: "2026-10-31"
    restoration:
      kind: "re_register"
      reenable_ticket: "OMN-17005"
      action: >
        Re-registered in the same change as hook_dispatch_claim_pretool.sh
        once OMN-17005's ACs hold, or deleted in the same change if OMN-17005
        closes won't-fix.

  - script: "pre_tool_use_bash_guard.sh"
    owner: "omniclaude hooks lane"
    reason: >
      The full bash guard bundles destructive-command HARD_BLOCK, --no-verify
      enforcement, `gh pr merge` method-mismatch blocking, SOFT_ALERT and
      CONTEXT_ADVISORY alongside the worktree check. OMN-14330 extracted the
      one control that had to come back (pre_tool_use_worktree_guard.sh) and
      left the rest under the OMN-13244 measurement baseline rather than
      re-enabling five behaviours in one config line.
    review_by: "2026-12-31"
    restoration:
      kind: "re_register"
      reenable_ticket: "OMN-13244"
      action: >
        Re-register only after each bundled behaviour has its own carve-out
        record and its own canary in this file. Registering it whole would
        re-enable four unmeasured controls to get one, which is the shape
        OMN-14330 deliberately refused.

  - script: "pre_tool_use_skill_substitution_guard.sh"
    owner: "omniclaude hooks lane"
    reason: >
      Skill-substitution machinery kept on disk by the OMN-13846 baseline lock
      so activating it is a one-line config add and an explicit operator
      decision, not a code restore. Its latency and usefulness were never
      measured, which is the measurement OMN-13244 exists to take.
    review_by: "2026-12-31"
    restoration:
      kind: "re_register"
      reenable_ticket: "OMN-13244"
      action: >
        Register in hooks.json and add an entry to expected_hooks with a
        canary, once the OMN-13244 measurement produces a verdict on it.

# ---------------------------------------------------------------------------
# Golden path — the behaviour this inventory is responsible for.
# ---------------------------------------------------------------------------
golden_path:
  - A hook is removed from hooks.json — validate_hook_inventory.py exits 1 with UNREGISTERED_EXPECTED naming the script, its ticket and its owner. This is the OMN-13244 direction, and before this file it produced no signal for 16 of 18 days.
  - A hook is added to hooks.json without a declaration here — exits 1 with UNDECLARED_REGISTRATION. An inventory that only catches removals rots by addition.
  - A matcher is widened or narrowed, or a registration is reordered within its event — exits 1 with MATCHER_MISMATCH / ORDER_MISMATCH. Order is behaviour: the OMN-17168 goal block must print after the bus mirror backgrounds its dispatch.
  - A declared disable's review_by date passes — exits 1 with DISABLE_REVIEW_LAPSED naming the owner, the re-enable ticket and the declared restoration action. The gate does not execute the restoration; no check can decide for OMN-17005 whether a per-lane claimant identity now exists. What it refuses is letting the disable outlive its own review date in silence.
  - A declared disable is registered anyway, or its script is deleted from disk — exits 1 with DISABLED_BUT_REGISTERED / DISABLED_SCRIPT_DELETED. Deleting a disabled hook is the expiry branch of its re-enable ticket, not a cleanup.
  - An enforcement hook is declared with no canary — exits 1 with ENFORCEMENT_WITHOUT_CANARY. `enforcement: true` is a claim about refusal; the OMN-8928 gate made that claim, returned a correct deny, and still exited 0.
  - A registered hook's ONEX_HOOKS_MASK bit is cleared on the operator Mac — session_start_hook_parity.sh prints MASKED_OFF at session start and exits 0. CI never reports on the mask: a runner has no ~/.omnibase/.env, and a check that passes because its input is absent is worse than no check.
  - The inventory is unreadable at session start — the bootstrap hook prints SKIPPED with the reason and exits 0, degrading to pre-OMN-17020 behaviour for one session instead of blocking a start. The merge gate is what keeps a malformed inventory off a machine.

dod_evidence:
  - kind: tests
    description: "Inventory schema, parity, and all four falsifiable directions"
    command: "uv run pytest tests/hooks/test_hook_inventory.py -v"
  - kind: tests
    description: "End-to-end canary against every registered enforcement hook"
    command: "uv run pytest tests/hooks/test_hook_disable_control_canary.py -v"
  - kind: ci
    description: "hook-inventory-gate runs on every PR touching the hook surface"
    command: "gh pr checks"
