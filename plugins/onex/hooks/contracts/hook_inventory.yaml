        # canary's target directory, since the stdin carries no explicit
        # `cwd`. Pointing OMNI_HOME at {repo_root} makes that directory the
        # registry clone from the guard's point of view, which is the
        # condition under test. It works in a worktree checkout and a plain
        # one alike: the registry test is an exact path comparison against
        # the resolved env value, not a test of the .git entry's type.
        OMNI_HOME: "{repo_root}"
      fixtures: {}
      expect:
        exit_code: 2
        stdout_contains:
          - '"decision": "block"'
          - "OMN-18798"
        stdout_absent: []

  - script: "pre_tool_use_pr_body_stamp_guard.sh"
    event: "PreToolUse"
    matcher: "Bash"
    order: 7
    ticket: "OMN-18335"
    owner: "omniclaude hooks lane"
    purpose: >
      Refuses a Bash command that REPLACES a pull request's description --
      gh pr edit --body / --body-file, or a REST PATCH of .../pulls/<n>
      carrying a body field -- when the replacement text omits a
      change-control evidence-source line the live description currently
      carries, and prints the dropped line verbatim so the remedy is one
      paste. Measured cause (mechanical ticket-closeout plan of record,
      section 2 correction 1): the description is a surface a lane overwrites
      wholesale, with no compare-and-swap, and it silently lost that line on
      four of the last five misses, twice after the pull request had already
      merged; one lost line makes every downstream reader conclude no
      evidence exists. By the time any CI job reads the body the line is
      already gone, so the tool seam is the only place the loss is observable
      before it happens. Reads are never gated and are not allowlisted --
      every shape names only body-REPLACING flags, so gh pr view --json body,
      gh pr list, a bare gh api read, gh pr comment --body and gh pr edit
      --add-label match nothing; the guard's own live read is gh pr view
      --json body, outside every shape, so it can never recurse into itself.
      The stamp pattern is config and is pinned byte-for-byte against
      EVIDENCE_SOURCE_RE in scripts/ci/check_occ_companion_merged.py, so the
      gate can never own a second spelling of the line. Sibling OMN-18334
      repairs the loss after the fact by re-asserting the line; the two are
      independent and neither claims the other's coverage. Registered LAST on
      the Bash matcher, after pre_tool_use_credential_rotation_guard.sh,
      which never inspects a pull-request body, so the two never contend for
      the same call.
    enforcement: true
    lite_mode_exit: false
    mask:
      # BORROWED BIT, recorded rather than left for a reader to infer. This
      # gate_call names a bit whose own script
      # (pre_tool_use_branch_protection_guard.sh) is on disk and UNREGISTERED
      # under the OMN-13244 baseline, and no other registered script gates on
      # it, so `onex hooks disable BRANCH_PROTECTION_GUARD` disables exactly
      # this guard and nothing else that is live. It is the faithful borrow
      # rather than an arbitrary one: the namesake is a PreToolUse Bash-matcher
      # guard over GitHub-mutating commands, and this guard refuses a
      # GitHub-mutating command that would destroy a protected line.
      #
      # A dedicated bit is unavailable: EnumHookBit lives in omnibase_core, all
      # 60 default-mask ordinals are allocated (60-62 are the
      # disabled-by-default trio, and knowledge-base-internal
      # reference/hook-bitmask-bit-governance.md rule 7 forbids ordinal 63
      # outright), so minting one is a cross-repo release chain plus an
      # architecture review. PRE_TOOL_AUTHORIZATION_SHIM and BASH_GUARD were
      # NOT candidates: each is already borrowed by a live guard, and two
      # independent controls behind one switch means disabling either silently
      # disables both.
      #
      # The borrow is only safe while the namesake stays unregistered, so
      # tests/hooks/test_pr_body_stamp_guard.py pins that: re-registering
      # pre_tool_use_branch_protection_guard.sh turns the suite red instead.
      gate_call: "BRANCH_PROTECTION_GUARD"
      bit_defined: true
    canary:
      kind: "block"
      stdin:
        tool_name: "Bash"
        tool_input:
          command: "gh pr edit 1 --repo OmniNode-ai/hook-inventory-canary --body-file /nonexistent/hook-inventory-canary.md"
      env: {}
      fixtures: {}
      expect:
        exit_code: 2
        stdout_contains:
          - '"decision": "block"'
          - "OMN-18335"
        stdout_absent: []

  - script: "pre_tool_use_prose_command_substitution_guard.sh"
    event: "PreToolUse"
    matcher: "Bash"
    order: 8
    ticket: "OMN-18750"
    owner: "omniclaude hooks lane"
    purpose: >
