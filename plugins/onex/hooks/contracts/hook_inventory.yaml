#
# hook_inventory.yaml — THE typed inventory of every hook this plugin is
# expected to register, and of every hook deliberately left dark (OMN-17020).
#
# ---------------------------------------------------------------------------
# Why this file exists
# ---------------------------------------------------------------------------
# OMN-13244 gutted `hooks.json` to `{}` for a measurement baseline. That change
# carried no expiry, no re-enable ticket, and — the part this file addresses —
# **no inventory of what went dark**. The consequence
# (`docs/tracking/2026-08-29-beta-off-the-rails-analysis.md`, root cause RC-B):
# `pre_tool_use_overseer_foreground_block.sh` sat on disk, unregistered, while
# the foreground rule it enforces was corrected by hand ~61 times over 16 of 18
# days. Nobody noticed, because nothing in the repo could answer the question
# "which hooks are supposed to be on?"
#
# OMN-17006 wrote the corrective rule (OWNER / REASON / EXPIRY / RESTORATION)
# into the `description` of `hooks.json` and asserted its presence with a test.
# That fixes the ONE disable it addressed. This file generalises it: the rule
# becomes a typed record per disable, and "which hooks are supposed to be on"
# becomes a declaration a merge gate can fail on.
#
# ---------------------------------------------------------------------------
# What is checked, and where
# ---------------------------------------------------------------------------
# `plugins/onex/hooks/lib/hook_inventory.py` computes parity between three
# surfaces — this file, `hooks.json`, and the scripts on disk — and is driven
# from two entry points:
#
#   * `scripts/validation/validate_hook_inventory.py` (CI, `hook-inventory-gate`)
#     Static. Fails CLOSED on any drift: an expected hook that is no longer
#     registered, a registration nobody declared, a matcher or ordering change,
#     a script deleted from disk, a disable whose review date has passed.
#
#   * `plugins/onex/hooks/scripts/session_start_hook_parity.sh` (session bootstrap)
#     Same parity, plus the live `ONEX_HOOKS_MASK` surface, and **warns only**.
#     It always exits 0: a hook-manifest mismatch must never make the machine
#     unusable. Blocking session start on an inventory disagreement would be a
#     larger outage than the one it reports.
#
# ---------------------------------------------------------------------------
# The second disable surface: ONEX_HOOKS_MASK
# ---------------------------------------------------------------------------
# `hooks.json` is not the only way a hook goes dark. Most guards call
# `onex_hook_gate <BIT>` (see `plugins/onex/hooks/lib/hook_bits.sh`), and a bit
# cleared in `ONEX_HOOKS_MASK` — which `common.sh` re-reads from
# `~/.omnibase/.env` under `set -a`, so it beats the caller's environment —
# turns a fully registered hook into a no-op with no repo-visible signal.
#
# That is not hypothetical. Building this file found `WORKTREE_GUARD`
# (`0x800000000000000`) absent from the operator Mac's live mask
# `0x3ffffeffffffffe`, i.e. `pre_tool_use_worktree_guard.sh` is registered under
# the OMN-14330 carve-out and dark in practice — the RC-B shape again, one
# surface over. So each entry declares its `mask.gate_call` and whether that
# name is actually defined in `hook_bits.sh` (`mask.bit_defined`), both
# machine-checked. A `gate_call` naming an undefined bit is a gate that can
# never fire: `hook_bits_bit_for_name` returns non-zero, `onex_hook_gate`
# returns 0, and the hook runs unconditionally. Four registered hooks are in
# that state today; they are recorded as `bit_defined: false` rather than
# quietly rounded to "ungated", because the difference is exactly the kind of
# fact this inventory exists to hold.
#
# The mask is a per-machine environment fact, so it is reported by the session
# bootstrap check and never by CI — a runner has no `~/.omnibase/.env`, and a
# check that passes because its input is absent is worse than no check (the
# same boundary `validate_hook_edge_lane.py --live` draws).
#
# ---------------------------------------------------------------------------
# The third disable surface: OMNICLAUDE_MODE (and it defaults to OFF)
# ---------------------------------------------------------------------------
# `plugins/onex/lib/mode.sh` resolves "lite" for any cwd outside
# omni_home/omni_worktrees with no local `omnibase_core` — i.e. lite is the
# DEFAULT on a CI runner and in every external repo — and nine registered hooks
# exit 0 silently under it. Three of those nine are ENFORCEMENT guards: the
# Done-flip gate, the lane-liveness guard, and the Bash secret-redaction guard.
# A lite-mode session has none of them and nothing says so.
#
# This was found the hard way while building this file: three canaries passed
# on the operator Mac (a worktree under omni_worktrees resolves to full) and
# failed on the CI runner with `exit 0` and empty output. So each entry declares
# `lite_mode_exit`, machine-checked against the script's early-exit COMPARISON
# (`"$(omniclaude_mode)" == "lite"`) rather than a bare mention of the function
# — `session_start_hook_parity.sh` calls it to REPORT the mode and must not be
# counted as exiting on it. Like the mask, it is a per-session fact: the
# bootstrap check reports DARK_IN_LITE_MODE, CI never does, and the canary
# harness pins OMNICLAUDE_MODE=full so it tests the hook rather than the host.
#
# ---------------------------------------------------------------------------
# Maintenance
# ---------------------------------------------------------------------------
# The mechanical half of `expected_hooks` (script / event / matcher / order) is
# generated from the live `hooks.json`, which is why this file starts green:
#
#   python scripts/validation/validate_hook_inventory.py --generate
#
# The semantic half (owner, ticket, purpose, enforcement, canary) is authored.
# Adding a registration to `hooks.json` without adding it here fails the gate,
# by design: an undeclared hook is how an inventory rots.
#
# verified: 2026-08-30 — every `canary:` block below was executed end to end
# against the script named in the same entry, in the worktree, via the runner in
# `tests/hooks/test_hook_disable_control_canary.py`.
---
schema_version: "1.0.0"
name: hook_inventory
ticket_id: "OMN-17020"
summary: >
  Typed inventory of every hook expected to be registered by this plugin, and
  of every hook deliberately left unregistered. Parity between this file,
  hooks.json and the scripts on disk is a merge gate (fail closed) and a
  session-bootstrap warning (never blocking).

hooks_json: "plugins/onex/hooks/hooks.json"
scripts_dir: "plugins/onex/hooks/scripts"
hook_bits: "plugins/onex/hooks/lib/hook_bits.sh"

# ---------------------------------------------------------------------------
# expected_hooks — every registration hooks.json MUST carry, in order.
# ---------------------------------------------------------------------------
# `order` is the flat index of the command within its event class, counting
# across matcher groups. It is pinned because order is behaviour: the OMN-17168
# goal surface must print AFTER the bus mirror backgrounds its dispatch, so the
# goal block is the last thing in the session's opening context.
#
# `enforcement: true` means the hook can REFUSE or REWRITE a tool call. Every
# such hook MUST carry a `canary:` block — an end-to-end negative test run
# against the registered script itself. `enforcement: false` means the hook can
# only observe; it MUST carry a `no_canary_reason` or a `pass_through` canary
# proving it never refuses.
expected_hooks:
  - script: "pre_tool_use_done_flip_guard.sh"
    event: "PreToolUse"
    matcher: "^mcp__linear-server__(save_issue|update_issue)$"
    order: 0
    ticket: "OMN-13856"
    owner: "omniclaude hooks lane"
    purpose: >
      Refuses a Linear flip to Done when the ticket carries no merged-PR
      citation and no PASS node_dod_verify receipt on OCC main. Fail-closed:
      no fake Done.
    enforcement: true
    lite_mode_exit: true
    mask:
      gate_call: "DONE_FLIP_GUARD"
      bit_defined: false
    canary:
      kind: "block"
      stdin:
        tool_name: "mcp__linear-server__save_issue"
        tool_input:
          id: "OMN-99999"
          state: "Done"
      env: {}
      fixtures: {}
      expect:
        exit_code: 2
        stdout_contains:
          - '"decision": "block"'
          - "no_durable_evidence"
        stdout_absent: []

  - script: "pre_tool_use_ticket_creation_gate.sh"
    event: "PreToolUse"
    matcher: "^mcp__linear-server__(save_issue|update_issue)$"
    order: 1
    ticket: "OMN-17942"
    owner: "omniclaude hooks lane"
    purpose: >
      Refuses a Linear issue CREATE (save_issue with no id) that is not bound
      to a commitment: no parentId and no epic declaration, no project, no
      "Gate:" binding line, or a residual-shaped title with no
      live-gate-defect binding. An UPDATE (save_issue with an id) is never
      gated -- gating it would block every state flip and parent re-link the
      OMN-16729 board-truth work depends on. Measured cause: 1553 tickets
      created in the fourteen days to 2026-09-04 against ~35/day closed, 1537
      of them under the single API identity every lane writes as. The
      unstarted-children cap that OMN-18323 added as rule 8 was RESCINDED by
      the operator on 2026-09-21 (rolling work ledger RULING row
      2026-09-21T14:46:45Z item (f)) and is gone; nothing here caps how many
      children a parent may carry. Registered
      AFTER pre_tool_use_done_flip_guard.sh on the same matcher, which only
      ever inspects updates, so the two never contend for the same call.

      OMN-18331 adds two rules over the description's acceptance criteria.
      Rule 6: every criterion listed under an acceptance-criteria heading
      carries a NAMED FALSIFIER -- the check that would settle it -- written
      as part of the criterion, canonically "-- falsifier: <check name or
      command shape>". A create with an unfalsified criterion is refused and
      the refusal quotes that criterion. Rule 7: a behaviour-shaped criterion
      may not name a merge-state read as its falsifier, because a merged pull
      request says a change landed and not that the behaviour happens; a
      falsifier carrying BOTH a merge read and a test runner is admitted,
      which is OMN-18135's measured finding about the one form that satisfies
      receipt hardening and the proof-class rule at once.

      Both rules fire on CREATE only, so history is untouched, and rule 6
      fires only on a description carrying a recognised criteria heading --
      a stated fail-OPEN direction, bounded to rule 6, recorded in the guard's
      module docstring and the policy file rather than left to be inferred.
      The classification vocabulary is transcribed from the OMN-18135 proof-
      class classifier with its source revision pinned in the policy file's
      proof_class_source block, and a drift test fails on either divergence.
      There is no exemption key and no opt-in flag for either rule.

      The guard also EXPORTS the parse the rules run on: criterion_units()
      returns one unit per criterion carrying its label, its canonical text,
      its falsifier and the SHA-256 of that text. A later mechanism pins an
      accepted binding to that hash, so the unit has to be independently
      hashable -- editing one criterion leaves every other criterion's hash
      byte-identical -- and it is exported rather than re-derived so the gate
      and the transcriber cannot disagree about where one criterion ends. The
      canonical form is Unicode NFC plus whitespace collapse and nothing else,
      and the falsifier is inside the hash; both choices and their reasons are
      recorded in the policy file's hashing-unit comment.
    enforcement: true
    lite_mode_exit: false
    mask:
      # BORROWED BIT, recorded rather than left for a reader to infer. This
      # gate_call names a bit whose own script (pre_tool_use_linear_done_verify.sh)
      # is on disk and UNREGISTERED under the OMN-13244 baseline -- its
      # merged-PR semantics were folded into pre_tool_use_done_flip_guard.sh by
      # OMN-13856 -- so `onex hooks disable LINEAR_DONE_VERIFY` disables exactly
      # this guard and nothing else that is live. A dedicated bit is
      # unavailable: EnumHookBit lives in omnibase_core, all 60 default-mask
      # ordinals are allocated, 60-62 are the disabled-by-default trio, and
      # knowledge-base-internal reference/hook-bitmask-bit-governance.md rule 7
      # forbids ordinal 63 (the sign bit of a signed 64-bit integer) outright.
      # Same constraint, same resolution pre_tool_use_agent_model_guard.sh
      # recorded for PRE_TOOL_AGENT_DISPATCH_GATE.
      #
      # The sibling on this same matcher was NOT a candidate: it calls
      # onex_hook_gate DONE_FLIP_GUARD, a name hook_bits.sh does not define, so
      # that gate can never fire and its bit is not a switch at all. Borrowing
      # it would have shipped a guard with no working disable.
      #
      # The borrow is only safe while the namesake stays unregistered, so
      # tests/hooks/test_ticket_creation_guard.py pins that: re-registering
      # pre_tool_use_linear_done_verify.sh would silently put two controls
      # behind one switch, and turns the suite red instead.
      gate_call: "LINEAR_DONE_VERIFY"
      bit_defined: true
    canary:
      kind: "block"
      stdin:
        tool_name: "mcp__linear-server__save_issue"
        tool_input:
          team: "Omninode"
          title: "hook-inventory canary"
      env: {}
      fixtures: {}
      expect:
        exit_code: 2
        stdout_contains:
          - '"decision": "block"'
          - "not bound to a commitment"
        stdout_absent: []

  - script: "pre_tool_use_worktree_guard.sh"
    event: "PreToolUse"
    matcher: "Bash"
    order: 2
    ticket: "OMN-14330"
    owner: "omniclaude hooks lane"
    purpose: >
      OMN-7018 canonical-root enforcement, extracted to a minimal script:
      blocks `git worktree add` targeting anything outside
      $OMNI_HOME/omni_worktrees.
    enforcement: true
    lite_mode_exit: false
    mask:
      gate_call: "WORKTREE_GUARD"
      bit_defined: true
    canary:
      kind: "block"
      stdin:
        tool_name: "Bash"
        tool_input:
          command: "git worktree add /tmp/onex-canary-outside-root -b canary"
      env:
        OMNI_HOME: "{repo_root}"
      fixtures: {}
      expect:
        exit_code: 2
        stdout_contains:
          - '"decision": "block"'
          - "must be created under"
        stdout_absent: []

  - script: "pre_tool_use_pr_ownership_guard.sh"
    event: "PreToolUse"
    matcher: "Bash"
    order: 3
    ticket: "OMN-16485"
    owner: "omniclaude hooks lane"
    purpose: >
      Refuses a cross-lane or unattributable GitHub mutation (`gh pr
      close/reopen`, `gh run cancel`, `gh workflow run`, `gh api`). Ownership
      that cannot be established fails closed.
    enforcement: true
    lite_mode_exit: false
    mask:
      gate_call: "BASH_GUARD"
      bit_defined: true
    canary:
      kind: "block"
      stdin:
        tool_name: "Bash"
        tool_input:
          command: "gh pr close 999999 --repo OmniNode-ai/omniclaude"
      env: {}
      fixtures: {}
      expect:
        exit_code: 2
        stdout_contains:
          - '"decision": "block"'
          - "REFUSED"
        stdout_absent: []

  - script: "pre_tool_use_credential_rotation_guard.sh"
    event: "PreToolUse"
    matcher: "Bash"
    order: 4
    ticket: "OMN-17957"
    owner: "omniclaude hooks lane"
    purpose: >
      Refuses a Bash command that rotates, re-issues or revokes a credential
      unless it carries "ROTATION-CONSENT: docs/tracking/ROLLING_WORK_LEDGER.md:
      <line>" resolving to an OPERATOR-CONSENT row (omni_home CLAUDE.md rule 18,
      extended by rule 22 with approved_by=<operator|jake>) whose APPROVED SCOPE
      names the credential and which carries a non-empty OUT OF SCOPE list.
      Operator ruling 2026-09-05: a value in a local transcript, log, scratch
      file or ledger is NOT exposure; rotation is for real exposure only, with
      the exposure path recorded first, approved by the operator or Jake and by
      nobody else, and every consumer enumerated and restarted in the same
      action. Measured cause: the 2026-08-30 rotation of the Infisical
      operator-k8s org-admin client secret, taken on an internal scope finding
      with no claim the value had left the machine, restarted the three
      application Deployments but not the Infisical operator itself and froze
      managed secret sync cluster-wide for five days. Reads are never gated and
      are not allowlisted -- every configured shape names only mutating
      subcommands, so get/describe/list, -o name, get-secret-value, gh secret
      list and kcadm get match nothing; kubectl rollout restart is outside the
      vocabulary deliberately, because it is the consumer-restart half of the
      remedy the ruling requires. Registered AFTER
      pre_tool_use_pr_ownership_guard.sh on the same matcher, which never
      inspects a credential shape, so the two never contend for the same call.
    enforcement: true
    lite_mode_exit: false
    mask:
      # BORROWED BIT, recorded rather than left for a reader to infer. This
      # gate_call names a bit whose own script (pre_tool_use_authorization_shim.sh)
      # is on disk and UNREGISTERED under the OMN-13244 baseline, and no other
      # registered script gates on it, so `onex hooks disable
      # PRE_TOOL_AUTHORIZATION_SHIM` disables exactly this guard and nothing
      # else that is live. It is the faithful borrow rather than an arbitrary
      # one: the namesake is this plugin's PreToolUse AUTHORIZATION gate, and
      # this guard refuses an action for want of an authorization record.
      #
      # A dedicated bit is unavailable: EnumHookBit lives in omnibase_core, all
      # 60 default-mask ordinals are allocated, 60-62 are the disabled-by-default
      # trio, and knowledge-base-internal reference/hook-bitmask-bit-governance.md
      # rule 7 forbids ordinal 63 (the sign bit of a signed 64-bit integer)
      # outright. Same constraint, same resolution
      # pre_tool_use_pr_ownership_guard.sh recorded for BASH_GUARD and
      # pre_tool_use_ticket_creation_gate.sh recorded for LINEAR_DONE_VERIFY.
      #
      # BASH_GUARD was NOT a candidate even though this is a Bash-matcher guard:
      # pre_tool_use_pr_ownership_guard.sh already borrows it, and putting two
      # independent controls behind one switch means disabling either one
      # silently disables both.
      #
      # The borrow is only safe while the namesake stays unregistered, so
      # tests/hooks/test_credential_rotation_guard.py pins that: re-registering
      # pre_tool_use_authorization_shim.sh turns the suite red instead.
      gate_call: "PRE_TOOL_AUTHORIZATION_SHIM"
      bit_defined: true
    canary:
      kind: "block"
      stdin:
        tool_name: "Bash"
        tool_input:
          command: "aws secretsmanager rotate-secret --secret-id hook-inventory-canary"
      env: {}
      fixtures: {}
      expect:
        exit_code: 2
        stdout_contains:
          - '"decision": "block"'
          - "ROTATION-CONSENT"
        stdout_absent: []

  - script: "pre_tool_use_git_stash_guard.sh"
    event: "PreToolUse"
    matcher: "Bash"
    order: 5
    ticket: "OMN-17334"
    owner: "omniclaude hooks lane"
    purpose: >
      Refuses a Bash command that mutates the git stash (`push`, `pop`,
      `apply`, `drop`, `save`, `clear`, `store`, `branch`, or a bare
      `git stash`) when the command's cwd or `-C <path>` target resolves to a
      git WORKTREE (`.git` is a file pointing at the parent clone's real git
      directory) or a canonical clone directly under `$OMNI_HOME`, shared by
      every concurrent lane. git's stash is one repo-wide stack, so a scoped
      `git stash push -- <path>` on a tree with no changes to that path
      silently creates NO entry and still exits 0, and the paired
      `git stash pop` then pops whatever is at stash@{0} -- another lane's
      work. Measured six times by 2026-09-16 across omnibase_infra and
      omnimarket (rolling work ledger rows on 2026-09-15T03:10Z,
      2026-09-15T23:23Z and 2026-09-16T01:38Z), twice destroying a peer
      lane's uncommitted work outright. Reads (`git stash list`,
      `git stash show`) are never gated and are not allowlisted -- they
      simply match no shape, because the policy's mutating-subcommand
      vocabulary never names them; a stash mutation in an ordinary git clone
      that is neither a worktree nor a canonical clone under `$OMNI_HOME` is likewise
      outside both conditions and is never gated, since that lane owns the
      whole stash stack alone. There is deliberately no consent-citation
      escape hatch: the safe alternative (`git checkout origin/dev --
      <path>` then `git checkout HEAD -- <path>`, scoped to named paths)
      never touches the shared stash ref, so nothing legitimate needs an
      exception. The shared-tree half of this hazard -- two concurrent lanes
      racing push/pop inside the SAME canonical clone -- is OMN-18433 and is
      deliberately untouched here. Registered AFTER
      pre_tool_use_credential_rotation_guard.sh on the same matcher, which
      never inspects a stash shape, so the two never contend for the same
      call.
    enforcement: true
    lite_mode_exit: false
    mask:
      # BORROWED BIT, recorded rather than left for a reader to infer, same
      # pattern as pre_tool_use_credential_rotation_guard.sh's
      # PRE_TOOL_AUTHORIZATION_SHIM borrow. A dedicated bit is unavailable:
      # all 60 default-mask ordinals in hook_bits.sh are allocated, 60-62 are
      # the disabled-by-default trio, and bit-governance rule 7 forbids
      # ordinal 63 outright.
      #
      # SWEEP_PREFLIGHT was chosen over SKILL_SUBSTITUTION_GUARD (also
      # unregistered, also otherwise uncontested) because SWEEP_PREFLIGHT is
      # `bit_defined: true` in hook_bits.sh and SKILL_SUBSTITUTION_GUARD is
      # not -- a gate_call naming an undefined bit can never actually fire,
      # since `hook_bits_bit_for_name` returns non-zero for it and
      # `onex_hook_gate` then returns 0 unconditionally. SWEEP_PREFLIGHT's
      # own namesake script (pre_tool_use_sweep_preflight.sh) is on disk and
      # UNREGISTERED, and no other registered script gates on it, so
      # `onex hooks disable SWEEP_PREFLIGHT` disables exactly this guard and
      # nothing else that is live.
      #
      # tests/hooks/test_git_stash_guard.py pins the borrow: registering
      # pre_tool_use_sweep_preflight.sh would silently share the switch
      # between two independent controls.
      gate_call: "SWEEP_PREFLIGHT"
      bit_defined: true
    canary:
      kind: "block"
      stdin:
        tool_name: "Bash"
        tool_input:
          command: "git stash pop"
      env:
        # CLAUDE_PROJECT_DIR (set by _prepare to {repo_root}) is this canary's
        # target directory, since the stdin carries no explicit `cwd`. In a
        # worktree checkout {repo_root}'s own .git is already a FILE, so the
        # WORKTREE branch fires regardless of OMNI_HOME. In a plain checkout
        # (CI, and any non-worktree clone) .git is a directory, so this sets
        # OMNI_HOME to {repo_root}'s PARENT -- satisfying the canonical-clone
        # branch instead. Both branches block, so this value exercises
        # whichever one applies without needing to know which.
        OMNI_HOME: "{repo_root}/.."
      fixtures: {}
      expect:
        exit_code: 2
        stdout_contains:
          - '"decision": "block"'
          - "OMN-17334"
        stdout_absent: []

  - script: "pre_tool_use_shared_tree_git_guard.sh"
    event: "PreToolUse"
    matcher: "Bash"
    order: 6
    ticket: "OMN-18798"
    owner: "omniclaude hooks lane"
    purpose: >
      Refuses a Bash command that moves the SHARED registry clone at
      $OMNI_HOME out from under the lanes working in it -- `git reset`, a
      non-path-scoped `git checkout`, `git checkout -b`/`-B`, `git switch`,
      `git clean`, `git rebase`, a `git merge` that is not `--ff-only`, and a
      `git branch` delete or rename whose
      target is the checked-out branch -- when the command's effective git
      root (its `-C <path>` argument, or its own cwd) IS that registry clone.
      The registry clone at $OMNI_HOME is the one repository where many
      concurrent agent lanes commit into the same working tree; code repos use per-ticket worktrees
      and do not have this problem. Two measured classes, neither of which
      any pre-commit hook or CI job can see, because both are commands typed
      in a session: DESTRUCTION -- 20 `reset: moving to origin/main` reflog
      entries in that clone on 2026-09-18 alone, twice re-orphaning a staged
      1.9 MB ledger-roll archive of 1,258 append-only coordination rows
      (untracked on one disk, in no commit, on no branch, on no remote, for
      2h22m, where a `git clean -fd` would have destroyed them) and twice
      dropping a peer lane's unpushed commit from local main; and STRANDING,
      which destroys nothing and is quieter -- a feature branch checked out
      in the shared clone makes commit_lock.py refuse EVERY other lane's
      ledger commit with exit 78, STRANDED CLONE, for as long as it stays
      checked out, the only signal being an exit code on somebody else's
      terminal. Operating Rule 19 states the prohibition and was doctrine
      only until this guard. Scope is narrow deliberately: the guard fires
      ONLY when the effective git root is the registry clone ITSELF. A
      worktree under omni_worktrees/ has its own .git file and so its own
      root, and a code-repo canonical clone under $OMNI_HOME has root
      $OMNI_HOME/<repo>; neither is matched, and both already carry the
      OMN-7018/OMN-14330 worktree guard. Inside the registry clone,
      everything not in the declared refused vocabulary passes untouched --
      `git merge --ff-only` (which advances a pointer or refuses, so it can
      never resolve a peer lane's rows away, unlike the ort merge measured
      at 14:52:55Z on 2026-09-19), `git merge --abort`/`--quit`/`--continue`
      (refusing those would strand the tree mid-conflict), `git fetch`,
      `git pull --ff-only`, the Operating Rule 17 path-scoped restore recipe
      (`git checkout <ref> -- <path>`), and every read. There is deliberately
      no consent-citation escape hatch: every refused verb has a sanctioned
      alternative reaching the same outcome without touching state a peer
      lane owns. Registered AFTER pre_tool_use_git_stash_guard.sh on the same
      matcher, which only ever inspects stash shapes and this one never does,
      so the two can never contend for the same call.
    enforcement: true
    lite_mode_exit: false
    mask:
      # BORROWED BIT, recorded rather than left for a reader to infer, the
      # same pattern as pre_tool_use_git_stash_guard.sh's SWEEP_PREFLIGHT
      # borrow and pre_tool_use_credential_rotation_guard.sh's
      # PRE_TOOL_AUTHORIZATION_SHIM borrow. A dedicated bit is unavailable:
      # hook_bits.sh is GENERATED from omnibase_core's hook_activations.yaml,
      # all 60 default-mask ordinals are allocated, 60-62 are the
      # disabled-by-default trio, and bit-governance rule 7 forbids ordinal
      # 63 outright.
      #
      # SCOPE_GATE is `bit_defined: true` in hook_bits.sh and is set in
      # HOOK_BITS_DEFAULT_MASK, so a gate_call naming it can actually fire --
      # unlike SKILL_SUBSTITUTION_GUARD, which is not bit_defined and whose
      # gate_call therefore returns 0 unconditionally. Its own namesake
      # script (pre_tool_use_scope_gate.sh) is on disk and UNREGISTERED, and
      # no other registered script gates on it, so
      # `onex hooks disable SCOPE_GATE` disables exactly this guard and
      # nothing else that is live.
      #
      # tests/hooks/test_shared_tree_git_guard.py pins the borrow:
      # registering pre_tool_use_scope_gate.sh would silently share the
      # switch between two independent controls.
