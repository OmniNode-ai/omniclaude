# ---------------------------------------------------------------------------
# disabled_hooks — every script deliberately on disk and NOT registered.
# ---------------------------------------------------------------------------
# This is the half OMN-13244 never wrote down. Each entry carries the four
# fields OMN-17006 made a standing rule, now typed and machine-checked rather
# than a sentence in a description:
#
#   owner        — the person or lane accountable for restoring it
#   reason       — why THIS hook is off, not merely that it is
#   review_by    — an absolute date. When it passes, the gate FAILS and names
#                  the entry. This is what OMN-13244 lacked; a disable with no
#                  date is indistinguishable from a decision.
#   restoration  — what puts it back: a typed kind, a re-enable ticket, and
#                  the action. `re_register` additionally requires the script
#                  to still be on disk, so the restoration it names is
#                  actually a one-line config add and not a rewrite.
#
# The gate also refuses a disabled entry that IS registered — a contradiction
# between the two halves of this file is drift, not a preference.
  - script: "post_tool_use_output_capture_metadata.sh"
