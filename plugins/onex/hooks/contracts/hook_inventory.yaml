disabled_hooks:
  - script: "hook_dispatch_claim_pretool.sh"
    owner: "omniclaude hooks lane"
    reason: >
      Probed 2026-08-29 with four independent defects, any one of which makes
      re-registration unsafe: its `exit 2` is converted to `exit 0` by the
      error-guard EXIT trap because it never calls `trap - EXIT`; its deny
      payload uses a {"type":"permissionDenied"} shape this harness does not
      honour; AGENT_ID falls back to the shared constant `session` so two
      anonymous lanes are the same claimant and never collide; and the lease
      is a fixed non-renewable 300s whose expiry deletes the claim file
      instead of recording CLAIM_EXPIRED.
    review_by: "2026-10-31"
    restoration:
      kind: "re_register"
      reenable_ticket: "OMN-17005"
      action: >
        OMN-17005 ACs 1-8 all hold with individual live probes — renewable
        leases, fencing tokens, a real per-lane claimant identity, durable
        CLAIM_EXPIRED evidence, and the A17 canary in this file proving the
        registered hook actually refuses — then re-register the pair in one
        change. No partial re-registration. If AC3 (per-lane identity) cannot
        be produced, OMN-17005 closes won't-fix and this entry converts to
        kind delete; a guard that cannot identify a lane is not a guard.

  - script: "hook_dispatch_claim_posttool.sh"
    owner: "omniclaude hooks lane"
    reason: >
      The release half of the same OMN-8928/8929 pair. It is unregistered for
      the same reason and must be restored, or deleted, together with its
      pre-tool sibling — a release path registered without its acquire path
      would report `not_owner` on every call.
    review_by: "2026-10-31"
    restoration:
      kind: "re_register"
      reenable_ticket: "OMN-17005"
      action: >
        Re-registered in the same change as hook_dispatch_claim_pretool.sh
        once OMN-17005's ACs hold, or deleted in the same change if OMN-17005
        closes won't-fix.

  - script: "pre_tool_use_bash_guard.sh"
    owner: "omniclaude hooks lane"
    reason: >
      The full bash guard bundles destructive-command HARD_BLOCK, --no-verify
      enforcement, `gh pr merge` method-mismatch blocking, SOFT_ALERT and
      CONTEXT_ADVISORY alongside the worktree check. OMN-14330 extracted the
      one control that had to come back (pre_tool_use_worktree_guard.sh) and
      left the rest under the OMN-13244 measurement baseline rather than
      re-enabling five behaviours in one config line.
    review_by: "2026-12-31"
    restoration:
      kind: "re_register"
      reenable_ticket: "OMN-13244"
      action: >
        Re-register only after each bundled behaviour has its own carve-out
        record and its own canary in this file. Registering it whole would
        re-enable four unmeasured controls to get one, which is the shape
        OMN-14330 deliberately refused.

  - script: "pre_tool_use_skill_substitution_guard.sh"
    owner: "omniclaude hooks lane"
    reason: >
      Skill-substitution machinery kept on disk by the OMN-13846 baseline lock
      so activating it is a one-line config add and an explicit operator
      decision, not a code restore. Its latency and usefulness were never
      measured, which is the measurement OMN-13244 exists to take.
    review_by: "2026-12-31"
    restoration:
      kind: "re_register"
      reenable_ticket: "OMN-13244"
      action: >
        Register in hooks.json and add an entry to expected_hooks with a
        canary, once the OMN-13244 measurement produces a verdict on it.

# ---------------------------------------------------------------------------
# Golden path — the behaviour this inventory is responsible for.
# ---------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # OMN-18531 verdicts -- the OMN-18530 triage placeholders, each replaced
  # -------------------------------------------------------------------------
  # The gate matched 34 gate-shaped scripts on disk and named in neither half
  # of this file (OMN-18530). OMN-18531 ran the two controls on each, by
  # ABSOLUTE path in a sandbox with OMNICLAUDE_MODE=full (a relative path
  # crashes in the shared prologue and reads as a pass; lite mode exits 0
  # silently), and recorded the result in each `reason`.
  #
  # Tally: no script registered (none passed both controls AND was safe to
  # register); 1 deleted in the same change (pre_tool_use_hostile_review_gate.sh:
  # an unconditional OMN-10111 bypass before any decision code, no evidence
  # writer, and the required "Hostile Review Gate" CI check enforces the rule);
  # 2 declared `delete` with the execution dated (a live registered surface
  # enforces a superset, but the test footprint is separate work); the rest are
  # declared dark with the defect that blocks registration. Nothing was deleted
  # for absence of signal alone. Wrapper and implementation pairs carry one
  # verdict (stop_quality_gate.sh/.py, skip_token_surface_guard.sh and its
  # SubagentStop wrapper). ensure-plugin-venv.sh is a manual build script, not a
  # gate. `review_by` is the date this gate stops accepting "not yet".
  # Ordered by filename.

  - script: "ensure-plugin-venv.sh"
    owner: "omniclaude hooks lane"
    reason: >
      Not a gate. Its header says it is invoked manually and NOT registered in
      hooks.json; scripts/repair-plugin-venv.sh and
      plugins/onex/skills/onboarding/SKILL.md run it, and common.sh
      find_python() resolves the venv it builds. The `exit 2` at line 95 is
      the usage error for an unknown argument, not a refusal of a tool call.
      Probed by absolute path: it exits 1 on a benign Read payload (it needs
      CLAUDE_PLUGIN_DATA), so it fails the non-violation control and has no
      violation control to run. Deleting it would break its three callers.
    review_by: "2026-12-31"
    restoration:
      kind: "re_register"
      reenable_ticket: "OMN-10500"
      action: >
        Stays dark by design. No re-registration: it is a build script. The
