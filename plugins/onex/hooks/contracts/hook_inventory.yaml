golden_path:
  - A hook is removed from hooks.json — validate_hook_inventory.py exits 1 with UNREGISTERED_EXPECTED naming the script, its ticket and its owner. This is the OMN-13244 direction, and before this file it produced no signal for 16 of 18 days.
  - A hook is added to hooks.json without a declaration here — exits 1 with UNDECLARED_REGISTRATION. An inventory that only catches removals rots by addition.
  - A matcher is widened or narrowed, or a registration is reordered within its event — exits 1 with MATCHER_MISMATCH / ORDER_MISMATCH. Order is behaviour: the OMN-17168 goal block must print after the bus mirror backgrounds its dispatch.
  - A declared disable's review_by date passes — exits 1 with DISABLE_REVIEW_LAPSED naming the owner, the re-enable ticket and the declared restoration action. The gate does not execute the restoration; no check can decide for OMN-17005 whether a per-lane claimant identity now exists. What it refuses is letting the disable outlive its own review date in silence.
  - A declared disable is registered anyway, or its script is deleted from disk — exits 1 with DISABLED_BUT_REGISTERED / DISABLED_SCRIPT_DELETED. Deleting a disabled hook is the expiry branch of its re-enable ticket, not a cleanup.
  - An enforcement hook is declared with no canary — exits 1 with ENFORCEMENT_WITHOUT_CANARY. `enforcement: true` is a claim about refusal; the OMN-8928 gate made that claim, returned a correct deny, and still exited 0.
  - A registered hook's ONEX_HOOKS_MASK bit is cleared on the operator Mac — session_start_hook_parity.sh prints MASKED_OFF at session start and exits 0. CI never reports on the mask: a runner has no ~/.omnibase/.env, and a check that passes because its input is absent is worse than no check.
  - The inventory is unreadable at session start — the bootstrap hook prints SKIPPED with the reason and exits 0, degrading to pre-OMN-17020 behaviour for one session instead of blocking a start. The merge gate is what keeps a malformed inventory off a machine.
  - A gate-shaped script is added to plugins/onex/hooks/scripts and declared in neither half of this file — exits 1 with UNDECLARED_GATE_SCRIPT naming the file (OMN-18530). This is the third parity direction, and before it 34 scripts that can refuse a tool call sat on disk owned by nobody. A library a registered hook calls is NOT reported: reachability from a registered root is what separates an undeclared gate from a called module.
  - An expected hook declares an event hooks.json has no key for — exits 1 with EVENT_KEY_ABSENT naming the key (OMN-18530). UNREGISTERED_EXPECTED already fires and says "re-register it", which reads as a one-line addition to a group that does not exist. hooks.json carries no Stop key today, so a Stop row written without the group is a registration that never runs.

dod_evidence:
  - kind: tests
    description: "Inventory schema, parity, and all four falsifiable directions"
    command: "uv run pytest tests/hooks/test_hook_inventory.py -v"
  - kind: tests
    description: "End-to-end canary against every registered enforcement hook"
    command: "uv run pytest tests/hooks/test_hook_disable_control_canary.py -v"
  - kind: ci
    description: "hook-inventory-gate runs on every PR touching the hook surface"
    command: "gh pr checks"
  - kind: tests
    description: "The third parity direction: a gate-shaped script declared nowhere, and the reachability control that keeps a called module out of it"
    command: "uv run pytest tests/hooks/test_hook_inventory_undeclared_gate.py -v"
