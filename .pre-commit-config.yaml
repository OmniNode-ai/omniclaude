---
# OmniClaude Pre-commit Configuration
# Two-stage validation strategy for optimal developer experience
#
# PERFORMANCE OPTIMIZATION (2026-01):
# ====================================
# Two-stage validation strategy matching omnibase_core patterns:
#
# PRE-COMMIT (target: <15 seconds):
#   - Formatting (ruff format/fix)
#   - Basic file checks (whitespace, large files, merge conflicts)
#   - Quick structural validations
#   - Clean output directory
#
# PRE-PUSH (thorough checks before sharing):
#   - Security checks (bandit, secret detection)
#   - mypy type checking
#   - ONEX validation
#   - Clean root validation
#
# USAGE:
#   pre-commit install                         # Install pre-commit hooks
#   pre-commit install --hook-type pre-push    # Install pre-push hooks
#   pre-commit run --all-files                 # Run all pre-commit hooks
#   pre-commit run --all-files --hook-stage pre-push  # Run pre-push hooks

repos:
  # OMN-14655 (SHA reconciliation, D1f/§3d.8): converged from two separate
  # omnibase_core repo: blocks pinned at DIFFERENT revs (458f44e for
  # check-stub-implementations, 63635097 for no-noncanonical-lifecycle-classes)
  # into one block at 63635097705d832e0ee9c4811093efb31349105c -- the SAME
  # SHA ci.yml:3102 pins for the canonical `omnibase-core @ git+...` ratchet
  # (`no-noncanonical-lifecycle-classes`, OMN-14350). check-stub-implementations
  # is exported unchanged (same entry/args) in .pre-commit-hooks.yaml at
  # 63635097; the hook body diff between the two SHAs is comment-only
  # (verified via `git diff 458f44e 63635097 -- scripts/validation/check_stub_implementations.py`).
  # A single rev means block staleness can never regress silently again; see
  # the pin-parity-check hook below, which fails closed if this rev and
  # ci.yml:3102's pin ever diverge.
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: 63635097705d832e0ee9c4811093efb31349105c # pragma: allowlist secret
    hooks:
      - id: check-stub-implementations
      - id: no-noncanonical-lifecycle-classes
        args: [--allowlist, .onex_ratchets/noncanonical_class_allowlist.yaml, src/omniclaude]
        files: ^src/omniclaude/.*\.py$

  # Shared ONEX governance hooks (onex_change_control)
  - repo: https://github.com/OmniNode-ai/onex_change_control
    rev: 8d7e85bc00e7f1b1306d1cb40949be1ab6e7e91a  # pragma: allowlist secret
    hooks:
      - id: no-hardcoded-topics
        stages: [pre-commit]
        # Pre-existing violations excluded pending migration to canonical constants
        exclude: '^(src/omniclaude/hooks/(topic_allowlist|topic_registry)\.yaml|src/omniclaude/hooks/contracts/(capture_redaction|contract_hook_.*|wire/.*)\.yaml|src/omniclaude/lib/(config/intelligence_config|core/intelligence_event_client)\.py|src/omniclaude/nodes/(contracts|.*/contracts)/.*\.yaml|src/omniclaude/nodes/node_agent_inbox_effect/handler_kafka_inbox\.py|src/omniclaude/runtime/(__main__|wiring_dispatchers)\.py|src/omniclaude/services/linear_relay/publisher\.py|plugins/onex/(hooks/lib/pattern_cache\.py|skills/_lib/contract_generator/generate_contract\.py)|schemas/quirks/.*\.yaml|scripts/(bus_audit|demo_runner|validation/validate_golden_chain_integrity|validation/generate_event_registry)\.py|tests/validate_event_integration\.py|tests/(integration|unit)/skills/aislop_sweep/fixtures/.*)$'
      - id: no-bare-feature-flags
        stages: [pre-commit]
      - id: no-untracked-todos
        stages: [pre-commit]

  # Fast file checks that can run in parallel
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.github/workflows(?:-generated)?/.*\.ya?ml$'
        stages: [pre-commit]
      # check-yaml removed: conflicts with agent YAML files that use custom syntax
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]

  # Fast Python formatting and linting (staged files only)
  # Order: format -> fix -> check (matches CI behavior)
  # Note: To run on entire codebase, use: uv run ruff check src/ tests/
  - repo: local
    hooks:
      # OMN-18434. A test that shells out to git inherits GIT_DIR from the hook
      # running it and rewrites THIS repository instead of its fixture -- which
      # is how a shared canonical clone in this fleet was re-initialized on
      # 2026-09-16. Two layers: tests/conftest.py strips the whole GIT_ prefix at
      # pytest_configure and again per test, neutralising every call site
      # already written; this hook refuses a NEW one. The validator is the
      # canonical omnibase_core module (OMN-14891), pinned to the same range
      # .github/workflows/git-env-scrub.yml installs so the two surfaces cannot
      # return different verdicts on the same file.
      #
      # DIFF-SCOPED, which is the .kb-doc-gate.yaml shape and not an exemption.
      # This repository still carries pre-existing unguarded call sites, all of
      # them neutralised at runtime by layer 1 and none of them allowlisted. The
      # hook therefore asks the same question the CI job asks -- "does anything
      # this BRANCH touches carry a new one" -- rather than the question
      # `pre-commit run --all-files` would otherwise force it to ask, which is
      # about work nobody in this commit wrote. It resolves that range itself
      # rather than reading the filenames pre-commit hands it, so the answer is
      # the same whether it is invoked by `git commit` or by `--all-files`.
      #
      # The range is the tracked diff against that base UNION the untracked files
      # under tests/. A brand-new file is untracked until it is staged, and a
      # gate that cannot see the file somebody just wrote is the gate not
      # running.
      #
      # It fails CLOSED: when the base cannot be resolved the whole tests/ tree
      # is scanned rather than nothing.
      - id: git-env-scrub
        name: Tests cannot inherit GIT_DIR and rewrite this repo (OMN-18434)
        language: python
        additional_dependencies: ['omnibase-core>=0.47.0,<0.48.0']
        # A LITERAL block scalar, not a folded one: OMN-15479 refuses a folded
        # scalar carrying an internal newline, because yamlfmt rewrites those
        # newlines into a sentinel and silently changes what the file says.
        entry: |-
          bash -c '
          set -euo pipefail;
          base="$(git merge-base origin/dev HEAD 2>/dev/null || true)";
          if [ -z "$base" ]; then
            echo "git-env-scrub: base unresolved, scanning the whole tests/ tree";
            exec python -m omnibase_core.validators.no_unguarded_git_subprocess tests;
          fi;
          changed=();
          while IFS= read -r f; do
            case "$f" in *.py) changed+=("$f");; esac;
          done < <( { git diff --name-only --diff-filter=ACMR "$base" -- tests;
                      git ls-files --others --exclude-standard -- tests; } | sort -u );
          if [ ${#changed[@]} -eq 0 ]; then
            echo "git-env-scrub: this branch adds or modifies no test file";
            exit 0;
          fi;
          printf "git-env-scrub: scanning\n";
          printf "  %s\n" "${changed[@]}";
          exec python -m omnibase_core.validators.no_unguarded_git_subprocess "${changed[@]}"
          '
        pass_filenames: false
        types: [python]
        files: ^tests/.*\.py$
        stages: [pre-commit]

      # ============================================================
      # STAGE 1: PRE-COMMIT (fast, target <15 seconds)
      # ============================================================

      # OMN-13025 (A-3): Reject docs/evidence/** with UI/e2e claims but no Playwright artifact.
      # Root cause: 2026-06-11 19:27Z evidence doc claimed "UI POST → full chain live" when
      # only curl was run (PROCESS_FAILURE_RETRO.md §3.A — top-10 failure #1).
      # Rejected claim patterns: "UI POST", "click", "full chain live", "end-to-end".
      # A claim is allowed only when the doc also references a Playwright artifact.
      # Hard fail — no warn-only (CLAUDE.md Rule #5 + Rule #10).
      - id: reject-evidence-ui-claims
        name: Reject evidence docs with UI/e2e claims lacking Playwright artifact (OMN-13025)
        entry: .pre-commit-hooks/reject-evidence-ui-claims.sh
        language: script
        types: [markdown]
        pass_filenames: true
        stages: [pre-commit]

      # OMN-11271: Reject handoff docs missing mandatory ## Infra Health section.
      # Matches docs/handoffs/*.md, docs/*handoff*.md, docs/tracking/*handoff*.md.
      # Hard fail — no warn-only (CLAUDE.md Rule #5 + Rule #10). Spec: OMN-8867.
      - id: check-handoff-infra-health
        name: Reject handoff docs missing ## Infra Health section (OMN-11271)
        entry: .pre-commit-hooks/check-handoff-infra-health.sh
        language: script
        types: [markdown]
        pass_filenames: true
        stages: [pre-commit]

      # OMN-13029 (retro A-11): Defect-anchor gate — evidence docs with BLOCKER,
      # UNFIXED, DEFECT, REGRESSION, or BUG-CONFIRMED markers and no OMN-XXXX
      # reference fail pre-commit. Unanchored defects strand diagnosis without a
      # queue entry, owner, or close signal (PROCESS_FAILURE_RETRO.md §3.A).
      # Hard fail — no warn-only (CLAUDE.md Rule #5).
      # Escape (file-level): '<!-- defect-anchor-ok: <reason> -->'.
      - id: check-defect-anchor
        name: Reject evidence docs with unanchored defect markers (OMN-13029)
        entry: .pre-commit-hooks/check-defect-anchor.sh
        language: script
        types: [markdown]
        pass_filenames: true
        stages: [pre-commit]

      # OMN-9730: DGM-Phase4 — mechanical block on skip-deploy-gate bypass tokens.
      # Rejects any staged file containing [skip-deploy-gate:] without an explicit
      # approval receipt (# skip-token-allowed: <receipt-id>).
      # CLAUDE.md Rule #10: never bypass local gates. Fix the underlying issue.
      - id: reject-deploy-gate-skip-token
        name: Reject skip-deploy-gate bypass tokens (OMN-9730)
        entry: .pre-commit-hooks/reject-deploy-gate-skip-token.sh
        language: script
        pass_filenames: true
        always_run: true
        stages: [pre-commit]
        exclude: '^tests/hooks/fixtures/'
      - id: reject-deploy-gate-skip-token-commit-msg
        name: Reject skip-deploy-gate bypass tokens in commit messages (OMN-9730)
        entry: .pre-commit-hooks/reject-deploy-gate-skip-token.sh
        language: script
        pass_filenames: true
        stages: [commit-msg]
      - id: strip-ai-coauthor-trailer
        name: Strip AI-generated Co-Authored-By trailers from commit messages
        entry: perl -i -ne 'print unless /^co-authored-by:.*claude.*noreply\@anthropic\.com/i'
        language: system
        pass_filenames: true
        stages: [commit-msg]
      - id: reject-legacy-session-id-reads
        name: Reject legacy session-id env-var reads
        entry: .pre-commit-hooks/reject-legacy-session-id-reads.sh
        language: script
        types_or: [python, shell]
        pass_filenames: true
        stages: [pre-commit]

      # OMN-14854: Required-Check Skip-Vector Guard. Fails closed if a staged
      # workflow file or the required-checks manifest introduces a path-scoped
      # trigger, an ungated job-level `if:`, an ungated reusable-caller `if:`,
      # a missing pull_request/merge_group trigger, an ungated `needs:` cascade
      # (vector 5, OMN-15057), or result triage that does not fail closed on
      # every non-`success` upstream result (vector 6, OMN-15304) on any
      # REQUIRED context.
      # Same validator runs in CI (required-check-skip-guard-reusable.yml) —
      # local and CI verdicts can never diverge.
      - id: reject-required-check-skip-vector
        name: Reject skip vectors on required-check workflows (OMN-14854)
        entry: .pre-commit-hooks/reject-required-check-skip-vector.sh
        language: script
        pass_filenames: false
        files: '^\.github/(workflows/.*\.ya?ml|required-checks\.yaml)$'
        stages: [pre-commit]

      # OMN-15393: workflow `run:` script-path existence guard, shifted left.
      # The guard itself is tests/workflows/test_workflow_run_script_paths_exist.py.
      # It shipped in #1962 as a test that NOTHING selected on the change class it
      # guards: the governed selector mapped `.github/workflows/**` to
      # `tests/unit/` only, so a workflow fan-out that dropped its script stayed
      # green until the dev->main promotion full suite — i.e. after the broken
      # workflow was already on dev. Detection that is not wired as a gate on the
      # path that produces the defect is advisory (CLAUDE.md rule 5), so this hook
      # lands together with the selector adjacency trigger that makes the same
      # module run in CI. Same module, same assertion, both surfaces — a local and
      # a CI verdict can never disagree.
      #
      # ~1.5s (10 static tests, pure YAML parsing, no services, no network).
      #
      # KNOWN SCOPE LIMIT, stated rather than papered over: pre-commit hands
      # hooks only ADDED/MODIFIED staged files, never DELETED ones, so `git rm`
      # of a workflow-referenced script does not fire this hook. The CI half does
      # cover it — the selector reads `git diff --name-only base...HEAD`, which
      # includes deletions, and the `scripts/` + `plugins/` triggers select this
      # module. Do not "fix" this by adding always_run: true; that taxes every
      # commit in the repo for a check with two narrow inputs.
      - id: workflow-run-script-paths-exist
        name: Workflow `run:` script paths must exist in-tree (OMN-15393)
        # PYTHONDONTWRITEBYTECODE=1 (OMN-14463): this hook's own pytest
        # invocation compiles the root conftest.py, writing a root-level
        # __pycache__/ that the later pre-push validate-clean-root hook then
        # rejects -- a deterministic self-block, not a race with ambient
        # tooling (reproduced: bare `uv run pytest` here leaves
        # __pycache__/conftest.*.pyc at repo root; with the env var, it does
        # not). The env var must be set on the interpreter's own command
        # line/environment (a `sys.dont_write_bytecode = True` inside
        # conftest.py is too late -- CPython writes a module's .pyc as part
        # of import, before that module's top-level code runs), so this is
        # wrapped in `bash -c` rather than left as bare `entry:` args, which
        # pre-commit execs directly with no shell and would treat
        # `PYTHONDONTWRITEBYTECODE=1` as the binary to run.
        entry: >-
          bash -c 'PYTHONDONTWRITEBYTECODE=1 uv run pytest
          tests/workflows/test_workflow_run_script_paths_exist.py
          -q -p no:cacheprovider'
        language: system
        pass_filenames: false
        files: '^(\.github/workflows/.*\.ya?ml|scripts/.*\.(py|sh)|plugins/.*/scripts/.*\.(py|sh)|tests/workflows/test_workflow_run_script_paths_exist\.py)$'
        stages: [pre-commit]

      # OMN-16723: a reusable workflow's INNER checkout must be pinned to
      # github.job_workflow_sha, and a sparse checkout must assert what it
      # fetched. Sibling of the guard above, same shape, same trigger surface.
      #
      # The two defects it closes, both live and unlinted before this hook:
      #   * A caller-side `uses: ...@<sha>` pin governs only which workflow FILE
      #     loads. It cannot reach a second, independently-pinned checkout inside
      #     that file, so `ref: main` there silently drifts from the workflow.
      #     `github.sha` is worse — inside a reusable workflow that is the
      #     CALLER's commit, which does not exist in the callee repo at all.
      #   * A sparse checkout of a path that does not exist SUCCEEDS, leaving an
      #     empty directory. The miss surfaces downstream as
      #     "python3: can't open file ...: [Errno 2]" exit 2, which reads like a
      #     gate verdict rather than a plumbing failure. That pair is why the KB
      #     doc gate never once executed from any caller repo while both pilots
      #     looked correctly wired.
      #
      # ~1s (17 static tests, pure YAML parsing, no services, no network).
      # The CI half needs no new job: scripts/ci/test_selection_adjacency.yaml
      # already maps `.github/workflows/**` -> `tests/workflows/`, so this module
      # is selected on exactly the change class it guards. Local and CI verdicts
      # come from the same assertions and cannot disagree.
      #
      # ESCAPE HATCH is an annotation, never an allowlist file. A knowingly
      # carried instance writes, in the workflow itself:
      #   # reusable-checkout-ref-ok: <job_id> OMN-XXXX <reason>
      #   # reusable-checkout-sparse-ok: <job_id> OMN-XXXX <reason>
      # A separate assertion fails any such annotation that cites no ticket, so
      # the debt list stays greppable and cannot rot into an invisible bypass.
      - id: reusable-workflow-inner-checkouts-pinned
        name: Reusable-workflow inner checkouts must be pinned + asserted (OMN-16723)
        # PYTHONDONTWRITEBYTECODE=1 (OMN-14463) -- same self-block as the
        # sibling pytest hook above; see that hook's comment for the full
        # mechanism and why `bash -c` is required to set the env var.
        entry: >-
          bash -c 'PYTHONDONTWRITEBYTECODE=1 uv run pytest
          tests/workflows/test_reusable_workflow_inner_checkouts.py
          -q -p no:cacheprovider'
        language: system
        pass_filenames: false
        files: '^(\.github/workflows/.*\.ya?ml|tests/workflows/test_reusable_workflow_inner_checkouts\.py)$'
        stages: [pre-commit]

      # OMN-14190 (Piece 4/5 of the canonical OCC stamp-model, epic OMN-14180):
      # Shift-left validation of OCC PR-metadata stamps BEFORE CI's receipt-gate.
      # Thin shim over `onex occ validate` (omnibase_infra.cli.cli_occ) — zero
      # stamp logic duplicated; the CLI reuses the Piece-2 parser in
      # omnibase_core. Only *.md/*.txt that already carry an Evidence-Ticket /
      # Evidence-Source line are checked, so an incomplete or malformed stamp
      # fails at commit time; arbitrary markdown is never required to carry one.
      # Hard fail — no warn-only (CLAUDE.md Rule #5 + Rule #10).
      - id: validate-occ-pr-stamp
        name: Validate OCC PR metadata stamp (OMN-14190)
        entry: .pre-commit-hooks/validate-occ-pr-stamp.sh
        language: script
        files: '\.(md|txt)$'
        pass_filenames: true
        stages: [pre-commit]
        exclude: '^tests/hooks/fixtures/'

      # Wrapper fails loud (exit 1) if omnibase_core.validation.validator_local_paths
      # is not importable — a missing validator is a config error, not a pass.
      # OMN-9043: changed from silent skip to hard fail.
      - id: lane-identity
        name: lane identity — registry, trailers, and the window check (OMN-18260)
        entry: >-
          bash -c 'PYTHONDONTWRITEBYTECODE=1 uv run pytest
          tests/scripts/test_lane_identity.py
          tests/scripts/test_lane_identity_canonical_bake.py -q'
        language: system
        pass_filenames: false
        files: '^(scripts/lane_identity\.py|scripts/hooks/prepare-commit-msg-lane|tests/scripts/conftest\.py|tests/scripts/test_lane_identity\.py|tests/scripts/test_lane_identity_canonical_bake\.py)$'
        stages: [pre-commit]
      - id: check-local-paths
        name: check for local path references
        entry: bash scripts/check_local_paths_wrapper.sh
        language: system
        types: [text]
        exclude: '\.secrets\.baseline$|^docs/.*|^tests/fixtures/.*|^tests/.*/fixtures/.*'
        pass_filenames: true
        stages: [pre-commit]

      # OMN-9039: block cross-repo @main refs in self-gating workflows to
      # prevent the 2026-04-17 chicken-egg CI wedge (retro §4.8).
      # Complement to OMN-9038 (PreToolUse API-time guard).
      - id: check-self-gating-workflows
        name: check for cross-repo @main refs in self-gating workflows
        entry: python3 scripts/check_self_gating_workflows.py
        language: system
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: true
        stages: [pre-commit]

      # OMN-13873: dep-provenance gate — forbid first-party git-source overrides.
      # omnibase-core / omnibase-spi / omnibase-compat / omnibase-infra must resolve
      # from PyPI, not git commits/branches/tags, on dev/main (recurrence guard for
      # PR #2184's UNRELEASED-commit overrides that passed all CI green). Pure static
      # + offline; onex-change-control is intentionally exempt (immutable-main pin
      # model), as are siblings that publish no PyPI distribution yet.
      # OMN-17176: omnibase-infra is NO LONGER exempt. Its git override was
      # unreachable by `uv lock --upgrade-package`, so every release cascade was a
      # silent no-op and the pin rotted to v0.38.9 -- which still advertised the
      # `onex run` entry point that collides with omnibase-core 0.47.x.
      # Mirrors the required CI job in .github/workflows/dep-provenance-gate.yml.
      - id: check-dep-provenance
        name: Forbid first-party git-source overrides (OMN-13873, OMN-17176)
        entry: python3 scripts/check_dep_provenance.py
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-13501 / OMN-13502 (WS-F): no-faked-boundary detector, ENFORCING.
      # A hand-written stand-in for omniclaude's OWN inference/routing/dispatch
      # boundary (agent router, skill dispatcher, local-LLM egress), or a
      # patch("httpx.Client")/MagicMock substituting that egress in a real-dispatch
      # test, is a FAKE of our architecture. Detector ships in omnibase_core 0.46.4
      # (OMN-13898/13894 pin). The 61 pre-existing findings were burned down with
      # REAL fixes (recorded-replay transports for egress/agent — OMN-13499 — and
      # real EventBusInmemory wiring for routing) in OMN-13500 (#1849); the detector
      # now reports zero findings, so --report-only drops here and the CI job flips
      # required (OMN-13501/13502 Phase 3). CI mirror: .github/workflows/no-faked-boundary.yml.
      # Suppress an approved fixture line with: # onex-allow-faked-boundary
      - id: check-no-faked-boundary
        name: No faked inference/routing/dispatch boundary — COMPUTE/bus (OMN-13501)
        entry: uv run python -m omnibase_core.validation.no_faked_boundary.runtime_no_faked_boundary
        language: system
        types: [python]
        exclude: >-
          (?x)^(
            archived/|
            archive/
          )
        pass_filenames: true
        stages: [pre-commit]

      # OMN-8776: regression guard — skill prompts must not hardcode
      # `mcp__linear-server__*` tool names. Ticketing operations route
      # through ProtocolProjectTracker (`uv run onex run node_*`).
      - id: lint-skill-mcp-refs
        name: reject mcp__linear-server__ refs in skill prompts
        entry: python3 scripts/lint_skill_mcp_refs.py
        language: system
        files: '^plugins/onex/skills/.*\.md$'
        pass_filenames: true
        stages: [pre-commit]

      # OMN-14105: public-skill hygiene gate. plugins/onex/skills/ is
      # published/public; this is a separate, stricter gate than
      # aislop_sweep (which intentionally tolerates internal-tooling detail
      # there) — it flags operator identity, real hosts/IPs, machine-
      # specific paths, and internal doc citations. Detect-only, no
      # auto-fix. Allowlist decided keeps in
      # scripts/public_skill_hygiene_allowlist.yaml or inline with
      # `# public-skill-ok: <reason>`.
      # OMN-17993: this is a WHOLE-TREE invariant over the tracked set, not a
      # diff check. The previous 'files:' regex scoped it to plugins/onex/skills/
      # — 465 of 3,203 tracked files — and every one of this repo's HIGH
      # public-exposure findings lived outside that subtree, with the gate
      # reporting green over all of them. always_run keeps a staged change
      # anywhere in the repo from skipping it.
      - id: check-public-skill-hygiene
        name: public-repo hygiene gate (OMN-14105, widened OMN-17993)
        entry: python3 scripts/check_public_skill_hygiene.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      # OMN-13051 (retro D-5): plan hard fields — P0/P1 items with runtime-dep
      # keywords need a precondition-probe: annotation; deliverable sections
      # with file paths need an ## Artifact Manifest section; each manifest
      # item must carry [x], DONE, SKIPPED:, DEFERRED:, or BLOCKED-ON:.
      # CI mirror: .github/workflows/plan-hard-fields-gate.yml
      - id: lint-plan-hard-fields
        name: enforce plan hard fields (D-5 precondition probes + artifact manifest)
        entry: python3 scripts/lint_plan_hard_fields.py
        language: system
        files: '^docs/(plans|tracking)/.*\.md$'
        pass_filenames: true
        stages: [pre-commit]

      # OMN-14476: block plans proposing a new scripts/** file without a
      # 'canonical-form:' declaration (design as a node, or a reviewed
      # exception). Complements the code-time deny-new guard (OMN-14475).
      # CI mirror: .github/workflows/plan-canonical-scripts-gate.yml
      - id: lint-plan-canonical-scripts
        name: enforce plans declare canonical-form for proposed scripts/** files
        entry: python3 scripts/lint_plan_canonical_scripts.py
        language: system
        files: '^docs/(plans|tracking)/.*\.md$'
        pass_filenames: true
        stages: [pre-commit]

