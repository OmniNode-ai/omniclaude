      # --------------------------------------------------------------------------
      # detect-secrets baseline guard (OMN-15068)
      # Problem: .secrets.baseline stores line numbers. When new jobs are added to
      # CI workflows, all downstream line numbers shift, causing false-positive
      # "Secret Detection" CI failures on every such PR (OMN-2625). The original
      # fix for that (unconditionally regenerating + `git add`ing the baseline,
      # always exiting 0) conflated "line churn on a known finding" with "brand
      # new finding" -- it silently absorbed genuinely new secrets as unaudited
      # entries on every commit, and CI's own detect-secrets job then diffed
      # against that already-laundered baseline and found zero delta. A synthetic
      # AWS key pair planted in a scratch clone committed cleanly under the old
      # hook body (OMN-15068 RED-first proof).
      # Solution: scripts/detect_secrets_guard.py still regenerates the baseline
      # (so line-number churn on already-known findings is absorbed silently,
      # same convenience as before), but BLOCKS the commit when a genuinely new
      # finding (file + hashed_secret not present in the last-committed baseline)
      # has not been explicitly audited (`is_secret` key set via
      # `detect-secrets audit .secrets.baseline`). Fails closed on missing tool,
      # scan error, or unreadable/corrupt baseline. See the script's module
      # docstring for the full design.
      # OMN-18521: regenerating was never the problem -- writing position and
      # timestamp bookkeeping into the COMMITTED file was. Every commit that
      # grew a file above a tracked finding rewrote that entry, and every
      # commit rewrote `generated_at`, so every PR carried a baseline hunk and
      # every pair of concurrent PRs conflicted on it (60 of the last 60
      # baseline commits were pure churn; 0 changed a finding). The guard now
      # writes a normalized baseline on the success path -- no `line_number`,
      # no `generated_at`, canonically ordered -- so a line shift produces a
      # byte-identical file. The blocking path is unchanged: identity is still
      # (filename, hashed_secret), so a genuinely new finding still blocks.
      # --------------------------------------------------------------------------
      - id: detect-secrets-update
        name: guard .secrets.baseline (block new unaudited findings, OMN-15068)
        entry: python3 scripts/detect_secrets_guard.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # --------------------------------------------------------------------------
      # secrets-baseline wiring gate (OMN-18669)
      # The guard above is worth exactly as much as the wiring around it. A
      # repository can carry .secrets.baseline and read it from nowhere: the
      # file is present, the repository looks protected, and nothing is
      # checking. Measured 2026-09-18, one registry repository was in that
      # state with 47 unapproved findings in 18 files.
      # This is that invariant applied to THIS repository too, on the same
      # commit that exports it to the rest of the fleet -- a gate whose own
      # repo is exempt is a recommendation. Dogfooded a second time by
      # tests/scripts/test_secrets_baseline_wiring_gate.py, which asserts
      # omniclaude passes its own gate.
      # --------------------------------------------------------------------------
      - id: secrets-baseline-wired
        name: .secrets.baseline must be read by a hook and by CI (OMN-18669)
        entry: python3 scripts/secrets_baseline_wiring_gate.py --repo-root .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # --------------------------------------------------------------------------
      # No-new-advisory-job gate (OMN-18777, epic OMN-18775). Refuses a new
      # workflow setting that swallows a job's or a step's own failure unless
      # the census baseline names that exact line or the line carries
      # `# advisory-ok: OMN-nnnnn <reason>`, and refuses a new
      # verification-shaped job that runs on every pull request while
      # appearing in neither enforcement surface. Same module as the CI gate
      # (.github/workflows/advisory-job-gate.yml), so the two verdicts cannot
      # diverge. Exported for other repos as the `advisory-job-gate` hook in
      # .pre-commit-hooks.yaml.
      # --------------------------------------------------------------------------
      - id: advisory-job-gate
        name: No new advisory job — a check that cannot fail needs a ticket (OMN-18777)
        entry: python3 scripts/advisory_job_gate.py --repo-root . --repo OmniNode-ai/omniclaude
        language: system
        # pass_filenames: false is the WHOLE-TREE half -- the gate always scans
        # every workflow, never only the staged ones, because a hook whose
        # invariant is over the tracked set and which inspects the diff reports
        # green over everything that landed before it existed (OMN-17993).
        # `files:` is the TRIGGER half and is a different thing: it decides
        # whether the scan runs at all on this commit, and a commit touching no
        # workflow cannot introduce either refusal. `always_run: true` is
        # deliberately absent -- pre-commit ignores `files:` when it is set,
        # and every commit in the repo would then pay a live enforcement-surface
        # read.
        pass_filenames: false
        stages: [pre-commit]
        files: ^\.github/workflows/.*\.ya?ml$

      # --------------------------------------------------------------------------
      # Migration Freeze Check - Block new migrations during DB-per-repo refactor
      # Scope: Only triggers when migration files or .migration_freeze change
