      # backing-node behavior for deterministic receipt/artifact/event claims.
      - id: validate-skill-aspiration
        name: Skill aspiration validation (OMN-9075)
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_skill_aspiration.py
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-commit]
        files: ^(plugins/onex/skills/.*/SKILL\.md|plugins/onex/skills/_lib/validate_skill_aspiration\.py|scripts/(extract_skill_claims|validation/validate_skill_aspiration)\.py)$

      # Skill hygiene (OMN-5200) — validates skill dir naming, structure, Python separation
      - id: skill-hygiene
        name: Skill Hygiene
        language: system
        entry: python scripts/validate_frontmatter.py
        pass_filenames: false
        stages: [pre-commit]
        files: ^plugins/onex/skills/
      # Skill contract validation (OMN-6193) — validates args parity, sub-skill refs,
      # duplicate frontmatter, spec-prompt predicates
      - id: skill-contract-validation
        name: Skill Contract Validation
        language: system
        entry: bash scripts/validate_skill_contracts_wrapper.sh
        pass_filenames: false
        stages: [pre-commit]
        files: ^plugins/onex/skills/
      # Instructional-skill enforcement (OMN-8766, S19)
      # Rejects partial-port of the deterministic dispatch contract into
      # Tier 3 instructional (pure-prose) skills. Forbids:
      #   - `onex run` / `onex run-node` dispatch commands
      #   - `rendered_output` receipt assertions
      # Dispatch belongs in Tier 1 (OMN-8749 / OMN-8765); rendered_output
      # belongs in deterministic-skill DoD evidence contracts.
      # Initial land: --report (non-blocking) because 3 pre-existing
      # violations live in authorize (1) + onboarding (2). Flip to blocking
      # once follow-up ticket clears them so "all 15 skills pass green".
      - id: validate-instructional-skill-routing
        name: ONEX Instructional Skill Enforcement (OMN-8766)
        language: system
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_instructional_skill_routing.py --report
        pass_filenames: false
        stages: [pre-commit]
        files: ^plugins/onex/skills/

      # Deterministic-skill routing enforcement (OMN-8749, wired under OMN-14808).
      # Tier 1 counterpart to validate-instructional-skill-routing (OMN-8766)
      # above. Every Tier 1 deterministic skill's SKILL.md must contain a node
      # dispatch instruction, a `SkillRoutingError` reference (the live wire
      # contract emitted by both dispatch CLIs), and no prose-fallback routing
      # instruction. BLOCKING (no --report): the reconciled tree is green, so
      # any NEW drift fails at commit. Stdlib-only validator -> bare python3
      # (matches the arch-* hooks). CI mirror:
      # .github/workflows/check-deterministic-skills.yml.
      - id: validate-deterministic-skill-routing
        name: ONEX Deterministic Skill Routing Enforcement (OMN-8749)
        language: system
        entry: python3 scripts/validation/validate_deterministic_skill_routing.py
        pass_filenames: false
        stages: [pre-commit]
        files: ^(plugins/onex/skills/.*/SKILL\.md|scripts/validation/validate_deterministic_skill_routing\.py)$
      # OMN-12237 (Wave 7): Reject new imperative patterns in skills/*/SKILL.md.
      # Imperative inline logic (Agent(, TeamCreate, curl, gh api, psql, ssh,
      # asyncio.run, direct http://localhost/192.168 calls) must live in nodes.
      # Escape hatch: append '# imperative-ok' to suppress a single line.
      # Allowlisted (PURE-SKILL) dirs: handoff, login, preflight, record_friction,
      # set_session, systematic_debugging, unstick_queue, using_git_worktrees,
      # worktree, writing_skills, authorize.
      - id: reject-imperative-skill-patterns
        name: Reject imperative patterns in skills (OMN-12237)
        entry: .pre-commit-hooks/reject-imperative-skill-patterns.sh
        language: script
        pass_filenames: true
        stages: [pre-commit]
        files: ^plugins/onex/skills/.*/SKILL\.md$

      # TEMPORARY Phase-0 migration gate (OMN-14687, epic OMN-14686): every
      # filesystem-discovered plugin component (skill / hook script / agent
      # config) must be classified in plugins/distribution_manifest.yaml with a
      # valid exposure (stable|beta|hidden|retired). Prevents an unclassified
      # component being added mid-migration. Phase 3 retires this hook + the
      # validator when the permanent typed distribution-contract checks land.
      - id: validate-distribution-classification
        name: Distribution Classification (OMN-14687, temporary Phase-0 gate)
        entry: python3 scripts/validation/validate_distribution_classification.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(plugins/onex/(skills|hooks/scripts|agents/configs)/|plugins/distribution_manifest\.yaml|scripts/validation/validate_distribution_classification\.py)

      # Topic naming lint — validate onex.{kind}.{producer}.{event}.v{n} convention
      # (OMN-3259) Triggers on any *.py change; always scans full source tree.
      # Pre-existing violations suppressed by scripts/validation/topic_naming_baseline.txt
      - id: topic-naming-lint
        name: Topic Naming Lint
        entry: bash scripts/validation/run_topic_lint.sh
        language: system
        types_or: [python]
        pass_filenames: false
        stages: [pre-commit]

      # Kafka broker URL fallback guard (OMN-3555)
      # Prevents bus split regressions caused by stale hardcoded broker addresses
      # in os.getenv() default/fallback strings (root cause of OMN-3534).
      # Flags: :19092, :29092 as hardcoded fallback values in source.  # cloud-bus-ok OMN-3777
      # Suppression: add `# onex-allow-kafka-broker` to the flagged line.
      - id: no-hardcoded-kafka-broker
        name: Block hardcoded Kafka broker URL fallbacks
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_no_hardcoded_kafka_broker.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # OMN-17204: the hook edge's bus lane is declared, not derived from the
      # sourcing order between ~/.omnibase/.env and ~/.claude/settings.json.
      # Static half only -- `--live` reads host files a CI runner does not have,
      # and a check that passes on absent inputs is worse than no check.
      - id: hook-edge-lane-gate
        name: Hook edge bus lane pairing
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_hook_edge_lane.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # OMN-18702: a call to a shell function that is defined nowhere exits
      # 127, and every script on the hook edge is fail-open, so the caller
      # swallows it and the event is dropped with no error and no log line.
      # `emit_to_journal` was deleted by omniclaude#2214 as collateral in a
      # 293-line removal of a neighbouring function and left ten call sites
      # calling nothing for a day and a half; nine event classes emitted
      # nothing. The two guards already on that surface match the CALL SITE
      # as text and stayed green throughout. This one resolves the callee.
      # `always_run` rather than a file filter, for the same reason the lane
      # gate above uses one: the deletion and the call site are in different
      # files, so a filter on either would have missed this.
      - id: hook-callee-gate
        name: Hook callees are defined
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_hook_callees.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # OMN-17020: every hook this plugin registers is declared in
      # plugins/onex/hooks/contracts/hook_inventory.yaml, and every deliberate
      # disable carries owner/reason/review_by/restoration. OMN-13244 went dark
      # with no inventory at all; this refuses the commit that would repeat it.
      # Static half only -- the ONEX_HOOKS_MASK surface is per-machine and is
      # reported by session_start_hook_parity.sh, never by a gate.
      - id: hook-inventory-gate
        name: Hook inventory parity
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_hook_inventory.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # OMN-3777: Block cloud bus references in source code
      - id: no-cloud-bus
        name: Block cloud bus references
        entry: bash scripts/check_no_cloud_bus_wrapper.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: no-env-file
        name: Reject committed .env files (except .env.example)
        entry: >
          bash -c
          'if git diff --cached --name-only | grep -qE "(^|/)\\.env([._-].+)?$" | grep -vE "\\.env\\.example"; then
            echo "BLOCKED: .env staged — use ~/.omnibase/.env instead. Run: git reset HEAD <file>";
            exit 1;
          fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: validate-spdx-headers
        name: ONEX SPDX Header Requirement
        entry: bash scripts/uv-run-worktree-safe.sh onex spdx validate
        language: system
        pass_filenames: true
        files: ^(src|tests|scripts|examples)/.*\.(py|sh|bash|yml|yaml|toml)$
        exclude: ^(archived/|archive/)
        stages: [pre-commit]

      # Markdown link validation (OMN-5085) — replaces lychee-action in CI
      # Internal links only in pre-commit (fast). CI runs --check-external for full coverage.
      # Configuration: .markdown-link-check.json (ignore patterns ported from lychee excludes)
      - id: onex-validate-links
        name: Validate markdown links
        entry: bash scripts/uv-run-worktree-safe.sh onex-validate-links --verbose
        language: system
        types: [markdown]
        pass_filenames: false
        stages: [pre-commit]

      # OMN-5063: Block untyped metadata dict fields
      # Centralized in onex_change_control (OMN-5135)
      - id: no-untyped-metadata
        name: No untyped metadata dict fields
        language: system
        entry: bash scripts/uv-run-worktree-safe.sh check-no-untyped-metadata
        types: [python]
        exclude: ^tests/|^examples/|^scripts/

      - id: normalization-symmetry
        name: normalization-symmetry
        entry: uv run python -m omnibase_core.validation.checker_normalization_symmetry
        language: system
        pass_filenames: false

      # Hook bitmask drift check (OMN-9615)
      # Regenerates hook_bits.sh from EnumHookBit and fails if the committed
      # artifact is stale. Fires when hook_bits.sh is modified.
      - id: hook-bits-drift
        name: hook_bits.sh drift check (regenerate if EnumHookBit changes)
        entry: bash scripts/run-hook-bits-drift.sh
        language: system
        pass_filenames: false
        files: ^plugins/onex/hooks/lib/hook_bits\.sh$
        stages: [pre-commit]

      # OMN-14655 (D5, §3d.7): fail-loud meta-gate over this very file.
      # Hard-rejects the exit-0-on-missing-path / WARN-SKIP-degrade class
      # that made `skill-contract-validation` and `no-cloud-bus` false-green,
      # any undocumented SKIP/BYPASS-env-var-gated exit 0, and any `stages:`
      # value default_install_hook_types does not install. Wired as BOTH a
      # pre-commit hook (here) and a required CI gate
      # (.github/workflows/precommit-fail-loud-gate.yml) in this same PR so
      # the class cannot regenerate on the next wrapper script.
      - id: precommit-fail-loud-meta-gate
        name: Pre-commit fail-loud meta-gate (OMN-14655)
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_precommit_fail_loud.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        files: ^(\.pre-commit-config\.yaml|scripts/.*\.sh|\.pre-commit-hooks/.*\.sh)$

      # OMN-14655 (D5, §3d.8): pin-parity ratchet. Fails closed the moment
      # the pre-commit `rev:` pin for a shared omnibase_core validator
      # diverges from the SHA .github/workflows/ci.yml pins for the same
      # validator (the DRIFT-3 class that produced two disagreeing
      # omnibase_core blocks in this file before OMN-14655 converged them).
      # OMN-18752: the LIVE half of this gate was registered nowhere. The
      # wrapper header, the module docstring and the CI workflow each said it
      # runs as both a pre-commit hook and a required status check, and the id
      # appeared in no .pre-commit-config.yaml in the workspace (87 local ids
      # on dev, this one not among them). CI runners carry no live venv, so
      # the live half had only ever run when a human typed it, which is how
      # five findings accumulated unseen on the fleet's own host.
      #
      # Scoped to the two files that define the pin set. It is registered only
      # now, after the host converged, because the plugin venv builder
      # resolves its project root to the canonical clone unconditionally: the
      # venv could not be rebuilt against the new lock until that lock landed.
      #
      # Its sibling check-omnimarket-dispatch-drift is deliberately NOT
      # registered here. That gate resolved its baseline from omnimarket's
      # `main` while the OMN-18675 venv guard resolves the canonical clone's
      # checked-out `dev` head; main is release-synced, so the two demanded
      # different commits at every moment except the instant main caught up.
      # OMN-18752 repointed the drift gate at the clone, and registering it
      # is the remaining half, tracked separately.
      # tests/test_venv_gate_registration.py asserts both halves of this.
      - id: check-daemon-venv-skew
        name: Daemon/CLI venv skew gate (OMN-13120, OMN-18746, OMN-18752)
        entry: bash .pre-commit-hooks/check-daemon-venv-skew.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(uv\.lock|pyproject\.toml)$

      # OMN-18790: the skip-count ratchet's own logic, driven over synthetic
      # reports locally. The case that matters is the RED one: a reintroduced
      # environmentally-skipped test must turn the gate red. The shipped
      # baseline's provenance is validated in the same pass, because a baseline
      # number with no recorded measurement is a claim, not a measurement.
      # SYNC with ci.yml job 'skip-count-ratchet' (Operating Rule #5).
      - id: skip-count-ratchet
        name: Skip-count baseline ratchet selftest (OMN-18790)
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/ci/skip_count_ratchet.py --selftest
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: >-
          ^(scripts/ci/skip_count_ratchet\.py|config/skip_count_baseline\.yaml|tests/ci/test_skip_count_ratchet_omn18790\.py|\.github/workflows/ci\.yml)$

      - id: precommit-pin-parity
        name: Pre-commit/CI pin-parity check (OMN-14655)
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_precommit_pin_parity.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/ci\.yml)$

  - repo: local
    hooks:
      - id: validate-gitignore-baseline
        name: Gitignore Baseline Validator (OMN-12453)
        description: 'Assert that every managed block declared in architecture-handshakes/gitignore-baseline.yaml
          appears VERBATIM in the target repo''s .gitignore. Enforces universal block
          on all repos; python block on repos that contain pyproject.toml. Suppress
          all findings for a file with: # gitignore-ok: <reason>

          '
        language: python
        entry: python -m omnibase_core.validators.gitignore_baseline
        pass_filenames: false
        stages:
          - pre-commit
        additional_dependencies:
          - omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core.git@7705bc377091517a008948cc9a6c8da56fd24afb


# Configuration
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]
fail_fast: false

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [no-cloud-bus]  # Pre-existing 29092 violations — cleanup tracked separately  # cloud-bus-ok OMN-3777
  submodules: false
