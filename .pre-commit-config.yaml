      # OMN-3554: Reject hardcoded Kafka broker address fallbacks
      # Detects os.getenv("KAFKA_*", non-empty) and private-IP Kafka broker ports
      - id: kafka-no-hardcoded-fallback
        name: Reject hardcoded Kafka broker address fallbacks
        entry: >
          bash -c
          'FAILED=0;
          MATCHES=$(grep -rn --include="*.py"
          --exclude-dir=.venv
          --exclude-dir=__pycache__
          --exclude-dir=.claude
          --exclude-dir=scripts
          -E "os\.getenv\([[:space:]]*[\"'"'"']KAFKA_[^\"'"'"']+[\"'"'"'][[:space:]]*,[[:space:]]*[\"'"'"'][^\"'"'"']+[\"'"'"']"
          . 2>/dev/null |
          grep -v "kafka-fallback-ok" |
          grep -v "noqa");
          if [ -n "$MATCHES" ]; then
          echo "ERROR: Hardcoded Kafka bootstrap fallback detected:";
          echo "$MATCHES";
          echo "";
          echo "FIX: Remove the fallback value or add # kafka-fallback-ok";
          FAILED=1;
          fi;
          IP_MATCHES=$(grep -rn --include="*.py"
          --exclude-dir=.venv
          --exclude-dir=__pycache__
          --exclude-dir=.claude
          -E "192\.168\.[0-9]+\.[0-9]+:[0-9]{4,5}"
          . 2>/dev/null |
          grep -v "kafka-fallback-ok" |
          grep -v "noqa" |
          grep -v "onex-allow-internal-ip");
          if [ -n "$IP_MATCHES" ]; then
          echo "ERROR: Hardcoded private-IP Kafka broker address in Python file:";
          echo "$IP_MATCHES";
          echo "";
          echo "FIX: Use KAFKA_BOOTSTRAP_SERVERS env var or add # kafka-fallback-ok";
          FAILED=1;
          fi;
          exit $FAILED'
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
