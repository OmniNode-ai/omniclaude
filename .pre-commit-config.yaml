---
# OmniClaude Pre-commit Configuration
# Two-stage validation strategy for optimal developer experience
#
# PERFORMANCE OPTIMIZATION (2026-01):
# ====================================
# Two-stage validation strategy matching omnibase_core patterns:
#
# PRE-COMMIT (target: <15 seconds):
#   - Formatting (ruff format/fix)
#   - Basic file checks (whitespace, large files, merge conflicts)
#   - Quick structural validations
#   - Clean output directory
#
# PRE-PUSH (thorough checks before sharing):
#   - Security checks (bandit, secret detection)
#   - mypy type checking
#   - ONEX validation
#   - Clean root validation
#
# USAGE:
#   pre-commit install                         # Install pre-commit hooks
#   pre-commit install --hook-type pre-push    # Install pre-push hooks
#   pre-commit run --all-files                 # Run all pre-commit hooks
#   pre-commit run --all-files --hook-stage pre-push  # Run pre-push hooks

repos:
  # OMN-14655 (SHA reconciliation, D1f/§3d.8): converged from two separate
  # omnibase_core repo: blocks pinned at DIFFERENT revs (458f44e for
  # check-stub-implementations, 63635097 for no-noncanonical-lifecycle-classes)
  # into one block at 63635097705d832e0ee9c4811093efb31349105c -- the SAME
  # SHA ci.yml:3102 pins for the canonical `omnibase-core @ git+...` ratchet
  # (`no-noncanonical-lifecycle-classes`, OMN-14350). check-stub-implementations
  # is exported unchanged (same entry/args) in .pre-commit-hooks.yaml at
  # 63635097; the hook body diff between the two SHAs is comment-only
  # (verified via `git diff 458f44e 63635097 -- scripts/validation/check_stub_implementations.py`).
  # A single rev means block staleness can never regress silently again; see
  # the pin-parity-check hook below, which fails closed if this rev and
  # ci.yml:3102's pin ever diverge.
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: 63635097705d832e0ee9c4811093efb31349105c # pragma: allowlist secret
    hooks:
      - id: check-stub-implementations
      - id: no-noncanonical-lifecycle-classes
        args: [--allowlist, .onex_ratchets/noncanonical_class_allowlist.yaml, src/omniclaude]
        files: ^src/omniclaude/.*\.py$

  # Shared ONEX governance hooks (onex_change_control)
  - repo: https://github.com/OmniNode-ai/onex_change_control
    rev: 8d7e85bc00e7f1b1306d1cb40949be1ab6e7e91a  # pragma: allowlist secret
    hooks:
      - id: no-hardcoded-topics
        stages: [pre-commit]
        # Pre-existing violations excluded pending migration to canonical constants
        exclude: '^(src/omniclaude/hooks/(topic_allowlist|topic_registry)\.yaml|src/omniclaude/hooks/contracts/(contract_hook_.*|wire/.*)\.yaml|src/omniclaude/lib/(config/intelligence_config|core/intelligence_event_client)\.py|src/omniclaude/nodes/(contracts|.*/contracts)/.*\.yaml|src/omniclaude/nodes/node_agent_inbox_effect/handler_kafka_inbox\.py|src/omniclaude/runtime/(__main__|wiring_dispatchers)\.py|src/omniclaude/services/linear_relay/publisher\.py|plugins/onex/(hooks/lib/pattern_cache\.py|skills/_lib/contract_generator/generate_contract\.py)|schemas/quirks/.*\.yaml|scripts/(bus_audit|demo_runner|validation/validate_golden_chain_integrity)\.py|tests/validate_event_integration\.py|tests/(integration|unit)/skills/aislop_sweep/fixtures/.*)$'
      - id: no-bare-feature-flags
        stages: [pre-commit]
      - id: no-untracked-todos
        stages: [pre-commit]

  # Fast file checks that can run in parallel
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.github/workflows(?:-generated)?/.*\.ya?ml$'
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: '\.github/workflows(?:-generated)?/.*\.ya?ml$'
        stages: [pre-commit]
      # check-yaml removed: conflicts with agent YAML files that use custom syntax
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]

  # Fast Python formatting and linting (staged files only)
  # Order: format -> fix -> check (matches CI behavior)
  # Note: To run on entire codebase, use: uv run ruff check src/ tests/
  - repo: local
    hooks:
      # ============================================================
      # STAGE 1: PRE-COMMIT (fast, target <15 seconds)
      # ============================================================

      # OMN-13025 (A-3): Reject docs/evidence/** with UI/e2e claims but no Playwright artifact.
      # Root cause: 2026-06-11 19:27Z evidence doc claimed "UI POST → full chain live" when
      # only curl was run (PROCESS_FAILURE_RETRO.md §3.A — top-10 failure #1).
      # Rejected claim patterns: "UI POST", "click", "full chain live", "end-to-end".
      # A claim is allowed only when the doc also references a Playwright artifact.
      # Hard fail — no warn-only (CLAUDE.md Rule #5 + Rule #10).
      - id: reject-evidence-ui-claims
        name: Reject evidence docs with UI/e2e claims lacking Playwright artifact (OMN-13025)
        entry: .pre-commit-hooks/reject-evidence-ui-claims.sh
        language: script
        types: [markdown]
        pass_filenames: true
        stages: [pre-commit]

      # OMN-11271: Reject handoff docs missing mandatory ## Infra Health section.
      # Matches docs/handoffs/*.md, docs/*handoff*.md, docs/tracking/*handoff*.md.
      # Hard fail — no warn-only (CLAUDE.md Rule #5 + Rule #10). Spec: OMN-8867.
      - id: check-handoff-infra-health
        name: Reject handoff docs missing ## Infra Health section (OMN-11271)
        entry: .pre-commit-hooks/check-handoff-infra-health.sh
        language: script
        types: [markdown]
        pass_filenames: true
        stages: [pre-commit]

      # OMN-13029 (retro A-11): Defect-anchor gate — evidence docs with BLOCKER,
      # UNFIXED, DEFECT, REGRESSION, or BUG-CONFIRMED markers and no OMN-XXXX
      # reference fail pre-commit. Unanchored defects strand diagnosis without a
      # queue entry, owner, or close signal (PROCESS_FAILURE_RETRO.md §3.A).
      # Hard fail — no warn-only (CLAUDE.md Rule #5).
      # Escape (file-level): '<!-- defect-anchor-ok: <reason> -->'.
      - id: check-defect-anchor
        name: Reject evidence docs with unanchored defect markers (OMN-13029)
        entry: .pre-commit-hooks/check-defect-anchor.sh
        language: script
        types: [markdown]
        pass_filenames: true
        stages: [pre-commit]


      # OMN-9730: DGM-Phase4 — mechanical block on skip-deploy-gate bypass tokens.
      # Rejects any staged file containing [skip-deploy-gate:] without an explicit
      # approval receipt (# skip-token-allowed: <receipt-id>).
      # CLAUDE.md Rule #10: never bypass local gates. Fix the underlying issue.
      - id: reject-deploy-gate-skip-token
        name: Reject skip-deploy-gate bypass tokens (OMN-9730)
        entry: .pre-commit-hooks/reject-deploy-gate-skip-token.sh
        language: script
        pass_filenames: true
        always_run: true
        stages: [pre-commit]
        exclude: '^tests/hooks/fixtures/'
      - id: reject-deploy-gate-skip-token-commit-msg
        name: Reject skip-deploy-gate bypass tokens in commit messages (OMN-9730)
        entry: .pre-commit-hooks/reject-deploy-gate-skip-token.sh
        language: script
        pass_filenames: true
        stages: [commit-msg]
      - id: reject-legacy-session-id-reads
        name: Reject legacy session-id env-var reads
        entry: .pre-commit-hooks/reject-legacy-session-id-reads.sh
        language: script
        types_or: [python, shell]
        pass_filenames: true
        stages: [pre-commit]

      # OMN-14854: Required-Check Skip-Vector Guard. Fails closed if a staged
      # workflow file or the required-checks manifest introduces a path-scoped
      # trigger, an ungated job-level `if:`, an ungated reusable-caller `if:`,
      # or a missing pull_request/merge_group trigger on any REQUIRED context.
      # Same validator runs in CI (required-check-skip-guard-reusable.yml) —
      # local and CI verdicts can never diverge.
      - id: reject-required-check-skip-vector
        name: Reject skip vectors on required-check workflows (OMN-14854)
        entry: .pre-commit-hooks/reject-required-check-skip-vector.sh
        language: script
        pass_filenames: false
        files: '^\.github/(workflows/.*\.ya?ml|required-checks\.yaml)$'
        stages: [pre-commit]

      # OMN-14190 (Piece 4/5 of the canonical OCC stamp-model, epic OMN-14180):
      # Shift-left validation of OCC PR-metadata stamps BEFORE CI's receipt-gate.
      # Thin shim over `onex occ validate` (omnibase_infra.cli.cli_occ) — zero
      # stamp logic duplicated; the CLI reuses the Piece-2 parser in
      # omnibase_core. Only *.md/*.txt that already carry an Evidence-Ticket /
      # Evidence-Source line are checked, so an incomplete or malformed stamp
      # fails at commit time; arbitrary markdown is never required to carry one.
      # Hard fail — no warn-only (CLAUDE.md Rule #5 + Rule #10).
      - id: validate-occ-pr-stamp
        name: Validate OCC PR metadata stamp (OMN-14190)
        entry: .pre-commit-hooks/validate-occ-pr-stamp.sh
        language: script
        files: '\.(md|txt)$'
        pass_filenames: true
        stages: [pre-commit]
        exclude: '^tests/hooks/fixtures/'

      # Wrapper fails loud (exit 1) if omnibase_core.validation.validator_local_paths
      # is not importable — a missing validator is a config error, not a pass.
      # OMN-9043: changed from silent skip to hard fail.
      - id: check-local-paths
        name: check for local path references
        entry: bash scripts/check_local_paths_wrapper.sh
        language: system
        types: [text]
        exclude: '\.secrets\.baseline$|^docs/.*|^tests/fixtures/.*|^tests/.*/fixtures/.*'
        pass_filenames: true
        stages: [pre-commit]

      # OMN-9039: block cross-repo @main refs in self-gating workflows to
      # prevent the 2026-04-17 chicken-egg CI wedge (retro §4.8).
      # Complement to OMN-9038 (PreToolUse API-time guard).
      - id: check-self-gating-workflows
        name: check for cross-repo @main refs in self-gating workflows
        entry: python3 scripts/check_self_gating_workflows.py
        language: system
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: true
        stages: [pre-commit]

      # OMN-13873: dep-provenance gate — forbid first-party git-source overrides.
      # omnibase-core / omnibase-spi / omnibase-compat must resolve from PyPI, not
      # git commits/branches/tags, on dev/main (recurrence guard for PR #2184's
      # UNRELEASED-commit overrides that passed all CI green). Pure static +
      # offline; onex-change-control / omnibase-infra are intentionally exempt.
      # Mirrors the required CI job in .github/workflows/dep-provenance-gate.yml.
      - id: check-dep-provenance
        name: Forbid first-party git-source overrides (OMN-13873)
        entry: python3 scripts/check_dep_provenance.py
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-13501 / OMN-13502 (WS-F): no-faked-boundary detector, ENFORCING.
      # A hand-written stand-in for omniclaude's OWN inference/routing/dispatch
      # boundary (agent router, skill dispatcher, local-LLM egress), or a
      # patch("httpx.Client")/MagicMock substituting that egress in a real-dispatch
      # test, is a FAKE of our architecture. Detector ships in omnibase_core 0.46.4
      # (OMN-13898/13894 pin). The 61 pre-existing findings were burned down with
      # REAL fixes (recorded-replay transports for egress/agent — OMN-13499 — and
      # real EventBusInmemory wiring for routing) in OMN-13500 (#1849); the detector
      # now reports zero findings, so --report-only drops here and the CI job flips
      # required (OMN-13501/13502 Phase 3). CI mirror: .github/workflows/no-faked-boundary.yml.
      # Suppress an approved fixture line with: # onex-allow-faked-boundary
      - id: check-no-faked-boundary
        name: No faked inference/routing/dispatch boundary — COMPUTE/bus (OMN-13501)
        entry: uv run python -m omnibase_core.validation.no_faked_boundary.runtime_no_faked_boundary
        language: system
        types: [python]
        exclude: >-
          (?x)^(
            archived/|
            archive/
          )
        pass_filenames: true
        stages: [pre-commit]

      # OMN-8776: regression guard — skill prompts must not hardcode
      # `mcp__linear-server__*` tool names. Ticketing operations route
      # through ProtocolProjectTracker (`uv run onex run node_*`).
      - id: lint-skill-mcp-refs
        name: reject mcp__linear-server__ refs in skill prompts
        entry: python3 scripts/lint_skill_mcp_refs.py
        language: system
        files: '^plugins/onex/skills/.*\.md$'
        pass_filenames: true
        stages: [pre-commit]

      # OMN-14105: public-skill hygiene gate. plugins/onex/skills/ is
      # published/public; this is a separate, stricter gate than
      # aislop_sweep (which intentionally tolerates internal-tooling detail
      # there) — it flags operator identity, real hosts/IPs, machine-
      # specific paths, and internal doc citations. Detect-only, no
      # auto-fix. Allowlist decided keeps in
      # scripts/public_skill_hygiene_allowlist.yaml or inline with
      # `# public-skill-ok: <reason>`.
      - id: check-public-skill-hygiene
        name: public-skill hygiene gate (OMN-14105)
        entry: python3 scripts/check_public_skill_hygiene.py
        language: system
        files: '^(plugins/onex/skills/|scripts/check_public_skill_hygiene\.py|scripts/public_skill_hygiene_allowlist\.yaml)'
        pass_filenames: false
        stages: [pre-commit]

      # OMN-13051 (retro D-5): plan hard fields — P0/P1 items with runtime-dep
      # keywords need a precondition-probe: annotation; deliverable sections
      # with file paths need an ## Artifact Manifest section; each manifest
      # item must carry [x], DONE, SKIPPED:, DEFERRED:, or BLOCKED-ON:.
      # CI mirror: .github/workflows/plan-hard-fields-gate.yml
      - id: lint-plan-hard-fields
        name: enforce plan hard fields (D-5 precondition probes + artifact manifest)
        entry: python3 scripts/lint_plan_hard_fields.py
        language: system
        files: '^docs/(plans|tracking)/.*\.md$'
        pass_filenames: true
        stages: [pre-commit]

      # OMN-14476: block plans proposing a new scripts/** file without a
      # 'canonical-form:' declaration (design as a node, or a reviewed
      # exception). Complements the code-time deny-new guard (OMN-14475).
      # CI mirror: .github/workflows/plan-canonical-scripts-gate.yml
      - id: lint-plan-canonical-scripts
        name: enforce plans declare canonical-form for proposed scripts/** files
        entry: python3 scripts/lint_plan_canonical_scripts.py
        language: system
        files: '^docs/(plans|tracking)/.*\.md$'
        pass_filenames: true
        stages: [pre-commit]

      # OMN-9072: regression guard — every hookSpecificOutput emission must
      # include hookEventName, else Claude Code silently drops the payload.
      - id: check-hook-event-names
        name: check hook scripts include hookEventName in hookSpecificOutput
        entry: bash scripts/check_hook_event_names.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # OMN-10604: block direct adapter imports in runners/skills —
      # adapters must be injected via DI, not constructed inline.
      - id: no-direct-adapter-in-business-logic
        name: reject direct adapter imports in business logic
        entry: python3 scripts/validation/validate_no_direct_adapter_in_business_logic.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # OMN-10658 / OMN-10734: block localhost/default fallbacks in src/ and scripts/
      # Enforces fail-fast env var access: os.environ["VAR"] not os.getenv("VAR", "localhost...")
      - id: no-env-fallbacks
        name: No localhost/default env fallbacks (OMN-10658)
        entry: python3 scripts/validate_no_env_fallbacks.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # OMN-10723: block silent inprocess fallback patterns in skill code.
      # Skills must dispatch through the event bus, not bypass it.
      - id: no-inprocess-fallback-in-skills
        name: No silent inprocess fallback in skills (OMN-10723)
        entry: bash plugins/onex/hooks/scripts/pre-commit-no-inprocess-fallback.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # OMN-10725: block direct EventBus instantiation outside DI bootstrap —
      # handlers/skills/runners must receive bus via DI or select_event_bus().
      - id: no-direct-bus-instantiation
        name: No direct EventBus instantiation (must use DI/select_event_bus)
        entry: python3 scripts/validation/validate_no_direct_bus_instantiation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # OMN-10725: block raw sqlite3.connect() outside adapter definitions —
      # DB access must go through injected adapter, not direct connection.
      - id: no-raw-sqlite3-in-handlers
        name: No raw sqlite3.connect in handler/skill code (must use adapter)
        entry: python3 scripts/validation/validate_no_raw_sqlite3.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: clean-output-directory
        name: clean output directory (prevent test artifacts)
        entry: bash -c 'rm -rf output/ && exit 0'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format (staged files)
        entry: bash scripts/uv-run-worktree-safe.sh ruff format
        language: system
        types: [python]
        exclude: '\.github/workflows/.*|^\.[^/]*$|^\..*/.*|_archive/.*|src/omniclaude/lib/.*'
        stages: [pre-commit]

      - id: ruff-fix
        name: ruff check --fix (staged files)
        entry: bash scripts/uv-run-worktree-safe.sh ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        exclude: '\.github/workflows/.*|^\.[^/]*$|^\..*/.*|_archive/.*|src/omniclaude/lib/.*'
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check (staged files)
        entry: bash scripts/uv-run-worktree-safe.sh ruff check
        language: system
        types: [python]
        exclude: '\.github/workflows/.*|^\.[^/]*$|^\..*/.*|_archive/.*|src/omniclaude/lib/.*'
        stages: [pre-commit]

      # --------------------------------------------------------------------------
      # detect-secrets baseline regeneration
      # Problem: .secrets.baseline stores line numbers. When new jobs are added to
      # CI workflows, all downstream line numbers shift, causing false-positive
      # "Secret Detection" CI failures on every such PR (OMN-2625).
      # Solution: Regenerate the baseline before each commit so committed line
      # numbers always reflect the current codebase state. CI comparison then
      # finds zero delta because baseline was already updated.
      # Uses the same --exclude-files patterns as the CI detect-secrets job.
      # --------------------------------------------------------------------------
      - id: detect-secrets-update
        name: regenerate .secrets.baseline (prevent line-shift false positives)
        entry: bash -c '
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files "\.lock$" \
            --exclude-files "\.env\.example$" \
            --exclude-files "bandit-report\.json$" \
            --exclude-files "^tests/" \
            --exclude-files "security-report\.json$" \
          && git add .secrets.baseline'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # --------------------------------------------------------------------------
      # Migration Freeze Check - Block new migrations during DB-per-repo refactor
      # Scope: Only triggers when migration files or .migration_freeze change
      # Purpose: Enforces schema freeze (OMN-2055) while .migration_freeze exists
      # Note: Checks filesystem for freeze file, so removing .migration_freeze in
      #       the same commit as adding a migration intentionally lifts the freeze.
      # --------------------------------------------------------------------------
      - id: migration-freeze-check
        name: migration freeze check
        entry: ./scripts/check_migration_freeze.sh
        language: system
        pass_filenames: false
        files: ^(sql/migrations/|\.migration_freeze)
        stages: [pre-commit]

      # --------------------------------------------------------------------------
      # No Planning Docs (OMN-3615)
      # Planning documents belong in omni_home/docs/plans/, not in individual
      # repos. This hook blocks accidental commits of docs/plans/ files.
      # --------------------------------------------------------------------------
      - id: no-planning-docs
        name: Block planning docs (belong in omni_home/docs/plans/)
        entry: >
          bash -c
          'PLAN_FILES=$(git diff --cached --name-only -- "docs/plans/");
          if [ -n "$PLAN_FILES" ]; then
          echo "ERROR - Planning docs must live in omni_home/docs/plans/, not in this repo";
          echo "$PLAN_FILES";
          echo "";
          echo "Move your file to the omni_home docs/plans/ directory";
          exit 1;
          fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # --------------------------------------------------------------------------
      # OMN-14655 (WS7 canary, ticket-plan docs/plans/2026-07-15-ci-precommit-gate-parity-plan.md):
      # DRIFT-1 fix — the `arch-*` AST-scan validators below have run in CI
      # (ci.yml) since their respective landing tickets but had NO pre-commit
      # mirror, so violations only ever surfaced after push. Each entry below
      # invokes the EXACT CI entrypoint (same script, same args, same bare
      # `python3` invocation CI uses) — no rule logic is re-implemented here.
      # All are stdlib-only AST/regex scans (ast/re/sys/pathlib), verified via
      # `grep '^import\|^from' scripts/validation/<script>.py`, so `python3`
      # (no uv sync / venv) is both correct and matches CI's bare-interpreter
      # invocation for the non-uv jobs.
      # --------------------------------------------------------------------------
      - id: arch-no-db-in-orchestrator
        name: "Arch: No DB access in orchestrator/compute (checks 1 & 8)"
        entry: python3 scripts/validation/validate_no_db_in_orchestrator.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: arch-no-git-outside-effects
        name: "Arch: No git/gh calls outside effects (check 2)"
        entry: python3 scripts/validation/validate_no_git_outside_effects.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: arch-no-linear-outside-effects
        name: "Arch: No LinearClient outside effects (check 3)"
        entry: python3 scripts/validation/validate_no_linear_outside_effects.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: arch-no-repo-adapter-in-orchestrator
        name: "Arch: No repository adapter imports in orchestrator/compute (check 4)"
        entry: python3 scripts/validation/validate_no_repo_adapter_in_orchestrator.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: arch-cost-ledger-isolation
        name: "Arch: ModelCostLedger confined to effects (check 5)"
        entry: python3 scripts/validation/validate_cost_ledger_isolation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: arch-topic-naming
        name: "Arch: onex.* topic naming convention (check 6)"
        # NOTE: distinct from the existing `topic-naming-lint` hook (below),
        # which runs scripts/validation/run_topic_lint.sh — a different
        # program against a baseline file. This wires CI's own
        # validate_topic_naming.py entrypoint for exact DRY parity.
        entry: python3 scripts/validation/validate_topic_naming.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: arch-cost-ledger-structure
        name: "Arch: ModelCostLedger run_id field + index (check 9)"
        entry: python3 scripts/validation/validate_cost_ledger_structure.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: arch-no-direct-kafka-producer
        name: "Arch: No direct Kafka producer outside publisher (check 10)"
        entry: python3 scripts/validation/validate_no_direct_kafka_producer.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: arch-no-utcnow
        name: "Arch: No datetime.utcnow() usage (check 11)"
        entry: python3 scripts/validation/validate_no_utcnow.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: arch-no-hardcoded-ip
        name: "Arch: No hardcoded internal IPs (check 12)"
        # CI (ci.yml arch-no-hardcoded-ip) invokes this via `uv run python`
        # (unlike the other arch-* checks above, which CI runs bare). Mirror
        # that exact invocation via the worktree-safe uv wrapper rather than
        # dropping to bare python3, to stay byte-for-byte DRY with the live
        # CI entrypoint. (Follow-up: CI could drop its own uv sync/uv run to
        # bare python3 like the other arch-* jobs since this script is also
        # stdlib-only -- out of scope for this canary; track separately.)
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_no_hardcoded_ip.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-env-var-registry
        name: "Env Var Registry (OMN-6263)"
        # Invokes CI's exact arg-string (ci.yml env-var-registry job) — no
        # re-implementation.
        entry: >-
          python3 scripts/ci/check_env_var_registry.py
          --scan-dirs src/omniclaude plugins/onex/hooks/lib
          --registry .env.example
          --allowlist-file .env.allowlist
          --format text
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # ============================================================
      # STAGE 2: PRE-PUSH (thorough checks before sharing)
      # ============================================================

      - id: bandit-security
        name: bandit security scan
        entry: bash scripts/uv-run-worktree-safe.sh bandit -r -c .bandit
        language: system
        types: [python]
        exclude: '^\.[^/]*$|^\..*/.*|_archive/.*|tests/.*|lib/.*'
        pass_filenames: true
        stages: [pre-push]

      # OMN-14655: rescoped to the EXACT CI command (ci.yml "Mypy type checking"
      # step: `uv run mypy src/ --config-file mypy.ini`) so local == CI. The
      # previous entry ran `mypy src/omniclaude/hooks/ src/omniclaude/config/
      # --ignore-missing-imports` -- 2 of ~15 top-level src/omniclaude/
      # subdirs, no config file -- while claiming "match CI" in its name.
      # Missing-stub imports outside those 2 subdirs silently passed locally
      # and only ever failed on CI. pre-push is the thorough-checks stage
      # (not the <15s pre-commit budget), so the full-tree run belongs here.
      - id: mypy-type-check
        name: mypy (type checking - match CI)
        entry: bash scripts/uv-run-worktree-safe.sh mypy src/ --config-file mypy.ini
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pyright-type-check
        name: pyright (type checking - complements mypy)
        # Pyright provides complementary type checking to mypy, catching different error categories.
        # Uses pyrightconfig.json for configuration (basic mode with incremental strictness).
        entry: bash -c 'bash scripts/uv-run-worktree-safe.sh pyright src/omniclaude'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: onex-validate
        name: ONEX validation
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validate_onex.py
        language: system
        pass_filenames: false
        always_run: true
        # Exclude: hidden files, _archive, tests, and lib/ (legacy code, post-Beta deletion)
        stages: [pre-push]

      - id: validate-clean-root
        name: Validate clean root directory
        entry: bash scripts/validate-clean-root.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: validate-secrets
        name: ONEX Secret Detection
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_secrets.py
        language: system
        pass_filenames: true
        types: [python]
        exclude: '^\.[^/]*$|^\..*/.*|_archive/.*|tests/.*'
        stages: [pre-push]

      - id: validate-no-duplicate-models
        name: No duplicate model filenames
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_no_duplicate_models.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: validate-pydantic-patterns
        name: Pydantic pattern validation
        # Exit 2 = warnings only (non-blocking); exit 1 = errors (blocking)
        entry: bash -c 'bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_pydantic_patterns.py; rc=$?; [ $rc -eq 2 ] && exit 0 || exit $rc'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: validate-single-class-per-file
        name: Single class per file
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_single_class_per_file.py --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: validate-enum-governance
        name: ONEX Enum Governance Validation
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_enum_governance.py --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: validate-exports
        name: Validate __all__ exports
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_exports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # OMN-6747: Advisory DoD evidence check before push
      - id: dod-evidence-check
        name: DoD evidence advisory check
        entry: bash scripts/dod-pre-push-check.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: no-internal-ips
        name: Block hardcoded internal IPs
        language: system
        entry: >
          bash -c 'grep -rInE
          --include="*.py" --include="*.sh" --include="*.yml"
          --include="*.yaml" --include="*.toml" --include="*.md"
          --exclude-dir=.venv --exclude-dir=node_modules
          "(192\.168\.|10\.(0|1|2)\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)"
          src/ tests/ docs/ .github/ plugins/ 2>/dev/null
          | grep -v "onex-allow-internal-ip"
          && echo "ERROR: hardcoded internal IP found (add # onex-allow-internal-ip to suppress)" && exit 1 || exit 0'
        pass_filenames: false
        stages: [pre-commit]
      # OMN-13047 / Retro D-1: Concurrency-primitive clause.
      # Flags staged non-test Python additions that introduce seek_to_end /
      # poll / KafkaConsumer without a concurrent staged change under tests/.
      # Suppression: add ``# concurrency-ok`` to the flagged line.
      - id: concurrency-primitive-guard
        name: Concurrency primitive clause (OMN-13047)
        entry: python scripts/validation/validate_no_blocking_primitive_without_tests.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # OMN-3554: Reject hardcoded Kafka broker address fallbacks
      # Detects os.getenv("KAFKA_*", non-empty) and private-IP Kafka broker ports
      - id: kafka-no-hardcoded-fallback
        name: Reject hardcoded Kafka broker address fallbacks
        entry: >
          bash -c
          'FAILED=0;
          MATCHES=$(grep -rn --include="*.py"
          --exclude-dir=.venv
          --exclude-dir=__pycache__
          --exclude-dir=.claude
          --exclude-dir=scripts
          -E "os\.getenv\([[:space:]]*[\"'"'"']KAFKA_[^\"'"'"']+[\"'"'"'][[:space:]]*,[[:space:]]*[\"'"'"'][^\"'"'"']+[\"'"'"']"
          . 2>/dev/null |
          grep -v "kafka-fallback-ok" |
          grep -v "noqa");
          if [ -n "$MATCHES" ]; then
          echo "ERROR: Hardcoded Kafka bootstrap fallback detected:";
          echo "$MATCHES";
          echo "";
          echo "FIX: Remove the fallback value or add # kafka-fallback-ok";
          FAILED=1;
          fi;
          IP_MATCHES=$(grep -rn --include="*.py"
          --exclude-dir=.venv
          --exclude-dir=__pycache__
          --exclude-dir=.claude
          -E "192\.168\.[0-9]+\.[0-9]+:[0-9]{4,5}"
          . 2>/dev/null |
          grep -v "kafka-fallback-ok" |
          grep -v "noqa" |
          grep -v "onex-allow-internal-ip");
          if [ -n "$IP_MATCHES" ]; then
          echo "ERROR: Hardcoded private-IP Kafka broker address in Python file:";
          echo "$IP_MATCHES";
          echo "";
          echo "FIX: Use KAFKA_BOOTSTRAP_SERVERS env var or add # kafka-fallback-ok";
          FAILED=1;
          fi;
          exit $FAILED'
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      # OMN-7436: Detect hardcoded numeric fallback values in dashboard code
      # Catches ternary fallbacks (? 0.87 : 0.82) and hardcoded score assignments.
      # Suppression: add `# fallback-ok` to the flagged line.
      - id: no-hardcoded-fallbacks
        name: No hardcoded numeric fallbacks
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_no_hardcoded_fallbacks.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-ai-slop
        name: Check for AI-slop patterns
        language: system
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/check_ai_slop.py --strict
        types_or: [python, markdown]
        pass_filenames: true
        stages: [pre-commit]

      # OMN-14584: bare-name node-identity-keying check (fast, author-time).
      # Generalizes three independently-discovered-and-fixed incidents
      # (OMN-10865, OMN-14571, OMN-14575) into one AST-based gate: keying a
      # cross-package node/contract collection on a bare `.name` attribute
      # silently collapses same-named nodes from different packages.
      # Suppress a genuine false positive with # node-identity-keying-ok: <reason>
      - id: check-node-identity-keying
        name: Node-identity bare-name-keying check
        language: system
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/check_node_identity_keying.py
        types: [python]
        pass_filenames: true
        stages: [pre-commit]

      # OMN-8622: aislop prohibited-pattern check (fast, changed-files only)
      # Complements check-ai-slop (docstring/boilerplate patterns) by catching
      # prohibited env vars and compat-shims in changed Python files.
      # CRITICAL findings block commit; WARNING findings are informational.
      # Suppress with: # aislop: ignore
      - id: aislop-prohibited-patterns
        name: Aislop prohibited pattern check
        language: system
        entry: python scripts/ci/run_aislop_precommit.py
        types: [python]
        pass_filenames: true
        stages: [pre-commit]

      # Auto-generate ONEX orchestrator nodes for new skills (OMN-6815)
      # Detects skills with SKILL.md but no corresponding node directory and
      # scaffolds the node automatically via generate_skill_node.py.
      - id: auto-generate-skill-nodes
        name: Auto-generate skill orchestrator nodes
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/auto_generate_skill_nodes.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^plugins/onex/skills/

      # Skill backing-node liveness (OMN-10052) — blocks skill→node regressions.
      # Fires when SKILL.md files or the validator/allowlist change.
      # Set $OMNIMARKET_ROOT to the omnimarket repo root for local dev;
      # CI checks out omnimarket into _omnimarket/ automatically.
      - id: validate-skill-backing-node
        name: Skill backing-node liveness (OMN-10052)
        entry: bash scripts/uv-run-worktree-safe.sh python plugins/onex/skills/_lib/validate_skill_backing_node.py .
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-commit]
        files: ^(plugins/onex/skills/.*/SKILL\.md|plugins/onex/skills/_lib/validate_skill_backing_node\.py|plugins/onex/skills/_lib/skill_backing_node_allowlist\.yaml)$

      # Skill aspiration validation (OMN-9075) — blocks SKILL.md claims without
      # backing-node behavior for deterministic receipt/artifact/event claims.
      - id: validate-skill-aspiration
        name: Skill aspiration validation (OMN-9075)
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_skill_aspiration.py
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-commit]
        files: ^(plugins/onex/skills/.*/SKILL\.md|plugins/onex/skills/_lib/validate_skill_aspiration\.py|scripts/(extract_skill_claims|validation/validate_skill_aspiration)\.py)$

      # Skill hygiene (OMN-5200) — validates skill dir naming, structure, Python separation
      - id: skill-hygiene
        name: Skill Hygiene
        language: system
        entry: python scripts/validate_frontmatter.py
        pass_filenames: false
        stages: [pre-commit]
        files: ^plugins/onex/skills/
      # Skill contract validation (OMN-6193) — validates args parity, sub-skill refs,
      # duplicate frontmatter, spec-prompt predicates
      - id: skill-contract-validation
        name: Skill Contract Validation
        language: system
        entry: bash scripts/validate_skill_contracts_wrapper.sh
        pass_filenames: false
        stages: [pre-commit]
        files: ^plugins/onex/skills/
      # Instructional-skill enforcement (OMN-8766, S19)
      # Rejects partial-port of the deterministic dispatch contract into
      # Tier 3 instructional (pure-prose) skills. Forbids:
      #   - `onex run` / `onex run-node` dispatch commands
      #   - `rendered_output` receipt assertions
      # Dispatch belongs in Tier 1 (OMN-8749 / OMN-8765); rendered_output
      # belongs in deterministic-skill DoD evidence contracts.
      # Initial land: --report (non-blocking) because 3 pre-existing
      # violations live in authorize (1) + onboarding (2). Flip to blocking
      # once follow-up ticket clears them so "all 15 skills pass green".
      - id: validate-instructional-skill-routing
        name: ONEX Instructional Skill Enforcement (OMN-8766)
        language: system
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_instructional_skill_routing.py --report
        pass_filenames: false
        stages: [pre-commit]
        files: ^plugins/onex/skills/

      # Deterministic-skill routing enforcement (OMN-8749, wired under OMN-14808).
      # Tier 1 counterpart to validate-instructional-skill-routing (OMN-8766)
      # above. Every Tier 1 deterministic skill's SKILL.md must contain a node
      # dispatch instruction, a `SkillRoutingError` reference (the live wire
      # contract emitted by both dispatch CLIs), and no prose-fallback routing
      # instruction. BLOCKING (no --report): the reconciled tree is green, so
      # any NEW drift fails at commit. Stdlib-only validator -> bare python3
      # (matches the arch-* hooks). CI mirror:
      # .github/workflows/check-deterministic-skills.yml.
      - id: validate-deterministic-skill-routing
        name: ONEX Deterministic Skill Routing Enforcement (OMN-8749)
        language: system
        entry: python3 scripts/validation/validate_deterministic_skill_routing.py
        pass_filenames: false
        stages: [pre-commit]
        files: ^(plugins/onex/skills/.*/SKILL\.md|scripts/validation/validate_deterministic_skill_routing\.py)$
      # OMN-12237 (Wave 7): Reject new imperative patterns in skills/*/SKILL.md.
      # Imperative inline logic (Agent(, TeamCreate, curl, gh api, psql, ssh,
      # asyncio.run, direct http://localhost/192.168 calls) must live in nodes.
      # Escape hatch: append '# imperative-ok' to suppress a single line.
      # Allowlisted (PURE-SKILL) dirs: handoff, login, preflight, record_friction,
      # set_session, systematic_debugging, unstick_queue, using_git_worktrees,
      # worktree, writing_skills, authorize.
      - id: reject-imperative-skill-patterns
        name: Reject imperative patterns in skills (OMN-12237)
        entry: .pre-commit-hooks/reject-imperative-skill-patterns.sh
        language: script
        pass_filenames: true
        stages: [pre-commit]
        files: ^plugins/onex/skills/.*/SKILL\.md$

      # TEMPORARY Phase-0 migration gate (OMN-14687, epic OMN-14686): every
      # filesystem-discovered plugin component (skill / hook script / agent
      # config) must be classified in plugins/distribution_manifest.yaml with a
      # valid exposure (stable|beta|hidden|retired). Prevents an unclassified
      # component being added mid-migration. Phase 3 retires this hook + the
      # validator when the permanent typed distribution-contract checks land.
      - id: validate-distribution-classification
        name: Distribution Classification (OMN-14687, temporary Phase-0 gate)
        entry: python3 scripts/validation/validate_distribution_classification.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(plugins/onex/(skills|hooks/scripts|agents/configs)/|plugins/distribution_manifest\.yaml|scripts/validation/validate_distribution_classification\.py)

      # Topic naming lint — validate onex.{kind}.{producer}.{event}.v{n} convention
      # (OMN-3259) Triggers on any *.py change; always scans full source tree.
      # Pre-existing violations suppressed by scripts/validation/topic_naming_baseline.txt
      - id: topic-naming-lint
        name: Topic Naming Lint
        entry: bash scripts/validation/run_topic_lint.sh
        language: system
        types_or: [python]
        pass_filenames: false
        stages: [pre-commit]

      # Kafka broker URL fallback guard (OMN-3555)
      # Prevents bus split regressions caused by stale hardcoded broker addresses
      # in os.getenv() default/fallback strings (root cause of OMN-3534).
      # Flags: :19092, :29092 as hardcoded fallback values in source.  # cloud-bus-ok OMN-3777
      # Suppression: add `# onex-allow-kafka-broker` to the flagged line.
      - id: no-hardcoded-kafka-broker
        name: Block hardcoded Kafka broker URL fallbacks
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_no_hardcoded_kafka_broker.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # OMN-3777: Block cloud bus references in source code
      - id: no-cloud-bus
        name: Block cloud bus references
        entry: bash scripts/check_no_cloud_bus_wrapper.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: no-env-file
        name: Reject committed .env files (except .env.example)
        entry: >
          bash -c
          'if git diff --cached --name-only | grep -qE "(^|/)\\.env([._-].+)?$" | grep -vE "\\.env\\.example"; then
            echo "BLOCKED: .env staged — use ~/.omnibase/.env instead. Run: git reset HEAD <file>";
            exit 1;
          fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: validate-spdx-headers
        name: ONEX SPDX Header Requirement
        entry: bash scripts/uv-run-worktree-safe.sh onex spdx validate
        language: system
        pass_filenames: true
        files: ^(src|tests|scripts|examples)/.*\.(py|sh|bash|yml|yaml|toml)$
        exclude: ^(archived/|archive/)
        stages: [pre-commit]

      # Markdown link validation (OMN-5085) — replaces lychee-action in CI
      # Internal links only in pre-commit (fast). CI runs --check-external for full coverage.
      # Configuration: .markdown-link-check.json (ignore patterns ported from lychee excludes)
      - id: onex-validate-links
        name: Validate markdown links
        entry: bash scripts/uv-run-worktree-safe.sh onex-validate-links --verbose
        language: system
        types: [markdown]
        pass_filenames: false
        stages: [pre-commit]

      # OMN-5063: Block untyped metadata dict fields
      # Centralized in onex_change_control (OMN-5135)
      - id: no-untyped-metadata
        name: No untyped metadata dict fields
        language: system
        entry: bash scripts/uv-run-worktree-safe.sh check-no-untyped-metadata
        types: [python]
        exclude: ^tests/|^examples/|^scripts/

      - id: normalization-symmetry
        name: normalization-symmetry
        entry: uv run python -m omnibase_core.validation.checker_normalization_symmetry
        language: system
        pass_filenames: false

      # Hook bitmask drift check (OMN-9615)
      # Regenerates hook_bits.sh from EnumHookBit and fails if the committed
      # artifact is stale. Fires when hook_bits.sh is modified.
      - id: hook-bits-drift
        name: hook_bits.sh drift check (regenerate if EnumHookBit changes)
        entry: bash scripts/run-hook-bits-drift.sh
        language: system
        pass_filenames: false
        files: ^plugins/onex/hooks/lib/hook_bits\.sh$
        stages: [pre-commit]

      # OMN-14655 (D5, §3d.7): fail-loud meta-gate over this very file.
      # Hard-rejects the exit-0-on-missing-path / WARN-SKIP-degrade class
      # that made `skill-contract-validation` and `no-cloud-bus` false-green,
      # any undocumented SKIP/BYPASS-env-var-gated exit 0, and any `stages:`
      # value default_install_hook_types does not install. Wired as BOTH a
      # pre-commit hook (here) and a required CI gate
      # (.github/workflows/precommit-fail-loud-gate.yml) in this same PR so
      # the class cannot regenerate on the next wrapper script.
      - id: precommit-fail-loud-meta-gate
        name: Pre-commit fail-loud meta-gate (OMN-14655)
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_precommit_fail_loud.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        files: ^(\.pre-commit-config\.yaml|scripts/.*\.sh|\.pre-commit-hooks/.*\.sh)$

      # OMN-14655 (D5, §3d.8): pin-parity ratchet. Fails closed the moment
      # the pre-commit `rev:` pin for a shared omnibase_core validator
      # diverges from the SHA .github/workflows/ci.yml pins for the same
      # validator (the DRIFT-3 class that produced two disagreeing
      # omnibase_core blocks in this file before OMN-14655 converged them).
      - id: precommit-pin-parity
        name: Pre-commit/CI pin-parity check (OMN-14655)
        entry: bash scripts/uv-run-worktree-safe.sh python scripts/validation/validate_precommit_pin_parity.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/ci\.yml)$

# Configuration
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]
fail_fast: false

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [no-cloud-bus]  # Pre-existing 29092 violations — cleanup tracked separately  # cloud-bus-ok OMN-3777
  submodules: false
