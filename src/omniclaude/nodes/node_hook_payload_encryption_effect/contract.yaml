# ONEX Node Contract
# Node: NodeHookPayloadEncryptionEffect (OMN-19513)
#
# Operator RULING 2026-10-15T04:24:42Z: the hook capture records everything
# raw, and production has the option of encrypting the payload. The option is
# the payload_encryption block of contract_hook_claude_capture.yaml (off by
# default, key_secret_ref). With it on, the hook producers (hook.event and
# content.captured) seal each payload they journal under a key this node reads
# from the secret store by that reference; a reader holding the key opens it.
# The hook reaches it in-process: the hook process cannot wait on a bus
# round-trip, and the node publishes nothing, so ciphertext and key never take
# a topic of their own.

name: node_hook_payload_encryption_effect
version: "1.0.0"
contract_name: node_hook_payload_encryption_effect
node_name: node_hook_payload_encryption_effect

contract_version:
  major: 1
  minor: 0
  patch: 0

node_version:
  major: 1
  minor: 0
  patch: 0

node_type: EFFECT_GENERIC
runtime_profiles: [main]

description: >
  Seals and opens hook capture payloads with AES-256-GCM under a 32-byte key
  read from the secret store by key_secret_ref. The routing fields the emit
  registry needs stay readable and ride in the associated data. A key that
  cannot be read is a refused outcome, never a payload in the clear.

input_model:
  name: ModelHookPayloadEncryptionRequest
  module: omniclaude.nodes.node_hook_payload_encryption_effect.models

output_model:
  name: ModelHookPayloadEncryptionResult
  module: omniclaude.nodes.node_hook_payload_encryption_effect.models

handler:
  module: omniclaude.nodes.node_hook_payload_encryption_effect.handlers.handler_hook_payload_encryption
  class: HandlerHookPayloadEncryption
  input_model: omniclaude.nodes.node_hook_payload_encryption_effect.models.ModelHookPayloadEncryptionRequest

handler_routing:
  routing_strategy: payload_type_match
  handlers:
    - handler:
        name: HandlerHookPayloadEncryption
        module: omniclaude.nodes.node_hook_payload_encryption_effect.handlers.handler_hook_payload_encryption
      event_model:
        name: ModelHookPayloadEncryptionRequest
        module: omniclaude.nodes.node_hook_payload_encryption_effect.models

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: false
  timeout_ms: 10000

capabilities:
  - name: hook.payload.encryption
    description: Seal and open hook capture payloads under a key from the secret store
    version: 1.0.0

# In-process, like node_captured_secret_store_effect: no subscription and no
# publication. The payload goes to the journal, not to a topic of this node.
event_bus:
  subscribe_topics: []
  publish_topics: []

metadata:
  author: OmniNode Team
  license: MIT
  ticket: OMN-19513
  maturity: alpha
  tags:
    - effect
    - hooks
    - capture
    - encryption
