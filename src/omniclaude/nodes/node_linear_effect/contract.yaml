# ONEX Node Contract
# Node: NodeLinearEffect
#
# Capability-oriented effect node for Linear ticketing operations.
# Named by capability ("linear.ticketing"), not by vendor.
# Principle: "I'm interested in what you do, not what you are"
#
# INVARIANT: No direct Linear API calls (LinearClient, linear_client) are
# permitted outside this effect node.

# Contract identifiers
name: node_linear_effect
version: "0.1.0"
contract_name: node_linear_effect
node_name: node_linear_effect

contract_version:
  major: 1
  minor: 0
  patch: 0

node_version:
  major: 1
  minor: 0
  patch: 0

# Node type
node_type: EFFECT_GENERIC

# Description
description: >
  Capability-oriented effect node for Linear ticketing operations.
  Handles ticket fetch, status update, and comment operations.
  This is the only node permitted to call the Linear API.

# Strongly typed I/O models
input_model:
  name: ModelLinearRequest
  module: omniclaude.nodes.node_linear_effect.models

output_model:
  name: ModelLinearResult
  module: omniclaude.nodes.node_linear_effect.models

# Capabilities
capabilities:
  - name: linear.ticketing
    description: Linear ticket operations
    version: 1.0.0

  - name: linear.ticketing.ticket_get
    description: Fetch a Linear ticket by ID

  - name: linear.ticketing.ticket_update_status
    description: Update the workflow status of a ticket

  - name: linear.ticketing.ticket_add_comment
    description: Add a comment to a ticket

  - name: linear.ticketing.ticket_create
    description: Create a new Linear ticket

  - name: linear.ticketing.ticket_tick_acceptance
    description: Tick the acceptance boxes a contract-bound check covers, and optionally set Done, through the Done-flip guard's repo-evidence bar (OMN-17427)

  - name: linear.ticketing.done_receipt_policy
    description: >
      handler_done_receipt_policy owns contract parsing, current-revision hashes,
      criterion bindings and fail-closed hook execution for the plugin entrypoint.

  - name: linear.ticketing.closeout_instruction_audit
    description: >
      handler_done_closeout_instructions audits skill and workflow roots for
      retired closeout instructions and refuses unreadable audit roots.

# IO operations
io_operations:
  - operation: ticket_get
    description: Fetch a Linear ticket by identifier
    protocol_method: ticket_get
    input_fields:
      - ticket_id: str
      - correlation_id: UUID | None
    output_fields:
      - result: ModelLinearResult
    idempotent: true

  - operation: ticket_update_status
    description: Update the workflow status of a ticket
    protocol_method: ticket_update_status
    input_fields:
      - ticket_id: str
      - status: str
      - correlation_id: UUID | None
    output_fields:
      - result: ModelLinearResult
    idempotent: true

  - operation: ticket_add_comment
    description: Add a comment to a Linear ticket
    protocol_method: ticket_add_comment
    input_fields:
      - ticket_id: str
      - body: str
      - correlation_id: UUID | None
    output_fields:
      - result: ModelLinearResult
    idempotent: false

  - operation: ticket_create
    description: Create a new Linear ticket
    protocol_method: ticket_create
    input_fields:
      - title: str
      - description: str
      - team_id: str
      - correlation_id: UUID | None
    output_fields:
      - result: ModelLinearResult
    idempotent: false

  - operation: ticket_tick_acceptance
    description: >
      Tick every labelled unchecked acceptance box and, with set_done, set Done in
      a second edit. The Done-flip guard judges each proposed edit with lane-safe
      evidence readers; a refused tick writes nothing and a refused Done keeps the tick.
      apply=false is a dry run.
    protocol_method: ticket_tick_acceptance
    input_fields:
      - ticket_id: str
      - apply: bool
      - set_done: bool
      - correlation_id: UUID | None
    output_fields:
      - result: ModelLinearResult
    idempotent: true

# Dependencies
dependencies:
  - name: protocol_linear_ticketing
    type: protocol
    class_name: ProtocolLinearTicketing
    module: omniclaude.nodes.node_linear_effect.protocols
    pluggable: true

# Handler routing
handler_routing:
  routing_strategy: backend_match
  handlers:
    - operation: ticket_tick_acceptance
      event_model:
        module: omniclaude.nodes.node_linear_effect.models
        name: ModelLinearRequest
      handler:
        module: omniclaude.nodes.node_linear_effect.handlers.handler_linear_ticketing
        name: HandlerLinearApi
      output_events: [ModelLinearResult]
    - operation: ticket_tick_acceptance_evidence
      event_model:
        module: omniclaude.nodes.node_linear_effect.models
        name: ModelLinearRequest
      handler:
        module: omniclaude.nodes.node_linear_effect.handlers.handler_lane_repo_evidence
        name: LaneRepoEvidence
      output_events: [ModelLinearResult]
    - operation: ticket_done_flip_hook_evidence
      event_model:
        module: omniclaude.nodes.node_linear_effect.models
        name: ModelLinearRequest
      handler:
        module: omniclaude.nodes.node_linear_effect.handlers.handler_hook_evidence_readers
        name: HookEvidenceReaders
      output_events: [ModelLinearResult]
    - operation: ticket_pr_state_local
      event_model:
        module: omniclaude.nodes.node_linear_effect.models
        name: ModelLocalPrStateRequest
      handler:
        module: omniclaude.nodes.node_linear_effect.handlers.handler_local_pr_state
        name: HandlerLocalPrState
      output_events: [ModelLocalPrStateResult]
    - operation: ticket_done_receipt_policy
      handler:
        module: omniclaude.nodes.node_linear_effect.handlers.handler_done_receipt_policy
        name: run_hook
    - operation: ticket_closeout_instruction_audit
      event_model:
        module: omniclaude.nodes.node_linear_effect.models
        name: ModelCloseoutInstructionAuditRequest
      handler:
        module: omniclaude.nodes.node_linear_effect.handlers.handler_done_closeout_instructions
        name: HandlerDoneCloseoutInstructions
      output_events: [ModelCloseoutInstructionAuditResult]
  default_backend: linear_api
  backends:
    - backend: linear_api
      handler_key: linear_api
      handler:
        name: HandlerLinearApi
        module: omniclaude.nodes.node_linear_effect.handlers.handler_linear_ticketing

# Invariants
invariants:
  - no_linear_client_outside_handler: true
  - done_requires_current_bound_pass_receipt: true
  - acceptance_tick_requires_current_bound_pass_receipt: true
  - done_guard_error_refuses: true
  - closeout_instructions_require_bound_receipts: true

# Linear API endpoint, read by handler_linear_ticketing (OMN-21791)
linear_api:
  graphql_host: api.linear.app

# Error handling
error_handling:
  retry_policy:
    max_retries: 3
    initial_delay_ms: 500
    max_delay_ms: 10000
    exponential_base: 2
    retry_on:
      - LinearApiRateLimitError
      - LinearApiNetworkError
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    reset_timeout_ms: 60000

# Metadata
metadata:
  author: OmniNode Team
  license: MIT
  ticket: OMN-2593
  maturity: stub
  tags:
    - effect
    - linear
    - ticketing
