# ONEX Node Contract
# Node: NodeClaudeCodeBindingInstallEffect (OMN-18531, plan task T0.3)

name: node_claude_code_binding_install_effect
version: "1.0.0"
contract_name: node_claude_code_binding_install_effect
node_name: node_claude_code_binding_install_effect

contract_version:
  major: 1
  minor: 0
  patch: 0

node_version:
  major: 1
  minor: 0
  patch: 0

node_type: EFFECT_GENERIC
runtime_profiles: [main]

description: >
  Writes the rendered module to the Claude Code mods location (never inside a repository), reads it back and compares its sha256 with the render's, and writes additive registrations into the user settings only. Installs only rows whose probe rows the capability report marks supported.

input_model:
  name: ModelBindingInstallRequest
  module: omniclaude.nodes.node_claude_code_binding_install_effect.models

output_model:
  name: ModelBindingInstallResult
  module: omniclaude.nodes.node_claude_code_binding_install_effect.models

handler:
  module: omniclaude.nodes.node_claude_code_binding_install_effect.handlers.handler_binding_install
  class: HandlerClaudeCodeBindingInstall
  input_model: omniclaude.nodes.node_claude_code_binding_install_effect.models.ModelBindingInstallRequest

handler_routing:
  routing_strategy: payload_type_match
  handlers:
    - handler:
        name: HandlerClaudeCodeBindingInstall
        module: omniclaude.nodes.node_claude_code_binding_install_effect.handlers.handler_binding_install
      event_model:
        name: ModelBindingInstallRequest
        module: omniclaude.nodes.node_claude_code_binding_install_effect.models

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  timeout_ms: 5000

capabilities:
  - name: hook.claude_code.binding_install
    description: Install the rendered Claude Code binding for this host
    version: 1.0.0

event_bus:
  subscribe_topics:
    - onex.cmd.omniclaude.claude-code-binding-install.v1
  publish_topics:
    - onex.evt.omniclaude.claude-code-binding-installed.v1

runtime_dispatch:
  command_topic: onex.cmd.omniclaude.claude-code-binding-install.v1
  terminal_events:
    success: onex.evt.omniclaude.claude-code-binding-installed.v1

terminal_event: onex.evt.omniclaude.claude-code-binding-installed.v1

metadata:
  author: OmniNode Team
  license: MIT
  ticket: OMN-18531
  maturity: alpha
  tags:
    - claude-code
    - hooks
