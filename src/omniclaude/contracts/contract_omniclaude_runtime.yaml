#
# Service contract for the omniclaude runtime plugin.
# Scanned by seed-infisical.py to register env vars in Infisical.
# NOT a node contract — node_type SERVICE is intentional.
# ContractConfigExtractor ignores node_type (confirmed: contract_config_extractor.py:156-241).

name: "omniclaude_runtime"
contract_name: "omniclaude_runtime"
node_type: "SERVICE"

contract_version:
  major: 1
  minor: 0
  patch: 0

description: >
  Runtime plugin service contract. Declares environment variables required by
  PluginClaude.wire_dispatchers(). Scanned by ContractConfigExtractor which
  ignores node_type and processes all contracts uniformly.

dependencies:
  - name: "contracts_root"
    type: "environment"
    env_var: "OMNICLAUDE_CONTRACTS_ROOT"
    description: >
      Path to omniclaude skill node contracts directory (node_skill_*/contract.yaml).
      Dev: /Volumes/PRO-G40/Code/omni_home/omniclaude/src/omniclaude/nodes  # local-path-ok
      Docker: /app/src/omniclaude/nodes
    required: true

descriptor:
  # Diagnostics service endpoints — OMN-13560 Wave-1 endpoint->overlay migration
  # (epic OMN-13556). The lib/utils/diagnostics health-check tool previously read
  # these endpoints via scattered direct os.environ.get(...) calls. They are now
  # declared here with the ${env.VAR} overlay convention so an operator overlay /
  # the per-lane service env supplies the real endpoint per lane — never a
  # hardcoded localhost in source. diagnostics_endpoint_descriptor.py resolves
  # each value via the ${env.VAR} overlay expander (the single sanctioned env
  # boundary). The strict accessor fails closed (unset/blank raises rather than
  # silently defaulting to localhost); the non-strict accessor resolves to empty
  # so the fail-soft diagnostics tool reports a not-configured endpoint without
  # crashing. The MCP endpoint preserves its legacy alias chain
  # (MCP_SERVER_URL -> ONEX_MCP_URL -> ARCHON_MCP_URL).
  diagnostics_intelligence_service_url: "${env.INTELLIGENCE_SERVICE_URL}"
  diagnostics_main_server_url: "${env.MAIN_SERVER_URL}"
  diagnostics_mcp_server_url: "${env.MCP_SERVER_URL}"
  diagnostics_mcp_server_url_legacy_onex: "${env.ONEX_MCP_URL}"
  diagnostics_mcp_server_url_legacy_archon: "${env.ARCHON_MCP_URL}"

aggregator:
  # Session-aggregation tunables — OMN-13560 Wave-2 config->overlay migration
  # (epic OMN-13556). ConfigSessionAggregator previously bound these via
  # pydantic-settings env_file/.env with the OMNICLAUDE_AGGREGATOR_ prefix.
  # They are now declared here with the ${env.VAR:default} overlay convention so
  # a per-lane operator overlay supplies the value, and the in-source default
  # rides along inline. ConfigSessionAggregator.from_contract() resolves each
  # value via the shared ${env.VAR} overlay expander (the single sanctioned env
  # boundary) and applies the field-level pydantic bounds. An unset var with no
  # inline default fails closed at the pydantic validation boundary.
  session_inactivity_timeout_seconds: "${env.OMNICLAUDE_AGGREGATOR_SESSION_INACTIVITY_TIMEOUT_SECONDS:3600}"
  session_max_duration_seconds: "${env.OMNICLAUDE_AGGREGATOR_SESSION_MAX_DURATION_SECONDS:2592000}"
  orphan_buffer_duration_seconds: "${env.OMNICLAUDE_AGGREGATOR_ORPHAN_BUFFER_DURATION_SECONDS:300}"
  out_of_order_buffer_seconds: "${env.OMNICLAUDE_AGGREGATOR_OUT_OF_ORDER_BUFFER_SECONDS:60}"
  clock_skew_tolerance_seconds: "${env.OMNICLAUDE_AGGREGATOR_CLOCK_SKEW_TOLERANCE_SECONDS:30}"
  seal_delay_seconds: "${env.OMNICLAUDE_AGGREGATOR_SEAL_DELAY_SECONDS:60}"
  tool_count_streaming_threshold: "${env.OMNICLAUDE_AGGREGATOR_TOOL_COUNT_STREAMING_THRESHOLD:1000}"
  max_orphan_sessions: "${env.OMNICLAUDE_AGGREGATOR_MAX_ORPHAN_SESSIONS:10000}"
  duplicate_detection_window_seconds: "${env.OMNICLAUDE_AGGREGATOR_DUPLICATE_DETECTION_WINDOW_SECONDS:86400}"
  timeout_sweep_interval_seconds: "${env.OMNICLAUDE_AGGREGATOR_TIMEOUT_SWEEP_INTERVAL_SECONDS:60}"
  finalized_session_warning_threshold: "${env.OMNICLAUDE_AGGREGATOR_FINALIZED_SESSION_WARNING_THRESHOLD:10000}"
  finalized_session_warning_interval_seconds: "${env.OMNICLAUDE_AGGREGATOR_FINALIZED_SESSION_WARNING_INTERVAL_SECONDS:3600}"

timeouts:
  # Runtime timeouts in seconds -- OMN-21623 contracts-and-DI burn-down. The trace
  # frame assembler and replay engine, the diagnostics and health-check tools and
  # the coverage scanner passed these as
  # integer literals at each subprocess or HTTP call. ModelRuntimeTimeouts
  # .from_contract() overlay-resolves each value and the callers receive the model
  # injected; a per-lane overlay sets the env var, the inline default rides along.
  trace_git_diff_seconds: "${env.OMNICLAUDE_TIMEOUT_TRACE_GIT_DIFF_SECONDS:10}"
  trace_git_identity_seconds: "${env.OMNICLAUDE_TIMEOUT_TRACE_GIT_IDENTITY_SECONDS:5}"
  trace_environment_hash_seconds: "${env.OMNICLAUDE_TIMEOUT_TRACE_ENVIRONMENT_HASH_SECONDS:10}"
  trace_lint_check_seconds: "${env.OMNICLAUDE_TIMEOUT_TRACE_LINT_CHECK_SECONDS:15}"
  trace_type_check_seconds: "${env.OMNICLAUDE_TIMEOUT_TRACE_TYPE_CHECK_SECONDS:30}"
  diagnostics_curl_health_seconds: "${env.OMNICLAUDE_TIMEOUT_DIAGNOSTICS_CURL_HEALTH_SECONDS:5}"
  diagnostics_docker_seconds: "${env.OMNICLAUDE_TIMEOUT_DIAGNOSTICS_DOCKER_SECONDS:10}"
  diagnostics_http_seconds: "${env.OMNICLAUDE_TIMEOUT_DIAGNOSTICS_HTTP_SECONDS:5}"
  health_check_httpx_seconds: "${env.OMNICLAUDE_TIMEOUT_HEALTH_CHECK_HTTPX_SECONDS:5}"
  health_check_base_seconds: "${env.OMNICLAUDE_TIMEOUT_HEALTH_CHECK_BASE_SECONDS:2}"
  health_check_pattern_seconds: "${env.OMNICLAUDE_TIMEOUT_HEALTH_CHECK_PATTERN_SECONDS:5}"
  health_check_post_seconds: "${env.OMNICLAUDE_TIMEOUT_HEALTH_CHECK_POST_SECONDS:3}"
  replay_clone_seconds: "${env.OMNICLAUDE_TIMEOUT_REPLAY_CLONE_SECONDS:60}"
  replay_checkout_seconds: "${env.OMNICLAUDE_TIMEOUT_REPLAY_CHECKOUT_SECONDS:30}"
  replay_apply_seconds: "${env.OMNICLAUDE_TIMEOUT_REPLAY_APPLY_SECONDS:30}"
  coverage_cache_ttl_seconds: "${env.OMNICLAUDE_TIMEOUT_COVERAGE_CACHE_TTL_SECONDS:3600}"
  coverage_pytest_seconds: "${env.OMNICLAUDE_TIMEOUT_COVERAGE_PYTEST_SECONDS:300}"
  coverage_git_log_seconds: "${env.OMNICLAUDE_TIMEOUT_COVERAGE_GIT_LOG_SECONDS:30}"

model_routing:
  # Model ids omniclaude code uses by default — OMN-21780 (child of OMN-21623).
  # No model id lives in the repository: an operator overlay / the per-lane service
  # env supplies each value through the ${env.VAR} overlay convention, and
  # ModelModelRouting.from_contract() resolves it. An unset value resolves empty.
  savings_baseline_model: "${env.OMNICLAUDE_SAVINGS_BASELINE_MODEL}"
  # Tier -> model map per provider, as a JSON object, used when the provider
  # config file carries no entry for the provider.
  gemini_tier_models: "${env.OMNICLAUDE_GEMINI_TIER_MODELS_JSON}"
  zai_tier_models: "${env.OMNICLAUDE_ZAI_TIER_MODELS_JSON}"
  # Quorum members the manifest lists, as a JSON array of objects with name,
  # model, provider, weight and use_case.
  intelligence_models: "${env.OMNICLAUDE_INTELLIGENCE_MODELS_JSON}"

service_endpoints:
  # Service endpoints omniclaude code falls back to — OMN-21727 (child of OMN-21623).
  # The operator overlay / per-lane service env supplies each value through the
  # ${env.VAR[:default]} overlay convention; ModelServiceEndpointDefaults.from_contract()
  # resolves it.
  # OpenAI-compatible embeddings endpoint ManifestInjector._embed_text posts to. No
  # default lives in the repository: an unset value resolves empty.
  embedding_service_url: "${env.EMBEDDING_SERVICE_URL}"
  # Valkey URL IntelligenceCache uses when neither redis_url nor settings.valkey_url is
  # given; VALKEY_PASSWORD, when set, is added as the URL's credential.
  valkey_default_url: "${env.OMNICLAUDE_VALKEY_DEFAULT_URL:redis://onex-valkey:6379/0}"

metadata:
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-02-28"
  ticket: "OMN-2990"
  tags:
    - service
    - runtime
    - config
    - omniclaude

runtime_paths:
  # Filesystem locations omniclaude code uses — OMN-21728 (child of OMN-21623).
  # Code holds no path: ModelRuntimePaths.from_contract() resolves each value through
  # the ${env.VAR:default} overlay convention, so an operator overlay / the per-lane
  # service env supplies the location and the default rides along here.
  hook_socket: "${env.OMNICLAUDE_HOOK_RUNTIME_SOCKET:/tmp/omniclaude-hook-runtime.sock}"
  hook_pid: "${env.OMNICLAUDE_HOOK_RUNTIME_PID:/tmp/omniclaude-hook-runtime.pid}"
  session_marker_dir: "${env.OMNICLAUDE_SESSION_INJECTION_MARKER_DIR:/tmp/omniclaude-sessions}"
  usage_cache: "${env.OMNICLAUDE_USAGE_CACHE_PATH:/tmp/omniclaude-usage-cache.json}"
  linear_relay_dedup_db: "${env.OMNICLAUDE_LINEAR_RELAY_DEDUP_DB:/tmp/linear_relay_dedup.db}"
  opencode_db: "${env.OMNICLAUDE_OPENCODE_DB:~/.local/share/opencode/opencode.db}"
  store_reader_home: "${env.OMNICLAUDE_STORE_READER_HOME:~/.onex}"
  onex_state_dir: "${env.OMNICLAUDE_DEFAULT_ONEX_STATE_DIR:~/.onex_state}"
  pattern_tracking_log_dir: "${env.OMNICLAUDE_PATTERN_TRACKING_LOG_DIR:~/Library/Logs}"
  registry_root: "${env.OMNI_HOME}"
