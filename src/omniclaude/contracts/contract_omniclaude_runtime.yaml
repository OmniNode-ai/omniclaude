#
# Service contract for the omniclaude runtime plugin.
# Scanned by seed-infisical.py to register env vars in Infisical.
# NOT a node contract — node_type SERVICE is intentional.
# ContractConfigExtractor ignores node_type (confirmed: contract_config_extractor.py:156-241).

name: "omniclaude_runtime"
contract_name: "omniclaude_runtime"
node_type: "SERVICE"

contract_version:
  major: 1
  minor: 0
  patch: 0

description: >
  Runtime plugin service contract. Declares environment variables required by
  PluginClaude.wire_dispatchers(). Scanned by ContractConfigExtractor which
  ignores node_type and processes all contracts uniformly.

dependencies:
  - name: "contracts_root"
    type: "environment"
    env_var: "OMNICLAUDE_CONTRACTS_ROOT"
    description: >
      Path to omniclaude skill node contracts directory (node_skill_*/contract.yaml).
      Dev: /Volumes/PRO-G40/Code/omni_home/omniclaude/src/omniclaude/nodes  # local-path-ok
      Docker: /app/src/omniclaude/nodes
    required: true

descriptor:
  # Diagnostics service endpoints — OMN-13560 Wave-1 endpoint->overlay migration
  # (epic OMN-13556). The lib/utils/diagnostics health-check tool previously read
  # these endpoints via scattered direct os.environ.get(...) calls. They are now
  # declared here with the ${env.VAR} overlay convention so an operator overlay /
  # the per-lane service env supplies the real endpoint per lane — never a
  # hardcoded localhost in source. diagnostics_endpoint_descriptor.py resolves
  # each value via the ${env.VAR} overlay expander (the single sanctioned env
  # boundary). The strict accessor fails closed (unset/blank raises rather than
  # silently defaulting to localhost); the non-strict accessor resolves to empty
  # so the fail-soft diagnostics tool reports a not-configured endpoint without
  # crashing. The MCP endpoint preserves its legacy alias chain
  # (MCP_SERVER_URL -> ONEX_MCP_URL -> ARCHON_MCP_URL).
  diagnostics_intelligence_service_url: "${env.INTELLIGENCE_SERVICE_URL}"
  diagnostics_main_server_url: "${env.MAIN_SERVER_URL}"
  diagnostics_mcp_server_url: "${env.MCP_SERVER_URL}"
  diagnostics_mcp_server_url_legacy_onex: "${env.ONEX_MCP_URL}"
  diagnostics_mcp_server_url_legacy_archon: "${env.ARCHON_MCP_URL}"

aggregator:
  # Session-aggregation tunables — OMN-13560 Wave-2 config->overlay migration
  # (epic OMN-13556). ConfigSessionAggregator previously bound these via
  # pydantic-settings env_file/.env with the OMNICLAUDE_AGGREGATOR_ prefix.
  # They are now declared here with the ${env.VAR:default} overlay convention so
  # a per-lane operator overlay supplies the value, and the in-source default
  # rides along inline. ConfigSessionAggregator.from_contract() resolves each
  # value via the shared ${env.VAR} overlay expander (the single sanctioned env
  # boundary) and applies the field-level pydantic bounds. An unset var with no
  # inline default fails closed at the pydantic validation boundary.
  session_inactivity_timeout_seconds: "${env.OMNICLAUDE_AGGREGATOR_SESSION_INACTIVITY_TIMEOUT_SECONDS:3600}"
  session_max_duration_seconds: "${env.OMNICLAUDE_AGGREGATOR_SESSION_MAX_DURATION_SECONDS:2592000}"
  orphan_buffer_duration_seconds: "${env.OMNICLAUDE_AGGREGATOR_ORPHAN_BUFFER_DURATION_SECONDS:300}"
  out_of_order_buffer_seconds: "${env.OMNICLAUDE_AGGREGATOR_OUT_OF_ORDER_BUFFER_SECONDS:60}"
  clock_skew_tolerance_seconds: "${env.OMNICLAUDE_AGGREGATOR_CLOCK_SKEW_TOLERANCE_SECONDS:30}"
  seal_delay_seconds: "${env.OMNICLAUDE_AGGREGATOR_SEAL_DELAY_SECONDS:60}"
  tool_count_streaming_threshold: "${env.OMNICLAUDE_AGGREGATOR_TOOL_COUNT_STREAMING_THRESHOLD:1000}"
  max_orphan_sessions: "${env.OMNICLAUDE_AGGREGATOR_MAX_ORPHAN_SESSIONS:10000}"
  duplicate_detection_window_seconds: "${env.OMNICLAUDE_AGGREGATOR_DUPLICATE_DETECTION_WINDOW_SECONDS:86400}"
  timeout_sweep_interval_seconds: "${env.OMNICLAUDE_AGGREGATOR_TIMEOUT_SWEEP_INTERVAL_SECONDS:60}"
  finalized_session_warning_threshold: "${env.OMNICLAUDE_AGGREGATOR_FINALIZED_SESSION_WARNING_THRESHOLD:10000}"
  finalized_session_warning_interval_seconds: "${env.OMNICLAUDE_AGGREGATOR_FINALIZED_SESSION_WARNING_INTERVAL_SECONDS:3600}"

metadata:
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-02-28"
  ticket: "OMN-2990"
  tags:
    - service
    - runtime
    - config
    - omniclaude
