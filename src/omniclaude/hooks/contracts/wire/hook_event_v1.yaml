# Wire schema contract for the complete Claude Code hook capture envelope.
topic: "onex.evt.omniclaude.hook-event.v1"  # onex-topic-sot
schema_version: "1.0.0"
ticket: "OMN-19513"
description: >
  One discriminated metadata envelope for all 33 Claude Code 2.1.283 hook
  events, plus the two events a plugin hook derives (OMN-18946: GuardRefusal,
  AssistantUsage). Full content is represented only by deterministic references.

producer:
  repo: "omniclaude"
  file: "plugins/onex/hooks"
  function: "to be wired by a build task"

consumer:
  repo: "omnimarket"
  file: "node_projection_claude_hook_events"
  model: "to be built"

partition_key:
  field: "lineage.session_id"
  type: "string"
  rationale: "Preserves per-session order across all hook types for the lineage fold."

required_fields:
  - {name: event_id, type: uuid, description: "Deterministic event identity."}
  - {name: schema_version, type: literal, value: "1.0.0"}
  - {name: hook_event_name, type: EnumClaudeHookEventName}
  - {name: emitted_at, type: datetime, description: "Explicit timezone-aware timestamp."}
  - {name: actor, type: literal, value: claude}
  - {name: lineage, type: ModelHookLineage}
  - {name: payload, type: ModelHookPayload, discriminator: hook_event_name}
  - {name: content_refs, type: "tuple[ModelHookContentRef, ...]"}

optional_fields:
  - name: claude_code_version
    type: string
    nullable: true
    description: "Producer-observed Claude Code version."
  - name: host
    type: string
    nullable: true
    description: "OMN-17427: hostname of the emitting machine. Omitted when unknown."

# OMN-20031: payload keys present only on one event. Every one is an id, name,
# count or flag, never content; the consumer allowlist (ALLOWED_PAYLOAD_KEYS)
# must declare them or the event dead-letters. OMN-18946 adds the keys of the
# two derived events (GuardRefusal, AssistantUsage).
payload_optional_fields:
  - hook: PreToolUse
    name: goal_id
    type: uuid
    description: >
      Canonical lowercase uuid from a leading ONEX_GOAL=<uuid> assignment of a
      Bash command. Absent on every other event.
  - hook: PreToolUse
    name: parent_goal_id
    type: uuid
    description: >
      Canonical lowercase uuid from ONEX_PARENT_GOAL=<uuid> directly after
      ONEX_GOAL. Only present together with goal_id.
  - hook: PostToolUse
    name: exit_code
    type: integer
    description: >
      OMN-17427: 0 for a Bash call the harness reported as succeeded. Absent
      for every other tool and when the response states no status.
  - hook: PostToolUseFailure
    name: exit_code
    type: integer
    description: >
      OMN-17427: the n of the harness's "Exit code <n>" Bash failure text.
      Absent for every other tool and failure.

  - hook: GuardRefusal
    name: guard
    type: string
    description: >
      OMN-18946: required on this event. The refusing guard's script name,
      scrubbed and cut to 64 characters.
  - hook: GuardRefusal
    name: reason_class
    type: string
    description: >
      OMN-18946: required on this event. The guard's normalised reason token,
      never the refusal's text.
  - hook: GuardRefusal
    name: refused_hook_event_name
    type: string
    description: "OMN-18946: the harness hook the guard was refusing at, e.g. PreToolUse."
  - hook: AssistantUsage
    name: model
    type: string
    description: "OMN-18946: required on this event. The model id the API ran."
  - hook: AssistantUsage
    name: message_count
    type: integer
    description: "OMN-18946: required. Distinct API messages counted."
  - hook: AssistantUsage
    name: usage_source_hook
    type: string
    description: "OMN-18946: required. Stop, SubagentStop or SessionEnd."
  - hook: AssistantUsage
    name: partial_window
    type: boolean
    description: "OMN-18946: required. True when the first read took only a transcript tail."

content_topic:
  name: "onex.cmd.omniintelligence.content-captured.v1"  # onex-topic-sot
  reference_only: true
  record_model: ModelHookContentRecord

compatibility:
  supersedes_legacy_topics: false
  legacy_topics_untouched:
    - "onex.evt.omniclaude.session-started.v1"  # onex-topic-sot
    - "onex.evt.omniclaude.prompt-submitted.v1"  # onex-topic-sot
    - "onex.evt.omniclaude.tool-executed.v1"  # onex-topic-sot
    - "onex.evt.omniclaude.session-ended.v1"  # onex-topic-sot
