# Wire schema contract for onex.evt.omniclaude.session-started.v1
topic: "onex.evt.omniclaude.session-started.v1"  # onex-topic-sot
schema_version: "1.0.0"
ticket: "OMN-7360"
description: >
  Session start event emitted by Claude Code hooks. Establishes the correlation_id
  for all subsequent events in the session lifecycle.

# OMN-17047: registered hook -> journal appender -> hook_emit_drainer.py
# -> node_event_emit_effect registry fan-out. Consumers are runtime contract
# bindings, checked by validate_hook_callees.py; process health is a live probe.
producer:
  repo: omniclaude
  file: plugins/onex/hooks/scripts/session_start_bus_mirror.sh
  hook_event: SessionStart
  event_type: session.started
  emitter:
    file: plugins/onex/hooks/lib/hook_emit_append.py
    function: append_event
consumers:
- repo: omnimarket
  contract: src/omnimarket/nodes/node_projection_session_replay/contract.yaml
  file: src/omnimarket/nodes/node_projection_session_replay/handlers/handler_projection_session_replay.py
  class: HandlerProjectionSessionReplay
  model: ModelSessionReplayEvent
  model_file: src/omnimarket/nodes/node_projection_session_replay/models/model_session_replay.py
- repo: omnimarket
  contract: src/omnimarket/nodes/node_projection_hook_ledger/contract.yaml
  file: src/omnimarket/nodes/node_projection_hook_ledger/handlers/handler_hook_ledger_projection.py
  class: HandlerHookLedgerProjection
  model: ModelHookLedgerProjectionRequest
  model_file: src/omnimarket/nodes/node_projection_hook_ledger/models/model_hook_ledger_event.py
- repo: omnimarket
  contract: src/omnimarket/nodes/node_projection_work_events/contract.yaml
  file: src/omnimarket/nodes/node_projection_work_events/handlers/handler_projection_work_events.py
  class: HandlerProjectionWorkEvents
  model: ModelWorkEventInbound
  model_file: src/omnimarket/nodes/node_projection_work_events/models/model_work_event.py
- repo: omnimarket
  contract: src/omnimarket/nodes/node_session_phase_reducer/contract.yaml
  file: src/omnimarket/nodes/node_session_phase_reducer/handlers/handler_session_phase_reducer.py
  class: HandlerSessionPhaseReducer
  model: ModelSessionPhaseReducerInput
  model_file: src/omnimarket/nodes/node_session_phase_reducer/handlers/handler_session_phase_reducer.py

required_fields:
  - name: "entity_id"
    type: "uuid"
    description: "Session identifier as UUID (partition key for ordering)."
  - name: "session_id"
    type: "string"
    description: "Session identifier string."
  - name: "correlation_id"
    type: "uuid"
    description: "Correlation ID for distributed tracing."
  - name: "causation_id"
    type: "uuid"
    description: "ID of the event or trigger that caused this event."
  - name: "emitted_at"
    type: "datetime"
    description: "Timestamp when the hook emitted this event (UTC)."
  - name: "working_directory"
    type: "string"
    description: "Current working directory of the session."
  - name: "hook_source"
    type: "string"
    description: "What triggered the session start (startup, resume, clear, compact)."

optional_fields:
  - name: "task_id"
    type: "string"
    nullable: true
    description: "Stable task identifier for cross-session correlation."
  - name: "git_branch"
    type: "string"
    nullable: true
    description: "Current git branch if in a git repository."
  - name: "action_description"
    type: "string"
    nullable: false
    description: "Human-readable description for consumer display."
