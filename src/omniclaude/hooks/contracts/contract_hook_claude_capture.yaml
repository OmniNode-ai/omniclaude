projection:
  source_topic: "onex.evt.omniclaude.hook-event.v1"  # onex-topic-sot
  implementation_note: >
    The omnimarket builder must implement a pure fold plus an effect-class writer
    as two classes. No SQL or writer implementation belongs in this contract PR.
  event_table:
    name: omninode_internal.claude_hook_events
    primary_key: [event_id]
    columns:
      - {name: event_id, type: uuid, nullable: false}
      - {name: session_id, type: text, nullable: false}
      - {name: agent_id, type: text, nullable: true}
      - {name: is_subagent, type: boolean, nullable: false}
      - {name: agent_type, type: text, nullable: true}
      - {name: parent_tool_use_id, type: text, nullable: true}
      - {name: parent_agent_id, type: text, nullable: true, derived: true}
      - {name: workflow_run_id, type: text, nullable: true}
      - {name: spawn_depth, type: integer, nullable: true}
      - {name: hook_event_name, type: text, nullable: false}
      - {name: tool_use_id, type: text, nullable: true}
      - {name: tool_name, type: text, nullable: true}
      - {name: prompt_id, type: text, nullable: true}
      - {name: turn_id, type: text, nullable: true}
      - {name: correlation_id, type: uuid, nullable: false}
      - {name: causation_id, type: uuid, nullable: true}
      - {name: emitted_at, type: timestamptz, nullable: false}
      - {name: payload, type: jsonb, nullable: false, content: "metadata only"}
      - {name: content_ref_ids, type: "text[]", nullable: false}
      - {name: source_topic, type: text, nullable: false}
      - {name: ingested_at, type: timestamptz, nullable: false}
  lineage_table:
    name: omninode_internal.claude_agent_spans
    primary_key: [session_id, agent_id]
    columns:
      - {name: session_id, type: text, nullable: false}
      - {name: agent_id, type: text, nullable: false}
      - {name: agent_type, type: text, nullable: true}
      - {name: parent_tool_use_id, type: text, nullable: true}
      - {name: parent_agent_id, type: text, nullable: true}
      - {name: workflow_run_id, type: text, nullable: true}
      - {name: spawn_depth, type: integer, nullable: true}
      - {name: started_at, type: timestamptz, nullable: false}
      - {name: stopped_at, type: timestamptz, nullable: true}
      - {name: tool_call_count, type: integer, nullable: false}
      - {name: parent_resolution, type: text, nullable: false, values: [main_thread, resolved, workflow, unknown]}
  fold_rules:
    parent_agent_id: >
      Find the PreToolUse in the same session whose tool_use_id equals the
      event's parent_tool_use_id; use that event's agent_id.
    parent_resolution: >
      main_thread when that PreToolUse was found and carried no agent_id;
      resolved when it carried an agent_id (a nested subagent); workflow when
      the sidecar was a Workflow sidecar (workflow_run_id set, no toolUseId);
      unknown when the sidecar was unreadable at emit time (parent_tool_use_id
      and workflow_run_id both null) or the parent PreToolUse was never seen.
      unknown is NOT main_thread: a null parent_agent_id alone cannot tell the
      two apart, which is why this column exists.
    open_span: >
      Open on SubagentStart, or on the first event carrying that agent_id when
      SubagentStart was missed.
    close_span: "Close on SubagentStop."
    tool_call_count: >
      Count PostToolUse plus PostToolUseFailure events carrying that agent_id.

known_gaps:
  - >
    Claude Code 2.1.283 PermissionRequest stdin carries no tool_use_id, so its
    causation_id is null.
  - >
    SubagentStart carries no spawning tool_use_id. Parent linkage depends on the
    harness sidecar being readable at emit time; when it is not,
    parent_tool_use_id is null and the span's parent_resolution is unknown.
  - >
    Subagents share their parent's session_id (measured on the lab: this lane's
    own tool rows land under its orchestrator's session id), so agent_id is the
    ONLY discriminator between a subagent's events and the main thread's.

seams:
  model_module: src/omniclaude/hooks/model_claude_hook_event.py
  fixture_directory: tests/fixtures/hooks/claude_hook_capture
  generator: scripts/generate_claude_hook_capture_fixtures.py
  check_command: "uv run python scripts/generate_claude_hook_capture_fixtures.py --check"
  producer: "omniclaude plugins/onex/hooks; to be wired by a build task"
  projection_consumer: "omnimarket node_projection_claude_hook_events; to be built"

timestamp_policy:
  explicit_injection: true
  timezone_required: true
  default_factory_forbidden: true
