  - hook: StopFailure
    registered_today: false
    reaches_bus_today: false
    build_priority: P0
    metadata_fields: [error]
    content_fields: {error_details: capture_verbatim, last_assistant_message: capture_verbatim}
  - hook: SubagentStart
    registered_today: false
    reaches_bus_today: false
    build_priority: P0
    metadata_fields: [agent_id, agent_type]
    content_fields: {}
  - hook: SubagentStop
    registered_today: true
    reaches_bus_today: false
    build_priority: P0
    metadata_fields: [stop_hook_active, agent_id, agent_type]
    content_fields: {agent_transcript_path: capture_verbatim, last_assistant_message: capture_verbatim}
  - hook: PreCompact
    registered_today: false
    reaches_bus_today: false
    build_priority: P0
    metadata_fields: [trigger]
    content_fields: {custom_instructions: capture_verbatim}
  - hook: PostCompact
    registered_today: false
    reaches_bus_today: false
    build_priority: P0
    metadata_fields: [trigger]
    content_fields: {compact_summary: capture_verbatim}
  - hook: PreModelSwitch
    registered_today: false
    reaches_bus_today: false
    build_priority: P2
    metadata_fields: []
    content_fields: {}
  - hook: PostModelSwitch
    registered_today: false
    reaches_bus_today: false
    build_priority: P2
    metadata_fields: []
    content_fields: {}
  - hook: PermissionRequest
    registered_today: false
    reaches_bus_today: false
    build_priority: P1
    metadata_fields: [tool_name, suggestion_count]
    content_fields: {}
  - hook: PermissionDenied
    registered_today: false
    reaches_bus_today: false
    build_priority: P0
    metadata_fields: [tool_name]
    content_fields: {reason: capture_verbatim}
  - hook: Setup
    registered_today: false
    reaches_bus_today: false
    build_priority: P2
    metadata_fields: [trigger]
    content_fields: {}
  - hook: TeammateIdle
    registered_today: false
