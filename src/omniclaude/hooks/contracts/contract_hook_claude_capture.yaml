redaction:
  class_names: [capture_verbatim, capture_hashed, capture_shape_only, never_capture]
  topic: "onex.evt.omniclaude.hook-event.v1"  # onex-topic-sot
  default_field_class: capture_hashed
  rationale: >
    Every declared verbatim field is an identifier, enum, name, count, boolean,
    timestamp, deterministic digest, or content-record UUID. Arbitrary values are
    represented only by refs. Any future undeclared metadata field fails safe to a
    canonical-JSON sha256 digest.
  fields:
    event_id: capture_verbatim
    schema_version: capture_verbatim
    hook_event_name: capture_verbatim
    emitted_at: capture_verbatim
    actor: capture_verbatim
    claude_code_version: capture_verbatim
    lineage.session_id: capture_verbatim
    lineage.agent_id: capture_verbatim
