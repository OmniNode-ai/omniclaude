name: claude_hook_capture
contract_version: "1.0.0"
claude_code_version_measured: "2.1.283"
status: seam_first
description: >
  Instrumentation contract for capturing every Claude Code hook event with
  deterministic lineage metadata. This contract adds a lineage-carrying capture
  alongside the four legacy topics and supersedes nothing.

topics:
  metadata:
    name: "onex.evt.omniclaude.hook-event.v1"  # onex-topic-sot
    model: ModelClaudeHookEvent
    schema_version: "1.0.0"
    partition_key: session_id
    rationale: >
      One topic covers all hook types. Adding a hook type therefore requires one
      model and one fixture instead of a topic, registry entry, ACL, and writer
      subscription. Partitioning by session_id preserves per-session order across
      every hook type, which the lineage fold requires.
  restricted_content:
    name: "onex.cmd.omniintelligence.content-captured.v1"  # onex-topic-sot
    ownership: "omnimarket#2905 and omniclaude#2343"
    note: >
      Referenced by name only in this PR. Full prompt, tool input, tool response,
      assistant message, compact summary, display delta, errors, notifications,
      elicitation content, and paths are restricted content records, never metadata.
  legacy_coexistence:
    topics:
      - "onex.evt.omniclaude.session-started.v1"  # onex-topic-sot
      - "onex.evt.omniclaude.prompt-submitted.v1"  # onex-topic-sot
      - "onex.evt.omniclaude.tool-executed.v1"  # onex-topic-sot
      - "onex.evt.omniclaude.session-ended.v1"  # onex-topic-sot
    note: "The new capture coexists with these topics and supersedes none of them."

identity:
  namespace_uuid: "9449178f-fb63-5b0d-b17d-379aafbcfe67"
  correlation_id: "uuid5(NAMESPACE, session_id)"
  event_id: >
    uuid5(NAMESPACE, canonical JSON of [session_id, agent_id or "",
    hook_event_name, tool_use_id or "", prompt_id or "", emitted_at isoformat])
  tool_call_key: "uuid5(NAMESPACE, session_id + '|' + tool_use_id)"
  causation: >
    tool_call_key is carried by PreToolUse payloads and is the causation_id for
    PostToolUse, PostToolUseFailure, PermissionDenied, and PermissionRequest when
    Claude Code supplies a tool_use_id. This joins tool-call pairs without relying
    on the PreToolUse emission timestamp. Claude Code 2.1.283 does not include
    tool_use_id in PermissionRequest stdin, so that event's causation_id is null
    until the upstream schema supplies one; the mapper does not invent an ID.
  content_record_id: "uuid5(NAMESPACE, str(event_id) + '|' + field_name)"
  content_hash: "sha256 over the emitted string or canonical JSON string"

lineage:
  fields:
    session_id: {type: string, required: true, non_blank: true}
    agent_id: {type: string, nullable: true, meaning: "null means main thread"}
    agent_type: {type: string, nullable: true}
    is_subagent: {type: boolean, invariant: "equals (agent_id is not null)"}
    parent_tool_use_id: {type: string, nullable: true, source: "sidecar.toolUseId"}
    workflow_run_id: {type: string, nullable: true, source: "sidecar path caller"}
    spawn_depth: {type: integer, nullable: true, source: "sidecar.spawnDepth"}
    tool_use_id: {type: string, nullable: true}
    prompt_id: {type: string, nullable: true}
    turn_id: {type: string, nullable: true}
    correlation_id: {type: uuid, required: true}
    causation_id: {type: uuid, nullable: true}
  parent_agent_id: >
    Deliberately absent from the event. The ordered projection fold derives it
    from the PreToolUse carrying parent_tool_use_id.
  sidecar: >
    SubagentStart has no spawning tool_use_id. ModelSubagentSidecar accepts the
    harness keys agentType, description, model, requestNonInteractive,
    requestShape, spawnDepth, and exactly one of toolUseId or workflowPhase.
    workflow_run_id is supplied by the caller from the workflow sidecar path.

content_reference:
  fields: [field, sha256, length, content_record_id]
  event_rule: >
    The envelope content_refs tuple lists each content reference used by the
    typed payload exactly once. The metadata topic contains references only.
  record_model: ModelHookContentRecord
  content_value_rule: >
    String values remain strings; non-string arbitrary JSON is serialized as
    canonical JSON. Content records are destined only for the restricted family.
  scrub_rule: >
    map_hook_stdin takes a REQUIRED content_scrubber with no default. The
    producer MUST pass the production span scrub of the restricted content
    family (the capture_redaction.yaml secret_patterns set). Each serialized
    value is scrubbed FIRST; sha256 and length are computed over the scrubbed
    value, so no hash on the metadata topic is ever derived from a secret.
    redaction_state (clean | secret_detected) and matched_pattern_names travel
    on the content record. The generator's mock_content_scrubber is a fixture
    stand-in with one pattern, not a production control.

# In the coverage table, content_fields name the class each field takes on the
# RESTRICTED content family. capture_verbatim there means verbatim WITH the
# secret-pattern scrub on top (capture_redaction.yaml: verbatim is not exempt
# from scrubbing); it never means unscrubbed. Nothing in content_fields ever
# reaches the metadata topic, which carries only the content reference.
coverage:
  - hook: PreToolUse
    registered_today: true
    reaches_bus_today: false
    build_priority: P0
    metadata_fields: [tool_name, mcp_server, tool_call_key, tool_input_keys]
    content_fields: {tool_input: capture_verbatim}
  - hook: PostToolUse
    registered_today: true
    reaches_bus_today: true
    legacy_without_lineage: true
    build_priority: P0
    metadata_fields: [tool_name, duration_ms, interrupted]
    content_fields: {tool_response: capture_verbatim}
  - hook: PostToolUseFailure
    registered_today: false
    reaches_bus_today: false
    build_priority: P0
    metadata_fields: [tool_name, duration_ms, is_interrupt]
    content_fields: {error: capture_verbatim}
  - hook: PostToolBatch
    registered_today: false
    reaches_bus_today: false
    build_priority: P1
    metadata_fields: [tool_use_ids, tool_names]
    content_fields: {}
  - hook: Notification
    registered_today: false
    reaches_bus_today: false
    build_priority: P1
    metadata_fields: [notification_type]
    content_fields: {title: capture_verbatim, message: capture_verbatim}
  - hook: UserPromptSubmit
    registered_today: true
    reaches_bus_today: true
    legacy_without_lineage: true
    build_priority: P0
    metadata_fields: [prompt_length, source]
    content_fields: {prompt: capture_verbatim, session_title: capture_verbatim}
  - hook: UserPromptExpansion
    registered_today: false
    reaches_bus_today: false
    build_priority: P1
    metadata_fields: [expansion_type, command_name, command_source]
    content_fields: {command_args: capture_verbatim, prompt: capture_verbatim}
  - hook: SessionStart
    registered_today: true
    reaches_bus_today: true
    legacy_without_lineage: true
    build_priority: P0
    metadata_fields: [source, model, context_tokens, seconds_since_last_response, prompt_cache_likely_expired]
    content_fields: {}
  - hook: SessionEnd
    registered_today: true
    reaches_bus_today: true
