    fields:
      session_id: capture_verbatim
      tool_name: capture_verbatim
      duration_ms: capture_verbatim
      interrupted: capture_verbatim
      hook_source: capture_verbatim
      working_directory: capture_verbatim
      correlation_id: capture_verbatim
      causation_id: capture_verbatim
      emitted_at: capture_verbatim
      entity_id: capture_verbatim
      schema_version: capture_verbatim
      # OMN-18609 -- lane attribution and hook fire time. Declared here
      # because this contract's default_field_class is capture_hashed, so a
      # field the emitter adds and this file does not name arrives as a
