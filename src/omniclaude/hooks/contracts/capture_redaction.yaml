  "onex.evt.omniclaude.prompt-submitted.v1":
    ticket: OMN-16979
    reason: >
      Prompt telemetry. The prompt body never crosses: `prompt` and
      `prompt_b64` are dropped outright rather than hashed, because a hash of
      a short prompt is a lookup handle. `prompt_preview` -- which the legacy
      `strip_prompt` transform truncates to 100 chars and which OMN-16019
