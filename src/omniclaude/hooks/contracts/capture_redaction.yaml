      # judgement. `lane` is a slug constrained by the lane registry's own
      # validator; `lane_source` is one of three constants
      # (registry | unresolved | unavailable); `lane_ticket` is an OMN
      # identifier; `workspace_path` is WORKSPACE-RELATIVE and can never be
      # an absolute local path -- the emitter degrades a path outside the
      # workspace to its basename precisely so this declaration is true;
      # `hook_fired_at` is a timestamp. None carries a tool argument, a tool
      # output, a prompt or a filesystem location outside the workspace.
      lane: capture_verbatim
      lane_source: capture_verbatim
      lane_ticket: capture_verbatim
      workspace_path: capture_verbatim
      hook_fired_at: capture_verbatim
      prompt: never_capture
      prompt_b64: never_capture
      prompt_preview: capture_shape_only
    # The transform this rule replaces (`strip_prompt`) did not only drop
    # `prompt` -- it derived `prompt_length` from it when the producer had not
    # supplied one. Dropping a field is a redaction; silently dropping the
    # SIGNAL that survived the redaction is a regression, so the derivation is
    # declared here rather than lost. It runs only when the target is absent
    # and the source is present, matching strip_prompt's own
    # `if "prompt_length" not in result` guard, and it reads the source
    # BEFORE that source is dropped.
    derived_fields:
      prompt_length:
        from: prompt
        derive: length

