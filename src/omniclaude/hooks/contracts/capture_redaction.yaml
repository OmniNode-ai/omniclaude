#
# CAPTURE REDACTION CONTRACT (OMN-17209, landed via the OMN-17399 residual).
#
# This file is the redaction posture. It is not documentation of one, and it is
# not a mirror of one that lives in Python. `redaction.py` resolves THIS file;
# it holds no field names, no topic names and no secret patterns of its own,
# and `test_capture_redaction_contract.py` asserts that by scanning the module.
#
# WHY IT EXISTS. OMN-17209's framing: "widening the payload without landing
# this contract first ships a credential pipeline." Three dated live incidents
# are its RED corpus -- OMN-17154 (`valkey-cli config get requirepass` printed
# a plaintext password), 2026-08-19 morning (`kubectl get secret -o json`
# printed a `clientSecret`), 2026-08-19 evening (`env | grep POSTGRES` printed
# a `postgresql://user:pw@host` URL). In all three the control was a regex
# added AFTER the leak, so it was always one incident behind.
#
# WHAT IS ACTUALLY ON THE WIRE TODAY (live readback, .201 stability lane,
# 2026-09-04T14:22Z, `rpk topic consume ... -o -2`):
#
#   tool-executed.v1   {duration_ms, hook_source, interrupted, session_id,
#                       tool_name, working_directory} + enrichment
#   prompt-submitted.v1{hook_source, prompt_length, session_id,
#                       working_directory} + enrichment
#
# Both are already content-free: the hook scripts emit length-only and
# name-only payloads. So this contract removes nothing from today's traffic --
# and that is the point. It is the FAIL-CLOSED FLOOR that OMN-17206 (C10, tool
# args) and OMN-17207 (C11, diff bodies) land on top of. Any field those
# tickets add that is not named `capture_verbatim` here is hashed on arrival,
# with no further action by their authors.
#
# HOW TO WIDEN CAPTURE. Add the field here, with a class and a reason. Adding
# a pattern to a Python constant is not a substitute and is rejected by
# `test_no_python_side_pattern_constants`.

contract_version: {major: 1, minor: 0, patch: 0}
ticket: OMN-17209

# ---------------------------------------------------------------------------
# Capture classes
# ---------------------------------------------------------------------------
# capture_verbatim   value crosses unchanged (the secret scrub below still runs
#                    on top of it -- verbatim is not exempt from scrubbing)
# capture_hashed     value replaced by sha256:<64 hex> over its canonical JSON
#                    form. Deterministic and unsalted ON PURPOSE: a salt would
#                    make the record unreplayable, which the deterministic
#                    truth doctrine forbids. An unsalted hash of a LOW-entropy
#                    value is brute-forceable, so hashing is the fail-closed
#                    default for fields nobody has classified -- it is NOT the
#                    protection for a field known to hold a secret. Use
#                    never_capture for those.
# capture_shape_only value replaced by {type, length} -- no content, no hash,
#                    so not even a lookup handle for a short value
# never_capture      field is dropped from the payload entirely
# capture_scrubbed   (OMN-19550) value crosses, but every span that matches a
#                    secret pattern below is replaced IN PLACE by scrub_marker,
#                    and the record's state becomes `secret_detected`. The
#                    full-content topic needs this: hashing a whole 60 KB tool
#                    result because one line held a token would throw away the
#                    content the operator ruled must be captured. Class still
#                    beats field: an always-hashed output class forces a
#                    scrubbed content field to capture_hashed, exactly as it
#                    forces a verbatim one. A scrubbed field is also held to its
#                    topic's content_policy size bound (see the topic entry).

# FAIL-CLOSED DEFAULT. Any field on a governed topic that is not named below.
# A new tool, or a field a future ticket adds, cannot leak by being forgotten.
default_field_class: capture_hashed

# ---------------------------------------------------------------------------
# Always-hashed output classes (OMN-17209 scope 2)
# ---------------------------------------------------------------------------
# These hash BECAUSE OF WHAT THEY ARE, never because a pattern fired. DoD probe
# 4 is the whole point: an SSM send-command result containing no secret-shaped
# text at all is still hashed. A regex that has not been written yet cannot
# save you; a class does not need to recognise the secret to refuse it.
#
# `content_fields` names the fields a matched record forces to capture_hashed,
# overriding any per-field class. They are listed here BEFORE OMN-17206 /
# OMN-17207 emit them, which is the sequencing this ticket exists to enforce.
always_hashed_output_classes:
  - name: ssm_send_command
    reason: >
      SSM send-command output is a class of output that should never be
      captured verbatim regardless of whether a pattern matches it -- it
      routinely carries whatever the remote command printed.
    tool_names: ["Bash"]
    command_pattern: '(?i)\baws\s+ssm\s+(send-command|get-command-invocation)\b'
  - name: kubectl_secret_read
    reason: >
      2026-08-19 morning incident: `kubectl get secret -o json` printed a
      `clientSecret`. The camelCase key pattern was added reactively after.
    tool_names: ["Bash"]
    command_pattern: '(?i)\bkubectl\s+(get|describe)\s+secret'
  - name: redis_valkey_config_get
    reason: >
      OMN-17154: `valkey-cli config get requirepass` printed the plaintext
      credential. The value has no key=value framing and no prefix, so the
      pattern set does not reliably catch it -- the class does.
    tool_names: ["Bash"]
    command_pattern: '(?i)\b(valkey-cli|redis-cli)\b.*\bconfig\s+get\b'
  - name: environment_dump
    reason: >
      2026-08-19 evening incident: `env | grep -i POSTGRES` printed a
      `postgresql://user:pw@host` URL.
    tool_names: ["Bash"]
    command_pattern: '(?i)(^|[;&|]\s*)(env|printenv|set)\b'
  - name: aws_credential_command
    reason: >
      `aws sts get-session-token` / `aws sso` output carries live session
      credentials by construction.
    tool_names: ["Bash"]
    command_pattern: '(?i)\baws\s+(sts|sso|secretsmanager|ssm\s+get-parameter)\b'
  - name: secret_path_read
    reason: >
      The tool INPUT (a path) is innocuous; the OUTPUT is not. Applies to any
      tool that reads file content, not just Bash.
    tool_names: ["Read", "Bash", "Grep"]
    command_pattern: '(?i)(\.env(\.[A-Za-z0-9_.-]+)?$|\.env[/\s"'']|/\.aws/credentials|/\.ssh/id_[a-z0-9]+$|\.pem$|\.p12$|\.kubeconfig$|/secrets?/)'

  # The field the class matcher reads to decide. Declared here rather than
  # hardcoded so a producer that names its command field differently is a
  # contract edit, not a code edit.
command_fields: ["command", "tool_input_command", "tool_input"]
tool_name_field: "tool_name"

# Fields any matched class forces to capture_hashed. Not emitted by any hook
# today (verified live 2026-09-04) -- listed so OMN-17206 / OMN-17207 land
# inside the floor rather than beside it.
content_fields:
  - "command"
  - "tool_input"
  - "tool_input_command"
  - "tool_response"
  - "tool_output"
  - "stdout"
  - "stderr"
  - "output"
  - "result"
  - "diff"
  - "content"
  - "new_string"
  - "old_string"

# ---------------------------------------------------------------------------
# Secret-pattern scrub (OMN-17209 scope 3)
# ---------------------------------------------------------------------------
# Applied ON TOP of every class, including capture_verbatim. A field that was
# going to cross verbatim and matches one of these is hashed instead, and the
# record's redaction_state becomes `secret_detected`.
#
# This is the ONE shared pattern set. It is deliberately the weakest of the
# three controls here, and is listed last for that reason: the incident record
# says every one of these was written after the leak it would have caught.
secret_patterns:
  # ORDER IS LOAD-BEARING for the capture_scrubbed class (OMN-19550), which
  # replaces each matched SPAN in list order: a whole PEM block is removed
  # before any narrower pattern can match a fragment of its body, and a whole
  # header line before the bearer pattern could leave its scheme behind. For
  # the whole-field classes order does not matter: any hit is a hit.
  - name: pem_private_key_block
    # OMN-19550: widened from the BEGIN line alone to the whole block, so a
    # span replacement removes the key body and not just its first line. A
    # block cut off by truncation or a chunk edge has no END line, so the
    # second alternative takes everything after BEGIN. Search behaviour for
    # the whole-field classes is unchanged: the match still starts at BEGIN.
    pattern: '-----BEGIN [A-Z ]*PRIVATE KEY-----(?:[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----|[\s\S]*)'
  - name: authorization_header
    # OMN-19550: "never auth headers" (RULING 2026-09-25T11:23:30Z). Inline
    # (curl -H "Authorization: ...") as well as at the start of a line; the
    # value runs to the end of the line or a closing quote.
    pattern: '(?i)\b(?:proxy-)?authorization\s*:\s*[^\r\n"'']+'
  - name: credential_header
    pattern: '(?i)\b(?:x-api-key|api-key|x-auth-token|x-amz-security-token|set-cookie|cookie)\s*:\s*[^\r\n"'']+'
  - name: url_authority_credentials
    # OMN-19550: the quantifiers are BOUNDED. The unbounded form
    # ('[a-zA-Z][a-zA-Z0-9+.-]*://...') is quadratic on a long alphanumeric run
    # with no '://' in it: 1.2 s on 40,000 characters, measured 2026-09-25, so
    # about 50 minutes on one 2 MiB tool result. It was harmless while every
    # governed field was a short name or id; full content made it a stall.
    # A URI scheme is at most a few characters, and a userinfo field longer
    # than 256 is not one this pattern needs to find.
    pattern: '[a-zA-Z][a-zA-Z0-9+.-]{0,31}://[^/\s:@]{1,256}:[^/\s@]{1,256}@'
  - name: bearer_token
    pattern: '(?i)\bbearer\s+[A-Za-z0-9._~+/-]{16,}'
  - name: github_token
    pattern: '\b(?:gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,})'
  - name: provider_secret_key
    # Anthropic (sk-ant-...), OpenAI (sk-proj-..., sk-...) and every other
    # "sk-" secret key shape.
    pattern: '\bsk-[A-Za-z0-9_-]{20,}'
  - name: slack_token
    pattern: '\bxox[abposr]-[A-Za-z0-9-]{10,}'
  - name: linear_api_key
    # OMN-19078: a bare Linear key was the one the PostToolUse guard missed.
    pattern: '\blin_(?:api|oauth)_[A-Za-z0-9]{32,}'
  - name: google_api_key
    pattern: '\bAIza[0-9A-Za-z_-]{35}'
  - name: stripe_key
    pattern: '\b(?:sk|rk|pk)_(?:live|test)_[A-Za-z0-9]{16,}'
  - name: jwt
    pattern: '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'
  - name: aws_access_key_id
    pattern: '\b(AKIA|ASIA)[0-9A-Z]{16}\b'
  - name: json_secret_key
    # OMN-19550: a JSON object key NAMING a credential, with a string value.
    # labelled_secret_assignment cannot see this shape, because the closing
    # quote sits between the key word and the colon. Tool inputs cross the
    # content topic as JSON, so this is the shape they arrive in.
    # Bounded for the same reason as url_authority_credentials: a JSON key is
    # not 64 characters long, and an unbounded run is a backtracking hazard.
    pattern: '(?i)"[A-Za-z0-9_.-]{0,64}(?:pass(?:word|wd)?|secret|token|api[_-]?key|access[_-]?key|private[_-]?key|credentials?)[A-Za-z0-9_.-]{0,64}"\s*:\s*"[^"]*"'
  - name: camel_case_secret_key
    pattern: '"(?:[a-z]{1,64})?(?:Secret|Token|Password|ApiKey|AccessKey|PrivateKey)"\s*:\s*"[^"]+"'
  - name: labelled_secret_assignment
    pattern: '(?i)\b(pass(word|wd)?|secret|token|api[_-]?key|access[_-]?key|private[_-]?key|requirepass|client[_-]?secret|auth)\b\s*[:=]\s*\S+'

# The text a capture_scrubbed field carries in place of each matched span.
# `{name}` is the pattern's name, so a reader can count what was removed and
# by which rule without ever seeing the value. It must match no pattern above,
# so scrubbing is idempotent: a second pass over scrubbed text changes nothing
# (asserted by test, because the fan-out re-applies the contract per chunk).
scrub_marker: "[REDACTED:{name}]"

# ---------------------------------------------------------------------------
# Governed topics
# ---------------------------------------------------------------------------
# A topic is governed when its fan_out rule in the event registry names the
# `redact_capture` transform. A rule that names it and has no entry here is a
# hard refusal (UngovernedTopicError) -- an empty policy would silently mean
# "hash everything", which reads identical to a working one.
#
# Enrichment fields (correlation_id, causation_id, emitted_at, entity_id,
# schema_version) are injected BEFORE the transform runs, so they must be
# declared or they would be hashed. session_id in particular is the declared
# partition_key_field for both topics and the key is derived POST-transform:
# hashing it would silently repartition the topic.
topics:
  "onex.evt.omniclaude.session-started.v1":
    ticket: OMN-16979
    reason: >
      Session lifecycle metadata. The session identifier and source are needed
      for correlation; the working-directory label is reduced to its shape.
    fields:
      session_id: capture_verbatim
      hook_source: capture_verbatim
      working_directory: capture_shape_only
      correlation_id: capture_verbatim
      causation_id: capture_verbatim
      emitted_at: capture_verbatim
      entity_id: capture_verbatim
      schema_version: capture_verbatim
      # OMN-18609 -- lane attribution and hook fire time. Declared here
      # because this contract's default_field_class is capture_hashed, so a
      # field the emitter adds and this file does not name arrives as a
      # sha256 digest. That is the contract working, not failing: the first
      # live readback of these fields returned `lane=sha256:f0a20dd8...`,
      # which is unusable as a grouping key and would have shipped a reader
      # that grouped by a digest.
      #
      # Each one is safe to capture verbatim by construction, not by
      # judgement. `lane` is a slug constrained by the lane registry's own
      # validator; `lane_source` is one of three constants
      # (registry | unresolved | unavailable); `lane_ticket` is an OMN
      # identifier; `workspace_path` is WORKSPACE-RELATIVE and can never be
      # an absolute local path -- the emitter degrades a path outside the
      # workspace to its basename precisely so this declaration is true;
      # `hook_fired_at` is a timestamp. None carries a tool argument, a tool
      # output, a prompt or a filesystem location outside the workspace.
      lane: capture_verbatim
      lane_source: capture_verbatim
      lane_ticket: capture_verbatim
      workspace_path: capture_verbatim
      hook_fired_at: capture_verbatim

  "onex.evt.omniclaude.session-ended.v1":
    ticket: OMN-16979
    reason: >
