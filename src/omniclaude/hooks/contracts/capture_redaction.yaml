  "onex.cmd.omniintelligence.content-captured.v1":
    ticket: OMN-19550
    reason: >
      Full-content capture, ruled by the operator on 2026-09-25 (RULING row
      2026-09-25T11:23:30Z): the complete prompt, tool input, tool result and
      assistant reply, so full context joins to deterministic outcomes as
      labelled training and eval data. One record carries one content item,
      or one chunk of it. The two content fields are capture_scrubbed:
      credential-shaped spans are replaced in place and everything else
      crosses. The identifiers are verbatim so the record joins to
      work_events on session_id, turn_id and correlation_id. It is a cmd
      topic on purpose: omniclaude's privacy split puts previews and metrics
      on onex.evt.omniclaude.* (broad access) and full prompts and file
      contents only on the restricted onex.cmd.omniintelligence.* family.
      It is also LOCAL: the cloud relay forwards an explicit topic allowlist
      (omnibase_infra node_bus_forwarder_effect/contract.yaml) that does not
      name it, and the ruling puts prod and cloud clusters out of scope until
      MSK capture is ruled.
    fields:
      session_id: capture_verbatim
      turn_id: capture_verbatim
      correlation_id: capture_verbatim
      causation_id: capture_verbatim
      emitted_at: capture_verbatim
      entity_id: capture_verbatim
      schema_version: capture_verbatim
      hook_source: capture_verbatim
      actor: capture_verbatim
      # prompt | tool_input | tool_response | assistant_reply
      content_kind: capture_verbatim
      tool_name: capture_verbatim
      tool_use_id: capture_verbatim
      # The size policy's bookkeeping: which chunk this is, of how many, the
      # sha256 of the chunks concatenated (so a reader can verify a
      # reassembly), the full length before the cap, and whether the cap cut
      # it. Counts and a digest -- no content.
      chunk_index: capture_verbatim
      chunk_count: capture_verbatim
      content_sha256: capture_verbatim
      original_chars: capture_verbatim
      truncated: capture_verbatim
      # {pattern name: count} from the producer's pass over the WHOLE content
      # before it was chunked. Carried because the fan-out re-applies this
      # contract per chunk and restamps the state, which would otherwise lose
      # the fact that a producer-side span was removed. Names and counts only.
      producer_redaction: capture_verbatim
      lane: capture_verbatim
      lane_source: capture_verbatim
      lane_ticket: capture_verbatim
      workspace_path: capture_verbatim
      hook_fired_at: capture_verbatim
      # The content. Both are also listed in content_fields above, so an
      # always-hashed output class (a kubectl secret read, an SSM call, an
      # environment dump, a .env read) still hashes them whole.
      content: capture_scrubbed
      # For a tool item, the command (Bash) or path (Read, Grep) the output
      # classes match on. Scrubbed, because a command can carry a credential
      # (curl -H "Authorization: ...").
      command: capture_scrubbed
      # Named so that a producer that ever attaches them cannot publish them,
      # whatever their content (RULING: "never auth headers or tokens").
      headers: never_capture
      authorization: never_capture
    content_policy:
      # Per record, per capture_scrubbed field, enforced at the fan-out: a
      # longer value is cut to this length and `truncated_field` is set true,
      # so an oversize record cannot reach the broker (Redpanda's default
      # message cap is 1 MiB, and 65,536 characters stay under it even at
      # six bytes per JSON-escaped character).
      chunk_chars: 65536
      # Per content item, enforced by the producer before chunking: content
      # beyond this is not published. The record says so (`truncated_field`
      # true, `original_field` the full length), and the full text remains in
      # the local session transcript, which the archive lanes keep
      # (RULING rows 2026-09-25T11:20:55Z and 2026-09-25T11:28:54Z). 32 chunks.
      max_content_chars: 2097152
      truncated_field: truncated
      original_field: original_chars

# ---------------------------------------------------------------------------
# Mandatory redaction state (OMN-17209 scope 4)
# ---------------------------------------------------------------------------
# Stamped on every governed record under this key. Values mirror
# omnibase_core's EnumArtifactRedactionState (OMN-13152) exactly; parity is
# asserted by test, and the enum is re-declared rather than imported so the
# emit seam keeps its stdlib-only import cost (OMN-17224).
redaction_state_field: "redaction_state"
