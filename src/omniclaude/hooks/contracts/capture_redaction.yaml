      workspace_path: capture_verbatim
      hook_fired_at: capture_verbatim

  "onex.evt.omniclaude.tool-executed.v1":
    ticket: OMN-16979
    reason: >
      Coarse tool-execution telemetry. Every field below is a name, a count or
