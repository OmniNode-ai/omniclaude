title: "The dev-head monitor reads omnimarket's shared ci_bus_lanes.py after the lock refresh removed publish_occ_autobind_command.py"
summary: >
  The lock refresh in omniclaude#2966 moved the omnimarket pin to 88fae96eb1cd, past
  omnimarket#4151, which deleted scripts/publish_occ_autobind_command.py. The
  "Record red dev heads" job in auto-merge-stale-poller.yml loaded that file from its
  sparse checkout of omnimarket at the locked sha and failed with FileNotFoundError on
  every run, turning dev red. The job now fetches and loads scripts/ci_bus_lanes.py at
  the same locked sha and calls its public load_lane_overlay, resolve_lane_broker and
  resolve_lane_security.
