schema_version: "1.0.0"
ticket_id: OMN-18607
title: "PreToolUse Bash/Write/Edit guard does not refuse a doubled omni_home/omni_home path segment"
summary: >
  $OMNI_HOME IS the omni_home repository root on this fleet. A lane that followed
  the old $OMNI_HOME/CLAUDE.md:169 ("Run from $OMNI_HOME/omni_home (repo root)",
  corrected in omni_home#365) created a stray untracked $OMNI_HOME/omni_home/
  directory, and two lanes wrote scratch output into it over three weeks before
  anyone noticed; a second lane hit the identical doubling on 2026-09-16. Nothing
  git-tracked the directory, so no repo-scoped CI gate could see it, and removing
  the wrong instruction does not stop the next lane typing the segment from stale
  memory. This adds the refusal: a new decision core,
  plugins/onex/hooks/lib/omni_home_doubled_path_guard.py, reached from a guard
  script registered on the Write/Edit/MultiEdit/NotebookEdit matcher and sourced
  by pre_tool_use_bash_guards.sh for the Bash command line. The check is ANCHORED
  at the resolved $OMNI_HOME, never a substring match, and the refusal names the
  offending path, $OMNI_HOME and the corrected spelling.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-refuse-doubled-registry-root
    statement: >
      A Bash, Write, Edit, MultiEdit or NotebookEdit call whose target path resolves
      inside $OMNI_HOME/omni_home is refused, by name, while a path that merely
      carries those characters elsewhere is admitted.
    acceptance:
      - id: AC1
        statement: >
          The PreToolUse guard refuses any Bash/Write/Edit call whose target path
          contains a doubled $OMNI_HOME/omni_home segment, naming the offending path.
      - id: AC2
        statement: >
          A RED-first test pins the gap before the fix lands and goes GREEN after it.
      - id: AC3
        statement: >
          The refusal names $OMNI_HOME directly and states the correction rather than
          a generic "path refused" message.
      - id: AC4
        statement: >
          The check is anchored to the resolved $OMNI_HOME, so the same characters
          outside it are accepted while the doubled path anchored at it is refused.
evidence_requirements:
  - kind: tests
    description: "The doubled-root guard's own suite, and the hook inventory gate that admits its registration"
    command: "uv run pytest tests/hooks/test_omni_home_doubled_path_guard.py tests/hooks/test_hook_inventory.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn18607-doubled-path-refused
    description: >
      Nine doubled shapes are refused on the decision core (bash mkdir in both
      $OMNI_HOME spellings, a redirection, a relative path from the root, Write, Edit,
      MultiEdit, NotebookEdit), the refusal names the doubled root, and the Write
      registration refuses end to end with the directory never created.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/hooks/test_omni_home_doubled_path_guard.py -q --no-cov -k 'a_path_doubled_onto_the_registry_root_is_refused or the_hook_refuses_a_write_end_to_end'"
        cwd: ${OMNI_HOME}/omniclaude
    binds_ac: [AC1]
  - id: dod-omn18607-red-baseline-pinned
    description: >
      The gap is closed rather than described: the decision core exists where the
      registration names it, the registration is the Write/Edit matcher the gap was
      found on and fails closed, and the bundled Bash entrypoint sources the same
      guard. At the merge base the whole file errors on import, which is the RED
      baseline this item turns green.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/hooks/test_omni_home_doubled_path_guard.py -q --no-cov -k 'the_gap_this_ticket_closes_is_real or the_bundled_bash_entrypoint_refuses_the_doubled_mkdir or the_bundled_entrypoint_still_admits_an_ordinary_command'"
        cwd: ${OMNI_HOME}/omniclaude
    binds_ac: [AC2]
  - id: dod-omn18607-refusal-text
    description: >
      The refusal names $OMNI_HOME, its value, the corrected path spelled out, the
      ticket and the disable command, so a lane hitting it does not re-derive the fix.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/hooks/test_omni_home_doubled_path_guard.py -q --no-cov -k the_refusal_names_omni_home_and_the_correction"
        cwd: ${OMNI_HOME}/omniclaude
    binds_ac: [AC3]
  - id: dod-omn18607-anchored-not-substring
    description: >
      Six admitted shapes, two of which carry the literal characters
      omni_home/omni_home outside the root (a worktree for a ticket named after the
      repo, and another tree entirely), plus the no-OMNI_HOME control that admits
      every refused shape when there is no root to anchor to.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/hooks/test_omni_home_doubled_path_guard.py -q --no-cov -k 'a_path_that_is_not_anchored_at_the_root_is_admitted or no_omni_home_means_no_anchor_and_no_refusal or the_guard_is_disabled_by_its_own_bit'"
        cwd: ${OMNI_HOME}/omniclaude
    binds_ac: [AC4]
