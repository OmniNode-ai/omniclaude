ticket_id: OMN-21263
title: "A developer can add a provider that speaks the OpenAI API, with a key, by URL"
summary: >
  The onboarding half (AC4). lab-onboarding.sh offers a sixth model choice, an
  OpenAI-compatible endpoint that needs a key (vLLM or LM Studio behind auth, a
  company gateway, a hosted OpenAI-compatible service). The menu asks for its URL,
  then its key at a hidden prompt (any key shape), then its models from its own
  /v1/models read with that key; --provider openai_compatible and --compat-url are
  accepted. Phase 3 hands the URL and models to `onex models add openai_compatible
  --url --model` with the key on stdin, never as an argument. The URL question
  shares one loop with the local model server's, and the three model-config
  heredocs share one helper, so the baselined onboarding scripts do not grow. The
  CLI half (AC1, AC2, AC3, AC5) ships in omnimarket.
