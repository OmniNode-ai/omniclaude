title: "The worktree guard's refusal ends with the one literal absolute-path form that passes, so a lane that was refused does not find it by trial"
summary: >
  The worktree-add guard's shared hint now carries the one form that passes (one literal git -C command per repo, with an
  absolute destination under the worktrees root, no relative path, loop variable, PWD or command substitution), so every
  refusal of the decision core ends with it and then with the disable hint. No code line is added to a baselined file.
