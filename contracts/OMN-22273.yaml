title: "Whole-file public-repo hygiene leg for the published plugin tree, and the scrub map"
summary: >
  Task T2 (hygiene leg) of the plugin retirement plan. The whole-file leg
  (src/omniclaude/nodes/node_validate_skills_compute/handlers/handler_whole_file_hygiene.py) runs the hygiene gate's own
  scanner over every file under one directory (plugins/omni by default) and fails on all
  ten content classes, then makes a second targeted deployment-config run with a model
  vocabulary file. Exit 0 is clean, 1 is a detection, 2 is a configuration error and is
  never a detection. The scrub map (config/public_repo_hygiene_scrub_map.yaml) lists each
  private value class of the plan's scrub table with the overlay key or environment
  variable it becomes, and the leg reads it. scripts/public_repo_hygiene_gate.py gains no
  line. Nothing reads the plugins/omni tree yet, so the leg is not wired into CI here; the
  scaffold task that creates the tree wires it.
