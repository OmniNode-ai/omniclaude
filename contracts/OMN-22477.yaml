---
schema_version: "1.0.0"
ticket_id: OMN-22477
title: "A participant run cannot set up Ollama: the workspace pins an omniclaude from 2026-10-06 that lacks the model-config handler the script imports"
summary: >
  Phase 2 checked the omniclaude clone out at the commit the sibling-pins file
  holds for it, a CI pin from 2026-10-06 that predates the model-config handler
  phase 3 imports. This change takes omniclaude off the onboarding proven set, so
  it is checked out at the last origin/dev commit at or before the anchor's time,
  like any repo with no pin. It does not satisfy the import falsifier of AC2, which
  runs the workspace dispatch venv against a real phase 2 clone; that walk and the
  other criteria are separate evidence recorded on the ticket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22477-omniclaude-off-the-proven-set
    statement: The omniclaude clone phase 2 leaves behind is taken from origin/dev at the anchor's time, not from its CI pin.
    acceptance:
      - id: "AC2"
        statement: "AC2: the module the model-config call imports is present in the workspace that phase 2 leaves behind -- falsifier: python -c 'import omniclaude.nodes.node_skill_omninode_dev_setup_orchestrator.handler_onboarding_model_config' run with the workspace dispatch venv against the phase 2 clone"
  - id: req-omn22477-model-config-import-path-from-the-workspace
    statement: model_config takes its PYTHONPATH from the workspace clone, not from the handler's own location, so a downloaded run can import omniclaude; and a failed model-config call is reported as that call failing.
    acceptance:
      - id: "AC4"
        statement: "AC4: a failure inside the model-config call reports the call that failed and not a guess about the omnimarket config -- falsifier: pytest over the onboarding script tests asserting the Ollama failure text does not claim a missing ollama block when the import is what failed"
      - id: "AC5"
        statement: "AC5: a regression test built from this run's recorded traceback fails on the current script and passes on the fix -- falsifier: the new test in omniclaude's onboarding script test suite, run with uv run pytest"
evidence_requirements:
  - kind: tests
    description: "The anchor handler tests and the omniclaude unpinned test pass"
    command: "uv run pytest tests/skills/test_onboarding_anchor_handler_omn21255.py tests/skills/test_onboarding_omniclaude_unpinned_omn22477.py tests/skills/test_onboarding_omniclaude_unpinned_download_omn22477.py -q --no-cov"
  - kind: tests
    description: "The model-config import path and the Ollama fault-reporting tests pass, with the handler digest re-pinned"
    command: "uv run pytest tests/skills/test_onboarding_model_config_outside_clone_omn22477.py tests/skills/test_onboarding_ollama_config_fault_omn22477.py tests/skills/test_onboarding_bootstrap_handler_omn21087.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22477-download-pin-to-the-merged-handler
    description: "A downloaded run gets the handler that takes omniclaude off the proven set: the entrypoint's raw URL names the commit the fix merged as, download_digest matches the bytes served there, and the two digests agree again. Fails at the merge base, where the URL still names 884c501d, whose handler keeps the pin. The checkout-side evidence of the same criterion landed with pull request 3164."
    source: manual
    binds_ac:
      - "AC2"
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_onboarding_omniclaude_unpinned_download_omn22477.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn22477-model-config-path-from-workspace
    description: "model_config reads omniclaude from $WORKSPACE/omniclaude/src, so the handler imports when it is read from outside the clone, which is where a downloaded run writes it. Fails at the merge base, where the path is derived from ${BASH_SOURCE[0]} and the call dies with ModuleNotFoundError: No module named 'omniclaude'. The handler bytes changed, so the entrypoint's local digest and the node contract's bootstrap fingerprint are re-pinned; download_digest stays at the commit dev still serves, which the next pull request moves to the merge commit."
    source: manual
    binds_ac:
      - "AC5"
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_onboarding_model_config_outside_clone_omn22477.py tests/skills/test_onboarding_bootstrap_handler_omn21087.py -q --no-cov"
        cwd: "."
  - id: dod-omn22477-ollama-fault-is-not-a-config-guess
    description: "load_ollama_config sets OLLAMA_CONFIG_ERR to which of its two faults it hit, and setup_ollama reports that instead of the fixed sentence, so a failed model-config call is no longer named as the omnimarket config declaring no ollama block. Fails at the merge base, where three of the four cases fail because the variable does not exist and the collapsed sentence is still in the entrypoint."
    source: manual
    binds_ac:
      - "AC4"
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_onboarding_ollama_config_fault_omn22477.py -q --no-cov"
        cwd: "."
  - id: dod-deploy-omn22477-fingerprint-on-github
    description: "The node contract on GitHub, at the commit this is probed from, carries the re-pinned bootstrap fingerprint of the fixed handler. That file is the runtime path this change touches, and the fingerprint is what a participant run checks the downloaded handler against, so the probe reads the deployed surface rather than anything this pull request authors locally. Falsifiable: at the merge base, and at any commit whose handler still derives PYTHONPATH from ${BASH_SOURCE[0]}, the file carries the old fingerprint and the grep exits nonzero."
    source: manual
    binds_ac:
      - "AC5"
    checks:
      - check_type: command
        check_value: gh api "repos/OmniNode-ai/omniclaude/contents/src/omniclaude/nodes/node_skill_omninode_dev_setup_orchestrator/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -q '24ca:661a:7af4:2089:d761:289c:8830:0853:ad47:2b62:0501:3ce5:48bb:d755:20ba:71b2'
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn22477-page-pin-serves-the-fixed-handler
    description: "The commit the PARTICIPANT PAGE pins serves a script whose handler URL names the fix. The two pins are separate surfaces: pull request 3194 moved the script's own handler pin, and nothing a participant downloads reached it, because ONBOARDING.md still named ad5d6ef8, whose script curls the handler from 6596b867. This probe follows the whole chain a participant walks -- it reads the page from the deployed tree, takes the commit out of its download URL, fetches the script served at that commit, and asserts that script's handler URL names 149fbe85. Asserting the page's own two digests agree would not do, because agreement holds for any self-consistent pin, including one whose handler still derives PYTHONPATH from its own location, which is how this chain kept re-pinning. Falsifiable, and measured both ways before this was written: at this head the chain lands on 149fbe85 and the probe exits 0; at the merge base the page names ad5d6ef8, the script served there names 6596b867, and the probe exits 1."
    source: manual
    binds_ac:
      - "AC2"
    checks:
      # The behaviour check. It walks the chain out of git rather than out of the
      # page's own claims: page -> script served at that commit -> handler that
      # script serves -> that handler's model_config. Measured both ways before it
      # was bound: 3 pass at this head; against the merge base's page, which pins
      # ad5d6ef8, the two chain tests fail and only the self-consistency control
      # passes -- which is the whole reason the page's own digests are not evidence.
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_onboarding_guide_pin_serves_the_fixed_handler_omn22477.py -q --no-cov"
        cwd: "."
      - check_type: command
        # Every fetch lands in a file before it is read. Piping curl into `grep -q`
        # makes grep exit on the first match, curl loses the pipe and returns 23, and
        # under pipefail the check fails on a chain that is in fact correct -- which it
        # did here once ("curl: (23) Failure writing output to destination").
        check_value: 'T=$(mktemp -d) && gh api "repos/OmniNode-ai/omniclaude/contents/plugins/onex/ONBOARDING.md?ref=$(git rev-parse HEAD)" --jq .content > "$T/b64" && base64 -d < "$T/b64" > "$T/page.md" && S=$(grep -m1 -oE "omniclaude/[0-9a-f]{40}/plugins/onex/skills/_bin/lab-onboarding.sh" "$T/page.md" | cut -d/ -f2) && curl -fsSL "https://raw.githubusercontent.com/OmniNode-ai/omniclaude/$S/plugins/onex/skills/_bin/lab-onboarding.sh" -o "$T/script.sh" && grep -q 149fbe854d8f40e54ae90e8aa776ffe3506a3a4b "$T/script.sh"'
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn22477-served-handler-carries-the-fix
    description: "The handler the entrypoint's raw URL serves carries the workspace PYTHONPATH, which is what a downloaded run actually loads: the pin and download_digest now name the commit the fix merged as, so a participant run gets the fixed handler rather than the one dev was serving while the fix was in flight. Asserting the two digests agree is not enough, because agreement holds for any self-consistent pin, including one at a commit whose handler still has the fault. Fails at the merge base, where the URL names 6596b867 and the served handler still derives PYTHONPATH from its own location."
    source: manual
    binds_ac:
      - "AC2"
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_onboarding_omniclaude_unpinned_download_omn22477.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
