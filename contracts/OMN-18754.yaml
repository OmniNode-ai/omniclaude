---
schema_version: "1.0.0"
ticket_id: "OMN-18754"
title: "Retire the rolling_plan_governor skill and its node"
summary: >-
  Delete the rolling_plan_governor skill and its orchestrator node outright. The
  skill governed one document, docs/plans/ROLLING_SEVEN_DAY_PLAN.md, which was
  deleted from the canonical workspace repo on 2026-09-16 and retired outright by
  the operator on 2026-09-18. There is nothing left for it to govern, and re-cutting
  the document is what the ruling forbids, so this is a removal rather than a
  repoint. No shim, no re-export and no stub is left behind.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-skill-and-node-absent"
    description: >-
      The skill directory and the orchestrator node package are gone from the tree,
      and the node module no longer resolves in the import graph. The companion
      assertions are absences, so each is paired with a positive control against a
      retained skill and a retained node; a control failure reports that the absence
      beside it proves nothing rather than passing.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          test ! -e plugins/onex/skills/rolling_plan_governor &&
          test ! -e src/omniclaude/nodes/node_skill_rolling_plan_governor_orchestrator &&
          test -f plugins/onex/skills/weekly_review/SKILL.md &&
          test -d src/omniclaude/nodes/node_skill_weekly_review_orchestrator
  - id: "dod-no-registration-advertises-it"
    description: >-
      No registry, manifest or frozen baseline still advertises the skill, so nothing
      can dispatch it into a failure. The distribution manifest drops the entry rather
      than reclassifying it, because an entry at any exposure still names a dispatchable
      component; the handler-shape ratchet baseline was regenerated by its own script
      rather than hand-edited. Discovery and classification agree at 293/293.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          python scripts/validation/validate_distribution_classification.py &&
          ! grep -q "rolling_plan_governor" plugins/distribution_manifest.yaml &&
          ! grep -q "rolling_plan_governor" scripts/ci/canonical_handler_shape_baseline.py
  - id: "dod-retirement-test-red-first"
    description: >-
      The retirement is pinned by a test that failed 5/5 before the removal and passes
      5/5 after, with a positive control on every absence assertion and a git-grep scan
      proving no live tracked file still names the skill. History-class paths (the merged
      change-control contract, the dated evidence snapshot, the changelog) are excluded
      by name and deliberately keep the name, because erasing it from a record would
      falsify the record.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          uv run pytest tests/skills/test_rolling_plan_governor_retired_omn18754.py -q
  - id: "dod-retirement-recorded-with-successors"
    description: >-
      CHANGELOG.md carries the retirement note where a reader who comes looking for the
      skill lands. It cites the authorising ruling row and names the two surfaces that
      replaced the rolling plan - beta/GOAL.md, whose state_as_of is the freshness fact
      the ledger cost-sentence gate reads, and the Program Board, which carries the
      day-by-day sequencing view as a column - and says not to reintroduce a plan
      document to bridge them.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -q "beta/GOAL.md" CHANGELOG.md &&
          grep -q "Program Board" CHANGELOG.md &&
          grep -q "ROLLING_WORK_LEDGER.md:4469" CHANGELOG.md
