title: "Onboarding sets up every OpenRouter key on Qwen3.8 27B and asks no model question"
summary: >
  Team decision 2026-10-13: onboarding keeps its three questions (models,
  keys, Docker), and every OpenRouter key is set up on qwen/qwen3.8-27b, named
  in the script, with no model question. This replaces the pick-by-number list
  from OMN-21058. omnibase_core admits the script as a VENDOR_DEFAULT file
  (same ticket), and this repository moves its omnibase_core pin to that policy.
