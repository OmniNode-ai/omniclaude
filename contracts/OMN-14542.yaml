title: "contract_sweep: required full-corpus census + scanned_count>0 gate (class fix, parent OMN-14531)"
summary: >
  contract_sweep (omnimarket node_contract_sweep) reported PASS/clean over an unresolvable or
  drastically narrowed scope: a prior receipt showed 9 contracts checked clean while 941 exist
  in the corpus (~1% coverage). Root cause: ContractSweepRequest.repos defaulted to an empty
  list, which the handler silently reinterpreted as "scan whatever top-level omni_home dirs
  happen to have a src/", and OMNI_HOME fell back to a guessed Path(__file__).parents[6]. This
  local mirror covers the companion docs fix in this repo: SKILL.md/prompt.md documented a
  fictional "Runtime Mode" (a `registration_only` field and an `onex run-node node_contract_sweep`
  invocation) that never existed on the node's actual request model (extra="forbid") and was
  never wired to any harness. Full evidence and the product-repo class fix live in
  onex_change_control contract OMN-14542 / OCC companion PR #4085, bound to omnimarket PR #1739
  and this repo's PR #1897.
