schema_version: "1.0.0"
ticket_id: OMN-20815
title: "Transcript archiver finds the infrastructure clone wherever it lives"
summary: >
  scripts/transcript-s3-archive-sync.sh discovers the infrastructure archive
  executable from an ordered candidate list instead of assuming one clone path,
  and names every tried path when it refuses.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-archiver-infra-clone-discovery
    statement: The transcript archiver resolves the infrastructure clone from an ordered candidate list and names every tried path when it refuses.
    acceptance:
      - id: AC1
        statement: 'AC1: scripts/transcript-s3-archive-sync.sh honours OMNINODE_INFRA_PATH and the declared candidate order, and a refusal names every tried path -- falsifier: the path-discovery tests fail and the grep for OMNINODE_INFRA_PATH exits 1 on a script without the discovery'
evidence_requirements:
  - kind: tests
    description: "Archiver path-discovery tests pass"
    command: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/scripts/test_transcript_s3_archive_infra_path_omn17427.py -q --no-cov -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-archiver-path-discovery
    description: "The archiver resolves the infrastructure clone by the declared candidate order and refuses naming every tried path"
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: command
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/scripts/test_transcript_s3_archive_infra_path_omn17427.py -q --no-cov -p no:randomly"
      - check_type: command
        check_value: "grep -q OMNINODE_INFRA_PATH scripts/transcript-s3-archive-sync.sh"
