schema_version: "1.0.0"
ticket_id: OMN-23168
title: "Onboarding ends by printing the ladder: a numbered list of the chosen models, each marked free or paid"
summary: >
  After phase 3 has tested the developer's models, lab-onboarding.sh calls
  print_ladder, which prints `onex models list --ladder` (OMN-23167) as a
  numbered list, one line per model, each ending in its cost class. ONBOARDING.md
  says the same and how to add a local model later. omnimarket is bumped to the
  release that carries the ladder in pyproject.toml and uv.lock. The entrypoint
  does not grow: two test-seam functions are written in the file's one-line style
  to pay for the new ones. The test is a pytest (the ticket named a shell script;
  the file-shape ratchet refuses a new shell script anywhere). The script's
  INFRA_ANCHOR is not moved: no omnibase_infra commit yet pins an omnimarket that
  carries the ladder (named follow-up on the ticket).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23168-onboarding-prints-the-ladder
    statement: Phase 3 prints the numbered ladder of the chosen models, each line ending in free or paid, and the guide says the same.
    acceptance:
      - id: "AC1"
        statement: "AC1: a scripted onboarding on a fresh install with one OpenRouter key and two chosen models prints a numbered list whose lines end in free or paid -- falsifier: the onboarding script's test driven with a stub key server asserting both lines (`bash plugins/onex/skills/_bin/tests/test_lab_onboarding_ladder.sh`)"
evidence_requirements:
  - kind: tests
    description: "The ladder test passes, and the onboarding script tests still pass"
    command: "uv run pytest tests/skills/test_onboarding_ladder_omn23168.py -q --no-cov"
emergency_bypass:
