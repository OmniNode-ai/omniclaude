- id: dod-omn21093-binding-inventory-contribution
  description: 'Hosted-runner behavioral probe of the hook inventory command: declared controls pass;
    swapped event/matcher pairs, unknown absolute-path bindings and malformed commands fail. No runtime
    deployment is changed. This proves the AC8 contribution, not completion of all OMN-21093 criteria.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/hooks/test_hook_inventory_client_bindings_omn18531.py -q --no-cov
      -p no:randomly
    cwd: ${OMNI_HOME}/omniclaude
- id: dod-omn21090-hosted-source-deploy-readback
  description: 'Hosted-runner source deployment probe: read the inventory handler published by this repository
    at the checked-out commit and require its binding/event mismatch finding. A missing handler or pre-fix
    commit fails. This reads product source, not an authored receipt, and is separate from the behavioral
    tests. It is declared for hosted execution; this lane reads PR and CI state only from its supplied
    snapshot.'
  source: manual
  execution_scope: hosted_and_local
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omniclaude/contents/src/omniclaude/handlers/handler_client_binding_inventory.py?ref=$(git
      rev-parse HEAD)" --jq '.content | gsub("\n"; "") | @base64d | contains("INSTALLED_BINDING_EVENT_MISMATCH")'
      | grep -qx true
    cwd: ${OMNI_HOME}/omniclaude
