schema_version: 1.0.0
ticket_id: OMN-21042
title: Add handler and routing to the friction observer node
summary: node_friction_observer_compute gains HandlerFrictionObserver, a definition-B handler that turns one skill-completed event into at most one friction-observed event, plus handler and handler_routing blocks in its contract. node.py no longer inserts plugins/onex/skills/_shared on sys.path, so the node imports from src/omniclaude alone.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-friction-observer-handler
    statement: The friction observer node declares a loadable handler that classifies a non-success skill-completed signal with the contract's rules and yields no event for success.
    acceptance:
      - id: AC1
        statement: 'AC1: HandlerFrictionObserver classifies a failed skill as tooling/skill-failed, an unnamed status by the wildcard rule, success as no event, and the node imports without plugins/ on the path -- falsifier: tests/unit/nodes/test_node_friction_observer_handler.py fails against the pre-change node (uv run pytest on that file)'
      - id: AC2
        statement: 'AC2: the node flips to canonical handler shape with an adequacy receipt and an equivalence artifact under scripts/ci/adequacy_receipts, and the handler agrees with the portable classifier on all 30 replay inputs -- falsifier: TestFlipArtifactsReplay fails when the handler disagrees with the portable classifier on any input or the artifacts name an input outside the replay corpus (uv run pytest on that class)'
evidence_requirements:
  - kind: tests
    description: Handler classification, contract topics and handler routing, import from src/omniclaude alone, and parity with the portable classifier.
    command: uv run pytest tests/unit/nodes/test_node_friction_observer_handler.py -q
  - kind: tests
    description: Flip artifacts replayed against the portable classifier, and the handler branches the shipped contract never reaches.
    command: uv run pytest tests/unit/nodes/test_node_friction_observer_handler.py -q -k "TestFlipArtifactsReplay or TestHandlerBranchesTheShippedContractNeverReaches"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21042-ac1-friction-observer-handler
    description: The friction observer handler tests pass at this head.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/test_node_friction_observer_handler.py -q
    binds_ac:
      - AC1
  - id: dod-omn21042-ac2-flip-artifacts-replay
    description: The adequacy receipt and equivalence artifact name inputs of the replay corpus, and the handler agrees with the portable classifier on every one at this head.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/test_node_friction_observer_handler.py -q -k "TestFlipArtifactsReplay or TestHandlerBranchesTheShippedContractNeverReaches"
    binds_ac:
      - AC2
