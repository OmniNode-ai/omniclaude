---
schema_version: "1.0.0"
ticket_id: OMN-21499
title: "T2.6 check-only hooks: the omniclaude hooks that rewrote files refuse instead and leave the working tree byte-identical"
summary: >
  Validators-to-core plan task T2.6, omniclaude slice (Appendix 1 rows
  omniclaude:267, 492, 934, 942, 950, 1060, 1443). ruff format and ruff check run
  without rewriting, the end-of-file hook checks, the AI co-author trailer is
  refused instead of stripped, a staged output/ file is refused instead of the
  directory being deleted, and the secrets-baseline and skill-node hooks run
  their check-only forms. The core rule that refuses a new writing hook is a
  separate lane in omnibase_core and is not built here.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-t26-no-rewrite
    statement: The omniclaude hooks that rewrote files or commit messages refuse a defect instead.
    acceptance:
      - id: AC1
        statement: "AC1: No hook of omniclaude rewrites a file or a commit message: each Appendix 1 REWRITES FILES row of this repository is a check that refuses -- falsifier: pytest cases over the converted hook config and a git grep of the config for hooks whose entry writes"
  - id: req-t26-canary
    statement: A canary commit with two defects is refused and the tree is left as it was.
    acceptance:
      - id: AC2
        statement: "AC2: A canary commit with an unformatted file and an AI co-author trailer is refused and the working tree is byte-identical after the hook run -- falsifier: pytest case that hashes the tree before and after the hook run, plus pre-commit run --files on the canary commit"
evidence_requirements:
  - kind: tests
    description: "Check-only hook tests pass"
    command: "uv run pytest tests/ci/test_precommit_check_only_hooks_omn21499.py tests/scripts/test_detect_secrets_guard.py tests/unit/scripts/test_auto_generate_skill_nodes.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-t26-ac1-ruff-format
    description: "The ruff-format entry, run on a canary unformatted file, exits non-zero and the scratch tree hashes the same afterwards. Fails at the merge base, whose entry is ruff format and rewrites the file."
    source: manual
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_precommit_check_only_hooks_omn21499.py -q --no-cov -k ruff_format"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-t26-ac2-trailer
    description: "The strip-ai-coauthor-trailer entry refuses a message with the AI trailer, names it on stderr, and the message file hashes the same afterwards. Fails at the merge base, whose perl -i entry deletes the line."
    source: manual
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_precommit_check_only_hooks_omn21499.py -q --no-cov -k trailer"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-t26-ac3-other-hooks
    description: "ruff check, the end-of-file check and the output/ refusal each refuse their canary and leave the tree byte-identical, and accept a clean input. Fails at the merge base, where ruff-fix runs --fix, end-of-file-fixer is a third-party rewriter with no entry, and clean-output-directory runs rm -rf."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_precommit_check_only_hooks_omn21499.py -q --no-cov -k 'ruff_check or end_of_file or output'"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-t26-ac4-script-hooks
    description: "detect_secrets_guard --check refuses a stale baseline and a new unaudited finding without touching the file or the index; auto_generate_skill_nodes --check refuses a missing node without generating. Fails at the merge base, which has no --check mode."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_detect_secrets_guard.py tests/unit/scripts/test_auto_generate_skill_nodes.py tests/ci/test_precommit_check_only_hooks_omn21499.py -q --no-cov -k 'check'"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-t26-ac5-no-writing-spelling
    description: "None of the seven entries contains --fix, rm -rf, perl -i, sed -i or git add, and ruff-format carries --check. Fails at the merge base on five of the seven."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_precommit_check_only_hooks_omn21499.py -q --no-cov -k no_writing_spelling"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-t26-ac2-canary-commit
    description: "A scratch git repository holding a staged unformatted canary.py and a commit message with an AI Co-Authored-By trailer: the ruff-format entry and the trailer entry both refuse, and afterwards canary.py, the index tree, the message file and git status are unchanged. Fails at the merge base, whose ruff-format entry rewrites canary.py and whose trailer entry deletes the line."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_precommit_check_only_hooks_omn21499.py -q --no-cov -k canary_commit"
        cwd: "${OMNI_HOME}/omniclaude"
