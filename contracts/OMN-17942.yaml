---
schema_version: "1.0.0"
ticket_id: OMN-17942
title: "Ticket-creation gate: delegate prepared creates through the owning session"
summary: >
  OMN-17942 introduced the ticket-creation create gate. It is referenced by
  PR 2441, which inverts its project rule per the OMN-17427 operator ruling of
  2026-09-30: a create that sets a project is refused (project_set) and a
  no-project create is admitted. An in-session helper whose harness name has no
  CLAIM may now use its parent session's registered lane, only while that lane
  holds an open CLAIM. The intake row records the helper, parent session id and
  stamped lane. Headless and node callers cannot borrow this authority; every
  other admission rule is unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn17942-lane-intake
    statement: A Linear create from a lane or node context carries the intake label, a first-line lane stamp and a declared lane identity, and is counted against a daily intake budget.
    acceptance:
      - id: AC1
        statement: 'AC1: a lane create is refused without the label, the first-line stamp naming its lane, a declared lane identity, or when the day''s intake budget from the policy config is spent, and the same create, fixed, is admitted and counted; falsifier: uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py fails at the merge base, whose policy config has no lane_intake section.'
evidence_requirements:
  - kind: tests
    description: "Ticket-creation guard tests pass, including the registered hook end to end"
    command: "uv run pytest tests/hooks/test_ticket_creation_guard.py -q"
  - kind: tests
    description: "Lane-intake rules (label, first-line stamp, lane identity, daily budget) hold, each refusal beside an admitted control"
    command: "uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-guard-tests-pass
    description: >
      The full ticket-creation guard suite passes against the inverted
      project rule, so every unchanged rule still holds.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py -q"
  - id: dod-lane-intake-rules
    description: >
      A Linear create from a lane or node context is refused without the
      label, the first-line stamp naming its lane, a declared lane identity,
      or when the day's intake budget from the policy config is spent; the
      same create, fixed, is admitted and counted.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q"
    binds_ac:
      - AC1
  - id: dod-subagent-lane-identity
    description: >
      The lane identity AC1 requires, for a workflow subagent with no declared
      ONEX_LANE or ONEX_REMOTE_LANE: its agent sidecar names the lane and the
      rolling work ledger holds an open CLAIM for that same lane, both agreeing.
      A sidecar with no CLAIM, a CLAIM closed by its TERMINAL, a CLAIM with no
      sidecar and an agent_id that is a path are still refused
      lane_identity_missing, and a declared lane still wins. Falsifier: these
      cases fail at the merge base, whose intake reads the lane only from the
      environment.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k 'workflow_subagent or claimed_subagent or claim_closed or claim_without_a_sidecar or agent_id_that_is_a_path or declared_lane_still_wins'"
    binds_ac:
      - AC1
  - id: dod-deploy-lane-intake-handler
    description: >
      Deploy probe: the lane-intake handler read from GitHub at the
      checked-out commit defines LaneIntakePolicy. A head without this change
      has no such file and the probe finds no match.
    source: manual
    checks:
      - check_type: command
        check_value: "gh api \"repos/OmniNode-ai/omniclaude/contents/src/omniclaude/handlers/handler_lane_intake.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c '^class LaneIntakePolicy(NamedTuple):'"
  - id: dod-delegated-create-parent-session
    description: >
      The helper mint-13 can file the owning session's prepared create with
      the session's open CLAIM; the admission row records helper, stamped lane,
      parent session id and parent-session+claim source. Red-first: the merge
      base refuses this create with lane_identity_missing (red-tests.log).
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k session_helper_uses_parent_claim"
    binds_ac:
      - AC1
  - id: dod-delegated-create-refusals
    description: >
      Missing, unrelated and closed parent CLAIMs refuse. A stamp for another
      claimed lane refuses. Missing harness identity, malformed or unrelated
      session bindings, headless and node contexts refuse. Label, project,
      parent and Gate binding rules continue to apply to delegated creates.
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k 'session_helper or headless_session_cannot or node_cannot_borrow'"
    binds_ac:
      - AC1
  - id: dod-deploy-delegated-create
    description: >
      Deploy check runnable on a hosted runner from this repository alone:
      execute the actual guard subprocess with isolated harness sidecars,
      session registry and ledger. It must admit the owning session's create
      and refuse a different stamp. Both behavior checks fail before the fix.
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k 'session_helper_uses_parent_claim or session_helper_cannot_stamp'"
  - id: dod-original-ac2-json-policy
    description: >
      AC-2 remains enforced: policy vocabulary is JSON and malformed policy
      refuses. The classifier drift check follows its recorded import into
      core; the historical provenance and marker arrays are unchanged.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py -q --no-cov -k 'policy or vocabulary'"
  - id: dod-original-ac3-hook-inventory
    description: AC-3 registration and typed inventory owner, ticket, mask and canary remain covered.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py -q --no-cov -k 'registered_and_executable or typed_inventory or inventory_contract'"
  - id: dod-original-ac4-registered-refusal
    description: AC-4 the registered shell hook still refuses an unbound create end to end.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py -q --no-cov -k registered_hook_blocks_a_create_with_no_binding"
  - id: dod-original-ac5-shipped-documentation
    description: >
      AC-5 records previously completed documentation work. This implementation
      changes no documentation. Its historical evidence was read locally;
      it is manual evidence, not an executable hosted check.
    source: manual
    status: verified
    execution_scope: local_done_gate
    binds_ac: [AC5]
    checks:
      - check_type: command
        check_value: "git diff --quiet origin/dev...HEAD -- docs"
