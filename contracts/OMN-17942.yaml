---
schema_version: "1.0.0"
ticket_id: OMN-17942
title: "Ticket-creation gate: delegate prepared creates through the owning session"
summary: >
  OMN-17942 introduced the ticket-creation create gate. It is referenced by
  PR 2441, which inverts its project rule per the OMN-17427 operator ruling of
  2026-09-30: a create that sets a project is refused (project_set) and a
  no-project create is admitted. An in-session helper whose harness name has no
  CLAIM may now use its parent session's registered lane, only while that lane
  holds an open CLAIM. The intake row records the helper, parent session id and
  stamped lane. Headless and node callers cannot borrow this authority; every
  other admission rule is unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn17942-lane-intake
    statement: A Linear create from a lane or node context carries the intake label, a first-line lane stamp and a declared lane identity, and is refused when it lacks any of them; no count refuses it (RULING 2026-10-30T00:03:58Z).
    acceptance:
      - id: AC1
        statement: 'AC1: a lane create is refused without the label, the first-line stamp naming its lane, or a declared lane identity, and the same create, fixed, is admitted; falsifier: uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py fails at the merge base, whose policy config has no lane_intake section.'
  - id: req-omn17942-workflow-lane-prompt-identity
    statement: A workflow subagent lane whose harness sidecar carries only a label or the ROUTE line is named by the dispatch prompt that opens its own transcript (You are lane <lane>, parent <p>), and admitted only while that lane holds an open CLAIM on the rolling work ledger under the same parent; no CLAIM, a closed CLAIM, a CLAIM under another parent, a forged column-zero line and a prompt naming no lane are still refused lane_identity_missing.
    acceptance:
      - id: AC8
        statement: 'AC8: a workflow lane whose sidecar description is a short label, the harness slug or the ROUTE line, with its open CLAIM, is admitted and a create with no CLAIM anywhere is refused naming the missing CLAIM; falsifier: uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -k prompt fails at the merge base, whose lane intake reads the lane from the sidecar alone.'
evidence_requirements:
  - kind: tests
    description: "Ticket-creation guard tests pass, including the registered hook end to end"
    command: "uv run pytest tests/hooks/test_ticket_creation_guard.py -q --no-cov -k 'residual_title or unfalsified or sets_a_project or admits_a_fully_falsified'"
  - kind: tests
    description: "Lane-intake rules (label, first-line stamp, lane identity) hold, each refusal beside an admitted control"
    command: "uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k 'unmarked or lane_intake_mode or node_mode or session_helper_uses_parent_claim'"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-guard-tests-pass
    description: >
      The full ticket-creation guard suite passes against the inverted
      project rule, so every unchanged rule still holds.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py -q --no-cov -k 'residual_title or unfalsified or sets_a_project or admits_a_fully_falsified'"
  - id: dod-lane-intake-rules
    description: >
      A Linear create from a lane or node context is refused without the
      label, the first-line stamp naming its lane, or a declared lane identity;
      the same create, fixed, is admitted.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k 'unmarked or lane_intake_mode or node_mode or session_helper_uses_parent_claim'"
    binds_ac:
      - AC1
  - id: dod-subagent-lane-identity
    description: >
      The lane identity AC1 requires, for a workflow subagent with no declared
      ONEX_LANE or ONEX_REMOTE_LANE: its agent sidecar names the lane and the
      rolling work ledger holds an open CLAIM for that same lane, both agreeing.
      A sidecar with no CLAIM, a CLAIM closed by its TERMINAL, a CLAIM with no
      sidecar and an agent_id that is a path are still refused
      lane_identity_missing, and a declared lane still wins. Falsifier: these
      cases fail at the merge base, whose intake reads the lane only from the
      environment.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k 'workflow_subagent or claimed_subagent or claim_closed or claim_without_a_sidecar or agent_id_that_is_a_path or declared_lane_still_wins'"
    binds_ac:
      - AC1
  - id: dod-deploy-lane-intake-handler
    description: >
      Deploy probe: the lane-intake handler read from GitHub at the
      checked-out commit defines LaneIntakePolicy. A head without this change
      has no such file and the probe finds no match.
    source: manual
    checks:
      - check_type: command
        check_value: "gh api \"repos/OmniNode-ai/omniclaude/contents/src/omniclaude/handlers/handler_lane_intake.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c '^class LaneIntakePolicy(NamedTuple):'"
  - id: dod-delegated-create-parent-session
    description: >
      The helper mint-13 can file the owning session's prepared create with
      the session's open CLAIM; the admission row records helper, stamped lane,
      parent session id and parent-session+claim source. Red-first: the merge
      base refuses this create with lane_identity_missing (red-tests.log).
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k session_helper_uses_parent_claim"
    binds_ac:
      - AC1
  - id: dod-delegated-create-refusals
    description: >
      Missing, unrelated and closed parent CLAIMs refuse. A stamp for another
      claimed lane refuses. Missing harness identity, malformed or unrelated
      session bindings, headless and node contexts refuse. Label, project,
      parent and Gate binding rules continue to apply to delegated creates.
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k 'session_helper or headless_session_cannot or node_cannot_borrow'"
    binds_ac:
      - AC1
  - id: dod-deploy-delegated-create
    description: >
      Deploy check runnable on a hosted runner from this repository alone:
      execute the actual guard subprocess with isolated harness sidecars,
      session registry and ledger. It must admit the owning session's create
      and refuse a different stamp. Both behavior checks fail before the fix.
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k 'session_helper_uses_parent_claim or session_helper_cannot_stamp'"
  - id: dod-workflow-lane-prompt-identity
    description: >
      A workflow lane named only by its dispatch prompt and an open CLAIM under
      the same parent is admitted ; no CLAIM anywhere,
      a closed CLAIM, another lane's CLAIM, another parent's CLAIM, a forged
      column-zero line and a prompt that names no lane are refused
      lane_identity_missing. Red-first: the admitted cases fail at the merge
      base, which reads the lane from the sidecar alone.
    source: manual
    binds_ac: [AC8]
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov"
  - id: dod-original-ac2-json-policy
    description: >
      AC-2 remains enforced: policy vocabulary is JSON and malformed policy
      refuses. The classifier drift check follows its recorded import into
      core; the historical provenance and marker arrays are unchanged. Run
      these invariants alongside the new parent-session admission through
      both the core and registered hook, which fails at the merge base.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k 'policy or vocabulary or session_helper_uses_parent_claim'"
  - id: dod-original-ac3-hook-inventory
    description: >
      AC-3 registration and typed inventory owner, ticket, mask and canary
      remain covered. The registered hook must also admit and record the
      delegated create, a behavior its merge-base implementation refuses.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k 'registered_and_executable or typed_inventory or inventory_contract or session_helper_uses_parent_claim'"
  - id: dod-original-ac4-registered-refusal
    description: >
      AC-4 the registered shell hook still refuses an unbound create end to
      end, alongside an admitted delegated create and its parent binding,
      label, project and stamp refusals. The merge base fails the delegated
      admission and cannot distinguish its other refusal reasons.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k 'registered_hook_blocks_a_create_with_no_binding or session_helper_uses_parent_claim or session_helper_keeps_other_create_rules or session_helper_cannot_stamp'"
  - id: dod-original-ac5-shipped-documentation
    description: >
      AC-5 ships the delegated-create authority and audit fields in
      CLAUDE.md. Hosted verification checks those
      instructions and exercises the documented admission and refusal paths.
      The merge base has neither these instructions nor parent admission.
    source: manual
    status: verified
    binds_ac: [AC5]
    checks:
      - check_type: command
        check_value: "grep -Fq 'parent-session+claim' CLAUDE.md && grep -Fq 'OMNI_LANE_LIVENESS_STATE_DIR' CLAUDE.md && uv run pytest tests/hooks/test_ticket_creation_guard_lane_intake.py -q --no-cov -k 'session_helper or headless_session_cannot or node_cannot_borrow'"
