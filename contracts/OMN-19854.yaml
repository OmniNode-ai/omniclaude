schema_version: "1.0.0"
ticket_id: OMN-19854
title: "Run the repo-evidence caller's verifier-floor check from a required CI step"
summary: >
  The ruling of 2026-10-10T11:04:11Z requires the hosted repo-evidence / dod-verify context to refuse
  a contract whose acceptance criteria are only partly bound, in every repository. The refusal comes
  from the pinned verifier (0.4.303 or newer) behind a receipt-gate reusable that carries the floor.
  The floor and its pre-commit hook call-repo-evidence-gate-verifier-floor are pinned by
  tests/ci/test_repo_evidence_caller_verifier_floor_omn17427.py. This ticket adds the two things that
  module leaves open: the caller enforces instead of reporting, and a ci.yml step runs the hook's
  module, so a local and a CI verdict cannot disagree.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19854-caller-floor
    statement: "The repo-evidence caller enforces rather than reports, and the floor check the pre-commit hook runs also runs from a required CI step."
    acceptance:
      - id: AC1
        statement: |-
          AC1: the repo-evidence caller job passes shadow "false" and evidence-source caller -- falsifier: a caller copy with shadow "true" that the check admits.
      - id: AC2
        statement: |-
          AC2: a ci.yml step runs the same test module as the call-repo-evidence-gate-verifier-floor pre-commit hook -- falsifier: no ci.yml step naming that module, or a hook running a different module.
evidence_requirements:
  - kind: tests
    description: "The caller enforcement check with its negative control, and the hook and CI parity check"
    command: "uv run pytest tests/ci/test_repo_evidence_caller_verifier_floor_omn19854.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn19854-ac1
    description: "The caller passes shadow false and evidence-source caller; a copy with shadow true is refused. Fails at the merge base, where the test file does not exist."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_verifier_floor_omn19854.py -q --no-cov -k 'repo_owned_evidence or shadow_caller'"
  - id: dod-omn19854-ac2
    description: "A ci.yml step runs the module the hook runs, and a module no step runs is not found. Fails at the merge base, which has no such step."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_verifier_floor_omn19854.py -q --no-cov -k 'required_ci_job or ci_step_check'"
