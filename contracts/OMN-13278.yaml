ticket_id: "OMN-13278"
title: "Hook measurement harness and tiered reintroduction design"
summary: >-
  Adds a read-only hook measurement harness and a tiered hook reintroduction
  design without re-enabling hooks.json. The harness reads existing telemetry
  surfaces and compares hooks-off versus hooks-on windows for token, latency,
  and delegation metrics. The PR is design-first and keeps live hook behavior
  disabled until the reintroduction tiers are reviewed.
