title: "Review findings 1 to 3 on omniclaude#3287 are fixed or argued: the guard's config lookup is proven by a test that fails when the stale clone is read, and the install and Lab proof are bound to the new head"
summary: >
  The agent-model guard script and the guard module read lib/ and config/ from their own installed tree and never from
  OMNI_HOME. The stale-clone hook test now builds a full hooks tree without haiku (lib/, scripts/, config/, .git), and two
  mutants of the installed tree that consult it are refused. The band pin is also read through the guard's own parser, the
  installed= pattern accepts a hostname with a hyphen, a dot or a capital, and the pass counts are re-run.
