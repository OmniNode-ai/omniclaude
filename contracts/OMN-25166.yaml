      - id: "AC2"
        statement: |-
          AC2: the stale-clone hook test builds a full hooks tree without haiku in the layout the hook looks up (lib/, scripts/, config/, .git) and goes red when that clone is consulted, shown by a run that fails against the old lookup and passes on the fix
