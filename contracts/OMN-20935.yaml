schema_version: 1.0.0
ticket_id: OMN-20935
title: omniclaude's dev-head monitor reads the CI bus lane table from the CI overlay, not omnimarket
summary: The dev-head monitor job in auto-merge-stale-poller.yml no longer sparse-checks-out config/ci_bus_lanes.yaml from omnimarket. It reads config/lab/ci_bus_lanes.yaml from the CI overlay repository named by the org Actions variable OMNI_CI_OVERLAY_REPO, through a read-only App token, and fails when the variable is unset, the repository is unreadable or the file is missing. The scripts/publish_occ_autobind_command.py and topics.py checkouts from omnimarket at the locked sha are unchanged. This is the omniclaude half of moving the readers off omnimarket before omnimarket's copy is removed.
