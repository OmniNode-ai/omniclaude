    description: >-
      Hosted deploy probe of the CI wiring: the source pin must name the merged
      landed-proof verifier. Runs from the checkout without lab services.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_handler_shape_validator_pin_omn20935.py -q --no-cov
        cwd: ${OMNI_HOME}/omniclaude
  - id: dod-omn20935-consumer-ac2-proof-inputs
    description: The same regression fails if the full scan, baseline or receipt directory is removed.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_handler_shape_validator_pin_omn20935.py -q --no-cov
        cwd: ${OMNI_HOME}/omniclaude
  - id: dod-omn20935-ac2-monitor-reads-the-overlay
    description: 'AC3: the dev-head monitor workflow reads the lane table from the CI overlay and not from omnimarket.'
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_dev_head_monitor_omn18836.py -q -p no:randomly --no-cov
        cwd: ${OMNI_HOME}/omniclaude
