---
schema_version: "1.0.0"
ticket_id: OMN-20935
title: Pin the handler-shape check to the landed no-legacy proof fix, and read the dev CI bus lane table from the CI overlay, not omnimarket
summary: >-
  The locked validator release rejects an unchanged Linear handler receipt after
  its handler lands. Pin only the ratchet's source checkout to the merged
  omnibase_core#2032 fix, retaining the full scan, baseline and receipt proofs.
  The dev-head monitor job in auto-merge-stale-poller.yml no longer sparse-checks-out
  config/ci_bus_lanes.yaml from omnimarket. It reads config/lab/ci_bus_lanes.yaml from
  the CI overlay repository named by the org Actions variable OMNI_CI_OVERLAY_REPO,
  through a read-only App token, and fails when the variable is unset, the repository
  is unreadable or the file is missing. The scripts/publish_occ_autobind_command.py and
  topics.py checkouts from omnimarket at the locked sha are unchanged. This is the
  omniclaude half of moving the readers off omnimarket before omnimarket's copy is removed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20935-consumer-validator-pin
    statement: The consumer executes the fixed validator with its existing proof inputs.
    acceptance:
      - id: AC1
        statement: The ratchet source checkout uses the immutable landed-proof fix.
      - id: AC2
        statement: The full scan still uses this repository's baseline and adequacy receipts.
  - id: req-omn20935-omniclaude-reader-takes-the-lane-table-from-the-overlay
    statement: The dev-head monitor job resolves the dev CI bus lane table from the CI overlay repository and never from omnimarket's config/ci_bus_lanes.yaml.
    acceptance:
      - id: AC3
        statement: 'AC3: the dev-head monitor job reads the lane table from the CI overlay and not from omnimarket -- falsifier: pytest tests/ci/test_dev_head_monitor_omn18836.py::test_dev_lane_table_is_read_from_the_ci_overlay_not_omnimarket fails on the workflow before this change and passes after it'
evidence_requirements:
  - kind: tests
    description: The workflow regression rejects the old validator pin or missing proof arguments.
    command: uv run pytest tests/ci/test_handler_shape_validator_pin_omn20935.py -q --no-cov
  - kind: tests
    description: 'AC3: the monitor job''s omnimarket sparse checkout lists no config/ci_bus_lanes.yaml, the job resolves OMNI_CI_OVERLAY_REPO, mints a read-only contents token, sparse-checks-out config/lab/ci_bus_lanes.yaml and loads the lane table from that path.'
    command: uv run pytest tests/ci/test_dev_head_monitor_omn18836.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
