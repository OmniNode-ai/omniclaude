schema_version: 1.0.0
ticket_id: OMN-19513
title: Retain the hook drainer configuration root and recovery backlog
summary: The launchd installer retains an explicitly selected workspace configuration root and refuses a root without the hook-edge overlay before replacing the agent. Recovery installations can preserve queued records through failed publication and drain them without overflow eviction. Live host recovery and projection readback remain pending landing and reinstallation.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-hook-drainer-config-root
    statement: The launchd environment retains the selected broker overlay, while an invalid overlay refuses installation before replacing the previous agent.
    acceptance:
      - id: AC1
        statement: 'AC1: the rendered launchd environment resolves the broker from the selected configuration root, including a symlink and XML-special characters, and a missing overlay leaves the previous agent intact -- falsifier: uv run pytest tests/scripts/test_install_hook_emit_drainer_config_root.py -q --no-cov -k "overlay_survives or missing_overlay" fails against the pre-fix installer'
  - id: req-hook-drainer-preserve-backlog
    statement: Recovery mode retains an overflowing journal through a failed publish and then publishes every retained record in FIFO order without a loss log.
    acceptance:
      - id: AC2
        statement: 'AC2: preserve_backlog retains every queued record after failed publication, then publishes every record in order without overflow loss -- falsifier: uv run pytest tests/unit/hooks/test_hook_emit_drainer.py -q --no-cov -k recovery_retains_overflow_then_publishes_every_record fails against the pre-fix drainer'
  - id: req-hook-capture-raw
    statement: Every captured hook event and content record carries the raw field values the harness sent, with no scrub and no hash (operator RULING 2026-10-15T04:24:42Z).
    acceptance:
      - id: AC3
        statement: 'AC3: each hook.event content reference carries the raw value and no sha256, and map_hook_stdin takes no scrubber -- falsifier: uv run pytest tests/unit/hooks/test_hook_claude_capture_omn19513.py tests/unit/hooks/test_claude_hook_capture_contract.py -q --no-cov -k "raw or digest or no_scrubber" fails against the pre-change producer'
      - id: AC4
        statement: 'AC4: content.captured records carry the raw prompt, tool input, tool result and error with no producer redaction, no in-place hash and no secret-store swap -- falsifier: uv run pytest tests/unit/hooks/test_hook_content_capture_omn19551.py tests/unit/hooks/test_failed_call_content_capture_omn18946.py -q --no-cov -k "raw or secret_store" fails against the pre-change producer'
      - id: AC5
        statement: 'AC5: payload encryption is one contract setting, off by default, and the omniclaude registry projects the omnimarket publish transform for hook.event and content.captured -- falsifier: uv run pytest tests/unit/hooks/test_hook_claude_capture_omn19513.py -q --no-cov -k "encryption or publish_transform" fails against the pre-change contract'
  - id: req-hook-capture-encryption
    statement: With the payload_encryption setting on, both capture producers journal an encrypted payload under a key read from the secret store, the same key opens it, and an unreadable key journals nothing; with it off nothing changes. The setting stays off.
    acceptance:
      - id: AC6
        statement: 'AC6: hook.event and content.captured payloads are AES-256-GCM sealed with a key read by key_secret_ref, open to the plaintext payload with the same key, and are not journalled when the key cannot be read -- falsifier: uv run pytest tests/unit/hooks/test_hook_payload_encryption_omn19513.py -q --no-cov fails against the pre-change producers'
  - id: req-hook-capture-raw-guard
    statement: A change that brings a scrub, a content digest or a redaction field back into the hook and content capture producers is refused in CI and in pre-commit (operator RULING 2026-10-15T04:24:42Z).
    acceptance:
      - id: AC7
        statement: 'AC7: the raw-capture guard passes on the producer and fails on each of a digest or redaction field on the content models, a scrub parameter on map_hook_stdin, a retired scrub name in either producer, a digest in the contract content reference and a missing payload_encryption block -- falsifier: uv run pytest tests/ci/test_raw_capture_guard_omn19513.py -q --no-cov -k raw_today fails against the producer sources before omniclaude#2767'
  - id: req-hook-local-bus-first
    statement: The hook lands each raw event on the host's local bus through its HTTP proxy, journals only while that bus is unreachable or undeclared, and quarantines an over-limit event with its reason instead of sending or retrying it.
    acceptance:
      - id: AC8
        statement: 'AC8: an event with a declared local bus reaches the proxy as an emit request on the contract topic and is not journalled; a refused, hung or undeclared bus journals it; an over-limit event is quarantined with reason payload_too_large and never sent -- falsifier: uv run pytest tests/unit/hooks/test_hook_local_bus_publish_omn19513.py -q --no-cov fails against the pre-change hook_emit_append'
evidence_requirements:
  - kind: tests
    description: Selected configuration survives launchd rendering and missing overlays preserve the previous agent.
    command: uv run pytest tests/scripts/test_install_hook_emit_drainer_config_root.py -q --no-cov -k "overlay_survives or missing_overlay"
  - kind: tests
    description: Recovery retains overflowing queued records through failure and publishes them in FIFO order without a loss log.
    command: uv run pytest tests/unit/hooks/test_hook_emit_drainer.py -q --no-cov -k recovery_retains_overflow_then_publishes_every_record
  - kind: tests
    description: Hook events and content records carry raw values with no scrub and no hash; encryption is one setting, off.
    command: uv run pytest tests/unit/hooks/test_hook_claude_capture_omn19513.py tests/unit/hooks/test_claude_hook_capture_contract.py tests/unit/hooks/test_hook_content_capture_omn19551.py tests/unit/hooks/test_failed_call_content_capture_omn18946.py -q --no-cov
  - kind: tests
    description: Payload encryption seals both capture classes with a throwaway key, opens them with the same key, journals nothing without a key and changes nothing when off.
    command: uv run pytest tests/unit/hooks/test_hook_payload_encryption_omn19513.py -q --no-cov
  - kind: tests
    description: The raw-capture guard accepts the raw producer and refuses each reintroduced scrub, digest or redaction field.
    command: uv run pytest tests/ci/test_raw_capture_guard_omn19513.py -q --no-cov
  - kind: tests
    description: The local-bus publish handler and hook_emit_append land events on a stand-in HTTP proxy, fall back to the journal, and quarantine over-limit events.
    command: uv run pytest tests/unit/hooks/test_hook_local_bus_publish_omn19513.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn19513-config-root
    description: The existing installer tests exercise broker resolution from the rendered launchd environment and refusal before replacing an agent.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/scripts/test_install_hook_emit_drainer_config_root.py -q --no-cov -k "overlay_survives or missing_overlay"
    binds_ac:
      - AC1
  - id: dod-omn19513-preserve-backlog
    description: The existing recovery test retains every record through failed publication and checks ordered publication without overflow loss.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/hooks/test_hook_emit_drainer.py -q --no-cov -k recovery_retains_overflow_then_publishes_every_record
    binds_ac:
      - AC2
  - id: dod-omn19513-raw-hook-event
    description: The hook.event producer journals raw content values with no digest and needs no scrubber.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/hooks/test_hook_claude_capture_omn19513.py tests/unit/hooks/test_claude_hook_capture_contract.py -q --no-cov -k "raw or digest or no_scrubber"
    binds_ac:
      - AC3
  - id: dod-omn19513-raw-content
    description: The content.captured producer journals raw content with no redaction, in-place hash or secret-store swap.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/hooks/test_hook_content_capture_omn19551.py tests/unit/hooks/test_failed_call_content_capture_omn18946.py -q --no-cov -k "raw or secret_store"
    binds_ac:
      - AC4
  - id: dod-omn19513-encryption-setting
    description: The capture contract declares payload_encryption off by default and the registry projects the omnimarket publish transform for both classes.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/hooks/test_hook_claude_capture_omn19513.py -q --no-cov -k "encryption or publish_transform"
    binds_ac:
      - AC5
  - id: dod-omn19513-payload-encryption
    description: The payload encryption tests seal both capture classes under a generated throwaway key, open them with it, refuse an unreadable key and leave the off path untouched.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/hooks/test_hook_payload_encryption_omn19513.py -q --no-cov
    binds_ac:
      - AC6
  - id: dod-omn19513-encryption-container-smoke
    description: Run the payload encryption smoke tests in a fresh Python container against the checked-out runtime. Both capture classes must seal and open with a throwaway key, refuse unavailable keys and leave the off path unchanged. No production key or service is used.
    source: manual
    checks:
      - check_type: command
        check_value: 'docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace --env CI=true ghcr.io/astral-sh/uv:python3.12-bookworm-slim uv run --no-project --with pytest==9.1.1 --with pytest-asyncio==1.3.0 --with pytest-cov==7.1.0 --with python-dotenv==1.2.2 --with pydantic==2.13.4 --with cryptography==50.0.1 --with pyyaml==6.0.3 pytest tests/unit/hooks/test_hook_payload_encryption_omn19513.py -q --no-cov -p no:cacheprovider'
    binds_ac:
      - AC6
  - id: dod-omn19513-raw-capture-guard
    description: The guard test passes on the raw producer and its negative controls refuse each reintroduced scrub, digest or redaction field. Registration checks require its pre-commit hook and its unconditional, fail-closed CI refusal-surface step; either registration missing at the merge base fails the evidence.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_raw_capture_guard_omn19513.py -q --no-cov
      - check_type: command
        check_value: >-
          python -c 'from pathlib import Path; import yaml;
          config = yaml.safe_load(Path(".pre-commit-config.yaml").read_text());
          hooks = [h for repo in config["repos"] for h in repo["hooks"] if h["id"] == "raw-capture-guard"];
          assert len(hooks) == 1, "raw-capture-guard must be registered once";
          hook = hooks[0];
          assert hook["entry"] == "bash scripts/uv-run-worktree-safe.sh pytest tests/ci/test_raw_capture_guard_omn19513.py -q --no-cov";
          assert hook["language"] == "system" and hook["pass_filenames"] is False and "pre-commit" in hook["stages"]'
      - check_type: command
        check_value: >-
          python -c 'from pathlib import Path; import yaml;
          workflow = yaml.safe_load(Path(".github/workflows/ci.yml").read_text());
          steps = workflow["jobs"]["refusal-surface"]["steps"];
          guards = [s for s in steps if s.get("run") == "uv run pytest tests/ci/test_raw_capture_guard_omn19513.py -q --no-cov"];
          assert len(guards) == 1, "CI refusal-surface must run the raw-capture guard once";
          assert not guards[0].get("continue-on-error", False) and "if" not in guards[0]'
    binds_ac:
      - AC7
  - id: dod-omn19513-local-bus-first
    description: The local-bus tests run the real urllib request against a loopback stand-in proxy, the journal fallback for a refused, hung and undeclared bus, the quarantine of an over-limit event, and the stdlib-only import check.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/hooks/test_hook_local_bus_publish_omn19513.py -q --no-cov
    binds_ac:
      - AC8
