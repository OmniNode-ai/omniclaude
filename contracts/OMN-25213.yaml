    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/hooks/test_workflow_model_guard.py -q --no-cov"
    binds_ac: ["AC3"]
  - id: dod-omn25213-ac4
    description: "AC4: the focused file passes on a lab host at the new head, the head is pushed to the pull request's own branch, and a pull request comment starts with Lab: head= and the new head sha and names the suite"
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/hooks/test_workflow_model_guard.py -q --no-cov"
      - check_type: command
        check_value: |-
          set -o pipefail
          head=$(git rev-parse HEAD)
          test "$(git rev-parse origin/omn-24977-haiku-band-routing-contract)" = "$head"
          gh api "repos/OmniNode-ai/omniclaude/issues/3287/comments" --paginate \
            --jq ".[].body | select(startswith(\"Lab: head=${head}\") and contains(\"tests/hooks/test_workflow_model_guard.py\"))" \
            | grep -q .
