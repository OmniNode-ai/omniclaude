dod_evidence:
  - id: dod-omn25213-ac1
    description: "AC1: the OMNI_HOME comment and Lab comment checks read what the comment shows, the grep half requires exit 1, and the install check follows an installed head through contract-only commits; the new tests fail against the contracts of head 94f564ef6f68 and pass on this head"
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/hooks/test_workflow_model_guard.py -q --no-cov"
      - check_type: command
        check_value: |-
          set -o pipefail
          head=$(git rev-parse HEAD)
          rc=0
          grep -n OMNI_HOME plugins/onex/hooks/scripts/pre_tool_use_agent_model_guard.sh \
            plugins/onex/hooks/lib/workflow_model_guard.py plugins/onex/hooks/hooks.json || rc=$?
          test "$rc" -eq 1 || exit 1
          gh api "repos/OmniNode-ai/omniclaude/issues/3287/comments" --paginate \
            --jq ".[].body | select(startswith(\"OMNI_HOME: head=${head}\") and contains(\"grep -n OMNI_HOME\") and contains(\"onex-paths.sh\") and contains(\"hook_refusal.sh\") and contains(\"is not an allowed background model\"))" \
            | grep -q .
    binds_ac: ["AC1"]
  - id: dod-omn25213-ac2
    description: >-
      AC2: no STATUS row names installed=<host>:<sha> with the observed text for a head whose plugins/onex tree is
      this one. The orchestrator ruled not to amend AC4 of OMN-24977 and to install on the Mac itself; a lab lane
      cannot reach the Mac. The entry stays pending until that row exists, and the check accepts the row at any
      40-hex sha that is an ancestor of the head with no change under plugins/onex since.
    source: manual
    execution_scope: local_done_gate
    status: pending
    checks:
      - check_type: command
        check_value: |-
          set -o pipefail
          head=$(git rev-parse HEAD)
          rows=$(python3 "${OMNI_PLUGIN_ROOT:?}/skills/lane-brief/scripts/lane_brief.py" grep -E 'installed=[A-Za-z0-9._-]+:[0-9a-f]{40}' \
            | grep -F ' | STATUS | ' \
            | grep -E 'proof=[A-Za-z0-9._-]*b1-haiku-stale-clone' \
            | grep -F 'observed=Workflow B1 model=haiku effort=low exit=0 stdout=empty stale_clone_without_haiku=true' || true)
          for sha in $(printf '%s\n' "$rows" | grep -oE 'installed=[A-Za-z0-9._-]+:[0-9a-f]{40}' | sed 's/^.*://' | sort -u); do
            if git merge-base --is-ancestor "$sha" "$head" && git diff --quiet "$sha" "$head" -- plugins/onex; then
              exit 0
            fi
          done
          exit 1
    binds_ac: ["AC2"]
  - id: dod-omn25213-ac3
    description: "AC3: OMN-25193 is in the contract file list, the band B1 assertion reads the exact refusal, the base run needs two named haiku tests to fail, and the grep exit code and the OMNI_HOME variable join are checked"
