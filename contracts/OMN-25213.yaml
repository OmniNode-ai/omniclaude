title: "Review findings 1 to 3 on omniclaude PR 3287 at head 94f564ef6f68 are fixed or argued: the install proof is a STATUS row or an amended AC4, the contract entries are no longer pending, and the Lab comment is at the new head"
summary: >
  The review of omniclaude#3287 at head 94f564ef6f68 asked for the install proof, the OMNI_HOME comment and the Lab
  comment at the new head, and tightened four checks. This change binds the OMNI_HOME and Lab comment checks to what
  the comment shows (not its first line alone), makes the grep half of the OMNI_HOME check require exit 1 so a missing
  file is not clean, follows an OMNI_HOME variable joined to a config path, lets the install-proof check accept an
  installed sha that is an ancestor of the head with no plugins/onex change since, makes the base run of OMN-24977 AC3
  name two failing haiku tests, and adds OMN-25193 to the contract list. The install proof is the orchestrator's: it ruled not to amend AC4 and to install on the Mac.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25213-review-3287
    statement: "The blocking review findings at head 94f564ef6f68 are fixed with tests red on that head, or argued in a pull request comment."
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: every blocking finding (1 to 3) of the review at head 94f564ef6f68 is fixed with a test red on that head and green on the new head, or argued with evidence in a PR comment -- falsifier: `uv run pytest tests/hooks/test_workflow_model_guard.py -q` on the lab at the new head passes while the new tests fail against the source of head 94f564ef6f68
      - id: "AC2"
        statement: |-
          AC2: the install proof is a STATUS row carrying installed=<host>:<new head sha> and observed= text, or AC4 of OMN-24977 is amended with the orchestrator's authorisation, and the four contract entries are no longer pending -- falsifier: `onex-ledger` read of a STATUS row naming installed=<host>:<new head sha> and observed=
      - id: "AC3"
        statement: |-
          AC3: non-blocking findings 4 to 7 are fixed or argued: OMN-25193 is in the contract file list, the band B1 assertion is exact, the base run needs a named haiku failure, and the grep exit code and variable-join checks are tightened -- falsifier: `uv run pytest tests/hooks/test_workflow_model_guard.py -q` red on head 94f564ef6f68 for each tightened check and green at the new head
      - id: "AC4"
        statement: |-
          AC4: the required suites pass on a lab host at the new head (run in named parts when a whole suite times out), the head is pushed to the PR's own branch, and a PR comment starts with Lab: head= followed by the full new head sha -- falsifier: `uv run pytest tests/hooks/test_workflow_model_guard.py -q` run on a lab host through lab-run placement, then `onex scm pr-view OmniNode-ai/omniclaude#3287` listing the Lab: head= comment
