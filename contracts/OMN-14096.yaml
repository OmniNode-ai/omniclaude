ticket_id: OMN-14096
title: "Correct generate_node docs to the scaffold-only pipeline they describe"
summary: >-
  generate_node's SKILL.md and README.md advertised "100% automated node generation",
  "ZERO manual work", a BusinessLogicGenerator that "writes working code", a
  100%-automation performance table, and a fabricated success transcript with a
  quality score. None of it was implemented in this repo. This corrects both public
  skill docs and the registry-facing description on
  node_skill_generate_node_orchestrator to describe what the pipeline provably does:
  AST-only contract inference plus template scaffolding, with handler bodies written
  by hand. Documentation-only; no runtime behaviour changes.
