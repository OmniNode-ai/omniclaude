ticket_id: "OMN-13244"
title: "Disable all onex plugin hooks (gut hooks.json) for a clean measurement baseline"
summary: >-
  Remove every hook registration from plugins/onex/hooks/hooks.json (set
  hooks to an empty object) so Claude Code invokes no onex hooks. This
  establishes a clean, no-instrumentation baseline for measuring whether the
  hook surface helps or hurts before re-introducing hooks deliberately. The
  hook scripts remain on disk; re-registration is a pure config change. The
  two tests that asserted specific registrations in hooks.json are adjusted to
  the empty-registration baseline. The dormant, unreferenced
  hooks-delegation.v1.json (not loaded by Claude Code) is intentionally left
  untouched.
