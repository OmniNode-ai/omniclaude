ticket_id: "OMN-16609"
title: "KB Wave 4: omniclaude doc scrub — migrate to the knowledge base, README-only end state"
summary: >
  Removes every markdown file outside the kb-doc-gate allowed set from this repo after migrating
  what a reader still needs into the public knowledge base (15 pages) and knowledge-base-internal
  (25 pages), deleting the rest as historical, dated planning, audits, or pointer stubs. Points the
  root README at both knowledge bases and flips this repo's .kb-doc-gate.yaml from mode diff to
  mode strict so the scrubbed state is mechanically held. No runtime behaviour changes: the only
  non-markdown edits are dangling-reference repairs in scripts, workflows and two contracts.
