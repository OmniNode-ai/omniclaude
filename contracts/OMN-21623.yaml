    description: "The settings field, the three publisher constants, the two relay publishers and the two event clients read their timeouts from Settings; the new tests fail at the merge base, which has the literals, and pass here."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/config/test_kafka_timeouts_from_settings_omn21623.py tests/lib/core/test_routing_event_client.py tests/lib/core/test_intelligence_event_client.py tests/lib/test_transformation_event_publisher.py tests/unit/ratchet_burndown/test_omn20560_characterization.py -q --no-cov"
