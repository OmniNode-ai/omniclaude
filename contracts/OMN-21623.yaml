  - kind: tests
    description: "The topic-manifest tests and the existing intelligence config, demo skill and imperative-contract digest tests pass"
    command: "uv run pytest tests/scripts/test_demo_runner_topics_omn21623.py tests/scripts/test_bus_audit_topics_omn21623.py tests/skills/test_demo_topics_manifest_omn21623.py tests/skills/test_demo_skill.py tests/lib/config tests/unit/services/linear_relay tests/ci/test_imperative_contract_guard_caller_omn21006.py -q --no-cov"
