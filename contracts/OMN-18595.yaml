requirements:
  - id: "req-omn18595-core-dev-tag-pin"
    statement: "omnibase-core is read from an omnibase_core dev merge tag carrying at least 0.47.61, in pyproject.toml and uv.lock alike, so internal-sibling-pins allows it."
    acceptance:
      - id: "AC1"
        statement: "AC1: uv run pytest tests/ci/test_core_dev_tag_pin_omn18595.py -- falsifier: with the PyPI release pin of origin/dev all three tests fail, the sibling-pins one with omnibase-core REFUSED"
  - id: "req-omn18595-core-0-47-61-api"
    statement: "The tests that read core's API run against 0.47.61: the dev merge tag rule comes from validator_first_party_ref, and the local-paths rule runs the compute node core's check-local-paths hook runs at v0.47.61."
    acceptance:
      - id: "AC2"
        statement: "AC2: uv run pytest tests/unit/handlers/test_handler_dev_merge_tag_omn19972.py -k rule_matches_omnibase_core_contract -- falsifier: the old import of handler_internal_sibling_pins_cli fails to collect under core 0.47.61"
      - id: "AC3"
        statement: "AC3: uv run pytest tests/scripts/validator_parity_omn20566/test_node_parity.py -k 'local_paths and not real_tree or pin_the_locked_core_version' -- falsifier: running validator_local_paths as a module under core 0.47.61 reports no finding and eight golden cases fail"
evidence_requirements:
