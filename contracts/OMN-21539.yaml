schema_version: "1.0.0"
ticket_id: OMN-21539
title: "omniclaude consumes the core validators it lacks by hook id, each at a zero-target baseline"
summary: >
  Validators-to-core plan task T2.1, omniclaude slice. handler-di-gate and
  check-no-backward-compat are omnibase_core hook ids, now declared in
  .pre-commit-config.yaml under repo https://github.com/OmniNode-ai/omnibase_core at the
  dev-merge tag dev-20261101023710-a66b5ff79cc0, in one block that is the only home of that
  tag. The whole-tree CI step is the precommit-suite job of ci.yml, which runs
  pre-commit run --all-files, so it reads the rev from the config and holds no second
  literal. Each wired id carries one generated per-file baseline under .onex/baselines/
  (the location the core hooks document) that only shrinks, has no suppression marker and
  admits no file the findings table names (F49, omniclaude#3019: the two scripts and their
  tests, plus the hook config). Not wired: check-no-dict-any (its baseline of 1673 entries
  in 345 files would add 26 suppression comments, the any-ok markers in the offending
  source lines, and the canonical-file-shape ratchet refuses suppression growth),
  check-no-io-outside-effects (135 findings in 35 files) and check-hardcoded-topic-compute
  (84 report lines in 37 files), neither of which takes a baseline at this tag.
  check-no-raw-sqlite3 was already wired by id (v0.47.57, scoped to src and plugins).
  vr.yaml does not exist in this repository.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21539-wiring
    statement: Each wired core hook id resolves to the omnibase_core URL, runs in the whole-tree CI step, and its baseline admits no F49 file.
    acceptance:
      - id: AC1
        statement: "AC1: each wired hook id resolves to the omnibase_core repo URL in .pre-commit-config.yaml and runs in ci.yml -- falsifier: a pytest case parsing both files for the hook ids, plus pre-commit run --all-files listing every wired id"
      - id: AC2
        statement: "AC2: the omniclaude canary defects marked NO-VALIDATOR or MISSED in section A.5 of the plan are CAUGHT locally and in CI -- falsifier: re-run the 24-defect validator canary against omniclaude and compare with the A.5 table"
      - id: AC3
        statement: "AC3: every baseline is per-file, shrink-only to zero, carries no suppression marker, and a canary commit adding one finding to a baselined file is refused -- falsifier: the canary commit's pre-commit run exits non-zero, and a grep of every baseline for the files D.3 names returns nothing"
      - id: AC4
        statement: "AC4: each burn-down ticket for a non-empty baseline exists and names its zero date -- falsifier: list_issues by parent returns the burn-down tickets; the baseline reaches zero on that date, read from the file"
      - id: AC5
        statement: "AC5: Configuration and Bindings: hook ids and tags come from the shared hook repo pin (one home), not a second literal -- falsifier: K11 first_party_ref_two_homes reports zero"
evidence_requirements:
  - kind: tests
    description: "The wiring test and the tests of the two files this change touches pass"
    command: "uv run pytest tests/ci/test_core_hook_ids_omn21539.py tests/ci/test_precommit_core_hooks_canary_omn21499.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21539-ac1-wiring-test
    description: "The wiring test parses .pre-commit-config.yaml and the precommit-suite job of ci.yml: each wired id resolves to the omnibase_core URL at one dev-merge tag, names its baseline, and the CI step runs pre-commit run --all-files with no hook filter and no SKIP. Fails at the merge base, where the three ids are not declared."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_core_hook_ids_omn21539.py -q --no-cov"
        cwd: "."
  - id: dod-omn21539-ac1-deploy-config-on-branch
    description: "Deploy check: the pre-commit config at the checked-out head, read through the GitHub contents API, declares handler-di-gate and check-no-backward-compat. Fails at the merge base, where neither is declared."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: "gh api \"repos/OmniNode-ai/omniclaude/contents/.pre-commit-config.yaml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d > \"${RUNNER_TEMP:-/tmp}/omn21539-config.yaml\" && grep -q 'id: handler-di-gate' \"${RUNNER_TEMP:-/tmp}/omn21539-config.yaml\" && grep -q 'id: check-no-backward-compat' \"${RUNNER_TEMP:-/tmp}/omn21539-config.yaml\""
  - id: dod-omn21539-ac2-canary
    description: "The canary hook id that A.5 marks missing in omniclaude and that this change wires (backcompat; dict_any stays unwired, see the summary) is wired, and the lab canary run recorded in the PR comment that starts Lab: head= refuses a backward-compat marker added to a baselined file. Fails at the merge base, which declares neither handler-di-gate nor check-no-backward-compat."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: "git grep -q -E 'id: handler-di-gate' -- .pre-commit-config.yaml && git grep -q -E 'id: check-no-backward-compat' -- .pre-commit-config.yaml"
        cwd: "."
  - id: dod-omn21539-ac3-baselines-clean
    description: "No baseline names a file that finding F49 names (the hook config, the two scripts and the three test files of omniclaude#3019), and no baseline body line carries a suppression marker. Fails at the merge base only if a baseline admitted one of them."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: "! grep -n -E '(\\.pre-commit-config\\.yaml|scripts/auto_generate_skill_nodes\\.py|scripts/detect_secrets_guard\\.py|tests/scripts/test_detect_secrets_guard\\.py|tests/unit/scripts/test_auto_generate_skill_nodes\\.py|tests/ci/test_precommit_core_hooks_canary_omn21499\\.py)' .onex/baselines/handler-di-gate.txt .onex/baselines/check-no-backward-compat.yaml .onex/baselines/check-no-backward-compat.yaml"
        cwd: "."
  - id: dod-omn21539-ac3-baseline-shape
    description: "Each baseline is non-empty, per file, and every entry points at a file that exists; the wiring test holds the F49 and suppression-marker cases. Fails at the merge base, which has none of the baselines."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_core_hook_ids_omn21539.py -q --no-cov -k baseline"
        cwd: "."
  - id: dod-omn21539-ac4-burndown-baselines
    description: "The baselines the burn-down tickets cover exist and are non-empty. The tickets and their zero dates are minted by the orchestrator from the lane report; a lab lane cannot mint them, so this pins only the files they burn down."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: command
        check_value: "test -s .onex/baselines/handler-di-gate.txt && test -s .onex/baselines/check-no-backward-compat.yaml && test -s .onex/baselines/check-no-backward-compat.yaml"
        cwd: "."
  - id: dod-omn21539-ac5-one-home
    description: "The dev-merge tag of the new block appears once in .pre-commit-config.yaml and nowhere in the workflows, so the CI step reads it from the config. Fails at the merge base, where the tag is absent from the config."
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: command
        check_value: "test \"$(git grep -c -F 'dev-20261101023710-a66b5ff79cc0' -- .pre-commit-config.yaml | cut -d: -f2)\" = 1 && ! git grep -q -F 'dev-20261101023710-a66b5ff79cc0' -- .github"
        cwd: "."
