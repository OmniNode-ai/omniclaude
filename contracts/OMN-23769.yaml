---
schema_version: 1.0.0
ticket_id: OMN-23769
title: The Mac ticket gate refuses a raw create and refuses an agent's edit of a standard ticket's contract
  block or title
summary: The Mac's ticket-creation hook carries the core create_route and contract_block_edit rows in its
  policy and applies them. With the overlay switch at refuse (ONEX_TICKET_CREATE_ROUTE_SWITCH or
  ~/.omnibase/ticket_create_route_switch) a raw MCP create is refused naming onex ticket create --draft;
  the node passes --node and is admitted. An update that changes a standard ticket's contract block or
  title is refused naming onex ticket sync, whatever the switch. The unset switch is allow, so agents can
  always create until it is flipped.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23769-hook-route-rows
    statement: The Mac hook refuses a raw create with the switch at refuse and a hand edit of a standard
      ticket's contract block or title, each naming the command that replaces it.
    acceptance:
      - id: AC1
        statement: 'AC1: with the switch at refuse, a raw MCP create is refused naming onex ticket create
          -- falsifier: uv run pytest plugins/onex/hooks/tests -q -k create_route_refused'
      - id: AC2
        statement: 'AC2: the hook''s route rows equal the core rows read from the installed omnibase_core
          -- falsifier: uv run pytest tests/hooks/test_ticket_route_rows_match_core.py -q -k hook_route_rows_match_core'
      - id: AC3
        statement: 'AC3: an MCP save_issue update whose description changes a standard ticket''s contract
          block, or its title, is refused contract_block_edit naming onex ticket sync, whatever the switch
          value -- falsifier: uv run pytest plugins/onex/hooks/tests -q -k contract_block_edit_refused'
      - id: AC4
        statement: 'AC4: integrated: done only when running and observed where it runs: the switch is flipped
          on the Mac and one raw create is refused and one node create succeeds in the same session --
          falsifier: the two hook decisions read from the session, the output pasted in the pull request'
evidence_requirements:
  - kind: tests
    description: The route gate tests, the core-row comparison and the existing ticket-creation guard tests.
    command: uv run pytest plugins/onex/hooks/tests/test_ticket_route_gate.py tests/hooks/test_ticket_route_rows_match_core.py
      -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23769-ac1
    description: A raw create with the switch at refuse is refused naming the node command; the same create
      with the switch at allow or unset, or from the node, is admitted.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest plugins/onex/hooks/tests -q -k create_route_refused
        cwd: .
  - id: dod-omn23769-ac2
    description: The hook's two route rows equal the rows read from the installed omnibase_core; a row
      changed on one side is caught.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/hooks/test_ticket_route_rows_match_core.py -q -k hook_route_rows_match_core
        cwd: .
  - id: dod-omn23769-ac3
    description: A full description or a patch that changes the contract block, or a new title on a ticket
      that carries one, is refused naming onex ticket sync whatever the switch; edits outside the block
      and the title, and the node's own edit, are admitted.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest plugins/onex/hooks/tests -q -k contract_block_edit_refused
        cwd: .
  - id: dod-omn23769-ac4
    description: The two hook decisions with the switch at refuse, through the registered hook script and
      the node's own call; the same decisions on the Mac session are pasted in the pull request.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest plugins/onex/hooks/tests -q -k session_the_hook_script
        cwd: .
  - id: dod-omn23769-integration-proof
    description: The change run from the pushed branch on a lab host - the registered hook script refuses
      a raw create with the switch at refuse and admits the node's own call. Hosted CI cannot reach the
      lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omniclaude --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23769 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest plugins/onex/hooks/tests/test_ticket_route_gate.py -q --no-cov -k session_the_hook_script
  - id: dod-omn23769-deploy
    description: The route gate handler on the PR branch on GitHub carries edit_findings, read with gh api
      at the branch ref; it fails if the handler or the symbol is absent.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: command
        check_value: gh api "repos/OmniNode-ai/omniclaude/contents/src/omniclaude/nodes/node_linear_effect/handlers/handler_ticket_route_gate.py?ref=omn-23769-ticket-gate-route-rows" --jq .content | base64 -d | grep -q 'def edit_findings'
