title: "Phase 4a: migrate 24 dispatch shims to the single-command onex skill receipt pattern (omniclaude markdown)"
summary: >-
  Migrate all 24 dispatch-only shim skills in omniclaude to the single-command `onex skill <name> [args]`
  receipt pattern proven by delegate in Phase 2b. Each migrated skill's dispatch becomes ONE CLI call
  printing exactly one ModelSkillResult[T]; SKILL.md declares skill_kind: dispatch (delegation-enforcer
  exemption from OMN-13096); prompt.md procedure bodies are deleted to frontmatter + the one command +
  result presentation; skill-local executable logic (merge_sweep/_lib, hostile_reviewer aggregator,
  pr_review sub-skill scripts, delegate/_lib) is removed so a skill directory contains markdown only. The
  onex skill subcommand + declarative skill_mapping.yaml and all 23 node-side typed result models landed
  in omnibase_infra PR #1968 and prior omnimarket work respectively; this contract binds the omniclaude
  markdown-migration slice. No bare onex run/node/run-node calls and no cat workflow_result.json remain in
  any migrated dispatch shim.
