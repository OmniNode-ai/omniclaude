schema_version: "1.0.0"
ticket_id: OMN-20844
title: "Onboarding takes the OpenRouter default model from the onex overlay"
summary: >
  The onboarding script named an OpenRouter model itself. It now names none:
  phase 3 reads the default with `onex models default-model openrouter`, which
  resolves it from the node_model_setup_effect overlay (fetched once for the
  developer's GitHub login when no overlay is reachable), passes it to
  `onex models add openrouter --model`, and with no overlay declaring a default
  ends OpenRouter with the reason and nothing stored while the other models carry
  on. The developer changes the model afterwards with one command.
