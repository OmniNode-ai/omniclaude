schema_version: "1.0.0"
ticket_id: OMN-19998
title: "Hostile Reviewer: the job validates the CI overlay's retry budget and its ceiling holds two review attempts"
summary: >
  The Hostile Reviewer's voter timeouts come from the CI overlay, not this repository. A voter given
  more time in the overlay could push the review past the job's 20-minute ceiling, which then cancels
  the job with no named cause; the review step also runs cli_review up to twice, which the ceiling did
  not account for. The job now runs omniintelligence's retry_budget check against the fetched overlay
  before the review, with each attempt's share of the ceiling, and fails closed with the sum and the
  voter when the roster cannot finish. The ceiling rises to 75 minutes so the overlay's current voters
  fit. No voter is dropped and the gate stays required.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19998-retry-budget
    statement: "The Hostile Reviewer job cannot be cancelled at its ceiling by a voter roster that cannot finish inside it."
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The hostile-review job runs omniintelligence.review_pairing.retry_budget against REVIEW_VOTERS_OVERLAY before the review step, and a violated budget fails the step closed -- falsifier: uv run pytest tests/hooks/test_hostile_reviewer_retry_budget_omn19998.py -k "before_the_review or fails_the_step_closed" with the step removed
      - id: "AC2"
        statement: |-
          AC2: The per-attempt budget is the job ceiling less setup and the pause, split across the review step's attempts, and the ceiling the step reads equals timeout-minutes -- falsifier: uv run pytest tests/hooks/test_hostile_reviewer_retry_budget_omn19998.py -k "job_ceiling or share_of_the_ceiling" with HOSTILE_REVIEW_JOB_TIMEOUT_SECONDS changed alone
  - id: req-omn19998-hosted-eligible-jobs
    statement: "A private repository's job runs on GitHub-hosted runners only when a checked-in declaration lists it under a ruling the placement gate names for that repository."
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: The placement gate accepts a hosted job listed in .github/hosted-eligible-jobs.yaml under a ruling in config/private_repo_hosted_rulings.yaml, and still fails the unlisted twin beside it -- falsifier: uv run pytest tests/scripts/test_private_repo_runner_placement_gate.py -k "listed_hosted_job_passes or unlisted_hosted_job_fails" with load_eligible returning {}
      - id: "AC4"
        statement: |-
          AC4: An entry citing a ruling the registry does not carry, a ruling scoped to another repository, a ruling absent from a readable ledger, or a job no workflow defines is refused -- falsifier: uv run pytest tests/scripts/test_private_repo_runner_placement_gate.py -k "unknown_ruling or does_not_scope or on_the_ledger or does_not_exist" with those checks removed
  - id: req-omn19998-public-runner-placement
    statement: "Operator RULING 2026-10-16T07:07:09Z: CI runners are for private repositories only. omniclaude is public, so no workflow routing fallback names the self-hosted fleet for a public caller, except the lab carve-outs (OMNI_HOSTILE_REVIEW_RUNS_ON_JSON, OMNI_LAB_BUS_RUNS_ON_JSON), and omnibase_core's check-public-runner-placement runs as a CI Summary strict job and as a pre-commit hook at one core release."
    acceptance:
      - id: "AC5"
        statement: |-
          AC5: no workflow line outside the carve-outs falls back to the self-hosted fleet for a public caller (a reusable workflow keeps it only for a private caller), the Public Runner Placement job is unconditional, hosted, carries a positive control and the same core release as the hook, and CI Summary requires its success -- falsifier: uv run pytest tests/ci/test_public_runner_placement_omn19998.py -q fails at the merge base, where 96 fallback lines name the fleet and neither the job nor the hook exists
  - id: "req-omn19998-dev-tag-sibling-pins"
    statement: "Operator RULINGs 2026-10-16T07:34:18Z and 2026-10-16T09:35:49Z: a consumer reads a sibling by tag instead of waiting for a PyPI release. The dep-provenance gate accepts a first-party sibling pinned through [tool.uv.sources] to its own OmniNode-ai repository by a dev merge tag dev-<UTC YYYYMMDDHHMMSS>-<sha12> alone, and keeps refusing a rev, a branch, a release tag, a malformed dev tag and another repository."
    acceptance:
      - id: "AC6"
        statement: "AC6: scripts/check_dep_provenance.py exits 0 for omnibase-core, omnibase-infra, omnibase-spi and omnibase-compat pinned by git = their OmniNode-ai repository and tag = a dev merge tag, and exits 1 for a release tag, a malformed dev tag, another repository, a dev tag beside a rev or branch, and a branch pin to dev -- falsifier: uv run pytest tests/scripts/test_check_dep_provenance_dev_tag_omn19998.py -q fails at the merge base, where the two allow tests fail"
  - id: "req-omn19998-nightly-sibling-pin-train"
    statement: "RULING 2026-10-19T10:11:00Z: once a night, one bump PR per consumer moving every internal sibling pinned by a dev merge tag to its newest dev merge tag whose dev CI is green, plus a workflow_dispatch of the same train; no per-tag PRs. sibling-lock-refresh.yml runs scripts/relock_git_sources.py --dev-tag-train, which passes over red and unread tags, never moves a pin backwards and rewrites through omnimarket's node_dev_tag_pin_mover_compute; the PR step reuses one fixed branch and updates an open PR in place."
    acceptance:
      - id: "AC7"
        statement: "AC7: the train picks the newest green dev tag newer than the pin, skips red and unread tags, moves every member in one plan, writes nothing on a dry run and refuses a member with no clone; the workflow runs the train before uv lock, honours dry_run and reuses one branch -- falsifier: uv run pytest tests/scripts/test_dev_tag_train_omn19998.py tests/workflows/test_sibling_pin_train_omn19998.py -q fails at the merge base"
  - id: "req-omn19998-guard-core-declared-venv"
    statement: "The Bash guard runner runs a decision core it cannot import under its own interpreter through the plugin's declared venvs (CLAUDE_PLUGIN_DATA/.venv, then the OMNI_HOME omniclaude venv), and refuses with the interpreters it tried when none can import it."
    acceptance:
      - id: "AC8"
        statement: "AC8: run_core and the registered pre_tool_use_bash_guards.sh entrypoint run the core under CLAUDE_PLUGIN_DATA/.venv when PLUGIN_PYTHON_BIN cannot import it, and without a declared venv fail with 'guard core cannot be imported' and 'declared interpreters tried' -- falsifier: uv run pytest tests/hooks/test_git_admission_runtime.py tests/hooks/test_shared_tree_git_guard.py -q -k \"runs_missing_core_under_declared_venv or runs_the_core_under_the_declared_venv\" fails at the merge base, where no declared venv is tried"
  - id: "req-omn19998-local-public-repo-hygiene"
    statement: "omniclaude runs the exported public-repo-hygiene command locally before commit, with the repository policy deciding the enforced classes and scope as in CI."
    acceptance:
      - id: "AC8"
        statement: "AC8: exactly one local public-repo-hygiene hook runs the exported command without narrowing its trigger or overriding the repository's enforced classes and added-lines scope, and the caller uses the reusable workflow in this checkout -- falsifier: uv run pytest tests/scripts/test_public_repo_hygiene_local_hook_omn19998.py -q fails at the merge base, where no local public-repo-hygiene hook is declared"
  - id: "req-omn19998-hostile-reviewer-lan-runners"
    statement: "The Hostile Reviewer fallback requires arch-amd64 to stay on LAN runners that can reach its review voters and exclude runners that cannot reach them."
    acceptance:
      - id: "AC9"
        statement: "AC9: the hostile-review job's dedicated runner fallback requires self-hosted, omnibase-ci and arch-amd64, excluding runners that cannot reach the review voters -- falsifier: uv run pytest tests/workflows/test_hostile_reviewer_fleet_and_stderr.py tests/hooks/test_hostile_reviewer_workflow.py -q -k \"arch_amd64 or fleet_literal or self_hosted_runner or public_runner_branch\" fails at the merge base, where the fallback lacks arch-amd64"
  - id: "req-omn19998-test-job-timeout-headroom"
    statement: "The sharded test job's ceiling holds its slowest measured shard with headroom, so a slow runner cannot cancel a shard and turn Tests Gate red with no failing test."
    acceptance:
      - id: "AC10"
        statement: "AC10: the ci.yml test job's timeout-minutes is at least 1.5 times the 903 s that cancelled Split 1/5 on dev head 9ee6e7f115a2 -- falsifier: uv run pytest tests/ci/test_test_job_timeout_headroom_omn19998.py -q fails with timeout-minutes at 15"
evidence_requirements:
  - kind: tests
    description: "Structural tests of the retry-budget step, its arithmetic and its fail-closed exit, beside the existing Hostile Reviewer workflow tests"
    command: "uv run pytest tests/hooks/test_hostile_reviewer_retry_budget_omn19998.py tests/hooks/test_hostile_reviewer_workflow.py -q"
  - kind: tests
    description: "The placement tests read every workflow file for the fleet fallback, the ci.yml job, .pre-commit-config.yaml and the CI Summary gate lists."
    command: "uv run pytest tests/ci/test_public_runner_placement_omn19998.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
