---
schema_version: "1.0.0"
ticket_id: "OMN-23077"
title: "A PR watcher observation is journalled whatever the developer lane admission decides"
summary: "The PR watcher hands each pr.state.observed to hook_emit_append.py and marks the digest emitted when the process starts. Since omniclaude#3052 the appender ran the developer lane admission for every event type except work.ledger.* (OMN-21773); on a refusal it dropped the observation with exit 0 and no record. The pr_state projection stopped at 2026-10-31T00:11:36Z and the factory floor's piece 9 (landing) read snapshot-stale over 900 s. A watcher observation is not a developer hook event, so append_event no longer asks the admission about pr.state.observed; every other class is still governed."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn23077-watcher-events-skip-admission"
    statement: |-
      A pr.state.observed event is journalled whatever the installed omnimarket and whatever the developer lane admission decides; every other event class outside work.ledger.* is still dropped on a refusal.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a pr.state.observed event is journalled when the admission node is missing and for a refused collaborator, and a tool.executed event is still dropped in the same states -- falsifier: uv run pytest on tests/hooks/test_hook_lane_binding_omn21599.py fails test_watcher_observations_are_journalled_when_the_node_is_missing or test_watcher_observations_are_journalled_for_a_refused_collaborator, or either passes with the append_event guard reverted
evidence_requirements:
  - kind: "tests"
    description: "The watcher-observation cases and the existing admission cases pass through the hook appender and its command line."
    command: "uv run pytest tests/hooks/test_hook_lane_binding_omn21599.py -q --no-cov -k watcher_observations"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23077-ac1-watcher-events-skip-admission"
    description: "The two watcher-observation hook tests pass; with the appender guard reverted the same command fails."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/hooks/test_hook_lane_binding_omn21599.py -q --no-cov -k watcher_observations"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC1"]
