schema_version: "1.0.0"
ticket_id: "OMN-21773"
title: "A work-ledger event reaches the bus even when the appender runs under an interpreter without the lane admission node"
summary: "onex-ledger journals every ledger row through hook_emit_append.py under its own interpreter. Since omniclaude#3052 the appender ran the developer lane admission for every event type, and under an interpreter whose omnimarket predates node_developer_lane_admission_compute the refusal dropped each work.ledger.* row with exit 0, no journal record and no failure-log line. The database work ledger projection stopped at 2026-10-31T00:12:25Z. A ledger row is not a developer hook event, so append_event no longer asks the admission about a work.ledger.* type; every other class is still governed."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21773-ledger-events-skip-admission"
    statement: |-
      A work.ledger.* event is journalled whatever the installed omnimarket and whatever the developer lane admission decides; every other event class is still dropped on a refusal.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a work.ledger.* event is journalled when the admission node is missing and for a refused collaborator, and a tool.executed event is still dropped in the same states -- falsifier: uv run pytest on tests/hooks/test_hook_lane_binding_omn21599.py fails test_ledger_events_are_journalled_when_the_node_is_missing or test_ledger_events_are_journalled_for_a_refused_collaborator, or either passes with the append_event guard reverted
evidence_requirements:
