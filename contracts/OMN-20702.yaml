  - id: dod-omn20702-omniclaude-ac4
    description: The node-home activation tests pass, including the check against the committed baseline.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_node_home_activation_omn20702.py -q --no-cov
