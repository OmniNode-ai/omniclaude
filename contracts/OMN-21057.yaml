schema_version: "1.0.0"
ticket_id: OMN-21057
title: "Channel pipeline: contract-named handler classes and declared event models"
summary: >
  node_channel_orchestrator and node_channel_reply_dispatcher name the handler
  classes HandlerChannelOrchestrate and HandlerDispatchReply in their contracts,
  and neither class existed. The classes are added over the unchanged
  module-level functions, and the orchestrator returns the two events its
  contract declares, ChannelReplyRequested and ChannelMessageProcessed. Both
  nodes flip to canonical handler shape with an adequacy receipt and a
  hand-flip proof each.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21057-handler-classes-resolve"
    statement: |-
      Both channel node contracts must name a handler class that exists with a def-B handle, and the orchestrator must return the two events its contract declares in a ModelHandlerOutput.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: node_channel_orchestrator and node_channel_reply_dispatcher each resolve their contract-named handler class (HandlerChannelOrchestrate, HandlerDispatchReply), and one inbound message yields one ChannelReplyRequested and one ChannelMessageProcessed in a ModelHandlerOutput -- falsifier: uv run pytest tests/unit/nodes/test_channel_contract_handlers_resolve.py -q fails at the merge base
evidence_requirements:
  - kind: tests
    description: "Contract-named handler classes resolve and the orchestrator emits the two declared events"
    command: "uv run pytest tests/unit/nodes/test_channel_contract_handlers_resolve.py -q"
  - kind: tests
    description: "The module-level orchestrate and dispatch functions keep their behavior"
    command: "uv run pytest tests/unit/nodes/node_channel_orchestrator/test_handler_channel_orchestrate.py tests/unit/nodes/node_channel_reply_dispatcher/test_handler_dispatch_reply.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-channel-handler-classes-resolve
    description: "Both contracts name a handler class that exists with a def-B handle, and the orchestrator returns one ChannelReplyRequested and one ChannelMessageProcessed in a ModelHandlerOutput"
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/unit/nodes/test_channel_contract_handlers_resolve.py -q"
    binds_ac: ["AC1"]
  - id: dod-channel-handler-functions-unchanged
    description: "The existing orchestrate and dispatch function tests pass unchanged"
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/unit/nodes/node_channel_orchestrator/test_handler_channel_orchestrate.py tests/unit/nodes/node_channel_reply_dispatcher/test_handler_dispatch_reply.py -q"
