schema_version: 1.0.0
ticket_id: OMN-20923
title: Whole-tree deployment and lab configuration validator with a shrink-only residue baseline
summary: The canonical deployment-config gate classifies configuration kinds and private endpoint shapes, scans
  the complete index in pre-commit and complete tracked tree in CI, and refuses new hashed file/finding identities.
  Baseline edits are compared with the trusted base and must remove cleaned findings. Reusable CI, exported hooks,
  the rollout audit and adoption generator share this mechanism. Consumer rollout proposals are prepared separately;
  these tests prove the mechanism and do not certify an unlanded fleet rollout.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-deployment-config-and-ratchet
  statement: Shipped repositories carry neutral defaults; deployment and lab facts are supplied externally. Existing
    residue is measured per repository and can only shrink; no gate exception is widened.
  acceptance:
  - id: AC1
    statement: 'AC1: a change that adds a file under a lane-overlays path, or any config file carrying an internal
      address or a lab endpoint, fails the gate on added lines -- falsifier: pytest tests/scripts/test_public_repo_hygiene_gate.py
      -k overlay_with_lab_values asserts exit 1 on a fixture that adds such a file'
  - id: AC2
    statement: 'AC2: an unrelated change, and a file carrying the neutral public default, pass the gate -- falsifier:
      pytest tests/scripts/test_public_repo_hygiene_gate.py -k neutral_default_passes asserts exit 0'
  - id: AC3
    statement: 'AC3: the new class is a required check and a pre-commit hook in every shipped repository, with no
      suppression other than the onex-allow-internal-ip annotation -- falsifier: python3 scripts/audit_public_repo_hygiene_rollout.py
      lists the class as required in every shipped repository'
  - id: AC4
    statement: 'AC4: the committed lab overlay (dev.bifrost.yaml) and the review-voter list are out of omnibase_infra,
      and the gate run over omnibase_infra at head exits 0 -- falsifier: python3 scripts/public_repo_hygiene_gate.py
      --repo-root omnibase_infra exits 0 and git ls-files finds no lane-overlays file'
evidence_requirements:
- kind: tests
  description: Whole-file validator, whole-tree/index ratchet, rollout and workflow regressions.
  command: uv run pytest tests/scripts/test_public_repo_hygiene_gate.py tests/scripts/test_deployment_config_class_omn20923.py
    tests/scripts/test_deployment_config_workflow_shapes_omn20923.py tests/scripts/test_deployment_config_ratchet_omn20923.py
    tests/scripts/test_audit_public_repo_hygiene_rollout.py tests/scripts/test_adopt_public_repo_hygiene_gate.py
    tests/workflows/test_public_repo_hygiene_workflows.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn20923-ac1
  description: Configuration kinds and endpoint shapes fail, including unchanged offending lines and baseline growth,
    swaps, renames and index masking.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/scripts/test_public_repo_hygiene_gate.py tests/scripts/test_deployment_config_ratchet_omn20923.py
      -q --no-cov -k "overlay_with_lab_values or lab_configuration_kinds or deployment_kinds or baseline or whole_tree
      or new_file or replacing_value or cli"
    cwd: ${OMNI_HOME}/omniclaude
  binds_ac:
  - AC1
- id: dod-omn20923-ac2
  description: Neutral defaults and unrelated changes pass; cleanup shrinks the baseline and reintroduction fails.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/scripts/test_public_repo_hygiene_gate.py tests/scripts/test_deployment_config_ratchet_omn20923.py
      -q --no-cov -k "neutral_default_passes or unrelated or unchanged or cleanup"
    cwd: ${OMNI_HOME}/omniclaude
  binds_ac:
  - AC2
- id: dod-omn20923-ac3
  description: The audit refuses missing required contexts or narrowed hooks; the adopter updates CI Summary and
    both pinned surfaces without changing exception declarations. Fleet adoption itself remains a separate rollout
    obligation.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/scripts/test_audit_public_repo_hygiene_rollout.py tests/scripts/test_adopt_public_repo_hygiene_gate.py
      tests/workflows/test_public_repo_hygiene_workflows.py -q --no-cov
    cwd: ${OMNI_HOME}/omniclaude
  binds_ac:
  - AC3
- id: dod-omn20923-ac4
  description: Synthetic adoption and cleanup execute the gate at head with exit 0. Actual infra path removal and
    its head verdict remain pending consumer rollout; this item does not certify that unlanded repository change.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/scripts/test_deployment_config_ratchet_omn20923.py -q --no-cov -k "first_adoption_accepts
      or cleanup_shrinks or removal_and_baseline_shrink"
    cwd: ${OMNI_HOME}/omniclaude
  binds_ac:
  - AC4
