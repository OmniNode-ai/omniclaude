dod_evidence:
  - id: dod-omn21346-ac1-skill-sets-first
    description: 'The skill test reads the "Choosing the model" commands from the delegate skill''s prompt.md. In a scratch home with two local models (model-a first), it runs `onex models first local model-b` through the real onex CLI. Then `onex models list` (text and --json) shows Local URL first, marked tried first with model-b, and the models in the order model-b, model-a. `onex models first --clear` removes the mark. It fails at the merge base, whose skill names no such commands, and against an omnimarket without `onex models first`.'
    source: manual
    binds_ac: [AC1]
