ticket_id: OMN-21780
title: "omniclaude contracts_and_di literal_model_name burn-down, slice rf1500-c4"
summary: >
  omnibase_core's contracts_and_di check reported 14 literal_model_name findings in omniclaude src,
  in the savings calculator's baseline model and in the manifest injector's provider tiers and quorum
  list. This slice declares those ids in the runtime contract model_routing section, resolved from the operator overlay env, loads them into
  a frozen model and injects that model into SavingsCalculator and ManifestInjector. No constants
  module, baseline entry or suppression is added.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
