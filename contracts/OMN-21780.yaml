    statement: The model ids of the savings baseline and the manifest models section come from the runtime contract overlay and are injected.
    acceptance:
      - id: AC2
        statement: "AC2: the defaults resolve from the runtime contract overlay, an injected defaults model reaches SavingsCalculator and ManifestInjector._query_models, and no model id is hard-coded in the touched code -- falsifier: uv run pytest tests/unit/models/test_model_routing_defaults.py tests/delegation/test_savings.py -q --no-cov"
evidence_requirements:
