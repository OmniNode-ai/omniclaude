    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_lean_contract_seams_omn21627.py tests/unit/nodes/test_skill_node_coverage.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
