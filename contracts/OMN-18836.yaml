schema_version: "1.0.0"
ticket_id: OMN-18836
title: "Wire the scheduled dev-head CI monitor"
summary: |
  The native dev-head monitor reads completed push-triggered CI runs from its
  data watchlist, files one Linear issue per red repository and full commit
  sha, and comments on the merge PR with an idempotency marker. Unreadable
  external ports fail the tick; green and non-verdict conclusions create no
  issue. The existing ten-minute workflow hosts the node contract over the
  declared CI bus while keeping the scoped GitHub App token in the process.
is_seam_ticket: false
interface_change: true
interfaces_touched:
