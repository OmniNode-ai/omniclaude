---
schema_version: "1.0.0"
ticket_id: OMN-19972
title: "omniclaude reads an internal sibling's dev merge tag from one definition, held equal to omnibase_core's"
summary: >
  The m4-board-red item on OMN-19972 (Lakshman, 15:57Z) asks for one dev merge tag rule, imported, shared by
  check-dep-provenance and the Internal Sibling Pins check (omnibase_core#2058). omnimarket and omnibase_infra
  carry that already (omnimarket#4228 and #4238, omnibase_infra#5165). omniclaude still wrote the rule
  dev-<14 digits>-<12 hex> three times: scripts/check_dep_provenance.py, the internal-sibling-pins handler and
  the nightly dev-tag train in scripts/relock_git_sources.py. Two of the copies used re.match, which accepts a
  trailing newline. All three now import src/omniclaude/handlers/handler_dev_merge_tag.py (standard library only,
  fullmatch), a test holds it equal to omnibase_core's contracts/internal_sibling_pins.yaml dev_tag_pattern, and
  the bare python3 call sites run with PYTHONPATH=src. This contract covers that item only. AC1 to AC3 on the
  ticket (the catalog local compose bundle) are omnibase_infra work and are not claimed here.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19972-one-dev-tag-rule
    statement: "omniclaude's dep-provenance gate, internal-sibling-pins check and dev-tag train read the dev merge tag rule from one definition, and that definition equals omnibase_core's Internal Sibling Pins contract dev_tag_pattern"
    acceptance:
      - id: AC4
        statement: "AC4: one module in src/ or scripts/ spells the dev merge tag rule, the three checks import it, it refuses a trailing newline, and it equals omnibase_core's contract dev_tag_pattern -- falsifier: uv run pytest tests/unit/handlers/test_handler_dev_merge_tag_omn19972.py -q fails at the merge base, where handler_dev_merge_tag does not exist and three files spell the rule"
evidence_requirements:
  - kind: tests
    description: "The one-definition tests, beside the dep-provenance, internal-sibling-pins and dev-tag train tests that use the rule"
    command: "uv run pytest tests/unit/handlers/test_handler_dev_merge_tag_omn19972.py tests/unit/handlers/test_handler_internal_sibling_pins_omn21282.py tests/scripts/test_check_dep_provenance.py tests/scripts/test_check_dep_provenance_dev_tag_omn19998.py tests/scripts/test_dev_tag_train_omn19998.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn19972-one-dev-tag-rule
    description: "The one-definition, core-parity and bare-interpreter tests pass at the head, with the existing tests of the three checks. At the merge base the new file fails on import."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/test_handler_dev_merge_tag_omn19972.py tests/unit/handlers/test_handler_internal_sibling_pins_omn21282.py tests/scripts/test_check_dep_provenance.py tests/scripts/test_check_dep_provenance_dev_tag_omn19998.py tests/scripts/test_dev_tag_train_omn19998.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn19972-deploy-probe
    description: "Deploy probe. Read the shared rule module from GitHub at the checked-out commit and require its stamp reader. It fails at the merge base, where the module does not exist."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: command
        check_value: "bash -o pipefail -c 'gh api \"repos/OmniNode-ai/omniclaude/contents/src/omniclaude/handlers/handler_dev_merge_tag.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -F \"def dev_merge_tag_stamp(\" > /dev/null'"
        cwd: "${OMNI_HOME}/omniclaude"
