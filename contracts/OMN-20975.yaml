schema_version: "1.0.0"
ticket_id: OMN-20975
title: "OCC retirement S6 (omniclaude): end the repo-evidence OCC comparison on dev"
summary: >-
  End the completed S5 comparison before the S6 cut-over removes its OCC result
  producer. The base-branch caller changes only compare-with-occ and its S5
  comment; shadow, the verifier version and reusable pin stay unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20975-comparison-precursor
    statement: The dev base-branch caller must stop comparing with OCC before S6.
    acceptance:
      - id: AC1
        statement: 'AC1: dev caller passes compare-with-occ "false"; falsifier: a tests/ci pytest file parsing the caller fails at the merge base.'
      - id: AC2
        statement: 'AC2: every other caller input, shadow and uses pin stay equal to the merge base; only compare-with-occ and its S5 comment change; falsifier: the same pytest file compares every other input, the uses pin and remaining workflow to the merge base.'
evidence_requirements:
  - kind: tests
    description: The caller stops comparing; parsed workflow and job differ from git's merge base only in compare-with-occ, with identical full-SHA uses pin and comments outside the S5 block.
    command: uv run --no-project --with pytest --with pyyaml --with pytest-cov --with python-dotenv python -m pytest tests/ci/test_repo_evidence_occ_comparison_off_omn20975.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn20975-ac1
    description: The parsed head caller passes the false string; a parametrized case runs the same assertion on git's merge-base caller and requires AssertionError.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --no-project --with pytest --with pyyaml --with pytest-cov --with python-dotenv python -m pytest tests/ci/test_repo_evidence_occ_comparison_off_omn20975.py -q --no-cov
  - id: dod-omn20975-ac2
    description: The test compares the complete parsed workflow and job to git's merge base, changing only compare-with-occ, and checks the full-SHA uses pin and S5 comment boundaries and content without remainder hashing.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --no-project --with pytest --with pyyaml --with pytest-cov --with python-dotenv python -m pytest tests/ci/test_repo_evidence_occ_comparison_off_omn20975.py -q --no-cov
