---
schema_version: "1.0.0"
ticket_id: OMN-19916
title: "The runner-placement gate resolves a nested runs-on selector instead of refusing it"
summary: >
  omnibase_core receipt-gate.yml (OMN-21280, core f1706ad2c) wraps its runner
  selector in a private-caller guard with a public default, a selector nested
  inside an arm. The private-repo-runner-placement gate refused the nesting as
  unreadable, so every private repository whose tree calls receipt-gate.yml@main
  exited 2 with THE GATE DID NOT RUN whatever its own workflows held; that is
  the red in a downstream caller (job 119834792684). The gate now flattens a
  nested selector into its arms under the outer guard and distributes a
  selector out of a value fallback chain, so the expression gets a verdict per
  event: the fleet where the private guard holds, a finding where a hosted arm or fallback is
  reachable, and still a refusal for a nested plain variable that can turn
  falsy.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-prrp-nested-selector
    statement: The placement gate resolves a runs-on selector nested inside an arm, and a selector inside a fromJSON fallback chain, per event instead of refusing it.
    acceptance:
      - id: AC1
        statement: "the omnibase_core receipt-gate expression, multi-line and single-line, exits 0 for a private caller's push with the fleet variables set, and flattens to four arms in order with the outer private guard on the three nested ones -- falsifier: uv run pytest tests/scripts/test_private_repo_runner_placement_gate.py -q -p no:randomly --no-cov -k 'nested_selector_core_receipt_gate_resolves or nested_selector_arms_are_flattened' fails at the merge base, where the gate exits 2"
      - id: AC2
        statement: "the same expression is still a finding (exit 1) under pull_request:fork and under schedule, a selector inside a fromJSON fallback chain passes on push and is a finding on schedule, and a chain still reaches its hosted literal past a selector whose guards all fail -- falsifier: uv run pytest tests/scripts/test_private_repo_runner_placement_gate.py -q -p no:randomly --no-cov -k 'nested_selector_fork_arm or nested_selector_public_default or nested_selector_inside_a_fallback_chain or nested_selector_with_no_default' fails at the merge base, where the gate exits 2"
