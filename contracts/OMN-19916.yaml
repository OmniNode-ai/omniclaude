---
schema_version: "1.0.0"
ticket_id: OMN-19916
title: "The runner-placement gate resolves a nested runs-on selector instead of refusing it"
summary: >
  omnibase_core receipt-gate.yml (OMN-21280, core f1706ad2c) wraps its runner
  selector in a private-caller guard with a public default, a selector nested
  inside an arm. The private-repo-runner-placement gate refused the nesting as
  unreadable, so every private repository whose tree calls receipt-gate.yml@main
  exited 2 with THE GATE DID NOT RUN whatever its own workflows held; that is
  the red in a downstream caller (job 119834792684). The gate now flattens a
  nested selector into its arms under the outer guard and distributes a
  selector out of a value fallback chain, so the expression gets a verdict per
  event: the fleet where the private guard holds, a finding where a hosted arm or fallback is
  reachable, and still a refusal for a nested plain variable that can turn
  falsy.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-prrp-nested-selector
    statement: The placement gate resolves a runs-on selector nested inside an arm, and a selector inside a fromJSON fallback chain, per event instead of refusing it.
    acceptance:
      - id: AC1
        statement: "the omnibase_core receipt-gate expression, multi-line and single-line, exits 0 for a private caller's push with the fleet variables set, and flattens to four arms in order with the outer private guard on the three nested ones -- falsifier: uv run pytest tests/scripts/test_private_repo_runner_placement_gate.py -q -p no:randomly --no-cov -k 'nested_selector_core_receipt_gate_resolves or nested_selector_arms_are_flattened' fails at the merge base, where the gate exits 2"
      - id: AC2
        statement: "the same expression is still a finding (exit 1) under pull_request:fork and under schedule, a selector inside a fromJSON fallback chain passes on push and is a finding on schedule, and a chain still reaches its hosted literal past a selector whose guards all fail -- falsifier: uv run pytest tests/scripts/test_private_repo_runner_placement_gate.py -q -p no:randomly --no-cov -k 'nested_selector_fork_arm or nested_selector_public_default or nested_selector_inside_a_fallback_chain or nested_selector_with_no_default' fails at the merge base, where the gate exits 2"
  - id: req-omn19916-dev-merge-tag
    statement: Every push to omniclaude dev gets a lightweight dev-<UTC YYYYMMDDHHMMSS>-<sha12> tag from a dev-merge-tag workflow shaped like omnimarket's, so a consumer can read omniclaude's shared reusable workflows by tag; the occ-preflight calls that v0.27.0 nested in ban-hardcoded-runner-ip.yml and reject-deploy-gate-skip.yml are already gone from dev (OMN-20073, OMN-20074).
    acceptance:
      - id: AC5
        statement: "dev-merge-tag.yml triggers on push to dev only, names the tag from the commit's UTC committer time and first 12 hex of the sha, is idempotent per sha, pushes nothing on a dry run and refuses a non-sha -- falsifier: uv run pytest tests/workflows/test_dev_merge_tag_workflow_omn19916.py -q fails at the merge base, where the workflow file does not exist"
      - id: AC6
        statement: "no workflow in .github/workflows calls occ-preflight.yml, so a caller at a dev-* tag of this repository does not nest the retired reusable -- falsifier: grep -rn 'workflows/occ-preflight.yml' .github/workflows prints a line"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn19916-nested-selector-resolves
    description: The core receipt-gate expression gets a verdict and flattens to its arms in order.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_private_repo_runner_placement_gate.py -q -p no:randomly --no-cov -k 'nested_selector_core_receipt_gate_resolves or nested_selector_arms_are_flattened'"
    binds_ac:
      - AC1
  - id: dod-omn19916-nested-selector-findings
    description: Reachable hosted arms and fallbacks under the nested selector are still findings.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_private_repo_runner_placement_gate.py -q -p no:randomly --no-cov -k 'nested_selector_fork_arm or nested_selector_public_default or nested_selector_inside_a_fallback_chain or nested_selector_with_no_default'"
    binds_ac:
      - AC2
  - id: dod-omn19916-dev-merge-tag
    description: The dev merge tag workflow's name, idempotency, dry-run and trigger tests pass at the head.
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/workflows/test_dev_merge_tag_workflow_omn19916.py tests/workflows/test_automated_pusher_identity_omn18273.py -q -p no:randomly --no-cov"
  - id: dod-omn19916-no-nested-occ-preflight
    description: The dev merge workflow creates a lightweight tag for consumers, and no workflow file calls the deleted occ-preflight reusable.
    source: manual
    binds_ac:
      - AC6
    checks:
      - check_type: command
        check_value: "bash -c '! grep -rn \"workflows/occ-preflight.yml\" .github/workflows'"
        cwd: "${OMNI_HOME}/omniclaude"
      - check_type: test_passes
        check_value: "uv run pytest tests/workflows/test_dev_merge_tag_workflow_omn19916.py -q -p no:randomly --no-cov -k test_tag_name_is_dev_utc_committer_time_and_sha12"
  - id: dod-omn19916-deploy-probe
    description: Deploy probe. Read the workflow from GitHub at the checked-out commit and require its tag step. It fails at the merge base, where the file does not exist.
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: command
        check_value: "bash -o pipefail -c 'gh api \"repos/OmniNode-ai/omniclaude/contents/.github/workflows/dev-merge-tag.yml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -F \"Create the dev merge tag\" > /dev/null'"
        cwd: "${OMNI_HOME}/omniclaude"
