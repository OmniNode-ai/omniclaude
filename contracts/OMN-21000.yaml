schema_version: "1.0.0"
ticket_id: OMN-21000
title: "Shared-tree git guard resolves an interpreter that imports its decision core"
summary: >
  pre_tool_use_shared_tree_git_guard.sh took PLUGIN_PYTHON_BIN without checking
  that it imports the admission handler, so a host whose override named a bare
  interpreter refused every Bash call holding git vocabulary plus a refused verb
  word with "could not evaluate (exit 1)". The guard now tries each candidate
  interpreter in turn, accepts the first that imports the handler, and refuses
  by name, listing the interpreters that failed, when none does. The fail-closed
  policy is unchanged. The grants half of OMN-21000 (AC1) lives in omnibase_infra.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: tests
    description: "Shared-tree git guard tests pass, including the two interpreter-resolution cases"
    command: "uv run pytest tests/hooks/test_shared_tree_git_guard.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-guard-interpreter-falls-through
    description: "A PLUGIN_PYTHON_BIN that cannot import the handler no longer decides the guard; a later candidate that imports it runs the real decision core"
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_shared_tree_git_guard.py -q --no-cov -k plugin_python_bin_without_the_core"
  - id: dod-guard-refuses-host-without-importable-core
    description: "When no interpreter imports the handler the guard refuses, naming the module and the interpreters tried"
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_shared_tree_git_guard.py -q --no-cov -k no_interpreter_imports_the_core"
