---
schema_version: "1.0.0"
ticket_id: "OMN-20074"
title: "OCC retirement S7 for omniclaude: the S5 caller classifies a contract in another repository"
summary: "omniclaude's repo-evidence caller pins the receipt-gate reusable the other callers of the fleet use (omnibase_core#1914, fb0c6c21) and verifier 0.4.305, so the S5 difference step names a ticket whose only other contract is in another repository as expected_difference contract_in_another_repo (plan section 10.1, rulings 2026-10-08T09:57:41Z and 2026-10-08T14:59:17Z) instead of printing unclassified_difference. The caller stays in shadow with compare-with-occ on. The reusable deploy gate also takes contract-source: occ (default) keeps the change control contract source, caller checks out the caller's own contracts/ at the pull request head and hands that directory to the unchanged validator."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: "req-omn20074-caller-repin"
    statement: |-
      omniclaude's repo-evidence caller must run the receipt-gate reusable and verifier that classify a contract in another repository.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the caller pins receipt-gate.yml at 4e4f5e0404d364e296c5d37db6aa3ab9e07f8ffa (omnibase_core#1932, a descendant of #1914) and sets verifier-version 0.4.305 or newer -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k another_repo
  - id: "req-omn20074-dev-head-monitor-host"
    statement: |-
      The dev-head monitor must survive the deletion of occ-companion-merge-heal.yml by running from a non-OCC scheduled workflow with its own cadence and grants.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: the dev-head-red-alert job lives in auto-merge-stale-poller.yml and not in occ-companion-merge-heal.yml, runs only on its own ten-minute schedule entry while the poller runs only on its fifteen-minute entry, and each job holds only its own grants -- falsifier: uv run pytest tests/ci/test_dev_head_monitor_omn18836.py -q --no-cov
  - id: "req-caller-contract-source"
    statement: "A cut-over caller's deploy gate reads the caller's own contracts/OMN-<n>.yaml at the pull request head."
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: with contract-source caller the reusable checks out the caller's pull request head contracts/ and the validator passes a runtime-path PR only when that contract carries a falsifiable deploy check; a change control contract carrying one does not count; the occ default is unchanged -- falsifier: uv run pytest tests/workflows/test_deploy_gate_contract_source_omn20074.py -q fails at the merge base
  - id: "req-omn20074-automation-declaration"
    statement: |-
      advisory-job-gate must read an `# advisory-automation: OMN-nnnnn <what it automates>` declaration on a job and check it instead of exempting the job: a declared job that is a required context, is reached through `needs:` by a required job, or runs a test, lint, receipt or evidence step is a finding naming the job and the rule; omniclaude's auto-merge job carries the declaration.
    acceptance:
      - id: "AC4"
        statement: |-
          AC4: a correctly declared automation job passes; declared but in the CI Summary's needs fails; declared but running a pytest step fails; an undeclared job is still UNENFORCED_VERIFICATION_JOB; omniclaude's auto-merge.yml passes with no required context in the file and fails with the declaration removed -- falsifier: uv run pytest tests/scripts/test_advisory_job_gate.py -q --no-cov -k AutomationDeclaration
  - id: "req-omn20074-precommit-hooks-from-core-s8"
    statement: |-
      omniclaude must consume the no-hardcoded-topics and no-untracked-todos pre-commit hooks from omnibase_core, where they moved from onex_change_control under the same hook ids.
    acceptance:
      - id: "AC5"
        statement: |-
          AC5: no-hardcoded-topics and no-untracked-todos are listed in .pre-commit-config.yaml only under an omnibase_core repo block pinned to a full commit sha or release tag, with their stages and the topic hook's exclude carried over byte for byte -- falsifier: uv run pytest tests/ci/test_precommit_hooks_core_omn20074.py -q --no-cov fails at the merge base
  - id: "req-omn20074-writer-app-classifiers"
    statement: |-
      omniclaude's repo-evidence caller must run the reusable and verifier that hand a writer app plugin version bump and an omnibase_core checkout pin bump to their classifiers, and every repo contract must load under that verifier's strict YAML loader.
    acceptance:
      - id: "AC6"
        statement: |-
          AC6: the caller pins receipt-gate.yml at 4e4f5e0404d364e296c5d37db6aa3ab9e07f8ffa and sets verifier-version 0.4.310 or newer, and no contracts/*.yaml repeats a mapping key -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov -k "writer_app or duplicate_key" fails at the merge base
  - id: "req-omn20074-s6-cutover"
    statement: |-
      omniclaude's pull-request admission must take no verdict from onex_change_control: the OCC caller workflows and every nested occ-preflight job are gone, no ci.yml job resolves an OCC evidence companion, the repo-evidence caller enforces without comparing with OCC, and neither CI Summary nor the required-checks manifest expects an OCC context while CI Summary expects repo-evidence / dod-verify.
    acceptance:
      - id: "AC7"
        statement: |-
          AC7: no event-triggered workflow calls an OCC reusable or waits on occ-preflight, call-occ-preflight.yml, call-occ-autobind.yml, call-occ-companion-effect.yml, call-receipt-gate.yml and occ-companion-merge-heal.yml are deleted, ci.yml has no dod-evidence-check, contract-compliance or occ-companion-merged job, the caller sets shadow and compare-with-occ to "false", and CI Summary and .github/required-checks.yaml name no OCC context while CI Summary expects repo-evidence / dod-verify -- falsifier: uv run pytest tests/ci/test_no_occ_callers_omn20074.py -q --no-cov fails at the merge base
  - id: "req-omn20074-untyped-metadata-core-node"
    statement: |-
      omniclaude's no-untyped-metadata pre-commit hook must run omnibase_core's no-untyped-metadata COMPUTE node through the locked omnibase-core, not the onex_change_control console script of the same name.
    acceptance:
      - id: "AC8"
        statement: |-
          AC8: the no-untyped-metadata hook entry runs python -m omnibase_core.nodes.node_no_untyped_metadata_check_compute.runtime_no_untyped_metadata_check, no hook entry runs check-no-untyped-metadata, and the locked omnibase-core is 0.47.35 or newer -- falsifier: uv run pytest tests/ci/test_precommit_untyped_metadata_core_node_omn20074.py -q --no-cov fails at the merge base
  - id: "req-omn20074-s9-unused-occ-scripts"
    statement: |-
      omniclaude must not host an OCC script no caller runs: scaffold_occ_receipt.py and materialize-dod-evidence-from-occ.sh are deleted with their tests and baseline rows, no skill instructs running either, and the reusables other repositories still call stay hosted.
    acceptance:
      - id: "AC9"
        statement: |-
          AC9: scripts/scaffold_occ_receipt.py, scripts/materialize-dod-evidence-from-occ.sh and their tests are absent, no plugins/onex/skills markdown names either script, the canonical-file-shape baseline lists neither, and call-occ-autobind-reusable.yml, call-occ-companion-effect-reusable.yml and deploy-gate-reusable.yml are still present -- falsifier: uv run pytest tests/ci/test_occ_unused_reusables_deleted_omn20074.py -q --no-cov fails at the merge base
  - id: "req-omn20074-flat-test-selection"
    statement: |-
      The CI selector must map a changed flat unit test to its containing unit directory, including when the file was deleted during OCC retirement.
    acceptance:
      - id: "AC10"
        statement: |-
          AC10: existing and deleted tests/unit/*.py changes select tests/unit/ without a .py/ argument; a script deletion retains tests/ci/, tests/unit/ and tests/workflows/ -- falsifier: uv run pytest tests/unit/test_smart_test_selection.py -q --no-cov -k flat_unit_test_change
  - id: "req-omn20074-dod-evidence-repo-local"
    statement: |-
      The DoD evidence runner and its completion guard read and write the repo-local .evidence/<ticket> and take no path from onex_change_control, OMNI_HOME or ONEX_EVIDENCE_ROOT.
    acceptance:
      - id: "AC13"
        statement: |-
          AC13: dod_evidence_runner.py has no resolve_evidence_root import and writes its receipt to <working_dir>/.evidence/<ticket>, pre_tool_use_dod_completion_guard.sh reads <cwd>/.evidence/<ticket>/dod_report.json with no ONEX_EVIDENCE_ROOT, and a writer then guard round trip passes with no onex_change_control on disk -- falsifier: uv run pytest tests/hooks/test_dod_round_trip.py tests/hooks/test_dod_completion_guard.py -q --no-cov fails at the merge base
evidence_requirements:
  - kind: "tests"
    description: "The caller pins the fleet's receipt-gate reusable and a verifier that reads the contract-home marker."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k another_repo"
  - kind: "tests"
    description: "The monitor is hosted by the non-OCC poller workflow with its own schedule entry, grants and dry-run input, and its native bus wiring is unchanged."
    command: "uv run pytest tests/ci/test_dev_head_monitor_omn18836.py -q --no-cov"
  - kind: tests
    description: "The contract source input, the caller head checkout and the validator verdicts per source"
    command: "uv run pytest tests/workflows/test_deploy_gate_contract_source_omn20074.py tests/workflows/test_deploy_gate_reusable_workflow.py -q --no-cov -p no:randomly"
  - kind: tests
    description: "The automation declaration is parsed and checked: required context, needs closure of a required job, and verification steps"
    command: "uv run pytest tests/scripts/test_advisory_job_gate.py -q --no-cov -k AutomationDeclaration"
  - kind: tests
    description: "The topic and TODO hooks are consumed from the omnibase_core hook block, pinned to a full sha."
    command: "uv run pytest tests/ci/test_precommit_hooks_core_omn20074.py -q --no-cov"
  - kind: tests
    description: "The caller pins the reusable and verifier carrying the writer app classifiers, and every repo contract loads with no duplicate mapping key."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov -k \"writer_app or duplicate_key\""
  - kind: tests
    description: "No OCC caller, preflight edge, companion job or OCC context is left, and the caller enforces without OCC."
    command: "uv run pytest tests/ci/test_no_occ_callers_omn20074.py -q --no-cov"
  - kind: tests
    description: "The no-untyped-metadata hook runs the omnibase_core node, no hook runs the OCC console script, and the locked omnibase-core carries the node."
    command: "uv run pytest tests/ci/test_precommit_untyped_metadata_core_node_omn20074.py -q --no-cov"
  - kind: tests
    description: "The unused OCC scripts are deleted, no skill names them, and the reusables with live callers stay hosted."
    command: "uv run pytest tests/ci/test_occ_unused_reusables_deleted_omn20074.py -q --no-cov"
  - kind: tests
    description: "The writer and the completion guard share the repo-local .evidence/<ticket> and the round trip passes with no change-control path."
    command: "uv run pytest tests/hooks/test_dod_round_trip.py tests/hooks/test_dod_completion_guard.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn-20074-ac1"
    description: "The focused caller test proves the receipt-gate pin and the verifier floor."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k another_repo"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC1"]
  - id: "dod-omn-20074-monitor-host"
    description: "The focused monitor test proves the job moved out of the OCC heal workflow and keeps its schedule, grants and bus wiring."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_dev_head_monitor_omn18836.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC3"]
  - id: dod-omn20074-caller-contract-source
    description: "Workflow wiring and validator verdicts for the occ and caller contract sources"
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/workflows/test_deploy_gate_contract_source_omn20074.py tests/workflows/test_deploy_gate_reusable_workflow.py -q --no-cov -p no:randomly"
    binds_ac: ["AC2"]
  - id: dod-omn20074-automation-declaration
    description: "advisory-job-gate checks an automation declaration instead of exempting it, and omniclaude's auto-merge job carries one"
    source: manual
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/scripts/test_advisory_job_gate.py -q --no-cov -k AutomationDeclaration"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC4"]
  - id: dod-omn20074-precommit-hooks-from-core-s8
    description: "The repository test proves no-hardcoded-topics and no-untracked-todos are taken from the omnibase_core block at a full sha and no longer from onex_change_control."
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/ci/test_precommit_hooks_core_omn20074.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC5"]
  - id: dod-omn20074-writer-app-classifiers
    description: "The focused caller test proves the omnibase_core#1932 pin, the verifier 0.4.310 floor and a contracts directory with no duplicate mapping key."
    source: manual
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov -k \"writer_app or duplicate_key\""
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC6"]
  - id: dod-omn20074-s6-cutover
    description: "The structural test proves omniclaude has no OCC caller, preflight edge, companion job or OCC context left and that the repo-evidence caller enforces without OCC."
    source: manual
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_no_occ_callers_omn20074.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC7"]
  - id: dod-omn20074-untyped-metadata-core-node
    description: "The hook test proves the no-untyped-metadata hook runs the omnibase_core node and no hook runs the OCC console script."
    source: manual
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_precommit_untyped_metadata_core_node_omn20074.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC8"]
  - id: dod-omn20074-s9-unused-occ-scripts
    description: "The structural test proves the unused OCC scripts and their tests are gone, no skill names them, and the still-called reusables stay hosted."
    source: manual
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_occ_unused_reusables_deleted_omn20074.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC9"]
  - id: dod-omn20074-flat-test-selection
    description: "Flat unit test changes select their containing directory, including the deleted OCC materialization test, and retain the script-triggered test directories."
    source: manual
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_smart_test_selection.py -q --no-cov -k flat_unit_test_change"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC10"]
  - id: dod-omn20074-dod-evidence-repo-local
    description: "The writer then guard round trip passes from the repo-local .evidence/<ticket>, ONEX_EVIDENCE_ROOT and OMNI_HOME steer neither side, and the guard names no change-control path."
    source: manual
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/hooks/test_dod_round_trip.py tests/hooks/test_dod_completion_guard.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC13"]
