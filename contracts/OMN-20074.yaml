    source: manual
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_boundary_parity_repin_omn20074.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC11"]
  - id: dod-omn20074-workflow-dependency-refs
    description: "The structural test proves the workflows and deploy gate name no change control repository and nothing imports its package."
    source: manual
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_workflow_dependency_refs_off_occ_omn20074.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC14"]
  - id: dod-omn20074-code-off-occ
    description: "The AST scan finds no onex_change_control import in src, plugins, scripts or tests, the DoD evidence runner demotes an inert check with the change-control package unimportable, and script defaults and aliases no longer target the retired repository."
    source: manual
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_no_occ_code_imports_omn20074.py tests/lib/test_dod_evidence_runner.py tests/scripts/test_occ_repo_retirement_omn20074.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC12"]
  - id: dod-omn20074-private-caller-fork-arms
    description: "The placement gate judges each shared reusable from a private caller at a sha pin and finds no hosted arm, refuses an unset trusted variable, and refuses the pre-change selector."
    source: manual
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/scripts/test_private_repo_runner_placement_gate.py -q --no-cov -k "private_caller or pre_omn_20074"'
        cwd: "${OMNI_HOME}/omniclaude"
