schema_version: "1.0.0"
ticket_id: OMN-22016
title: "TC.11 The additive binding rows: the omniclaude-owned criterion (hook inventory)"
summary: >
  The additive binding rows (session_start, agent_spawn, per_prompt) are declared in omnimarket's
  node_claude_code_hook_adapter_effect contract, which is where client_bindings lives. This contract
  binds the omniclaude-owned criterion AC6 to a check that runs on the hosted runner: every additive
  row has an additive_bindings entry in hook_inventory.yaml (owner, reason, review_by, restoration
  with a re-enable ticket, canary), and the check fails on a row without an entry, an entry missing a
  field, an entry that disagrees with its row and an entry past review_by. The omnimarket-owned
  criteria are bound by omnimarket. AC7's omniclaude half is the additive_miss_record entry of the
  same inventory: the journal record type (profile, reason and elapsed time, no field that could
  hold package text) with parity to omnimarket's emit registry once the installed release declares
  it. It is declared in the inventory and not in the generated EVENT_REGISTRY: the adapter node
  journals the record, so the emit registry marks it node-owned and the registry projects nothing,
  and the canonical-file-shape ratchet refuses growth in those files. The checks are tests, not
  gates wired into hook_inventory.py, for the same ratchet reason.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22016-omniclaude-acs
    statement: The omniclaude-owned TC.11 acceptance criterion has a falsifiable, bound check.
    acceptance:
      - id: AC6
        statement: "AC6: the hook-inventory gate passes with each row's entry and fails on a fixture row missing `review_by` or its re-enable ticket -- falsifier: `uv run pytest -k hook_inventory_additive_rows`, one passing control and one failing case per missing field"
  - id: req-omn22016-miss-record
    statement: The miss record type is declared in the hook inventory and carries no package text.
    acceptance:
      - id: AC7
        statement: "AC7: the miss record is a journal record type declared in the hook registry with parity in omnimarket's emit registry, `event_registry_drift` passing in both, and it carries the profile, the reason and the elapsed time only -- falsifier: `uv run pytest -k event_registry_drift` in omniclaude and in omnimarket, plus a record-shape test failing if package text appears in the record"
evidence_requirements:
  - kind: tests
    description: The hook-inventory additive-row tests.
    command: uv run pytest tests/hooks/test_hook_inventory_additive_rows_omn22016.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22016-ac6-inventory
    binds_ac: [AC6]
    description: >-
      The check passes with the three additive entries (a passing control) and fails on an entry
      missing review_by or reenable_ticket, on a row with no entry, on a mismatch and on a lapsed review date.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/hooks/test_hook_inventory_additive_rows_omn22016.py -k hook_inventory_additive_rows -q --no-cov"

  - id: dod-omn22016-ac7-miss-record
    binds_ac: [AC7]
    description: >-
      The omniclaude half. The inventory declares the additive.miss record with exactly profile,
      reason and elapsed_ms, a declaration that adds a field able to hold package text fails the
      shape check, and the declaration agrees with the installed emit registry when that release
      carries the record. The omnimarket half is bound by omnimarket's contract.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/hooks/test_hook_inventory_additive_rows_omn22016.py -k event_registry_drift -q --no-cov"

  - id: dod-omn22016-deploy-source-validation
    description: >-
      Deployment source validation: the checked-out hook inventory declares the three additive
      bindings and the check agrees with the installed omnimarket contract. Runs on the hosted runner
      without an installed binding or sibling checkout.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/hooks/test_hook_inventory_additive_rows_omn22016.py -q --no-cov"
