title: "The canonical clone sync returns a clean clone parked on main to the remote default branch (dev) and fast-forwards it"
summary: >
  OMN-20524 changes canonical_clone_sync.py so a clean canonical clone checked out on a
  tracking branch that is not the remote default branch is switched to the default branch
  (through the sanctioned canonical-converge door) and fast-forwarded, and every clone it
  cannot move is refused with a logged reason. Operator ruling 2026-10-04T10:11:35Z item 6.
  A follow-up change refreshes the remote default (git remote set-head --auto) before the
  engine acts on it, so a stale refs/remotes/<remote>/HEAD never moves a clone and a failed
  refresh never switches one.
