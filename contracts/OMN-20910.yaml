---
schema_version: "1.0.0"
ticket_id: "OMN-20910"
title: "Review-voter models are declared in a contract overlay, not repo variables or workflow files"
summary: "omniclaude's Hostile Reviewer workflow reads every voter from the review voters overlay (since OMN-20923 a private CI overlay fetched at run time from the repository the org variable OMNI_CI_OVERLAY_REPO names, never a file of a shipped repository) through omniintelligence's cli_review --voters-overlay, with omniintelligence pinned at 7f686d4bbca251dd3db49c1222ff8d6f738abd6c, the merged build that accepts Claude API voters and the existing lab roster. The workflow names no voter endpoint, port, model flag or endpoint variable, and a ratchet with a known-bad positive control keeps it that way. The quorum rule and the fail-closed gate are unchanged."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-workflow-reads-overlay"
    statement: "The hostile-review job resolves its voters only from the review voters overlay, read from the private CI overlay at run time."
    acceptance:
      - id: "AC1"
        statement: "AC1: the review step passes the overlay to cli_review and the overlay is fetched from the private CI overlay -- falsifier: env -u PYTHONPATH uv run pytest tests/hooks/test_hostile_reviewer_workflow.py -q -k 'voters_overlay'"
  - id: "req-no-voter-endpoint-in-workflows"
    statement: "The workflow file names no review voter endpoint, port, model flag or endpoint variable."
    acceptance:
      - id: "AC3"
        statement: "AC3: a ratchet over the workflow finds no voter endpoint, port, model flag or endpoint variable, and finds all four lines of a known-bad fixture -- falsifier: env -u PYTHONPATH uv run pytest tests/hooks/test_hostile_reviewer_workflow.py -q -k 'ratchet or names_no_voter'"
  - id: "req-no-voter-model-in-workflows"
    statement: "The workflow names no review voter model: no vars.*MODEL* reference, no model id literal, no MODEL env key bound to a literal."
    acceptance:
      - id: "AC4"
        statement: "AC4: the ratchet refuses a vars.<anything>MODEL reference, a model id literal and a MODEL env key bound to a literal, finds all five lines of a known-bad model fixture, and the new cases fail on the merge base -- falsifier: uv run pytest tests/hooks/test_hostile_reviewer_workflow.py -q --no-cov -k voter_model_from_overlay"
      - id: "AC5"
        statement: "AC5: the ratchet's test file runs as a step of the refusal-surface job that the required CI Summary context covers and as a check-only pre-commit hook -- falsifier: uv run pytest tests/hooks/test_hostile_reviewer_workflow.py -q --no-cov -k voter_model_from_overlay_ratchet_is_wired"
evidence_requirements:
  - kind: "tests"
    description: "The workflow reads the overlay and names no voter."
    command: "env -u PYTHONPATH uv run pytest tests/hooks/test_hostile_reviewer_workflow.py tests/workflows/test_hostile_reviewer_fleet_and_stderr.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20910-ac1-workflow-reads-overlay"
    description: "The review step reads the review voters overlay fetched from the private CI overlay."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/hooks/test_hostile_reviewer_workflow.py -q -k 'voters_overlay'"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC1"]
  - id: "dod-omn20910-ac3-no-voter-endpoint"
    description: "The workflow names no voter endpoint; the ratchet's positive control finds the known-bad lines."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/hooks/test_hostile_reviewer_workflow.py -q -k 'ratchet or names_no_voter'"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC3"]
  - id: "dod-omn20910-ac4-no-voter-model"
    description: "The widened ratchet refuses a model variable, a model id literal and a MODEL env literal, and the workflow carries none."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/hooks/test_hostile_reviewer_workflow.py -q --no-cov -k voter_model_from_overlay"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC4"]
  - id: "dod-omn20910-ac5-ratchet-wired"
    description: "The test file is a step of the refusal-surface job (covered by the required CI Summary context) and a pre-commit hook entry."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/hooks/test_hostile_reviewer_workflow.py -q --no-cov -k voter_model_from_overlay_ratchet_is_wired"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC5"]
  - id: "dod-omn20910-claude-api-voter-pin"
    description: "The source pin and uv-generated lock record the Claude API voter merge consumed by the workflow."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_retry_budget_pin_omn17427.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
    binds_ac: ["AC1"]
