---
schema_version: "1.0.0"
ticket_id: OMN-17427
title: "New tickets are created in the Backlog with no project"
summary: >
  Operator ruling 2026-09-30: all new tickets go to the Backlog, not into a
  project. The ticket-creation gate (ticket_creation_guard.py) now refuses a
  create that sets project or projectId (code project_set) and admits a
  no-project create; the ticket-creating skills stop naming a project.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-ci-summary-judges-a-concluded-job
    statement: CI Summary judges a job GitHub has concluded on its conclusion, not its lagging status.
    acceptance:
      - id: AC-ci-summary-concluded-job
        statement: "a job row with conclusion and completed_at set counts as completed while its status reads in_progress; a concluded failure still fails and a row missing either field still holds PENDING -- falsifier: uv run pytest tests/ci/test_ci_summary_gate.py -q -k TestConcludedJobWithLaggingStatusOmn17427"
evidence_requirements:
  - kind: tests
    description: "Ticket-creation guard tests pass, including the registered hook end to end"
    command: "uv run pytest tests/hooks/test_ticket_creation_guard.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-project-set-is-refused
    description: >
      A create that sets project or projectId is refused with code
      project_set naming the ruling; a null or empty project is not a project.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py::test_create_with_a_project_is_refused tests/hooks/test_ticket_creation_guard.py::test_the_projectid_spelling_is_refused_too tests/hooks/test_ticket_creation_guard.py::test_a_null_or_empty_project_is_not_a_project -q"
  - id: dod-no-project-create-is-admitted
    description: >
      A create with no project is admitted, both by the guard and by the
      registered PreToolUse hook end to end.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py::test_create_without_a_project_is_admitted tests/hooks/test_ticket_creation_guard.py::test_registered_hook_admits_a_create_with_no_project -q"
  - id: dod-ci-summary-judges-a-concluded-job
    description: >
      CI Summary judges a job GitHub has concluded (conclusion and
      completed_at both set) on its conclusion even while its status still
      reads in_progress, so the dev push run 38472613080 job snapshot at
      6d5b0cd9f concludes success instead of waiting out the poll deadline;
      a concluded failure still fails and a row missing either field still
      holds the verdict at PENDING.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_ci_summary_gate.py -q -k TestConcludedJobWithLaggingStatusOmn17427"
    binds_ac:
      - AC-ci-summary-concluded-job
