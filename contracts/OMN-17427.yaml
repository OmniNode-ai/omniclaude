---
schema_version: "1.0.0"
ticket_id: OMN-17427
title: "New tickets are created in the Backlog with no project"
summary: >
  Operator ruling 2026-09-30: all new tickets go to the Backlog, not into a
  project. The ticket-creation gate (ticket_creation_guard.py) now refuses a
  create that sets project or projectId (code project_set) and admits a
  no-project create; the ticket-creating skills stop naming a project.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-ci-summary-judges-a-concluded-job
    statement: CI Summary judges a job GitHub has concluded on its conclusion, not its lagging status.
    acceptance:
      - id: AC1
        statement: "a job row with conclusion and completed_at set counts as completed while its status reads in_progress; a concluded failure still fails and a row missing either field still holds PENDING -- falsifier: uv run pytest tests/ci/test_ci_summary_gate.py -q -k TestConcludedJobWithLaggingStatusOmn17427"
  - id: req-prrp-variables-snapshot
    statement: A dated variables snapshot supplies facts only after a live read fails, with the same runner-placement verdicts and refusals.
    acceptance:
      - id: AC2
        statement: A fresh snapshot supplies variables and visibility after a live read fails, a live answer takes precedence, and fallback use reports its age and live error.
      - id: AC3
        statement: Stale, future-dated, missing, unparseable, missing-scope and other-repository snapshots refuse; absent visibility refuses too.
      - id: AC4
        statement: Snapshot values preserve repository precedence and hosted-runner findings; the CLI returns 0, 1 or 2 for fleet, hosted or stale snapshots, accepts the environment path on a lab host and refuses snapshots in GitHub Actions.
      - id: AC5
        statement: Refresh writes a dated snapshot usable by the gate when all live reads succeed, and writes nothing when a live scope is unreadable.
evidence_requirements:
  - kind: tests
    description: "Ticket-creation guard tests pass, including the registered hook end to end"
    command: "uv run pytest tests/hooks/test_ticket_creation_guard.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-project-set-is-refused
    description: >
      A create that sets project or projectId is refused with code
      project_set naming the ruling; a null or empty project is not a project.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py::test_create_with_a_project_is_refused tests/hooks/test_ticket_creation_guard.py::test_the_projectid_spelling_is_refused_too tests/hooks/test_ticket_creation_guard.py::test_a_null_or_empty_project_is_not_a_project -q"
  - id: dod-no-project-create-is-admitted
    description: >
      A create with no project is admitted, both by the guard and by the
      registered PreToolUse hook end to end.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py::test_create_without_a_project_is_admitted tests/hooks/test_ticket_creation_guard.py::test_registered_hook_admits_a_create_with_no_project -q"
  - id: dod-ci-summary-judges-a-concluded-job
    description: >
      CI Summary judges a job GitHub has concluded (conclusion and
      completed_at both set) on its conclusion even while its status still
      reads in_progress, so the dev push run 38472613080 job snapshot at
      6d5b0cd9f concludes success instead of waiting out the poll deadline;
      a concluded failure still fails and a row missing either field still
      holds the verdict at PENDING.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_ci_summary_gate.py -q -k TestConcludedJobWithLaggingStatusOmn17427"
    binds_ac:
      - AC1
  - id: dod-prrp-snapshot-live-first
    description: Fresh fallback resolves variables and visibility, preserves live precedence and reports the snapshot age and live error.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_private_repo_runner_placement_snapshot.py -q -k 'fresh_snapshot_resolves or live_answer_wins or fallback_is_announced or visibility_falls_back'"
    binds_ac:
      - AC2
  - id: dod-prrp-snapshot-refusals
    description: Unusable snapshots refuse instead of passing an unresolved runner placement or visibility.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_private_repo_runner_placement_snapshot.py -q -k 'snapshot_refuses or snapshot_file_refuses or organisation_scope_refuses or another_repository_refuses or visibility_refuses'"
    binds_ac:
      - AC3
  - id: dod-deploy-prrp-snapshot-cli
    description: A hosted-runner-safe hermetic CLI check exercises the gate loaded from this checkout, including a hosted-value positive control, fleet success, stale refusal, environment path and GitHub Actions refusal.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_private_repo_runner_placement_snapshot.py -q -k 'positive_control or repo_shadow or main_ or inside_github_actions or environment_names'"
    binds_ac:
      - AC4
  - id: dod-prrp-snapshot-refresh
    description: The refresh CLI captures live facts into a usable dated snapshot and leaves no file when a live read fails.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_private_repo_runner_placement_snapshot.py -q -k refresh_command"
    binds_ac:
      - AC5
