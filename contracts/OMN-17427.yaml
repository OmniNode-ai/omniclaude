  - id: dod-deploy-refusal-lane-container
    description: >
      Run this checkout's refusal resolver and hook attribution library in an
      isolated Python container on a hosted Docker runner. A generic sidecar
      resolves from its first skill message; a later quote stays unresolved,
      and a named sidecar wins. No fleet service or credentials are required.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: |
          env docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --mount "type=bind,src=$(pwd),dst=/workspace,readonly" --workdir /workspace python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1 python -c '
          import json
          import runpy
          import tempfile
          from pathlib import Path
          handler = runpy.run_path("src/omniclaude/nodes/node_hook_refusal_record_effect/handlers/handler_hook_refusal_lane.py")
          handler["use_hooks_lib"](str(Path("plugins/onex/hooks/lib").resolve()))
          resolve = handler["resolve_refusal_lane"]
          skill = {"type": "user", "message": {"role": "user", "content": "Base directory for this skill: /plugins/onex/skills/ledger-write"}}
          ordinary = {"type": "user", "message": {"role": "user", "content": "Search the hooks."}}
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              transcript = root / "session.jsonl"
              transcript.write_text("")
              agents = root / "session" / "subagents"
              agents.mkdir(parents=True)
              meta = agents / "agent-probe.meta.json"
              own = agents / "agent-probe.jsonl"
              meta.write_text(json.dumps({"agentType": "general-purpose"}))
              own.write_text(json.dumps(skill) + "\n")
              payload = {"transcript_path": str(transcript), "agent_id": "probe"}
              actual = resolve(payload, env={})
              assert actual == ("skill:ledger-write", "skill"), actual
              own.write_text(json.dumps(ordinary) + "\n" + json.dumps(skill) + "\n")
              actual = resolve(payload, env={})
              assert actual == ("", "unresolved"), actual
              own.write_text(json.dumps(skill) + "\n")
              meta.write_text(json.dumps({"name": "named-lane"}))
              actual = resolve(payload, env={})
              assert actual == ("named-lane", "sidecar"), actual
          print("PASS: container refusal lane skill, later-quote refusal, sidecar precedence")
          '
    binds_ac:
      - AC10
