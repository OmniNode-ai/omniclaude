---
schema_version: "1.0.0"
ticket_id: OMN-17427
title: "New tickets are created in the Backlog with no project"
summary: >
  Operator ruling 2026-09-30: all new tickets go to the Backlog, not into a
  project. The ticket-creation gate (ticket_creation_guard.py) now refuses a
  create that sets project or projectId (code project_set) and admits a
  no-project create; the ticket-creating skills stop naming a project.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-ci-summary-judges-a-concluded-job
    statement: CI Summary judges a job GitHub has concluded on its conclusion, not its lagging status.
    acceptance:
      - id: AC1
        statement: "a job row with conclusion and completed_at set counts as completed while its status reads in_progress; a concluded failure still fails and a row missing either field still holds PENDING -- falsifier: uv run pytest tests/ci/test_ci_summary_gate.py -q -k TestConcludedJobWithLaggingStatusOmn17427"
  - id: req-prrp-variables-snapshot
    statement: A dated variables snapshot supplies facts only after a live read fails, with the same runner-placement verdicts and refusals.
    acceptance:
      - id: AC2
        statement: A fresh snapshot supplies variables and visibility after a live read fails, a live answer takes precedence, and fallback use reports its age and live error.
      - id: AC3
        statement: Stale, future-dated, missing, unparseable, missing-scope and other-repository snapshots refuse; absent visibility refuses too.
      - id: AC4
        statement: Snapshot values preserve repository precedence and hosted-runner findings; the CLI returns 0, 1 or 2 for fleet, hosted or stale snapshots, accepts the environment path on a lab host and refuses snapshots in GitHub Actions.
      - id: AC5
        statement: Refresh writes a dated snapshot usable by the gate when all live reads succeed, and writes nothing when a live scope is unreadable.
  - id: req-hostile-reviewer-retry-budget-pin
    statement: The Hostile Reviewer clones omniintelligence at the revision whose retry of an unparseable review reply gets 8192 tokens instead of 4096.
    acceptance:
      - id: AC6
        statement: "pyproject.toml pins omninode-intelligence and uv.lock records only 3fcbf795087a79081c0ceeb676216bf64c5d49ae, the merge commit of omniintelligence#1072, which the workflow clones -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_retry_budget_pin_omn17427.py -q fails over the merge base, which pins f4bf0a1989fc37bd7ad9b4a7ad591f801d2a1070"
  - id: req-precommit-commit-path
    statement: The three slowest pre-commit hooks cost a small commit less time and check what they checked.
    acceptance:
      - id: AC7
        statement: "The detect-secrets guard rescans only the staged files, keeps every other tracked file's baseline entry, still blocks a new unaudited finding in a staged file, and rescans the whole tree when no file, every tracked file, the guard or the hook configuration is staged -- falsifier: uv run pytest tests/scripts/test_detect_secrets_guard.py -q"
      - id: AC8
        statement: "The public-repo hygiene scan splits a large tracked set across subprocesses and returns the serial scan's hits in the same order, and a shard that dies sends it back to the serial scan -- falsifier: uv run pytest tests/scripts/test_public_skill_hygiene_scope.py -q -k 'sharded or dead_shard'"
      - id: AC9
        statement: "The direct-model-call gate runs at pre-push and as its own whole-tree step of the precommit-suite job, not at the commit stage -- falsifier: uv run pytest tests/ci/test_precommit_suite_job_omn19612.py -q -k direct_model_call"
  - id: req-refusal-row-names-forked-skill
    statement: A hook refusal by a forked skill's executor names the skill instead of reading lane=unresolved.
    acceptance:
      - id: AC10
        statement: "A refusal whose agent sidecar carries only the generic agent type and whose own transcript opens with the harness's skill base-directory line resolves to lane skill:<name> with lane_source skill; a later message quoting that line, an ordinary first message and a named sidecar do not -- falsifier: uv run pytest tests/hooks/test_refusal_row_lane_omn19381.py -q -k 'forked_skill or named_sidecar_wins' fails against the resolver without the skill step"
evidence_requirements:
  - kind: tests
    description: "Ticket-creation guard tests pass, including the registered hook end to end"
    command: "uv run pytest tests/hooks/test_ticket_creation_guard.py -q"
  - kind: tests
    description: "The pin and the lock name the omniintelligence revision with the larger retry budget"
    command: "uv run pytest tests/ci/test_hostile_reviewer_retry_budget_pin_omn17427.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-project-set-is-refused
    description: >
      A create that sets project or projectId is refused with code
      project_set naming the ruling; a null or empty project is not a project.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py::test_create_with_a_project_is_refused tests/hooks/test_ticket_creation_guard.py::test_the_projectid_spelling_is_refused_too tests/hooks/test_ticket_creation_guard.py::test_a_null_or_empty_project_is_not_a_project -q"
  - id: dod-no-project-create-is-admitted
    description: >
      A create with no project is admitted, both by the guard and by the
      registered PreToolUse hook end to end.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_ticket_creation_guard.py::test_create_without_a_project_is_admitted tests/hooks/test_ticket_creation_guard.py::test_registered_hook_admits_a_create_with_no_project -q"
  - id: dod-ci-summary-judges-a-concluded-job
    description: >
      CI Summary judges a job GitHub has concluded (conclusion and
      completed_at both set) on its conclusion even while its status still
      reads in_progress, so the dev push run 38472613080 job snapshot at
      6d5b0cd9f concludes success instead of waiting out the poll deadline;
      a concluded failure still fails and a row missing either field still
      holds the verdict at PENDING.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_ci_summary_gate.py -q -k TestConcludedJobWithLaggingStatusOmn17427"
    binds_ac:
      - AC1
  - id: dod-prrp-snapshot-live-first
    description: Fresh fallback resolves variables and visibility, preserves live precedence and reports the snapshot age and live error.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_private_repo_runner_placement_snapshot.py -q -k 'fresh_snapshot_resolves or live_answer_wins or fallback_is_announced or visibility_falls_back'"
    binds_ac:
      - AC2
  - id: dod-prrp-snapshot-refusals
    description: Unusable snapshots refuse instead of passing an unresolved runner placement or visibility.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_private_repo_runner_placement_snapshot.py -q -k 'snapshot_refuses or snapshot_file_refuses or organisation_scope_refuses or another_repository_refuses or visibility_refuses'"
    binds_ac:
      - AC3
  - id: dod-deploy-prrp-snapshot-cli
    description: A hosted-runner-safe hermetic CLI check exercises the gate loaded from this checkout, including a hosted-value positive control, fleet success, stale refusal, environment path and GitHub Actions refusal.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_private_repo_runner_placement_snapshot.py -q -k 'positive_control or repo_shadow or main_ or inside_github_actions or environment_names'"
    binds_ac:
      - AC4
  - id: dod-prrp-snapshot-refresh
    description: The refresh CLI captures live facts into a usable dated snapshot and leaves no file when a live read fails.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_private_repo_runner_placement_snapshot.py -q -k refresh_command"
    binds_ac:
      - AC5
  - id: dod-hostile-reviewer-retry-budget-pin
    description: >
      pyproject.toml pins omninode-intelligence and uv.lock records only the
      merge commit of omniintelligence#1072, which the Hostile Reviewer
      workflow clones.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_retry_budget_pin_omn17427.py -q"
    binds_ac:
      - AC6
  - id: dod-secrets-guard-rescans-staged-files
    description: The baseline guard rescans the staged files and merges the rest of the baseline back.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_detect_secrets_guard.py -q"
    binds_ac:
      - AC7
  - id: dod-hygiene-scan-sharded
    description: The sharded hygiene scan equals the serial scan and falls back to it when a shard dies.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_public_skill_hygiene_scope.py -q -k 'sharded or dead_shard'"
    binds_ac:
      - AC8
  - id: dod-direct-model-call-pre-push-and-ci
    description: The gate is pre-push only and the precommit-suite job runs it over the whole tree.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_precommit_suite_job_omn19612.py -q"
    binds_ac:
      - AC9
  - id: dod-refusal-row-names-forked-skill
    description: A forked skill executor's refusal row carries lane=skill:<name>; the near misses stay unresolved or sidecar-named.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/hooks/test_refusal_row_lane_omn19381.py -q -k 'forked_skill or named_sidecar_wins'"
    binds_ac:
      - AC10
  - id: dod-deploy-refusal-lane-container
    description: >
      Run this checkout's refusal resolver and hook attribution library in an
      isolated Python container on a hosted Docker runner. A generic sidecar
      resolves from its first skill message; a later quote stays unresolved,
      and a named sidecar wins. No fleet service or credentials are required.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --mount "type=bind,src=$(pwd),dst=/workspace,readonly" --workdir /workspace python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1 python -c '
          import json
          import runpy
          import tempfile
          from pathlib import Path
          handler = runpy.run_path("src/omniclaude/nodes/node_hook_refusal_record_effect/handlers/handler_hook_refusal_lane.py")
          handler["use_hooks_lib"](str(Path("plugins/onex/hooks/lib").resolve()))
          resolve = handler["resolve_refusal_lane"]
          skill = {"type": "user", "message": {"role": "user", "content": "Base directory for this skill: /plugins/onex/skills/ledger-write"}}
          ordinary = {"type": "user", "message": {"role": "user", "content": "Search the hooks."}}
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              transcript = root / "session.jsonl"
              transcript.write_text("")
              agents = root / "session" / "subagents"
              agents.mkdir(parents=True)
              meta = agents / "agent-probe.meta.json"
              own = agents / "agent-probe.jsonl"
              meta.write_text(json.dumps({"agentType": "general-purpose"}))
              own.write_text(json.dumps(skill) + "\n")
              payload = {"transcript_path": str(transcript), "agent_id": "probe"}
              actual = resolve(payload, env={})
              assert actual == ("skill:ledger-write", "skill"), actual
              own.write_text(json.dumps(ordinary) + "\n" + json.dumps(skill) + "\n")
              actual = resolve(payload, env={})
              assert actual == ("", "unresolved"), actual
              own.write_text(json.dumps(skill) + "\n")
              meta.write_text(json.dumps({"name": "named-lane"}))
              actual = resolve(payload, env={})
              assert actual == ("named-lane", "sidecar"), actual
          print("PASS: container refusal lane skill, later-quote refusal, sidecar precedence")
          '
    binds_ac:
      - AC10
