---
schema_version: "1.0.0"
ticket_id: OMN-17427
title: "New tickets are created in the Backlog with no project"
summary: >
  Operator ruling 2026-09-30: all new tickets go to the Backlog, not into a
  project. The ticket-creation gate (ticket_creation_guard.py) now refuses a
  create that sets project or projectId (code project_set) and admits a
  no-project create; the ticket-creating skills stop naming a project.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-ci-summary-judges-a-concluded-job
    statement: CI Summary judges a job GitHub has concluded on its conclusion, not its lagging status.
    acceptance:
      - id: AC1
        statement: "a job row with conclusion and completed_at set counts as completed while its status reads in_progress; a concluded failure still fails and a row missing either field still holds PENDING -- falsifier: uv run pytest tests/ci/test_ci_summary_gate.py -q -k TestConcludedJobWithLaggingStatusOmn17427"
  - id: req-prrp-variables-snapshot
    statement: A dated variables snapshot supplies facts only after a live read fails, with the same runner-placement verdicts and refusals.
    acceptance:
      - id: AC2
        statement: A fresh snapshot supplies variables and visibility after a live read fails, a live answer takes precedence, and fallback use reports its age and live error.
      - id: AC3
        statement: Stale, future-dated, missing, unparseable, missing-scope and other-repository snapshots refuse; absent visibility refuses too.
      - id: AC4
        statement: Snapshot values preserve repository precedence and hosted-runner findings; the CLI returns 0, 1 or 2 for fleet, hosted or stale snapshots, accepts the environment path on a lab host and refuses snapshots in GitHub Actions.
      - id: AC5
        statement: Refresh writes a dated snapshot usable by the gate when all live reads succeed, and writes nothing when a live scope is unreadable.
  - id: req-hostile-reviewer-retry-budget-pin
    statement: The Hostile Reviewer clones omniintelligence at the revision whose retry of an unparseable review reply gets 8192 tokens instead of 4096.
    acceptance:
      - id: AC6
        statement: "pyproject.toml pins omninode-intelligence and uv.lock records only 3fcbf795087a79081c0ceeb676216bf64c5d49ae, the merge commit of omniintelligence#1072, which the workflow clones -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_retry_budget_pin_omn17427.py -q fails over the merge base, which pins f4bf0a1989fc37bd7ad9b4a7ad591f801d2a1070"
  - id: req-precommit-commit-path
    statement: The three slowest pre-commit hooks cost a small commit less time and check what they checked.
    acceptance:
      - id: AC7
        statement: "The detect-secrets guard rescans only the staged files, keeps every other tracked file's baseline entry, still blocks a new unaudited finding in a staged file, and rescans the whole tree when no file, every tracked file, the guard or the hook configuration is staged -- falsifier: uv run pytest tests/scripts/test_detect_secrets_guard.py -q"
      - id: AC8
        statement: "The public-repo hygiene scan splits a large tracked set across subprocesses and returns the serial scan's hits in the same order, and a shard that dies sends it back to the serial scan -- falsifier: uv run pytest tests/scripts/test_public_skill_hygiene_scope.py -q -k 'sharded or dead_shard'"
      - id: AC9
        statement: "The direct-model-call gate runs at pre-push and as its own whole-tree step of the precommit-suite job, not at the commit stage -- falsifier: uv run pytest tests/ci/test_precommit_suite_job_omn19612.py -q -k direct_model_call"
  - id: req-refusal-row-names-forked-skill
    statement: A hook refusal by a forked skill's executor names the skill instead of reading lane=unresolved.
    acceptance:
      - id: AC10
        statement: "A refusal whose agent sidecar carries only the generic agent type and whose own transcript opens with the harness's skill base-directory line resolves to lane skill:<name> with lane_source skill; a later message quoting that line, an ordinary first message and a named sidecar do not -- falsifier: uv run pytest tests/hooks/test_refusal_row_lane_omn19381.py -q -k 'forked_skill or named_sidecar_wins' fails against the resolver without the skill step"
  - id: req-lock-refresh-syncs-capture-mirror
    statement: The sibling-lock refresh re-derives the capture-contract mirror at the omnimarket rev it pins and commits it with the lock.
    acceptance:
      - id: AC11
        statement: "sibling-lock-refresh.yml runs generate_event_registry.py --sync-capture-contract against the omnimarket clone checked out at the rev read back from uv.lock with ci.yml's om_pin grep, after uv lock and before the delta check, and the mirror is in the delta check and the bot commit -- falsifier: uv run pytest tests/workflows/test_sibling_lock_refresh_syncs_capture_mirror.py -q fails over the merge base"
  - id: req-omniclaude-off-onex-change-control
    statement: omniclaude's workflows and hook guards have no live onex_change_control reference.
    acceptance:
      - id: AC12
        statement: "the two OCC minting reusables are deleted, the Done-flip guard decides on repo evidence alone and reads no change-control clone, and the PR-body stamp guard has no merged-companion read -- falsifier: uv run pytest tests/ci/test_occ_live_refs_zero_omn17427.py -q --no-cov fails at the merge base"
      - id: AC13
        statement: "pyproject.toml and uv.lock carry no onex-change-control dependency, override, git source or package entry -- falsifier: uv run pytest tests/ci/test_occ_live_refs_zero_omn17427.py -q --no-cov fails over the merge base"
  - id: req-launchd-plist-templates-parse-as-xml
    statement: Every launchd template renders to a plist that plistlib parses, and the installer refuses a rendered plist that does not parse.
    acceptance:
      - id: AC14
        statement: "the four templates that carried a double hyphen inside an XML comment parse after rendering, the installer's verify_well_formed refuses a double-hyphen comment and passes a well-formed plist -- falsifier: uv run pytest tests/scripts/test_launchd_plist_templates_well_formed.py -q --no-cov fails at the merge base, where the test file is absent and plistlib reports the four templates not well-formed"
  - id: req-omn17427-mac-launchd-plists-well-formed
    statement: Every launchd plist template renders to XML that plistlib parses, so the installed LaunchAgents load on the Mac.
    acceptance:
      - id: AC15
        statement: "no comment in scripts/launchd/*.plist holds a double hyphen, and tick-bundle-install.sh escapes & < > in the paths it substitutes, so every template parses after rendering with a path holding an ampersand, a bracket, a pipe and a backslash -- falsifier: uv run pytest tests/scripts/test_launchd_plists_well_formed.py -q --no-cov"
  - id: req-lane-tick-acceptance
    statement: Lab lanes tick acceptance boxes and request Done through the existing Done-flip guard.
    acceptance:
      - id: AC16
        statement: Labeled ticks preserve criterion text, dry runs and refused ticks write nothing, and Done is judged as a second edit.
      - id: AC17
        statement: Lane evidence admits a complete green contract binding and refuses a partial binding, red check or contract changed after the check started.
  - id: req-reaper-default-roots-under-omni-home
    statement: The worktree reaper's default roots are the two under OMNI_HOME and never a home-directory root.
    acceptance:
      - id: AC18
        statement: "worktree_reaper._resolve_roots with no --root returns exactly OMNI_HOME/omni_worktrees and OMNI_HOME/.onex_state/worktrees, adds nothing under the home directory, and returns no root when OMNI_HOME is unset -- falsifier: uv run pytest tests/scripts/test_worktree_reaper.py -q --no-cov -k default_roots fails over the merge base, which appends the legacy home-directory root"
  - id: req-drainer-unexpected-exit-traceback
    statement: An unexpected drainer exit logs the traceback needed to locate the raising frame.
    acceptance:
      - id: AC19
        statement: "When run raises KeyError('Version'), main returns 1 and logs the exception with its traceback; the rendered log names the raising frame -- falsifier: uv run pytest tests/unit/hooks/test_hook_emit_drainer.py -q --no-cov -k test_main_logs_the_traceback_of_an_unexpected_error"
  - id: req-defect-create-binds-to-diagnosis
    statement: A defect-shaped Linear create cites a resolving Diagnosis line before its criteria are admitted.
    acceptance:
      - id: AC20
        statement: "a create whose title or labels read as a defect and carries no Diagnosis line is refused, one citing a ledger line that is absent or blank is refused naming that citation, a ledger, pull request or file:line citation is admitted, and a feature-shaped create is unaffected -- falsifier: uv run pytest tests/hooks/test_ticket_creation_guard_defect_diagnosis.py -q fails over the merge base, which has no defect_diagnosis policy"
  - id: req-customer-onboarding-delegate-only
    statement: Customer onboarding installs only the delegate plugin in Claude Code; the developer plugin set needs an explicit --developer.
    acceptance:
      - id: AC21
        statement: "lab-onboarding.sh installs onex@omninode-tools from OmniNode-ai/omniclaude by default, and the full onex tree and omni only with --developer -- falsifier: uv run pytest plugins/onex-delegate/tests/test_customer_install_slash_commands.py -q --no-cov -k onboarding_script_defaults"
      - id: AC22
        statement: "The onboarding script's customer default is the public quickstart install, and that install, run into a scratch Claude config, adds exactly onex:delegate to the built-in slash commands, served from plugins/onex-delegate -- falsifier: uv run pytest plugins/onex-delegate/tests/test_customer_install_slash_commands.py -q --no-cov -k 'only_the_delegate_command or onboarding_script_defaults'"
  - id: req-gh-shim-runner-exact-head
    statement: The declared exact-head check admits the remote runner's fork-status field on the same PR.
    acceptance:
      - id: AC23
        statement: "A matching declared gh pr view with headRefName,headRefOid,isCrossRepository,state reaches gh and returns its JSON unchanged; adding body is refused before gh runs -- falsifier: pytest tests/scripts/test_gh_pr_state_read_guard.py -q --no-cov -k remote_runner_exact_head_fields"
  - id: req-canonical-core-worktree-guard
    statement: A canonical clone keeps its own work tree when git config, global options or linked-worktree git init would redirect it.
    acceptance:
      - id: AC24
        statement: Writes of core.worktree in a canonical clone are denied for every supported spelling, while reads, unsetting the key and writes outside the clone remain allowed.
      - id: AC25
        statement: A work tree outside the canonical clone is denied through global options or GIT_WORK_TREE; naming the clone itself and operations outside canonical clones remain allowed.
      - id: AC26
        statement: git init with a linked-worktree git dir and a work tree set is denied for exported, inline and inherited environment variables, while a read under those exports remains allowed.
  - id: req-hostile-reviewer-json-via-file
    statement: The Hostile Reviewer step hands cli_review's JSON to its parsers through a file, so a review with dozens of findings cannot fail the step with exit 126.
    acceptance:
      - id: AC27
        statement: "With a python3 that refuses any environment string over 128 KiB, a 400 KiB two-voter review result still reaches a passed verdict and a written artifact, and no review JSON rides in an environment variable -- falsifier: uv run pytest tests/workflows/test_hostile_reviewer_fleet_and_stderr.py tests/hooks/test_hostile_reviewer_workflow.py -q --no-cov -k 'oversized_review_result or review_step_invokes_cli_review'"
  - id: req-advisory-gate-declared-manifest-fallback
    statement: On a host with no landing controller cache and no GitHub read, the advisory-job gate takes its required contexts from the clone's declared required-checks manifest, and never inside GitHub Actions.
    acceptance:
      - id: AC28
        statement: "A manifest at schema_version 3 whose repo field names the repository answers with its REQUIRED rows only after the controller cache, the live read and the git cache fail, and the live read wins when it answers -- falsifier: uv run pytest tests/scripts/test_advisory_job_gate.py -q --no-cov -k TestDeclaredManifestFallback fails over the merge base, where the class is absent"
      - id: AC29
        statement: "A missing, unparseable, other-repository, wrong-schema or malformed manifest still refuses, and GITHUB_ACTIONS=true never uses the manifest -- falsifier: uv run pytest tests/scripts/test_advisory_job_gate.py -q --no-cov -k 'required_rows or unusable_manifest or unparseable_manifest or never_falls_back' fails over the merge base, where the answering control and those tests are absent"
  - id: req-documentation-recurrence-gate
    statement: The existing documentation gate rejects new prose outside the knowledge base and requires the root README to link there.
    acceptance:
      - id: AC30
        statement: Diff mode rejects Markdown, MDX, reStructuredText and AsciiDoc outside the allowed paths and a changed root README without a knowledge-base link, reading content from the staged index or requested head ref.
      - id: AC31
        statement: Machine configuration, allowed test evidence and README links to the knowledge base pass the same diff gate.
      - id: AC32
        statement: The exported and local pre-commit hooks inspect the index without a Markdown filter, and the reusable required CI gate retains canonical validation reports and run/fire events from the existing core report writer.
      - id: AC33
        statement: Hook Python imports do not leave root bytecode that the pre-push clean-root gate rejects, and direct pytest hook entries disable bytecode generation.
  - id: req-repo-evidence-caller-verifier-floor
    statement: The hosted repo-evidence / dod-verify context refuses a contract whose acceptance criteria are only partly bound, and a pre-commit hook holds the caller on that verifier floor.
    acceptance:
      - id: AC34
        statement: "The Repo Evidence Gate caller uses omnibase_core's receipt-gate reusable at the pin that refuses a verifier-version below 0.4.303 and passes verifier-version 0.4.303 or later; 0.4.280 and 0.4.302 are refused and 0.4.303 and 0.4.310 are admitted; the call-repo-evidence-gate-verifier-floor pre-commit hook runs this check -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_verifier_floor_omn17427.py -q -p no:randomly --no-cov fails when the caller's verifier-version is 0.4.302"
  - id: req-delegate-skill-names-the-run
    statement: The onex-delegate skill shows the answer first and then one line naming the run, so the M4 board's C30 probe finds the correlation id in the delegation's tool result.
    acceptance:
      - id: AC35
        statement: "prompt.md carries one plain onex delegate --json command and no --result-only, tells the agent to reply with result.response and then one Run: <correlation_id> line, and the captured --json stdout parses to a UUID correlation_id under the probe's marker and UUID rules while the answer alone parses to none -- falsifier: uv run pytest plugins/onex-delegate/tests/test_delegate_run_id_surface.py -q --no-cov fails against the --result-only skill"
  - id: req-hostile-review-passes-head-sha
    statement: The Hostile Reviewer passes cli_review the pull request head commit, so clean signed off-CI review receipts can be read for a voter lost to a timeout or an unavailable endpoint.
    acceptance:
      - id: AC36
        statement: "The review step's HEAD_SHA is github.event.pull_request.head.sha and cli_review gets --head-sha \"$HEAD_SHA\" -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_head_sha_omn17427.py -q --no-cov fails over the merge base, where the review step passes no head"
  - id: req-hostile-review-chunk-deadline
    statement: The Hostile Reviewer installs an omniintelligence that scales a voter's review deadline by chunk count, and its job ceiling holds two voters at a 1500 s review deadline per attempt.
    acceptance:
      - id: AC37
        statement: "pyproject.toml pins omninode-intelligence and uv.lock records only 921b322b8e43f695961a06a04759dc88bb3e88ff, which carries omniintelligence#1107 and #1108 -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_retry_budget_pin_omn17427.py -q --no-cov fails over the merge base, which pins 7f686d4bbca251dd3db49c1222ff8d6f738abd6c"
      - id: AC38
        statement: "timeout-minutes is 110 and HOSTILE_REVIEW_JOB_TIMEOUT_SECONDS is 6600, so each of two review attempts gets 3142 s, at least the 3000 s two voters need at review_deadline_seconds 1500 -- falsifier: uv run pytest tests/ci/test_hostile_reviewer_chunk_deadline_budget_omn17427.py tests/hooks/test_hostile_reviewer_retry_budget_omn19998.py -q --no-cov fails over the merge base, where the per-attempt budget is 2092 s"
  - id: req-repo-documentation-removed
    statement: omniclaude tracks no human-prose documentation outside the files a loader, build, test or gate reads, and no requirements file.
    acceptance:
      - id: AC39
        statement: "the root README.md links the knowledge base and retains the customer install commands read by the plugin tests, no requirements*.txt is tracked, and the KB doc gate passes in strict mode with no docs/ prose entries in its allowed set -- falsifier: python3 scripts/kb_doc_gate.py --mode strict --repo-root . and uv run pytest plugins/onex-delegate/tests/test_customer_install_slash_commands.py -q --no-cov pass, and git ls-files 'requirements*.txt' '**/requirements*.txt' prints nothing, where the merge base tracks consumers/requirements.txt"
  - id: req-worktree-remove-partial-removal
    statement: Every omniclaude caller of git worktree remove (the SessionEnd hook and scripts/worktree_auto_prune.py) reports a tree that a failed removal half-deleted as partially_removed with git's own error line, and leaves a record to rebuild it from.
    acceptance:
      - id: AC40
        statement: "after a non-zero git worktree remove, a path that still exists with its admin directory gone is reported partially_removed, never as untracked files -- falsifier: uv run pytest tests/scripts/test_worktree_remove_partial_removal_omn18826.py -q -p no:randomly --no-cov fails over the merge base, where a fixture worktree with a chmod 500 subdirectory is not reported partially_removed"
      - id: AC41
        statement: "neither caller discards git worktree remove stderr; the failure row quotes git's failed to delete line and its exit code -- falsifier: uv run pytest tests/scripts/test_worktree_remove_partial_removal_omn18826.py -q -p no:randomly --no-cov -k 'pruner_records_partial_removal or session_end_partial_removal or session_end_calls_extracted_removal' fails over the merge base, where session-end.sh logs a bare see-log row"
      - id: AC42
        statement: "find_half_removed_worktrees finds a planted tree whose .git pointer names a missing admin dir and returns nothing for a clean worktree; the pruner reports such trees in their own section, keeps them out of classification, and does so on --no-debris runs -- falsifier: uv run pytest tests/scripts/test_worktree_remove_partial_removal_omn18826.py -q -p no:randomly --no-cov -k 'half_removed_scan_and_clean_control or main_reports_half_removed_without_classifying or report_empty_half_removed_section' fails over the merge base"
      - id: AC43
        statement: "a failed removal leaves a snapshot whose MANIFEST names the path and HEAD, and the pruner's attempt carries head_oid, saved before the removal -- falsifier: uv run pytest tests/scripts/test_worktree_remove_partial_removal_omn18826.py tests/scripts/test_every_worktree_removal_saves_first.py -q -p no:randomly --no-cov -k 'pruner_records_partial_removal or session_end_partial_removal_left_a_snapshot or missing_snapshot_helper or every_removal_site_saves' fails over the merge base"
  - id: req-private-repo-no-hosted-runner
    statement: "The private-repo runner-placement gate refuses every way a private repository's job can reach a GitHub-hosted runner: a hosted literal fallback is a finding even while its variable is set, an annotation excuses nothing, and the hosted-rulings registry is empty."
    acceptance:
      - id: AC44
        statement: "a job whose runs-on is fromJSON(vars.X || '[\"ubuntu-latest\"]') fails the gate with X set to the fleet, its twin with a fleet fallback passes, the fork arm alone stays exempt, and a called workflow's hosted fallback fails the private caller -- falsifier: uv run pytest tests/scripts/test_private_repo_runner_placement_gate.py -q -p no:randomly --no-cov -k 'literal_fallback or fork_arm_alone' fails over the merge base"
      - id: AC45
        statement: "a hosted job carrying a private-repo-hosted-ok annotation fails like its bare twin, and a hosted-eligible declaration citing RULING 2026-10-16T17:44:31Z is refused against the shipped registry, which is empty -- falsifier: uv run pytest tests/scripts/test_private_repo_runner_placement_gate.py -q -p no:randomly --no-cov -k 'annotat or withdrawn_ruling or shipped_registry_carries_no_ruling' fails over the merge base"
evidence_requirements:
  - kind: tests
    description: "Ticket-creation guard tests pass, including the registered hook end to end"
    command: "uv run pytest tests/hooks/test_ticket_creation_guard.py -q"
  - kind: tests
    description: "The pin and the lock name the omniintelligence revision with the larger retry budget"
    command: "uv run pytest tests/ci/test_hostile_reviewer_retry_budget_pin_omn17427.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-advisory-gate-manifest-answers
    description: Tests give the gate a clone with a declared manifest and no other source, and check the answer, the precedence of the live read and the refusal without a manifest.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_advisory_job_gate.py -q --no-cov -k 'positive_control or required_rows or the_hook_passes or live_read_wins'"
    binds_ac:
      - AC28
  - id: dod-advisory-gate-manifest-refusals
    description: Tests give the gate unusable manifests and a GitHub Actions environment and check that each still refuses, beside the case that answers from a usable manifest, so a gate that refuses everything cannot pass the control.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_advisory_job_gate.py -q --no-cov -k 'required_rows or unusable_manifest or unparseable_manifest or never_falls_back'"
    binds_ac:
      - AC29
  - id: dod-deploy-advisory-gate-manifest-fallback
    description: Hosted runners run the manifest fallback tests against this checkout with no controller cache and no GitHub credentials.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_advisory_job_gate.py -q --no-cov -k TestDeclaredManifestFallback"
    binds_ac:
      - AC28
      - AC29
  - id: dod-canonical-core-worktree-config
    description: Subprocess tests exercise config writes and their harmless controls against this checkout's guard.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/scripts/test_canonical_clone_guard_core_worktree.py -q --no-cov -k 'config_core_worktree or every_spelling or control_config'"
    binds_ac:
      - AC24
  - id: dod-canonical-core-worktree-options
    description: Subprocess tests deny redirected canonical work trees and admit the clone itself and noncanonical locations.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/scripts/test_canonical_clone_guard_core_worktree.py -q --no-cov -k work_tree"
    binds_ac:
      - AC25
  - id: dod-canonical-core-worktree-init
    description: The linked git dir and work tree combination refuses git init in each environment spelling and admits an ordinary read.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/scripts/test_canonical_clone_guard_core_worktree.py -q --no-cov -k live_mechanism"
    binds_ac:
      - AC26
  - id: dod-deploy-canonical-core-worktree-guard
    description: A hosted Docker runner mounts this checkout read-only and invokes its standalone guard with hook JSON and temporary registry directories; denials and allowed controls need no credentials, network or installed hook.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: |
          env docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --env PYTHONDONTWRITEBYTECODE=1 --mount "type=bind,src=$(pwd),dst=/workspace,readonly" --workdir /workspace python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1 python -c '
          import json, os, subprocess, sys, tempfile
          from pathlib import Path
          guard = Path("scripts/user-hooks/canonical-clone-guard.py").resolve()
          with tempfile.TemporaryDirectory() as directory:
              home = Path(directory) / "registry"
              clone = home / "some_repo"
              linked = clone / ".git" / "worktrees" / "lane"
              linked.mkdir(parents=True)
              lane = Path(directory) / "lane_run"
              lane.mkdir()
              cases = [
                  ("git config core.worktree /somewhere/else", "deny"),
                  (f"git --work-tree={lane} status", "deny"),
                  (f"GIT_DIR={linked} GIT_WORK_TREE={lane} git init", "deny"),
                  ("git config --get core.worktree", "allow"),
                  ("git config --unset core.worktree", "allow"),
                  (f"git --work-tree={clone} status", "allow"),
              ]
              for command, expected in cases:
                  payload = {"tool_name": "Bash", "tool_input": {"command": command}, "cwd": str(clone)}
                  result = subprocess.run([sys.executable, str(guard)], input=json.dumps(payload), text=True, capture_output=True, check=True, env={"PATH": os.environ["PATH"], "HOME": directory, "OMNI_HOME": str(home), "PYTHONDONTWRITEBYTECODE": "1"})
                  decision = json.loads(result.stdout)["hookSpecificOutput"]["permissionDecision"] if result.stdout.strip() else "allow"
                  assert decision == expected, (command, expected, decision, result.stderr)
          print("PASS: canonical core.worktree denials and harmless controls")
          '
    binds_ac:
      - AC24
      - AC25
      - AC26
  - id: dod-kb-documentation-recurrence-rejection
    description: Focused CLI regressions reject misplaced prose and README content in staged and ref-diff mode.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_kb_doc_gate.py -q --no-cov -k 'recurrence_diff_blocks or recurrence_readme'"
    binds_ac: [AC30]
  - id: dod-kb-documentation-recurrence-positive-controls
    description: Machine configuration, allowed fixture evidence and knowledge-base links are positive controls.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
