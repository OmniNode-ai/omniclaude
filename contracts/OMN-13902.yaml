schema_version: 1.0.0
ticket_id: OMN-13902
title: sibling version alignment for omniclaude
summary: OMN-13902 is sibling version alignment through the sibling-lock-refresh workflow. This contract validates omniclaude sibling-refresh behavior and lock resolution directly. The sibling-lock-refresh workflow checks out sources, advances clone-governed revs, refreshes package locks, and opens a bot pull request, performing no deploy, container restart, docker compose against .201, image build/push, rpk produce, or live cluster/runtime mutation.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
requirements:
  - id: req-forward-only-git-refresh
    statement: A strict descendant is accepted, a non-descendant is refused without writing, both dependency and source rev occurrences are rewritten together, and only omnimarket is declared clone-governed.
    acceptance:
      - id: AC1
        statement: 'AC1: A strict descendant is accepted, a non-descendant is refused without writing, both dependency and source rev occurrences are rewritten together, and only omnimarket is declared clone-governed. -- falsifier: uv run pytest tests/test_git_source_pins.py -q --no-cov'
  - id: req-sibling-lock-resolution
    statement: uv.lock resolves the declared dependencies and git source revs without rewriting.
    acceptance:
      - id: AC2
        statement: 'AC2: uv.lock resolves the declared dependencies and git source revs without rewriting. -- falsifier: uv lock --check'
evidence_requirements:
  - kind: tests
    command: uv run pytest tests/test_git_source_pins.py -q --no-cov
    description: Validates forward-only git refresh behavior including descendant acceptance, non-descendant refusal, and rev rewriting.
  - kind: ci
    command: uv lock --check
    description: Verifies that uv.lock resolves the declared dependencies and git source revs without rewriting.
dod_evidence:
  - id: dod-omniclaude-sibling-refresh-behavior
    source: manual
    binds_ac:
      - AC1
    description: Validates forward-only git refresh behavior including descendant acceptance, non-descendant refusal, and rev rewriting.
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_git_source_pins.py -q --no-cov
  - id: dod-omniclaude-sibling-lock-resolution
    source: manual
    binds_ac:
      - AC2
    description: Verifies that uv.lock resolves the declared dependencies and git source revs without rewriting.
    checks:
      - check_type: command
        check_value: uv lock --check
