schema_version: 1.0.0
ticket_id: OMN-13902
title: sibling version alignment for omniclaude
summary: OMN-13902 is sibling version alignment through the sibling-lock-refresh workflow. This contract validates omniclaude sibling-refresh behavior and lock resolution directly. The sibling-lock-refresh workflow checks out sources, advances clone-governed revs, refreshes package locks, and opens a bot pull request, performing no deploy, container restart, docker compose against a lab host, image build/push, rpk produce, or live cluster/runtime mutation.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
requirements:
  - id: req-forward-only-git-refresh
    statement: A strict descendant is accepted, a non-descendant is refused without writing, both dependency and source rev occurrences are rewritten together, and only omnimarket is declared clone-governed.
    acceptance:
      - id: AC1
        statement: 'AC1: A strict descendant is accepted, a non-descendant is refused without writing, both dependency and source rev occurrences are rewritten together, and only omnimarket is declared clone-governed. -- falsifier: grep -Eq "omnimarket @ git[+]https://github[.]com/OmniNode-ai/omnimarket[.]git@dev-[0-9]{14}-[0-9a-f]{12}" pyproject.toml && uv run python scripts/check_public_skill_hygiene.py && uv run pytest tests/test_git_source_pins.py tests/test_sibling_pin_alignment_omn13902.py -q --no-cov'
  - id: req-sibling-lock-resolution
    statement: uv.lock resolves the declared dependencies and git source revs without rewriting.
    acceptance:
      - id: AC2
        statement: 'AC2: uv.lock resolves the declared dependencies and git source revs without rewriting. -- falsifier: grep -Eq "omnimarket[.]git[?]tag=dev-[0-9]{14}-[0-9a-f]{12}#[0-9a-f]{40}" uv.lock && uv lock --check && uv run python scripts/check_public_skill_hygiene.py && uv run pytest tests/test_sibling_pin_alignment_omn13902.py -q --no-cov'
  - id: req-lane-write-guard-tracks-refreshed-write-config
    statement: The lane write guard honours a github_mode_by_owner row of the write_config contract that the sibling-refreshed omnimarket carries, and a github_mode_by_repository row wins over its owner row.
    acceptance:
      - id: AC3
        statement: 'AC3: The lane write guard honours a github_mode_by_owner row of the write_config contract that the sibling-refreshed omnimarket carries, and a github_mode_by_repository row wins over its owner row. -- falsifier: uv lock --check && uv run pytest tests/scripts/test_gh_lane_write_guard.py -q --no-cov'
  - id: req-refreshed-capture-metadata
    statement: The refreshed capture-contract mirror preserves GuardRefusal and AssistantUsage metadata when its redaction policy is explicitly applied.
    acceptance:
      - id: AC4
        statement: 'AC4: GuardRefusal identifiers and AssistantUsage counts, source hook and partial-window flag survive explicit redaction, including zero counts and false flags, and so do the OMN-18531 sequence and barrier fields this refresh declares on hook.event and content.captured; undeclared content is hashed and the input is unchanged. -- falsifier: uv run pytest tests/hooks/test_sibling_refresh_capture_metadata_omn13902.py -q --no-cov'
  - id: req-refreshed-raw-capture-fan-out
    statement: The capture fan-out follows the passthrough policy declared by the pinned omnimarket registry, including raw content, lineage, sequence counters and barrier flags.
    acceptance:
      - id: AC5
        statement: 'AC5: hook.event and content.captured preserve their complete payloads without a redaction stamp, retain their session partition key and target topics, and return a new top-level mapping without mutating the input. -- falsifier: uv run pytest tests/hooks/test_sibling_refresh_capture_metadata_omn13902.py -q --no-cov -k refreshed_capture_fan_out'
  - id: req-raw-capture-ruled-guard
    statement: Raw capture publish stays under the guard that enforces RULING 2026-10-15T04:24:42Z, which keeps the producer payload_encryption option in the capture contract.
    acceptance:
      - id: AC6
        statement: 'AC6: The capture contract keeps its payload_encryption block with enabled and key_secret_ref, and no scrub, content hash or redaction field returns to the hook and content capture producer. Both producers refuse unreadable or malformed encryption configuration; enabled encryption survives the refreshed raw fan-out and decrypts to the captured content. -- falsifier: uv run pytest tests/ci/test_raw_capture_guard_omn19513.py tests/unit/hooks/test_hook_payload_encryption_omn19513.py -q --no-cov'
  - id: req-sibling-refresh-holds-refused-release-pins
    statement: The sibling-lock refresh holds refused release pins at their checked-out lock versions before publishing a refresh delta.
    acceptance:
      - id: AC7
        statement: 'AC7: After upgrading packages and before capture-mirror sync or delta detection, the refresh judges the lock against HEAD:uv.lock with live dev tags, re-locks every refused pin at its base version, and requires an unguarded final judgement to pass. -- falsifier: uv run pytest -q -o addopts="" --noconftest tests/workflows/test_sibling_lock_refresh_holds_refused_pins_omn13902.py'
  - id: req-daemon-internal-run-step
    statement: delegation.run_step is a daemon-internal event type that the client event registry generator excludes.
    acceptance:
      - id: AC8
        statement: 'AC8: delegation.run_step is in DAEMON_INTERNAL_EVENT_TYPES and is excluded from the projected client registry. -- falsifier: uv run pytest tests/hooks/test_generate_event_registry.py -q --no-cov -k delegation_run_step_is_daemon_internal'
  - id: req-refreshed-sibling-install
    statement: The installed omnimarket Git parser matches the published refreshed source and retains older plan paths beyond the command report tail limit.
    acceptance:
      - id: AC9
        statement: 'AC9: The installed Git parser matches the published refreshed omnimarket module, preserves all 160 plan paths in parser output, and keeps command reports truncated. -- falsifier: run dod-omniclaude-deploy-sibling-parser on a hosted runner with HTTPS, uv, git and sha256sum.'
  - id: req-refusal-recorder-supplies-normalizer-facts
    statement: The hook refusal recorder passes the normalizer facts the refreshed omnimarket row node requires, from an operator overlay or a built-in configuration.
    acceptance:
      - id: AC10
        statement: 'AC10: decide_row builds ModelErrorNormalizerFacts through build_normalizer_facts and the refusal row request carries them, so a refusal is recorded rather than refused by the row node. -- falsifier: uv run pytest tests/hooks/test_refusal_recorder_state_omn20265.py -q --no-cov'
evidence_requirements:
  - kind: tests
    command: grep -Eq "omnimarket @ git[+]https://github[.]com/OmniNode-ai/omnimarket[.]git@dev-[0-9]{14}-[0-9a-f]{12}" pyproject.toml && uv run python scripts/check_public_skill_hygiene.py && uv run pytest tests/test_git_source_pins.py tests/test_sibling_pin_alignment_omn13902.py -q --no-cov
    description: Validates forward-only git refresh behavior including descendant acceptance, non-descendant refusal, and rev rewriting.
  - kind: ci
    command: grep -Eq "omnimarket[.]git[?]tag=dev-[0-9]{14}-[0-9a-f]{12}#[0-9a-f]{40}" uv.lock && uv lock --check && uv run python scripts/check_public_skill_hygiene.py && uv run pytest tests/test_sibling_pin_alignment_omn13902.py -q --no-cov
    description: Verifies that uv.lock resolves the declared dependencies and git source revs without rewriting.
  - kind: tests
    command: uv lock --check && uv run pytest tests/scripts/test_gh_lane_write_guard.py -q --no-cov
    description: Verifies the lane write guard follows the owner-level write_config rows that the refreshed omnimarket contract carries.
  - kind: tests
    command: uv run pytest tests/hooks/test_sibling_refresh_capture_metadata_omn13902.py -q --no-cov
    description: Exercises explicit redaction of metadata and raw runtime fan-out, including input immutability.
  - kind: tests
    command: uv run pytest tests/ci/test_raw_capture_guard_omn19513.py tests/unit/hooks/test_hook_payload_encryption_omn19513.py -q --no-cov
    description: Verifies the raw-capture guard keeps the payload_encryption option and refuses redaction returning to the capture producer.
  - kind: tests
    command: uv run pytest -q -o addopts="" --noconftest tests/workflows/test_sibling_lock_refresh_holds_refused_pins_omn13902.py
    description: Verifies hold-back ordering, base-lock and dev-tag inputs, refused-pin re-locking, and final judgement before publishing the refresh delta.
dod_evidence:
  - id: dod-omniclaude-sibling-refresh-behavior
    source: manual
    binds_ac:
      - AC1
    description: Validates forward-only git refresh behavior including descendant acceptance, non-descendant refusal, and rev rewriting.
    checks:
      - check_type: command
        check_value: grep -Eq "omnimarket @ git[+]https://github[.]com/OmniNode-ai/omnimarket[.]git@dev-[0-9]{14}-[0-9a-f]{12}" pyproject.toml
      - check_type: test_passes
        check_value: uv run pytest tests/test_git_source_pins.py -q --no-cov
      - check_type: test_passes
        check_value: uv run pytest tests/test_sibling_pin_alignment_omn13902.py -q --no-cov
  - id: dod-omniclaude-sibling-lock-resolution
    source: manual
    binds_ac:
      - AC2
    description: Verifies that uv.lock resolves the declared dependencies and git source revs without rewriting.
    checks:
      - check_type: command
        check_value: grep -Eq "omnimarket[.]git[?]tag=dev-[0-9]{14}-[0-9a-f]{12}#[0-9a-f]{40}" uv.lock && uv lock --check && uv run python scripts/check_public_skill_hygiene.py && uv run pytest tests/test_sibling_pin_alignment_omn13902.py -q --no-cov
  - id: dod-omniclaude-lane-write-guard-owner-rows
    source: manual
    binds_ac:
      - AC3
    description: Verifies the lane write guard follows the owner-level write_config rows that the refreshed omnimarket contract carries.
    checks:
      - check_type: command
        check_value: uv lock --check && uv run pytest tests/scripts/test_gh_lane_write_guard.py -q --no-cov
  - id: dod-omniclaude-refreshed-capture-metadata
    source: manual
    binds_ac:
      - AC4
    description: Explicit redaction preserves the refreshed metadata and hashes undeclared content; raw fan-out is verified separately against the pinned registry policy.
    checks:
      - check_type: command
        check_value: uv run pytest tests/hooks/test_sibling_refresh_capture_metadata_omn13902.py -q --no-cov
  - id: dod-omniclaude-refreshed-raw-capture-fan-out
    source: manual
    binds_ac:
      - AC5
    description: Raw hook, full-content and empty-barrier records survive the fan-out unchanged. These behavioral assertions fail against the merge-base registry's redaction transforms.
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/hooks/test_sibling_refresh_capture_metadata_omn13902.py -q --no-cov -k refreshed_capture_fan_out
  - id: dod-omniclaude-raw-capture-ruled-guard
    source: manual
    binds_ac:
      - AC6
    description: The raw-capture guard stays enforced alongside producer refusal on invalid encryption settings and encrypted capture round trips through the refreshed fan-out. The configuration refusal and round-trip tests fail against the merge base.
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_raw_capture_guard_omn19513.py tests/unit/hooks/test_hook_payload_encryption_omn19513.py -q --no-cov
  - id: dod-omniclaude-sibling-refresh-holds-refused-pins
    source: manual
    binds_ac:
      - AC7
    description: Hosted workflow checks require the hold-back step, its base-lock and dev-tag inputs, refused-pin re-locking, and an unguarded final judgement. They fail against the merge-base workflow, which has no hold-back step.
    checks:
      - check_type: test_passes
        check_value: uv run pytest -q -o addopts="" --noconftest tests/workflows/test_sibling_lock_refresh_holds_refused_pins_omn13902.py
  - id: dod-omniclaude-daemon-internal-run-step
    source: manual
    binds_ac:
      - AC8
    description: delegation.run_step is listed as a daemon-internal event type, so the generated client registry carries no registration for it. The new test fails against the merge base, which lacks the entry.
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/hooks/test_generate_event_registry.py -q --no-cov -k delegation_run_step_is_daemon_internal
  - id: dod-omniclaude-core-hook-alignment-pr3169
    source: manual
    binds_ac:
      - AC2
    description: The lock resolves without rewriting, omnimarket's dependency, source and lock tags agree, and the installed refreshed Git parser retains every plan path beyond the command report tail limit. The parser test fails with the merge-base dependency, which truncates parser output too. The core runtime and hook tags remain independently pinned.
    checks:
      - check_type: test_passes
        check_value: uv lock --check && uv run pytest tests/test_sibling_pin_alignment_omn13902.py -q --no-cov
  - id: dod-omniclaude-deploy-sibling-parser
    description: The installed Git parser module matches the published source at the refreshed omnimarket commit. Its parser retains older plans while command reports remain truncated. The merge-base installation has a different digest and truncates parser output. The hosted runner needs HTTPS, uv, git and sha256sum.
    source: manual
    binds_ac: [AC9]
    checks:
      - check_type: command
        check_value: >-
          d=$(uv run python -c 'import hashlib; from pathlib import Path; import omnimarket.nodes.node_morning_ground_state_orchestrator.tools.base as b; print(hashlib.sha256(Path(b.__file__).read_bytes()).hexdigest())') && curl --fail --silent --show-error https://raw.githubusercontent.com/OmniNode-ai/omnimarket/f4f21df990cba0a53328b8858876eb2255c2447b/src/omnimarket/nodes/node_morning_ground_state_orchestrator/tools/base.py | sha256sum | grep -q "^$d  -$" && uv run pytest tests/test_sibling_pin_alignment_omn13902.py -q --no-cov -k refreshed_git_parser
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omniclaude-refusal-recorder-normalizer-facts
    source: manual
    binds_ac:
      - AC10
    description: The refusal recorder runs against the refreshed omnimarket row node with the normalizer facts supplied by the container.
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/hooks/test_refusal_recorder_state_omn20265.py -q --no-cov
  - id: dod-omniclaude-refusal-recorder-integration-proof
    source: manual
    execution_scope: local_done_gate
    binds_ac:
      - AC10
    description: The change run from the pushed branch on a lab host, with the refreshed omnimarket installed, records a refusal through the real row node.
    checks:
      - check_type: command
        check_value: uv run pytest tests/hooks/test_refusal_recorder_state_omn20265.py -q --no-cov
