schema_version: 1.0.0
ticket_id: OMN-13902
title: sibling version alignment for omniclaude
summary: OMN-13902 is sibling version alignment through the sibling-lock-refresh workflow. This contract validates omniclaude sibling-refresh behavior and lock resolution directly. The sibling-lock-refresh workflow checks out sources, advances clone-governed revs, refreshes package locks, and opens a bot pull request, performing no deploy, container restart, docker compose against a lab host, image build/push, rpk produce, or live cluster/runtime mutation.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
requirements:
  - id: req-forward-only-git-refresh
    statement: A strict descendant is accepted, a non-descendant is refused without writing, both dependency and source rev occurrences are rewritten together, and only omnimarket is declared clone-governed.
    acceptance:
      - id: AC1
        statement: 'AC1: A strict descendant is accepted, a non-descendant is refused without writing, both dependency and source rev occurrences are rewritten together, and only omnimarket is declared clone-governed. -- falsifier: grep -Eq "omnimarket @ git[+]https://github[.]com/OmniNode-ai/omnimarket[.]git@[0-9a-f]{40}" pyproject.toml && uv run python scripts/check_public_skill_hygiene.py && uv run pytest tests/test_git_source_pins.py tests/test_sibling_pin_alignment_omn13902.py -q --no-cov'
  - id: req-sibling-lock-resolution
    statement: uv.lock resolves the declared dependencies and git source revs without rewriting.
    acceptance:
      - id: AC2
        statement: 'AC2: uv.lock resolves the declared dependencies and git source revs without rewriting. -- falsifier: grep -Eq "omnimarket[.]git[?]rev=[0-9a-f]{40}#[0-9a-f]{40}" uv.lock && uv lock --check && uv run python scripts/check_public_skill_hygiene.py && uv run pytest tests/test_sibling_pin_alignment_omn13902.py -q --no-cov'
  - id: req-lane-write-guard-tracks-refreshed-write-config
    statement: The lane write guard honours a github_mode_by_owner row of the write_config contract that the sibling-refreshed omnimarket carries, and a github_mode_by_repository row wins over its owner row.
    acceptance:
      - id: AC3
        statement: 'AC3: The lane write guard honours a github_mode_by_owner row of the write_config contract that the sibling-refreshed omnimarket carries, and a github_mode_by_repository row wins over its owner row. -- falsifier: uv lock --check && uv run pytest tests/scripts/test_gh_lane_write_guard.py -q --no-cov'
  - id: req-refreshed-capture-metadata
    statement: The refreshed hook-event fan-out preserves GuardRefusal and AssistantUsage metadata and raw content under the pinned daemon registry passthrough policy.
    acceptance:
      - id: AC4
        statement: 'AC4: GuardRefusal identifiers and AssistantUsage counts, source hook and partial-window flag survive fan-out, including zero counts and false flags; raw content and the input are unchanged. -- falsifier: uv run pytest tests/hooks/test_sibling_refresh_capture_metadata_omn13902.py -q --no-cov'
  - id: req-refreshed-capture-publish-transform
    statement: The hook.event and content.captured publish transforms project the refreshed omnimarket registry passthrough policy.
    acceptance:
      - id: AC5
        statement: 'AC5: Both capture events preserve the complete raw payload, nested content and lineage without mutating the input. -- falsifier: uv run pytest tests/unit/hooks/test_hook_claude_capture_omn19513.py -q --no-cov -k publish_transform'
evidence_requirements:
  - kind: tests
    command: grep -Eq "omnimarket @ git[+]https://github[.]com/OmniNode-ai/omnimarket[.]git@[0-9a-f]{40}" pyproject.toml && uv run python scripts/check_public_skill_hygiene.py && uv run pytest tests/test_git_source_pins.py tests/test_sibling_pin_alignment_omn13902.py -q --no-cov
    description: Validates forward-only git refresh behavior including descendant acceptance, non-descendant refusal, and rev rewriting.
  - kind: ci
    command: grep -Eq "omnimarket[.]git[?]rev=[0-9a-f]{40}#[0-9a-f]{40}" uv.lock && uv lock --check && uv run python scripts/check_public_skill_hygiene.py && uv run pytest tests/test_sibling_pin_alignment_omn13902.py -q --no-cov
    description: Verifies that uv.lock resolves the declared dependencies and git source revs without rewriting.
  - kind: tests
    command: uv lock --check && uv run pytest tests/scripts/test_gh_lane_write_guard.py -q --no-cov
    description: Verifies the lane write guard follows the owner-level write_config rows that the refreshed omnimarket contract carries.
  - kind: tests
    command: uv run pytest tests/hooks/test_sibling_refresh_capture_metadata_omn13902.py -q --no-cov
    description: Exercises the refreshed capture metadata and raw content through the runtime fan-out while checking input immutability.
dod_evidence:
  - id: dod-omniclaude-sibling-refresh-behavior
    source: manual
    binds_ac:
      - AC1
    description: Validates forward-only git refresh behavior including descendant acceptance, non-descendant refusal, and rev rewriting.
    checks:
      - check_type: command
        check_value: grep -Eq "omnimarket @ git[+]https://github[.]com/OmniNode-ai/omnimarket[.]git@[0-9a-f]{40}" pyproject.toml && uv run python scripts/check_public_skill_hygiene.py && uv run pytest tests/test_git_source_pins.py tests/test_sibling_pin_alignment_omn13902.py -q --no-cov
  - id: dod-omniclaude-sibling-lock-resolution
    source: manual
    binds_ac:
      - AC2
    description: Verifies that uv.lock resolves the declared dependencies and git source revs without rewriting.
    checks:
      - check_type: command
        check_value: grep -Eq "omnimarket[.]git[?]rev=[0-9a-f]{40}#[0-9a-f]{40}" uv.lock && uv lock --check && uv run python scripts/check_public_skill_hygiene.py && uv run pytest tests/test_sibling_pin_alignment_omn13902.py -q --no-cov
  - id: dod-omniclaude-lane-write-guard-owner-rows
    source: manual
    binds_ac:
      - AC3
    description: Verifies the lane write guard follows the owner-level write_config rows that the refreshed omnimarket contract carries.
    checks:
      - check_type: command
        check_value: uv lock --check && uv run pytest tests/scripts/test_gh_lane_write_guard.py -q --no-cov
  - id: dod-omniclaude-refreshed-capture-metadata
    source: manual
    binds_ac:
      - AC4
    description: The hook-event fan-out preserves metadata and raw content; the same tests fail with the dispatch-head redaction transform.
    checks:
      - check_type: command
        check_value: uv run pytest tests/hooks/test_sibling_refresh_capture_metadata_omn13902.py -q --no-cov
  - id: dod-omniclaude-refreshed-raw-capture-publish
    source: manual
    binds_ac:
      - AC5
    description: Both publish rules preserve the raw payload under the pinned daemon passthrough policy; the tests fail with the dispatch-head transforms.
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/hooks/test_hook_claude_capture_omn19513.py -q --no-cov -k publish_transform
  - id: dod-omniclaude-raw-capture-deploy-smoke
    source: manual
    binds_ac:
      - AC4
      - AC5
    description: A fresh Python container loads the checked-out runtime with frozen dependencies and exercises both capture publish rules and metadata preservation. The probe runs on a hosted runner without a production service or credentials and fails with the dispatch-head transforms.
    checks:
      - check_type: command
        check_value: 'docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace --env CI=true --env UV_PROJECT_ENVIRONMENT=/tmp/deploy-smoke-venv ghcr.io/astral-sh/uv:python3.12-bookworm uv run --frozen --group dev pytest tests/unit/hooks/test_hook_claude_capture_omn19513.py tests/hooks/test_sibling_refresh_capture_metadata_omn13902.py -q --no-cov -p no:cacheprovider -k "publish_transform or refreshed_metadata"'
