schema_version: "1.0.0"
ticket_id: OMN-20916
title: "Lanes cannot read GitHub around the gh shim: GitHub MCP read tools, direct api.github.com calls and the real gh by path are refused from a lane"
summary: >
  node_lane_github_read_guard_effect judges one PreToolUse call against the three
  GitHub read paths that bypass the gh shim (a GitHub MCP read tool, a Bash command
  that reaches api.github.com through curl, wget or a script interpreter, and the
  real gh binary run by its path with a read subcommand) and refuses each from a
  lane with the local reader named. The registered Bash guards entrypoint hands it
  every call its text pre-filter matches, and its matcher now also covers the
  GitHub MCP tools. Writes and the operator's interactive session are never refused.
  This PR covers AC1 to AC3; AC4 and AC5 (the shim install target on lab hosts and
  the lab-host call log) are later work.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20916-lane-reads-around-shim
    statement: A lane must not be able to read GitHub through a GitHub MCP read tool, a direct api.github.com call or the real gh binary by path; the operator's interactive session and every write are unaffected.
    acceptance:
      - id: AC1
        statement: 'AC1: a Claude lane session cannot call a GitHub MCP read tool; the PreToolUse hook refuses it and names the local reader -- falsifier: uv run pytest over a hook test that feeds an MCP pull_request_read call with a lane marker and asserts deny'
      - id: AC2
        statement: 'AC2: a Bash call from a lane that reaches api.github.com by curl, wget or python with a token is refused -- falsifier: uv run pytest over a hook test whose Bash command is a curl to api.github.com/user with the GH_PAT header'
      - id: AC3
        statement: 'AC3: a lane call to the real gh binary by absolute path is refused the same way the shim refuses a read -- falsifier: uv run pytest over a hook test whose Bash command runs the homebrew gh binary''s pr list subcommand with a lane marker'
evidence_requirements:
  - kind: tests
    description: The registered PreToolUse entrypoint denies each of the three read shapes from a lane, allows each from the operator's interactive session, and allows writes and the shim's own calls.
    command: uv run pytest tests/hooks/test_lane_github_read_guard_hook.py -q --no-cov
  - kind: tests
    description: The handler's read and write classification, lane predicate and lite-mode exemption.
    command: uv run pytest tests/unit/nodes/node_lane_github_read_guard_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-20916-ac1
    description: The hook denies mcp__github__pull_request_read from a lane (exit 2, permissionDecision deny, reason naming pr_state_local.py, the canonical clones and pr-state-observed) and allows it from the operator's interactive session.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/hooks/test_lane_github_read_guard_hook.py -q --no-cov -k ac1
        cwd: ${OMNI_HOME}/omniclaude
    binds_ac:
      - AC1
  - id: dod-omn-20916-ac2
    description: The hook denies a curl to api.github.com/user carrying the GH_PAT header from a lane, and allows it from the operator's interactive session; the token value never appears in the hook's output.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/hooks/test_lane_github_read_guard_hook.py -q --no-cov -k ac2
        cwd: ${OMNI_HOME}/omniclaude
    binds_ac:
      - AC2
  - id: dod-omn-20916-ac3
    description: The hook denies /opt/homebrew/bin/gh pr list from a lane and allows it from the operator's interactive session; a real-gh write and the shim by its own path are allowed.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/hooks/test_lane_github_read_guard_hook.py -q --no-cov -k ac3
        cwd: ${OMNI_HOME}/omniclaude
    binds_ac:
      - AC3
