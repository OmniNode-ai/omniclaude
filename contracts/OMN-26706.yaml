schema_version: "1.0.0"
ticket_id: OMN-26706
title: "The public-repo hygiene diff-base step resolves a one-parent pull request checkout from the event's shas"
summary: >
  A pull_request run re-run after its pull request merged checks out the base tip, one parent, and the
  "Resolve the diff base" step refused it, turning CI Summary red. The step now keeps the two-parent merge-ref
  behaviour and otherwise fetches the pull request head and base by the event's shas, checks the head out and
  diffs it against the base. This change finishes only that defect; the lane work reducer criteria of the ticket
  are not touched here.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26706-hygiene-diff-base
    statement: The hygiene gate's diff-base step never skips the scan on a re-run of a merged pull request.
    acceptance: []
evidence_requirements:
  - kind: tests
    description: "The hygiene workflow suite passes, with the one-parent, two-parent and unfetchable-head cases"
    command: "uv run pytest tests/workflows/test_public_repo_hygiene_workflows.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26706-hygiene-one-parent
    description: "Both copies of the diff-base step, run on a depth-2 checkout of the base tip with the event's head and base shas, fetch the head, check it out and output the base as the diff base; a head the remote does not hold is refused with the gate-did-not-run error. Fails at the merge base, which exits 1 on a one-parent checkout."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/workflows/test_public_repo_hygiene_workflows.py -q --no-cov -k diff_base"
        cwd: "."
