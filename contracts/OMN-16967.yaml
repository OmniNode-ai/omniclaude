---
schema_version: "1.0.0"
ticket_id: "OMN-16967"
title: "Add the cloud delegate skill shim"
summary: >
  The omniclaude plugin exposes /onex:cloud_delegate as a thin dispatch skill
  over the onex cloud delegate CLI path. The shim declares the skill surface,
  prompt, distribution classification, and node contract without adding HTTP or
  credential handling to the plugin itself.

is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api

evidence_requirements:
  - kind: "tests"
    description: "The delegate shim test keeps the skill as a thin wrapper over the CLI-backed cloud delegation path."
    command: "uv run pytest -q tests/unit/hooks/lib/test_delegate_shim_thin.py --tb=short"
  - kind: "lint"
    description: "The touched skill and cloud delegate node paths pass ruff format/check."
    command: "uv run ruff format --check plugins/onex/skills/cloud_delegate src/omniclaude/nodes/node_skill_cloud_delegate_orchestrator tests && uv run ruff check plugins/onex/skills/cloud_delegate src/omniclaude/nodes/node_skill_cloud_delegate_orchestrator tests"

emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""

dod_evidence:
  - id: "dod-cloud-delegate-thin-shim"
    description: >
      The PR adds /onex:cloud_delegate as a dispatch-only skill and generated
      node contract. The skill delegates to the onex cloud CLI and does not
      perform HTTP calls, API-key handling, or fallback answering in the plugin.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "uv run pytest -q tests/unit/hooks/lib/test_delegate_shim_thin.py --tb=short"
      - check_type: "command"
        check_value: "uv run ruff format --check plugins/onex/skills/cloud_delegate src/omniclaude/nodes/node_skill_cloud_delegate_orchestrator tests && uv run ruff check plugins/onex/skills/cloud_delegate src/omniclaude/nodes/node_skill_cloud_delegate_orchestrator tests"
