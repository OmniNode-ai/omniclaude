---
schema_version: "1.0.0"
ticket_id: "OMN-13536"
title: "Omnimarket dispatch-venv drift guard — pre-commit + CI gate"
summary: >-
  Skills dispatch ONEX nodes from the installed omnimarket package in the plugin venv.
  When the installed commit lags canonical omnimarket@main, skills silently execute stale
  node bytes (old stubs, renamed/deleted handlers).  This was the root cause of
  tech_debt_sweep dispatching the OMN-12212 NotImplementedError stub (installed 0.4.3 carried
  the pre-implementation stub; canonical @main has the real handler), and pr_review_bot failing
  with "Unknown node node_pr_review_orchestrator" off a stale 0.4.0 wheel (OMN-13531 fixed the
  mapping name; this ticket adds the installed-bytes guard).  This PR adds
  scripts/check_omnimarket_dispatch_drift.py, a pre-commit hook, and a standalone CI gate
  (omnimarket-dispatch-drift-gate.yml) that compare the uv.lock-pinned omnimarket git SHA against
  an explicit release-lane baseline and fail on any unapproved divergence. The full
  omnimarket@main pin upgrade is blocked by the current omniintelligence transitive source pin,
  so this PR ratchets the approved dispatch SHA until that dependency cascade lands. The guard
  still accepts canonical-main injection for callers that are ready to enforce it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-guard-script"
    description: >-
      scripts/check_omnimarket_dispatch_drift.py added with lock-consistency mode (always runs)
      and live dispatch-venv mode (local only). Parses uv.lock, extracts pinned omnimarket git SHA,
      compares against --expected-sha / OMNIMARKET_EXPECTED_SHA when supplied, and otherwise falls
      back to canonical omnimarket@main resolution. Fails (exit 1) if pinned SHA != expected; passes
      (exit 0) when the lock and live venv match the approved dispatch SHA.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          python3 scripts/check_omnimarket_dispatch_drift.py --print-pinned-sha
  - id: "dod-pre-commit-hook"
    description: >-
      .pre-commit-hooks/check-omnimarket-dispatch-drift.sh wired in .pre-commit-config.yaml
      (files: uv.lock, pyproject.toml) with the current approved release-lane baseline
      597fc11af2ad49ca8c780fcd8cb99b8895765398 so the gate fires automatically when the lock
      or project config changes. pre-commit run check-omnimarket-dispatch-drift --all-files exits 0.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "pre-commit run check-omnimarket-dispatch-drift --all-files"
  - id: "dod-ci-gate"
    description: >-
      .github/workflows/omnimarket-dispatch-drift-gate.yml: standalone CI gate that injects
      OMNIMARKET_EXPECTED_SHA=597fc11af2ad49ca8c780fcd8cb99b8895765398 and runs the guard script.
      Wired on push/PR to main + dev + hotfix/*.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "ls .github/workflows/omnimarket-dispatch-drift-gate.yml"
  - id: "dod-negative-case"
    description: >-
      Deliberately non-matching lock pin fails the guard. Proven by test_main_fails_with_stale_lock_pin:
      the test writes _LOCK_STALE with the real v0.4.0 SHA, injects a non-matching canonical SHA,
      and asserts exit 1 + "drift" in stderr.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          uv run pytest tests/scripts/test_check_omnimarket_dispatch_drift.py::test_main_fails_with_stale_lock_pin -q
  - id: "dod-tests"
    description: >-
      13 unit tests in tests/scripts/test_check_omnimarket_dispatch_drift.py covering SHA extraction,
      lock-consistency, drift detection, negative case (stale tag), no-venv no-op, main() positive
      + negative paths, explicit baseline override, and SPDX header. All pass.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          uv run pytest tests/scripts/test_check_omnimarket_dispatch_drift.py -q
