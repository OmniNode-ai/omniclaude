schema_version: "1.0.0"
ticket_id: OMN-21059
title: "The models a user picks for each API key become that user's delegation routing order"
summary: >
  Every provider key now runs only models its owner chose (omnimarket, same
  ticket): onex models add with no --model is refused with BYOK_MODEL_NOT_CHOSEN
  for Gemini and OpenAI as it already was for OpenRouter. Onboarding therefore
  passes a model for every key it registers: OpenRouter keeps the overlay's
  default, and a Gemini or OpenAI key gets the model onex models default-model
  names from that key's own list (the key on stdin), shown in the run's result
  line. A default onex cannot name ends that key with the reason and the command
  that chooses a model, storing nothing; an onex that names a default for
  OpenRouter alone gets the key with no --model, as before.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21059-onboarding-passes-a-model
    statement: "Onboarding registers every provider key with a model named on the command, never leaving the choice to a silent registration pick."
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: a key with no chosen model is refused with a message naming how to choose one, never a silent cheapest-model fallback -- falsifier: uv run pytest on a delegation test with a key holding no chosen model that expects the refusal code and message and no stored or used default model
evidence_requirements:
  - kind: tests
    description: "A Gemini key's model from onex models default-model reaches onex models add --model with the key on stdin; a refused default stores nothing and names onex models add gemini --model; an onex that names a default for OpenRouter alone registers as before."
    command: "uv run pytest tests/skills/test_lab_onboarding_script_omn20150.py -q -k suggest -x"
  - kind: tests
    description: "The onboarding guide pins the script that passes a model for every key it registers."
    command: "uv run pytest tests/skills/test_onboarding_script_pin_omn20818.py -q -k every_keys_default_model -x"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
