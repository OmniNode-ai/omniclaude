---
schema_version: 1.0.0
ticket_id: OMN-20110
title: Hook capture accepts current sidecars and journals before bus delivery
summary: The capture accepts sidecars without description or origin fields, logs structured validation errors without private input, and always
  journals locally for delivery by the existing drainer. Live workstation verification and drainer repair remain pending.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn20110-ac1
  statement: journal append performs no directory scan, so its cost does not grow with the backlog, and the bound is enforced by the drainer
  acceptance:
  - id: AC1
    statement: 'AC1: journal append performs no directory scan, so its cost does not grow with the backlog, and the bound is enforced by the drainer
      -- falsifier: uv run pytest tests/hooks/test_hook_emit_journal.py -q -k append_does_not_scan'
- id: req-omn20110-ac2
  statement: the drainer lists at most one batch of records per pass instead of parsing the whole journal
  acceptance:
  - id: AC2
    statement: 'AC2: the drainer lists at most one batch of records per pass instead of parsing the whole journal -- falsifier: uv run pytest
      tests/hooks/test_hook_emit_journal.py -q -k list_pending_limit'
- id: req-omn20110-ac3
  statement: with the journal lock held by another process, the bounded emit wrapper exits non-zero inside its budget with a blocking error that
    names the cause, and leaves no surviving child in its process group
  acceptance:
  - id: AC3
    statement: 'AC3: with the journal lock held by another process, the bounded emit wrapper exits non-zero inside its budget with a blocking
      error that names the cause, and leaves no surviving child in its process group -- falsifier: uv run pytest tests/hooks/test_hook_emit_bounded.py
      -q -k lock_held'
- id: req-omn20110-ac4
  statement: a failed emit raises the operator alarm through alert-channel.sh exactly once per failure episode, and a later successful emit closes
    the episode so the next failure alarms again
  acceptance:
  - id: AC4
    statement: 'AC4: a failed emit raises the operator alarm through alert-channel.sh exactly once per failure episode, and a later successful
      emit closes the episode so the next failure alarms again -- falsifier: uv run pytest tests/hooks/test_hook_emit_bounded.py -q -k alarm_once_per_episode'
- id: req-omn20110-ac5
  statement: the emitting hook scripts run the emit through the bounded wrapper in the foreground, with no disowned emit, no spool, no fail-open
    branch and no kill switch
  acceptance:
  - id: AC5
    statement: 'AC5: the emitting hook scripts run the emit through the bounded wrapper in the foreground, with no disowned emit, no spool, no
      fail-open branch and no kill switch -- falsifier: uv run pytest tests/hooks/test_hook_emit_bounded.py -q -k no_disowned_emit'
evidence_requirements:
- kind: tests
  description: Capture regression tests, including the real Stop wrapper and drainer retry boundary.
  command: uv run pytest tests/unit/hooks/test_hook_capture_failures_omn20110.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
