schema_version: "1.0.0"
ticket_id: OMN-22559
title: "The Bash guards' shared runner refuses every command while the hook venv is being rewritten"
summary: >
  A sync of the hook venv rewrites its editable-install file; an interpreter that started inside that window cannot import omniclaude for its life, so the runner refused with 'guard core cannot be imported'. The runner now retries in a fresh interpreter for at most about 3.75 seconds before refusing as before.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22559-fix
    statement: The Bash guards' shared runner refuses every command while the hook venv is being rewritten.
    acceptance:
      - id: "AC1"
        statement: "AC1: a guard core missing in the running interpreter but importable in a fresh one after a short wait runs and returns its verdict -- falsifier: uv run pytest tests/hooks/test_bash_guard_cores_venv_rewrite_omn22478.py -k becomes_importable -q --no-cov"
      - id: "AC2"
        statement: "AC2: a module that stays missing past the bound is still refused with the same message -- falsifier: uv run pytest tests/hooks/test_bash_guard_cores_venv_rewrite_omn22478.py -k stays_missing -q --no-cov"
evidence_requirements:
  - kind: tests
    description: "The focused tests pass on the lab from the branch"
    command: "uv run pytest tests/hooks/test_bash_guard_cores_venv_rewrite_omn22478.py tests/hooks/test_git_admission_runtime.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
