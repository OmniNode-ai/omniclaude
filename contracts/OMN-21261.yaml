---
schema_version: "1.0.0"
ticket_id: OMN-21261
title: "Before each participant email, the exact emailed onboarding command runs end to end on a clean macOS VM with one real key per provider"
summary: >
  The onboarding script's INFRA_ANCHOR stood at an omnibase_infra commit from
  2026-10-22, before omnibase_infra#5660 (OMN-22291) made the local stack's
  health grader quiet. A participant walk at that anchor rebuilt the old grader
  and failed phase 4 on a healthy stack. This change moves the anchor to a dev
  commit that contains the fix, the precondition for the end-to-end walk on a
  fresh account that the ticket's acceptance criteria require. It does not
  satisfy those criteria; the walk is separate evidence recorded on the ticket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21261-anchor-carries-health-fix
    statement: The anchor a participant email pins is not one that predates the local stack health fix.
    acceptance:
      - id: "AC4"
        statement: "AC4: INFRA_ANCHOR is not an omnibase_infra commit recorded as predating the local stack health fix (OMN-22291) -- falsifier: uv run pytest tests/skills/test_lab_onboarding_anchor_health_fix_omn21261.py -q --no-cov with INFRA_ANCHOR set back to aa81312c2c405424d4c947d61c7763d38e67b3a1"
  - id: req-omn21261-document-tested-command
    statement: The participant guide downloads the corrected script with its checksum and defaults to native delegation.
    acceptance:
      - id: "AC5"
        statement: "AC5: ONBOARDING.md pins ad5d6ef877b3b792f5facccf807d466986eba9b5 and its SHA256 947ddfc430da2eead1184c255c10dec95aa642eb7bf40e83e66df36f3dd401df -- falsifier: restore the old 11a255e3 URL or its ea5312e7 checksum in the download command."
      - id: "AC6"
        statement: "AC6: the documented run command passes --no-containers and explains that phase 4 is skipped -- falsifier: remove --no-containers from the run command."
evidence_requirements:
  - kind: tests
    description: "The anchor shape test, the anchor health-fix floor test and the guide pin test pass"
    command: "uv run pytest tests/skills/test_lab_onboarding_anchor_omn21255.py tests/skills/test_lab_onboarding_anchor_health_fix_omn21261.py tests/skills/test_onboarding_guide_pin_omn21261.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21261-anchor-health-fix
    description: "The script's INFRA_ANCHOR is not the 2026-10-22 commit that predates dcd3b55a3 (OMN-22291). Fails at the merge base, whose anchor is that commit. The clean-account end-to-end walk of the ticket's AC1 is separate evidence."
    source: manual
    binds_ac:
      - "AC4"
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_lab_onboarding_anchor_health_fix_omn21261.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn21261-document-tested-pin
    description: "The participant download names the corrected script and its checksum. The merge-base guide pins the earlier script, so this test fails there."
    source: manual
    binds_ac: ["AC5"]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_onboarding_guide_pin_omn21261.py -q --no-cov -k ac5"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn21261-document-native-default
    description: "The participant command passes --no-containers and explains the skipped stack phase. The merge-base command omits the flag, so this test fails there. This does not attest to the clean-machine end-to-end walk."
    source: manual
    binds_ac: ["AC6"]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_onboarding_guide_pin_omn21261.py -q --no-cov -k ac6"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn21261-download-repin-to-merged-script
    description: "The participant download names ad5d6ef8, the commit pull request 3167 merged as, with the checksum of the bytes served there. The merge-base guide still names 11a255e3 and its checksum, so the pin test fails there."
    source: manual
    binds_ac: ["AC5"]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_onboarding_guide_pin_omn21261.py -q --no-cov -k ac5"
        cwd: "${OMNI_HOME}/omniclaude"
