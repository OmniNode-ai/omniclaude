title: "Onboarding mints the developer's login on the local broker"
summary: >
  Both phase-4 paths secure an old local stack before minting its developer bus
  login. A mint failure stops onboarding with the step, remedy and log path.
  Without Docker, the real main orchestration finishes without minting and
  explains in phases 3 and 6 that the in-memory bus has no broker or login to mint.
  The preflight covers the six ports published by the local bundle.
