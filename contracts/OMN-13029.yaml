    description: "The defect-anchor pre-commit hook exists and carries the OMN-13029 enforcement marker."
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: "grep -q 'OMN-13029' .pre-commit-hooks/check-defect-anchor.sh"
  - id: "dod-defect-anchor-registration"
    description: "The defect-anchor hook is registered in pre-commit configuration."
    source: "manual"
    status: "verified"
