title: "Defect-anchor gate for evidence documents"
summary: >-
  Add a pre-commit hook and CI gate that reject docs/evidence markdown files
  containing BLOCKER, UNFIXED, DEFECT, REGRESSION, or BUG-CONFIRMED markers
  unless the file contains an OMN ticket reference or an explicit file-level
  defect-anchor escape hatch.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
