schema_version: "1.0.0"
ticket_id: "OMN-13961"
title: "Use canonical docs/handoff path in handoff skill"
summary: >-
  Align the handoff skill instructions with the canonical singular
  docs/handoff directory so generated handoff artifacts and the LATEST pointer
  are written to the same path consumed by current session tooling.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-handoff-path-canonicalized"
    description: >-
      The handoff skill and execution prompt reference docs/handoff for the
      generated handoff document and LATEST.md pointer.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -R "docs/handoff" plugins/onex/skills/handoff/SKILL.md
          plugins/onex/skills/handoff/prompt.md
  - id: "dod-skill-backing-node-lightweight-install"
    description: >-
      The skill backing-node validator installs the frozen default dependency
      set instead of all optional extras, avoiding intelligence/Torch/CUDA
      downloads for docs-only skill validation.
    source: "manual"
    status: "verified"
    checks:
      - check_type: "command"
        check_value: >-
          grep -q "uv sync --frozen" .github/workflows/validate-skill-backing-node.yml
          && ! grep -q "uv sync --all-extras" .github/workflows/validate-skill-backing-node.yml
