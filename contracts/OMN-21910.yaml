    acceptance:
      - id: "AC1"
        statement: "AC1: the handoff skill directory holds SKILL.md alone, SKILL.md dispatches through onex run-node to node_handoff_check_effect and carries no terminal commit -- falsifier: the shim tests in tests/skills/test_handoff_skill.py fail if a code file or prompt.md is present, or the dispatch or the node name is missing"
evidence_requirements:
