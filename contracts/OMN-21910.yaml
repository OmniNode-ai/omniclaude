schema_version: "1.0.0"
ticket_id: "OMN-21910"
title: "The session handoff is a declared contract with a check that assembles and validates it, and a handoff that leaves a ruling unaccounted for is refused"
summary: "The omniclaude half of OMN-21910: the handoff skill becomes a dispatch-only shim that calls the node_handoff_check_effect node through onex run-node and holds no logic. The prompt.md that carried the terminal commit into the retired registry tree is removed, and no code file stays under the skill directory. The node itself, its contract and its tests land in the omnimarket pull request, which merges first; this change deploys nothing and calls no runtime."
