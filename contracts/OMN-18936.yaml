schema_version: "1.0.0"
ticket_id: OMN-18936
title: "Preserve failed segment offsets in git guard admission refusals"
summary: >
  The node_git_effect shell tokenizer keeps the source offset of the command
  segment it failed to tokenise. A git admission refusal for an untokenisable
  command names that segment's start line and column and the syntax-error type,
  without echoing operands. A heredoc elsewhere in the compound no longer hides
  where the failure is. The fail-closed admission policy is unchanged.
