schema_version: "1.0.0"
ticket_id: OMN-20873
title: "hook-process canary: bounded ps listing, and a listing timeout is a typed canary-error, never ALERT with NA counts"
summary: >
  The hook-process canary listed every process of every user with its command line in one
  ps call that timed out after 30 seconds on the loaded operator Mac, so every run raised
  state=ALERT kinds=canary-error with every count NA. The listing now reads only the user's
  own processes without the command column, asks pgrep which are hook processes, and reads the
  command of only those pids, all inside one 30 second deadline. A listing timeout is a typed
  ListingTimeout (class canary-error plus the timeout in seconds) and the ledger row is
  state=CANARY-ERROR stating the timeout. The leak thresholds are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20873-bounded-typed-listing
    statement: The canary lists only the hook processes it counts with a bounded call, and reports a listing timeout as a typed canary-error instead of ALERT with NA counts.
    acceptance:
      - id: AC1
        statement: 'AC1: the canary lists only the hook processes it counts with a bounded call, so the listing completes on a loaded operator Mac -- falsifier: `uv run pytest tests -q -k hook_process_canary_bounded_listing` (omniclaude, run by ci.yml)'
      - id: AC2
        statement: 'AC2: a listing timeout is reported as class=canary-error with the timeout typed, and the canary never raises ALERT with NA counts -- falsifier: `uv run pytest tests -q -k hook_process_canary_listing_timeout_typed`'
evidence_requirements:
  - kind: tests
    description: The bounded listing and typed-timeout tests pass, with the existing canary suite.
    command: uv run pytest tests/hooks_system/test_hook_canary_listing_omn20873.py tests/hooks_system/test_hook_canary.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-20873-ac1
    description: The canary's sampler never lists every user's processes with their commands; it reads the user's own pids without the command column and the command of only the pgrep-selected hook pids, inside one deadline.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/hooks_system/test_hook_canary_listing_omn20873.py -q --no-cov -k hook_process_canary_bounded_listing
        cwd: ${OMNI_HOME}/omniclaude
    binds_ac:
      - AC1
  - id: dod-omn-20873-ac2
    description: A listing timeout is a typed ListingTimeout (class canary-error, timeout seconds); the ledger row is state=CANARY-ERROR with class and timeout_s and carries no NA count, and ALERT.json records the timeout.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/hooks_system/test_hook_canary_listing_omn20873.py -q --no-cov -k hook_process_canary_listing_timeout_typed
        cwd: ${OMNI_HOME}/omniclaude
    binds_ac:
      - AC2
