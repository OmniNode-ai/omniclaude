    description: "ModelEndpointPolicy loads every field from the contract, the touched script holds no URL literal, and their suites pass"
    command: "uv run pytest tests/unit/models/test_model_endpoint_policy.py tests/scripts/test_worktree_auto_prune.py -q --no-cov"
