---
schema_version: "1.0.0"
ticket_id: OMN-20368
title: "Require fresh bound PASS evidence for every Done write and acceptance tick"
summary: >
  The Done-flip guard keeps the lane-safe PR, contract and check-run readers
  shipped in omniclaude#2939. Every acceptance criterion needs a passing
  repo-evidence / dod-verify receipt on the verified contract, whose SHA-256
  must match the entry on origin/dev. Documentation-only merges do not exempt
  a ticket. Guard failures refuse independently of cwd, mode and hooks mask.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20368-bound-receipt-only
    statement: Done writes and acceptance ticks require current criterion-bound evidence.
    acceptance:
      - id: AC1
        statement: A contract binding no acceptance criterion refuses Done even with merged PRs.
      - id: AC2
        statement: Ticked boxes without a bound PASS receipt refuse Done and acceptance ticks.
      - id: AC3
        statement: A receipt whose contract hash differs from origin/dev is stale and refused.
      - id: AC4
        statement: A fresh PASS receipt bound to every acceptance criterion allows Done.
      - id: AC5
        statement: Guard errors refuse and the hook runs regardless of cwd, lite mode or hooks mask.
      - id: AC6
        statement: Skills and workflow briefs do not instruct closing on ticked boxes and a comment.
evidence_requirements:
  - kind: tests
    description: Each acceptance criterion has a focused regression or instruction audit.
    command: uv run pytest tests/hooks/test_done_flip_guard_requires_bound_receipt.py tests/scripts/test_done_closeout_instructions.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn20368-no-acceptance-checks
    description: Merged and green PRs without criterion bindings refuse, including docs-only merges.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest plugins/onex/hooks/tests/test_done_flip_guard_requires_bound_receipt.py -k no_acceptance_checks -q --no-cov
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn20368-ticked
    description: Both Done and acceptance edits refuse without receipts, including cancellation and criterion-dropping updates.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest plugins/onex/hooks/tests/test_done_flip_guard_requires_bound_receipt.py -k ticked -q --no-cov
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn20368-stale
    description: Missing, unreadable or changed origin/dev contract entries cannot reuse an old green receipt; the hash includes comments.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest plugins/onex/hooks/tests/test_done_flip_guard_requires_bound_receipt.py -k stale -q --no-cov
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn20368-bound-pass
    description: Fresh complete bindings permit both Done and ticks; a partial binding remains refused.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run pytest plugins/onex/hooks/tests/test_done_flip_guard_requires_bound_receipt.py -k bound_pass -q --no-cov
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn20368-fail-closed
    description: Library errors, malformed payloads, early helper exits, non-repository cwd, lite mode and masked hooks all refuse without evidence.
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: uv run pytest plugins/onex/hooks/tests/test_done_flip_guard_requires_bound_receipt.py -k fail_closed -q --no-cov
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn20368-closeout-instructions
    description: Shipped skill instructions and the audit reject the retired comment-based closeout recipe; missing audit roots fail.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/scripts/test_done_closeout_instructions.py -q --no-cov
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn20368-deploy-hook-refusal
    description: A hosted runner mounts the source read-only into an isolated Python container and executes the real hook from a scratch cwd. Both full mode and lite mode with mask zero must exit 2 naming the missing binds_ac receipt. No service credentials, fleet endpoint or Linear mutation is used.
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: command
        check_value: >-
          env docker run --rm --network none
          --mount "type=bind,src=${OMNI_HOME}/omniclaude,dst=/repo,readonly"
          python:3.13-slim python /repo/tests/hooks/probe_done_flip_guard.py
        cwd: "${OMNI_HOME}/omniclaude"
