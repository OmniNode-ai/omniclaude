---
schema_version: "1.0.0"
ticket_id: OMN-20368
title: "/onex:dod_verify names the execution audience its node requires"
summary: >
  OMN-20368 makes the /onex:dod_verify skill command carry the required
  --execution-audience flag, introduced by PR 2542. The in-repo contract exists
  because validate-pr-contracts reads contracts/ in this repository.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20368-done-flip-local-pr-state
    statement: The Done-flip guard reads PR merge state from local surfaces, never from gh.
    acceptance:
      - id: AC1
        statement: 'AC1: a PR proven merged by the PR watcher state or the canonical clone passes with no gh on PATH, and an unmerged PR still refuses naming it -- falsifier: pytest tests/hooks/test_done_flip_guard_local_pr_state.py fails before this change and passes after it'
  - id: req-omn20368-done-flip-lane-readers
    statement: The Done-flip hook uses the handler readers for both criterion ticks and Done decisions, including documentation-only evidence.
    acceptance:
      - id: AC2
        statement: 'AC2: the hook passes the handler PR-state and product-contract readers to decide(), ticks and Done share the contract verdict, and missing or refused evidence still refuses without a gh read'
      - id: AC3
        statement: 'AC3: a ticket without a product contract may tick criteria and reach Done only when every cited PR is merged and documentation-only, a merge subject names the ticket, and all acceptance criteria are ticked for Done'
evidence_requirements:
  - kind: tests
    description: "The skill documents the execution audience flag"
    command: "uv run pytest tests/skills/test_dod_verify_names_execution_audience.py -q"
  - kind: tests
    description: "The Done-flip guard reads PR merge state from the PR watcher and the canonical clone, never gh"
    command: "uv run pytest tests/hooks/test_done_flip_guard_local_pr_state.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-audience-tests-pass
    description: >
      The execution audience test suite passes against the skill files.
    source: manual
    status: verified
    checks:
      - check_type: command
        check_value: "uv run pytest tests/skills/test_dod_verify_names_execution_audience.py -q"
  - id: dod-done-flip-local-pr-state
    description: >
      The Done-flip guard proves a PR merged from the PR watcher state or the
      canonical clone's base branch (a squash commit whose subject ends (#N)),
      with no gh on PATH, and still refuses an unmerged PR naming it.
    source: manual
    status: verified
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/hooks/test_done_flip_guard_local_pr_state.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn20368-deploy-local-pr-state-handler
    description: A hosted runner starts an isolated Python runtime container with the changed handler mounted and verifies it defines HandlerLocalPrState and never runs gh. No fleet service or private endpoint is required.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          env docker run --rm --network none
          --mount "type=bind,src=${OMNI_HOME}/omniclaude/src,dst=/runtime,readonly"
          python:3.13-slim python -c
          'import ast; src = open("/runtime/omniclaude/nodes/node_linear_effect/handlers/handler_local_pr_state.py").read(); tree = ast.parse(src); assert "HandlerLocalPrState" in {n.name for n in tree.body if isinstance(n, ast.ClassDef)}; assert not [n for n in ast.walk(tree) if isinstance(n, ast.Constant) and n.value == "gh"]'
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn20368-done-flip-lane-readers
    description: >
      The Done-flip hook hands decide() the node_linear_effect handler's
      HookEvidenceReaders (PR watcher and canonical clone first, then the onex
      scm read node through LaneRepoEvidence), so no PR-state, contract or
      check-run read goes through gh; the tick rule and the Done rule share the
      product-repository verdict; and a documentation-only ticket closes on a
      merged docs-only PR that names it and carries no contract, and on nothing
      weaker.
    source: manual
    binds_ac: [AC2, AC3]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/hooks/test_done_flip_guard_lane_readers.py -q --no-cov"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-omn20368-deploy-hook-evidence-readers
    description: A hosted runner starts an isolated Python container with the changed handler and hook library mounted and verifies the handler defines HookEvidenceReaders with the docs-only verdict, the hook wires it, and neither file names gh. No fleet service or private endpoint is required.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: >-
          env docker run --rm --network none
          --mount "type=bind,src=${OMNI_HOME}/omniclaude,dst=/repo,readonly"
          python:3.13-slim python -c
          'import ast; h = ast.parse(open("/repo/src/omniclaude/nodes/node_linear_effect/handlers/handler_hook_evidence_readers.py").read()); g = open("/repo/plugins/onex/hooks/lib/done_flip_guard.py").read(); c = {n.name: n for n in h.body if isinstance(n, ast.ClassDef)}; assert {"repo_evidence", "docs_evidence", "pr_status"} <= {f.name for f in c["HookEvidenceReaders"].body if isinstance(f, ast.FunctionDef)}; assert "hook_evidence_readers()" in g and "decide(call, **_lane_readers())" in g; assert not [n for t in (h, ast.parse(g)) for n in ast.walk(t) if isinstance(n, ast.Constant) and n.value == "gh"]'
        cwd: "${OMNI_HOME}/omniclaude"
