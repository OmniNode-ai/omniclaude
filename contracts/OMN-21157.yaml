schema_version: 1.0.0
ticket_id: OMN-21157
title: Canonical agent router handler under the rewrite verifier
summary: Add the typed handle entrypoint to the existing agent router handler, preserve its routing implementation, and retire one baseline entry with a git-derived verbatim proof and executed parity tests.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-agent-router-canonical-rewrite
    statement: The existing agent router handler exposes the canonical typed entrypoint while retaining its routing behavior.
    acceptance:
      - id: AC1
        statement: 'AC1: each rewritten omniclaude node leaves the non-canonical list with its line removed and the shape check passing -- falsifier: canonical_handler_shape.py for omniclaude exits non-zero, or the node''s line is still in the list'
      - id: AC2
        statement: 'AC2: every rewrite is proved equivalent by re-execution, never by a self-reported file -- falsifier: verify_flip_bundle.py or equivalence_producer''s byte comparison fails for the node, or the verbatim-body proof does not re-derive from git'
      - id: AC3
        statement: 'AC3: attempted, accepted and rejected rewrites are recorded against the roadmap''s 70% bar -- falsifier: the ticket has no such table'
evidence_requirements:
  - kind: tests
    description: Resolve the handler through its contract binding and compare canonical and legacy routing behavior over the replay corpus.
    command: uv run pytest tests/unit/nodes/node_agent_router/test_handler_agent_router.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-agent-router-ac1-canonical-entrypoint
    description: The contract-bound handler has typed request and result annotations. The native full shape ratchet passed and the node's baseline entry was removed.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_agent_router/test_handler_agent_router.py -q --no-cov -k TestCanonicalHandle
    binds_ac: [AC1]
  - id: dod-agent-router-ac2-executed-parity
    description: All seven native flip-bundle assertions passed, including git-derived preservation and parity red on the base. Eight async replays loaded the legacy handler through the native equivalence producer and produced identical output bytes and forwarded calls.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_agent_router/test_handler_agent_router.py -q --no-cov -k TestCanonicalHandle
    binds_ac: [AC2]
  - id: dod-agent-router-ac3-attempt-accounting
    description: |
      # Canonical handler rewrite accounting

      This first batch changes `node_agent_router` through its existing
      `HandlerAgentRouter` contract binding. The new typed `handle` entrypoint delegates
      to `route`. The constructor, `route`, `_get_router`, `_convert_recommendation` and
      `_safe_float` are preserved from the pre-change git commit; the native verifier
      re-derives their normalized source equality.

      | Node | Attempted | Verifier accepted | Verifier rejected |
      | --- | ---: | ---: | ---: |
      | node_agent_router | 1 | 1 | 0 |

      The verifier acceptance rate is 1/1 (100%) against the roadmap's 70% bar. Merge
      and the 30-day no-revert observation are pending. A draft response alone does not
      count as an accepted rewrite. No other node rewrite was attempted in this batch.

      The baseline contains 127 entries before this change and 126 afterwards. A full
      scan classifies 142 nodes: actual non-canonical handlers decrease from 124 to
      123. Three pre-existing canonical nodes remain listed; this batch removes only
      the agent router entry.

      Validation:

      - The focused handler file has 25 passing tests. Eight corpus cases exercise the
        contract-bound canonical entrypoint and compare its result and forwarded
        arguments with `route`, covering recommendations, empty results, exceptions
        and unavailable initialization, each with and without context.
      - The native adequacy recorder selects three of eight inputs and measures
        81.36% branch-inclusive coverage against an 80% target, without a waiver.
      - The native full canonical handler-shape ratchet exits zero.
      - The native flip-bundle verifier passes all seven assertions. It executes all
        eight declared parity cases green on the new tree and red on their own
        assertions on the git base, after checking source residency.
      - An additional async replay uses `equivalence_producer`'s native git loader to
        materialize the old handler. The new `handle` and old `route` return identical
        serialized bytes and forward identical arguments on all eight corpus inputs.
        No volatile mask is applied. The synchronous equivalence artifact producer is
        exempt on this verbatim hand-flip path; no equivalence verdict file is added.

      Run the focused tests with:

      ```sh
      uv run pytest tests/unit/nodes/node_agent_router/test_handler_agent_router.py -q --no-cov
      ```

      Using the existing validator source checkout (`CORE_CI` points to its `scripts/ci`
      directory), re-execute the consuming gates with:

      ```sh
      uv run python "${CORE_CI:?}/canonical_handler_shape.py" \
        --package omniclaude --src-root src \
        --baseline scripts/ci/canonical_handler_shape_baseline.py \
        --receipts-dir scripts/ci/adequacy_receipts --full
      uv run python "${CORE_CI:?}/verify_flip_bundle.py" \
        --package omniclaude --src-root src \
        --baseline scripts/ci/canonical_handler_shape_baseline.py \
        --receipts-dir scripts/ci/adequacy_receipts \
        --node-id omniclaude.nodes.node_agent_router
      ```

      The verifier needs an ordinary linked checkout for its detached base replay.
      The remote sandbox's checkout requires inherited git pointers; verification in
      an ordinary linked proof worktree passed without changing the verifier.

      The prepared ticket comment must be posted by the publishing host; that
      write was refused in the original remote session.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          uv run python -c "from pathlib import Path; import yaml; contract = yaml.safe_load(Path('contracts/OMN-21157.yaml').read_text()); text = next(item['description'] for item in contract['dod_evidence'] if item['id'] == 'dod-agent-router-ac3-attempt-accounting'); assert '| node_agent_router | 1 | 1 | 0 |' in text; assert '70%' in text; assert '30-day' in text"
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_agent_router/test_handler_agent_router.py -q --no-cov -k TestCanonicalHandle
    binds_ac: [AC3]
  - id: dod-agent-router-deploy-contract-dispatch
    description: A fresh process resolves the deployed contract binding and exercises its typed handler with recommendations, empty results, routing exceptions and unavailable initialization, without external services.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_agent_router/test_handler_agent_router.py -q --no-cov -k TestCanonicalHandle
