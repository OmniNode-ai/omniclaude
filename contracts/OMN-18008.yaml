        check_value: "test ! -e src/omniclaude/nodes/node_manifest_fetch_effect && test ! -e tests/unit/nodes/node_manifest_fetch_effect && ! grep -q node_manifest_fetch_effect scripts/ci/canonical_handler_shape_baseline.py"
