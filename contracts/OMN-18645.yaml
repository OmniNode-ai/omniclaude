schema_version: "1.0.0"
ticket_id: OMN-18645
title: "Surface mid-lane rulings before push and merge"
summary: >
  The Git effect admission handler, registered Bash guard, and
  HandlerGitSubprocess re-read the ledger before a lane's git push or gh pr
  merge. They surface every RULING timestamped after the lane's latest CLAIM
  and refuse publishing until the lane appends an ACK row for each ruling that
  copies its re=, ruling=, and ruling-sha256= cells. Surfaced rulings are
  retained in an append-only journal so an edited, deleted, or rolled ruling
  stays pending until acknowledged.
