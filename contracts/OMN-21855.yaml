schema_version: "1.0.0"
ticket_id: OMN-21855
title: "omniclaude repo-evidence caller installs its verifier from the omnimarket dev-merge tag"
summary: >
  The repo-evidence caller (.github/workflows/call-repo-evidence-gate.yml) called the omnibase_core receipt-gate
  reusable at dev-20261030152335-66d35d2283c3 and installed its verifier from a released package version through
  verifier-version 0.4.310. Operator ruling 2026-10-31T21:49:54Z moves the definition-of-done check to
  the omnimarket dev-merge tag. The caller now calls the reusable at the omnibase_core dev-merge tag
  dev-20261101005012-ac2f26e3e5bf, passes verifier-tag dev-20261101000200-949993edf3b7 and carries no
  verifier-version key. The caller tests assert the new shape.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21855-caller-verifier-tag
    statement: The repo-evidence caller installs its verifier from an omnimarket dev-merge tag and names no released verifier version.
    acceptance:
      - id: AC1
        statement: "AC1: .github/workflows/call-repo-evidence-gate.yml in omniclaude calls OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@dev-20261101005012-ac2f26e3e5bf with verifier-tag dev-20261101000200-949993edf3b7 and no verifier-version key -- falsifier: uv run pytest tests/ci -q -k repo_evidence_caller"
      - id: AC2
        statement: "AC2: every test in omniclaude that asserted verifier-version now asserts verifier-tag and passes, and no test in tests/ names verifier-version as a required caller input -- falsifier: uv run pytest tests/ci -q and grep -rn verifier-version tests/ returning no caller assertion"
      - id: AC3
        statement: "AC3: lab proof: the real install of tag dev-20261101000200-949993edf3b7 on the lab (clone at the tag commit, uv sync --frozen --no-dev --no-editable from its uv.lock) exits 0, and the repo caller tests run as an /omni:lab-run unit exit 0 -- falsifier: the /omni:lab-run receipt for the caller test command and the tag install command, each exit code 0"
evidence_requirements:
  - kind: tests
    description: "The caller tests assert the verifier-tag shape, the absence of verifier-version and the dev-merge tag of the reusable ref"
    command: "uv run pytest tests/ci -q -k repo_evidence_caller"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21855-ac1-caller-shape
    binds_ac: [AC1]
    description: The caller tests pass against the caller at the omnibase_core dev-merge tag with verifier-tag set and verifier-version absent.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci -q -k repo_evidence_caller"
  - id: dod-omn21855-ac2-tests-assert-verifier-tag
    binds_ac: [AC2]
    description: Every caller test file passes with the verifier-tag assertions, including the merge-base comparison that expects verifier-version to be replaced by verifier-tag; the only verifier-version text left in tests/ is the embedded merge-base caller, pinned by git blob id, and the assertions that the key is absent.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci -q"
  - id: dod-omn21855-ac3-lab-proof
    binds_ac: [AC3]
    description: The PR body carries the lab line with the receipts of the verifier tag install and of the caller tests run at the pushed head; the hosted check re-runs the caller tests.
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci -q -k repo_evidence_caller"
