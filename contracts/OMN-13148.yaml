title: "release SKILL.md doc-honesty: align to node_release structural-placeholder reality"
summary: >-
  Docs-only reconciliation of plugins/onex/skills/release/SKILL.md. The skill body
  documented a fully-executing release pipeline (a 14-state phase FSM plus per-repo
  gh pr create / git tag / PyPI publish side effects, an idempotency dedup table, and
  crash-safe state-file resume), but the routed node (node_release in omnimarket) is a
  pure in-memory FSM bookkeeper that performs no git, gh, uv, or PyPI I/O. The fix adds
  a STRUCTURAL PLACEHOLDER banner governing the whole body, documents the real 9-state
  EnumReleasePhase FSM under a new "What actually executes today" section, and moves the
  aspirational pipeline under a clearly marked "Target design (NOT YET IMPLEMENTED)"
  section. The historical placeholder-origin ticket is cited as the migration tracker and
  is NOT reopened. No behavioral code change.
