title: "OMN-13039 — B-10: Epic auto-start ratchet + handoff epic-state gate"
summary: >
  Retro B-10 (PROCESS_FAILURE_RETRO.md §3.B): an epic sat unstarted all day under 22 merged PRs;
  detected twice, fixed zero times; manually marked In Progress 2026-06-12. This PR adds the
  epic.autostart_ratchet capability to node_skill_ticketing_triage_orchestrator (epic_reconcile.py pure
  compute + frozen models + canonical EnumLinearStatusType; node.py exposes reconcile_epic_states();
  contract.yaml declares the capability + io_operation) so an unstarted epic (Backlog/Todo) with >=1
  started/completed child ratchets to In Progress on a single triage tick (monotone; never auto-Done).
  It also adds the required epic_states_reconciled gate to the /onex:handoff skill — the gate verifies every
  cited epic is In Progress or later before writing the manifest; unstarted epics without an exception line
  block the write.
