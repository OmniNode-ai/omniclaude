---
schema_version: "1.0.0"
ticket_id: "OMN-16632"
title: "Developer onboarding sets up in an OMNIBASE_PATH workspace, never OMNI_HOME, and refuses a workspace holding clones it did not create; the published onex install command pins Python so it installs on a clean machine"
summary: "lab-onboarding.sh resolves its workspace from --workspace, then OMNIBASE_PATH, then $HOME/Code/omnibase; it never reads OMNI_HOME, unsets it so no child process inherits it, and writes no OMNI_HOME line into the shell profile (a V1 block that has one is rewritten). Phase 0 prints the resolved workspace and its source before anything is written, and refuses a workspace holding repository clones without the marker the script writes before its first clone. The published uv tool install command for onex had no --python pin, so uv picked Python 3.15 on a clean machine, where confluent-kafka (an omnimarket dependency) has no wheel and the build failed. Every published install line (both marketplace.json copies, the plugin manifests and compat files, the delegate and cloud_delegate skill docs, GETTING_STARTED, the status skill message and the CLI pin-check hook text) now pins --python 3.12, and a test fails when any published install line lacks the pin."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-workspace-is-omnibase-path-only"
    statement: "With OMNI_HOME set and OMNIBASE_PATH unset the workspace is the omnibase default; --workspace still wins; no profile line names OMNI_HOME."
    acceptance:
      - id: "AC1"
        statement: "AC1: uv run pytest tests/skills/test_lab_onboarding_script_omn20150.py -k 'legacy_variable or omnibase_path or workspace_flag'"
  - id: "req-foreign-workspace-refused"
    statement: "A workspace holding clones without the setup marker (or the V1 runtime config) is refused with a message naming the directory and --workspace, and is left untouched."
    acceptance:
      - id: "AC2"
        statement: "AC2: uv run pytest tests/skills/test_lab_onboarding_script_omn20150.py -k 'did_not_create or linked_worktree or this_setup_created or marker'"
  - id: "req-install-python-pin"
    statement: "Every published uv tool install and pipx install line for onex pins --python 3.12."
    acceptance:
      - id: "AC3"
        statement: "AC3: a test scans plugins/ and .claude-plugin/ for uv tool install and pipx install lines and fails when one lacks --python 3.12; it passes on this change and fails on the parent commit."
evidence_requirements:
  - kind: "tests"
    description: "Workspace resolution, profile block and foreign-workspace refusal of the onboarding script."
    command: "uv run pytest tests/skills/test_lab_onboarding_script_omn20150.py -q --no-cov"
  - kind: "tests"
    description: "AC3: the install-pin scan passes on the change; the delegate plugin tests, including the live-index install of the declared hint, pass."
    command: "uv run pytest plugins/onex-delegate/tests/ -q --no-cov -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
