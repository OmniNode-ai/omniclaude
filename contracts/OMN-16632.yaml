---
schema_version: "1.0.0"
ticket_id: "OMN-16632"
title: "Developer onboarding sets up in an OMNIBASE_PATH workspace, never OMNI_HOME, and refuses a workspace holding clones it did not create; the published onex install command pins Python so it installs on a clean machine; with neither OMNI_HOME nor ONEX_STATE_DIR set, the hooks resolve state to the per-user XDG state dir"
summary: "lab-onboarding.sh resolves its workspace from --workspace, then OMNIBASE_PATH, then $HOME/Code/omnibase; it never reads OMNI_HOME, unsets it so no child process inherits it, and writes no OMNI_HOME line into the shell profile (a V1 block that has one is rewritten). Phase 0 prints the resolved workspace and its source before anything is written, and refuses a workspace holding repository clones without the marker the script writes before its first clone. The published uv tool install command for onex had no --python pin, so uv picked Python 3.15 on a clean machine, where confluent-kafka (an omnimarket dependency) has no wheel and the build failed. Every published install line (both marketplace.json copies, the plugin manifests and compat files, the delegate and cloud_delegate skill docs, GETTING_STARTED, the status skill message and the CLI pin-check hook text) now pins --python 3.12, and a test fails when any published install line lacks the pin. With neither OMNI_HOME nor ONEX_STATE_DIR set, the hook state directory resolves to the per-user XDG state dir (${XDG_STATE_HOME:-$HOME/.local/state}/omniclaude) and pre_tool_use_bash_guards.sh no longer refuses every Bash call. Every guard that can act still acts; the worktree guard, which needs a registry root, says so once and allows only for that defaulted case. A hook with no python3 resolves one through uv or fails with one line naming python3."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-workspace-is-omnibase-path-only"
    statement: "With OMNI_HOME set and OMNIBASE_PATH unset the workspace is the omnibase default; --workspace still wins; no profile line names OMNI_HOME."
    acceptance:
      - id: "AC1"
        statement: "AC1: uv run pytest tests/skills/test_lab_onboarding_script_omn20150.py -k 'legacy_variable or omnibase_path or workspace_flag'"
  - id: "req-foreign-workspace-refused"
    statement: "A workspace holding clones without the setup marker (or the V1 runtime config) is refused with a message naming the directory and --workspace, and is left untouched."
    acceptance:
      - id: "AC2"
        statement: "AC2: uv run pytest tests/skills/test_lab_onboarding_script_omn20150.py -k 'did_not_create or linked_worktree or this_setup_created or marker'"
  - id: "req-install-python-pin"
    statement: "Every published uv tool install and pipx install line for onex pins --python 3.12."
    acceptance:
      - id: "AC3"
        statement: "AC3: a test scans plugins/ and .claude-plugin/ for uv tool install and pipx install lines and fails when one lacks --python 3.12; it passes on this change and fails on the parent commit."
  - id: "req-native-user-bash-not-refused"
    statement: "A fresh HOME with neither OMNI_HOME nor ONEX_STATE_DIR runs ls through the Bash guards entrypoint without a refusal, and the state directory is the XDG one."
    acceptance:
      - id: "AC4"
        statement: "AC4: uv run pytest tests/hooks/test_native_user_state_dir_omn16632.py -k ls_is_allowed_with_neither_variable"
  - id: "req-guards-still-act"
    statement: "A guarded dangerous command is still refused for that user, a relative OMNI_HOME or ONEX_STATE_DIR is still refused, and our own session with OMNI_HOME unset or set keeps the worktree guard's decision."
    acceptance:
      - id: "AC5"
        statement: "AC5: uv run pytest tests/hooks/test_native_user_state_dir_omn16632.py -k 'still_refused or keeps_the_worktree_guard or still_judges_the_worktree'"
  - id: "req-missing-python3-one-line"
    statement: "A hook that finds no python3 fails with one line naming python3."
    acceptance:
      - id: "AC6"
        statement: "AC6: uv run pytest tests/hooks/test_native_user_state_dir_omn16632.py -k missing_python3"
evidence_requirements:
  - kind: "tests"
    description: "Workspace resolution, profile block and foreign-workspace refusal of the onboarding script."
    command: "uv run pytest tests/skills/test_lab_onboarding_script_omn20150.py -q --no-cov"
  - kind: "tests"
