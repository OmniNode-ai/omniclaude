---
schema_version: "1.0.0"
ticket_id: OMN-21433
title: "T2.6 check-only hooks: the omniclaude hooks that rewrote files refuse instead and leave the working tree byte-identical"
summary: >
  Validators-to-core plan task T2.6, omniclaude slice (Appendix 1 rows
  omniclaude:267, 492, 934, 942, 950, 1060, 1443). ruff format and ruff check run
  without rewriting, the end-of-file hook checks, the AI co-author trailer is
  refused instead of stripped, a staged output/ file is refused instead of the
  directory being deleted, and the secrets-baseline and skill-node hooks run
  their check-only forms. The core rule that refuses a new writing hook is a
  separate lane in omnibase_core and is not built here.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-t26-check-only
    statement: The seven omniclaude hooks that rewrote files refuse a defect and leave every byte of the working tree as it was.
    acceptance:
      - id: T2.6-AC1
        statement: "T2.6-AC1: a canary unformatted Python file is refused by the ruff-format hook and the file is byte-identical after the hook run -- falsifier: uv run pytest tests/ci/test_precommit_check_only_hooks_omn21433.py -k ruff_format, asserting a non-zero exit and an unchanged sha256 of the scratch tree"
      - id: T2.6-AC2
        statement: "T2.6-AC2: a commit message carrying an AI Co-Authored-By trailer is refused by strip-ai-coauthor-trailer and the message file is byte-identical after the hook run -- falsifier: uv run pytest tests/ci/test_precommit_check_only_hooks_omn21433.py -k 'trailer', asserting a non-zero exit, an unchanged sha256, and a human trailer passing"
      - id: T2.6-AC3
        statement: "T2.6-AC3: ruff-fix, end-of-file-fixer and clean-output-directory refuse their canary defect (a lint defect, a file with no final newline or two, a staged output/ file) and leave the tree byte-identical -- falsifier: uv run pytest tests/ci/test_precommit_check_only_hooks_omn21433.py -k 'ruff_check or end_of_file or output', each with a clean-input positive control"
      - id: T2.6-AC4
        statement: "T2.6-AC4: detect-secrets-update and auto-generate-skill-nodes run their --check form, which refuses a stale baseline or a missing skill node and writes and stages nothing -- falsifier: uv run pytest tests/scripts/test_detect_secrets_guard.py tests/unit/scripts/test_auto_generate_skill_nodes.py -k check, plus the config tests that pin --check in both entries"
      - id: T2.6-AC5
        statement: "T2.6-AC5: no entry of the seven hooks spells a write (--fix, rm -rf, perl -i, sed -i, git add) -- falsifier: uv run pytest tests/ci/test_precommit_check_only_hooks_omn21433.py -k no_writing_spelling"
evidence_requirements:
  - kind: tests
    description: "Check-only hook tests pass"
    command: "uv run pytest tests/ci/test_precommit_check_only_hooks_omn21433.py tests/scripts/test_detect_secrets_guard.py tests/unit/scripts/test_auto_generate_skill_nodes.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-t26-ac1-ruff-format
    description: "The ruff-format entry, run on a canary unformatted file, exits non-zero and the scratch tree hashes the same afterwards. Fails at the merge base, whose entry is ruff format and rewrites the file."
    source: manual
    binds_ac: [T2.6-AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_precommit_check_only_hooks_omn21433.py -q --no-cov -k ruff_format"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-t26-ac2-trailer
    description: "The strip-ai-coauthor-trailer entry refuses a message with the AI trailer, names it on stderr, and the message file hashes the same afterwards. Fails at the merge base, whose perl -i entry deletes the line."
    source: manual
    binds_ac: [T2.6-AC2]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_precommit_check_only_hooks_omn21433.py -q --no-cov -k trailer"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-t26-ac3-other-hooks
    description: "ruff check, the end-of-file check and the output/ refusal each refuse their canary and leave the tree byte-identical, and accept a clean input. Fails at the merge base, where ruff-fix runs --fix, end-of-file-fixer is a third-party rewriter with no entry, and clean-output-directory runs rm -rf."
    source: manual
    binds_ac: [T2.6-AC3]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_precommit_check_only_hooks_omn21433.py -q --no-cov -k 'ruff_check or end_of_file or output'"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-t26-ac4-script-hooks
    description: "detect_secrets_guard --check refuses a stale baseline and a new unaudited finding without touching the file or the index; auto_generate_skill_nodes --check refuses a missing node without generating. Fails at the merge base, which has no --check mode."
    source: manual
    binds_ac: [T2.6-AC4]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/scripts/test_detect_secrets_guard.py tests/unit/scripts/test_auto_generate_skill_nodes.py tests/ci/test_precommit_check_only_hooks_omn21433.py -q --no-cov -k 'check'"
        cwd: "${OMNI_HOME}/omniclaude"
  - id: dod-t26-ac5-no-writing-spelling
    description: "None of the seven entries contains --fix, rm -rf, perl -i, sed -i or git add, and ruff-format carries --check. Fails at the merge base on five of the seven."
    source: manual
    binds_ac: [T2.6-AC5]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_precommit_check_only_hooks_omn21433.py -q --no-cov -k no_writing_spelling"
        cwd: "${OMNI_HOME}/omniclaude"
