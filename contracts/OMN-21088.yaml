---
schema_version: "1.0.0"
ticket_id: OMN-21088
title: "onex-delegate skill runs onex delegate --result-only (Lane C)"
summary: >
  The onex-delegate plugin's prompt.md and SKILL.md run one plain
  `onex delegate "<prompt>" --result-only` command, show stdout as the answer,
  report the one error line on failure, and read receipt.json only on demand.
  A clean-install test asserts `onex delegate --help` lists --result-only. The
  plugin-compat.yaml floors are unchanged here; a follow-up raises them to the
  omnibase-infra and omnimarket releases of Lanes A and B.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: tests
    description: "Skill surface tests for the --result-only command pass"
    command: "uv run pytest plugins/onex-delegate/tests -q -m 'not integration'"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-skill-runs-result-only
    description: "prompt.md carries exactly one plain onex delegate --result-only command, with no --json, redirect, pipe or &&"
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest plugins/onex-delegate/tests/test_delegate_result_only_surface.py -q"
  - id: dod-skill-no-json-presentation
    description: "The skill no longer tells the agent to parse the typed JSON result"
    source: manual
    checks:
      - check_type: command
        check_value: "! grep -q 'Parse the single JSON object' plugins/onex-delegate/skills/delegate/prompt.md"
  - id: dod-install-test-asserts-flag
    description: "The clean-install test asserts onex delegate --help lists --result-only"
    source: manual
    checks:
      - check_type: command
        check_value: "grep -q '_RESULT_ONLY_FLAG in run.stdout' plugins/onex-delegate/tests/test_install_works.py"
