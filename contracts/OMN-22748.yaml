title: "The sibling-pin train calls omnimarket's hook revs node, so its core pin is held below the core hook floor and its bump PR is not red on arrival"
summary: >
  The nightly sibling-pin train moved the omnibase-core pin to core's newest green dev merge tag and left the core hooks
  of .pre-commit-config.yaml behind it. The core hook floor needs every core hook rev at or past the locked core tag,
  and first_party_ref_two_homes forbids one tag literal in both files, so the hooks must be strictly newer than the pin.
  The train PR at head f1d12f52d failed Tests splits 1/5 and 4/5, the shadow tests split 2/2, Tests Gate, CI Summary and
  reason-graph. The train now reads each pin's newer dev tags with their dev CI verdicts, asks omnimarket's
  node_sibling_pin_hook_revs_compute for the plan, moves the pin to the plan's pin tag and the planned hook blocks to
  its hook tag, and the sibling-lock-refresh workflow commits the config with the pin. The script does not grow.
