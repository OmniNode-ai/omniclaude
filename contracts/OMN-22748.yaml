      - id: "AC6"
        statement: "AC6: a test fails on the unfixed train, which moves core to the newest green tag, and passes with the call site -- falsifier: uv run pytest tests/scripts/test_dev_tag_train_omn19998.py -k plan_names -q --no-cov on origin/dev (red) and on the branch (green)"
      - id: "AC7"
        statement: "AC7: scripts/relock_git_sources.py holds at or under its baselined code-line count -- falsifier: the canonical-file-shape check on the branch against origin/dev passes"
