    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/nodes/node_claude_code_hook_adapter_effect/test_adapter.py tests/nodes/node_claude_code_hook_adapter_effect/test_compaction_hook_input_omn21099.py -k 'ac1 or recorded or entry_prints' -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]

