title: "Mac launchd KeepAlive worktree reaper daemon"
summary: >-
  Adds the Mac launchd KeepAlive worktree reaper daemon. The daemon reads the
  merged-PR projection over HTTP, keeps its cursor under .onex_state, defaults
  to dry-run, and delegates deletion safety to the canonical prune-worktrees.sh
  script. Packaging includes the launchd plist, shell launcher, install/status
  helper, and unit tests with mocked projection responses. The PR is code-only;
  live loading is an explicit deploy/orchestrator step.
