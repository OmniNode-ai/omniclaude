schema_version: "1.0.0"
ticket_id: "OMN-21943"
title: "The nine src/omniclaude/trace modules move to src/omniclaude/models/trace and src/omniclaude/handlers/trace"
summary: "A canonical-file-shape burn-down slice: change_frame, db_schema, failure_signature, fix_transition, intelligence_integration and pr_envelope move to src/omniclaude/models/trace; frame_assembler and replay_engine move to src/omniclaude/handlers/trace; the src/omniclaude/trace package is removed. Importers are updated, and exactly the nine src/omniclaude/trace lines leave the canonical-file-shape baseline. The hosted source readback checks publication of the relocated runtime handlers; it does not assert installation in a running service."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-trace-models-moved"
    statement: "The six model modules live under models/trace, the runtime modules live under handlers/trace, and the trace tests pass against the new import paths."
    acceptance:
      - id: "AC1"
        statement: "AC1: the trace unit tests import and pass against models/trace and handlers/trace -- falsifier: the named trace test files fail with ImportError if any moved module or re-export is missing"
  - id: "req-old-paths-gone"
    statement: "The old src/omniclaude/trace package no longer exists."
    acceptance:
      - id: "AC2"
        statement: "AC2: src/omniclaude/trace no longer exists -- falsifier: the absence check fails if the old package or any of its files remains"
evidence_requirements:
  - kind: "tests"
    description: "The trace unit tests."
    command: "uv run pytest tests/unit/trace/test_models.py tests/unit/trace/test_db_schema.py tests/unit/trace/test_failure_signature.py tests/unit/trace/test_fix_transition.py tests/unit/trace/test_intelligence_integration.py tests/unit/trace/test_pr_envelope.py tests/unit/trace/test_frame_assembler.py tests/unit/trace/test_replay_engine.py tests/unit/trace/test_trace_cli.py -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21943-trace-models-moved"
    description: "AC1: the named trace unit tests pass against the models/trace and handlers/trace import paths."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/trace/test_models.py tests/unit/trace/test_db_schema.py tests/unit/trace/test_failure_signature.py tests/unit/trace/test_fix_transition.py tests/unit/trace/test_intelligence_integration.py tests/unit/trace/test_pr_envelope.py tests/unit/trace/test_frame_assembler.py tests/unit/trace/test_replay_engine.py tests/unit/trace/test_trace_cli.py -q -p no:randomly --no-cov"
    binds_ac: ["AC1"]
  - id: "dod-omn21943-old-paths-gone"
    description: "AC2: the old trace package and all nine migrated paths are absent."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "test ! -e src/omniclaude/trace"
    binds_ac: ["AC2"]
  - id: "dod-omn21943-hosted-source-deploy-readback"
    description: "Hosted-runner source publication readback: fetch both relocated runtime handlers from GitHub at the checkout commit and require byte-for-byte equality with the checked-out modules. Missing or stale published source fails. This checks the source artifact, not installation in a running service."
    source: "manual"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "command"
        check_value: >-
          curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omniclaude/$(git rev-parse HEAD)/src/omniclaude/handlers/trace/frame_assembler.py" | cmp - src/omniclaude/handlers/trace/frame_assembler.py
      - check_type: "command"
        check_value: >-
          curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omniclaude/$(git rev-parse HEAD)/src/omniclaude/handlers/trace/replay_engine.py" | cmp - src/omniclaude/handlers/trace/replay_engine.py
