schema_version: "1.0.0"
ticket_id: OMN-20685
title: "Route Git admission through the existing Git effect node"
summary: >
  Step 2 of 2: the shared-tree, dirty-restore and lane-fetch admission checks,
  relocated into node_git_effect by omniclaude#2595, become the admission_check
  operation of the node, bound in its contract and dispatched through the
  contract-declared in-memory runtime on the hook host. The binding flips the
  node to canonical handler shape with an adequacy receipt and a hand-flip
  proof whose base_ref is the #2595 merge commit.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: tests
    description: "Git admission parity and runtime tests pass"
    command: "uv run pytest tests/hooks/test_git_admission_parity.py tests/hooks/test_git_admission_runtime.py -q"
emergency_bypass:
