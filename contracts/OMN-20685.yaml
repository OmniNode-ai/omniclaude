schema_version: "1.0.0"
ticket_id: OMN-20685
title: "Route Git admission through the existing Git effect node"
summary: >
  Step 2 of 2: the shared-tree, dirty-restore and lane-fetch admission checks,
  relocated into node_git_effect by omniclaude#2595, become the admission_check
  operation of the node, bound in its contract and dispatched through the
  contract-declared in-memory runtime on the hook host. The binding flips the
  node to canonical handler shape with an adequacy receipt and a hand-flip
  proof whose base_ref is the #2595 merge commit.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: tests
    description: "Git admission parity and runtime tests pass"
    command: "uv run pytest tests/hooks/test_git_admission_parity.py tests/hooks/test_git_admission_runtime.py -q"
  - kind: tests
    description: "The hook refusal recorder decides every recorded refusal's row through omnimarket's node_hook_refusal_row_compute and matches the recorded rows"
    command: "uv run pytest tests/hooks/test_refusal_rows_omn18946.py -q"
  - kind: tests
    description: "node_hook_refusal_record_effect records the same rows, rate-limit state, extracted details and lanes as the standalone recorder it replaced"
    command: "uv run pytest tests/hooks/test_hook_refusal_effect_parity.py tests/hooks/test_refusal_recorder_state_omn20265.py tests/hooks/test_refusal_row_lane_omn19381.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-git-admission-parity
    description: "Typed admission handler and runtime-routed hook entry point return the pre-relocation guard's recorded verdict for every corpus case"
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_git_admission_parity.py -q"
  - id: dod-git-admission-runtime
    description: "Admission check runs through the contract-routed runtime and the hook refuses a failed dispatch"
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_git_admission_runtime.py -q"
  - id: dod-hook-refusal-row-parity
    description: "The repointed hook refusal recorder yields the pre-repoint recorder's row and dedupe key for every recorded refusal"
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_refusal_rows_omn18946.py -q"
  - id: dod-hook-refusal-effect-parity
    description: "The node's handler replays the recorded scenarios of the old recorder and lane resolver with identical exit codes, rows, state and lanes"
    source: manual
    checks:
      - check_type: command
        check_value: "uv run pytest tests/hooks/test_hook_refusal_effect_parity.py -q"
