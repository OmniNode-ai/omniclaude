---
schema_version: "1.0.0"
ticket_id: OMN-21087
title: "Onboarding handles a Mac that ran an earlier setup"
summary: >
  lab-onboarding.sh on a machine that ran an earlier setup. Every run unsets
  inherited OMNI*/ONEX_*/KAFKA_*/BIFROST_* variables and binds the onboarding
  workspace before phase 0, so a resumed run is clean too. Phase 2 brings clean
  clones to origin (omnibase_infra first) and stops once, naming every clone that
  holds work, how far behind it is and the command that moves it aside. The
  workspace config root is a git repository the runtime-config materialiser
  reads. Phase 3 skips a venv rebuild the reconciler reports current, and a failed
  model test prints the error that caused it. Preflight then runs the existing
  install as the developer's shell does, reports what an earlier setup left (an
  onex alias or function, onex installs on PATH, uv or pipx tool installs, old
  variables in the profile, a local-model routes file, clones holding work) in
  one table, and asks once, before anything installs, to set those aside
  (commented out or moved, never deleted) or stop. A resumed run says where it
  picks up and reuses its answers.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21087-clones
    statement: Phase 2 brings every clean clone to origin and stops, naming each clone that holds work, before any clone moves.
    acceptance:
      - id: AC1
        statement: 'AC1: a clean clone that is behind or detached is brought to origin (omnibase_infra first, so a checkout older than the pins file is updated rather than reported as missing it); a clone with tracked changes or commits origin lacks is named with its state, its distance behind origin and the command that moves it aside, and no clone moves; a non-clone directory at a repo path is moved aside, never deleted; falsifier: uv run pytest tests/skills/test_lab_onboarding_proven_set_omn20381.py -k "dirty_clone or detached_unpinned or one_stop or not_a_clone or missing_pins" fails against the dev script.'
  - id: req-omn21087-run-environment
    statement: No leftover variable reaches the run, and every run, resumed or not, is bound to the onboarding workspace.
    acceptance:
      - id: AC2
        statement: 'AC2: the run and its children inherit none of OMNI_HOME, OMNIBASE_INTERNAL_PATH, ONEX_EVENT_BUS_TYPE, ONEX_LAB_TENANT_STATE_DIR, ONEX_STATE_DIR, ONEX_DISPATCH_VENV, ONEX_CONTRACTS_DIR or KAFKA_BOOTSTRAP_SERVERS, and a resumed run that skips phase 2 runs phase 3 with OMNIBASE_PATH and ONEX_WORKSPACE_CONFIG_ROOT naming the onboarding workspace; falsifier: uv run pytest tests/skills/test_onboarding_returning_machine_omn21087.py -k "leftover_variable or binds_the_workspace" fails against the dev script.'
  - id: req-omn21087-phase3
    statement: Phase 3 does not rebuild a current dispatch venv, and a failed model test prints its cause.
    acceptance:
      - id: AC3
        statement: 'AC3: phase 3 checks the dispatch venv with the reconciler''s --check before rebuilding it, and a failed model test whose summary is an exit status prints the Error line that caused it; falsifier: uv run pytest tests/skills/test_onboarding_returning_machine_omn21087.py -k "failed_model_test or checks_the_venv" fails against the dev script.'
  - id: req-omn21087-runtime-config-repo
    statement: The workspace runtime config is readable by onex's materialiser without a warning.
    acceptance:
      - id: AC4
        statement: 'AC4: phase 2 makes the workspace config root a git repository whose origin/main carries config/onex/runtime/runtime_config.yaml, idempotently, and phase2_verified requires it; falsifier: uv run pytest tests/skills/test_lab_onboarding_proven_set_omn20381.py -k materialiser fails against the dev script.'
  - id: req-omn21087-preflight-survey
    statement: Preflight reports what an earlier setup left, as the developer's shell runs it, before anything installs.
    acceptance:
      - id: AC5
        statement: 'AC5: preflight runs onex in a new interactive shell of the developer''s kind and reports an alias or function, its --version output, onex installs on PATH, profile lines setting old variables or an onex alias or function, and a local-model routes file this setup did not write, in one table, changing nothing; phase 6 checks a new terminal runs the workspace onex; falsifier: uv run pytest tests/skills/test_onboarding_returning_machine_omn21087.py -k "preflight_reports or developers_shell or new_terminal" fails against the part-1 script.'
  - id: req-omn21087-set-aside
    statement: The developer is asked once to set the leftovers aside or stop, and setting aside never deletes.
    acceptance:
      - id: AC6
        statement: 'AC6: when something interferes the run asks once before installing; q stops with nothing changed; with no terminal it stops unless --set-aside is passed; setting aside comments out profile lines behind a no-op marker (a multi-line onex function whole, by brace depth, after copying the file), parses every edited profile with its shell before any file changes and changes nothing when one would not parse, stops before asking when an onex alias or function is defined in a file it does not read, moves files and clones beside where they were, and lists each item with how to restore it; falsifier: uv run pytest tests/skills/test_onboarding_returning_machine_omn21087.py -k "no_terminal or q_at or setting_aside or clone_holding or parseable or would_break or does_not_read" fails against the part-1 script.'
  - id: req-omn21087-resume
    statement: A resumed run says where it picks up and reuses its answers.
    acceptance:
      - id: AC7
        statement: 'AC7: a resumed run names the completed phases and the phase it picks up at (or that every phase passed and is only checked) and reuses the last run''s Docker answer, and --restart ignores the last run''s answers; falsifier: uv run pytest tests/skills/test_onboarding_returning_machine_omn21087.py -k "picks_up or only_checks" fails against the part-1 script.'
evidence_requirements:
  - kind: tests
    description: "Onboarding script tests pass"
    command: "uv run pytest tests/skills/test_lab_onboarding_script_omn20150.py tests/skills/test_lab_onboarding_proven_set_omn20381.py tests/skills/test_onboarding_returning_machine_omn21087.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21087-clones
    description: "Phase 2 brings clean clones to origin and names every clone holding work before any moves"
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_lab_onboarding_proven_set_omn20381.py -q --no-cov -k 'dirty_clone or detached_unpinned or one_stop or not_a_clone or missing_pins'"
  - id: dod-omn21087-run-environment
    description: "No leftover variable reaches the run; a resumed run is bound to the onboarding workspace"
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_onboarding_returning_machine_omn21087.py -q --no-cov -k 'leftover_variable or binds_the_workspace'"
  - id: dod-omn21087-phase3
    description: "Phase 3 checks the venv before rebuilding it; a failed model test prints its cause"
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_onboarding_returning_machine_omn21087.py -q --no-cov -k 'failed_model_test or checks_the_venv'"
  - id: dod-omn21087-runtime-config-repo
    description: "The workspace config root is a repository the materialiser reads"
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_lab_onboarding_proven_set_omn20381.py -q --no-cov -k materialiser"
  - id: dod-omn21087-preflight-survey
    description: "Preflight reports what an earlier setup left, as the developer's shell runs it"
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_onboarding_returning_machine_omn21087.py -q --no-cov -k 'preflight_reports or developers_shell or new_terminal'"
  - id: dod-omn21087-set-aside
    description: "Asked once; set aside never deletes; no terminal stops without --set-aside"
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_onboarding_returning_machine_omn21087.py -q --no-cov -k 'no_terminal or q_at or setting_aside or clone_holding or parseable or would_break or does_not_read'"
  - id: dod-omn21087-resume
    description: "A resumed run says where it picks up and reuses its answers"
    source: manual
    binds_ac: [AC7]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/skills/test_onboarding_returning_machine_omn21087.py -q --no-cov -k 'picks_up or only_checks'"
  - id: dod-omn21087-deploy-bootstrap
    description: The published bootstrap handler at the checked-out commit matches the checksum required by the entrypoint; the hosted runner needs only HTTPS and git.
    source: manual
    binds_ac: [AC5, AC6, AC7]
    checks:
      - check_type: command
        check_value: >-
          curl --fail --silent --show-error "https://raw.githubusercontent.com/OmniNode-ai/omniclaude/$(git rev-parse HEAD)/src/omniclaude/nodes/node_skill_omninode_dev_setup_orchestrator/handler_onboarding_preflight.sh"
          | sha256sum | grep -q '^ce2b2452f52ca37f1824a319563b113d8fa355a238fd561a204c78542c6c90f7  -$'
  - id: dod-omn21087-bootstrap-loading
    description: The entrypoint uses the node's declared handler, works without Python, and refuses a downloaded handler whose checksum differs before sourcing it.
    source: manual
    binds_ac: [AC5, AC6, AC7]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/skills/test_onboarding_bootstrap_handler_omn21087.py -q --no-cov
