---
schema_version: "1.0.0"
ticket_id: OMN-21087
title: "Onboarding handles a Mac that ran an earlier setup"
summary: >
  lab-onboarding.sh on a machine that ran an earlier setup. Every run unsets
  inherited OMNI*/ONEX_*/KAFKA_*/BIFROST_* variables and binds the onboarding
  workspace before phase 0, so a resumed run is clean too. Phase 2 brings clean
  clones to origin (omnibase_infra first) and stops once, naming every clone that
  holds work, how far behind it is and the command that moves it aside. The
  workspace config root is a git repository the runtime-config materialiser
  reads. Phase 3 skips a venv rebuild the reconciler reports current, and a failed
  model test prints the error that caused it. Preflight then runs the existing
  install as the developer's shell does, reports what an earlier setup left (an
  onex alias or function, onex installs on PATH, uv or pipx tool installs, old
  variables in the profile, a local-model routes file, clones holding work) in
  one table, and asks once, before anything installs, to set those aside
  (commented out or moved, never deleted) or stop. A resumed run says where it
  picks up and reuses its answers.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21087-fast-forward
    statement: Phase 2 fast-forwards a clean clone on its branch to origin instead of only fetching it.
    acceptance:
      - id: AC1
        statement: 'AC1: For an existing clone on its tracked branch with no local changes: fast-forward it to origin, not just fetch.'
  - id: req-omn21087-stop-named
    statement: A clone phase 2 cannot bring current stops the run, named with its state, its distance behind origin and the command that fixes it.
    acceptance:
      - id: AC2
        statement: 'AC2: For a clone that is dirty or cannot fast-forward (a clean detached clone is returned to its branch instead; a dirty detached clone stops): stop with a message that names that clone, its state and how far behind it is, and the exact command to fix it.'
  - id: req-omn21087-behind-not-missing
    statement: An old clone lacking a file origin has is reported as behind origin, never as a file to restore.
    acceptance:
      - id: AC3
        statement: 'AC3: A missing file in an old clone should be reported as "clone is N commits behind", not "restore the pins file".'
  - id: req-omn21087-resume-at-failure
    statement: A resumed run, from any copy of the script, picks up at the failed phase or says why a passed phase runs again.
    acceptance:
      - id: AC4
        statement: 'AC4: Resume after a phase failure should pick up at the failed phase, including after a fresh download of the script, or say clearly why it starts over.'
evidence_requirements:
  - kind: tests
    description: "Onboarding script tests pass"
    command: "uv run pytest tests/skills/test_lab_onboarding_script_omn20150.py tests/skills/test_lab_onboarding_proven_set_omn20381.py tests/skills/test_onboarding_returning_machine_omn21087.py -q --no-cov"
  - kind: tests
    description: "Clone currency and resume tests for the amended criteria pass"
    command: "uv run pytest tests/skills/test_onboarding_clone_currency_omn21087.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
