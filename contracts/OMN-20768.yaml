schema_version: "1.0.0"
ticket_id: OMN-20768
title: "CI Summary's default-deny sweep subtracts every attempt's own jobs on a re-run"
summary: >
  On a re-run attempt CI Summary polled before the attempt held rows for its
  push-only deploy jobs. The L5 default-deny sweep subtracted only the current
  attempt's job names, so the earlier attempt's skipped Deploy to Staging and
  Deploy to Production check-runs read as unregistered external reds and the
  umbrella failed. The sweep now subtracts the job names of every attempt of
  the run; the in-run layer still judges only the current attempt's rows.
is_seam_ticket: false
interface_change: false
