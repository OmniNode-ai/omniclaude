schema_version: 1.0.0
ticket_id: OMN-23576
title: Remove retired repository names from the coding assistant repository's live lists
summary: The host reconcile unit depends on repository lists that omit retired targets. The initial cleanup removed 15 findings across ten files. This follow-up removes the retired shared-structure package from the remaining repository lists, plugin guidance and dependency-provenance governance.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23576-no-retired-live-entries
  statement: No live list, sync script or source constant in omniclaude names a retired repository, and each list keeps its other repositories.
  acceptance:
  - id: AC1
    statement: 'AC1: the retirement scan returns no finding for a workspace holding this repository''s change -- falsifier: run retired_repository_findings from node_host_reconcile_effect over the repository root at the base commit and see 15 findings, then at the change head and see none'
  - id: AC2
    statement: 'AC2: the lists that name retired repositories keep every other repository -- falsifier: pytest tests/unit/handlers/test_handler_internal_sibling_pins_omn21282.py tests/unit/hooks/test_self_healing_orchestrator.py tests/unit/hooks/test_pre_tool_use_workflow_guard.py tests/skills/coverage_sweep/test_coverage_scanner.py -q'
  - id: AC3
    statement: 'AC3: integrated: after the change is installed on the lab computer that runs the hourly job through the host installer, the unit onex-host-reconcile reports no retired-repository-targets finding naming this repository on its next run -- falsifier: the unit''s out log for that run still contains a retired-repository-targets line naming a path under the omniclaude checkout'
evidence_requirements:
- kind: tests
  description: The focused guard test, which reads the ten files and fails on each at the merge base, plus the existing unit tests of the changed modules.
  command: uv run --frozen pytest tests/ci/test_retired_repository_targets_omn23576.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23576-lists-clean
  description: Each of the ten files names no retired repository on a non-comment line and still names omnibase_core. Against the merge-base files the first ten cases fail, so the selection fails there. The scan reading the base found 15 findings and the change head none; that run, and the unit's next run on the lab computer, are recorded in the pull request's Lab line.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_retired_repository_targets_omn23576.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23576-integration-proof-lab
  description: Runs the guard test and the changed modules' unit tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omniclaude --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23576 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/ci/test_retired_repository_targets_omn23576.py tests/unit/handlers/test_handler_internal_sibling_pins_omn21282.py tests/unit/hooks/test_self_healing_orchestrator.py -q --no-cov'
    cwd: .
- id: dod-omn23576-retirement-ac1
  description: AC1 checks the head for references in maintained files. The published lock, existing absence guards and closed historical evidence have separate verification.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: |-
      status=0
      git grep -nIE 'omnibase[_-]compat' HEAD -- \
        ':!uv.lock' ':!contracts/OMN-12245.yaml' ':!contracts/OMN-13828.yaml' \
        ':!contracts/OMN-14190.yaml' ':!tests/ci/test_retired_repository_targets_omn23576.py' \
        ':!tests/hooks/test_hostile_reviewer_workflow.py' || status=$?
      test "$status" -eq 1
    cwd: .
- id: dod-omn23576-retirement-ac2
  description: AC2 exercises the maintained-list checks, queue roster, dispatch guard, dependency-provenance gate, quality gate and runner-address workflow scope.
  source: manual
  checks:
  - check_type: test_passes
    check_value: >-
      uv run --frozen pytest
      tests/ci/test_retired_repository_targets_omn23576.py
      tests/unit/skills/bin/test_armed_not_enqueued.py
      tests/unit/hooks/test_pre_tool_use_dispatch_mode_guardrail.py
      tests/scripts/test_check_dep_provenance.py
      tests/scripts/test_check_dep_provenance_dev_tag_omn19998.py
      tests/scripts/test_check_dep_provenance_infra_omn17176.py
      tests/hooks/test_hook_quality_gate.py
      tests/workflows/test_ban_hardcoded_runner_ip_scope.py
      -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23576-retirement-ac3
  description: AC3 allows a clean lock or the identical lock still carrying the published omnibase-infra 0.38.76 dependency. Regeneration waits for the fixed release.
  source: manual
  checks:
  - check_type: command
    check_value: |-
      status=0
      git grep -cIE 'omnibase[_-]compat' HEAD -- uv.lock || status=$?
      case "$status" in
        0) test "$(git rev-parse --verify HEAD:uv.lock)" = "1da0bfd97a6bd7156cac0564adf96c04973cc782" ;;
        1) exit 0 ;;
        *) exit "$status" ;;
      esac
    cwd: .
- id: dod-omn23576-retirement-ac4
  description: AC4 exercises the CI Summary contract for complete, missing and skipped required contexts. The exact-head watcher verdict and landing handoff are recorded after publication.
  source: manual
  checks:
  - check_type: test_passes
    check_value: >-
      uv run --frozen pytest tests/ci/test_ci_summary_gate.py -q --no-cov -p no:randomly
      -k 'test_all_present_and_success_is_success or test_absent_expected_context_is_pending_not_success or test_skipped_expected_context_fails_closed'
    cwd: .
