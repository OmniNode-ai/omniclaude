schema_version: 1.0.0
ticket_id: OMN-23576
title: Remove retired repository names from the coding assistant repository's live lists
summary: The host reconcile unit refuses to run while a registry list, sync script or source constant names a retired repository. Ten files in omniclaude held such a name as a live entry (15 findings from the retirement scan). Each entry for onex_change_control and omnibase_compat is removed from those lists; every other repository stays, and comments, history and ticket records are untouched.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23576-no-retired-live-entries
  statement: No live list, sync script or source constant in omniclaude names a retired repository, and each list keeps its other repositories.
  acceptance:
  - id: AC1
    statement: 'AC1: the retirement scan returns no finding for a workspace holding this repository''s change -- falsifier: run retired_repository_findings from node_host_reconcile_effect over the repository root at the base commit and see 15 findings, then at the change head and see none'
  - id: AC2
    statement: 'AC2: the lists that name retired repositories keep every other repository -- falsifier: pytest tests/unit/handlers/test_handler_internal_sibling_pins_omn21282.py tests/unit/hooks/test_self_healing_orchestrator.py tests/unit/hooks/test_pre_tool_use_workflow_guard.py tests/skills/coverage_sweep/test_coverage_scanner.py -q'
  - id: AC3
    statement: 'AC3: integrated: after the change is installed on the lab computer that runs the hourly job through the host installer, the unit onex-host-reconcile reports no retired-repository-targets finding naming this repository on its next run -- falsifier: the unit''s out log for that run still contains a retired-repository-targets line naming a path under the omniclaude checkout'
evidence_requirements:
- kind: tests
  description: The focused guard test, which reads the ten files and fails on each at the merge base, plus the existing unit tests of the changed modules.
  command: uv run --frozen pytest tests/ci/test_retired_repository_targets_omn23576.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23576-lists-clean
  description: Each of the ten files names no retired repository on a non-comment line and still names omnibase_core. Against the merge-base files the first ten cases fail, so the selection fails there. The scan reading the base found 15 findings and the change head none; that run, and the unit's next run on the lab computer, are recorded in the pull request's Lab line.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_retired_repository_targets_omn23576.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23576-integration-proof-lab
  description: Runs the guard test and the changed modules' unit tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omniclaude --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23576 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/ci/test_retired_repository_targets_omn23576.py tests/unit/handlers/test_handler_internal_sibling_pins_omn21282.py tests/unit/hooks/test_self_healing_orchestrator.py -q --no-cov'
    cwd: .
