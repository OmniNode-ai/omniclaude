    description: Git effect timeout policy, handler and ruling re-read regressions
    command: "uv run pytest tests/unit/nodes/node_git_effect tests/hooks/test_ledger_ruling_reread.py tests/hooks/test_git_admission_runtime.py -q --no-cov"
