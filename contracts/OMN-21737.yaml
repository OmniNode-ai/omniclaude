schema_version: "1.0.0"
ticket_id: OMN-21737
title: "Contracts and DI burn-down: git effect subprocess deadlines"
summary: >-
  This omniclaude literal_timeout slice moves every hard-coded deadline of the
  git effect node (twelve per-operation subprocess timeouts, the git and gh
  binary probe timeout and the admission runtime timeout) into the node
  contract's error_handling.timeouts block, overlaid by
  OMNICLAUDE_GIT_TIMEOUT_<OPERATION>, and injects them as a validated
  ModelGitTimeoutPolicy. The contracts_and_di literal_timeout count over
  src/omniclaude/nodes/node_git_effect falls from 3 to 0 and over
  src/omniclaude from 125 to 122; no other rule's count changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21737-git-timeouts
    statement: The git effect subprocess backend reads every deadline from its node contract or the operator overlay through an injected policy.
    acceptance:
      - id: AC1
        statement: "AC1: the contracts_and_di count for literal_timeout over the slice paths drops to zero and the repo total drops by the slice size, with no baseline entry or suppression added -- falsifier: onex run of runtime_validator_run with the contracts_and_di reference over omniclaude src before and after, counts compared per rule"
      - id: AC2
        statement: "AC2: every moved timeout is taken through an injected parameter bound from the node contract or overlay and none remains hard-coded in the touched code -- falsifier: uv run pytest tests/unit -q over the touched modules plus the checker re-run on the slice paths"
      - id: AC3
        statement: "AC3: the slice lands as one PR titled with this ticket id and carries lab proof of the tests and the checker re-run -- falsifier: uv run pytest tests/unit -q on the lab through lab-run at the PR head, receipt path in the PR body"
