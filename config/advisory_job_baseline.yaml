#
# Census baseline for the no-new-advisory-job gate. OMN-18777, epic OMN-18775.
#
# WHAT THIS IS. Every line below already existed when the gate landed. It is a
# GRANDFATHER LIST, named line by line, and it is deliberately not a date
# cutoff: a cutoff waves through anything an author can date, and a file-level
# allowlist waves through the next setting added to a file that already has
# one. AC4 of OMN-18777 is that each grandfathered line is individually named,
# and tests/scripts/test_advisory_job_gate.py asserts the shape of every entry
# as well as the per-repo counts.
#
# HOW TO USE IT. Do not add to it. A NEW advisory setting is annotated on its
# own line -- "# advisory-ok: OMN-nnnnn <reason>" -- which leaves a citable
# artifact the way the raw-prod-bypass annotation already does for a prod
# mutation. A NEW verification job is enforced, or annotated if it is
# genuinely notification or automation. This list only ever SHRINKS; the gate
# prints a reconcile line when an entry has gone and does not fail on it,
# because refusing the removal of an advisory setting would make the gate
# punish the only fix it wants.
#
# HOW IT WAS BUILT. scripts/advisory_job_gate.py --write-baseline, run against
# each repository .github/workflows tree at origin/dev on 2026-09-19, with the
# enforcement surface resolved live. The advisory counts it produced --
# 5, 28, 9, 4, 11, 7 -- reproduce the OMN-18775 census exactly and
# independently, which is the positive control on the scanner.
#
# advisory           one setting that swallows a job or a step failure.
# verification_jobs  one pull-request-reachable verification-shaped job in
#                    neither required_status_checks nor the repo
#                    EXPECTED_EXTERNAL_CONTEXTS umbrella constant. The named
#                    findings of the OMN-18775 inventory are all here and can
#                    be read off it: the runner-routing audit, seed-provenance
#                    and fresh-deploy-fitness under omnibase_infra.
# recorded_contexts  a dated SNAPSHOT of the enforcement surface, for the
#                    self-test and for reading. THE GATE NEVER READS IT as an
#                    enforcement source -- that surface is resolved live on
#                    every run, because a committed list of what is enforced
#                    is exactly the asserted verdict this epic is about.
