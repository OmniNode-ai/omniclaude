# Operator rulings that let a private repository run CI jobs on GitHub-hosted
# runners (OMN-19998). Read by scripts/private_repo_runner_placement_gate.py at
# the gate's own pinned SHA. A private repository lists its eligible jobs in
# .github/hosted-eligible-jobs.yaml, each citing one ruling below by its ledger
# timestamp; the gate accepts a listed job only when the cited ruling is here,
# names that repository, covers every hosted label's image family, and (where
# the gate can read a ledger) is a RULING row on the ledger.
#
# EMPTY since 2026-10-19 (OMN-17427). The operator's words, after GitHub
# reported 90 percent of the included Enterprise Actions minutes used: "make it
# impossible to run private repos actions on github". That reverses RULING
# 2026-10-16T17:44:31Z (lane orchestrator-bb1a, OMN-19998), the one entry this
# registry carried, so every hosted-eligible declaration is now refused.
# tests/scripts/test_private_repo_runner_placement_gate.py pins it empty.
#
# repos_sha256 holds the sha256 of each lowercased `owner/name` the ruling
# names, never the name: this repository is public and its hygiene gate
# refuses a private repository's name in the tree.
