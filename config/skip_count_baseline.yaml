# OMN-18790 — per-suite skip-count baseline for omniclaude (mechanism OMN-18776,
# epic OMN-18775).
#
# Each entry records what a suite is ALLOWED to leave unexecuted, and how that
# number was measured. An entry with no provenance is refused by the gate: a
# baseline with no recorded measurement is a claim, not a measurement.
#
# Lowering a number here is the ONLY way to lower the bar. There is no flag and
# no environment variable on scripts/ci/skip_count_ratchet.py that does it, and
# tests/ci/test_skip_count_ratchet_omn18790.py reads the parser's own option
# strings to keep it that way.
#
# mode: count    — the collected set is identical every run; compare the number.
# mode: nodeids  — an impacted-test selector varies the collected set, so compare
#                  identities instead. A selector only ever narrows, so a narrowed
#                  run's skip set is a subset of a full-width baseline.
#
# The mode is chosen by MEASUREMENT, not by preference. "Hooks System Tests"
# runs pytest over tests/hooks/ with nothing in front of it and measured
# 36/36/36 across three consecutive runs, so its number is comparable. The split
# matrix sits behind the impacted-test selector (vars.ENABLE_SMART_TESTS reads
# true on this repository live) and measured 6 skips over 6015 collected on a
# narrowed run against 43 over 14793 on a full-width one, so only identities are
# comparable there.
#
# REGISTERED SINCE OMN-18805: "Agent Framework Tests". OMN-18790 left that job
# out on the grounds that it looked for three test files that did not exist,
# wrote a synthetic empty JUnit report, and reported success on every run
# without executing a test — so a baseline of zero would have been satisfied by
# its own placeholder report forever. OMN-18805 established from git log that
# one of the three, tests/test_enhanced_router.py, was real coverage of code
# that is still on dev, restored it, and deleted the synthetic branch. The other
# two were 26 and 36 bare pytest.skip calls with zero assertions and stay
# deleted. The job now collects 30 real tests, so the entry below has a nonzero
# baseline and the empty-report refusal bites.
#
# Honest limit: this counts skips, it does not judge them. A structurally sound
# skip and one caused by an env var CI never sets look identical here. What the
# ratchet removes is the SILENT GROWTH of the set, not the set.
version: 1
suites:
  omniclaude/hooks-tests:
    repo: omniclaude
    job: Hooks System Tests
    mode: count
    max_skips: 36
    baseline_collected: 4711
    provenance:
      measured_at: '2026-09-18'
      measured_by: OMN-18790
      measurement_command: gh run download 35404945505 --repo OmniNode-ai/omniclaude --pattern 'hooks-test-results' --dir <dir> && uv run python scripts/ci/skip_count_ratchet.py --print-observed --suite omniclaude/hooks-tests --junit <dir>/hooks-test-results/junit-hooks.xml
      source_runs:
      - '35404945505'
      corroborating_runs:
      - '35397791807'
      - '35396322080'
      notes: 'This is the frozen-36 surface epic OMN-18775 named. Three consecutive live runs reported 36 unique skipped ids each, and the three SETS are identical, not merely the same size (0 ids outside the baseline in either corroborating run). Collected differs slightly between them (4711, 4696, 4711) because the runs are from different pull-request branches, not because anything narrows the selection: the job runs pytest over tests/hooks/ as a whole directory with no impacted-test selector in front of it, which is why mode is count rather than nodeids. node_ids are recorded anyway so a failure names the test that was added, not just a number.'
