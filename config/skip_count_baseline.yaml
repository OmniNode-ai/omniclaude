      corroborating_runs:
      - '35392960545'
      - '35392248095'
      - '35404945505'
      - '35396322080'
      notes: '35395348934 is a full-width run: 5 splits, 14793 collected, 43 unique skipped ids. Mode is nodeids because this job sits behind the impacted-test selector — vars.ENABLE_SMART_TESTS reads true on this repository live, so the ''Run tests (smart selection)'' step takes a 2-split narrowed path on most pull requests and the raw count legitimately varies: 35404945505 and 35396322080 each collected 6015 and skipped 6. A count comparison would read those as a 37-skip improvement and then miss a newly added skip inside the narrowed set. Both narrowed runs and both corroborating full-width runs had 0 ids outside this baseline. Positive control for that zero: injecting one synthetic id into the same comparison reports 1.'
