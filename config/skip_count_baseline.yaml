      notes: '35395348934 is a full-width run: 5 splits, 14793 collected, 43 unique skipped ids. Mode is nodeids because this job sits behind the impacted-test selector — vars.ENABLE_SMART_TESTS reads true on this repository live, so the ''Run tests (smart selection)'' step takes a 2-split narrowed path on most pull requests and the raw count legitimately varies: 35404945505 and 35396322080 each collected 6015 and skipped 6. A count comparison would read those as a 37-skip improvement and then miss a newly added skip inside the narrowed set. Both narrowed runs and both corroborating full-width runs had 0 ids outside this baseline. Positive control for that zero: injecting one synthetic id into the same comparison reports 1. Amended 2026-09-30 (OMN-20109): +1 id, tests.hooks_system.test_hook_canary::test_installer_renders_a_complete_plist, added by omniclaude#2418. It renders the launchd plist and lints it with plutil, so it is skipped by design on every non-darwin platform, and its Linux twin in the same file (the cron-line render) is skipped on darwin: a platform partition, not a test that failed to run. It surfaced on the full-width split run of omniclaude#2420 (44 unique skipped over 17115 collected). Amended 2026-09-30 (OMN-20132): +2 ids, tests.ci.test_receipt_gate_caller_pin_omn20132::test_pinned_workflow_inner_validator_accepts_tree_sha and ::test_floor_rejects_the_pre_tree_sha_inner_ref, added by omniclaude#2433. Each reads a workflow file from omnibase_core through gh api and calls pytest.skip when that read fails, so they are skipped by design wherever the runner token cannot read omnibase_core; observed skipped on the split run of omniclaude#2433 (8 unique skipped over 6791 collected, narrowed run). Both still execute on a workstation with gh access. Amended 2026-09-30 (OMN-20150): +12 ids, all tests.skills.test_lab_onboarding_script_omn20150, added by omniclaude#2442. They run plugins/onex/skills/_bin/lab-onboarding.sh, a macOS-only script, and are skipped by design on every non-darwin runner (macos_only skipif in the file): a platform partition, not tests that failed to run. They surfaced on the full-width split run of omniclaude#2442 (58 unique skipped over 17363 collected). Amended 2026-10-01 (OMN-20150): +7 ids, all tests.skills.test_lab_onboarding_script_omn20150, added by omniclaude#2448 (key settled in preflight, phase 6 overlay, quit-setup). Same macOS-only script and macos_only skipif as the 12 recorded above: a platform partition, skipped by design on every non-darwin runner. They surfaced on the split run of omniclaude#2450 head c5818c6e46c.'
