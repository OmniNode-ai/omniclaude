---
# Pre-commit hooks exported by omniclaude.
# Consumers reference these via:
#
#   - repo: https://github.com/OmniNode-ai/omniclaude
#     rev: <tag-or-sha>
#     hooks:
#       - id: kb-doc-gate

- id: kb-doc-gate
  name: KB doc gate — keep repo markdown inside the allowed set (OMN-16589, OMN-17172)
  description: >
    In 'diff' mode (the default) blocks adding or modifying any .md file
    outside the allowed set; in 'strict' mode blocks the mere existence of one
    anywhere on the branch. Deletions always pass — canonical docs live in the
    knowledge-base repo, and a pointer stub is not a removal. Per-repo mode and
    additional allowed globs: .kb-doc-gate.yaml at the consuming repo's root.
    See scripts/kb_doc_gate.py for the full ruling this implements.
  language: script
  entry: scripts/kb_doc_gate.py --staged
  types: [markdown]
  pass_filenames: true
  # pre-merge-commit is here for a reason (OMN-17827): git runs `pre-commit`
  # for the manual commit that ends a CONFLICTED merge, but a CLEAN merge
  # commits itself and only fires `pre-merge-commit`. Declaring just
  # `pre-commit` therefore gates the loud case and waves the silent one
  # through -- merge enforcement by accident of which hook happened to be
  # installed. The validator is merge-aware at both stages: with MERGE_HEAD
  # present it charges the merge only for what it introduces relative to EVERY
  # parent, so the incoming branch's own pre-existing markdown is not the
  # merge author's violation. A consuming repo still has to install the hook
  # type (`pre-commit install --hook-type pre-merge-commit`); listing the
  # stage here is what makes that install do anything.
  stages: [pre-commit, pre-merge-commit]
