---
# Pre-commit hooks exported by omniclaude.
# Consumers reference these via:
#
#   - repo: https://github.com/OmniNode-ai/omniclaude
#     rev: <tag-or-sha>
#     hooks:
#       - id: kb-doc-gate

- id: kb-doc-gate
  name: KB doc gate — keep repo documentation inside the allowed set
  description: >
    In 'diff' mode (the default) blocks adding or modifying any prose file
    outside the allowed set; in 'strict' mode blocks the mere existence of one
    anywhere on the branch. Deletions always pass — canonical docs live in the
    knowledge-base repo, and a pointer stub is not a removal. Per-repo mode and
    additional allowed globs: .kb-doc-gate.yaml at the consuming repo's root.
    Covers Markdown, MDX, reStructuredText and AsciiDoc and requires a
    knowledge-base link in the root README. See scripts/kb_doc_gate.py.
  language: script
  entry: scripts/kb_doc_gate.py --staged
  # OMN-17427: inspect the index directly, including deletions and config-only
  # commits in strict mode. A Markdown type filter silently drops MDX and RST.
  pass_filenames: false
  always_run: true
  # pre-merge-commit is here for a reason (OMN-17827): git runs `pre-commit`
  # for the manual commit that ends a CONFLICTED merge, but a CLEAN merge
  # commits itself and only fires `pre-merge-commit`. Declaring just
  # `pre-commit` therefore gates the loud case and waves the silent one
  # through -- merge enforcement by accident of which hook happened to be
  # installed. The validator is merge-aware at both stages: with MERGE_HEAD
  # present it charges the merge only for what it introduces relative to EVERY
  # parent, so the incoming branch's own pre-existing markdown is not the
  # merge author's violation. A consuming repo still has to install the hook
  # type (`pre-commit install --hook-type pre-merge-commit`); listing the
  # stage here is what makes that install do anything.
  stages: [pre-commit, pre-merge-commit]

- id: public-repo-hygiene
  name: Public-repo hygiene gate — path allowlist + extension-agnostic denylist (OMN-18014)
  description: >
    Refuses internal operating detail landing in a public repository: an
    undeclared top-level directory, an agent-state or evidence tree, a
    misplaced dated document, a brand asset, an env file, cloud identity, a
    private address, an operator machine path, a private repository name, and
    internal-KB prose in a public README. Never Markdown-only — the path and
    content classes apply to every file type, which is the point.
    Per-repo permitted roots: .public-repo-hygiene.yaml at the consuming
    repo's root. Suppressions resolve against a CODEOWNERS-reviewed registry
    with an expiry; a self-written annotation is not an approval. Five content
    classes accept no annotation at all. Requires OMNI_HYGIENE_VOCAB_PATH to
    name the PRIVATE denylist vocabulary, and fails closed without it; a
    vocabulary whose visibility cache is past its max age is scanned with a
    warning and one FRICTION row (OMN-18030), never refused unscanned. The lab-config
    class (OMN-19766) reads a second private file, the lab vocabulary: pass
    --lab-vocabulary <path> in args, or place it beside the vocabulary under
    the name public_repo_hygiene_lab_vocabulary.yaml; absent is exit 2.
    See scripts/public_repo_hygiene_gate.py for the full rules.
  language: script
  # --diff-staged (OMN-19835) hands the gate the lines this commit adds. It
  # narrows the verdict only in a repository whose .public-repo-hygiene.yaml
  # declares `enforce_scope: added-lines`; elsewhere it is ignored and the
  # verdict is the whole-tree one below.
  entry: scripts/public_repo_hygiene_gate.py --repo-root . --diff-staged
  # WHOLE-TREE, not staged-files. This is the whole lesson of OMN-17993: the
  # omnibase_core local-path check was staged-files-only, so it reported green
  # on every commit for months while .mcp.json at the tracked ROOT carried an
  # operator-home clone path -- nobody had staged that file again since it
  # landed. A gate whose invariant is over the tracked set and whose hook only
  # inspects the diff reports green over everything that landed before it
  # existed, which is the OMN-17992 residue exactly.
  #
  # Cost, stated rather than discovered: roughly 9 seconds on a 3,200-file
  # repository. That is the price of the invariant, and it is the right trade
  # against a gate that cannot see what it is supposed to govern.
  pass_filenames: false
  # always_run, restored by OMN-19835. OMN-18777 (#2255) replaced it here with
  # a workflow-files-only `files:` trigger written for its own advisory-job
  # hook, so this hook stopped running on every commit that touched no
  # workflow -- including one adding a private name to a .py file. The
  # content classes apply to every file type, so every commit is in scope.
  always_run: true
  stages: [pre-commit, pre-merge-commit]

- id: deployment-config
  name: Deployment configuration stays out of shipped repositories (OMN-20923)
  description: >
    Refuses deployment or lab configuration a commit adds to a shipped
    repository: a lane-overlay file (anything under lane-overlays/, any
    *.bifrost.yaml that is not a *.example file) or a configuration value
    naming a private host (an RFC 1918 or CGNAT host address, a private network
    narrower than /16, a tailnet name); in a workflow file also any line,
    comments included, naming a private address or a hostname in a private DNS
    zone. Operator RULING 2026-10-10T21:57:38Z: deployment facts come from
    overlays supplied by whoever runs the system. Matched by shape, so it needs
    no private vocabulary and no OMNI_HOME. Where OMNI_HYGIENE_VOCAB_PATH is
    set it also refuses a lab host nickname in a workflow file; our model ids
    are checked in CI, which holds the private model vocabulary. The same check
    is the required CI context public-repo-hygiene / deployment-config.
  language: script
  entry: scripts/public_repo_hygiene_gate.py --repo-root . --only-classes deployment-config --mode enforce --enforce-scope added-lines --diff-staged
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-merge-commit]

- id: private-repo-runner-placement
  name: Private repos never run CI on GitHub-hosted runners (OMN-18205)
  description: >
    Operator ruling, 2026-09-14: a PRIVATE repository runs its CI on the lab
    fleet, never on GitHub-hosted Actions runners; hosted is for PUBLIC repos,
    where the minutes are free. Reads each job's PARSED runs-on and RESOLVES
    an expression against the repository's live variable scopes, so neither a
    prose mention of a hosted label nor an unresolved expression can read as a
    pass. Repository visibility is resolved live from the GitHub API, never
    from a list that goes stale. A literal fallback naming a hosted label is a
    finding even while its variable is set, and nothing excuses a hosted
    placement: no annotation, no declaration, no force flag (OMN-17427,
    operator 2026-10-19). Unreadable visibility, an unresolvable variable
    and a missing workflow directory are all exit 2, never a pass.
    A host that cannot read Actions variables (a lab-host lane, HTTP 403) sets
    PRRP_VARIABLES_SNAPSHOT to a file written by --write-variables-snapshot
    from a host that can; it is read only after a live read failed, and one
    older than 24 hours or silent about what is needed is exit 2 (OMN-17427).
    Each entry records its own read time and a write keeps other repositories'
    entries, so one snapshot answers visibility and variables for every
    repository a lane commits to, and every refusal names the missing input
    and that remedy (OMN-20141). With PRRP_VARIABLES_SNAPSHOT unset the
    publisher's copy at ~/.omninode/prrp/variables-snapshot.json is read, and
    a called workflow pinned to a full sha is read from a local clone whose
    origin branches hold it, both only after the live read failed and never
    inside Actions (OMN-20074).
    See scripts/private_repo_runner_placement_gate.py.
  language: script
  entry: scripts/private_repo_runner_placement_gate.py --repo-root .
  # WHOLE-TREE, not staged-files, for the OMN-17993 reason: the invariant is
  # over every workflow in the repository, and a hook that inspects only the
  # diff reports green over every hosted pin that landed before it existed.
  pass_filenames: false
  always_run: true
  stages: [pre-commit]

- id: runner-label-exists
  name: A runs-on label pin names a label an online runner carries (OMN-18408)
  description: >
    A job pinned to a label no runner carries does not fail -- it queues, and
    the pull request that merged the pin stays green because the job never ran.
    Measured 2026-09-16: five scheduled lab probes were repinned to a host
    label whose runner was not registered yet, zero of 64 organisation runners
    carried it, and they queued about four hours with no check anywhere saying
    so. This resolves each job's parsed runs-on arm by arm and requires at
    least one ONLINE organisation runner carrying EVERY label in the arm, which
    is the rule GitHub itself uses to assign a job. A label carried only by
    offline runners fails too, and the message says which of the two it is,
    because they want different repairs. Hosted labels are skipped -- whether
    those are ALLOWED is the sibling placement gate's verdict. An unreadable or
    empty runner listing is exit 2, never a pass, and every run executes a
    positive control built from the live listing so a broken matcher cannot
    report everything as satisfied. A label set computed at run time is
    reported rather than refused; a repository in which nothing was decidable
    is itself a refusal. See scripts/runner_label_exists_gate.py.
  language: script
  entry: scripts/runner_label_exists_gate.py --repo-root .
  # WHOLE-TREE for the same reason as the sibling gate above: the invariant is
  # over every workflow in the repository, and a hook that inspects only the
  # diff reports green over every unclaimed pin that landed before it existed.
  pass_filenames: false
  always_run: true
  stages: [pre-commit]

- id: secrets-baseline-wired
  name: A .secrets.baseline must be read by a hook and by CI (OMN-18669)
  description: >
    `.secrets.baseline` is the allowlist a detect-secrets scan is judged
    against. On its own it is inert: it blocks nothing, it proves nothing, and
    it looks exactly like a repository that is protected. Measured 2026-09-18,
    one registry repository carried a committed baseline that no pre-commit
    hook and no CI workflow read; a full scan against it surfaced 47 findings
    in 18 files nothing had ever been asked to approve. Nobody had loosened a
    gate -- there was no gate. This refuses that silent state: a repository
    carrying the file owes BOTH a pre-commit entry and a CI workflow that read
    it. Neither half substitutes for the other -- CI alone finds the credential
    after it has left the machine, and a local hook alone is skippable and
    never sees a commit made elsewhere. A repository with no baseline passes;
    this never demands one. Matching is literal over NON-COMMENT lines, so
    prose about the gate cannot satisfy the gate. Every run executes a positive
    control, and a control that passes is exit 2 rather than a clean report.
    There is no force flag and no allowlist file. The honest limit: this proves
    a reader exists, not that the CI job is a REQUIRED check -- it names the
    workflow it found so a reviewer can check that instead of assuming it.
    See scripts/secrets_baseline_wiring_gate.py.
  language: script
  entry: scripts/secrets_baseline_wiring_gate.py --repo-root .
  # WHOLE-TREE, not staged-files: the invariant is over the repository's own
  # configuration, and a baseline whose reader was deleted in some earlier
  # commit is exactly the state this exists to catch.
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-merge-commit]

- id: advisory-job-gate
  name: No new advisory job — a check that cannot fail needs a ticket (OMN-18777)
  description: >
    Refuses a workflow setting that swallows a job's or a step's own failure
    unless the census baseline names that exact line or the line carries
    `# advisory-ok: OMN-nnnnn <reason>`, and refuses a new verification-shaped
    job that runs on every pull request while appearing in neither
    `required_status_checks` nor the repo's `EXPECTED_EXTERNAL_CONTEXTS`.
    The enforcement surface is read LIVE per repository through `gh`, with a
    24h cache under .git/ so a local commit is cheap; when neither the live
    read nor a fresh cache answers, the hook fails closed rather than passing
    on an empty surface. Free-text justification does not pass — the
    annotation needs a real OMN ticket AND a reason, the same shape
    `# raw-prod-bypass-ok:` already uses. There is no skip flag.
    See scripts/advisory_job_gate.py for the full rules and the honest limit.
  language: script
  entry: scripts/advisory_job_gate.py --repo-root .
  # WHOLE-TREE, not staged-files. The invariant is over every workflow in the
  # repository: a gate whose hook only inspects the diff reports green over
  # everything that landed before it existed, which is the OMN-17993 lesson.
  pass_filenames: false
  # `files:` is the TRIGGER, `pass_filenames: false` is the SCOPE. A commit
  # touching no workflow cannot introduce either refusal, and `always_run`
  # would suppress `files:` and make every commit pay a live surface read.
  files: ^\.github/workflows/.*\.ya?ml$
  stages: [pre-commit, pre-merge-commit]

- id: anti-growth-baseline
  name: Debt baseline can only shrink (OMN-19677)
  description: >
    Compares a committed debt baseline with the same path at the Git merge
    base. Rejects a larger numeric value, a new list/set member, a new count-map
    key, or an increased per-key count. The hook runs a parser-specific
    synthetic growth control before the real comparison and fails closed when
    the merge base or baseline cannot be read. Pass --baseline and --parser in
    the consuming repository's hook args.
  language: script
  entry: scripts/anti_growth_baseline_hook
  pass_filenames: false
  stages: [pre-commit, pre-merge-commit]

- id: doctrine-claim-gate
  name: Doctrine-claim gate — a claim of "unenforced" must match its ticket (OMN-18529)
  description: >
    Requires an explicit HTML doctrine-claim marker with type, ticket and role
    for every unbuilt, in_flight or blocked claim; rewording cannot hide a claim.
    One marker names one ticket in the same prose block or table row. Refuses
    malformed markers, missing tickets or roles, and ticket-state contradictions;
    in_flight requires started, while unbuilt and blocked require non-terminal
    states. Fails closed on unreadable input, unavailable tracker credentials or
    states, and ZERO claim sentences or markers (OMN-18529).

    REQUIRES the tracker credential in the environment. That is deliberate:
    this gate refuses rather than skipping when it cannot read ticket state,
    because a gate that cannot read its input has not passed, it has not run.
    It fires only on the doctrine file, so the blast radius of that
    strictness is a commit that edits doctrine claims.
  language: script
  entry: scripts/doctrine_claim_gate.py
  files: ^CLAUDE\.md$
  pass_filenames: true
  stages: [pre-commit, pre-merge-commit]
