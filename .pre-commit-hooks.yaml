---
# Pre-commit hooks exported by omniclaude.
# Consumers reference these via:
#
#   - repo: https://github.com/OmniNode-ai/omniclaude
#     rev: <tag-or-sha>
#     hooks:
#       - id: kb-doc-gate

- id: kb-doc-gate
  name: KB doc gate — keep repo markdown inside the allowed set (OMN-16589, OMN-17172)
  description: >
    In 'diff' mode (the default) blocks adding or modifying any .md file
    outside the allowed set; in 'strict' mode blocks the mere existence of one
    anywhere on the branch. Deletions always pass — canonical docs live in the
    knowledge-base repo, and a pointer stub is not a removal. Per-repo mode and
    additional allowed globs: .kb-doc-gate.yaml at the consuming repo's root.
    See scripts/kb_doc_gate.py for the full ruling this implements.
  language: script
  entry: scripts/kb_doc_gate.py --staged
  types: [markdown]
  pass_filenames: true
  # pre-merge-commit is here for a reason (OMN-17827): git runs `pre-commit`
  # for the manual commit that ends a CONFLICTED merge, but a CLEAN merge
  # commits itself and only fires `pre-merge-commit`. Declaring just
  # `pre-commit` therefore gates the loud case and waves the silent one
  # through -- merge enforcement by accident of which hook happened to be
  # installed. The validator is merge-aware at both stages: with MERGE_HEAD
  # present it charges the merge only for what it introduces relative to EVERY
  # parent, so the incoming branch's own pre-existing markdown is not the
  # merge author's violation. A consuming repo still has to install the hook
  # type (`pre-commit install --hook-type pre-merge-commit`); listing the
  # stage here is what makes that install do anything.
  stages: [pre-commit, pre-merge-commit]

- id: public-repo-hygiene
  name: Public-repo hygiene gate — path allowlist + extension-agnostic denylist (OMN-18014)
  description: >
    Refuses internal operating detail landing in a public repository: an
    undeclared top-level directory, an agent-state or evidence tree, a
    misplaced dated document, a brand asset, an env file, cloud identity, a
    private address, an operator machine path, a private repository name, and
    internal-KB prose in a public README. Never Markdown-only — the path and
    content classes apply to every file type, which is the point.
    Per-repo permitted roots: .public-repo-hygiene.yaml at the consuming
    repo's root. Suppressions resolve against a CODEOWNERS-reviewed registry
    with an expiry; a self-written annotation is not an approval. Five content
    classes accept no annotation at all. Requires OMNI_HOME to locate the
    PRIVATE denylist vocabulary, and fails closed without it.
    See scripts/public_repo_hygiene_gate.py for the full rules.
  language: script
  entry: scripts/public_repo_hygiene_gate.py --repo-root .
  # WHOLE-TREE, not staged-files. This is the whole lesson of OMN-17993: the
  # omnibase_core local-path check was staged-files-only, so it reported green
  # on every commit for months while .mcp.json at the tracked ROOT carried an
  # operator-home clone path -- nobody had staged that file again since it
  # landed. A gate whose invariant is over the tracked set and whose hook only
  # inspects the diff reports green over everything that landed before it
  # existed, which is the OMN-17992 residue exactly.
  #
  # Cost, stated rather than discovered: roughly 9 seconds on a 3,200-file
  # repository. That is the price of the invariant, and it is the right trade
  # against a gate that cannot see what it is supposed to govern.
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-merge-commit]
