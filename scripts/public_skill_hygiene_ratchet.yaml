#
# Public-repo hygiene ratchet (OMN-17993).
#
# Per-class maximum blocked-hit count on the TREE surface (every
# tracked file outside PUBLISHED_ROOTS). The published surface is
# permanently zero and is not configurable here.
#
# This is a burndown budget, not an allowlist: it names no file, waives
# no line, and only ever goes down. The residue it accounts for is the
# pre-existing public-exposure inventory being remediated under epic
# OMN-17992 (wave A). Exceeding a budget fails the gate; dropping below
# one also fails it, so ground gained is held.
#
# Regenerate after a remediation lands:
#   python3 scripts/check_public_skill_hygiene.py --tighten

