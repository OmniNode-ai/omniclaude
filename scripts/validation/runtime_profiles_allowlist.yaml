# OMN-13288 baseline allowlist: freezes pre-existing runtime_profiles violators
# so the gate blocks NEW orphans without forcing a mass remediation.
# Drain tracked by OMN-12982 — fix each node's lane and delete its entry here.
# ValidatorRuntimeProfiles receives this path explicitly from the repo-local
# wrapper (scripts/ci/run_runtime_profiles_validator.py); no env var or
# package-local fallback owns this repo's baseline. Mirrors OMN-13297
# (omniintelligence/omnimemory) and OMN-12955 (omnimarket).
allowlist:
