# Event types the emit daemon owns entirely internally. No hook client ever
# constructs or emits these, so omniclaude's client-side EVENT_REGISTRY
# intentionally does not carry a registration for them. Read by
# generate_event_registry.py as DAEMON_INTERNAL_EVENT_TYPES; keep it in sync
# with the module docstring in src/omniclaude/hooks/event_registry.py.
#
# omnimarket-owned work-ledger and PR-watcher events are written by lanes and
# watchers through the daemon, never by a Claude Code hook client. The
# delegate-skill terminals and the provider-quota observation (OMN-20154) are
# emitted by the daemon, and delegation.run_step is published by the
# delegate-skill run-step recorder; no hook client emits any of them.
- daemon.health.probe
- delegate_skill.completed
- delegate_skill.failed
- delegation.disposition_recorded
- delegation.request
- delegation.run_step
- pr.state.observed
- provider.quota.observed
- work.ledger.ack
- work.ledger.claim
- work.ledger.correction
- work.ledger.friction
- work.ledger.hold
- work.ledger.msg
- work.ledger.operator_consent
- work.ledger.release
- work.ledger.ruling
- work.ledger.status
- work.ledger.terminal
