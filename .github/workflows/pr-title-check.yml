# OMN-6912

name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# OMN-19644: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@13ceae69c246a33c9fc8fc4b33f83fb66b89edc6
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  pr-title:
    needs: occ-preflight
    if: always()
    # self-gating-ok: cross-repo reusable workflow; PR Title Check is not a required status check on main (tracked in OMN-9039)
    uses: OmniNode-ai/onex_change_control/.github/workflows/pr-title-check-reusable.yml@f81a37f80de412743ade0891b3293f359b970f50
    permissions:
      pull-requests: read
