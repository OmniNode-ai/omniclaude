#
# Shared shrink-only baseline gate (OMN-19677). Callers pin
# `uses: ...anti-growth-baseline-reusable.yml@<40-hex sha>`; that one SHA pins
# both the workflow and its script via `job.workflow_sha`. The exported
# pre-commit hook rev must use the same SHA.

name: Anti-growth baseline (reusable)

on:
  workflow_call:
    inputs:
      baseline-path:
        description: Repository-relative path to the committed debt baseline
        required: true
        type: string
      parser:
        description: Parser identifier accepted by anti_growth_baseline.py
        required: true
        type: string

permissions:
  contents: read

jobs:
  anti-growth-baseline:
    name: anti-growth-baseline
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public FORK PRs default to ubuntu-latest
    # OMN-18205: the untrusted test is the FORK test, and only a public
    # repository's genuine fork pull request may use the public runner selector.
    # Private or unknown-visibility callers take the trusted self-hosted selector.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository &&
         github.event.repository.visibility == 'public')
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 10
    steps:
      # Private repositories run only on lab runners; the ubuntu-latest literal
      # is the public-fork-PR fallback shared with the sibling reusable gates
      # (OMN-18205) and must never serve a private caller.
      - name: Refuse a private repository on a GitHub-hosted runner
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [ "$REPO_VISIBILITY" != "public" ] && [ "$RUNNER_ENVIRONMENT" != "self-hosted" ]; then
            echo "::error::private or unknown-visibility repositories require a self-hosted runner. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "repository visibility: $REPO_VISIBILITY; runner environment: $RUNNER_ENVIRONMENT"

      - name: Checkout caller head with full ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.head.sha
              || github.event_name == 'merge_group'
              && github.event.merge_group.head_sha
              || github.sha
            }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check --quiet 'PyYAML==6.0.2'

      # The similarly named github-context property is not real and evaluates
      # empty, which makes actions/checkout silently take the default branch.
      # `job.workflow_sha` is documented; an empty pin must fail here instead of
      # falling back.
      - name: Resolve the gate pin
        id: pin
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::workflow SHA is empty or is not a lowercase 40-hex commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$WORKFLOW_REPOSITORY" != "OmniNode-ai/omniclaude" ]; then
            echo "::error::workflow repository is '$WORKFLOW_REPOSITORY', not OmniNode-ai/omniclaude. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          echo "anti-growth gate pin: $WORKFLOW_SHA"

      - name: Fetch the canonical gate at the resolved pin
        if: github.repository != 'OmniNode-ai/omniclaude'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OmniNode-ai/omniclaude
          ref: ${{ steps.pin.outputs.sha }}
          path: .omniclaude-anti-growth-baseline
          persist-credentials: false
          sparse-checkout: scripts/anti_growth_baseline.py
          sparse-checkout-cone-mode: false

      - name: Resolve merge-base authority and enforce shrink-only baseline
        env:
          BASELINE_PATH: ${{ inputs.baseline-path }}
          BASELINE_PARSER: ${{ inputs.parser }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GATE_PIN: ${{ steps.pin.outputs.sha }}
          IS_SELF: ${{ github.repository == 'OmniNode-ai/omniclaude' }}
          SCRIPT_PATH: >-
            ${{ github.repository != 'OmniNode-ai/omniclaude'
                && '.omniclaude-anti-growth-baseline/scripts/anti_growth_baseline.py'
                || 'scripts/anti_growth_baseline.py' }}
        run: |
          set -euo pipefail
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::canonical anti-growth gate is missing at $SCRIPT_PATH"
            exit 1
          fi
          if [ "$IS_SELF" != "true" ]; then
            if ! checked_out_sha="$(git -C .omniclaude-anti-growth-baseline rev-parse HEAD)"; then
              echo "::error::could not resolve the fetched anti-growth gate commit. THE GATE DID NOT RUN."
              exit 1
            fi
            if [ "$checked_out_sha" != "$GATE_PIN" ]; then
              echo "::error::anti-growth gate checkout is at $checked_out_sha, expected $GATE_PIN. THE GATE DID NOT RUN."
              exit 1
            fi
            echo "anti-growth gate script checked out at $checked_out_sha"
          fi

          case "$EVENT_NAME" in
            pull_request) base_ref="$PR_BASE_SHA" ;;
            merge_group) base_ref="$MERGE_GROUP_BASE_SHA" ;;
            push) base_ref="$PUSH_BEFORE_SHA" ;;
            *) base_ref="" ;;
          esac
          # A branch's first push carries an all-zero `before`, and events with
          # no base (workflow_dispatch, schedule) carry none: compare against
          # the default branch. That fallback must fetch the branch by its
          # remote name -- `git fetch origin origin/dev` asks the remote for a
          # ref called `origin/dev`, which does not exist (exit 128, measured
          # on omnimarket run 36209381911).
          if [[ "$base_ref" =~ ^0+$ ]] || [ -z "$base_ref" ]; then
            if [ -z "$DEFAULT_BRANCH" ]; then
              echo "::error::no base commit and no default branch to compare against. THE GATE DID NOT RUN."
              exit 1
            fi
            git fetch --no-tags origin \
              "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            base_ref="origin/${DEFAULT_BRANCH}"
          else
            git fetch --no-tags origin "$base_ref"
          fi
          python "$SCRIPT_PATH" \
            --repo-root . \
            --base-ref "$base_ref" \
            --baseline "$BASELINE_PATH" \
            --parser "$BASELINE_PARSER"
