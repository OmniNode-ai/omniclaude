name: CR Thread Gate (caller)
# Caller workflow for omniclaude's own PRs.
# Produces required status check: "gate / CodeRabbit Thread Check"
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  merge_group:
    types: [checks_requested]

jobs:
  gate:
    # OMN-14856/OMN-15120 vector-3: no ACTOR-conditional top-level `if:` here
    # -- the caller job MUST always invoke the reusable, or GitHub never
    # creates the composed "gate / CodeRabbit Thread Check" check run at all
    # (a skipped `uses:` caller job produces zero check runs, unlike a
    # skipped job *inside* an already-invoked reusable, which still posts a
    # real "skipped" conclusion that branch protection accepts as passing).
    # This permanently wedged Dependabot PRs (e.g. omniclaude#1981, #1982) --
    # mirrors the landed fix in omnibase_core@470d326dc (PR #1549,
    # docs/diagnoses/2026-08-06-omnibase-core-1548-missing-required-contexts.md).
    #
    # The former dependabot-actor exemption is dropped outright: the
    # reusable (cr-thread-gate.yml) has no actor gate of its own, so a
    # Dependabot PR's unresolved CodeRabbit thread count is just evaluated
    # normally (0 unresolved threads on a bot PR passes cleanly).
    #
    # The former non-PR `issue_comment` guard moves into the `pr-number`
    # computation instead of a job-level `if:`:
    # `github.event.issue.pull_request` is only truthy when the
    # commented-on issue IS a PR, so a bare-issue comment now resolves
    # pr-number to 0, which the reusable's own script already treats as a
    # graceful no-op (same path used for merge_group).
    if: always()
    uses: ./.github/workflows/cr-thread-gate.yml
    with:
      pr-number: ${{ format('{0}', github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || 0) }}
    secrets:
      # OMN-16373: CROSS_REPO_PAT retired — pass the onexbot-occ-writer App
      # credentials through instead.
      onexbot-occ-app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
      onexbot-occ-private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
