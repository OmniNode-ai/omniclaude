#
# Branch-claim check (reusable). OMN-18263, phase 5 item 26 of the 2026-09-12
# process-friction remediation plan.
#
# WHAT IT ANSWERS. For a pull request whose branch names a ticket: is that ticket
# currently claimed by a lane other than the one that stamped these commits? On
# 2026-09-12 at 14:17Z a lane from a peer session pushed three commits to one
# repository's branch and four to another's, both under a ticket held by a
# different lane's claim row. The claim row was the only ownership record and it
# stopped nothing; two lanes then fixed the same thing within an hour and one of
# the two pull requests was closed unmerged.
#
# WHY A CHECK AND NOT ONLY A HOOK. A hook runs only where it is installed, and
# the 14:17Z lane came from a peer session -- exactly the case a locally
# installed hook cannot be relied on to cover. This check sees every pull
# request regardless of what is installed on the machine that produced it.
#
# IT RECORDS. IT DOES NOT FAIL THE PULL REQUEST. Operator ruling,
# 2026-09-13T09:11:33Z: the check lands first and only records; the pre-push
# refusal (OMN-18262) lands only after the release path has been shown easy in
# practice, measured rather than asserted. The `mode` input carries the other
# half so arming it later is a one-word change in the caller, not a rewrite --
# but nothing should pass `refuse` until that measurement exists.
#
# TWO SOURCES. `work-ledger` reads the canonical lab node's GitHub check for the
# PR head. The database work ledger is read by the lab node; this job opens no
# database connection and only interprets the node's reported outcome.
# `file` runs `scripts/branch_claim.py`, the same module the pre-push hook runs,
# against the private ledger and its rolls. That path is retained only until
# the follow-up removal. This job implements no claim comparison of its own on
# either path. The lab node's resolution is a port of `scripts/claim_index.py`
# and `scripts/branch_claim.py` over the database rows, so a change to the
# resolution here has to land in the node as well until the pre-push hook asks
# the same node.
#
# `secrets: inherit` IS REQUIRED FOR `file`. The claim store lives in a PRIVATE
# workspace repository, and this job mints an installation token to read it. The claim
# index module that resolves it does NOT: it is vendored in this repository as
# `scripts/claim_index.py` beside the resolver (OMN-19722), and is fetched at the
# same pin. Fetching it unpinned from the store's default branch let a wording
# change there turn this repository's own gate red with no change here. Without the secrets the token step fails and the job fails CLOSED -- see
# the store steps below. The repository is NOT named here: this repository is
# public, and naming a private repository in public source is a never-exemptable
# hygiene class. The name lives in an organization variable; only the shape of
# the lookup is public.
#
# Usage in caller repos:
#   jobs:
#     branch-claim-check:
#       uses: OmniNode-ai/omniclaude/.github/workflows/branch-claim-check-reusable.yml@<immutable-sha>
#       secrets: inherit
#
# WHAT `file` CANNOT SEE, measured on its own first run. The store is read
# from the private repository's DEFAULT BRANCH, so a claim row that exists only in
# a lane's working copy is invisible here until it is committed and merged. The
# first run of this workflow resolved its own branch as `unclaimed` for exactly
# that reason, while the same resolution against the local working copy read
# `held-by-pusher`. That lag is the honest argument for the pre-push half of
# OMN-18262, which reads the working copy and has no lag at all -- it is not a
# reason to distrust this check, whose job is the peer-session push a local hook
# never sees.
#
# Surfaced check context in the caller: `branch-claim-check / branch-claim-check`.

name: Branch Claim Check (reusable)

on:
  workflow_call:
    inputs:
      claim_source:
        description: "'file' reads the private ledger; 'work-ledger' reads the lab node's check."
        type: string
        required: false
        default: file
      lab_check_name:
        description: Name of the canonical lab branch-claim check on the PR head.
        type: string
        required: false
        default: branch-claim / work-ledger
      lab_check_app_slug:
        description: GitHub App slug trusted to publish the lab check.
        type: string
        required: false
        default: onexbot-occ-writer
      lab_check_wait_seconds:
        description: Maximum seconds to wait for a completed lab check.
        type: number
        required: false
        default: 900
      mode:
        description: >-
          'record' (default) reports findings and exits 0. 'refuse' fails the
          job. Leave it at the default: the refusing half is OMN-18262 and is
          gated on a measurement of the release path, not on taste.
        type: string
        required: false
        default: record
      resolver_ref:
        description: >-
          Optional full 40-hex omniclaude commit SHA the resolution is fetched
          from. Leave unset in normal use: the default is job.workflow_sha, the
          exact SHA the caller pinned, so the caller's `uses:` is the single
          source of truth for the workflow and the script it runs. Branch names
          are refused.
        type: string
        required: false
      store_repo_name:
        description: >-
          Name (NOT owner/name) of the PRIVATE repository holding the claim
          store; the owner is always
          github.repository_owner. Leave unset in normal use -- it resolves from
          the organization variable OMNI_LEDGER_REPO.

          A bare name rather than owner/name because the Actions expression
          language has no `split`, and the token action needs the name alone.
        type: string
        required: false
        default: ""
      ledger_path:
        description: Path to the claim store inside that repository.
        type: string
        required: false
        default: docs/tracking/ROLLING_WORK_LEDGER.md
      ledger_archive_glob:
        description: >-
          Where the ledger's ROLLS live inside that repository.

          The claim store is not one file. A post-merge hook rolls the ledger
          daily, MOVING rows into this directory, and a resolution that fetched
          only the live file answered "unclaimed" for every claim the roll had
          carried away -- which is clean, so this check reported green over
          exactly the collisions it exists to catch (OMN-18791).

          The resolution decides which of these files it needs and opens no
          others; this pattern only has to make them reachable.
        type: string
        required: false
        default: docs/tracking/archive/

permissions:
  contents: read
  checks: read

jobs:
  branch-claim-check:
    name: branch-claim-check
    if: github.event_name == 'pull_request'
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public FORK PRs default to ubuntu-latest
    # OMN-18205: the untrusted test is the FORK test, and only the fork test.
    # It used to also send every same-repo pull request whose base is `dev`
    # to the public class. That is not a trust boundary -- a same-repo pull
    # request is written by someone who can already push to this repository,
    # and the sibling pr-title reusable has always used the fork test alone.
    # What the extra clause actually did was pin every private repository's
    # required checks to GitHub-hosted runners, which the 2026-09-14 operator
    # ruling forbids and which the enterprise hosted-runner switch has since
    # made unrunnable. A genuine fork pull request still resolves to
    # OMNI_PUBLIC_PR_RUNS_ON_JSON, so the boundary OMN-16683 exists to hold
    # is unchanged.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # Leave room for the default 900-second lab wait and its final diagnostic.
    timeout-minutes: 20
    steps:
      - name: Validate the claim source
        env:
          CLAIM_SOURCE: ${{ inputs.claim_source }}
        run: |
          set -euo pipefail
          case "$CLAIM_SOURCE" in
            file|work-ledger) ;;
            *)
              echo "::error::Unknown claim_source '$CLAIM_SOURCE'. THE CHECK DID NOT RUN."
              exit 1
              ;;
          esac

      - name: Read the lab branch-claim check for this head
        if: inputs.claim_source == 'work-ledger'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LAB_CHECK_NAME: ${{ inputs.lab_check_name }}
          LAB_CHECK_APP_SLUG: ${{ inputs.lab_check_app_slug }}
          LAB_CHECK_WAIT_SECONDS: ${{ inputs.lab_check_wait_seconds }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          encoded_name="$(jq -rn --arg name "$LAB_CHECK_NAME" '$name | @uri')"
          endpoint="repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=$encoded_name&filter=all&per_page=100"
          wait_seconds="$(jq -en --argjson wait "$LAB_CHECK_WAIT_SECONDS" '$wait | select(. >= 0) | ceil')"
          deadline=$((SECONDS + wait_seconds))
          selected=""
          # Always attempt once, including when the configured wait is zero.
          while :; do
            if response="$(gh api --paginate "$endpoint")"; then
              ignored="$(jq -s --arg app "$LAB_CHECK_APP_SLUG" \
                '[.[].check_runs[] | select(.app.slug != $app)] | length' <<< "$response")"
              echo "Ignored $ignored check run(s) from other apps; trusted app: $LAB_CHECK_APP_SLUG."
              selected="$(jq -sc --arg app "$LAB_CHECK_APP_SLUG" \
                '[.[].check_runs[] | select(.app.slug == $app and .status == "completed")] | sort_by(.completed_at) | last // empty' \
                <<< "$response")"
              if [[ -n "$selected" ]]; then
                break
              fi
            else
              echo "Lab check API request failed; retrying within the $LAB_CHECK_WAIT_SECONDS second deadline."
            fi
            remaining=$((deadline - SECONDS))
            if ((remaining <= 0)); then
              break
            fi
            sleep_for=20
            if ((remaining < sleep_for)); then
              sleep_for=$remaining
            fi
            sleep "$sleep_for"
            if ((SECONDS >= deadline)); then
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "Lab check source: $LAB_CHECK_NAME; app=$LAB_CHECK_APP_SLUG; head=$HEAD_SHA; no completed outcome line or html_url available."
            echo "::error::Check '$LAB_CHECK_NAME' from app '$LAB_CHECK_APP_SLUG' did not complete for head $HEAD_SHA within $LAB_CHECK_WAIT_SECONDS seconds. The lab node did not answer for this head. THE CHECK DID NOT RUN."
            exit 1
          fi

          summary="$(jq -r '.output.summary // ""' <<< "$selected")"
          html_url="$(jq -r '.html_url // ""' <<< "$selected")"
          first_line="${summary%%$'\n'*}"
          printf '%s\n%s\n' "$html_url" "$first_line"
          if [[ ! "$first_line" =~ ^branch-claim-outcome:\ (held-elsewhere|fence-behind|unidentified|held-by-pusher|unclaimed|no-ticket|did-not-run)\  ]]; then
            echo "::error::Check '$LAB_CHECK_NAME' from app '$LAB_CHECK_APP_SLUG' has an invalid outcome line for head $HEAD_SHA. THE CHECK DID NOT RUN."
            exit 1
          fi
          outcome="${BASH_REMATCH[1]}"
          case "$outcome" in
            did-not-run)
              printf '%s\n' "$summary"
              cause="${summary#*$'\n'}"
              cause="${cause%%$'\n'*}"
              echo "::error::$cause THE CHECK DID NOT RUN."
              exit 1
              ;;
            held-elsewhere|fence-behind|unidentified)
              while IFS= read -r line; do
                printf '::warning::%s\n' "$line"
              done <<< "$summary"
              if [[ "$outcome" != "unidentified" && "$MODE" == "refuse" ]]; then
                exit 1
              fi
              ;;
            held-by-pusher|unclaimed|no-ticket) ;;
          esac

      # The HEAD commits, not the merge commit. The resolution reads the lane
      # trailers of the commits the branch actually carries; a merge commit git
      # synthesised carries none, and reading it would report every pull request
      # as unidentified.
      - name: Checkout the pull request head
        if: inputs.claim_source == 'file'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history: the range is base..head, and a shallow clone makes the
          # base unreachable. An unresolvable range is an ERROR in the resolution
          # rather than an empty commit list, precisely so that case cannot read
          # as "every commit is fine".
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        if: inputs.claim_source == 'file'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The resolution lives in omniclaude. When called from another repository
      # GITHUB_WORKSPACE holds the CALLER's tree, so pull the two modules into a
      # side path -- mirrors public-repo-hygiene-reusable.yml and
      # kb-doc-gate-reusable.yml.
      - name: Resolve the gate pin
        if: inputs.claim_source == 'file'
        id: pin
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          REF_OVERRIDE: ${{ inputs.resolver_ref }}
        run: |
          set -euo pipefail
          resolved_pin="${REF_OVERRIDE:-$WORKFLOW_SHA}"
          if [[ ! "$resolved_pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::branch-claim pin is empty or is not a lowercase 40-hex commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$WORKFLOW_REPOSITORY" != "OmniNode-ai/omniclaude" ]; then
            echo "::error::workflow repository is '$WORKFLOW_REPOSITORY', not OmniNode-ai/omniclaude. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "sha=$resolved_pin" >> "$GITHUB_OUTPUT"
          echo "branch-claim pin: $resolved_pin"

      - name: Fetch the resolution (omniclaude canonical source)
        if: inputs.claim_source == 'file' && github.repository != 'OmniNode-ai/omniclaude'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OmniNode-ai/omniclaude
          ref: ${{ steps.pin.outputs.sha }}
          path: .omniclaude-branch-claim
          persist-credentials: false
          sparse-checkout: |
            scripts/branch_claim.py
            scripts/claim_index.py
            scripts/lane_identity.py
          sparse-checkout-cone-mode: false

      - name: Assert the branch-claim checkout is at the pin
        if: inputs.claim_source == 'file' && github.repository != 'OmniNode-ai/omniclaude'
        env:
          GATE_PIN: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          if ! checked_out_sha="$(git -C .omniclaude-branch-claim rev-parse HEAD)"; then
            echo "::error::could not resolve the fetched branch-claim commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$checked_out_sha" != "$GATE_PIN" ]; then
            echo "::error::branch-claim checkout is at $checked_out_sha, expected $GATE_PIN. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "branch-claim checked out at $checked_out_sha"

      # Resolve the private store repository from the organization variable, and
      # REFUSE if it is unset. An empty name would make the checkout below
      # request `owner/`, which fails in a way that reads like a transient
      # network problem rather than a missing configuration. Name the cause.
      - name: Resolve the private claim store repo
        if: inputs.claim_source == 'file'
        id: store-repo
        env:
          EXPLICIT: ${{ inputs.store_repo_name }}
          FROM_VARS: ${{ vars.OMNI_LEDGER_REPO }}
        run: |
          set -euo pipefail
          resolved="${EXPLICIT:-${FROM_VARS:-}}"
          if [ -z "${resolved}" ]; then
            echo "::error::neither the 'store_repo_name' input nor the organization" \
                 "variable OMNI_LEDGER_REPO is set, so the PRIVATE claim store cannot" \
                 "be located. The check refuses rather than resolving against an" \
                 "absent store: no holders reads exactly like every branch being" \
                 "unclaimed, which is a clean bill of health over the whole corpus." \
                 "THE CHECK DID NOT RUN."
            exit 1
          fi
          echo "name=${resolved}" >> "$GITHUB_OUTPUT"

      - name: Mint token for the private claim store repo
        if: inputs.claim_source == 'file'
        id: store-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ONEXBOT_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.store-repo.outputs.name }}
          permission-contents: read

      # reusable-checkout-ref-ok: branch-claim-check OMN-18263 the claim store is live state; a pinned ref answers who held a ticket in the past, which is the one question this check must not ask
      #
      # DELIBERATELY UNPINNED, and pinning it would be the defect. The claim
      # store is LIVE STATE: a pinned SHA would answer about who held a ticket at
      # some past moment rather than who holds it now, which is the one question
      # this check exists to ask. The security trade is explicit: this reads a
      # markdown store, and only data, from a PRIVATE first-party repository;
      # no code is fetched from it (the index module is vendored here, at the
      # pin, since OMN-19722). An unreadable store is a refusal.
      - name: Fetch the claim store and its rolls
        if: inputs.claim_source == 'file'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ steps.store-repo.outputs.name }}
          token: ${{ steps.store-token.outputs.token }}
          path: .branch-claim-store
          persist-credentials: false
          sparse-checkout: |
            ${{ inputs.ledger_path }}
            ${{ inputs.ledger_archive_glob }}
          sparse-checkout-cone-mode: false

      - name: Resolve this branch against the claim store
        if: inputs.claim_source == 'file'
        env:
          MODE: ${{ inputs.mode }}
          BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RESOLVER: >-
            ${{ github.repository != 'OmniNode-ai/omniclaude'
                && '.omniclaude-branch-claim/scripts/branch_claim.py'
                || 'scripts/branch_claim.py' }}
          # Asserted alongside the resolver, not assumed. The resolver imports it
          # as a sibling file, and a sparse checkout that silently missed it would
          # surface as an ImportError traceback rather than as a named cause.
          IDENTITY: >-
            ${{ github.repository != 'OmniNode-ai/omniclaude'
                && '.omniclaude-branch-claim/scripts/lane_identity.py'
                || 'scripts/lane_identity.py' }}
          LEDGER: .branch-claim-store/${{ inputs.ledger_path }}
          LEDGER_NAME: ${{ inputs.ledger_path }}
          # Vendored beside the resolver (OMN-19722), loaded by it from that
          # sibling path. Asserted here so a sparse checkout that missed it names
          # the cause instead of surfacing as the resolver's own refusal.
          CLAIM_INDEX: >-
            ${{ github.repository != 'OmniNode-ai/omniclaude'
                && '.omniclaude-branch-claim/scripts/claim_index.py'
                || 'scripts/claim_index.py' }}
          # Asserted below alongside the other three, for the same reason and a
          # sharper one: a sparse pattern that silently missed this leaves the
          # store as the live file alone, which is the pre-OMN-18791 behaviour
          # and reports UNCLAIMED for every rolled claim. That reads as a clean
          # check, so it has to be proven fetched rather than assumed.
          ARCHIVE_DIR: .branch-claim-store/${{ inputs.ledger_archive_glob }}
        run: |
          set -euo pipefail
          # Fail LOUD, not with a bare "can't open file ... Errno 2". A sparse
          # checkout of a path that does not exist at the requested ref SUCCEEDS
          # and leaves an empty side path, so a bad ref surfaces only here, as an
          # exit that reads like a verdict but is actually "the check never ran".
          if [ ! -d "${ARCHIVE_DIR}" ]; then
            echo "::error::${ARCHIVE_DIR} was not fetched. The claim store is the" \
                 "live ledger AND the rolls it has spilled into; without them every" \
                 "claim the last roll moved resolves as unclaimed, which reads as a" \
                 "clean bill of health over exactly those rows (OMN-18791)." \
                 "THE CHECK DID NOT RUN."
            exit 1
          fi
          for required in "${RESOLVER}" "${IDENTITY}" "${LEDGER}" "${CLAIM_INDEX}"; do
            if [ ! -f "${required}" ]; then
              echo "::error::${required} was not fetched. The check refuses rather" \
                   "than resolving against a missing input -- an unreachable claim" \
                   "store returns zero holders and reads exactly like a clean bill" \
                   "of health. Check that the app installation covers the resolved" \
                   "store repository and that the caller passed 'secrets: inherit'." \
                   "THE CHECK DID NOT RUN."
              exit 1
            fi
          done
          # Never `|| true` a gate and never suppress stderr: both convert a
          # failure into a confident zero. Record mode's exit 0 comes from the
          # resolution itself, which distinguishes a FINDING (exit 0 in record
          # mode) from a check that could not run (exit 2 in either mode).
          python3 "${RESOLVER}" check \
            --mode "${MODE}" \
            --branch "${BRANCH}" \
            --repo . \
            --range "${BASE_SHA}..HEAD" \
            --ledger "${LEDGER}" \
            --ledger-name "${LEDGER_NAME}" \
            --annotate
