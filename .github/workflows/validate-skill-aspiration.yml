---
name: Skill Aspiration

on:
  push:
    branches: [main, 'hotfix/**']
    paths:
      - 'plugins/onex/skills/**/*.md'
      - 'plugins/onex/skills/_lib/validate_skill_aspiration.py'
      - 'scripts/extract_skill_claims.py'
      - 'scripts/validation/validate_skill_aspiration.py'
      - 'tests/unit/skills/_lib/test_validate_skill_aspiration.py'
      - '.github/workflows/validate-skill-aspiration.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'plugins/onex/skills/**/*.md'
      - 'plugins/onex/skills/_lib/validate_skill_aspiration.py'
      - 'scripts/extract_skill_claims.py'
      - 'scripts/validation/validate_skill_aspiration.py'
      - 'tests/unit/skills/_lib/test_validate_skill_aspiration.py'
      - '.github/workflows/validate-skill-aspiration.yml'

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.6.1"
  UV_HTTP_TIMEOUT: "600"

concurrency:
  group: skill-aspiration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@13ceae69c246a33c9fc8fc4b33f83fb66b89edc6
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  validate:
    needs: occ-preflight
    name: validate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 10

    steps:
      - name: Checkout omniclaude
        uses: actions/checkout@v7

      - name: Resolve the pinned omnimarket rev
        id: om_pin
        run: |
          set -euo pipefail
          # A sibling is read at the rev this repo's uv.lock pins, never its live
          # branch (ruling 2026-10-01).
          rev="$(grep -oE 'omnimarket\.git\?rev=[0-9a-f]{40}' uv.lock | head -1 | sed 's/.*rev=//')"
          [[ -n "$rev" ]] || { echo "::error::omnimarket rev not found in uv.lock"; exit 1; }
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"

      - name: Checkout omnimarket
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omnimarket
          ref: ${{ steps.om_pin.outputs.rev }}
          path: _omnimarket
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in 1 2 3; do
            if uv sync --all-extras --python "${PYTHON_VERSION}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep_seconds=$((attempt * 10))
              echo "::warning::uv sync attempt ${attempt}/3 failed; retrying in ${sleep_seconds}s"
              sleep "$sleep_seconds"
            fi
          done
          exit 1

      - name: Run skill aspiration unit tests
        working-directory: ${{ github.workspace }}
        run: uv run pytest tests/unit/skills/_lib/test_validate_skill_aspiration.py -v

      - name: Validate SKILL.md claims against backing-node behavior
        env:
          OMNIMARKET_ROOT: _omnimarket
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/validation/validate_skill_aspiration.py
