---
# hostile-reviewer.yml
#
# Adversarial multi-model code review gate on every pull request.
#
# Invokes omniintelligence.review_pairing.cli_review (node-based path via
# HandlerLlmCliSubprocess / adapter_codex_reviewer) with --model deepseek-r1.
# Codex is excluded from the initial pilot — add --model codex once non-interactive
# OAuth auth is confirmed on the omnibase-ci runner (OMN-8524).
#
# Gate semantics (pilot phase):
#   blocked     — critical/error findings from at least one succeeded model → exit 1
#   degraded    — cli_review RAN but every model failed mid-review → exit 0 (informational, pilot)
#   infra_error — cli_review could not run at all (dependency install failed, or the
#                 CLI itself crashed) after one retry → exit 1 (fail closed, 2026-08-13)
#   passed      — no critical/error findings → exit 0
#
# 2026-08-13: infra_error used to be folded into `degraded` and exit 0 — a
# dependency-install failure or a CLI crash let this REQUIRED context ("Hostile
# Review Gate") go green with zero adversarial review having actually run.
# Reference: OMN-8524

name: Hostile Reviewer

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

env:
  UV_HTTP_TIMEOUT: "300"

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@dev
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  hostile-review:
    needs: occ-preflight
    name: Hostile Reviewer (adversarial gate)
    # self-hosted runner on .201 required — DeepSeek-R1 at :8001 is LAN-only  # onex-allow-internal-ip
    # LLM_DEEPSEEK_URL must be set in the runner's environment (Infisical or shell profile)
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.base.ref == 'dev'))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 20
    env:
      UV_HTTP_TIMEOUT: "900"

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Clean stale dependency clones
        working-directory: ${{ github.workspace }}
        run: rm -rf ../omniintelligence ../omnibase_core ../omnibase_compat

      - name: Clone omniintelligence
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..4}; do
            rm -rf ../omniintelligence
            if git clone --depth=1 --filter=blob:none --branch dev \
              https://github.com/OmniNode-ai/omniintelligence.git ../omniintelligence; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Clone omnibase_core
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..4}; do
            rm -rf ../omnibase_core
            if git clone --depth=1 --filter=blob:none --branch dev \
              https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Clone omnibase_compat
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..4}; do
            rm -rf ../omnibase_compat
            if git clone --depth=1 --filter=blob:none --branch dev \
              https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12
        working-directory: ${{ github.workspace }}
        run: uv python install 3.12

      - name: Install omniintelligence dependencies
        id: install_deps
        # NOTE: no `continue-on-error` -- a manufactured degraded/exit-0
        # verdict on install failure let this REQUIRED context self-report
        # success with zero adversarial review having run (fixed 2026-08-13).
        # A real dependency-install failure now fails this job outright and
        # "Hostile Review Gate" (needs: [occ-preflight, hostile-review],
        # if: always()) reads the resulting `failure` result and fails
        # closed via its existing default-deny case statement.
        working-directory: ../omniintelligence
        env:
          UV_CONCURRENT_DOWNLOADS: "1"
          UV_HTTP_TIMEOUT: "600"
          UV_SYNC_ATTEMPTS: "5"
          UV_SYNC_RETRY_DELAY_SECONDS: "10"
          UV_TORCH_BACKEND: "cpu"
        run: |
          set -euo pipefail

          attempt=1
          until uv sync --locked --all-extras --python 3.12; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::uv sync failed after ${attempt} attempt(s)"
              exit "$status"
            fi

            sleep_seconds=$((UV_SYNC_RETRY_DELAY_SECONDS * attempt))
            echo "::warning::uv sync attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed with exit ${status}; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Run adversarial review
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # LLM_DEEPSEEK_URL is read directly from the runner's environment (Infisical-injected
          # or set in the runner's shell profile on .201) — no GitHub secret needed
        working-directory: ../omniintelligence
        run: |
          set -euo pipefail

          # Run cli_review; stdout = ModelMultiReviewResult JSON, stderr = human summary.
          # 2026-08-13: previously a CLI crash (any nonzero exit) reported
          # verdict=degraded and exited 0, letting this REQUIRED context go
          # green with zero adversarial review having actually run. Retry
          # once (transient infra), then FAIL CLOSED — an infra outage on a
          # required gate must show up as a red PR, not a silent pass. If the
          # operator wants a model-outage escape it needs to be a
          # MEASURED_NOT_ENFORCED exemption backed by a measured outage rate
          # and a ticket, not a self-reported exit 0 inside this step.
          REVIEW_EXIT=1
          for attempt in 1 2; do
            if REVIEW_JSON=$(uv run python -m omniintelligence.review_pairing.cli_review \
              --pr "$PR_NUMBER" \
              --repo "$REPO" \
              --model deepseek-r1 \
              2>/dev/null); then
              REVIEW_EXIT=0
              break
            fi
            REVIEW_EXIT=$?
            echo "::warning::cli_review attempt ${attempt}/2 failed (exit ${REVIEW_EXIT})"
            if [ "$attempt" -eq 1 ]; then
              sleep 15
            fi
          done

          if [ "$REVIEW_EXIT" -ne 0 ]; then
            {
              echo "verdict=infra_error"
              echo "blocking_count=0"
              echo "total_findings=0"
              echo "models_succeeded="
              echo "error=cli_review failed after 2 attempts (exit ${REVIEW_EXIT}) — infra unavailable or crash"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Parse verdict from JSON using Python inline. Pass the JSON through
          # the environment because the heredoc occupies Python's stdin.
          VERDICT_DATA=$(REVIEW_JSON="$REVIEW_JSON" python3 - <<'PYEOF'
          import os
          import json

          data = json.loads(os.environ["REVIEW_JSON"])
          models_succeeded = data.get("models_succeeded", [])
          total_findings = data.get("total_findings", 0)

          # Count blocking findings (critical or error severity)
          blocking = 0
          for r in data.get("results", []):
              if not r.get("success"):
                  continue
              for f in r.get("findings", []):
                  if f.get("severity") in ("critical", "error"):
                      blocking += 1

          if not models_succeeded:
              verdict = "degraded"
          elif blocking > 0:
              verdict = "blocked"
          else:
              verdict = "passed"

          print(f"verdict={verdict}")
          print(f"blocking_count={blocking}")
          print(f"total_findings={total_findings}")
          print(f"models_succeeded={','.join(models_succeeded)}")
          PYEOF
          )

          # Write outputs
          echo "$VERDICT_DATA" >> "$GITHUB_OUTPUT"
          echo "error=" >> "$GITHUB_OUTPUT"

          # Set exit code: blocked → 1, everything else → 0 (pilot: degraded is informational)
          VERDICT=$(echo "$VERDICT_DATA" | grep '^verdict=' | cut -d= -f2)
          if [ "$VERDICT" = "blocked" ]; then
            exit 1
          fi

      - name: Post review summary as PR comment
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@v9
        env:
          REVIEW_VERDICT: ${{ steps.review.outputs.verdict }}
          REVIEW_BLOCKING: ${{ steps.review.outputs.blocking_count }}
          REVIEW_TOTAL: ${{ steps.review.outputs.total_findings }}
          REVIEW_MODELS: ${{ steps.review.outputs.models_succeeded }}
          REVIEW_ERROR: ${{ steps.review.outputs.error }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const verdict = process.env.REVIEW_VERDICT || 'unknown';
            const blocking = parseInt(process.env.REVIEW_BLOCKING || '0');
            const total = parseInt(process.env.REVIEW_TOTAL || '0');
            const models = process.env.REVIEW_MODELS || '';
            const error = process.env.REVIEW_ERROR || '';

            const icon = {
              passed: '✅',
              blocked: '🚫',
              degraded: '⚠️',
              infra_error: '🚫',
            }[verdict] || '❓';

            const label = {
              passed: 'PASSED',
              blocked: 'BLOCKED',
              degraded: 'DEGRADED (informational)',
              infra_error: 'INFRA ERROR (blocking)',
            }[verdict] || verdict.toUpperCase();

            let note = '';
            if (verdict === 'degraded') {
              note = '\n\n> **Note**: All reviewer models failed or were unavailable. ' +
                'Degraded results are informational during the pilot phase (OMN-8524) and do not block merge.';
              if (error) note += ` Error: \`${error}\``;
            } else if (verdict === 'blocked') {
              note = '\n\n> **Action required**: Resolve CRITICAL/ERROR findings before merge.';
            } else if (verdict === 'infra_error') {
              note = '\n\n> **Action required**: the reviewer CLI failed after 2 attempts (dependency install or crash) — ' +
                'this now fails the required gate closed instead of silently passing. Re-run the job; if infra is ' +
                'genuinely down, escalate rather than bypassing.';
              if (error) note += ` Error: \`${error}\``;
            }

            const body = [
              `## ${icon} Hostile Reviewer — ${label}`,
              '',
              `**Blocking findings** (critical/error): ${blocking}  `,
              `**Total findings**: ${total}  `,
              `**Models succeeded**: ${models || 'none'}`,
              note,
              '',
              '---',
              '',
              '**Gate semantics (pilot phase)**',
              '',
              '| Verdict | Meaning | Blocks merge? |',
              '|---------|---------|---------------|',
              '| `passed` | No critical/error findings | No |',
              '| `blocked` | CRITICAL or ERROR findings found | **Yes** |',
              '| `degraded` | Reviewer ran but every model failed mid-run | No (pilot) |',
              '| `infra_error` | cli_review failed to run at all (install/crash) after 2 attempts | **Yes** |',
              '',
              '_Powered by [omniintelligence.review_pairing.cli_review](https://github.com/OmniNode-ai/omniintelligence) — node-based adversarial review via HandlerLlmCliSubprocess (OMN-8524)_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body.includes('Hostile Reviewer')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  hostile-review-gate:
    name: Hostile Review Gate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.base.ref == 'dev'))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: [occ-preflight, hostile-review]
    if: always()
    steps:
      - name: Evaluate gate
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Hostile Review Gate ==="
          PREFLIGHT="${{ needs.occ-preflight.result }}"
          RESULT="${{ needs.hostile-review.result }}"
          echo "occ-preflight: $PREFLIGHT"
          echo "hostile-review: $RESULT"

          if [ "$PREFLIGHT" != "success" ]; then
            echo "::error::OCC preflight failed or did not complete (result: $PREFLIGHT)."
            exit 1
          fi
          # Four-way triage with a default-deny catch-all (OMN-15304 vector 6,
          # the omnimarket#1926 shape). Blocking only on `failure` let a
          # CANCELLED reviewer render this REQUIRED context green with no
          # adversarial verdict in existence — exactly the omnimarket#1920
          # incident (reviewer cancelled 04:13:14Z, gate SUCCESS 04:13:21Z),
          # and `if: always()` above guarantees that path is reached. Anything
          # that is not `success` is the ABSENCE of a verdict, not a passing
          # one; an unrecognised future result value fails closed too.
          case "$RESULT" in
            success)
              ;;
            failure)
              echo "::error::Hostile reviewer job failed — either CRITICAL/ERROR findings were reported (resolve them) or cli_review could not run at all after 2 attempts (infra_error — check the job log/PR comment for which). See the 'Post review summary as PR comment' output for the verdict."
              exit 1
              ;;
            cancelled|skipped)
              echo "::error::Hostile reviewer produced no verdict (result: $RESULT) — the absence of a verdict is not a passing one."
              exit 1
              ;;
            *)
              echo "::error::Unrecognised hostile-review result '$RESULT' — failing closed."
              exit 1
              ;;
          esac
          echo "Hostile Review Gate PASSED"
