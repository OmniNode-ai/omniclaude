---
# hostile-reviewer.yml
#
# Adversarial multi-model code review gate on every pull request.
#
# Invokes omniintelligence.review_pairing.cli_review with the voters declared
# in a review voters overlay (review_voters_overlay.v1, OMN-20910) that no
# shipped repository carries (OMN-20923, operator RULING 2026-10-10T21:57:38Z:
# no lab or deployment configuration in a shipped repository; CI is configured
# by an overlay supplied by whoever runs it). The org Actions variable
# OMNI_CI_OVERLAY_REPO names a private repository of this owner; the node
# overlay of node_review_voters_overlay_compute in it is fetched at the exact
# commit OMNI_CI_OVERLAY_REF names (OMN-20910). If that variable is unset or
# not a full 40-hex lowercase sha, the gate fails closed naming the variable.
# OMNI_CI_OVERLAY_REPO unset (a fork or a customer): the neutral default applies,
# no review voters configured, and the gate fails closed saying so. THIS FILE
# NAMES NO VOTER, ENDPOINT, MODEL OR NETWORK: changing or adding a voter is a
# commit to that overlay plus an update of OMNI_CI_OVERLAY_REF, with no
# workflow PR in any repo. An unpinned default-branch read would let anyone
# who can push there change the voters a private diff is sent to with no
# reviewed change here. Private diffs go only to the voters the pinned
# overlay declares. A
# required voter that is unreachable or fails is named, one voter is no quorum,
# and the job fails closed. Codex is not a voter (OMN-8524); a voter of any kind is
# added in the overlay.
#
# TWO VOTERS, BECAUSE THE CLI's CONTRACT ASKS FOR TWO (OMN-18473). cli_review
# returns 0 only when >=2 models succeed and 2 ("DEGRADED — a minimum of 2
# models is required for a full pass") when exactly one does. This repo passed
# a single --model from 2026-04-11 (71d816a99) to 2026-09-16, so every verdict
# it ever produced was DEGRADED by construction. Operator ruling 2026-09-15,
# firm: no one-off repo configuration — a differing repo is brought to the
# fleet standard.
#
# WHAT A SECOND VOTER HERE DOES AND DOES NOT BUY, stated so nobody re-derives
# it wrongly. It does NOT damp a spurious finding by averaging: run_multi_model_review
# CONCATENATES per-model results, with no dedup and no weighting. What it buys
# is cross-model agreement (OMN-18479): a critical/error finding blocks only when
# at least two distinct succeeded voters raised it, and a finding only one voter
# raised is reported as a warning. A second voter also conforms to the CLI's
# contract. Whether the voters are genuinely independent models is a property of
# the overlay, not of this file.
#
# Gate semantics (pilot phase):
#   blocked     — critical/error findings raised by AT LEAST TWO distinct
#                 succeeded models (cross-model quorum, OMN-18479) → exit 1.
#                 A finding only one model raised is reported as a warning
#                 in the verdict artifact and does NOT block.
#   degraded    — cli_review RAN but every model failed mid-review → exit 0 (informational, pilot)
#   degraded_quorum
#               — fewer models succeeded than agreement requires, so NO verdict
#                 could be established (cli_review exit 2) → exit 1 (fail
#                 closed, OMN-18479). Treating this as a valid verdict is what
#                 made single-model blocking possible in the first place.
#   infra_error — cli_review could not run at all (dependency install failed, or the
#                 CLI itself crashed) after one retry → exit 1 (fail closed, 2026-08-13)
#   unavailable_fork_isolation
#               — a fork-origin pull request, which is never placed on the
#                 LAN-attached fleet, so the reviewer model is unreachable by
#                 construction → exit 1 (fail closed with a NAMED reason, OMN-18415)
#   passed      — no critical/error findings → exit 0
#
# THIS JOB IS LAB-TOUCHING AND ITS RUNNER CARVE-OUT IS LOAD-BEARING (OMN-18415).
# The reviewer calls two models on lab hosts, which are LAN-only (the
# fleet's LLM_ENDPOINT_CIDR_ALLOWLIST covers both hosts on all 60 runners,
# read 2026-09-25T19:08Z), and it
# needs two variables the omnibase-ci fleet carries and a GitHub-hosted runner
# does not: the local-LLM HMAC signing key (fail-closed) and
# LLM_ENDPOINT_CIDR_ALLOWLIST, the transport's trust boundary, which it refuses
# to default. Both were placed on all 60 fleet runners on 2026-09-15/16.
#
# stderr IS NOT DISCARDED (OMN-18415 AC3). The reviewer's stderr used to be
# redirected to the null device, so three separate fail-closed causes each had
# to be reproduced by hand on a laptop instead of read from the job log. It is
# now echoed into the log per attempt and carried in an uploaded verdict
# artifact. A test asserts that redirection appears nowhere in this file, so do
# not reintroduce it — not even inside a comment.
#
# 2026-08-13: infra_error used to be folded into `degraded` and exit 0 — a
# dependency-install failure or a CLI crash let this REQUIRED context ("Hostile
# Review Gate") go green with zero adversarial review having actually run.
# Reference: OMN-8524

name: Hostile Reviewer

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

env:
  UV_HTTP_TIMEOUT: "300"

jobs:
  hostile-review:
    name: Hostile Reviewer (adversarial gate)
    # RUNNER CARVE-OUT (OMN-18415) — the trusted branch reads a DEDICATED
    # `OMNI_HOSTILE_REVIEW_RUNS_ON_JSON` variable, NOT the shared
    # `OMNI_TRUSTED_CI_RUNS_ON_JSON` seam that governs lint/test/build here, and
    # NOT a bare hardcoded label either.
    #
    # WHY NOT THE SEAM: this job calls the overlay's voters over a private
    # network, reading their endpoint variables and the trust-boundary
    # variables from the runner's own environment. Only the self-hosted
    # `omnibase-ci` fleet has them. omniclaude is a
    # PUBLIC repository whose seam is deliberately `["ubuntu-latest"]` at org and
    # repo scope under the 2026-09-14 ruling that public HERMETIC CI stays
    # hosted — and that ruling classifies a job by what it REACHES. This one
    # reaches the lab. While it read the seam it landed hosted on every real pull
    # request, could not reach the endpoint, and reported `infra_error` on a
    # REQUIRED check (omniclaude#2181 run 35043714512 attempt 4, hosted
    # ubuntu-24.04 image).
    #
    # WHY NOT A BARE LITERAL: a runner label written straight into a workflow
    # file answers to no routing variable and is invisible to the hourly
    # runner-routing audit, which reads Actions variables. One explicit knob
    # keeps the placement legible and killable (CLAUDE.md rule 14).
    #
    # WHY NOT THE ROUTING NODE: `node_ci_runner_route_compute` (omnibase_infra,
    # reached through route-runner-reusable.yml) cannot express this. It treats
    # the caller's seam as a CEILING it may only ever DOWNGRADE from, so for a
    # public repository whose seam is hosted it returns `seam_ceiling_hosted` on
    # every run. A lab-touching job in a public repository has to sit AHEAD of
    # the seam, which is precisely what this narrower variable is for — the same
    # carve-out shape the OCC publishers use for the tailnet-only broker
    # (OMN-16691).
    #
    # HOW: the literal `["self-hosted","omnibase-ci"]` fallback IS the operating
    # value. `OMNI_HOSTILE_REVIEW_RUNS_ON_JSON` is deliberately left UNSET at org
    # and repo scope — setting it is an operator kill switch that must cite a
    # reachability proof for whatever class it names, never a side effect of a
    # seam migration. Nothing here writes any Actions variable (rule 14,
    # single-owner).
    #
    # FORK ISOLATION IS UNTOUCHED AND COMES FIRST (OMN-16683/16684). Untrusted
    # fork code never reaches the LAN-attached fleet at any idle level. It keeps
    # the `OMNI_PUBLIC_PR_RUNS_ON_JSON` path, where the model is unreachable, and
    # the job then fails CLOSED with a named reason rather than passing silently.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_HOSTILE_REVIEW_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # OMN-19998: sized for the voters' worst case, which the CI overlay sets,
    # not this file. 20 minutes held the roster pinned on 2026-10-11 (one
    # cli_review run: 1094 s with setup) but not the overlay's later voter
    # timeouts (1994 s for ONE run), and the review step runs cli_review up to
    # twice. The "Validate retry-budget invariant" step re-derives the sum from
    # the fetched overlay on every run, so a roster that cannot finish inside
    # this ceiling fails in seconds with a named cause instead of being
    # cancelled at the ceiling with none. Keep HOSTILE_REVIEW_JOB_TIMEOUT_SECONDS
    # below equal to this value times 60.
    # OMN-17427: each of two attempts gets 3142 s ((6600 - 300 - 15) / 2),
    # holding two voters at review_deadline_seconds 1500 (3000 s).
    # This is the chunk-scaled deadline omniintelligence 921b322b reads from
    # the overlay; 4500 gave 2092 s per attempt.
    timeout-minutes: 110
    env:
      HOSTILE_REVIEW_JOB_TIMEOUT_SECONDS: "6600"
      UV_HTTP_TIMEOUT: "900"
      # Same fork/non-fork test as `runs-on:` above, threaded into the steps so
      # the fork path can refuse loudly instead of attempting a LAN call it
      # cannot make. Identical shape to the OCC publishers' RUNNER_IS_TRUSTED.
      RUNNER_IS_TRUSTED: >-
        ${{
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name != github.repository)
          && 'false' || 'true'
        }}
      # Absolute: the review step runs in ../omniintelligence, and the upload
      # action resolves a relative path against the workspace.
      VERDICT_ARTIFACT: ${{ github.workspace }}/hostile-review-verdict.json
      # OMN-20910: the one place the voters come from. Fetched by the step below.
      REVIEW_VOTERS_OVERLAY: ${{ github.workspace }}/../ci-overlay/config/onex/overlays/node_review_voters_overlay_compute/overlay.yaml

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # OMN-18415. A fork-origin pull request is placed on a GitHub-hosted
      # runner by the selector above and MUST stay there: running untrusted code
      # on the LAN-attached fleet is the exposure OMN-16683 closed. The
      # consequence is that the reviewer model is unreachable, so this path can
      # never produce an adversarial verdict.
      #
      # It therefore refuses with a NAMED reason rather than passing. A silent
      # pass here would be the same class of defect this ticket exists to close:
      # a REQUIRED adversarial gate reporting green with zero review performed.
      # A typed skip is not available either — the gate below treats `skipped`
      # as the ABSENCE of a verdict and fails closed on it (OMN-15304 vector 6),
      # so skipping would be a red check with no reason attached to it. This is
      # a red check WITH one, in the job log and in the verdict artifact.
      - name: Refuse fork-origin pull requests (fail closed, named)
        if: env.RUNNER_IS_TRUSTED != 'true'
        working-directory: ${{ github.workspace }}
        env:
          REASON: >-
            fork-origin pull request: the adversarial reviewer calls a LAN-only
            model on the lab host, and untrusted fork code is never placed
            on the self-hosted fleet (OMN-16683). No verdict can be produced on
            this path.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          payload = {
              "verdict": "unavailable_fork_isolation",
              "blocking_count": 0,
              "total_findings": 0,
              "models_succeeded": [],
              "review_exit": None,
              "error": os.environ["REASON"],
              "named_cause": "",
              "findings": [],
              "stderr": "",
          }
          with open(os.environ["VERDICT_ARTIFACT"], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
          PY
          {
            echo "verdict=unavailable_fork_isolation"
            echo "blocking_count=0"
            echo "total_findings=0"
            echo "models_succeeded="
            echo "error=${REASON}"
            echo "named_cause="
          } >> "$GITHUB_OUTPUT"
          echo "::error title=Hostile Reviewer unavailable::${REASON}"
          exit 1

      - name: Clean stale dependency clones
        working-directory: ${{ github.workspace }}
        run: rm -rf ../omniintelligence ../omnibase_core ../omnibase_compat ../ci-overlay

      # OMN-20910: the roster is read at the exact commit OMNI_CI_OVERLAY_REF
      # names. Unset or not a full lowercase sha, the gate fails closed naming
      # the variable. An unpinned default-branch read would let anyone who can
      # push to the overlay repository's default branch change the voters a
      # private diff is sent to with no reviewed change here. Changing or
      # adding a voter is an overlay commit plus an OMNI_CI_OVERLAY_REF update,
      # with no workflow PR in any repo. The data is validated by the resolver
      # and placed outside the workspace (OMN-20923), so a pull request cannot
      # supply the voters that review it.
      - name: Resolve the CI overlay
        id: ci-overlay
        working-directory: ${{ github.workspace }}
        env:
          CI_OVERLAY_REPO: ${{ vars.OMNI_CI_OVERLAY_REPO }}
          CI_OVERLAY_REF: ${{ vars.OMNI_CI_OVERLAY_REF }}
        run: |
          set -euo pipefail
          # Both variables arrive through env: and are only ever expanded as quoted
          # shell variables. Messages and outputs are written with printf, the
          # value as an argument and never as the format. A value that fails
          # validation is not echoed back: a newline in it would start a log line
          # of its own, and a line beginning with two colons is a workflow command.
          if [ -z "${CI_OVERLAY_REPO}" ]; then
            printf '%s\n' "::error::no review voters configured: OMNI_CI_OVERLAY_REPO is unset, so no CI overlay supplies config/onex/overlays/node_review_voters_overlay_compute/overlay.yaml (review_voters_overlay.v1). The gate fails closed. To run it, put your voters in a repository of your own and set OMNI_CI_OVERLAY_REPO to its name."
            exit 1
          fi
          if [[ ! "${CI_OVERLAY_REPO}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            printf '%s\n' "::error::OMNI_CI_OVERLAY_REPO must be a bare repository name (letters, digits, dot, underscore and hyphen only); the rejected value is not echoed"
            exit 1
          fi
          if [ -z "${CI_OVERLAY_REF}" ]; then
            printf '::error::OMNI_CI_OVERLAY_REF is unset: the CI overlay %s is read only at a pinned commit, so set the org Actions variable OMNI_CI_OVERLAY_REF to the full 40-hex commit sha of %s that carries config/onex/overlays/node_review_voters_overlay_compute/overlay.yaml. The gate fails closed.\n' "${CI_OVERLAY_REPO}" "${CI_OVERLAY_REPO}"
            exit 1
          fi
          if [[ ! "${CI_OVERLAY_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' "::error::OMNI_CI_OVERLAY_REF must be a full 40-hex lowercase commit sha; a branch, tag or short sha is refused because the voters could change without the pin changing. The rejected value is not echoed"
            exit 1
          fi
          {
            printf '%s\n' "name=${CI_OVERLAY_REPO}"
            printf '%s\n' "ref=${CI_OVERLAY_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint a read-only CI overlay token
        id: ci-overlay-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.ci-overlay.outputs.name }}
          permission-contents: read

      # Read only the exact commit OMNI_CI_OVERLAY_REF names (OMN-20910).
      # The resolver validates the pinned overlay data (OMN-20923).
      - name: Fetch the CI overlay
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository_owner }}/${{ steps.ci-overlay.outputs.name }}
          ref: ${{ steps.ci-overlay.outputs.ref }}
          token: ${{ steps.ci-overlay-token.outputs.token }}
          path: .ci-overlay-checkout
          persist-credentials: false
          sparse-checkout: |
            config/onex/overlays/node_review_voters_overlay_compute
          sparse-checkout-cone-mode: false

      - name: Place the CI overlay outside the workspace
        working-directory: ${{ github.workspace }}
        env:
          OVERLAY_SOURCE: ${{ github.repository_owner }}/${{ steps.ci-overlay.outputs.name }}
          EXPECTED_OVERLAY_REF: ${{ steps.ci-overlay.outputs.ref }}
        run: |
          set -euo pipefail
          rm -rf ../ci-overlay
          mv .ci-overlay-checkout ../ci-overlay
          FETCHED_REF="$(git -C ../ci-overlay rev-parse HEAD)"
          echo "CI overlay read from ${OVERLAY_SOURCE} at ${FETCHED_REF}"
          if [ "${FETCHED_REF}" != "${EXPECTED_OVERLAY_REF}" ]; then
            echo "::error::the CI overlay checkout is at ${FETCHED_REF}, not the pinned OMNI_CI_OVERLAY_REF ${EXPECTED_OVERLAY_REF}; refusing to read voters from it"
            exit 1
          fi
          if [ ! -s "$REVIEW_VOTERS_OVERLAY" ]; then
            echo "::error::the CI overlay carries no config/onex/overlays/node_review_voters_overlay_compute/overlay.yaml; no voter can be resolved"
            exit 1
          fi

      - name: Clone omniintelligence
        working-directory: ${{ github.workspace }}
        run: |
          # OMN-20910: the review tooling is read at omniintelligence's newest
          # dev-<UTC>-<sha12> tag, resolved here at run time (every dev merge there
          # is tagged), never checked out at a branch tip and never at the rev
          # uv.lock records. Only names of exactly that shape are considered
          # (14-digit UTC stamp, 12 hex), newest first. A tag name is not a trust
          # root: anyone who can push a tag could name one after a commit they
          # control. A candidate is therefore taken only when its commit starts with
          # the sha12 its name records AND is an ancestor of omniintelligence's dev
          # branch, whose protection is the same root a uv.lock rev would trust. A
          # tag failing either test is skipped with a warning, so a forged
          # newer-looking tag can neither be read nor hold the reviewer back. dev is
          # fetched only to test ancestry (commits and trees, no blobs); the tree
          # read is the tag's.
          repo_url="https://github.com/OmniNode-ai/omniintelligence.git"
          for attempt in {1..4}; do
            rm -rf ../omniintelligence
            if git init -q ../omniintelligence \
              && git -C ../omniintelligence remote add origin "$repo_url" \
              && tags="$(git -C ../omniintelligence ls-remote --tags --refs origin 'refs/tags/dev-*' | sed 's#.*refs/tags/##' | grep -E '^dev-[0-9]{14}-[0-9a-f]{12}$' | sort -r)" \
              && [[ -n "$tags" ]] \
              && git -C ../omniintelligence fetch -q --no-tags --filter=blob:none origin \
                '+refs/heads/dev:refs/remotes/origin/dev' '+refs/tags/dev-*:refs/tags/dev-*'; then
              for tag in $tags; do
                head_sha="$(git -C ../omniintelligence rev-parse "refs/tags/${tag}^{commit}")"
                if [[ "$head_sha" != "${tag##*-}"* ]]; then
                  echo "::warning::omniintelligence tag ${tag} resolves to ${head_sha}, not the commit its name records; skipped"
                  continue
                fi
                if ! git -C ../omniintelligence merge-base --is-ancestor "$head_sha" refs/remotes/origin/dev; then
                  echo "::warning::omniintelligence tag ${tag} (${head_sha}) is not an ancestor of its dev branch; skipped"
                  continue
                fi
                git -C ../omniintelligence checkout -q --detach "$head_sha"
                echo "omniintelligence read at tag ${tag} (${head_sha})"
                exit 0
              done
              echo "::error::no omniintelligence dev-<UTC>-<sha12> tag is anchored to its commit and reachable from dev"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "::error::no omniintelligence dev-<UTC>-<sha12> tag could be resolved and fetched"
          exit 1

      - name: Clone omnibase_core
        working-directory: ${{ github.workspace }}
        run: |
          # Pinned to the omnibase-core version this repo's uv.lock resolves
          # (ruling 2026-10-01: a sibling is read at the pin, never its live dev).
          pin_version="$(awk -v n=omnibase-core '$0 == "name = \"" n "\"" {getline; print $3; exit}' uv.lock | tr -d '"')"
          [[ -n "$pin_version" ]] || { echo "::error::omnibase-core not found in uv.lock"; exit 1; }
          for attempt in {1..4}; do
            rm -rf ../omnibase_core
            if git clone --depth=1 --filter=blob:none --branch "v${pin_version}" \
              https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Clone omnibase_compat
        working-directory: ${{ github.workspace }}
        run: |
          # Pinned to the omnibase-compat version this repo's uv.lock resolves
          # (ruling 2026-10-01: a sibling is read at the pin, never its live dev).
          pin_version="$(awk -v n=omnibase-compat '$0 == "name = \"" n "\"" {getline; print $3; exit}' uv.lock | tr -d '"')"
          [[ -n "$pin_version" ]] || { echo "::error::omnibase-compat not found in uv.lock"; exit 1; }
          for attempt in {1..4}; do
            rm -rf ../omnibase_compat
            if git clone --depth=1 --filter=blob:none --branch "v${pin_version}" \
              https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12
        working-directory: ${{ github.workspace }}
        run: uv python install 3.12

      - name: Install omniintelligence dependencies
        id: install_deps
        # NOTE: no `continue-on-error` -- a manufactured degraded/exit-0
        # verdict on install failure let this REQUIRED context self-report
        # success with zero adversarial review having run (fixed 2026-08-13).
        # A real dependency-install failure now fails this job outright and
        # "Hostile Review Gate" (needs: [hostile-review],
        # if: always()) reads the resulting `failure` result and fails
        # closed via its existing default-deny case statement.
        working-directory: ../omniintelligence
        env:
          UV_CONCURRENT_DOWNLOADS: "1"
          UV_HTTP_TIMEOUT: "600"
          UV_SYNC_ATTEMPTS: "5"
          UV_SYNC_RETRY_DELAY_SECONDS: "10"
          UV_TORCH_BACKEND: "cpu"
        run: |
          set -euo pipefail

          attempt=1
          until uv sync --locked --all-extras --python 3.12; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::uv sync failed after ${attempt} attempt(s)"
              exit "$status"
            fi

            sleep_seconds=$((UV_SYNC_RETRY_DELAY_SECONDS * attempt))
            echo "::warning::uv sync attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed with exit ${status}; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Validate retry-budget invariant (OMN-19998)
        id: retry-budget
        # No model is called: retry_budget reads the fetched overlay's voters
        # and the installed transport's retry default, and asserts that one
        # cli_review run's sequential worst case (every attempt, backoff and
        # overflow endpoint of every voter) fits the share of this job's
        # ceiling that one attempt of the review step below gets. omnimarket
        # runs the same check (OMN-15066). A voter given more time in the
        # overlay than this job can hold fails here, naming the voter and the
        # sum, rather than outrunning timeout-minutes with no log line.
        working-directory: ../omniintelligence
        run: |
          set -uo pipefail  # NOT -e: this step classifies its own exit code below.

          # Allowance for the clone, install and overlay steps before the review.
          SETUP_OVERHEAD_SECONDS=300
          # Must match the review step's attempt loop and its pause between attempts.
          REVIEW_ATTEMPTS=2
          RETRY_PAUSE_SECONDS=15
          ATTEMPT_BUDGET_SECONDS=$(( (HOSTILE_REVIEW_JOB_TIMEOUT_SECONDS - SETUP_OVERHEAD_SECONDS - RETRY_PAUSE_SECONDS * (REVIEW_ATTEMPTS - 1)) / REVIEW_ATTEMPTS ))

          # The substitution is an if condition so an inherited bash -e cannot
          # abort the step before its output is printed (see omnimarket's
          # OMN-15066 post-mortem on the same step).
          if OUTPUT=$(uv run python -m omniintelligence.review_pairing.retry_budget \
            --voters-overlay "$REVIEW_VOTERS_OVERLAY" \
            --job-timeout-seconds "$ATTEMPT_BUDGET_SECONDS" \
            --setup-overhead-seconds 0 2>&1); then
            STATUS=0
          else
            STATUS=$?
          fi

          echo "Per-attempt budget: ${ATTEMPT_BUDGET_SECONDS}s of a ${HOSTILE_REVIEW_JOB_TIMEOUT_SECONDS}s job (${REVIEW_ATTEMPTS} attempts, ${SETUP_OVERHEAD_SECONDS}s setup, ${RETRY_PAUSE_SECONDS}s pause)"
          echo "$OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error title=Hostile Reviewer retry budget::the CI overlay's voters cannot finish one cli_review run inside ${ATTEMPT_BUDGET_SECONDS}s, so ${REVIEW_ATTEMPTS} attempts cannot finish inside this job's timeout-minutes (OMN-19998). Lower a voter's timeout in the overlay or raise timeout-minutes and HOSTILE_REVIEW_JOB_TIMEOUT_SECONDS together; do not bypass this check."
            exit 1
          fi

      - name: Run adversarial review
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The pull request's head commit, never the merge ref the job checks out
          # (OMN-17427, port of OMN-20947): a signed off-CI review receipt is bound
          # to the head its reviewer read, and cli_review accepts receipts in place
          # of a timed-out or unavailable voter only for exactly this commit and
          # only when the voters overlay declares substitute_votes. Without it
          # cli_review prints "substitute receipts need --pr, --repo and
          # --head-sha, so none were read".
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # OMN-20910: no voter endpoint is set here. Every voter, its endpoint,
          # model, sampling and focus come from REVIEW_VOTERS_OVERLAY (job env).
        working-directory: ../omniintelligence
        run: |
          set -euo pipefail

          # Run cli_review; stdout = ModelMultiReviewResult JSON, stderr = human summary.
          # 2026-08-13: previously a CLI crash (any nonzero exit) reported
          # verdict=degraded and exited 0, letting this REQUIRED context go
          # green with zero adversarial review having actually run. Retry
          # once (transient infra), then FAIL CLOSED — an infra outage on a
          # required gate must show up as a red PR, not a silent pass. If the
          # operator wants a model-outage escape it needs to be a
          # MEASURED_NOT_ENFORCED exemption backed by a measured outage rate
          # and a ticket, not a self-reported exit 0 inside this step.
          # 2026-09-15 (OMN-18409): `REVIEW_EXIT=$?` must be read directly
          # after the command substitution, never after a `fi` -- an `if
          # COND; then BODY; fi` with no `else` itself exits 0 when COND is
          # false, so reading `$?` after the closing `fi` silently captures
          # the if-statement's own status (always 0) instead of the failed
          # command's real exit code. That bug zeroed out REVIEW_EXIT on
          # every cli_review failure, so the infra_error fail-closed check
          # below never fired and the script fell through to json.loads() an
          # empty review JSON (omniclaude#2180, run 35017674790).
          # set +e/-e brackets the substitution so `set -euo pipefail` above
          # does not abort the script on a genuine cli_review failure.
          #
          # cli_review's exit-code contract (OMN-18409, amended OMN-18479):
          # 0 a verdict was produced, 2 DEGRADED QUORUM (fewer models
          # succeeded than cross-model agreement requires, so no verdict
          # exists), 1 every model failed or the CLI crashed.
          #
          # Exit 2 is NOT a verdict and is no longer read as one. This step
          # previously treated it as the expected steady state, which is
          # precisely what made a single model's opinion sufficient to block
          # a merge. Since OMN-18473 this step reviews with TWO voters (since OMN-20910 the overlay's), so
          # the expected outcome of a healthy run is exit 0; exit 2 now means
          # one of the two returned and agreement could not be established.
          # That is a degraded quorum, not a verdict on a single opinion, and
          # the gate fails closed on it rather than accepting it.
          #
          # OMN-18415 AC3 — STDERR IS CAPTURED, NEVER DISCARDED. A redirect to
          # the null device stood on the substitution below, discarding every
          # byte of it. cli_review writes its human summary
          # AND every fail-closed cause to stderr, so discarding it meant a
          # misconfiguration surfaced as a bare `infra_error` with no diagnostic
          # anywhere in CI. Three distinct causes on this one gate — an absent
          # signing key, an absent endpoint CIDR boundary, and a hosted runner
          # with no route to the model at all — each had to be reproduced by
          # hand on a laptop to be named. Each was one line of this stderr.
          STDERR_LOG="${RUNNER_TEMP}/hostile-review-stderr.log"
          ATTEMPT_ERR="${RUNNER_TEMP}/hostile-review-stderr-attempt.log"
          # cli_review's JSON goes to a file, never to an environment variable.
          # A Linux execve refuses any single environment string over 128 KiB
          # (E2BIG, which bash reports as exit 126), and a review with dozens of
          # findings is larger than that: omniclaude#2864 produced a passing
          # quorum verdict and then died with exit 126 at the first python3 that
          # was handed the JSON through its environment, so the gate went red
          # with no verdict and no named cause. The parsers below read the file.
          REVIEW_JSON_FILE="${RUNNER_TEMP}/hostile-review-result.json"
          : > "$STDERR_LOG"

          REVIEW_EXIT=1
          for attempt in 1 2; do
            : > "$ATTEMPT_ERR"
            : > "$REVIEW_JSON_FILE"
            set +e
            uv run python -m omniintelligence.review_pairing.cli_review \
              --pr "$PR_NUMBER" \
              --repo "$REPO" \
              --head-sha "$HEAD_SHA" \
              --voters-overlay "$REVIEW_VOTERS_OVERLAY" \
              >"$REVIEW_JSON_FILE" 2>"$ATTEMPT_ERR"
            REVIEW_EXIT=$?
            set -e

            # Redact before anything is echoed or uploaded. The signing key is
            # in this step's ambient process environment because the fleet
            # declares it there, and GitHub masks only registered Actions
            # secrets, not runner env. Done in python reading os.environ so no
            # value is ever placed on a command line, where `ps` would show it.
            python3 - "$ATTEMPT_ERR" <<'PY'
          import base64
          import json
          import os
          import sys
          import urllib.parse

          def spellings(value: str) -> list[str]:
              """Every form the value can reach stderr in, longest first.

              A substring replace only catches the value spelled verbatim.
              Anything that passes through a JSON body, a query string or an
              encoded header arrives in a form that does not match it and was
              printed in full. Longest first so a shorter spelling cannot cut a
              longer one in half and leave the remainder in the log.
              """
              return sorted(
                  {
                      value,
                      json.dumps(value)[1:-1],
                      urllib.parse.quote(value, safe=""),
                      base64.b64encode(value.encode()).decode(),
                  },
                  key=len,
                  reverse=True,
              )


          def redact_value(text: str, name: str, value: str) -> str:
              """Replace every line containing any spelling of the value.

              Splicing the value out of the middle of a line leaves the
              surrounding characters behind, which reads as corruption and tells
              a reader how long the value was. The line goes, or nothing does.
              Over-redaction is the accepted direction: a value that happens to
              sit inside an unrelated token costs a marked-up log line, which is
              legible. The other direction leaves a signing value in CI output.
              """
              marker = f"***{name}-redacted***"
              for spelling in spellings(value):
                  text = "".join(
                      f"{marker}{os.linesep if line.endswith(os.linesep) else ''}"
                      if spelling in line
                      else line
                      for line in text.splitlines(keepends=True)
                  )
              return text


          path = sys.argv[1]
          with open(path, encoding="utf-8", errors="replace") as handle:
              text = handle.read()
          for name in (
              "LOCAL_LLM_SHARED_SECRET",
              "LLM_ENDPOINT_CIDR_ALLOWLIST",
          ):
              value = os.environ.get(name)
              if value and len(value) >= 8:
                  text = redact_value(text, name, value)
          with open(path, "w", encoding="utf-8") as handle:
              handle.write(text)
          PY

            cat "$ATTEMPT_ERR" >> "$STDERR_LOG"
            echo "::group::cli_review stderr (attempt ${attempt}/2, exit ${REVIEW_EXIT})"
            cat "$ATTEMPT_ERR"
            echo "::endgroup::"

            # OMN-18479: exit 2 is DEGRADED QUORUM -- fewer models succeeded
            # than agreement requires, so there is no verdict to read. It is
            # retried like any other failure and, if it persists, fails the
            # gate closed below. It is NOT a break condition: breaking on it
            # is what let a single model's opinion stand as a verdict.
            if [ "$REVIEW_EXIT" -eq 0 ]; then
              break
            fi
            echo "::warning::cli_review attempt ${attempt}/2 failed (exit ${REVIEW_EXIT})"
            if [ "$attempt" -eq 1 ]; then
              sleep 15
            fi
          done

          # The single most informative stderr line, carried into the step
          # output so it reaches the PR comment as well as the log.
          NAMED_CAUSE=$(grep -aE '\[ONEX_[A-Z0-9_]+\]|is not set|is required|Traceback' "$STDERR_LOG" | tail -n 1 || true)

          # OMN-18479: exit 2 after both attempts is DEGRADED QUORUM -- the
          # reviewer ran and wrote a document, but fewer models succeeded than
          # agreement requires, so the document carries no verdict. It fails
          # the gate closed under its own name rather than being folded into
          # infra_error (a different cause, and a different fix) or, as
          # before, read as a valid single-model verdict.
          if [ "$REVIEW_EXIT" -eq 2 ]; then
            REVIEW_EXIT="$REVIEW_EXIT" NAMED_CAUSE="$NAMED_CAUSE" \
            STDERR_LOG="$STDERR_LOG" python3 - <<'PY'
          import json
          import os

          with open(os.environ["STDERR_LOG"], encoding="utf-8", errors="replace") as handle:
              captured = handle.read()
          payload = {
              "verdict": "degraded_quorum",
              "blocking_count": 0,
              "total_findings": 0,
              "models_succeeded": [],
              "review_exit": int(os.environ["REVIEW_EXIT"]),
              "error": (
                  "fewer reviewer models succeeded than cross-model agreement "
                  "requires \u2014 no verdict could be established"
              ),
              "named_cause": os.environ.get("NAMED_CAUSE", ""),
              "findings": [],
              "stderr": captured,
          }
          with open(os.environ["VERDICT_ARTIFACT"], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
          PY
            {
              echo "verdict=degraded_quorum"
              echo "blocking_count=0"
              echo "total_findings=0"
              echo "models_succeeded="
              echo "error=fewer reviewer models succeeded than cross-model agreement requires — no verdict could be established"
              echo "named_cause=${NAMED_CAUSE}"
            } >> "$GITHUB_OUTPUT"
            echo "::error title=Hostile Reviewer degraded quorum::fewer models succeeded than agreement requires; no verdict was established"
            exit 1
          fi

          if [ "$REVIEW_EXIT" -ne 0 ]; then
            REVIEW_EXIT="$REVIEW_EXIT" NAMED_CAUSE="$NAMED_CAUSE" \
            STDERR_LOG="$STDERR_LOG" python3 - <<'PY'
          import json
          import os

          with open(os.environ["STDERR_LOG"], encoding="utf-8", errors="replace") as handle:
              captured = handle.read()
          payload = {
              "verdict": "infra_error",
              "blocking_count": 0,
              "total_findings": 0,
              "models_succeeded": [],
              "review_exit": int(os.environ["REVIEW_EXIT"]),
              "error": (
                  f"cli_review failed after 2 attempts (exit {os.environ['REVIEW_EXIT']})"
                  " \u2014 infra unavailable or crash"
              ),
              "named_cause": os.environ.get("NAMED_CAUSE", ""),
              "findings": [],
              "stderr": captured,
          }
          with open(os.environ["VERDICT_ARTIFACT"], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
          PY
            {
              echo "verdict=infra_error"
              echo "blocking_count=0"
              echo "total_findings=0"
              echo "models_succeeded="
              echo "error=cli_review failed after 2 attempts (exit ${REVIEW_EXIT}) — infra unavailable or crash"
              echo "named_cause=${NAMED_CAUSE}"
            } >> "$GITHUB_OUTPUT"
            if [ -n "$NAMED_CAUSE" ]; then
              echo "::error title=Hostile Reviewer infra_error::${NAMED_CAUSE}"
            fi
            exit 1
          fi

          # Parse verdict from JSON using Python inline. Pass the JSON's path
          # through the environment because the heredoc occupies Python's
          # stdin; the JSON itself is too large for an environment string.
          VERDICT_DATA=$(REVIEW_JSON_FILE="$REVIEW_JSON_FILE" python3 - <<'PYEOF'
          import os
          import json

          with open(os.environ["REVIEW_JSON_FILE"], encoding="utf-8") as handle:
              data = json.load(handle)
          models_succeeded = data.get("models_succeeded", [])
          total_findings = data.get("total_findings", 0)
          skipped_reason = data.get("skipped_reason")

          # OMN-18479: read the reviewer's cross-model agreement verdict.
          # This used to sum blocking severities across every succeeded model,
          # so ONE model's finding blocked the merge -- 24 of 40 runs on this
          # repository blocked on a rotating finding no second sample
          # reproduced. The reviewer now resolves agreement itself and ships
          # the clusters in `quorum`; a finding blocks only when at least two
          # distinct models raise a matching one, and a finding below that
          # threshold is reported as a warning. The rule lives in the reviewer,
          # once, for the whole fleet -- never re-derived here.
          quorum = data.get("quorum") or {}
          quorum_verdict = str(quorum.get("verdict", ""))
          blocking = int(quorum.get("blocking_count", 0))
          below_quorum = int(quorum.get("warning_count", 0))

          # OMN-18409: an empty PR diff (e.g. a merge/ancestry commit whose
          # tree is identical to the base branch) is a real, reviewable
          # "nothing to review" outcome that cli_review reports via
          # skipped_reason. It must resolve to a genuine passed verdict, not
          # fall through to degraded -- degraded's framing ("all reviewer
          # models failed or were unavailable") misdescribes a diff that was
          # never sent to any model at all.
          if skipped_reason == "empty_diff":
              verdict = "passed"
          elif not models_succeeded:
              verdict = "degraded"
          elif quorum_verdict in ("degraded_quorum", "no_models"):
              verdict = "degraded_quorum"
          elif quorum_verdict == "blocked":
              verdict = "blocked"
          elif quorum_verdict == "passed":
              verdict = "passed"
          else:
              # No quorum block: a reviewer predating OMN-18479. Report
              # degraded_quorum rather than inventing a verdict from a rule
              # this gate no longer implements -- fail closed, do not guess.
              verdict = "degraded_quorum"

          print(f"verdict={verdict}")
          print(f"blocking_count={blocking}")
          print(f"below_quorum_count={below_quorum}")
          print(f"quorum_verdict={quorum_verdict or 'absent'}")
          print(f"total_findings={total_findings}")
          print(f"models_succeeded={','.join(models_succeeded)}")
          PYEOF
          )

          # Write outputs
          echo "$VERDICT_DATA" >> "$GITHUB_OUTPUT"
          echo "error=" >> "$GITHUB_OUTPUT"
          echo "named_cause=${NAMED_CAUSE}" >> "$GITHUB_OUTPUT"

          # OMN-18415 AC3 — the verdict artifact carries the captured stderr on
          # the SUCCESS path as well. `degraded` is a success exit in the pilot:
          # every model failed mid-review, the gate does not block, and the
          # reason exists only in stderr. Without this the cause of a
          # non-blocking degradation is unreadable after the run, which is how
          # this gate spent an unknown number of PRs reviewing nothing.
          VERDICT_DATA="$VERDICT_DATA" NAMED_CAUSE="$NAMED_CAUSE" \
          STDERR_LOG="$STDERR_LOG" REVIEW_EXIT="$REVIEW_EXIT" \
          REVIEW_JSON_FILE="$REVIEW_JSON_FILE" python3 - <<'PY'
          import json
          import os

          fields = {}
          for line in os.environ["VERDICT_DATA"].splitlines():
              if "=" in line:
                  key, _, value = line.partition("=")
                  fields[key.strip()] = value
          with open(os.environ["STDERR_LOG"], encoding="utf-8", errors="replace") as handle:
              captured = handle.read()
          models = fields.get("models_succeeded", "")

          # OMN-18415 — THE FINDINGS THEMSELVES, not just how many there were.
          # `blocked` is the one verdict that stops a merge, and the first live
          # run of this gate on a real diff blocked with `blocking findings: 1`
          # and NOTHING anywhere naming the finding: the reviewer's JSON went to
          # a shell variable that was parsed for counts and then discarded. A
          # required gate whose refusal cannot be read is not reviewable, it is
          # only obstructive.
          # Field names are ModelReviewFindingObserved's
          # (omniintelligence.review_pairing.models): rule_id, file_path,
          # line_start, normalized_message / raw_message. Guessing them wrongly
          # is not hypothetical -- the first revision of this block guessed
          # title/message/file and rendered a finding row of three empty cells,
          # which reads as "the reviewer found nothing to say" rather than "this
          # code read the wrong keys". So each value falls back through its
          # alternatives, and `raw` keeps the finding verbatim: a renamed field
          # upstream then costs a worse-looking row, never a lost finding.
          findings = []
          with open(os.environ["REVIEW_JSON_FILE"], encoding="utf-8") as handle:
              review = json.load(handle)
          for result in review.get("results", []):
              if not result.get("success"):
                  continue
              for finding in result.get("findings", []):
                  findings.append(
                      {
                          "severity": finding.get("severity") or "unknown",
                          "rule": finding.get("rule_id") or finding.get("title") or "",
                          "message": (
                              finding.get("normalized_message")
                              or finding.get("raw_message")
                              or finding.get("message")
                              or ""
                          ),
                          "file": finding.get("file_path") or finding.get("file") or "",
                          "line": finding.get("line_start") or finding.get("line"),
                          "model": result.get("model", ""),
                          "raw": finding,
                      }
                  )

          payload = {
              "verdict": fields.get("verdict", "unknown"),
              "blocking_count": int(fields.get("blocking_count", "0") or 0),
              "below_quorum_count": int(fields.get("below_quorum_count", "0") or 0),
              "quorum": review.get("quorum"),
              "total_findings": int(fields.get("total_findings", "0") or 0),
              "models_succeeded": [m for m in models.split(",") if m],
              "review_exit": int(os.environ["REVIEW_EXIT"]),
              "error": "",
              "named_cause": os.environ.get("NAMED_CAUSE", ""),
              "findings": findings,
              "stderr": captured,
          }
          with open(os.environ["VERDICT_ARTIFACT"], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
          PY

          # And into the job log, so the refusal is readable without
          # downloading anything.
          echo "::group::adversarial findings"
          python3 - "$VERDICT_ARTIFACT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          for finding in payload.get("findings", []):
              location = finding.get("file") or "(no file)"
              if finding.get("line"):
                  location = f"{location}:{finding['line']}"
              print(f"[{finding.get('severity')}] {location} — {finding.get('rule')}")
              if finding.get("message"):
                  print(f"    {finding['message']}")
              elif not finding.get("rule"):
                  # Nothing mapped. Print the finding verbatim rather than an
                  # empty line that reads as an empty finding.
                  print(f"    {json.dumps(finding.get('raw', {}), sort_keys=True)}")
          if not payload.get("findings"):
              print("(none)")
          PY
          echo "::endgroup::"

          # Set exit code: blocked → 1, degraded_quorum → 1 (no verdict was
          # established, and the absence of a verdict is not a passing one),
          # everything else → 0 (pilot: degraded is informational).
          VERDICT=$(echo "$VERDICT_DATA" | grep '^verdict=' | cut -d= -f2)
          if [ "$VERDICT" = "blocked" ] || [ "$VERDICT" = "degraded_quorum" ]; then
            exit 1
          fi

      # OMN-18415 AC3. `if: always()` because the run that most needs its stderr
      # read is the one that failed — including the fork refusal above, which
      # exits before the reviewer runs at all.
      - name: Upload the verdict artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hostile-review-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/hostile-review-verdict.json
          if-no-files-found: warn
          retention-days: 14

      - name: Post review summary as PR comment
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@v9
        env:
          REVIEW_VERDICT: ${{ steps.review.outputs.verdict }}
          REVIEW_BLOCKING: ${{ steps.review.outputs.blocking_count }}
          REVIEW_TOTAL: ${{ steps.review.outputs.total_findings }}
          REVIEW_MODELS: ${{ steps.review.outputs.models_succeeded }}
          REVIEW_ERROR: ${{ steps.review.outputs.error }}
          REVIEW_NAMED_CAUSE: ${{ steps.review.outputs.named_cause }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const verdict = process.env.REVIEW_VERDICT || 'unknown';
            const blocking = parseInt(process.env.REVIEW_BLOCKING || '0');
            const total = parseInt(process.env.REVIEW_TOTAL || '0');
            const models = process.env.REVIEW_MODELS || '';
            const error = process.env.REVIEW_ERROR || '';
            // OMN-18415 AC3: the single most informative line of the reviewer's
            // stderr, which used to go to /dev/null. The full capture is in the
            // uploaded `hostile-review-verdict-*` artifact.
            const namedCause = process.env.REVIEW_NAMED_CAUSE || '';

            // OMN-18415: read the findings out of the verdict artifact the
            // review step wrote. They are NOT passed as step outputs -- a
            // finding is multi-line free text from a model, and threading that
            // through GITHUB_OUTPUT means choosing a delimiter the model could
            // emit. Reading the file has no such failure mode.
            const fs = require('fs');
            let findings = [];
            try {
              const raw = fs.readFileSync(
                `${process.env.GITHUB_WORKSPACE}/hostile-review-verdict.json`,
                'utf8',
              );
              findings = JSON.parse(raw).findings || [];
            } catch (err) {
              core.info(`no verdict artifact to read findings from: ${err.message}`);
            }

            const icon = {
              passed: '✅',
              blocked: '🚫',
              degraded: '⚠️',
              degraded_quorum: '🚫',
              infra_error: '🚫',
              unavailable_fork_isolation: '🚫',
            }[verdict] || '❓';

            const label = {
              passed: 'PASSED',
              blocked: 'BLOCKED',
              degraded: 'DEGRADED (informational)',
              degraded_quorum: 'DEGRADED QUORUM — no verdict (blocking)',
              infra_error: 'INFRA ERROR (blocking)',
              unavailable_fork_isolation: 'UNAVAILABLE — fork isolation (blocking)',
            }[verdict] || verdict.toUpperCase();

            let note = '';
            if (verdict === 'degraded') {
              note = '\n\n> **Note**: All reviewer models failed or were unavailable. ' +
                'Degraded results are informational during the pilot phase (OMN-8524) and do not block merge.';
              if (error) note += ` Error: \`${error}\``;
            } else if (verdict === 'blocked') {
              note = '\n\n> **Action required**: Resolve the CRITICAL/ERROR findings below. ' +
                'Only findings raised by at least two distinct reviewer models block (OMN-18479); ' +
                'findings below that threshold are listed as warnings and do not.';
            } else if (verdict === 'degraded_quorum') {
              note = '\n\n> **Action required**: fewer reviewer models succeeded than cross-model ' +
                'agreement requires, so NO verdict was established. An absent verdict is not a passing ' +
                'one, so this fails the required gate closed. Re-run the job; if a model endpoint is ' +
                'genuinely down, escalate rather than bypassing.';
              if (error) note += ` Error: \`${error}\``;
            } else if (verdict === 'infra_error') {
              note = '\n\n> **Action required**: the reviewer CLI failed after 2 attempts (dependency install or crash) — ' +
                'this now fails the required gate closed instead of silently passing. Re-run the job; if infra is ' +
                'genuinely down, escalate rather than bypassing.';
              if (error) note += ` Error: \`${error}\``;
            } else if (verdict === 'unavailable_fork_isolation') {
              note = '\n\n> **Action required**: this is a fork-origin pull request. The adversarial reviewer ' +
                'calls a LAN-only model on the lab host, and untrusted fork code is never placed on the ' +
                'self-hosted fleet (OMN-16683), so no verdict can be produced here. A maintainer must ' +
                'review this change directly — this gate fails closed rather than passing silently.';
              if (error) note += ` Reason: \`${error}\``;
            }

            // The named cause goes in the body for every verdict that has one,
            // not only the blocking ones: a `degraded` run does not block, so
            // its cause would otherwise be invisible (OMN-18415 AC3).
            if (namedCause) {
              note += `\n\n> **Reviewer stderr (named cause)**: \`${namedCause}\``;
            }

            // The findings block. `blocked` is the only verdict that stops a
            // merge, and before OMN-18415 it reported a COUNT and nothing else,
            // so the one thing a reader needed was the one thing absent.
            let findingsBlock = '';
            if (findings.length > 0) {
              const rows = findings.map(f => {
                const where = f.line ? `${f.file}:${f.line}` : (f.file || '_(no file)_');
                let text = f.message || '';
                if (!text && !f.rule) {
                  // Nothing mapped: show the finding verbatim rather than an
                  // empty row, which reads as a reviewer with nothing to say.
                  text = JSON.stringify(f.raw || {});
                }
                text = text.replace(/\|/g, '\\|').replace(/\n/g, ' ');
                const rule = f.rule ? `**${f.rule}** ` : '';
                return `| \`${f.severity}\` | ${where} | ${rule}${text} |`;
              });
              findingsBlock = [
                '',
                '### Findings',
                '',
                '| Severity | Location | Finding |',
                '|---|---|---|',
                ...rows,
                '',
              ].join('\n');
            }

            const body = [
              `## ${icon} Hostile Reviewer — ${label}`,
              '',
              `**Blocking findings** (critical/error): ${blocking}  `,
              `**Total findings**: ${total}  `,
              `**Models succeeded**: ${models || 'none'}`,
              note,
              findingsBlock,
              '',
              '---',
              '',
              '**Gate semantics (pilot phase)**',
              '',
              '| Verdict | Meaning | Blocks merge? |',
              '|---------|---------|---------------|',
              '| `passed` | No critical/error findings | No |',
              '| `blocked` | CRITICAL or ERROR findings found | **Yes** |',
              '| `degraded` | Reviewer ran but every model failed mid-run | No (pilot) |',
              '| `infra_error` | cli_review failed to run at all (install/crash) after 2 attempts | **Yes** |',
              '| `unavailable_fork_isolation` | Fork PR — the LAN-only model is unreachable and the fleet is off limits | **Yes** |',
              '',
              '_Powered by [omniintelligence.review_pairing.cli_review](https://github.com/OmniNode-ai/omniintelligence) — node-based adversarial review via HandlerLlmCliSubprocess (OMN-8524)_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body.includes('Hostile Reviewer')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  hostile-review-gate:
    name: Hostile Review Gate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.base.ref == 'dev'))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    needs: [hostile-review]
    if: always()
    steps:
      - name: Evaluate gate
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Hostile Review Gate ==="
          RESULT="${{ needs.hostile-review.result }}"
          echo "hostile-review: $RESULT"

          # Four-way triage with a default-deny catch-all (OMN-15304 vector 6,
          # the omnimarket#1926 shape). Blocking only on `failure` let a
          # CANCELLED reviewer render this REQUIRED context green with no
          # adversarial verdict in existence — exactly the omnimarket#1920
          # incident (reviewer cancelled 04:13:14Z, gate SUCCESS 04:13:21Z),
          # and `if: always()` above guarantees that path is reached. Anything
          # that is not `success` is the ABSENCE of a verdict, not a passing
          # one; an unrecognised future result value fails closed too.
          case "$RESULT" in
            success)
              ;;
            failure)
              echo "::error::Hostile reviewer job failed — CRITICAL/ERROR findings were reported (resolve them), or cli_review could not run after 2 attempts (infra_error), or this is a fork-origin PR where the LAN-only model is unreachable and the fleet is off limits (unavailable_fork_isolation). The reviewer's stderr is now in the job log and in the uploaded 'hostile-review-verdict-*' artifact (OMN-18415) — read it rather than guessing which."
              exit 1
              ;;
            cancelled|skipped)
              echo "::error::Hostile reviewer produced no verdict (result: $RESULT) — the absence of a verdict is not a passing one."
              exit 1
              ;;
            *)
              echo "::error::Unrecognised hostile-review result '$RESULT' — failing closed."
              exit 1
              ;;
          esac
          echo "Hostile Review Gate PASSED"
