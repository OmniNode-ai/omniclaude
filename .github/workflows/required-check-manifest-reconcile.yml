#
# Required-Check Skip-Vector Guard — privileged manifest reconcile. OMN-14854.
#
# Compares .github/required-checks.yaml (schema v3, REQUIRED rows) against the
# LIVE required_status_checks.contexts for `dev`. Runs ONLY on
# push/schedule/workflow_dispatch — NEVER on pull_request — because reading
# branch protection needs a token scope (administration:read) that must not be
# granted to a PR-triggered workflow (read/exfil risk from a malicious PR).
#
# SCOPE NOTE (OMN-14854, updated OMN-15117): `main`'s required_status_checks
# set is verifiably NOT identical to `dev`'s (confirmed live 2026-07-20 — e.g.
# main additionally requires "Security Gate" and "verify / verify"; dev
# additionally requires "Cross-Repo Boundary Parity" and
# "no-noncanonical-lifecycle-classes"). The manifest is still single-branch
# (dev) in the sense that this job only ever reconciles against `dev` — no
# `main` reconcile step exists here, and adding one against the current
# manifest would still fail on every run by construction (most rows have no
# `branch:` field, i.e. dev-only in practice). OMN-15117 added an optional
# per-row `branch:` field (`reconcile()` in reconcile_manifest_vs_live.py) so
# a specific main-only-required context (`verify / verify`) can be represented
# without corrupting this dev-only reconcile — reconcile() excludes any row
# whose `branch:` doesn't match the branch being checked. This is NOT a full
# `main`-scoped manifest section (the remaining main-only gap, "Security
# Gate", still has no row) — that remains an open follow-up.
#
# This job is NOT itself a required status check (push/schedule cannot be
# gated by required_status_checks anyway). Its failure surfaces as a
# repo-visible red workflow run on dev/main.

name: Required-Check Manifest Reconcile

on:
  push:
    branches: [dev, main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile manifest vs live branch protection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: python -m pip install --quiet "pyyaml>=6.0.0"

      # OMN-14854 open decision (spec Summary item 3): reading
      # required_status_checks needs a token with "Administration" repository
      # permission. GITHUB_TOKEN can NEVER carry that permission — it is not
      # exposed via the `permissions:` block at all (this is a hard GitHub
      # platform limitation, not a configuration gap). BRANCH_PROTECTION_PAT
      # is a fine-grained PAT (Administration: Read) scoped to this repo,
      # provisioned the same way CROSS_REPO_PAT is for cr-thread-gate.yml.
      # Until BRANCH_PROTECTION_PAT is provisioned as a repo secret, this step
      # fails with a clear diagnostic rather than a silent no-op or a
      # misleading GITHUB_TOKEN 403 stack trace.
      - name: Reconcile manifest vs live (dev)
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::BRANCH_PROTECTION_PAT is not provisioned as a repo secret." \
                 "GITHUB_TOKEN cannot read required_status_checks (no Administration" \
                 "permission is exposed to Actions tokens). Provision a fine-grained PAT" \
                 "with Administration:Read on OmniNode-ai/omniclaude and add it as" \
                 "BRANCH_PROTECTION_PAT. Tracked as an open follow-up in OMN-14854."
            exit 1
          fi
          python .github/actions/required-check-skip-guard/reconcile_manifest_vs_live.py \
            --manifest .github/required-checks.yaml \
            --repo "${{ github.repository }}" \
            --branch dev
