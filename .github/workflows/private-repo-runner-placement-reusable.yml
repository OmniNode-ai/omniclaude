#
# Private-repo runner placement gate (reusable). OMN-18205.
#
# Operator ruling, 2026-09-14, firm: a PRIVATE repository never runs CI on
# GitHub-hosted Actions runners. Hosted runners are for PUBLIC repositories,
# where their minutes are free. This is the CI half of that ruling; the
# exported `private-repo-runner-placement` pre-commit hook runs the SAME
# script, so a local verdict and a CI verdict cannot diverge (operating rule 5).
#
# PLACEMENT IS READ PER TRIGGER EVENT (OMN-18205 residual 4). The gate
# evaluates each job's `runs-on` once per cell of a fixed event matrix --
# pull_request from a fork and from the base repository, pull_request_review in
# both shapes, push, workflow_dispatch, repository_dispatch, schedule,
# merge_group, workflow_run, release -- and fails when any cell except a fork
# pull request selects a GitHub-hosted label. That is a property of the CHECKED
# TREE, not of the event this run happens to be firing under, so a pull-request
# run already judges every event. The `push` trigger in each caller exists for
# a different reason: it is what makes the default branch itself judged after a
# merge, which is the surface where OMN-18616 went unseen for nine days.
#
# WHY IT MUST RUN ON THE FLEET ITSELF. This job judges private repositories,
# so by its own rule it cannot be placed on a hosted runner: a gate that has to
# break the invariant it enforces in order to run is not an enforcement
# surface. It is pinned to the fleet label rather than routed through any seam
# for the same reason the routing-decision job in omnibase_infra is pinned --
# it must not share fate with the variable it reads.
#
# Usage in caller repos:
#   jobs:
#     private-repo-runner-placement:
#       uses: OmniNode-ai/omniclaude/.github/workflows/private-repo-runner-placement-reusable.yml@<immutable-sha>
#
# Surfaced check context in the caller:
#   `private-repo-runner-placement / private-repo-runner-placement`
#
# ONE pin, not two: the script is checked out at validated `job.workflow_sha`
# -- the SHA this reusable was resolved at -- so the caller`s `uses:` SHA is the
# single source of truth for both the workflow and the validator. Pin to an
# omniclaude commit on `dev`; `main` is release-synced and does not carry it.

name: Private Repo Runner Placement (reusable)

on:
  workflow_call:
    inputs:
      report_reusable_calls:
        description: >-
          Also list `uses:` jobs, whose placement is decided in the repository
          that DEFINES the called workflow and is judged there by this same
          gate. Reported rather than omitted so a cross-repo hop is visible.
        required: false
        default: true
        type: boolean
    secrets:
      ACTIONS_VARIABLES_TOKEN:
        description: >-
          A credential that can read Actions VARIABLES, at repository and
          organisation scope. The Actions job token cannot read either: that
          needs the Variables permission, which a workflow cannot grant itself
          through `permissions:`, and both scopes return HTTP 403 without one.
          Optional, because the gate reads every scope lazily and a repository
          whose jobs pin their labels as literals never consults a variable at
          all -- it refuses by name only when a value it actually needs is
          unresolvable. Pass `secrets.CROSS_REPO_PAT`, an organisation secret
          visible to every repository.
        required: false

permissions:
  contents: read

jobs:
  private-repo-runner-placement:
    name: private-repo-runner-placement
    runs-on: [self-hosted, omnibase-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout the caller repository
        uses: actions/checkout@v7

      # OMN-18431: EVERY BRANCH THAT RUNS WORKFLOWS IS JUDGED, NOT ONLY THIS
      # CHECKOUT. A push reads the pushed branch's own workflow files and a pull
      # request reads its base branch's, so a branch the caller file never
      # reached was never judged at all: a stale `main` carried thirteen hosted
      # jobs while this gate reported its repository green from `dev`. The gate
      # reads the other branches from refs/remotes/origin/*, one commit deep,
      # and refuses when they are absent -- a checkout alone holds one tree.
      - name: Fetch every branch tip
        run: git fetch --no-tags --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Resolve the gate pin
        id: pin
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::workflow SHA is empty or is not a lowercase 40-hex commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$WORKFLOW_REPOSITORY" != "OmniNode-ai/omniclaude" ]; then
            echo "::error::workflow repository is '$WORKFLOW_REPOSITORY', not OmniNode-ai/omniclaude. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          echo "private-repo-runner-placement pin: $WORKFLOW_SHA"

      - name: Checkout the validator at this workflow`s own SHA
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omniclaude
          ref: ${{ steps.pin.outputs.sha }}
          path: .private-repo-runner-placement-gate
          persist-credentials: false

      - name: Assert the private-repo-runner-placement checkout is at the pin
        env:
          GATE_PIN: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          if ! checked_out_sha="$(git -C .private-repo-runner-placement-gate rev-parse HEAD)"; then
            echo "::error::could not resolve the fetched private-repo-runner-placement commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$checked_out_sha" != "$GATE_PIN" ]; then
            echo "::error::private-repo-runner-placement checkout is at $checked_out_sha, expected $GATE_PIN. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "private-repo-runner-placement checked out at $checked_out_sha"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install PyYAML==6.0.2

      # GH_TOKEN is the job token: it reads this repository`s own
      # visibility, which is all it can read. It CANNOT read Actions variables
      # at EITHER scope -- both return HTTP 403, measured on seven live runs on
      # 2026-09-16 -- so those reads use ACTIONS_VARIABLES_TOKEN when a caller
      # supplies one, and happen lazily: a repository whose jobs pin their
      # labels as literals never consults a variable and never needs the
      # secret. A failure to read something the verdict depends on is exit 2,
      # never a pass -- see the script`s GateError paths.
      - name: Run the placement gate
        env:
          GH_TOKEN: ${{ github.token }}
          # Used ONLY for Actions-variable reads, at both scopes. Empty when
          # the caller passes nothing, in which case those reads are attempted
          # with the job token and the gate refuses by name if it needed an
          # answer from one.
          GH_TOKEN_VARIABLES: ${{ secrets.ACTIONS_VARIABLES_TOKEN }}
          # The branch whose tree is checked out: a pull request's BASE (the
          # merge checkout supersedes its old tip) or, on a push, the pushed
          # branch. Passed through env, never interpolated into the script.
          EVENT_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          args=(--repo-root . --repo "${GITHUB_REPOSITORY}")
          # Not an input: enumeration is how the gate sees a branch its caller
          # file never reached, and an input that could turn it off would be a
          # bypass by another name.
          args+=(--every-workflow-branch --event-branch "${EVENT_BRANCH}")
          if [ "${{ inputs.report_reusable_calls }}" = "true" ]; then
            args+=(--report-reusable-calls)
          fi
          python3 .private-repo-runner-placement-gate/scripts/private_repo_runner_placement_gate.py "${args[@]}"
