#
# OMN-8837: Poll for CLEAN+armed PRs that missed the auto-merge event trigger.
# auto-merge.yml only fires on fresh events; a PR that becomes CLEAN while no
# event is in flight sits stuck indefinitely. This workflow runs every 15 minutes
# and calls enqueuePullRequest (GraphQL) on any PR that is CLEAN, has an
# autoMergeRequest set, and is not already in the merge queue.
#
# OMN-20074: this file also hosts the OMN-18836 dev-head monitor, moved here
# from occ-companion-merge-heal.yml so that retiring OCC does not delete it.
# Each job keeps its own cadence: a scheduled run carries the cron string that
# fired it in github.event.schedule, and each job's `if:` runs it only on its
# own entry. A manual dispatch runs both.
name: Auto-Merge Stale Poller

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dev-head-monitor-dry-run:
        description: Run the dev-head monitor without filing issues or comments. The poller ignores it.
        required: false
        default: false
        type: boolean

# Read-only by default. Each job widens only its own grant.
permissions:
  contents: read

jobs:
  poll-and-enqueue:
    name: Enqueue Stale CLEAN+Armed PRs
    if: github.event_name != 'schedule' || github.event.schedule == '*/15 * * * *'
    permissions:
      contents: read
      pull-requests: write
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    steps:
      - name: Enqueue stale CLEAN+armed PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          OWNER="${GH_REPO%%/*}"
          REPO="${GH_REPO##*/}"

          # Fetch all open PRs with merge state, auto-merge, and merge queue status
          # Paginate via cursor until hasNextPage is false
          ALL_NODES="[]"
          CURSOR=""
          while true; do
            if [ -n "$CURSOR" ]; then
              PAGE=$(gh api graphql \
                -f query='query($owner: String!, $repo: String!, $after: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequests(states: OPEN, first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        number id
                        author { login }
                        mergeStateStatus
                        autoMergeRequest { mergeMethod }
                        isInMergeQueue isDraft
                      }
                    }
                  }
                }' -f owner="$OWNER" -f repo="$REPO" -f after="$CURSOR")
            else
              PAGE=$(gh api graphql \
                -f query='query($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequests(states: OPEN, first: 100) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        number id
                        author { login }
                        mergeStateStatus
                        autoMergeRequest { mergeMethod }
                        isInMergeQueue isDraft
                      }
                    }
                  }
                }' -f owner="$OWNER" -f repo="$REPO")
            fi
            ALL_NODES=$(echo "$ALL_NODES $PAGE" | jq -s '.[0] + [.[1].data.repository.pullRequests.nodes[]]')
            HAS_NEXT=$(echo "$PAGE" | jq -r '.data.repository.pullRequests.pageInfo.hasNextPage')
            [ "$HAS_NEXT" = "true" ] || break
            CURSOR=$(echo "$PAGE" | jq -r '.data.repository.pullRequests.pageInfo.endCursor')
          done

          echo "$ALL_NODES" | jq -r '
            .[] |
            select(
              .author.login == "jonahgabriel" and
              .mergeStateStatus == "CLEAN" and
              .autoMergeRequest != null and
              .isInMergeQueue == false and
              .isDraft == false
            ) |
            "\(.number) \(.id)"
          ' | while read -r PR_NUMBER NODE_ID; do
            echo "Enqueueing PR #$PR_NUMBER (node: $NODE_ID)"
            RESULT=$(gh api graphql -f query='
              mutation($prId: ID!) {
                enqueuePullRequest(input: { pullRequestId: $prId }) {
                  mergeQueueEntry {
                    id
                    position
                  }
                }
              }
            ' -f prId="$NODE_ID" 2>&1)
            ENQUEUE_EXIT=$?

            if echo "$RESULT" | grep -q '"id"'; then
              POSITION=$(echo "$RESULT" | jq -r '.data.enqueuePullRequest.mergeQueueEntry.position // "?"')
              echo "PR #$PR_NUMBER enqueued at position $POSITION"
            elif echo "$RESULT" | grep -qiE "already in the queue|already enqueued"; then
              echo "PR #$PR_NUMBER already in queue (race condition tolerated)"
            else
              echo "ERROR: PR #$PR_NUMBER enqueue failed (exit $ENQUEUE_EXIT): $RESULT" >&2
              exit 1
            fi
          done

          echo "Stale poller complete"

  # OMN-18836: native effect on its own ten-minute schedule. The contract
  # executor carries tick/result data over Kafka. The scoped App token stays in
  # this process and is never part of a bus payload. OMN-20074 moved it here
  # from occ-companion-merge-heal.yml, which the OCC retirement deletes.
  dev-head-red-alert:
    name: Record red dev heads
    if: github.event_name != 'schedule' || github.event.schedule == '*/10 * * * *'
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: >-
      ${{ fromJSON(vars.OMNI_LAB_BUS_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Resolve the locked CI bus source
        id: bus_pin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          from urllib.parse import urlsplit
          lock = tomllib.loads(Path("uv.lock").read_text())
          package = next(item for item in lock["package"] if item["name"] == "omnimarket")
          sha = urlsplit(package["source"]["git"]).fragment
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("CI bus source is not locked to a full commit sha")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"rev={sha}\n")
          PY
      - name: Fetch the existing CI bus policy and resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OmniNode-ai/omnimarket
          ref: ${{ steps.bus_pin.outputs.rev }}
          path: .monitor-bus
          persist-credentials: false
          # OMN-9050: omnimarket#4151 removed publish_occ_autobind_command.py;
          # read the shared ci_bus_lanes.py module instead.
          sparse-checkout: |
            scripts/ci_bus_lanes.py
          sparse-checkout-cone-mode: false
      # OMN-20935: the dev lane's broker and transport are private deployment
      # config, so they are read from the CI overlay repository (the org Actions
      # variable OMNI_CI_OVERLAY_REPO, a bare repository name under this owner)
      # with a read-only App token, not from omnimarket. An unset variable, an
      # unreadable repository or a missing file fails the job: there is no
      # in-repo lane table to fall back to. The file is data, read unpinned from
      # the overlay's default branch and validated by the policy loader below.
      - name: Resolve the CI overlay
        id: ci-overlay
        env:
          CI_OVERLAY_REPO: ${{ vars.OMNI_CI_OVERLAY_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${CI_OVERLAY_REPO}" ]; then
            echo "::error::no CI bus lane table configured: OMNI_CI_OVERLAY_REPO is unset, so no CI overlay supplies config/lab/ci_bus_lanes.yaml. Put your lane table in a repository of your own and set OMNI_CI_OVERLAY_REPO to its name."
            exit 1
          fi
          if [[ ! "${CI_OVERLAY_REPO}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::OMNI_CI_OVERLAY_REPO must be a bare repository name, got '${CI_OVERLAY_REPO}'"
            exit 1
          fi
          echo "name=${CI_OVERLAY_REPO}" >> "$GITHUB_OUTPUT"
      - name: Mint a read-only CI overlay token
        id: ci-overlay-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.ci-overlay.outputs.name }}
          permission-contents: read
      - name: Fetch the CI bus lane table from the CI overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ steps.ci-overlay.outputs.name }}
          token: ${{ steps.ci-overlay-token.outputs.token }}
          path: .monitor-bus-overlay
          persist-credentials: false
          sparse-checkout: |
            config/lab/ci_bus_lanes.yaml
          sparse-checkout-cone-mode: false
      - name: Assert the CI overlay carries the lane table
        run: |
          set -euo pipefail
          if [ ! -s .monitor-bus-overlay/config/lab/ci_bus_lanes.yaml ]; then
            echo "::error::the CI overlay carries no config/lab/ci_bus_lanes.yaml; the dev CI bus cannot be resolved"
            exit 1
          fi
      - name: Resolve watched repositories from data
        id: watchlist
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path("src/omniclaude/nodes/node_dev_head_monitor_effect/dev_head_watch.json").read_text())
          names = sorted({target["repo"].split("/")[-1] for target in config["targets"]})
          if not names:
              raise SystemExit("watchlist resolved to no repositories")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("repositories<<EOF\n" + "\n".join(names) + "\nEOF\n")
          PY
      - name: Mint a scoped installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: ${{ steps.watchlist.outputs.repositories }}
          permission-actions: read
          permission-pull-requests: write
      - name: Run the native monitor contract over the declared CI bus
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dev-head-monitor-dry-run == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # Resolve the platform versions from this checkout's existing lock.
          mapfile -t packages < <(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("uv.lock").read_text())
          for name in ("omnibase-core", "omnibase-infra"):
              package = next(item for item in lock["package"] if item["name"] == name)
              print(f"{name}=={package['version']}")
          PY
          )
          uv run --no-project --with "${packages[0]}" --with "${packages[1]}" --with click python - <<'PY'
          import asyncio, importlib.util, json, logging, os, sys, tempfile, uuid
          import yaml
          from pathlib import Path
          from omnibase_core.runtime.runtime_local import RuntimeLocal
          from omnibase_infra.event_bus.service_topic_manager import TopicProvisioner

          logging.basicConfig(level=logging.INFO)
          path = Path(".monitor-bus/scripts/ci_bus_lanes.py")
          spec = importlib.util.spec_from_file_location("monitor_ci_bus_policy", path)
          if spec is None or spec.loader is None:
              raise SystemExit("CI bus resolver is unreadable")
          policy = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = policy
          spec.loader.exec_module(policy)
          overlay = policy.load_lane_overlay(Path(".monitor-bus-overlay/config/lab/ci_bus_lanes.yaml"))
          mode, broker = policy.resolve_lane_broker(overlay, "dev")
          if mode != policy.MODE_CONCRETE or not broker:
              raise SystemExit("dev CI bus is not declared as a concrete broker")
          injected = os.environ.get("KAFKA_BOOTSTRAP_SERVERS", "").strip()
          if injected and injected != broker:
              raise SystemExit("injected broker differs from the declared dev CI bus")
          protocol, mechanism = policy.resolve_lane_security(overlay, "dev")
          if protocol.startswith("SASL_") and not all(os.environ.get(name) for name in ("KAFKA_SASL_USERNAME", "KAFKA_SASL_PASSWORD")):
              raise SystemExit("declared CI bus credentials are unavailable")
          os.environ["KAFKA_BOOTSTRAP_SERVERS"] = broker
          os.environ["KAFKA_SECURITY_PROTOCOL"] = protocol
          os.environ["KAFKA_SASL_MECHANISM"] = mechanism
          os.environ["KAFKA_ENVIRONMENT"] = "dev"
          # OMN-17427: this node is hosted only here, so no deployed runtime
          # provisions its contract topics and the dev broker does not auto-create
          # them; the run provisions them itself before subscribing.
          contract_path = Path("src/omniclaude/nodes/node_dev_head_monitor_effect/contract.yaml")
          contract = yaml.safe_load(contract_path.read_text())
          topics = contract["event_bus"]["subscribe_topics"] + contract["event_bus"]["publish_topics"]

          async def provision_monitor_topics():
              provisioner = TopicProvisioner(broker, contracts_root=contract_path.parent)
              missing = []
              for topic in topics:
                  if not await provisioner.ensure_topic_exists(topic_name=topic):
                      missing.append(topic)
              if missing:
                  raise SystemExit("dev CI bus did not confirm the monitor contract topics ready: " + ", ".join(missing))

          asyncio.run(provision_monitor_topics())
          with tempfile.TemporaryDirectory(prefix="dev-head-monitor-") as state:
              request = Path(state) / "request.json"
              request.write_text(json.dumps({"correlation_id": str(uuid.uuid4()), "dry_run": os.environ["DRY_RUN"] == "true"}))
              run_monitor_tick = RuntimeLocal(
                  workflow_path=Path("src/omniclaude/nodes/node_dev_head_monitor_effect/contract.yaml"),
                  state_root=Path(state),
                  input_path=request,
                  backend_overrides={"event_bus": "kafka"},
                  timeout=300,
                  host_handlers=True,
              )
              run_monitor_tick.run()
              raise SystemExit(run_monitor_tick.exit_code)
          PY
