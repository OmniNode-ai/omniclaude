name: ONEX Schema Compatibility

# Verifies that omniclaude's ticket contracts are compatible with the schema
# owner. The ticket-contract model is omnibase_core's ModelTicketContract
# (OMN-20885: the change-control repository re-exports it and is no longer read).
# Part of OMN-2452 (per-repo slice of OMN-2380 M4 completion).
#
# This gate:
#   1. Installs omniclaude at its locked omnibase_core and omnibase_spi versions
#   2. Reads the schema_version every contracts/OMN-*.yaml declares
#   3. Runs is_compatible() from omnibase_spi against the schema_version of the
#      installed ModelTicketContract; a major mismatch fails
#
# A contracts/ directory with no OMN-*.yaml fails. A repository with no
# contracts/ directory reads no ticket contract, so there is nothing to check.
#
# When this gate fails:
#   - A contract declares a schema_version major that omnibase_core cannot read,
#     or an unparseable one: fix that contract.
#   - omnibase_core released a breaking ticket-contract schema change: migrate
#     the contracts before moving the omnibase-core pin in uv.lock.

on:
  push:
    branches: [main, develop, 'hotfix/**']
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:

# OMN-19644: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


env:
  PYTHON_VERSION: '3.12'
  UV_PYTHON: '3.12'
  UV_CONCURRENT_DOWNLOADS: '1'
  UV_HTTP_TIMEOUT: '900'
  UV_SYNC_ATTEMPTS: '5'
  UV_SYNC_RETRY_DELAY_SECONDS: '10'
  UV_TORCH_BACKEND: cpu

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@13ceae69c246a33c9fc8fc4b33f83fb66b89edc6
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  schema-compat:
    needs: occ-preflight
    name: ONEX Change Control Schema Compatibility
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.base.ref == 'dev'))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 20
    # Only run on PRs from the same repo
    if: needs.occ-preflight.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Install Python
        run: uv python install "${PYTHON_VERSION}"

      - name: Install native build toolchain
        run: |
          if command -v cc >/dev/null 2>&1; then
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y build-essential
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y build-essential
            exit 0
          fi
          echo "::warning::C compiler not found and this runner cannot install build-essential; continuing so uv can use wheels or report the actual build failure"

      - name: Load cached venv
        if: ${{ vars.OMNI_ENABLE_VENV_CACHE_RESTORE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: uv-schema-compat-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install omniclaude dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          attempt=1
          until uv sync --frozen --python "${PYTHON_VERSION}"; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::uv sync failed after ${attempt} attempt(s)"
              exit "$status"
            fi

            sleep_seconds=$((UV_SYNC_RETRY_DELAY_SECONDS * attempt))
            echo "::warning::uv sync attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed with exit ${status}; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Check ticket-contract schema compatibility
        working-directory: ${{ github.workspace }}
        run: |
          uv run python3 - <<'PY'
          import sys
          from pathlib import Path

          import yaml
          from omnibase_core.models.ticket.model_ticket_contract import ModelTicketContract
          from omnibase_spi.contracts.pipeline.contract_schema_compat import is_compatible

          reader_version = str(ModelTicketContract.model_fields["schema_version"].default)
          contracts_dir = Path("contracts")
          if not contracts_dir.is_dir():
              print("No contracts/ directory: this repository reads no ticket contract.")
              sys.exit(0)
          paths = sorted(contracts_dir.glob("OMN-*.yaml"))
          if not paths:
              print("::error::contracts/ holds no OMN-*.yaml ticket contract")
              sys.exit(1)

          print(f"omnibase_core ModelTicketContract schema_version (reader): {reader_version}")
          broken = []
          for path in paths:
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  broken.append((path, "not a mapping"))
                  continue
              wire_version = str(data.get("schema_version", reader_version))
              try:
                  compatible = is_compatible(wire_version=wire_version, reader_version=reader_version)
              except ValueError as exc:
                  broken.append((path, str(exc)))
                  continue
              if not compatible:
                  broken.append((path, f"schema_version {wire_version} vs reader {reader_version}"))

          for path, reason in broken:
              print(f"::error file={path.as_posix()}::{path.as_posix()}: {reason}")
          if broken:
              print(f"ERROR: {len(broken)} of {len(paths)} ticket contract(s) are incompatible with omnibase_core's ModelTicketContract.")
              print("  A major mismatch means omnibase_core released a breaking ticket-contract")
              print("  schema change, or a contract declares a major this core cannot read.")
              sys.exit(1)
          print(f"OK: {len(paths)} ticket contract(s) compatible with omnibase_core schema_version {reader_version}")
          PY

