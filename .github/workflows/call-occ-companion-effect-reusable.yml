#
# call-occ-companion-effect-reusable.yml
#
# Reusable occ-companion-effect publisher (OMN-14941, the born path for the
# canonical RSD-3 OCC writer). On a ticketed product PR (opened/synchronize) it
# publishes `onex.cmd.omnimarket.occ-companion-effect-requested.v1`; the .201
# dev-lane effects runtime (node_occ_companion_effect) consumes it, runs the
# deterministic read -> compute -> write OCC-companion cycle, and stamps
# `Evidence-Source: OCC#<n>` back onto the product PR. Only this path mints
# `occ:machine-minted` + `minted_by_node=true`.
#
# WHY A REUSABLE (single source of truth): same construction as
# call-occ-autobind-reusable.yml. The publish LOGIC lives in exactly one place —
# omnimarket's canonical `scripts/publish_occ_companion_effect_command.py`,
# which file-path-loads its sibling `scripts/publish_occ_autobind_command.py`
# for the OMN-14801/OMN-14813 lane-overlay + trusted-runner + producer helpers,
# resolves `config/ci_bus_lanes.yaml` for the lane broker, and reads the topic
# constant from `src/omnimarket/events/topics.py`. This workflow does NOT copy
# or re-implement any of that; it sparse-checks-out those FOUR files (the full
# file-path-load closure — the sibling script is required, not optional) and
# runs the publisher verbatim. omnimarket is PUBLIC, so the caller's default
# GITHUB_TOKEN can check it out (persist-credentials: false).
#
# SECRET-FREE (deliberate delta vs call-occ-autobind-reusable.yml): the dev
# lane's broker is declared DIRECTLY in the committed omnimarket
# `config/ci_bus_lanes.yaml` overlay (OMN-14813 — config-not-secret, the
# OMN-14800 silent-repoint fix). This workflow therefore injects no Kafka
# bootstrap or SASL values from caller-repo secrets, and caller repos need no
# Kafka-related secrets at all. Do NOT reintroduce the caller-repo
# bootstrap-servers secret env here: the publisher prefers the committed
# overlay value and fail-loud-checks any injected value against it; the
# dev-lane listener is plaintext, so SASL is unused. The static regression
# test (tests/workflows/test_call_occ_companion_effect_reusable.py) pins this.
#
# BROKER / RUNNER BIFURCATION (OMN-14451, identical to the autobind reusable;
# runner carve-out OMN-16691 / OMN-16682 constraint 8): trusted (non-fork) PR
# events run on the self-hosted omnibase-ci runner on .201, which reaches the
# dev-lane broker. That placement is pinned via the DEDICATED
# `OMNI_OCC_AUTOBIND_RUNS_ON_JSON` variable rather than the shared
# `OMNI_TRUSTED_CI_RUNS_ON_JSON` seam, so a hosted-runner migration of general
# CI cannot silently relocate this broker-dependent publisher — see the long
# note on `runs-on:` below. Fork PRs fall back to ubuntu-latest
# where the publisher skips gracefully (exit 0). `RUNNER_IS_TRUSTED` is
# threaded into the publish step so the script fails LOUD (exit 1) on the
# trusted runner for an unresolvable lane / unreachable broker / undelivered
# message, instead of a silent green no-op (OMN-14639).
#
# Usage in caller repos (no Kafka secrets required):
#   jobs:
#     occ-companion-effect:
#       uses: OmniNode-ai/omniclaude/.github/workflows/call-occ-companion-effect-reusable.yml@dev
#       with:
#         lane: dev
#
# Ticket: OMN-14941 (OMN-14811 / OMN-14801 / OMN-14813 / OMN-14451 lineage)

name: OCC Companion Effect Publisher (reusable)

on:
  workflow_call:
    inputs:
      lane:
        description: >
          CI bus lane id resolved against omnimarket config/ci_bus_lanes.yaml
          to decide the bus target (OMN-14801). The dev lane declares a
          concrete committed broker (OMN-14813), so no broker secret is
          injected or required.
        type: string
        required: false
        default: dev
      omnimarket-ref:
        description: >
          git ref of OmniNode-ai/omnimarket to source the canonical publisher
          (scripts/publish_occ_companion_effect_command.py), its file-path-
          loaded sibling (scripts/publish_occ_autobind_command.py), the lane
          overlay (config/ci_bus_lanes.yaml) and the topic registry
          (src/omnimarket/events/topics.py) from. Pinned to `dev` because the
          companion-effect publisher lands on omnimarket `dev` via the
          OMN-14941 omnimarket PR and is NOT promoted to omnimarket `main` —
          at `main` the script does not exist, so a `main` pin is the exact
          E1/OMN-14811 verifier failure class (a 404 sparse checkout).
          RE-PIN TO `main` once OMN-14941 promotes to omnimarket main
          (OMN-14812-style follow-up) so this shared reusable no longer tracks
          a moving `dev` branch.
        type: string
        required: false
        # re-pin to `main` after OMN-14941 promotes to omnimarket main
        # (OMN-14812-style follow-up)
        default: dev
    # No `secrets:` block, deliberately — see SECRET-FREE header note.

permissions:
  contents: read

jobs:
  publish-occ-companion-effect:
    name: Publish occ-companion-effect command
    # This job is a live required context in caller repositories. It must
    # always materialize, including for dependency bots and ticketless PRs.
    # Eligibility is therefore classified by the first executed step; the
    # expensive publisher steps no-op while the job itself terminates green.
    # A job-level `if:` suppresses the check run entirely and leaves branch
    # protection waiting for a context that can never exist (OMN-14864).
    # RUNNER CARVE-OUT (OMN-16691, OMN-16682 constraint 8) — the trusted branch
    # reads a DEDICATED variable, `OMNI_OCC_AUTOBIND_RUNS_ON_JSON` (shared with
    # call-occ-autobind-reusable.yml: one knob for the OCC publisher pair), and
    # NOT the shared `OMNI_TRUSTED_CI_RUNS_ON_JSON` seam that governs
    # lint/test/build.
    #
    # WHY: this job publishes to the TAILNET-ONLY dev-lane broker
    # `omninode-pc.tail75df5e.ts.net:19092`, declared directly in the committed
    # omnimarket config/ci_bus_lanes.yaml overlay (OMN-14813). Only the
    # self-hosted `omnibase-ci` fleet on .201 is on that tailnet; a GitHub-hosted
    # runner cannot resolve the name at all. The OMN-14451/OMN-14639 fail-loud
    # contract below then correctly refuses to exit 0, so no OCC companion is
    # minted, so no `Evidence-Source: OCC#<n>` is stamped, so the receipt gate
    # (OMN-10419) hard-fails EVERY PR in EVERY OCC-gated repo. This is not a
    # degraded-CI seam; it is a merge-wide outage seam. It ran live for 45
    # minutes on 2026-08-26 (22:46:41Z -> 23:32:03Z) when the OMN-16682 Step-1
    # migration flipped `OMNI_TRUSTED_CI_RUNS_ON_JSON` to `["ubuntu-latest"]`;
    # incident OMN-16691.
    #
    # HOW: the literal `["self-hosted","omnibase-ci"]` fallback IS the operating
    # value. `OMNI_OCC_AUTOBIND_RUNS_ON_JSON` is deliberately left UNSET at org
    # and repo scope, so this job pins to the fleet no matter what the shared
    # seam is flipped to, while still leaving one explicit, single-purpose knob
    # for the day the lane broker is reachable from another runner class.
    #
    # `vars` in a reusable workflow resolve in the CALLER's context, so every
    # caller repo inherits this carve-out for free and passes nothing (OMN-16682
    # constraint 7). Fork PRs keep the `OMNI_PUBLIC_PR_RUNS_ON_JSON` path — the
    # publisher skips gracefully there (no broker), and fork isolation
    # (OMN-16683) is untouched by this change.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_OCC_AUTOBIND_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # OMN-14451: same fork/non-fork test as `runs-on:` above, threaded into
    # the publish step so the script can fail loudly (not silently exit 0)
    # when the broker is unreachable on the trusted lane where a real broker
    # MUST exist.
    env:
      RUNNER_IS_TRUSTED: >-
        ${{
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name != github.repository)
          && 'false' || 'true'
        }}
    timeout-minutes: 5

    steps:
      - name: Classify OCC companion-effect eligibility
        id: eligibility
        shell: bash
        env:
          PR_ACTOR: ${{ github.actor }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          eligible=false
          if [[ "$PR_ACTOR" != "dependabot[bot]" &&
                "$PR_ACTOR" != "renovate[bot]" ]] &&
             [[ "$PR_TITLE" == *OMN-* || "$PR_HEAD_REF" == *OMN-* ]]; then
            eligible=true
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          if [[ "$eligible" == false ]]; then
            echo "OCC companion publication is not applicable; required context materialized as a no-op."
          fi

      # The publish LOGIC is owned by omnimarket. Pull ONLY the four files the
      # thin publisher needs (script + file-path-loaded sibling + lane overlay
      # + topic registry) from omnimarket@<ref> into a side path so nothing
      # from the caller checkout is touched. persist-credentials: false — this
      # job never pushes to git.
      - name: Fetch canonical occ-companion-effect publisher (omnimarket)
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OmniNode-ai/omnimarket
          ref: ${{ inputs.omnimarket-ref }}
          path: .occ-companion-effect-src
          persist-credentials: false
          sparse-checkout: |
            scripts/publish_occ_companion_effect_command.py
            scripts/publish_occ_autobind_command.py
            config/ci_bus_lanes.yaml
            src/omnimarket/events/topics.py
          sparse-checkout-cone-mode: false

      # OMN-16723: a sparse checkout of a path that does not exist at the
      # requested ref SUCCEEDS and leaves an empty directory. Without this the
      # miss surfaces later as a bare "python3: can't open file ... [Errno 2]"
      # exit 2, which reads like a publish verdict rather than a plumbing
      # failure. Name the cause here instead.
      - name: Assert omnimarket publisher sources were fetched
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          REF: ${{ inputs.omnimarket-ref }}
        run: |
          set -euo pipefail
          # Paths are spelled as literals rooted in this job's declared
          # checkout `path:`, so the repo-root run:-script guard (OMN-15393)
          # derives that they are foreign-checkout paths rather than missing
          # in-tree scripts. Do not collapse them behind a variable.
          missing=0
          for f in ".occ-companion-effect-src/scripts/publish_occ_companion_effect_command.py" \
                   ".occ-companion-effect-src/scripts/publish_occ_autobind_command.py" \
                   ".occ-companion-effect-src/config/ci_bus_lanes.yaml" \
                   ".occ-companion-effect-src/src/omnimarket/events/topics.py"; do
            if [ ! -f "${f}" ]; then
              echo "::error::omnimarket source ${f} was not fetched."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::The omnimarket ref '${REF}' does not carry the" \
                 "publisher sources listed in this job's sparse-checkout." \
                 "THE PUBLISH DID NOT RUN — this is not a publish failure."
            exit 1
          fi

      - name: Set up Python
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          # Kept deliberately thin — the publisher loads the topic registry and
          # its sibling script by file path and never imports the omnimarket
          # product graph. pyyaml parses the checked-in config/ci_bus_lanes.yaml
          # lane overlay (OMN-14801). pydantic is deliberately absent: neither
          # file-path-loaded script imports it (the wire payload is bare JSON;
          # the consumer model validates it runtime-side).
          pip install --quiet confluent-kafka click pyyaml

      - name: Publish onex.cmd.omnimarket.occ-companion-effect-requested.v1
        if: steps.eligibility.outputs.eligible == 'true'
        # All potentially attacker-controlled inputs (PR body) are passed
        # through environment variables — never interpolated into the script
        # text — to prevent shell injection. PR_BODY powers the publisher-side
        # idempotency skip: the publisher parses the canonical Evidence-Source
        # stamp out of the non-quoted body and RESOLVES it against this PR's
        # own OCC companion branch; it skips only on an OPEN-or-MERGED
        # companion and publishes on every indeterminate answer (OMN-14941,
        # OMN-16710, OMN-15615). No broker env is injected: the publisher
        # resolves the committed overlay broker for the lane directly
        # (OMN-14813).
        #
        # GH_TOKEN (OMN-15615): the caller's default GITHUB_TOKEN, used ONLY
        # for that resolution read. onex_change_control is a PUBLIC repo, so
        # the read succeeds unauthenticated too — but the self-hosted
        # omnibase-ci fleet shares one egress IP and would burn the 60/hr
        # anonymous budget. The token is not required for correctness: an
        # unavailable or rate-limited read is INDETERMINATE, and indeterminate
        # publishes. `permissions: contents: read` is unchanged — a public-repo
        # pulls read needs no additional scope.
        env:
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          LANE: ${{ inputs.lane }}
          GH_TOKEN: ${{ github.token }}
        working-directory: .occ-companion-effect-src
        # AC7 (OMN-15615) — SUCCESS stops being vacuous. The publisher prints
        # exactly one machine-readable verdict marker on every exit-0 path:
        #
        #   skipped_bound_to: OCC#<n>          the skip NAMES the resolved companion
        #   published_correlation_id: <uuid>   a command reached the broker
        #   publish_declined: <reason>         a declared no-op (dry-run, fork
        #                                      runner, in-memory lane, no broker)
        #
        # This job is a required context in every caller repo. Before this gate
        # existed, a run that published nothing was indistinguishable from a run
        # that minted a companion — omniclaude#1969 sat 34 minutes red behind two
        # green publisher runs, and omnibase_core#1540 sat 54. `gh pr checks`
        # pointed at downstream `needs:` cascades; the green job was the last
        # place anyone looked. A run that terminates 0 with NO marker is now a
        # hard failure of this step, so "green publisher, nothing happened" is
        # not representable. tee, not a pipe: the publisher's own exit code must
        # still decide the step (pipefail would work, but tee keeps the log
        # streaming to the job output as it happens).
        run: |
          set -euo pipefail
          python scripts/publish_occ_companion_effect_command.py --lane "${LANE}" \
            2>&1 | tee /tmp/occ-companion-effect-publisher.log
          verdict_count="$(
            grep -cE '^(skipped_bound_to:|published_correlation_id:|publish_declined:)' \
              /tmp/occ-companion-effect-publisher.log || true
          )"
          if [[ "${verdict_count}" -ne 1 ]]; then
            echo "::error::VACUOUS PUBLISHER SUCCESS (OMN-15615): the publisher"\
                 "exited 0 without emitting exactly one verdict marker, so this green check"\
                 "attests only that a script ran. No companion can be assumed."
            exit 1
          fi
