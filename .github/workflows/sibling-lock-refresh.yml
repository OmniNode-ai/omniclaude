#
# OMN-13902: sibling version-alignment automation.
#
# Problem: cross-repo sibling pins (omnibase-core / spi / compat / infra) go
# stale in this repo's uv.lock whenever a sibling releases a new in-range
# version on PyPI. Detection existed (sibling-pin guard, orphan-pin gate) but
# alignment was manual, so drift recurred and blocked work (OMN-13156,
# OMN-13402, OMN-13814 were all one-off repin tickets; the 2026-07-03 R3
# stability refresh was blocked by a stale core pin).
#
# This workflow is the Dependabot-shaped, sibling-release-triggered fix the
# ticket asks for, implemented as the ticket-sanctioned "scheduled workflow per
# repo". On a schedule (and on demand) it runs `uv lock --upgrade-package` for
# each omninode sibling and, if uv.lock changed, opens a bot PR with the
# refreshed lock.
#
# OMN-18752: it now also advances the one class of pin it used to decline.
# `uv lock --upgrade-package` cannot move an immutable git rev because the rev
# is INPUT, not output — so the rev is moved first, in `pyproject.toml`, and uv
# then re-resolves against it (`scripts/relock_git_sources.py`). This is not
# applied to every git source: only a source DECLARED clone-governed in
# `[tool.onex.git-source-authority]` follows its canonical clone, which today
# is `omnimarket` alone, because the OMN-18675 in-process guard inside the venv
# refuses every `onex delegate` when the installed commit differs from that
# clone's HEAD. Every other git rev — onex_change_control, omninode_intelligence
# — is a reviewed pin with no guard behind it and is deliberately left where
# review put it, preserving the Dep-Provenance state OMN-13878 established.
#
# Why this mattered: omnimarket publishes release-on-merge, so its pin went
# stale on essentially every omnimarket PR, and each staleness window was one
# in which the plugin CLI venv and this lock disagreed about which commit was
# correct. OMN-18622, OMN-18639 and a third bump in the same week were all
# hand-filed tickets for exactly that. The advance is FORWARD ONLY: a candidate
# that is not a strict descendant of the current rev is refused and nothing is
# written.
#
# OMN-19998: the nightly sibling-pin train. RULING 2026-10-19T10:11:00Z: "turn
# this into a nightly release train where all the tags are rolled up to a single
# bump". Every [tool.uv.sources] entry pinning an OmniNode-ai sibling by a dev
# merge tag (dev-<UTC YYYYMMDDHHMMSS>-<sha12>) moves to that sibling's newest dev
# tag whose dev CI is green, read from the commit's check runs; a red or unread
# tag is passed over and a pin never moves backwards. Every move rides one PR on
# one fixed branch, updated in place when that PR is already open, so a night is
# one bump per consumer and never one PR per tag. workflow_dispatch runs the same
# train for an urgent fix; dry_run prints the plan and opens nothing. The rewrite
# is omnimarket's node_dev_tag_pin_mover_compute; the selection is
# `scripts/relock_git_sources.py --dev-tag-train`.
#
# Canary rollout (OMN-13902): landed on omnimemory first per canary-before-
# fan-out. Once proven green, the same workflow file is copied to the other
# PyPI-range-pinned consumers (omniclaude, omniintelligence, omnibase_infra).

name: Sibling lock refresh

on:
  schedule:
    # Daily at 06:17 UTC — after the overnight release window, before the day's work.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated sibling packages to refresh (default: all omninode siblings)."
        required: false
        default: ""
      dry_run:
        description: "OMN-19998: print the train's plan and open no PR."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sibling-lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh sibling locks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # OMN-16373: CROSS_REPO_PAT retirement — mint a short-lived
      # onexbot-occ-writer App installation token. A push/PR authored by an
      # App identity (unlike the default GITHUB_TOKEN) triggers downstream
      # CI, which is why this job needed a non-default token in the first
      # place.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: omniclaude
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout (onexbot-occ-writer app token so the bot PR triggers CI)
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # OMN-18752: the clone-governed git sources need a real clone to resolve
      # ancestry against. fetch-depth: 0 is required — a shallow clone cannot
      # answer `merge-base --is-ancestor`, and the forward-only refusal is the
      # whole safety property, so a shallow checkout here would silently turn
      # the refusal into an error and the advance into a no-op.
      # No `token:` here, deliberately. The installation token minted above is
      # scoped `repositories: omniclaude` and carries no grant on omnimarket,
      # so passing it would authenticate as an identity with no access to this
      # repository -- misleading at best, and a 403 rather than a clean
      # anonymous read at worst. omnimarket is public, so the default
      # unauthenticated read is both sufficient and the honest description of
      # what this step does. `persist-credentials: false` keeps this checkout
      # from leaving an extraheader that would override the credentials on any
      # later push (the OMN-18273 confound).
      #
      # `fetch-depth: 0` is required and is not an optimisation to revisit: a
      # shallow clone cannot answer `merge-base --is-ancestor`, and the
      # forward-only refusal is the safety property of this whole step. A
      # shallow checkout would turn every refusal into an error and every
      # advance into a no-op.
      - name: Check out clone-governed siblings
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omnimarket
          ref: dev
          path: .clones/omnimarket
          fetch-depth: 0
          persist-credentials: false

      - name: Advance clone-governed git revs to their clone head
        id: relock_git
        run: |
          set -euo pipefail
          # --package is named EXPLICITLY rather than letting the script
          # discover its own set. With a named package an unresolvable clone
          # RAISES; without one it prints a skip line and exits 0, and a
          # refresh that quietly advanced nothing because a checkout failed is
          # indistinguishable from one that had nothing to do. Adding a
          # clone-governed package means adding it here and to
          # [tool.onex.git-source-authority] in the same change.
          test -d .clones/omnimarket/.git \
            || { echo "::error::omnimarket checkout missing; refusing to report a refresh that examined no clone"; exit 1; }
          python3 scripts/relock_git_sources.py \
            --registry-root "$PWD/.clones" \
            --package omnimarket

      # OMN-19998: the train's members are read from pyproject.toml itself, so
      # each member's repository is cloned here with its tags (blobless: the
      # train reads tag names and their commits, never file contents). A member
      # whose clone fails stops the job: a train that examined no clone is
      # indistinguishable from one with nothing to move.
      - name: Clone the dev-tag train's siblings
        run: |
          set -euo pipefail
          members="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import relock_git_sources as r; print(" ".join(sorted({p.repo for p in r.parse_dev_tag_pins(open("pyproject.toml").read())})))')"
          echo "Train members: ${members:-<none>}"
          for repo in $members; do
            [[ -d ".clones/$repo/.git" ]] && { git -C ".clones/$repo" fetch --quiet --tags origin; continue; }
            git clone --quiet --filter=blob:none --no-checkout \
              "https://github.com/OmniNode-ai/${repo}.git" ".clones/$repo"
          done

      - name: Move dev-tag pins to their newest green dev tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail
          apply=(--apply)
          [[ "$DRY_RUN" == "true" ]] && apply=()
          uv run --frozen python scripts/relock_git_sources.py --dev-tag-train \
            --registry-root "$PWD/.clones" --green-from github \
            --plan-out /tmp/sibling_pin_train_plan.json \
            --body-out /tmp/sibling_pin_train_body.md "${apply[@]}"

      - name: Refresh sibling package locks
        env:
          REQUESTED_PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          set -euo pipefail
          # Default sibling set. Git/tag-pinned siblings are safe to include:
          # `uv lock --upgrade-package` cannot move an immutable rev/tag, so
          # those entries stay put and only PyPI-range-pinned siblings move.
          DEFAULT="omnibase-core omnibase-spi omnibase-compat omnibase-infra omnimarket omniintelligence"
          PACKAGES="${REQUESTED_PACKAGES:-}"
          PACKAGES="${PACKAGES:-$DEFAULT}"
          ARGS=()
          for pkg in $PACKAGES; do
            ARGS+=("--upgrade-package" "$pkg")
          done
          echo "Refreshing: ${ARGS[*]}"
          uv lock "${ARGS[@]}"

      # OMN-17427: the omnimarket rev this lock now pins is the rev Registry
      # Consistency reads omnimarket at (ci.yml `om_pin`, OMN-20001), and at
      # that rev it compares the capture-redaction mirror against omnimarket's
      # owning copy (OMN-18357). Moving the pin without re-deriving the mirror
      # opened a bot PR that was red by construction whenever the bump crossed
      # an omnimarket change to that contract (omniclaude#2770, OMN-18946).
      # The rev is read back out of uv.lock with ci.yml's own grep, never taken
      # from the clone head: relock_git_sources.py leaves the pin where it was
      # when it refuses a non-descendant, and the mirror must match the pin.
      - name: Re-derive the capture-contract mirror at the pinned omnimarket rev
        run: |
          set -euo pipefail
          rev="$(grep -oE 'omnimarket\.git\?rev=[0-9a-f]{40}' uv.lock | head -1 | sed 's/.*rev=//')"
          [[ -n "$rev" ]] || { echo "::error::omnimarket rev not found in uv.lock"; exit 1; }
          git -C .clones/omnimarket -c advice.detachedHead=false checkout --quiet "$rev"
          uv run python scripts/validation/generate_event_registry.py \
            --daemon-registry .clones/omnimarket/src/omnimarket/nodes/node_emit_daemon/registries/topics.yaml \
            --sync-capture-contract

      - name: Detect the refresh delta
        id: delta
        run: |
          set -euo pipefail
          # pyproject.toml moves only when a clone-governed rev advanced; the
          # lock then follows it through the same `uv lock`. Both are part of
          # one change and neither is committable alone — uv refuses to resolve
          # a tree where the dependency string and [tool.uv.sources] disagree.
          # The capture-contract mirror is derived from that rev and rides with
          # it (OMN-17427).
          if git diff --quiet -- uv.lock pyproject.toml src/omniclaude/hooks/contracts/capture_redaction.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "uv.lock unchanged — all sibling pins already fresh."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Sibling lock delta:"
            git --no-pager diff --stat -- uv.lock pyproject.toml src/omniclaude/hooks/contracts/capture_redaction.yaml
          fi

      - name: Open or update the refresh PR
        if: steps.delta.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # OMN-18753: the ticket goes in the BRANCH NAME and the COMMIT
          # MESSAGE, not only the PR title. The Receipt Gate's identity
          # binding reads Evidence-Ticket from the title and then requires
          # that same ticket to appear in the branch name or in one of the
          # PR's commit messages.
          # OMN-19998: ONE fixed branch, so a night with an open refresh PR
          # updates that PR in place instead of opening a second one. The
          # branch is rebuilt from this run's base every time and force-pushed;
          # the previous night's moves are re-derived, never stacked.
          BRANCH="bot/omn-13902-sibling-lock-refresh"
          # OMN-18273: commit as the App this job already authenticates as.
          # The numeric prefix on the address is what links it to the App account.
          git config user.name "onexbot-occ-writer[bot]"
          git config user.email "307849072+onexbot-occ-writer[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add uv.lock pyproject.toml src/omniclaude/hooks/contracts/capture_redaction.yaml
          git commit -m "chore(deps, OMN-13902): refresh omninode sibling locks [bot]" \
            --trailer "Onex-Workflow: ${GITHUB_WORKFLOW}" \
            --trailer "Onex-Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push --force origin "$BRANCH"
          # Build the PR body in a file to avoid heredoc-in-YAML indentation pitfalls.
          # OMN-21282: the train section is the script's one rendered body, naming
          # every dev tag the bump rolls in.
          {
            printf '%s\n' "Automated sibling version-alignment (OMN-13902) and the nightly"
            printf '%s\n' "sibling-pin train (OMN-19998, OMN-21282)."
            printf '\n'
            printf '%s\n' "Every sibling pinned by a dev merge tag was moved to its newest dev"
            printf '%s\n' "merge tag whose dev CI is green; red and unread tags were passed over."
            printf '%s\n' "\`uv lock --upgrade-package\` refreshed the PyPI-range sibling pins."
            printf '%s\n' "Git-pinned siblings declared clone-governed in"
            printf '%s\n' "\`[tool.onex.git-source-authority]\` were advanced to their canonical"
            printf '%s\n' "clone head first, forward only (OMN-18752)."
            printf '\n'
            printf '%s\n' "This branch is rebuilt and force-pushed each night while the PR is open,"
            printf '%s\n' "and this body is rewritten with it."
            printf '\n'
            cat /tmp/sibling_pin_train_body.md
          } > /tmp/sibling_refresh_body.md
          existing="$(gh pr list --head "$BRANCH" --base "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --body-file /tmp/sibling_refresh_body.md
            echo "Updated refresh PR #${existing} in place."
            exit 0
          fi
          # `chore(deps):` prefix is exempt from the pr-title ticket gate, matching
          # the existing publish-downstream-pin-bump bot convention.
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "chore(deps, OMN-13902): refresh omninode sibling locks [bot]" \
            --body-file /tmp/sibling_refresh_body.md
