# Agent Config Schema Validation (OMN-8910)
#
# Validates all agent configuration YAMLs against ModelAgentConfig from
# onex_change_control. Runs on PRs that touch agent config files and on
# merge_group events.
#
# Required status check: "validate-agent-configs"

name: Validate Agent Configs

on:
  pull_request:
    branches: [main, dev, develop]
    paths:
      - "plugins/onex/agents/configs/**/*.yaml"
  workflow_dispatch:

concurrency:
  group: validate-agent-configs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@52851458622f368c3b596c82bf810bc6acce1d5e
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  validate-agent-configs:
    needs: occ-preflight
    name: validate-agent-configs
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5

    steps:
      - name: Checkout omniclaude
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Resolve the pinned onex_change_control rev
        id: occ_pin
        run: |
          set -euo pipefail
          # A sibling is read at the rev this repo's uv.lock pins, never its live
          # branch (ruling 2026-10-01).
          rev="$(grep -oE 'onex_change_control\.git\?rev=[0-9a-f]{40}' uv.lock | head -1 | sed 's/.*rev=//')"
          [[ -n "$rev" ]] || { echo "::error::onex_change_control rev not found in uv.lock"; exit 1; }
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"

      - name: Checkout onex_change_control
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/onex_change_control
          ref: ${{ steps.occ_pin.outputs.rev }}
          path: _onex_change_control
          token: ${{ github.token }}

      - name: Install onex_change_control
        working-directory: ${{ github.workspace }}
        run: |
          cd _onex_change_control
          uv pip install --system .

      - name: Validate agent configs
        working-directory: ${{ github.workspace }}
        run: |
          validate-agent-yaml plugins/onex/agents/configs/*.yaml
