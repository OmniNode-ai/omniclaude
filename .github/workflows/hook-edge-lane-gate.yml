name: Hook Edge Lane Gate

# OMN-17204. Blocking gate on the hook edge's bus lane policy.
#
# The hook edge had no declared lane: which .201 broker a *_bus_mirror.sh
# published to was settled per invocation by shell sourcing order between
# ~/.omnibase/.env, ~/.claude/settings.json and the mac-dev overlay -- three
# surfaces, three answers. That produced three wrong conclusions (OMN-16162
# flipped Done -> Backlog on a wrong-lane probe, OMN-16996 filed then
# falsified, beta/GOAL.md row 0 written unfalsifiable). Detection that is not
# a merge gate gets ignored, so this is one: `Hook Edge Lane Gate` is a
# REQUIRED status check on `dev` (row in .github/required-checks.yaml, asserted
# by ci_summary_gate.py's EXPECTED_EXTERNAL_CONTEXTS, reconciled hourly against
# live branch protection by required-check-manifest-reconcile.yml).
#
# Static mode only. `--live` probes ~/.omnibase/.env and ~/.claude/settings.json,
# neither of which exists on a runner; a check that passes because its inputs
# are absent is worse than no check, so live mode stays off CI and runs on the
# operator Mac (and via the pre-commit hook of the same name).

# No `paths:` filter, deliberately. This context is REQUIRED on `dev`
# (.github/required-checks.yaml), and a required context behind a path filter is
# skip-vector 1: a PR touching only excluded paths never runs the job, the
# context never reports, and the PR sits PENDING forever. The gate is a ~1s
# static read of one contract plus four shell scripts, so it runs on every PR
# rather than buying that wedge back.
on:
  push:
    branches: [main, dev, 'hotfix/**']
  pull_request:
    branches: [main, dev]
    # OMN-17224 asked for a wider `paths:` list here — the drainer
    # (plugins/onex/hooks/lib/hook_emit_drainer.py) and its launchd plist are
    # gate inputs too, and a PR touching only the publisher was slipping past
    # the lane policy, which is how the publisher ended up off the lane. That
    # concern is answered more completely by having NO filter at all: every
    # input, named or not yet written, triggers the gate. Keeping a list would
    # also re-open skip-vector 1 now that the context is REQUIRED.

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  hook-edge-lane-gate:
    needs: occ-preflight
    # Skip-vector 5 (OMN-15057, same fix OMN-16878 applied to deploy-gate):
    # `needs:` with no `if:` means the implicit job condition is `success()`
    # over `needs:`, so a failed or cancelled occ-preflight SKIPS this job — and
    # a skipped job SATISFIES branch protection. Requiring this context without
    # `if: always()` would wire a silent-pass bypass into the very gate that
    # exists because the hook edge had no enforced rule.
    if: always()
    name: Hook Edge Lane Gate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0"

      - name: Validate hook-edge lane pairing
        working-directory: ${{ github.workspace }}
        run: python scripts/validation/validate_hook_edge_lane.py
