name: docs-validate

on:
  pull_request:
  push:
    branches: [main, 'hotfix/**']

# OMN-19644: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  call:
    # self-gating-ok: reusable workflow in omnibase_core — not a required status check on omniclaude main
    uses: OmniNode-ai/omnibase_core/.github/workflows/validate-docs.yml@13ceae69c246a33c9fc8fc4b33f83fb66b89edc6
