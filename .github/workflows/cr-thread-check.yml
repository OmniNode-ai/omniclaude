name: CR Thread Check
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
jobs:
  merge-queue-compat:
    if: github.event_name == 'merge_group'
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Legacy queue compatibility
        working-directory: ${{ github.workspace }}
        run: echo "CR thread gate is enforced by cr-thread-gate-caller.yml on merge queue."

  cr-thread-gate:
    # OMN-14856/OMN-15120 vector-3: no ACTOR-conditional top-level `if:`
    # here -- the caller job MUST always invoke the reusable, or GitHub
    # never creates the composed "cr-thread-gate / CodeRabbit Thread Check"
    # check run at all (see cr-thread-gate-caller.yml for the full
    # mechanism note; mirrors the landed fix in omnibase_core@470d326dc /
    # PR #1549). `merge_group` is still excluded here because
    # `merge-queue-compat` above is this file's dedicated merge_group
    # producer for the same composed context.
    #
    # The former dependabot-actor exemption is dropped outright (the
    # reusable has no actor gate of its own). The former non-PR
    # `issue_comment` guard moves into the `pr-number` computation instead
    # of the job-level `if:` -- a bare-issue comment now resolves
    # pr-number to 0, which the reusable's own script already treats as a
    # graceful no-op.
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/cr-thread-gate.yml
    with:
      pr-number: ${{ format('{0}', github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || 0) }}
    secrets:
      # OMN-16373: CROSS_REPO_PAT retired — pass the onexbot-occ-writer App
      # credentials through instead.
      onexbot-occ-app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
      onexbot-occ-private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
