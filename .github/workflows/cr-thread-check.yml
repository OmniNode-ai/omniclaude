name: CR Thread Check
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
jobs:
  merge-queue-compat:
    if: github.event_name == 'merge_group'
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Legacy queue compatibility
        working-directory: ${{ github.workspace }}
        run: echo "CR thread gate is enforced by cr-thread-gate-caller.yml on merge queue."

  cr-thread-gate:
    # OMN-15120/OMN-14864: no CONDITIONAL top-level `if:` here — the caller
    # job MUST always invoke the reusable, or GitHub never creates the
    # composed check run at all (vector-3). This legacy duplicate caller had
    # the same issue as cr-thread-gate-caller.yml.
    #
    # The former dependabot-actor exemption is dropped, and the non-PR
    # `issue_comment` guard moves into the `pr-number` computation.
    if: >-
      github.event_name != 'merge_group'
    uses: ./.github/workflows/cr-thread-gate.yml
    with:
      pr-number: ${{ format('{0}', github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || 0) }}
    secrets:
      CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
