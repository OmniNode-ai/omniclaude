name: Omnimarket Dispatch Drift Gate

# OMN-13536: required status check. Detects omnimarket version/commit drift
# in the dispatch venvs used by omniclaude skills. When the installed omnimarket
# commit differs from the approved release-lane baseline, skills may execute
# unreviewed or stale node bytes (old stubs, renamed/deleted handlers). This gate
# converts silent runtime drift into a caught regression.
#
# CI behaviour: the gate compares uv.lock against an explicit baseline SHA. The
# broader upgrade to canonical omnimarket@main is blocked by current transitive
# omniintelligence source constraints and should update this baseline separately.

on:
  push:
    branches: [main, dev, 'hotfix/**']
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'scripts/check_omnimarket_dispatch_drift.py'
      - '.pre-commit-hooks/check-omnimarket-dispatch-drift.sh'
      - '.github/workflows/omnimarket-dispatch-drift-gate.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'scripts/check_omnimarket_dispatch_drift.py'
      - '.pre-commit-hooks/check-omnimarket-dispatch-drift.sh'
      - '.github/workflows/omnimarket-dispatch-drift-gate.yml'

# Least-privilege: this gate only reads the checked-out tree and runs a stdlib
# validator.  No write scopes (Checkov CKV2_GHA_1 / write-all default).
permissions:
  contents: read

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  omnimarket-dispatch-drift-gate:
    needs: occ-preflight
    name: Omnimarket Dispatch Drift Gate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Checkout omniclaude
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Resolve expected omnimarket dispatch SHA
        id: expected
        run: |
          # OMN-15968: bumped from v0.4.0 (597fc11a) to the merged omnimarket#2062
          # commit -- adds node_event_emit_effect, the R4 repoint target
          # (OMN-13213 D1 follow-through, epic OMN-15964). Not yet promoted to
          # omnimarket main; this baseline is the sanctioned "approved
          # release-lane baseline while a broader dependency cascade is
          # pending" override this gate's own docstring describes.
          # OMN-16162: bumped 63ea1c1e -> 0bd86dbf (omnimarket dev tip at
          # bump time). The prior pin was #2062's own merge commit and
          # predated six fixes to node_event_emit_effect itself, most
          # critically OMN-15987's topic-override escape hatch -- every
          # omniclaude bus-mirror hook (SessionStart/SessionEnd/
          # UserPromptSubmit/PostToolUse) dispatches through exactly this
          # node and passes a topic-shaped event_type string that only the
          # post-OMN-15987 handler accepts without raising
          # UnknownEventTypeError. Live-verified: every bus-mirror hook
          # raised that error on this Mac against the old pin, and published
          # cleanly (independently confirmed via `rpk topic consume` against
          # the .201 dev-lane broker) after this bump. See pyproject.toml's
          # own override-dependencies comment for the full fix list.
          # OMN-16979: bumped 0bd86dbf -> fa7f0d26 (omnimarket dev tip at
          # bump time). The prior pin predates the canonical projection
          # adapter query surface this PR exercises; locking it locally made
          # ordered/query metadata tests fail against the older adapter.
          # OMN-18622: bumped fa7f0d26 -> 00aefdee, which is the v0.4.113
          # RELEASE commit (published 2026-09-17T15:58:51Z) and is also
          # omnimarket's release-synced main -- not a dev tip. Every previous
          # entry above pinned a dev tip, which is why the pin never tracked
          # the release line and rotted 58 commits: sibling-lock-refresh.yml
          # names omnimarket in its default package set but cannot move it,
          # because `uv lock --upgrade-package` cannot move an immutable rev
          # in [tool.uv.sources]. Pin release commits from here on, so this
          # baseline is a mechanical diff against `gh release list`.
          # Operator ruling, in-session 2026-09-17T19:40:00Z, firm.
          # OMN-18639: bumped 00aefdee -> 9818ae56, the v0.4.114 release
          # commit, 3 commits on. This baseline is the FOURTH touch point of
          # an omnimarket bump and the one most easily missed -- the gate
          # failed on OMN-18622 naming exactly this literal. It is hand-held
          # because sibling-lock-refresh.yml cannot move an immutable rev.
          SHA="9818ae563581c762e91968a65f6cc035bfe4b400"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Expected omnimarket dispatch SHA: $SHA"

      - name: Check omnimarket dispatch drift (lock-consistency mode)
        working-directory: ${{ github.workspace }}
        env:
          OMNIMARKET_EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
          UV_HTTP_TIMEOUT: '900'
        run: |
          # tomllib is stdlib (Python 3.11+); no install step needed.
          # No live daemon venv on CI runners — gate runs in lock-consistency mode.
          # Exits 1 if uv.lock pins omnimarket to a SHA != expected dispatch SHA.
          bash .pre-commit-hooks/check-omnimarket-dispatch-drift.sh
