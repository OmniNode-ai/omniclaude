name: Omnimarket Dispatch Drift Gate

# OMN-13536: required status check. Detects omnimarket version/commit drift
# in the dispatch venvs used by omniclaude skills.  When the installed omnimarket
# commit lags canonical omnimarket@main, skills silently execute stale node bytes
# (old stubs, renamed/deleted handlers).  This gate converts that silent runtime
# failure into a caught regression — enforcement, not detection (CLAUDE.md Rule #5).
#
# CI behaviour: the gate checks out canonical omnimarket@main to resolve the HEAD
# SHA, then compares it against the pinned SHA in uv.lock.  A stale git-tag pin
# (v0.4.x, hundreds of commits behind) is the target negative case.

on:
  push:
    branches: [main, dev, 'hotfix/**']
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'scripts/check_omnimarket_dispatch_drift.py'
      - '.pre-commit-hooks/check-omnimarket-dispatch-drift.sh'
      - '.github/workflows/omnimarket-dispatch-drift-gate.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'scripts/check_omnimarket_dispatch_drift.py'
      - '.pre-commit-hooks/check-omnimarket-dispatch-drift.sh'
      - '.github/workflows/omnimarket-dispatch-drift-gate.yml'
  merge_group:

# Least-privilege: this gate only reads the checked-out tree and runs a stdlib
# validator.  No write scopes (Checkov CKV2_GHA_1 / write-all default).
permissions:
  contents: read

jobs:
  omnimarket-dispatch-drift-gate:
    name: Omnimarket Dispatch Drift Gate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Checkout omniclaude
        uses: actions/checkout@v7

      - name: Checkout canonical omnimarket@main
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omnimarket
          ref: main
          path: _omnimarket_canonical
          # Shallow clone — we only need HEAD SHA, not full history.
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Resolve canonical omnimarket@main SHA
        id: canonical
        run: |
          SHA=$(git -C _omnimarket_canonical rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Canonical omnimarket@main SHA: $SHA"

      - name: Check omnimarket dispatch drift (lock-consistency mode)
        working-directory: ${{ github.workspace }}
        env:
          OMNIMARKET_CANONICAL_SHA: ${{ steps.canonical.outputs.sha }}
        run: |
          # tomllib is stdlib (Python 3.11+); no install step needed.
          # No live daemon venv on CI runners — gate runs in lock-consistency mode.
          # Exits 1 if uv.lock pins omnimarket to a SHA != canonical @main HEAD.
          bash .pre-commit-hooks/check-omnimarket-dispatch-drift.sh
