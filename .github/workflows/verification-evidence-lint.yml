name: Verification Evidence Lint

# OMN-13341 (R6, epic OMN-13325): hard-block worker prompts, receipts, and
# handoff/evidence docs that cite a local-clone path, ticket text, or a
# statusCheckRollup verdict AS proof of system state. Authoritative truth
# surfaces are origin/dev (existence), the live materialized projection (state),
# and `gh pr checks` (PR verdict). Doctrine: docs/standards/VERIFICATION_DOCTRINE.md.

on:
  push:
    branches: [main, 'hotfix/**']
    paths:
      - 'plugins/onex/skills/**/*.md'
      - 'docs/handoffs/**'
      - 'docs/receipts/**'
      - 'docs/**/*receipt*.md'
      - '.onex_state/evidence/**'
      - 'scripts/lint_verification_evidence.py'
      - 'docs/standards/VERIFICATION_DOCTRINE.md'
      - '.github/workflows/verification-evidence-lint.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'plugins/onex/skills/**/*.md'
      - 'docs/handoffs/**'
      - 'docs/receipts/**'
      - 'docs/**/*receipt*.md'
      - '.onex_state/evidence/**'
      - 'scripts/lint_verification_evidence.py'
      - 'docs/standards/VERIFICATION_DOCTRINE.md'
      - '.github/workflows/verification-evidence-lint.yml'

permissions:
  contents: read

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  verification-evidence-lint:
    needs: occ-preflight
    name: Verification Evidence Lint
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Self-test the verification-evidence lint
        working-directory: ${{ github.workspace }}
        run: python3 scripts/lint_verification_evidence.py --self-test

      - name: Scan prompts/receipts/handoffs/evidence for non-authoritative proof
        working-directory: ${{ github.workspace }}
        run: python3 scripts/lint_verification_evidence.py
