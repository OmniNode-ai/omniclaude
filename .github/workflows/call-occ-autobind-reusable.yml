#
# call-occ-autobind-reusable.yml
#
# Reusable OCC-autobind publisher (OMN-14811). Centralises the born-path trigger
# that omnimarket has run inline since OMN-13990/OMN-13317: on a ticketed product
# PR (opened/synchronize) it publishes `onex.cmd.omnimarket.occ-autobind.v1`, and
# the .201 effects runtime (node_pr_lifecycle_fix_effect -> OccCompanionEmitter)
# mints the OCC evidence companion and PATCHes `Evidence-Source: OCC#<n>` back onto
# the product PR — zero manual authoring.
#
# WHY A REUSABLE (single source of truth):
#   The publish LOGIC lives in exactly one place — omnimarket's canonical
#   `scripts/publish_occ_autobind_command.py`, its `config/ci_bus_lanes.yaml` lane
#   overlay (OMN-14801) and its `src/omnimarket/events/topics.py` topic registry.
#   This workflow does NOT copy or re-implement that logic; it sparse-checks-out
#   the canonical omnimarket tree (currently at `@dev` — see omnimarket-ref below;
#   the `--lane`/lane-overlay/fail-loud publisher lands on omnimarket dev via
#   OMN-14801 and is not yet promoted to omnimarket main) and runs the script
#   verbatim, exactly as `deploy-gate-reusable.yml` sparse-checks-out omniclaude
#   support scripts. RE-PIN to `@main` after OMN-14801 promotes (follow-up OMN-14812).
#   omnimarket stays the single owner; every caller repo (omnibase_infra canary,
#   then core/omniclaude fan-out) inherits identical behaviour and the live lane
#   overlay without a divergent copy. omnimarket is PUBLIC, so the caller's
#   default GITHUB_TOKEN can check it out (persist-credentials: false).
#
# BROKER / RUNNER BIFURCATION (mirrors omnimarket call-occ-autobind.yml,
# OMN-14451; runner carve-out OMN-16691 / OMN-16682 constraint 8):
#   Trusted (non-fork) PR events run on the self-hosted omnibase-ci runner on
#   .201, which reaches the dev-lane broker. That placement is pinned via the
#   DEDICATED `OMNI_OCC_AUTOBIND_RUNS_ON_JSON` variable rather than the shared
#   `OMNI_TRUSTED_CI_RUNS_ON_JSON` seam, so a hosted-runner migration of general
#   CI cannot silently relocate this broker-dependent publisher — see the long
#   note on `runs-on:` below. Fork PRs fall back to ubuntu-latest
#   where the publisher skips gracefully (exit 0). `RUNNER_IS_TRUSTED` is threaded
#   into the publish step so the script fails LOUD (exit 1) on the trusted runner
#   for an unresolvable lane / missing-or-mismatched broker / undelivered message,
#   instead of a silent green no-op.
#
# LANE RESOLUTION (OMN-14801 / incident OMN-14800; corrected OMN-14813, OMN-18012):
#   The caller passes `lane` (default `dev`). The script resolves it against the
#   checked-out `config/ci_bus_lanes.yaml` overlay to pick the bus target and, if
#   a `KAFKA_BOOTSTRAP_SERVERS` secret is injected anyway, to fail-loud-check it
#   against the lane's declared broker (the silent dev->stability repoint guard).
#
#   TWO STALE ASSERTIONS CORRECTED HERE, both of which read as current fact until
#   this edit:
#     1. "`dev` is declared `from-secret` ... a caller repo therefore needs a
#        repo-level KAFKA_BOOTSTRAP_SERVERS secret." Not true since OMN-14813:
#        `dev` declares a CONCRETE broker in the committed overlay and the
#        publisher uses it directly. No caller repo needs that secret; omnibase_infra
#        run 34150470410 logged "KAFKA_BOOTSTRAP_SERVERS is not injected; publishing
#        to the overlay-declared broker", which is the intended path.
#     2. The dev listener being plaintext with SASL unused. Not true since
#        ~16:40Z on 2026-09-07: OMN-18012 Phase B enabled SASL/SCRAM-SHA-256 on
#        it. The overlay now DECLARES `security_protocol: SASL_PLAINTEXT` /
#        `sasl_mechanism: SCRAM-SHA-256` and omnimarket's publisher reads the
#        protocol from there. Before that fix the publisher inferred SASL_SSL from
#        the mere presence of credentials and every mint died in an SSL handshake
#        against a listener with no TLS.
#
#   What a caller repo needs today: `secrets: inherit` so KAFKA_SASL_USERNAME and
#   KAFKA_SASL_PASSWORD reach the publish step. NOT a broker secret.
#
# Usage in caller repos:
#   jobs:
#     occ-autobind:
#       uses: OmniNode-ai/omniclaude/.github/workflows/call-occ-autobind-reusable.yml@main
#       secrets: inherit
#       with:
#         lane: dev
#
# Ticket: OMN-14811 (OMN-13990 / OMN-13317 / OMN-14451 / OMN-14801 lineage)

name: OCC Autobind Publisher (reusable)

on:
  workflow_call:
    inputs:
      lane:
        description: >
          CI bus lane id resolved against omnimarket config/ci_bus_lanes.yaml to
          decide the bus target and to fail-loud-check the injected
          KAFKA_BOOTSTRAP_SERVERS against the lane's declared broker (OMN-14801).
        type: string
        required: false
        default: dev
      omnimarket-ref:
        description: >
          git ref of OmniNode-ai/omnimarket to source the canonical publisher
          (scripts/publish_occ_autobind_command.py), lane overlay
          (config/ci_bus_lanes.yaml) and topic registry from. Pinned to `dev`
          because the `--lane` publisher, the `config/ci_bus_lanes.yaml` overlay,
          `_resolve_lane_broker`, the `RUNNER_IS_TRUSTED` fail-loud (sys.exit(1))
          and the stability->in-memory no-op ALL land on omnimarket `dev` via
          OMN-14801 and are NOT yet promoted to omnimarket `main` — at `main` the
          script has no `--lane` option and no lane overlay, so the fail-loud/lane
          logic is unreachable (verifier finding, OMN-14811).
          RE-PIN TO `main` once OMN-14801 promotes to omnimarket main (tracked by
          follow-up OMN-14812) so this shared reusable no longer tracks a moving
          `dev` branch.
        type: string
        required: false
        # re-pin to `main` after OMN-14801 promotes to omnimarket main (follow-up OMN-14812)
        default: dev
    # Secrets are passed by the caller via `secrets: inherit`. The ones that
    # matter are KAFKA_SASL_USERNAME / KAFKA_SASL_PASSWORD (the declared SASL
    # lane's credentials, OMN-18012). KAFKA_BOOTSTRAP_SERVERS is legacy and
    # normally unset — the broker is committed config (OMN-14813).

permissions:
  contents: read

jobs:
  publish-occ-autobind:
    name: Publish occ-autobind command
    # Defensive gate (identical to omnimarket's inline caller, OMN-13990 H4): skip
    # dependency bots (exempt from occ-preflight too) and PRs with no OMN ticket
    # token in the title or branch. Any caller invoking this reusable inherits the
    # gate for free; a ticketless PR is fixed by the pr-title gate, not papered
    # over with a mechanical companion. Callers may ALSO gate their `uses:` job so
    # the reusable is not even invoked for non-OMN PRs.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      (contains(github.event.pull_request.title, 'OMN-') ||
       contains(github.event.pull_request.head.ref, 'OMN-'))
    # RUNNER CARVE-OUT (OMN-16691, OMN-16682 constraint 8) — the trusted branch
    # reads a DEDICATED variable, `OMNI_OCC_AUTOBIND_RUNS_ON_JSON`, and NOT the
    # shared `OMNI_TRUSTED_CI_RUNS_ON_JSON` seam that governs lint/test/build.
    #
    # WHY: this job publishes to the TAILNET-ONLY dev-lane broker
    # `omninode-pc.tail75df5e.ts.net:19092` (omnimarket config/ci_bus_lanes.yaml).
    # Only the self-hosted `omnibase-ci` fleet on .201 is on that tailnet; a
    # GitHub-hosted runner cannot resolve the name at all. The OMN-14451/OMN-14639
    # fail-loud contract below then correctly refuses to exit 0, so NO OCC
    # companion is minted, so no `Evidence-Source: OCC#<n>` is stamped, so the
    # receipt gate (OMN-10419) hard-fails EVERY PR in EVERY OCC-gated repo. This
    # is not a degraded-CI seam; it is a merge-wide outage seam. It ran live for
    # 45 minutes on 2026-08-26 (22:46:41Z -> 23:32:03Z) when the OMN-16682 Step-1
    # migration flipped `OMNI_TRUSTED_CI_RUNS_ON_JSON` to `["ubuntu-latest"]`;
    # incident OMN-16691.
    #
    # HOW: the literal `["self-hosted","omnibase-ci"]` fallback IS the operating
    # value. `OMNI_OCC_AUTOBIND_RUNS_ON_JSON` is deliberately left UNSET at org
    # and repo scope, so this job pins to the fleet no matter what the shared
    # seam is flipped to, while still leaving one explicit, single-purpose knob
    # for the day the lane broker is reachable from another runner class. Setting
    # it is an operator action that must cite a reachability proof — not a
    # side effect of the OMN-16682 migration.
    #
    # `vars` in a reusable workflow resolve in the CALLER's context, so every
    # caller repo inherits this carve-out for free and passes nothing (OMN-16682
    # constraint 7). Fork PRs keep the `OMNI_PUBLIC_PR_RUNS_ON_JSON` path — the
    # publisher skips gracefully there (no broker), and fork isolation
    # (OMN-16683) is untouched by this change.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_OCC_AUTOBIND_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # OMN-14451: same fork/non-fork test as `runs-on:` above, threaded into the
    # publish step so the script can fail loudly (not silently exit 0) when the
    # broker is unresolvable on the trusted lane where a real broker MUST exist.
    env:
      RUNNER_IS_TRUSTED: >-
        ${{
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name != github.repository)
          && 'false' || 'true'
        }}
    timeout-minutes: 5

    steps:
      # The publish LOGIC is owned by omnimarket. Pull ONLY the three files the
      # thin publisher needs (script + lane overlay + topic registry) from
      # omnimarket@<ref> into a side path so nothing from the caller checkout is
      # touched. persist-credentials: false — this job never pushes to git.
      - name: Fetch canonical OCC-autobind publisher (omnimarket)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OmniNode-ai/omnimarket
          ref: ${{ inputs.omnimarket-ref }}
          path: .occ-autobind-src
          persist-credentials: false
          sparse-checkout: |
            scripts/publish_occ_autobind_command.py
            config/ci_bus_lanes.yaml
            src/omnimarket/events/topics.py
          sparse-checkout-cone-mode: false

      # OMN-16723: a sparse checkout of a path that does not exist at the
      # requested ref SUCCEEDS and leaves an empty directory. Without this the
      # miss surfaces two steps later as a bare "python3: can't open file ...
      # [Errno 2]" exit 2, which reads like a publish verdict rather than a
      # plumbing failure. Name the cause here instead.
      - name: Assert omnimarket publisher sources were fetched
        env:
          REF: ${{ inputs.omnimarket-ref }}
        run: |
          set -euo pipefail
          # Paths are spelled as literals rooted in this job's declared
          # checkout `path:`, so the repo-root run:-script guard (OMN-15393)
          # derives that they are foreign-checkout paths rather than missing
          # in-tree scripts. Do not collapse them behind a variable.
          missing=0
          for f in ".occ-autobind-src/scripts/publish_occ_autobind_command.py" \
                   ".occ-autobind-src/config/ci_bus_lanes.yaml" \
                   ".occ-autobind-src/src/omnimarket/events/topics.py"; do
            if [ ! -f "${f}" ]; then
              echo "::error::omnimarket source ${f} was not fetched."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::The omnimarket ref '${REF}' does not carry the" \
                 "publisher sources listed in this job's sparse-checkout." \
                 "THE PUBLISH DID NOT RUN — this is not a publish failure."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Kept deliberately thin — the publisher loads topics.py by file path and
          # never imports the omnimarket product graph. pyyaml parses the checked-in
          # config/ci_bus_lanes.yaml lane overlay (OMN-14801).
          pip install --quiet confluent-kafka click pydantic pyyaml

      - name: Publish onex.cmd.omnimarket.occ-autobind.v1
        # All potentially attacker-controlled inputs (branch name, PR title) are
        # passed through environment variables to prevent shell injection.
        #
        # KAFKA_BOOTSTRAP_SERVERS is normally ABSENT (OMN-14813: `dev` declares a
        # concrete broker in the committed overlay, so the publisher resolves it
        # from config rather than a secret). It is left wired only so that a caller
        # repo that still holds the legacy secret gets the fail-loud drift check
        # rather than a silent divergence.
        #
        # KAFKA_SASL_{USERNAME,PASSWORD} are the credentials for the lane's
        # DECLARED transport (SASL_PLAINTEXT / SCRAM-SHA-256 since OMN-18012 Phase
        # B). They are credentials, not a broker address: the publisher never
        # infers the protocol from their presence — it reads it from the overlay.
        # On a fork/cloud runner they are absent and the publisher skips before
        # building a producer.
        env:
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # Best-effort ticket extraction; the script also parses the branch ref.
          PR_TICKET: ""
          LANE: ${{ inputs.lane }}
        working-directory: .occ-autobind-src
        run: |
          python scripts/publish_occ_autobind_command.py --lane "${LANE}"
