  # ============================================================================
  # DOD EVIDENCE VALIDATION (OMN-6747) — hard mode (OMN-6117)
  # ============================================================================

  dod-evidence-check:
    needs: occ-preflight
    if: always()
    name: DoD Evidence Check
    # Self-hosted runner only — hard gate: missing DoD evidence blocks merge
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve DoD evidence source
        id: dod-evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT || github.token }}
        run: |
          BODY="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          PR_NUMBER="$(jq -r '.pull_request.number // ""' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          if [[ -n "$PR_NUMBER" ]]; then
            CURRENT_BODY="$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              | jq -r '.body // ""' 2>/dev/null || true)"
            if [[ -n "$CURRENT_BODY" ]]; then
              BODY="$CURRENT_BODY"
            fi
          fi
          SOURCE="$(printf '%s\n' "$BODY" | awk -F': *' 'tolower($1) == "evidence-source" {print $2; exit}' | tr -d '\r' | xargs || true)"
          TICKET="$(printf '%s\n' "$BODY" | awk -F': *' 'tolower($1) == "evidence-ticket" {print $2; exit}' | tr -d '\r' | xargs || true)"
          if [[ -z "$TICKET" ]]; then
            REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
            if [[ "$REF" =~ [Oo][Mm][Nn]-([0-9]+) ]]; then
              TICKET="OMN-${BASH_REMATCH[1]}"
            fi
          fi
          if [[ "$SOURCE" =~ ^[Oo][Cc][Cc]#([0-9]+)$ ]]; then
            OCC_PR="${BASH_REMATCH[1]}"
            # Use unauthenticated REST API; OCC is public and github.token scope may not
            # extend to cross-repo gh calls, causing silent empty output from gh pr view.
            OCC_REST="$(curl -sf "https://api.github.com/repos/OmniNode-ai/onex_change_control/pulls/$OCC_PR" 2>/dev/null || true)"
            if [[ -n "$OCC_REST" ]]; then
              IS_MERGED="$(printf '%s' "$OCC_REST" | jq -r '.merged // false' 2>/dev/null || true)"
              if [[ "$IS_MERGED" == "true" ]]; then
                SOURCE="$(printf '%s' "$OCC_REST" | jq -r '.merge_commit_sha // ""' 2>/dev/null || true)"
              else
                SOURCE="$(printf '%s' "$OCC_REST" | jq -r '.head.sha // ""' 2>/dev/null || true)"
              fi
            fi
          fi
          if [[ -n "$SOURCE" && ! "$SOURCE" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Ignoring invalid Evidence-Source value: $SOURCE" >&2
            SOURCE=""
          fi
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "ticket=$TICKET" >> "$GITHUB_OUTPUT"

      - name: Checkout central DoD evidence
        if: steps.dod-evidence.outputs.source != ''
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/onex_change_control
          ref: ${{ steps.dod-evidence.outputs.source }}
          path: .onex_change_control_evidence
          token: ${{ secrets.CROSS_REPO_PAT || github.token }}

      - name: Materialize central DoD evidence receipt
        if: steps.dod-evidence.outputs.source != ''
        working-directory: ${{ github.workspace }}
        run: bash scripts/materialize-dod-evidence-from-occ.sh "${{ steps.dod-evidence.outputs.ticket }}" .onex_change_control_evidence
        env:
          ONEX_STATE_DIR: .onex_state

      - name: Run DoD evidence check
        working-directory: ${{ github.workspace }}
        run: bash scripts/dod-pre-push-check.sh
        env:
          DOD_ENFORCEMENT: hard
          ONEX_STATE_DIR: .onex_state

  # ============================================================================
  # COVERAGE (runs after test matrix)
  # ============================================================================

  merge-coverage:
    name: Merge Test Coverage
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: [occ-preflight, test]
    if: needs.occ-preflight.result == 'success' && (needs.test.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage
        working-directory: ${{ github.workspace }}
        run: pip install coverage[toml]

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-test-group-*
          path: coverage-files/

      - name: Combine coverage
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -d "coverage-files" ]; then
            echo "No coverage files directory found"
            exit 0
          fi

          COVERAGE_COUNT=$(find coverage-files/ -name '.coverage.*' 2>/dev/null | wc -l)
          echo "Found $COVERAGE_COUNT coverage files"

          if [ "$COVERAGE_COUNT" -eq 0 ]; then
            echo "No coverage files to combine"
            exit 0
          fi

          find coverage-files/ -name '.coverage.*' -exec mv {} . \;
          coverage combine .coverage.*
          coverage xml -o coverage.xml
          coverage report

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-merged
          path: |
            coverage.xml
            .coverage
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Skill Hygiene Check (OMN-5200)
  # ---------------------------------------------------------------------------
  # Validates skill directory naming, structure, and Python separation using the
  # cross-repo validator in onex_change_control.
  # ---------------------------------------------------------------------------
  # Mode Metadata Integrity (OMN-5402)
  # ---------------------------------------------------------------------------
  mode-metadata-guard:
    needs: occ-preflight
    if: always()
    name: Mode Metadata Integrity
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Load cached venv
        if: ${{ vars.OMNI_ENABLE_VENV_CACHE_RESTORE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --group dev --python "${PYTHON_VERSION}"

      - name: Validate mode metadata integrity
        working-directory: ${{ github.workspace }}
        run: uv run pytest tests/unit/test_mode_metadata_integrity.py -v

  skill-hygiene:
    needs: occ-preflight
    if: always()
    name: Skill Hygiene
    # Static validator with sparse OCC checkout; run hosted so fleet saturation
    # cannot cancel the required Quality Gate aggregate.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout onex_change_control validator
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/onex_change_control
          ref: 1b0d2f0374bca1f39d9bab22a02251208cdce196  # pragma: allowlist secret
          token: ${{ secrets.CROSS_REPO_PAT || github.token }}
          path: onex_change_control
          sparse-checkout: |
            scripts/validation/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate skill hygiene
        working-directory: ${{ github.workspace }}
        run: python onex_change_control/scripts/validation/validate_skill_hygiene.py --skills-root plugins/onex/skills --strict

  # ---------------------------------------------------------------------------
  # Version Pin Compliance Check (OMN-4810)
  # ---------------------------------------------------------------------------
  # Verifies that this repo's dependency pins are compliant with the shared
  # version matrix defined in onex_change_control/standards/version-matrix.yaml.
  version-pin-check:
    needs: occ-preflight
    if: always()
    name: Version Pin Compliance
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 10
    # Advisory until range pin support (OMN-5132) and matrix alignment land
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout onex_change_control standards
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/onex_change_control
          ref: 1b0d2f0374bca1f39d9bab22a02251208cdce196  # pragma: allowlist secret
          token: ${{ secrets.CROSS_REPO_PAT || github.token }}
          path: onex_change_control
          sparse-checkout: |
            standards/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pip install pyyaml packaging

      - name: Check version pin compliance
        working-directory: ${{ github.workspace }}
        run: python onex_change_control/standards/check_version_pins.py --repo omniclaude --root onex_change_control --repo-path .

  # ---------------------------------------------------------------------------
  # Merge-Sweep Contract Tests (OMN-6189)
  # ---------------------------------------------------------------------------
  # Structural regression tests for the merge-sweep skill prompt contract.
  # Prevents Track B dispatch bugs (e.g., --skip-polish leaking into empty check).
  merge-sweep-contract:
    needs: occ-preflight
    if: always()
    name: Merge-Sweep Contract
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Load cached venv
        if: ${{ vars.OMNI_ENABLE_VENV_CACHE_RESTORE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --frozen --group dev --python "${PYTHON_VERSION}"

      - name: Run merge-sweep contract tests
        working-directory: ${{ github.workspace }}
        run: uv run pytest tests/integration/skills/merge_sweep/ -v -m "unit and not integration"

  # ---------------------------------------------------------------------------
  # Skill Contract Validation (OMN-6193)
  # ---------------------------------------------------------------------------
  # Validates argument parity, sub-skill references, duplicate frontmatter,
  # and spec-prompt predicate coverage across all skills.
  skill-contract-validation:
    needs: occ-preflight
    if: always()
    name: Skill Contract Validation
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout onex_change_control validator
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/onex_change_control
          ref: main
          token: ${{ secrets.CROSS_REPO_PAT || github.token }}
          path: onex_change_control
          sparse-checkout: |
            scripts/validation/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate skill contracts
        # Initially without --strict; promote to --strict after baseline warnings are resolved
        working-directory: ${{ github.workspace }}
        run: python onex_change_control/scripts/validation/validate_skill_contracts.py --skills-root plugins/onex/skills

  # ============================================================================
  # ONEX Compliance Check
  # Runs `onex compliance check` to validate contracts, handlers, and schemas.
  # External-service checks WARN only (not FAIL) — structural failures remain FAIL.
  # Conditional: only runs if the `onex compliance` command is available.
  # ============================================================================
  compliance:
    needs: occ-preflight
    name: Contract Compliance
    # Lightweight ONEX compliance gate: keep it hosted so the required summary
    # is not held behind the self-hosted fleet during merge sweeps.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --frozen --group dev --python "${PYTHON_VERSION}"

      - name: Check if onex compliance command exists
        id: check-command
        working-directory: ${{ github.workspace }}
        run: |
          if uv run onex compliance check --help >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::onex compliance check command not available yet — skipping"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run onex compliance check
        id: compliance
        if: steps.check-command.outputs.available == 'true'
        working-directory: ${{ github.workspace }}
        # OMN-13575: this gate is warn-only TODAY because `onex compliance check`
        # currently reports 588/594 nodes failing `handler_resolution` — a large
        # pre-existing debt (the skill-shim orchestrator nodes have no resolvable
        # handler). Hard-failing here would wedge every PR on debt unrelated to
        # the change at hand. De-fanging this gate is blocked on clearing that
        # node handler_resolution debt first; tracked as an OMN-13575 follow-up.
        # The leniency is retained EXPLICITLY (not as a silent soft gate) and the
        # underlying debt is surfaced in the job summary.
        run: |
          mkdir -p .onex_state/compliance
          if uv run onex compliance check --repo-root . --output .onex_state/compliance/report.yaml; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "::warning::ONEX compliance check reported failures (OMN-13575: warn-only pending node handler_resolution debt clearance)"
          fi

      - name: Upload compliance report
        if: always() && steps.check-command.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: compliance-report
          path: .onex_state/compliance/report.yaml
          retention-days: 30

  # ============================================================================
  # AISLOP SWEEP GATE (OMN-8622)
  # Detects AI-generated quality anti-patterns: prohibited env vars, hardcoded
  # Kafka topics (outside enum definitions), and backwards-compat shims.
  # Fails on CRITICAL or ERROR findings. Warn-only for WARNING findings.
  # NOTE: This gate must pass on main — land AFTER hardcoded-path fixes merge.
  # ============================================================================
  aislop-sweep:
    needs: occ-preflight
    if: always()
    name: Aislop Sweep
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # OMN-14086: diff-scope the sweep on a PR (scan only changed files); every
      # check is per-file so this preserves detection. Fail-closed to a full-tree
      # scan when the diff can't be computed or the event has no PR diff
      # (merge_group/push/schedule). The script itself further escalates to
      # full-tree when the diff touches the aislop validator sources.
      - name: Compute changed files vs PR base
        id: diff
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            if git fetch origin "$BASE_REF" --no-tags && \
               git diff --name-only "origin/$BASE_REF"...HEAD > changed.txt; then
              echo "mode=diff" >> "$GITHUB_OUTPUT"
              echo "Changed files:"; cat changed.txt
            else
              echo "mode=full" >> "$GITHUB_OUTPUT"
              echo "Diff computation failed — failing closed to full-tree scan."
            fi
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Non-PR event ($EVENT_NAME) — full-tree scan."
          fi
      - name: Detect AI anti-patterns
        working-directory: ${{ github.workspace }}
        env:
          DIFF_MODE: ${{ steps.diff.outputs.mode }}
        run: |
          if [ "$DIFF_MODE" = "diff" ]; then
            python scripts/ci/run_aislop_sweep.py --changed-files-from changed.txt
          else
            python scripts/ci/run_aislop_sweep.py --full-tree
          fi

  # Agent YAML contract validation (OMN-8914)
  agent-contract-validation:
    needs: occ-preflight
    if: always()
    name: Agent Contract Validation
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --frozen --python "${PYTHON_VERSION}"

      - name: Validate all agent YAML contracts
        working-directory: ${{ github.workspace }}
        # OMN-13575: hard-failing. Wave B rollout is complete (53/53 agents pass)
        # so the warn-only remap was a soft gate that could never turn this job
        # red. A real agent-contract violation now fails CI.
        run: bash plugins/onex/scripts/validate-all-agents.sh

  # Skill monorepo-ref lint gate (OMN-8795 SD-08)
  # NOTE: This gate will FAIL until SD-04/SD-05/SD-07 violations are cleared.
  # Land this PR last in the SD wave so the gate goes green on merge.
  skill-monorepo-ref-gate:
    needs: occ-preflight
    if: always()
    name: Skill Monorepo-Ref Gate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect monorepo refs in skill files
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-skill-monorepo-refs.sh

  # Regression guard (OMN-9143): block reintroduction of the retired
  # `polymorphic-agent` dispatch target in the omniclaude enforcement surface.
  no-polymorphic-agent:
    needs: occ-preflight
    if: always()
    name: "Arch: No polymorphic-agent in enforcement paths (OMN-9143)"
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Reject legacy polymorphic-agent dispatch target in enforcement paths
        working-directory: ${{ github.workspace }}
        run: bash plugins/onex/hooks/scripts/grep_guard_no_polymorphic_agent.sh

  # ============================================================================
  # GATE AGGREGATORS
  # Gate names are API-stable per CI/CD Standards (Invariant 1).
  # Do NOT rename without following the Branch Protection Migration Safety
  # procedure in docs/standards/CI_CD_STANDARDS.md.
  # ============================================================================

  quality-gate:
    name: Quality Gate
    # OMN-14127: result-reading aggregator (no heavy work) feeding the required
    # "CI Summary" context. Runs on the GitHub-hosted ubuntu-latest runner so the
    # aggregation layer never queues behind — or gets cancelled while waiting on —
    # the saturated self-hosted fleet; it posts as soon as its needs are terminal.
    runs-on: ubuntu-latest
    needs:
      - occ-preflight
      # OMN-15314: read for its `docs_only` OUTPUT only, never for its result.
      # It is the declared precondition the per-upstream skip policy below
      # re-evaluates, so this gate can tell an expected skip from a stranded one.
      - zone-filter
      - quality
      - pyright
      - check-handshake
      - canon-shape-ratchet
      - enum-governance
      - exports-validation
      - env-var-registry
      - cross-repo-validation
      - migration-freeze
      - onex-validation
      # Architecture enforcement gates (OMN-2592)
      - arch-no-db-in-orchestrator
      - arch-no-git-outside-effects
      - arch-no-linear-outside-effects
      - arch-no-repo-adapter-in-orchestrator
      - arch-no-direct-adapter-in-business-logic
      - arch-no-direct-bus-instantiation
      - arch-no-raw-sqlite3-in-handlers
      - arch-no-env-fallbacks
      - arch-cost-ledger-isolation
      - arch-topic-naming
      - arch-omnidash-db-role
      - arch-cost-ledger-structure
      - arch-no-direct-kafka-producer
      - arch-no-utcnow
      - arch-no-hardcoded-ip
      # F5 checks (OMN-2595)
      - arch-no-compact-cmd-topic
      # CDQA-07 (OMN-2977)
      - arch-invariants
      # Version pin compliance (OMN-4810)
      - version-pin-check
      # Skill hygiene (OMN-5200)
      - skill-hygiene
      # Mode metadata integrity (OMN-5402)
      - mode-metadata-guard
      # Merge-sweep contract (OMN-6189)
      - merge-sweep-contract
      # Skill contract validation (OMN-6193)
      - skill-contract-validation
      # Golden chain integrity (OMN-7389)
      - golden-chain-integrity
      # AI anti-pattern detection (OMN-8622)
      - aislop-sweep
      # Agent YAML contract validation (OMN-8914)
      - agent-contract-validation
      # Skill monorepo-ref lint gate (OMN-8795 SD-08)
      - skill-monorepo-ref-gate
      # Polymorphic-agent regression guard (OMN-9143)
      - no-polymorphic-agent
    if: always()
    steps:
      - name: Check quality results
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Quality Gate ==="

          # OMN-15314 (OMN-15304 vector 6 — result triage). The previous triage
          # was `[ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]`, which
          # reads as "!= success" locally while letting `skipped` reach the
          # PASSED path. `skipped` is the ABSENCE of a verdict exactly like
          # `cancelled`, and it is precisely the state vectors 2/3/5
          # (conditional `if:`, needs-cascade) produce — so vector 5 and
          # vector 6 composed into a bypass: strand an upstream, and the
          # aggregator that was supposed to catch it reports green.
          #
          # The blanket `!= skipped` escape existed because three upstreams do
          # skip legitimately. That is now an explicit PER-UPSTREAM SKIP POLICY:
          # `skipped` passes only when this gate itself re-evaluates that
          # upstream's own declared precondition and finds it false. Every other
          # skip, every unlisted upstream that skipped, failure, cancelled, and
          # any future result value GitHub might add fail closed.
          #
          # occ-preflight is checked first and on its own: every job below is
          # gated on it succeeding, so if it did not, their results carry no
          # information and no skip below can be assessed.
          PREFLIGHT="${{ needs.occ-preflight.result }}"
          echo "occ-preflight: $PREFLIGHT"
          if [ "$PREFLIGHT" != "success" ]; then
            echo "::error::occ-preflight did not succeed (result: $PREFLIGHT) — every check in this gate is gated on it."
            exit 1
          fi

          # Declared-precondition inputs for the skip policy in the loop.
          DOCS_ONLY="${{ needs.zone-filter.outputs.docs_only }}"
          FORK_PR="${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}"
          echo "skip-policy inputs: docs_only=${DOCS_ONLY:-(unset)} fork_pr=$FORK_PR"

          # The gate stops at the first offending upstream rather than
          # accumulating: nearly every upstream here is also an INDEPENDENTLY
          # required status check, so its own red is already in the checks list.
          for check in \
            "quality=${{ needs.quality.result }}" \
            "pyright=${{ needs.pyright.result }}" \
            "check-handshake=${{ needs.check-handshake.result }}" \
            "canon-shape-ratchet=${{ needs.canon-shape-ratchet.result }}" \
            "enum-governance=${{ needs.enum-governance.result }}" \
            "exports-validation=${{ needs.exports-validation.result }}" \
            "env-var-registry=${{ needs.env-var-registry.result }}" \
            "cross-repo-validation=${{ needs.cross-repo-validation.result }}" \
            "migration-freeze=${{ needs.migration-freeze.result }}" \
            "onex-validation=${{ needs.onex-validation.result }}" \
            "arch-no-db-in-orchestrator=${{ needs.arch-no-db-in-orchestrator.result }}" \
            "arch-no-git-outside-effects=${{ needs.arch-no-git-outside-effects.result }}" \
            "arch-no-linear-outside-effects=${{ needs.arch-no-linear-outside-effects.result }}" \
            "arch-no-repo-adapter-in-orchestrator=${{ needs.arch-no-repo-adapter-in-orchestrator.result }}" \
            "arch-no-direct-adapter-in-business-logic=${{ needs.arch-no-direct-adapter-in-business-logic.result }}" \
            "arch-no-direct-bus-instantiation=${{ needs.arch-no-direct-bus-instantiation.result }}" \
            "arch-no-raw-sqlite3-in-handlers=${{ needs.arch-no-raw-sqlite3-in-handlers.result }}" \
            "arch-no-env-fallbacks=${{ needs.arch-no-env-fallbacks.result }}" \
            "arch-cost-ledger-isolation=${{ needs.arch-cost-ledger-isolation.result }}" \
            "arch-topic-naming=${{ needs.arch-topic-naming.result }}" \
            "arch-omnidash-db-role=${{ needs.arch-omnidash-db-role.result }}" \
            "arch-cost-ledger-structure=${{ needs.arch-cost-ledger-structure.result }}" \
            "arch-no-direct-kafka-producer=${{ needs.arch-no-direct-kafka-producer.result }}" \
            "arch-no-utcnow=${{ needs.arch-no-utcnow.result }}" \
            "arch-no-hardcoded-ip=${{ needs.arch-no-hardcoded-ip.result }}" \
            "arch-no-compact-cmd-topic=${{ needs.arch-no-compact-cmd-topic.result }}" \
            "arch-invariants=${{ needs.arch-invariants.result }}" \
            "version-pin-check=${{ needs.version-pin-check.result }}" \
            "skill-hygiene=${{ needs.skill-hygiene.result }}" \
            "mode-metadata-guard=${{ needs.mode-metadata-guard.result }}" \
            "merge-sweep-contract=${{ needs.merge-sweep-contract.result }}" \
            "skill-contract-validation=${{ needs.skill-contract-validation.result }}" \
            "golden-chain-integrity=${{ needs.golden-chain-integrity.result }}" \
            "aislop-sweep=${{ needs.aislop-sweep.result }}" \
            "agent-contract-validation=${{ needs.agent-contract-validation.result }}" \
            "skill-monorepo-ref-gate=${{ needs.skill-monorepo-ref-gate.result }}" \
            "no-polymorphic-agent=${{ needs.no-polymorphic-agent.result }}"; do
            NAME="${check%%=*}"
            RESULT="${check##*=}"

            # Per-upstream skip policy. Each entry mirrors that job's own
            # declared `if:` — keep the two in sync. An upstream that is NOT
            # listed here may never skip: default-deny.
            SKIP_OK=false
            case "$NAME" in
              pyright|golden-chain-integrity)
                # Gated on the zone filter reporting a non-docs-only change.
                if [ "$DOCS_ONLY" = "true" ]; then SKIP_OK=true; fi
                ;;
              check-handshake)
                # Gated on the PR head branch living in this repository
                # (fork PRs cannot reach the handshake credentials).
                if [ "$FORK_PR" = "true" ]; then SKIP_OK=true; fi
                ;;
            esac

            case "$RESULT" in
              success)
                echo "$NAME: success"
                ;;
              skipped)
                if [ "$SKIP_OK" != "true" ]; then
                  echo "::error::$NAME was SKIPPED with its declared precondition holding (docs_only=${DOCS_ONLY:-unset} fork_pr=$FORK_PR) — the absence of a verdict is not a passing one."
                  exit 1
                fi
                echo "$NAME: skipped (declared precondition not met on this event)"
                ;;
              failure|cancelled)
                echo "::error::$NAME did not pass (result: $RESULT)"
                exit 1
                ;;
              *)
                echo "::error::$NAME returned unrecognised result '$RESULT' — failing closed."
                exit 1
                ;;
            esac
          done

          echo ""
          echo "Quality Gate PASSED"

  tests-gate:
    name: Tests Gate
    # OMN-14127: result-reading aggregator (no heavy work) feeding the required
    # "CI Summary" context. Runs on the GitHub-hosted ubuntu-latest runner so the
    # aggregation layer never queues behind — or gets cancelled while waiting on —
    # the saturated self-hosted fleet; it posts as soon as its needs are terminal.
    runs-on: ubuntu-latest
    needs:
      - occ-preflight
      # OMN-15314: read for its `docs_only` OUTPUT only, never for its result —
      # the declared precondition the per-upstream skip policy re-evaluates.
      - zone-filter
      - test
      - hooks-tests
      - agent-framework-tests
      - database-validation
      - golden-chain-live
      - registry-consistency
    if: always()
    steps:
      - name: Check test results
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Tests Gate ==="

          # OMN-15314 (OMN-15304 vector 6 — result triage). The previous triage
          # was `[ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]`, which
          # let a SKIPPED test job reach the PASSED path — a required Tests Gate
          # reporting green with no test result in existence. `skipped` is the
          # ABSENCE of a verdict exactly like `cancelled`, and it is precisely
          # the state vectors 2/3/5 produce, so vector 5 and vector 6 composed
          # into a bypass.
          #
          # occ-preflight is checked first and on its own: every job below is
          # gated on it succeeding.
          PREFLIGHT="${{ needs.occ-preflight.result }}"
          echo "occ-preflight: $PREFLIGHT"
          if [ "$PREFLIGHT" != "success" ]; then
            echo "::error::occ-preflight did not succeed (result: $PREFLIGHT) — every check in this gate is gated on it."
            exit 1
          fi

          # Declared-precondition input for the per-upstream skip policy below.
          DOCS_ONLY="${{ needs.zone-filter.outputs.docs_only }}"
          echo "skip-policy input: docs_only=${DOCS_ONLY:-(unset)}"

          for check in \
            "test=${{ needs.test.result }}" \
            "hooks-tests=${{ needs.hooks-tests.result }}" \
            "agent-framework-tests=${{ needs.agent-framework-tests.result }}" \
            "database-validation=${{ needs.database-validation.result }}" \
            "golden-chain-live=${{ needs.golden-chain-live.result }}" \
            "registry-consistency=${{ needs.registry-consistency.result }}"; do
            NAME="${check%%=*}"
            RESULT="${check##*=}"

            # Per-upstream skip policy. Each entry mirrors that job's own
            # declared `if:` — keep the two in sync. An upstream that is NOT
            # listed here may never skip: default-deny. `database-validation`
            # carries `if: always()` and is deliberately absent.
            #
            # `test` is additionally gated on the Quality Gate succeeding; that
            # skip is NOT admitted here. Tests that never ran because quality
            # failed are absent tests, and Quality Gate is itself an
            # independently required context, so it is already red on that path.
            SKIP_OK=false
            case "$NAME" in
              test|hooks-tests|agent-framework-tests|golden-chain-live|registry-consistency)
                # Gated on the zone filter reporting a non-docs-only change.
                if [ "$DOCS_ONLY" = "true" ]; then SKIP_OK=true; fi
                ;;
            esac

            case "$RESULT" in
              success)
                echo "$NAME: success"
                ;;
              skipped)
                if [ "$SKIP_OK" != "true" ]; then
                  echo "::error::$NAME was SKIPPED with its declared precondition holding (docs_only=${DOCS_ONLY:-unset}) — the absence of a test result is not a passing one."
                  exit 1
                fi
                echo "$NAME: skipped (docs-only change — declared precondition not met)"
                ;;
              failure|cancelled)
                echo "::error::$NAME did not pass (result: $RESULT)"
                exit 1
                ;;
              *)
                echo "::error::$NAME returned unrecognised result '$RESULT' — failing closed."
                exit 1
                ;;
            esac
          done

          echo ""
          echo "Tests Gate PASSED"

  security-gate:
    name: Security Gate
    # OMN-14127: REQUIRED branch-protection context. Result-reading aggregator
    # (no heavy work) that runs on the GitHub-hosted ubuntu-latest runner. Both of
    # its leaves (security-python, detect-secrets) are also hosted, so the entire
    # Security Gate subtree is off the self-hosted fleet and this required context
    # reaches a terminal state (with `if: always()`) regardless of fleet saturation.
    runs-on: ubuntu-latest
    needs:
      - occ-preflight
      - security-python
      - detect-secrets
    if: always()
    steps:
      - name: Check security results
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Security Gate ==="
          FAILED=false

          for check in \
            "occ-preflight=${{ needs.occ-preflight.result }}" \
            "security-python=${{ needs.security-python.result }}" \
            "detect-secrets=${{ needs.detect-secrets.result }}"; do
            NAME="${check%%=*}"
            RESULT="${check##*=}"
            if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
              echo "::error::$NAME failed (result: $RESULT)"
              FAILED=true
            else
              echo "$NAME: $RESULT"
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "Security Gate FAILED"
            exit 1
          fi
          echo ""
          echo "Security Gate PASSED"

  # ============================================================================
  # CROSS-REPO BOUNDARY PARITY (OMN-5771)
  # Validates Kafka topic boundaries against onex_change_control manifest.
  # warn-only until all violations fixed (see OMN-5775).
  # ============================================================================

  boundary-parity:
    needs: occ-preflight
    name: Cross-Repo Boundary Parity
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # Only run when seam-relevant files change
    if: >-
      needs.occ-preflight.result == 'success' && (
      github.event_name == 'merge_group' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files || '0', '0') == false)
    steps:
      - uses: OmniNode-ai/onex_change_control/.github/actions/validate-boundaries@main
        with:
          checks: "boundary-parity"
          warn-only: "false"
          repos: "omniclaude,omnidash,omniintelligence,omnibase_infra,omnibase_core,omnimemory,omnimarket,onex_change_control"

  # ============================================================================
  # CI SUMMARY (OMN-4501) — single branch-protection check
  # Aggregates quality-gate, tests-gate, security-gate into one status context.
  # build is excluded: it is post-gate artifact packaging, not a gating requirement.
  # ============================================================================


  contract-compliance:
    needs: occ-preflight
    name: Contract Compliance Check
    # Lightweight OCC contract validation: keep it hosted and bounded so it
    # cannot consume or wedge self-hosted capacity during merge sweeps.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.occ-preflight.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@v7
      - name: Checkout onex_change_control
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/onex_change_control
          path: onex_change_control

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'onex_change_control/uv.lock'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install onex_change_control
        working-directory: onex_change_control
        run: uv sync --all-extras --python "${PYTHON_VERSION}"

      - name: Validate contract YAML files
        working-directory: onex_change_control
        run: |
          CONTRACTS=$(find "$GITHUB_WORKSPACE/onex_change_control/contracts" -maxdepth 1 -name "OMN-*.yaml" 2>/dev/null)
          if [ -z "$CONTRACTS" ]; then
            echo "No contract YAML files found — skipping validation"
            exit 0
          fi
          uv run validate-yaml $CONTRACTS
        env:
          GH_TOKEN: ${{ github.token }}

  no-noncanonical-lifecycle-classes:
    name: no-noncanonical-lifecycle-classes
    # OMN-14350: non-canonical lifecycle-class ratchet — a CI Summary GATE_JOB
    # (scripts/ci/ci_summary_gate.py GATE_JOBS). Unconditional (no needs/if) so CI
    # Summary WAITS for it and requires a good conclusion — a red ratchet fails the
    # required "CI Summary" check; the job never skips so it cannot be masked.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Ratchet non-canonical lifecycle-word classes against frozen allowlist (OMN-14350)
        run: |
          uv run --no-project \
            --with 'omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core@63635097705d832e0ee9c4811093efb31349105c' \
            python -m omnibase_core.validators.no_noncanonical_lifecycle_classes \
            --check-stale \
            --allowlist .onex_ratchets/noncanonical_class_allowlist.yaml \
            src/omniclaude

  occ-companion-merged:
    name: OCC Companion Merged Gate (OMN-15214)
    # OMN-15221/OMN-15224 (port of the OMN-15214 canary, omnibase_infra #2486): makes the
    # 2026-07-26 OCC hygiene-sweep trigger state — an OPEN onex_change_control
    # evidence companion whose product PR already MERGED — unreachable via the
    # merge path on this repo. The sweep closed five open companions
    # (OCC#5012–#5016) whose product PRs had merged, destroying three evidence
    # chains — one of them THIS repo's (omniclaude#1948 / OMN-15200, companions
    # OCC#5014 + OCC#5015). The durable fix is ordering: the companion must
    # MERGE BEFORE the product PR can. This job polls the PR's live
    # Evidence-Source (live body, not event payload — occ-autobind PATCHes it in
    # after open) and greens ONLY when the cited OCC companion PR is MERGED or
    # the cited OCC commit SHA is an ancestor of onex_change_control dev/main.
    # A companion CLOSED without merging fails immediately (that IS the
    # incident state).
    #
    # CI Summary GATE_JOB + STRICT_SUCCESS_JOB (scripts/ci/ci_summary_gate.py)
    # — deliberately NOT a new top-level required context: a context that does
    # not report on every PR shape wedges merges indefinitely under branch
    # protection, and occ-autobind itself is network-flaky (omninode_infra#679,
    # 2026-07-26). Unconditional (no needs/if) so CI Summary always WAITS for
    # it and a skip/cancel fails closed; internal event scoping no-ops on
    # push/workflow_dispatch (mirrors occ-preflight). GitHub-hosted + pure gh
    # API polling: zero self-hosted/LAN dependency, and the poll window absorbs
    # autobind mint + companion auto-merge latency instead of converting them
    # into instant reds.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.CROSS_REPO_PAT || github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
      # Poll window (seconds) — bounded well under ci-summary's 90m deadline so
      # this gate reaches a terminal state first; PENDING converts to FAIL.
      DEADLINE_SECONDS: "1500"
      POLL_INTERVAL_SECONDS: "30"
    steps:
      - name: Checkout (gate script)
        uses: actions/checkout@v7
      - name: Require cited OCC evidence to be merged/durable before product merge
        run: python3 scripts/ci/check_occ_companion_merged.py

  ci-summary:
    name: CI Summary
    # OMN-14127: REQUIRED branch-protection context, implemented as a NO-`needs`,
    # GitHub-hosted, FAIL-CLOSED poller. A `needs`-gated job gets no check-run
    # until its `needs` terminalize, so under self-hosted fleet saturation the old
    # needs-based CI Summary was ABSENT forever and the PR wedged BLOCKED with no
    # auto-recovery. With NO `needs` this job's check-run instantiates immediately
    # (the required context can never be absent); it polls the current run's job
    # conclusions and posts a terminal success/failure within a bounded deadline.
    # DEFAULT-DENY: green ONLY when every aggregate gate is present+good AND no
    # non-allowlisted job failed — see scripts/ci/ci_summary_gate.py for the
    # auditable gating set + soft-allowlist (unit-tested in
    # tests/ci/test_ci_summary_gate.py). Pure hosted GitHub-API polling: zero
    # self-hosted/LAN dependency. DO NOT rename — the job name IS the required
    # context; a rename re-wedges every PR.
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: read
      contents: read
    # Deadline (below) is comfortably under the observed ~167m run-cancellation
    # window so the required context ALWAYS posts a terminal state first. This
    # job timeout is only a hard backstop above the internal poll deadline.
    timeout-minutes: 100
    steps:
      - name: Checkout (gate script)
        uses: actions/checkout@v7
      - name: Poll run jobs and compute fail-closed CI Summary verdict
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # Bounded poll window (minutes) — kept under the run-cancel window so
          # the required context always reaches a terminal state first.
          DEADLINE_MINUTES: "90"
          POLL_INTERVAL_SECONDS: "45"
        run: |
          # GitHub invokes this step as `bash -e {0}`; disable errexit because the
          # gate script's non-zero exit codes are handled explicitly below
          # (2 = PENDING must NOT terminate the poll loop).
          set +e
          set -uo pipefail
          deadline=$(( $(date +%s) + DEADLINE_MINUTES * 60 ))
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            if ! gh api --paginate \
                "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100" \
                --jq '.jobs[]' | jq -s '.' > jobs.json; then
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "::error::CI Summary poll deadline (${DEADLINE_MINUTES}m) reached while fetching jobs — failing closed"
                exit 1
              fi
              echo "gh api fetch failed (attempt ${attempt}); retrying after ${POLL_INTERVAL_SECONDS}s"
              sleep "${POLL_INTERVAL_SECONDS}"
              continue
            fi
            python3 scripts/ci/ci_summary_gate.py --jobs-file jobs.json --run-attempt "${RUN_ATTEMPT}"
            rc=$?
            case "${rc}" in
              0) echo "::notice::CI Summary = SUCCESS (all gating jobs provably passed)"; exit 0 ;;
              1) echo "::error::CI Summary = FAILURE (fail-closed: a gating job failed/cancelled)"; exit 1 ;;
              2) : ;;  # PENDING — gating jobs still running; keep polling
              *) echo "::error::ci_summary_gate.py returned unexpected code ${rc}; failing closed"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::CI Summary poll deadline (${DEADLINE_MINUTES}m) reached with gating jobs still pending — failing closed"
              python3 scripts/ci/ci_summary_gate.py --jobs-file jobs.json --run-attempt "${RUN_ATTEMPT}" --report-only || true
              exit 1
            fi
            sleep "${POLL_INTERVAL_SECONDS}"
          done

  # ============================================================================
  # BUILD (downstream of all gates)
  # On PRs and merge_group: build-only validation (no push, no Trivy scan)
  # On push to main: full build + push to GHCR + Trivy vulnerability scan
  # ============================================================================

  build:
    name: Build Docker Image
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    permissions:
      contents: read
      packages: write
      security-events: write
    timeout-minutes: 30
    needs: [occ-preflight, quality-gate, tests-gate, security-gate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deployment/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Set lowercase image name
        id: image-name
        working-directory: ${{ github.workspace }}
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Export image for scanning
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deployment/Dockerfile
          load: true
          tags: ${{ steps.image-name.outputs.name }}:scan

      - name: Trivy vulnerability scanner (SARIF)
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.34.2 (pinned 2026-03-04)
        with:
          image-ref: ${{ steps.image-name.outputs.name }}:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.4
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Trivy vulnerability scanner (table)
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.34.2 (pinned 2026-03-04)
        with:
          image-ref: ${{ steps.image-name.outputs.name }}:scan
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  # ============================================================================
  # DEPLOYMENT
  # ============================================================================

  deploy-staging:
    name: Deploy to Staging
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: [occ-preflight, build]
    if: needs.occ-preflight.result == 'success' && (github.ref == 'refs/heads/develop' && github.event_name == 'push')
    environment:
      name: staging
      url: https://staging.omniclaude.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy to staging
        working-directory: ${{ github.workspace }}
        run: echo "Deploying to staging environment..."

  deploy-production:
    name: Deploy to Production
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: [occ-preflight, build]
    if: needs.occ-preflight.result == 'success' && (github.ref == 'refs/heads/main' && github.event_name == 'push')
    environment:
      name: production
      url: https://omniclaude.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy to production
        working-directory: ${{ github.workspace }}
        run: echo "Deploying to production environment..."

  ai-slop-check:
    needs: occ-preflight
    if: always()
    name: AI-Slop Pattern Check (strict, PR diff)
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compute changed Python/Markdown files vs PR base
        id: changed
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin "${{ github.base_ref }}" --no-tags --depth=1
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- '*.py' '*.md' | tr '\n' ' ')
          else
            FILES=$(git diff --name-only HEAD~1 -- '*.py' '*.md' 2>/dev/null | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - name: Check changed files for AI-slop patterns (strict)
        working-directory: ${{ github.workspace }}
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then exit 0; fi
          python scripts/validation/check_ai_slop.py --strict $FILES
