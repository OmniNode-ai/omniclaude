name: CI

# Consolidated CI pipeline for OmniClaude (OMN-2228)
# Replaces ci-cd.yml + enhanced-ci.yml into a single workflow
# with gate aggregators per CI/CD Standards v2

on:
  push:
    branches: [main, 'hotfix/**']
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'
  # OMN-14127: CI gates were failing mechanically while downloading/extracting
  # large transitive CUDA/PyTorch wheels under fleet/network pressure. Keep the
  # validators fail-closed, but make dependency installation tolerant enough to
  # avoid false red from transient package transfer stalls.
  UV_HTTP_TIMEOUT: '900'
  UV_CONCURRENT_DOWNLOADS: '4'
  UV_SYNC_ATTEMPTS: '3'
  UV_SYNC_RETRY_DELAY_SECONDS: '20'
  # ONEX state directory — required by hooks/lib/onex_state.py (OMN-5632)
  ONEX_STATE_DIR: /tmp/onex-state

jobs:
  # OCC preflight is the first non-OCC CI dependency. If central OCC
  # evidence is missing or red, no runner-heavy validation jobs fan out.
  occ-preflight:
    # The reusable occ-preflight.yml declares `permissions: {contents: read,
    # pull-requests: read}`. A called workflow cannot request more than the
    # caller grants, and this ci.yml has no workflow-level `permissions:` block,
    # so without this job-level grant the run's token defaults to the repo
    # `read` default (pull-requests: none) and GitHub rejects the ENTIRE
    # workflow at startup ("startup_failure"). Mirror the grant the standalone
    # call-occ-preflight.yml already sets so the reusable's declared scope is
    # satisfiable. (OMN-14104)
    permissions:
      contents: read
      pull-requests: read
    # self-gating-ok: target is in omnibase_core, not a required check on omniclaude main
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@dev
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  # ============================================================================
  # ZONE FILTER (OMN-10475)
  # ============================================================================
  # Calls the reusable workflow in omnibase_core. When every changed file is in
  # the DOCS zone (now including contracts/, drift/dod_receipts/, allowlists/,
  # .evidence/), heavy jobs (pyright, test matrix, hooks-tests,
  # agent-framework-tests, golden-chain-integrity, security-python) skip.
  # Code Quality (ruff+mypy), arch invariants, contract validation, and the
  # receipt-gate caller still run on every PR.
  zone-filter:
    needs: occ-preflight
    # self-gating-ok: target is in omnibase_core, not a required check on omniclaude main
    uses: OmniNode-ai/omnibase_core/.github/workflows/zone-filter.yml@dev
    with:
      python-version: "3.12"

  # ============================================================================
  # QUALITY CHECKS
  # ============================================================================

  quality:
    needs: occ-preflight
    if: always()
    name: Code Quality
    # OMN-14127: pure static Python checks. Keep them on GitHub-hosted runners
    # so required CI does not queue behind self-hosted fleet saturation.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Load cached venv
        if: ${{ vars.OMNI_ENABLE_VENV_CACHE_RESTORE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          attempt=1
          until uv sync --frozen --group dev --python "${PYTHON_VERSION}"; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::uv sync failed after ${attempt} attempt(s)"
              exit "$status"
            fi
            sleep_seconds=$((attempt * UV_SYNC_RETRY_DELAY_SECONDS))
            echo "::warning::uv sync attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed with exit ${status}; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Ruff format check
        working-directory: ${{ github.workspace }}
        run: uv run ruff format --check src/ tests/

      - name: Ruff lint
        working-directory: ${{ github.workspace }}
        run: uv run ruff check src/ tests/

      - name: Mypy type checking
        working-directory: ${{ github.workspace }}
        run: |
          uv run mypy src/ --config-file mypy.ini 2>&1 | tee mypy-output.txt
          ERROR_COUNT=$(grep -c "error:" mypy-output.txt 2>/dev/null || echo "0")
          echo "MyPy Summary: $ERROR_COUNT type errors found"
          if [ "$ERROR_COUNT" -gt "0" ]; then
            echo "::error::MyPy found $ERROR_COUNT type errors"
            exit 1
          fi

  docs-links:
    needs: occ-preflight
    if: always()
    name: Markdown Link Check
    # Lightweight external link check. Keep it hosted: the lychee binary can require
    # newer glibc than parts of the self-hosted fleet provide, and this job does
    # not need LAN or repository-local services.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Detect whether any *.md files changed (path filter to avoid noise on code-only PRs)
      - name: Check for changed markdown files
        id: md-changed
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.md

      - name: Check markdown links
        # On PRs: only run when *.md files changed. On push to main/develop: always run.
        if: github.event_name == 'push' || steps.md-changed.outputs.any_changed == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --exclude 'https://linear\.app'
            --exclude 'https://github\.com/OmniNode-ai'
            --exclude 'https://github\.com/fastapi'
            --exclude 'https://stackoverflow\.com'
            --exclude 'https://docs\.python\.org'
            --exclude 'https://staging\.omniclaude\.example\.com'
            --exclude 'https://omniclaude\.example\.com'
            --exclude 'http://localhost'
            --exclude 'https://www\.gnu\.org'
            --exclude 'https://www\.contributor-covenant\.org'
            --exclude 'https://claude\.ai'
            --exclude 'https://freedesktop\.org'
            --exclude 'https://www\.freedesktop\.org'
            --exclude 'https://github\.com/fastapi'
            --exclude 'https://stackoverflow\.com'
            --exclude 'https://dash\.dev\.omninode\.ai'
            --exclude 'https://www\.psycopg\.org/docs'
            --exclude 'https://docs\.anthropic\.com'
            --exclude 'https://docs\.python-guide\.org'
            --accept 200..=299,429,503,504
            '**/*.md'
          fail: true

  pyright:
    name: Pyright Type Checking
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    # OMN-14127: Pyright's bundled node runtime needs libatomic on some Linux
    # images; the self-hosted fleet is not consistently provisioned and has no
    # sudo/root repair path. This is a static check, so run it hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node for Pyright
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Ensure pyright native runtime libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          has_libatomic() {
            if command -v ldconfig >/dev/null 2>&1 && ldconfig -p | grep -q 'libatomic.so.1'; then
              return 0
            fi
            if [ -n "${PYRIGHT_LIBATOMIC_DIR:-}" ] && find "${PYRIGHT_LIBATOMIC_DIR}" -name 'libatomic.so.1*' -print -quit | grep -q .; then
              return 0
            fi
            return 1
          }
          if command -v ldconfig >/dev/null 2>&1 && ldconfig -p | grep -q 'libatomic.so.1'; then
            exit 0
          fi
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          elif [ "$(id -u)" -ne 0 ]; then
            lib_dir="${RUNNER_TEMP:-/tmp}/pyright-libatomic"
            mkdir -p "${lib_dir}"
            if command -v apt-get >/dev/null 2>&1 && command -v dpkg-deb >/dev/null 2>&1; then
              mkdir -p "${lib_dir}/apt/lists/partial" "${lib_dir}/apt/cache/archives/partial"
              apt_opts=(
                -o "Dir::State::lists=${lib_dir}/apt/lists"
                -o "Dir::Cache=${lib_dir}/apt/cache"
                -o "Dir::State::status=/var/lib/dpkg/status"
              )
              (
                cd "${lib_dir}"
                apt-get "${apt_opts[@]}" update
                apt-get "${apt_opts[@]}" download libatomic1
                dpkg-deb -x libatomic1_*.deb .
              )
              found_dir="$(find "${lib_dir}" -name 'libatomic.so.1*' -print -quit | xargs dirname)"
              {
                echo "PYRIGHT_LIBATOMIC_DIR=${lib_dir}"
                echo "LD_LIBRARY_PATH=${found_dir}:${LD_LIBRARY_PATH:-}"
              } >> "${GITHUB_ENV}"
              exit 0
            fi
            echo "::error::libatomic.so.1 is required by pyright's node runtime, but the runner user cannot install packages or extract libatomic1 locally"
            exit 1
          fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y libatomic1
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y libatomic
          elif command -v yum >/dev/null 2>&1; then
            $SUDO yum install -y libatomic
          else
            echo "::error::libatomic.so.1 is required by pyright's node runtime and no supported package manager is available"
            exit 1
          fi
          if ! has_libatomic; then
            echo "::error::libatomic.so.1 is still not visible after installation"
            exit 1
          fi

      - name: Load cached venv
        if: ${{ vars.OMNI_ENABLE_VENV_CACHE_RESTORE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          attempt=1
          until uv sync --frozen --group dev --python "${PYTHON_VERSION}"; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::uv sync failed after ${attempt} attempt(s)"
              exit "$status"
            fi
            sleep_seconds=$((attempt * UV_SYNC_RETRY_DELAY_SECONDS))
            echo "::warning::uv sync attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed with exit ${status}; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Install Pyright node runtime dependency
        run: |
          if ldconfig -p 2>/dev/null | grep -q 'libatomic.so.1'; then
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libatomic1
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y libatomic1
            exit 0
          fi
          echo "::warning::libatomic1 is not visible and cannot be installed by this runner; continuing so Pyright reports the real failure if the runtime requires it"

      - name: Pyright
        working-directory: ${{ github.workspace }}
        run: uv run pyright src/omniclaude

  check-handshake:
    needs: occ-preflight
    name: Architecture Handshake
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    if: needs.occ-preflight.result == 'success' && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout omnibase_core
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omnibase_core
          path: omnibase_core

      - name: Verify handshake is current
        working-directory: ${{ github.workspace }}
        run: ./omnibase_core/architecture-handshakes/check-handshake.sh ./omnibase_core

  # Canonical handler-shape GROWTH RATCHET fan-out (OMN-14588, per OMN-14355/14368).
  # compliance_sweep checks handler HYGIENE but is blind to handler SHAPE, so a
  # non-canonical handler passes green CI. This classifies each omniclaude node's
  # contract-declared handler (definition B: typed-payload handle(request) ->
  # response, adapted by the shared runtime, no envelope in the core), WARNs the
  # committed baseline's debt (scripts/ci/canonical_handler_shape_baseline.py,
  # OMN-14588: 132 non-canonical / 132 scanned), and HARD-FAILS a NEW non-canonical
  # node or baseline-count growth. Sourced from a sibling omnibase_core checkout
  # (the classifier lives at omnibase_core's repo-root scripts/ci/, not the
  # installed package). Runs --full (not the default --scope changed): the
  # classifier's diff-scoped git-diff runs with cwd = the classifier's OWN repo,
  # wrong for a fan-out invocation against this sibling checkout — --full is
  # cheap here (~132 nodes, sub-second). --receipts-dir is mandatory (mirrors the
  # OMN-14633 fix in the omnibase_infra fan-out): the classifier's default for a
  # non-core --package is a directory NEXT TO ITS OWN __file__ (inside the
  # ephemeral sibling checkout), which never contains this repo's committed
  # receipts. No pre-commit mirror yet: same infeasibility already verified for
  # the omnimarket/omnibase_infra fan-outs (OMN-14372/14587) — pre-commit's
  # language:python remote-hook install only ships the installed
  # src/omnibase_core/ package (classifier isn't importable that way) and
  # language:script has no dependency isolation (the classifier needs the
  # data-modeling/yaml-parsing libraries already vendored in this repo's own
  # venv); real fix is OMN-14563 (relocate the classifier into an installed
  # omnibase_core module). CI-only matches the omnimarket/omnibase_infra
  # precedent.
  canon-shape-ratchet:
    needs: occ-preflight
    name: Canonical Handler-Shape Ratchet
    # OMN-14127: pure static Python checks. Keep them on GitHub-hosted runners
    # so required CI does not queue behind self-hosted fleet saturation.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout omnibase_core validator source
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omnibase_core
          ref: dev
          path: .ci/omnibase_core

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          attempt=1
          until uv sync --frozen --group dev --python "${PYTHON_VERSION}"; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::uv sync failed after ${attempt} attempt(s)"
              exit "$status"
            fi
            sleep_seconds=$((attempt * UV_SYNC_RETRY_DELAY_SECONDS))
            echo "::warning::uv sync attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed with exit ${status}; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Canonical handler-shape ratchet (OMN-14355 fan-out, OMN-14588)
        run: |
          uv run python .ci/omnibase_core/scripts/ci/canonical_handler_shape.py \
            --package omniclaude --src-root src \
            --baseline scripts/ci/canonical_handler_shape_baseline.py \
            --receipts-dir scripts/ci/adequacy_receipts \
            --full

  enum-governance:
    needs: occ-preflight
    if: always()
    name: Enum Governance
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Load cached venv
        if: ${{ vars.OMNI_ENABLE_VENV_CACHE_RESTORE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if uv sync --frozen --group dev --python "${PYTHON_VERSION}"; then
              exit 0
            fi
            status=$?
            if [ "$attempt" -eq 4 ]; then
              echo "::error::uv sync failed after ${attempt} attempts"
              exit "$status"
            fi
            echo "::warning::uv sync failed on attempt ${attempt}; retrying in $((attempt * 10)) seconds"
            sleep $((attempt * 10))
          done

      - name: Validate enum governance
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/validation/validate_enum_governance.py

  exports-validation:
    needs: occ-preflight
    if: always()
    name: Exports Validation
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install native build toolchain
        run: |
          if command -v cc >/dev/null 2>&1; then
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y build-essential
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y build-essential
            exit 0
          fi
          echo "::warning::C compiler not found and this runner cannot install build-essential; continuing so uv can use wheels or report the actual build failure"

      - name: Load cached venv
        if: ${{ vars.OMNI_ENABLE_VENV_CACHE_RESTORE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --frozen --group dev --python "${PYTHON_VERSION}"

      - name: Validate exports
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/validation/validate_exports.py

  env-var-registry:
    needs: occ-preflight
    if: always()
    name: "Env Var Registry (OMN-6263)"
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check env var registry completeness
        working-directory: ${{ github.workspace }}
        run: |
          echo "================================================================"
          echo "Env Var Registry: os.getenv refs vs .env.example (OMN-6263)"
          echo "================================================================"
          python scripts/ci/check_env_var_registry.py \
            --scan-dirs src/omniclaude plugins/onex/hooks/lib \
            --registry .env.example \
            --allowlist-file .env.allowlist \
            --format text

  cross-repo-validation:
    needs: occ-preflight
    if: always()
    name: Kafka Import Guard
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Kafka import guard
        working-directory: ${{ github.workspace }}
        run: |
          uv run --no-project \
            --with 'omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core.git@v0.43.0' \
            python -m omnibase_core.validation.cross_repo --policy .cross-repo-policy.yaml

  migration-freeze:
    needs: occ-preflight
    if: always()
    name: Migration Freeze
    # Lightweight metadata gate: keep it hosted so branch protection cannot
    # wedge behind the self-hosted runner fleet.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch PR base for migration diff
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin \
            "+${PR_BASE_SHA}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Check migration freeze
        working-directory: ${{ github.workspace }}
        run: ./scripts/check_migration_freeze.sh --ci
        env:
          MIGRATION_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          MIGRATION_FREEZE_BYPASS: ${{ contains(github.event.pull_request.labels.*.name, 'db-split-bypass') && 'true' || '' }}

  onex-validation:
    needs: occ-preflight
    if: always()
    name: ONEX Compliance
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          attempt=1
          until uv sync --frozen --python "${PYTHON_VERSION}"; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::uv sync failed after ${attempt} attempt(s)"
              exit "$status"
            fi
            sleep_seconds=$((attempt * UV_SYNC_RETRY_DELAY_SECONDS))
            echo "::warning::uv sync attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed with exit ${status}; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Validate ONEX naming conventions
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          NODE_FILES=$(find src/omniclaude/ -name "node_*.py" -type f 2>/dev/null || true)
          if [ -z "$NODE_FILES" ]; then
            echo "No ONEX node files found -- skipping (expected for schema-only phase)"
            exit 0
          fi
          FAILED=false
          while read -r file; do
            if [[ "$file" == *"_effect.py" ]] && ! grep -q "class Node.*Effect" "$file"; then
              echo "ERROR: $file should define class Node<Name>Effect"
              FAILED=true
            fi
            if [[ "$file" == *"_compute.py" ]] && ! grep -q "class Node.*Compute" "$file"; then
              echo "ERROR: $file should define class Node<Name>Compute"
              FAILED=true
            fi
            if [[ "$file" == *"_reducer.py" ]] && ! grep -q "class Node.*Reducer" "$file"; then
              echo "ERROR: $file should define class Node<Name>Reducer"
              FAILED=true
            fi
            if [[ "$file" == *"_orchestrator.py" ]] && ! grep -q "class Node.*Orchestrator" "$file"; then
              echo "ERROR: $file should define class Node<Name>Orchestrator"
              FAILED=true
            fi
          done <<< "$NODE_FILES"
          if [ "$FAILED" = "true" ]; then exit 1; fi
          echo "All ONEX naming conventions validated"

      - name: Validate ONEX contracts
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          NODE_FILES=$(find src/omniclaude/ -name "node_*.py" -type f 2>/dev/null || true)
          if [ -z "$NODE_FILES" ]; then
            echo "No ONEX node files found -- skipping"
            exit 0
          fi
          while read -r file; do
            if ! grep -q "ModelContract" "$file" 2>/dev/null; then
              echo "WARNING: $file may be missing ModelContract usage"
            fi
          done <<< "$NODE_FILES"
          echo "Contract validation completed"

      - name: Validate ONEX method signatures
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          EFFECT_FILES=$(find src/omniclaude/ -name "*_effect.py" -type f 2>/dev/null || true)
          if [ -z "$EFFECT_FILES" ]; then
            echo "No ONEX Effect node files found -- skipping"
            exit 0
          fi
          while read -r file; do
            if grep -q "class Node.*Effect" "$file" && ! grep -q "async def execute_effect" "$file"; then
              echo "WARNING: $file Effect node should implement async def execute_effect()"
            fi
          done <<< "$EFFECT_FILES"
          echo "Method signature validation completed"

