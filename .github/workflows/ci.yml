        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Load cached venv (restore-only to avoid post-job upload timeout)
        if: ${{ vars.OMNI_ENABLE_VENV_CACHE_RESTORE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --frozen --group dev --python "${PYTHON_VERSION}"

      - name: Check ONEX architectural invariants
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/check_arch_invariants.py src/

      - name: Validate skill-node boundary (OMN-8094)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # On a dev->main promotion PR the entire dev delta shows as "changed"
            # vs main, which re-litigates pre-existing baseline violations that
            # were already gated when each piece merged to dev. Scope the diff
            # base to dev so the gate validates only the true incremental change.
            if [[ "$PR_BASE_REF" == "main" && "$PR_HEAD_REF" == promotion/*-dev-to-main ]]; then
              PR_BASE_REF="dev"
            fi
            git fetch --no-tags --depth=1 origin "$PR_BASE_REF"
            DIFF_BASE="origin/${PR_BASE_REF}"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            DIFF_BASE="$PUSH_BEFORE_SHA"
          else
            echo "::notice::No PR/push diff base available; skill-node boundary enforcement skipped."
            exit 0
          fi

          mapfile -t changed_skills < <(
            git diff --name-only --diff-filter=AM "${DIFF_BASE}" HEAD -- 'plugins/onex/skills/**/SKILL.md' |
              awk -F/ '{print $4}' |
              sort -u
          )

          if [[ "${#changed_skills[@]}" -eq 0 ]]; then
            echo "::notice::No changed ONEX SKILL.md files; baseline violations remain tracked separately."
            exit 0
          fi

          for skill in "${changed_skills[@]}"; do
            echo "::group::Validate skill-node boundary: ${skill}"
            uv run python scripts/validation/validate_skill_node_boundary.py \
              --skills-root plugins/onex/skills \
              --skill "$skill" \
              --strict
            echo "::endgroup::"
          done

  # Golden chain registry integrity (OMN-7389)
  golden-chain-integrity:
    name: Golden Chain Integrity
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout canonical omnimarket registry
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omnimarket
          ref: dev
          path: _registry/omnimarket
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Load cached venv
        if: ${{ vars.OMNI_ENABLE_VENV_CACHE_RESTORE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --frozen --group dev --python "${PYTHON_VERSION}"

      - name: Validate golden chain registry
        working-directory: ${{ github.workspace }}
        run: >-
          uv run python scripts/validation/validate_golden_chain_integrity.py
          --canonical-registry
          _registry/omnimarket/src/omnimarket/nodes/node_golden_chain_sweep/golden_chains.yaml

  # Cross-registry consistency gate (OMN-13092)
  # Hook frozenset (emit_client_wrapper.SUPPORTED_EVENT_TYPES) must be a
  # subset of the omnimarket emit-daemon YAML registry. Checks out
  # omnimarket@dev so the comparison targets the live routing authority.
  registry-consistency:
    name: Registry Consistency
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout canonical omnimarket registry
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omnimarket
          ref: dev
          path: _registry/omnimarket

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Load cached venv
        if: ${{ vars.OMNI_ENABLE_VENV_CACHE_RESTORE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --frozen --group dev --python "${PYTHON_VERSION}"

      - name: Run registry consistency tests
        working-directory: ${{ github.workspace }}
        run: >-
          uv run python scripts/validation/check_registry_consistency.py
          --daemon-registry
          "${{ github.workspace }}/_registry/omnimarket/src/omnimarket/nodes/node_emit_daemon/registries/topics.yaml"

  # Live golden-chain gate (OMN-12690)
  golden-chain-live:
    name: Golden Chain Live
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    # OMN-14127: service-container live check with no LAN dependency. Hosted
    # runners provide reliable service port mapping; the self-hosted fleet has
    # shown refused mapped Postgres ports under saturation.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOLDEN_CHAIN_TIMEOUT_MS: "30000"
      GOLDEN_CHAIN_REDPANDA_CONTAINER: omniclaude-golden-chain-redpanda-${{ github.run_id }}
      GOLDEN_CHAIN_PG_CONTAINER: omniclaude-golden-chain-postgres-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Load cached venv
        if: ${{ vars.OMNI_ENABLE_VENV_CACHE_RESTORE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --frozen --group dev --python "${PYTHON_VERSION}" --extra kafka

      - name: Start golden-chain Redpanda
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          docker rm -f "$GOLDEN_CHAIN_REDPANDA_CONTAINER" >/dev/null 2>&1 || true
          kafka_port="$(
            python - <<'PY'
          import socket

          with socket.socket() as sock:
              sock.bind(("127.0.0.1", 0))
              print(sock.getsockname()[1])
          PY
          )"
          docker run -d \
            --name "$GOLDEN_CHAIN_REDPANDA_CONTAINER" \
            -p "127.0.0.1:${kafka_port}:9092" \
            docker.redpanda.com/redpandadata/redpanda:v24.3.6 \
            redpanda start \
              --overprovisioned \
              --smp 1 \
              --memory 1G \
              --reserve-memory 0M \
              --node-id 0 \
              --check=false \
              --kafka-addr 0.0.0.0:9092 \
              --advertise-kafka-addr "127.0.0.1:${kafka_port}"

          for attempt in {1..60}; do
            if docker exec "$GOLDEN_CHAIN_REDPANDA_CONTAINER" \
              rpk cluster health | grep -q 'Healthy:.*true'; then
              echo "KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:${kafka_port}" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for golden-chain Redpanda on 127.0.0.1:${kafka_port} (${attempt}/60)..."
            sleep 2
          done

          docker logs "$GOLDEN_CHAIN_REDPANDA_CONTAINER" || true
          exit 1

      - name: Start golden-chain Postgres
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          docker rm -f "$GOLDEN_CHAIN_PG_CONTAINER" >/dev/null 2>&1 || true
          docker run -d \
            --name "$GOLDEN_CHAIN_PG_CONTAINER" \
            -e POSTGRES_USER=golden_chain \
            -e POSTGRES_DB=omnidash_analytics \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1::5432 \
            postgres:16-alpine

          for attempt in {1..60}; do
            port="$(docker port "$GOLDEN_CHAIN_PG_CONTAINER" 5432/tcp | sed -n 's/.*://p' | head -1)"
            if [ -n "$port" ] && docker exec "$GOLDEN_CHAIN_PG_CONTAINER" \
              pg_isready -h 127.0.0.1 -p 5432 -U golden_chain -d omnidash_analytics && \
              python -c 'import socket, sys; socket.create_connection(("127.0.0.1", int(sys.argv[1])), timeout=2).close()' "$port"; then
              echo "GOLDEN_CHAIN_PGPORT=${port}" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for golden-chain Postgres on 127.0.0.1:${port:-unassigned} (${attempt}/60)..."
            sleep 2
          done

          docker logs "$GOLDEN_CHAIN_PG_CONTAINER" || true
          exit 1

      - name: Run live golden-chain sweep
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          docker exec "$GOLDEN_CHAIN_PG_CONTAINER" \
            pg_isready -h 127.0.0.1 -p 5432 -U golden_chain -d omnidash_analytics
          python -c 'import socket, sys; socket.create_connection(("127.0.0.1", int(sys.argv[1])), timeout=5).close()' "$GOLDEN_CHAIN_PGPORT"
          OMNIDASH_ANALYTICS_DB_URL="postgresql://golden_chain@127.0.0.1:${GOLDEN_CHAIN_PGPORT}/omnidash_analytics" \
            uv run python scripts/ci/run_golden_chain_live.py

      - name: Stop golden-chain Postgres
        if: always()
        run: docker rm -f "$GOLDEN_CHAIN_PG_CONTAINER" >/dev/null 2>&1 || true

      - name: Stop golden-chain Redpanda
        if: always()
        run: docker rm -f "$GOLDEN_CHAIN_REDPANDA_CONTAINER" >/dev/null 2>&1 || true

  # ============================================================================
  # SECURITY CHECKS
  # ============================================================================

  security-python:
    name: Python Security Scan
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    # OMN-14127: leaf of the required "Security Gate" context. It is a pure static
    # scan (bandit) with no self-hosted/LAN dependency, so it runs on the
    # GitHub-hosted ubuntu-latest runner. Keeping the whole Security Gate subtree
    # off the self-hosted fleet is what lets the required "Security Gate" context
    # reach a terminal state even when the self-hosted fleet is fully saturated —
    # a needs-gated aggregator never posts a status until its needs are terminal.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Export requirements
        working-directory: ${{ github.workspace }}
        run: uv export --format requirements-txt --no-hashes --output-file requirements.txt

      - name: Bandit security scan
        working-directory: ${{ github.workspace }}
        run: |
          pip install bandit
          # JSON report (don't fail -- just collect)
          bandit -r src/ \
            --exclude .venv/,__pycache__/ \
            --confidence-level medium --severity-level medium \
            -f json -o bandit-report.json || true
          # Text output determines pass/fail
          bandit -r src/ \
            --exclude .venv/,__pycache__/ \
            --confidence-level medium --severity-level medium \
            -f txt

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  detect-secrets:
    needs: occ-preflight
    if: always()
    name: Secret Detection
    # OMN-14127: leaf of the required "Security Gate" context. It is a pure static
    # scan (detect-secrets) with no self-hosted/LAN dependency, so it runs on the
    # GitHub-hosted ubuntu-latest runner so the whole Security Gate subtree stays
    # off the saturated self-hosted fleet (see security-python / security-gate).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install detect-secrets
        working-directory: ${{ github.workspace }}
        run: python -m pip install detect-secrets

      # OMN-15072: resolve a ref the PR/push author does not control within
      # their own commit, so the diff below cannot be defeated by a secret
      # and its own baseline-laundering entry arriving together in one
      # commit (the same-commit `.bak` copy this replaced was blind to
      # exactly that -- see scripts/detect_secrets_ci_diff.py docstring).
      #
      # Event fields are passed via `env:` rather than interpolated into the
      # script body: a branch/ref name is attacker-influenceable (a crafted
      # base branch name containing shell metacharacters would otherwise be
      # template-expanded directly into the script before bash sees it --
      # zizmor `template-injection`).
      #
      # `pull_request` is the actual pre-merge gating path, so an unfetchable
      # base branch fails the job closed (OMN-15072's explicit "fail closed
      # on inability to fetch the target-branch baseline" requirement).
      # `merge_group`/`push` are not this repo's merge-gating trigger (no
      # merge queue; `push` fires post-merge on main/hotfix) and a
      # force-pushed branch can legitimately make `before` unreachable, so
      # those fall back to same-commit snapshot mode on fetch failure rather
      # than wedging the required Security Gate for a benign reason.
      - name: Resolve target-branch ref for baseline diff
        id: target-ref
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          case "$EVENT_NAME" in
            pull_request)
              if ! git fetch --no-tags --depth=1 origin \
                  "$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"; then
                echo "::error::could not fetch base branch '$PR_BASE_REF' for baseline diff -- failing closed"
                exit 1
              fi
              echo "ref=origin/$PR_BASE_REF" >> "$GITHUB_OUTPUT"
              ;;
            merge_group)
              if [ -n "$MERGE_GROUP_BASE_SHA" ] && \
                  git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA"; then
                echo "ref=$MERGE_GROUP_BASE_SHA" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::could not fetch merge_group base_sha -- falling back to same-commit snapshot mode"
                echo "ref=" >> "$GITHUB_OUTPUT"
              fi
              ;;
            push)
              if [ -z "$PUSH_BEFORE_SHA" ] || [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
                # First-ever push to this branch -- no target commit to diff
                # against. Falls back to same-commit snapshot mode below.
                echo "ref=" >> "$GITHUB_OUTPUT"
              elif git fetch --no-tags --depth=1 origin "$PUSH_BEFORE_SHA"; then
                echo "ref=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
              else
                # A force-pushed/rewritten history can make 'before'
                # unreachable on the remote -- not a security-relevant
                # failure for a post-merge push event.
                echo "::warning::could not fetch push 'before' SHA ($PUSH_BEFORE_SHA) -- falling back to same-commit snapshot mode"
                echo "ref=" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              # workflow_dispatch and any other trigger: no meaningful target
              # branch exists for a manual/non-gating run. Falls back to
              # same-commit snapshot mode below (narrower by design; this
              # trigger type is not part of the pre-merge gating path).
              echo "ref=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Scan for secrets
        working-directory: ${{ github.workspace }}
        env:
          TARGET_REF: ${{ steps.target-ref.outputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "$TARGET_REF" ]; then
            # No target-branch ref available for this trigger type -- fall
            # back to a same-commit pre-scan snapshot (the pre-OMN-15072
            # shape). Narrower by design; see
            # scripts/detect_secrets_ci_diff.py docstring.
            cp .secrets.baseline .secrets.baseline.bak
          fi

          # Scan updates the baseline in-place with any new secrets.
          #
          # --no-verify (OMN-15063): several plugins (SlackDetector,
          # StripeDetector, ...) call the live vendor API to "verify" each
          # regex-matched candidate, then silently drop anything that comes
          # back VERIFIED_FALSE. RED-proven: a synthetic Slack incoming-
          # webhook URL and a synthetic Slack bot token, both matching the
          # dedicated SlackDetector regex, were silently absent from the
          # report without this flag even though the regex matched. A
          # negative/uncertain live-verification result must not silently
          # remove a finding (fail-closed). Never remove this flag without
          # re-proving the miss is fixed another way.
          detect-secrets scan \
            --no-verify \
            --baseline .secrets.baseline \
            --exclude-files '\.lock$' \
            --exclude-files '\.env\.example$' \
            --exclude-files 'bandit-report\.json$' \
            --exclude-files '^tests/' \
            --exclude-files 'security-report\.json$'

          # OMN-15072: diff against the target-branch baseline (a ref this
          # PR/push cannot rewrite within its own commit) instead of a
          # same-commit copy, so a secret arriving alongside its own
          # baseline-laundering entry is caught. Reuses OMN-15068's
          # audited-vs-unaudited classification
          # (scripts/detect_secrets_guard.py) -- one canonical
          # implementation, not a second copy of the same logic.
          if [ -n "$TARGET_REF" ]; then
            python3 scripts/detect_secrets_ci_diff.py --target-ref "$TARGET_REF"
          else
            python3 scripts/detect_secrets_ci_diff.py --fallback-baseline .secrets.baseline.bak
          fi

          echo "Secret detection completed - no new unaudited secrets found"

  # ============================================================================
  # TEST SUITES
  # ============================================================================

  # ---------------------------------------------------------------------------
  # Detect Changes (OMN-10760) — maps changed files to test directories.
  # Outputs consumed by the test job: matrix, split_count, is_full_suite,
  # selected_paths. When ENABLE_SMART_TESTS is off (or unset), emits a 5-shard
  # full-suite matrix so behavior is identical to the previous fixed split.
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    needs: [occ-preflight, zone-filter, quality-gate]
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    if:  needs.occ-preflight.result == 'success' && (always() && needs.zone-filter.outputs.docs_only != 'true' && needs.quality-gate.result == 'success')
    outputs:
      is_full_suite: ${{ steps.detect.outputs.is_full_suite }}
      full_suite_reason: ${{ steps.detect.outputs.full_suite_reason }}
      split_count: ${{ steps.detect.outputs.split_count }}
      matrix: ${{ steps.detect.outputs.matrix }}
      selected_paths: ${{ steps.detect.outputs.selected_paths }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --frozen --python "${PYTHON_VERSION}"

      - name: Compute changed files
        id: diff
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base" || true
            git diff --name-only "$base"...HEAD > changed.txt
          else
            git diff --name-only HEAD~1 HEAD > changed.txt || echo "" > changed.txt
          fi
          echo "Changed files:"
          cat changed.txt

      - name: Resolve test selection
        id: detect
        working-directory: ${{ github.workspace }}
        env:
          FLAG: ${{ vars.ENABLE_SMART_TESTS == 'true' && 'on' || 'off' }}
        run: |
          uv run python -m scripts.ci.detect_test_paths \
            --changed-files-from changed.txt \
            --ref-name "${{ github.ref_name }}" \
            --event-name "${{ github.event_name }}" \
            --feature-flag "$FLAG" \
            > selection.json
          cat selection.json
          is_full=$(jq -r '.is_full_suite' selection.json)
          reason=$(jq -r '.full_suite_reason // ""' selection.json)
          split_count=$(jq -r '.split_count' selection.json)
          matrix=$(jq -c '.matrix' selection.json)
          paths=$(jq -c '.selected_paths' selection.json)
          echo "is_full_suite=$is_full" >> "$GITHUB_OUTPUT"
          echo "full_suite_reason=$reason" >> "$GITHUB_OUTPUT"
          echo "split_count=$split_count" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "selected_paths=$paths" >> "$GITHUB_OUTPUT"

      - name: Upload selection artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-selection
          path: selection.json
          retention-days: 7

  # Parallel test execution — matrix shape driven by detect-changes output (OMN-10760).
  # When ENABLE_SMART_TESTS is off (default), detect-changes emits a 5-shard full-suite
  # matrix so behavior is identical to the previous fixed split.
  # When the flag is on and the change set is small, a smaller matrix and
  # selected_paths activate the smart-selection pytest step.
  test:
    name: Tests (Split ${{ matrix.split }}/${{ needs.detect-changes.outputs.split_count }})
    needs: [occ-preflight, zone-filter, quality-gate, detect-changes]
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'dev')))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    if:  needs.occ-preflight.result == 'success' && (always() && needs.zone-filter.outputs.docs_only != 'true' && needs.quality-gate.result == 'success')
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        split: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432/tcp

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379/tcp

    env:
      # Database environment variables must be available to all steps,
      # not just the test step, to prevent psycopg2 OS-user fallback
      # (which causes "FATAL: role root does not exist" on CI runners)
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DATABASE: test_db
      TEST_PG_DSN: postgresql://test:test@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Export service ports
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "POSTGRES_PORT=${{ job.services.postgres.ports['5432'] }}"
            echo "DATABASE_URL=postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/test_db"
            echo "TEST_PG_DSN=postgresql://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/test_db"
            echo "REDIS_URL=redis://localhost:${{ job.services.redis.ports['6379'] }}/0"
          } >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Load cached venv
        if: ${{ vars.OMNI_ENABLE_VENV_CACHE_RESTORE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          uv sync --frozen --group dev --python "${PYTHON_VERSION}"
          uv pip install pytest-split pytest-cov

      - name: Auto-generate skill nodes
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/generate_skill_node.py --all

      - name: Run tests (smart selection)
        if: vars.ENABLE_SMART_TESTS == 'true' && needs.detect-changes.outputs.is_full_suite == 'false'
        working-directory: ${{ github.workspace }}
        run: |
          # Exit code 5 = no tests collected (expected for some splits)
          set +e
          paths=$(echo '${{ needs.detect-changes.outputs.selected_paths }}' | jq -r '.[]')
          uv run pytest -o addopts="" $paths \
            --ignore=tests/integration \
            --splits ${{ needs.detect-changes.outputs.split_count }} \
            --group ${{ matrix.split }} \
            -v -m "not integration" \
            --cov=src/omniclaude \
            --cov-report=term-missing \
            --junitxml=junit-test-${{ matrix.split }}.xml
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 5 ]; then
            echo "::error::Tests failed with exit code $EXIT_CODE"
            exit 1
          fi

          mv .coverage .coverage.${{ matrix.split }} 2>/dev/null || true

      - name: Run tests (full suite)
        if: vars.ENABLE_SMART_TESTS != 'true' || needs.detect-changes.outputs.is_full_suite == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          # Run all tests split into groups. Exit code 5 = no tests collected.
          set +e
          uv run pytest -o addopts="" tests/ \
            --splits ${{ needs.detect-changes.outputs.split_count }} \
            --group ${{ matrix.split }} \
            -v -m "not integration" \
            --cov=src/omniclaude \
            --cov-report=term-missing \
            --junitxml=junit-test-${{ matrix.split }}.xml
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 5 ]; then
            echo "::error::Tests failed with exit code $EXIT_CODE"
            exit 1
          fi

          mv .coverage .coverage.${{ matrix.split }} 2>/dev/null || true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: coverage-test-group-${{ matrix.split }}
          path: .coverage.${{ matrix.split }}
          retention-days: 1

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: test-results-${{ matrix.split }}
          path: junit-test-${{ matrix.split }}.xml

