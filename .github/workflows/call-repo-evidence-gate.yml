#
# Repo Evidence Gate caller (OMN-20073, OCC retirement OR.5) verifies
# omniclaude's own contracts/<OMN-N>.yaml at the PR head through
# omnibase_core's receipt-gate reusable with evidence-source: caller.
# This is the path omnimarket proved as the canary (OMN-20070, OMN-20072).
#
# Why pull_request_target: GitHub reads the workflow definition from the BASE
# branch, so a pull request that edits this file or the reusable's pin does not
# change which definition runs on it. The pull request's own code is only ever
# checked out as data by the reusable, which refuses fork heads.
#
# dev and main are the integration branches. The activity types cover new heads,
# reopened and ready PRs, and edits to the ticket citation or base branch.
# Per-PR concurrency cancels superseded runs so the latest event gets a verdict.
# Read-only contents and pull-requests permissions are all this caller needs;
# checkout and verification belong to the reusable, with no caller secrets.
# The dev-merge tag of omnibase_core makes the reusable a fixed ref (the repo's
# ruling is tags, never full commit shas); verifier-version pins the released
# verifier used to read the caller's contracts.
#
# The job id is the context prefix: repo-evidence / dod-verify carries the
# verdict, so do not add a job name.
#
# S6 cut-over (OMN-20074): the caller enforces repo-owned evidence with
# shadow: "false" and compare-with-occ: "false". CI Summary requires the
# repo-evidence / dod-verify verdict; a repository ruleset requires that
# context directly. Admission no longer compares against OCC. Rollback is
# setting compare-with-occ back to "true".
#
# The reusable is pinned to a dev-merge tag of omnibase_core, never a full
# commit sha. The tag is a descendant of #1932 and #1912: it carries the
# `shadow` input, the contract-home marker (with compare-with-occ "true" the
# head step names the repository that holds a ticket's only other contract, and
# verifier 0.4.305 classifies that refusal as contract_in_another_repo), the
# writer app diff hand-off (#1927, #1931), the VERIFIER_FLOOR refusal of a
# verifier-version below 0.4.303, and the fix-parent control fallback
# (control_uses_fix_parent). verifier-version 0.4.310 is the first omnimarket
# release that ships both writer app classifiers (omnimarket#3694); it also
# carries omnimarket#3751, so a contract that repeats a mapping key is refused.
# The pin is advanced by omnimarket's node_receipt_gate_pin_advance_compute
# (OMN-20134), which edits the uses line and RECEIPT_GATE_PIN_TAG in
# tests/ci/receipt_gate_pin.py.
# omniclaude does not host receipt-gate.yml.

name: Repo Evidence Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  repo-evidence:
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@dev-20261030152335-66d35d2283c3 # omnibase_core dev-merge tag; carries the fix-parent control fallback (OMN-20134)
    with:
      evidence-source: caller
      verifier-version: 0.4.310
      compare-with-occ: "false"
      shadow: "false"
