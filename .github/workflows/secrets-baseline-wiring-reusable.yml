#
# Secrets Baseline Wiring Gate (reusable). OMN-18669.
#
# A repository carrying `.secrets.baseline` must also carry a pre-commit hook
# AND a CI workflow that read it. The file on its own blocks nothing, proves
# nothing, and looks exactly like a repository that is protected.
#
# Measured 2026-09-18 (integration probe R9): omnimemory's committed baseline
# was read by no hook and no workflow. A full scan against it surfaced 47
# findings in 18 files that nothing had ever been asked to approve. Nobody had
# loosened a gate; there was no gate.
#
# Usage in caller repos:
#   jobs:
#     secrets-baseline-wiring:
#       uses: OmniNode-ai/omniclaude/.github/workflows/secrets-baseline-wiring-reusable.yml@<immutable-sha>
#
# Surfaced check context in the caller: `secrets-baseline-wiring /
# secrets-baseline-wiring` (caller job id / this job's name). Register THAT in
# branch protection, or feed the caller job into the repository's existing
# required aggregate.
#
# ONE pin, not two: the validator checkout uses validated `job.workflow_sha`
# -- the SHA this reusable workflow was resolved at -- so the caller's `uses:`
# SHA is the single source of truth for both the workflow and the script.
# Pin to an omniclaude commit on `dev`; `main` is release-synced and may not
# carry the validator. `validator_ref:` remains as an explicit override.
#
# Canonical validator: scripts/secrets_baseline_wiring_gate.py (this repo). The
# same script runs locally via the exported `secrets-baseline-wired` pre-commit
# hook, so the local and CI verdicts cannot diverge.

name: Secrets Baseline Wiring Gate (reusable)

on:
  workflow_call:
    inputs:
      validator_ref:
        description: >-
          Optional full 40-hex omniclaude commit SHA used to fetch the validator
          for external caller repos. Leave unset in normal use: the default is
          job.workflow_sha, the exact SHA the caller pinned. Branch names are
          refused.
        type: string
        required: false

permissions:
  contents: read

jobs:
  secrets-baseline-wiring:
    name: secrets-baseline-wiring
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public FORK PRs default to ubuntu-latest
    # The untrusted test is the FORK test and only the fork test (OMN-18205):
    # a same-repo pull request is written by someone who can already push here,
    # and the 2026-09-14 operator ruling forbids pinning a private repository's
    # required checks to GitHub-hosted runners.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 10
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          # Whole-tree invariant, no base-ref diff, so depth 1 is enough.
          persist-credentials: false

      # The validator lives in omniclaude. When called from another repo,
      # GITHUB_WORKSPACE holds the CALLER's tree, so pull just the script into
      # a side path -- mirrors kb-doc-gate-reusable.yml.
      - name: Resolve the gate pin
        id: pin
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          REF_OVERRIDE: ${{ inputs.validator_ref }}
        run: |
          set -euo pipefail
          resolved_pin="${REF_OVERRIDE:-$WORKFLOW_SHA}"
          if [[ ! "$resolved_pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::secrets-baseline-wiring pin is empty or is not a lowercase 40-hex commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$WORKFLOW_REPOSITORY" != "OmniNode-ai/omniclaude" ]; then
            echo "::error::workflow repository is '$WORKFLOW_REPOSITORY', not OmniNode-ai/omniclaude. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "sha=$resolved_pin" >> "$GITHUB_OUTPUT"
          echo "secrets-baseline-wiring pin: $resolved_pin"

      - name: Fetch wiring validator (omniclaude canonical source)
        if: github.repository != 'OmniNode-ai/omniclaude'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OmniNode-ai/omniclaude
          ref: ${{ steps.pin.outputs.sha }}
          path: .omniclaude-secrets-baseline-wiring
          persist-credentials: false
          sparse-checkout: |
            scripts/secrets_baseline_wiring_gate.py
          sparse-checkout-cone-mode: false

      - name: Assert the secrets-baseline-wiring checkout is at the pin
        if: github.repository != 'OmniNode-ai/omniclaude'
        env:
          GATE_PIN: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          if ! checked_out_sha="$(git -C .omniclaude-secrets-baseline-wiring rev-parse HEAD)"; then
            echo "::error::could not resolve the fetched secrets-baseline-wiring commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$checked_out_sha" != "$GATE_PIN" ]; then
            echo "::error::secrets-baseline-wiring checkout is at $checked_out_sha, expected $GATE_PIN. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "secrets-baseline-wiring checked out at $checked_out_sha"

      - name: Run secrets-baseline-wiring gate
        env:
          SCRIPT_PATH: >-
            ${{ github.repository != 'OmniNode-ai/omniclaude'
                && '.omniclaude-secrets-baseline-wiring/scripts/secrets_baseline_wiring_gate.py'
                || 'scripts/secrets_baseline_wiring_gate.py' }}
        run: |
          set -euo pipefail
          # Fail LOUD, not with a bare "python3: can't open file ... Errno 2".
          # A sparse checkout of a path absent at the requested ref SUCCEEDS and
          # leaves an empty side path, so a bad validator ref would otherwise
          # surface as an exit-2 that reads like a gate verdict but is actually
          # "the gate never ran". Name the cause.
          if [ ! -f "${SCRIPT_PATH}" ]; then
            echo "::error::secrets-baseline-wiring validator not found at ${SCRIPT_PATH}." \
                 "The omniclaude ref this workflow was fetched from does not carry" \
                 "scripts/secrets_baseline_wiring_gate.py. Pin the caller's 'uses:' to" \
                 "an omniclaude commit that contains the validator (or pass" \
                 "validator_ref explicitly). THE GATE DID NOT RUN."
            exit 1
          fi
          python3 "${SCRIPT_PATH}" --repo-root .
