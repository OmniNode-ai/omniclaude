#
# Secrets Baseline Wiring Gate — thin caller for omniclaude's own PRs. OMN-18669.
#
# omniclaude hosts the validator and the reusable workflow, so it calls them by
# local path (`./`) rather than by pinned SHA: there is no cross-repo drift to
# pin against, and a local call keeps the gate's own repo honest on the same
# commit that changes the gate. Every other repo pins
# `OmniNode-ai/omniclaude/.github/workflows/secrets-baseline-wiring-reusable.yml@<sha>`.
#
# Surfaced check context: `secrets-baseline-wiring / secrets-baseline-wiring`
# (caller job id / reusable job name).

name: Secrets Baseline Wiring Gate

on:
  pull_request:
    branches: [dev]

# OMN-19644: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  secrets-baseline-wiring:
    uses: ./.github/workflows/secrets-baseline-wiring-reusable.yml
