name: Check Architecture Handshake

on:
  push:
    branches: [main, develop, 'hotfix/**']
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:

# OMN-19644: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  check-handshake:
    needs: occ-preflight
    name: Check architecture handshake
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.base.ref == 'dev'))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Checkout omnibase_core
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omnibase_core
          # Auto-bumped by omnibase_core publish-downstream-pin-bump.yml to ad62c0b92876.
          ref: ad62c0b928760958fb073a9e32621de53c4a9a1a  # pragma: allowlist secret
          path: omnibase_core

      - name: Verify omnibase_core checkout
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -f omnibase_core/architecture-handshakes/check-handshake.sh ]; then
            echo "::error::Failed to checkout omnibase_core or check-handshake.sh not found."
            exit 1
          fi

      - name: Check architecture handshake
        working-directory: ${{ github.workspace }}
        run: bash omnibase_core/architecture-handshakes/check-handshake.sh
