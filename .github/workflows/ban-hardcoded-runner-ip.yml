# ban-hardcoded-runner-ip.yml
#
# CI gate: reject PRs that introduce literal 192.168.86.201 (or variant  # onex-allow-internal-ip
# "\.201") references inside the scanned path set.
#
# Scanned paths (OMN-17993): .github/workflows/** AND tests/**.
# Until OMN-17993 this gate scanned workflow files only. omnibase_compat — a
# repo that ships this very workflow — carried the exact banned literal as a
# fixture value in tests/unit/contracts/delegation/, and the gate reported
# green over it. Every repo that inherited this workflow had the same blind
# spot. A gate scoped to a subtree reports green over the rest of the tree.
#
# Runner routing must be config/variable-driven (vars.OMNI_TRUSTED_CI_RUNS_ON_JSON).
# Direct IP literals in workflow files create non-portable, incident-fragile
# pipelines. Implements OMN-10603.
#
# Annotation exception: lines containing "# onex-allow-internal-ip" are
# allowed through (for comments that document why a LAN constraint exists,
# not for actual runs-on values).
#
# Usage (call from any repo's omni-standards-compliance.yml):
#
#   uses: OmniNode-ai/omniclaude/.github/workflows/ban-hardcoded-runner-ip.yml@main
#
# Or call directly in a standalone workflow:
#
#   jobs:
#     ban-runner-ip:
#       uses: OmniNode-ai/omniclaude/.github/workflows/ban-hardcoded-runner-ip.yml@main
#
# OMN-20074 (OCC retirement, epic OMN-20068): this reusable no longer runs the change-control
# preflight. The scan reads only the caller's own .github/workflows/** and tests/**, so it needs
# nothing from the preflight, and a caller that drops the change-control required context keeps
# the scan. The scan job keeps its name, so the caller context `<caller job id> /
# ban-hardcoded-runner-ip` is unchanged. Callers pin this file by sha, so each one adopts the
# change by its own bump.
#
# Disable procedure (for runner/merge-queue incidents):
# Set repository variable SKIP_RUNNER_IP_GATE=1 temporarily.
# Restore by unsetting or setting to empty string.
# Document the outage window in the incident record.

name: Ban Hardcoded Runner IP

on:
  workflow_call:
  pull_request:
    branches: [main, dev]
    paths:
      - '.github/workflows/**'
      - 'tests/**'

jobs:
  ban-hardcoded-runner-ip:
    name: ban-hardcoded-runner-ip
    # OMNI_RUNNER_SELECTOR_V1 - trusted events default to self-hosted omnibase-ci; pull_request defaults to ubuntu-latest
    # OMN-18205: the untrusted test is the FORK test, and only the fork test.
    # This selector sent EVERY pull request to the public class, same-repo ones
    # included, so every repository consuming this reusable had the check
    # pinned to GitHub-hosted runners regardless of its own routing shadow.
    # That is what the 2026-09-14 operator ruling forbids for private
    # repositories, and the enterprise hosted-runner switch has since made the
    # placement unrunnable outright. A genuine fork pull request still resolves
    # to OMNI_PUBLIC_PR_RUNS_ON_JSON, so the OMN-16683 boundary is unchanged.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject hardcoded runner IP literals in scanned paths
        shell: bash
        env:
          # OMN-17993: the scanned path set. Workflow files were the original
          # scope; tests/ was the blind spot that carried the live CRITICAL.
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          VIOLATIONS=""
          VIOLATION_COUNT=0

          # Scan only changed files in the scanned path set on PRs; full scan
          # otherwise.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SCAN_FILES=$(git diff --name-only origin/main...HEAD \
              -- '.github/workflows/*.yml' '.github/workflows/**/*.yml' \
                 '.github/workflows/*.yaml' '.github/workflows/**/*.yaml' \
                 'tests/**' 2>/dev/null || true)
          else
            SCAN_FILES=$( { find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null || true; \
                            find tests -type f 2>/dev/null || true; } )
          fi

          if [ -z "$SCAN_FILES" ]; then
            echo "No files in the scanned path set (.github/workflows/**, tests/**)."
            exit 0
          fi

          while IFS= read -r wf; do
            [ -f "$wf" ] || continue
            # Binary files produce no useful match; grep -I skips them.

            # Check for literal 192.168.86.201 — skip lines with allow annotation  # onex-allow-internal-ip
            while IFS= read -r line; do
              LINE_NUM=$(echo "$line" | cut -d: -f1)
              LINE_CONTENT=$(echo "$line" | cut -d: -f2-)
              # Skip annotated exceptions
              if echo "$LINE_CONTENT" | grep -q "onex-allow-internal-ip"; then
                continue
              fi
              VIOLATIONS="${VIOLATIONS}  ${wf}:${LINE_NUM}: ${LINE_CONTENT}"$'\n'
              VIOLATION_COUNT=$((VIOLATION_COUNT + 1))
            done < <(grep -In "192\.168\.86\.201" "$wf" 2>/dev/null || true)  # onex-allow-internal-ip

          done <<< "$SCAN_FILES"

          if [ "$VIOLATION_COUNT" -gt 0 ]; then
            echo "::error::Found ${VIOLATION_COUNT} hardcoded runner IP literal(s) in .github/workflows/** or tests/**:"
            echo ""
            echo "$VIOLATIONS"
            echo ""
            echo "Runner routing must use vars.OMNI_TRUSTED_CI_RUNS_ON_JSON (see OMN-10603)."
            echo "A test fixture must use a non-routable placeholder, never the real lab address (see OMN-17993)."
            echo "If a comment must reference the IP for documentation, add '# onex-allow-internal-ip' on that line."
            echo ""
            echo "To temporarily disable this gate during a runner incident:"
            echo "  Set repository variable SKIP_RUNNER_IP_GATE=1"
            echo "  Restore after incident: unset or set to empty string"
            exit 1
          fi

          echo "No hardcoded runner IP literals found in .github/workflows/** or tests/**."

      # OMN-19895. Operator rulings 2026-09-28T01:58:06Z ("it's a problem if
      # checks are reliant on a specific machine") and 01:58:17Z ("chain of
      # responders right?"). A check pinned to one machine stops the day that
      # machine does, and can only ever grade that machine. Four shapes of pin
      # are refused in every workflow file, on every event (a full scan, not
      # just the changed files: a pin already on the default branch is still a
      # pin). There is NO annotation escape and NO allowlist for these four; a
      # job that must run beside one lane names it through a repository
      # variable (runs-on: ${{ fromJSON(vars.X) }}), which is data, not code.
      #   MP1  a host label (host-<number>, or any host-<name> on a runs-on line)
      #        outside a comment
      #   MP2  a hostname or runner-name assertion (test "$(hostname)" = x,
      #        socket.gethostname() == x, runner.name == x, uname -n ...)
      #   MP3  a private IPv4 host literal (10/8, 172.16/12, 192.168/16) outside
      #        a comment; a CIDR block (a.b.c.d/nn) is a subnet, not a host
      #   MP4  a host path pruned out of a scan (-prune, --exclude, -not -path,
      #        ... naming /home, /Users, /data, /srv, /mnt, /Volumes or /opt)
      - name: Reject machine pins in workflow files (OMN-19895)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'MACHINE_PIN_SCAN'
          import pathlib
          import re
          import sys

          RULES = [
              (
                  "MP1 host label",
                  re.compile(
                      r"(?<![A-Za-z0-9_.-])host-\d+(?![A-Za-z0-9_.-])"
                      r"|runs-on:[^\n]*(?<![A-Za-z0-9_.-])host-[A-Za-z0-9]"
                  ),
              ),
              (
                  "MP2 hostname assertion",
                  re.compile(
                      r"(\$\(\s*(hostname|uname\s+-n)\b[^)]*\)|`\s*(hostname|uname\s+-n)\b[^`]*`"
                      r"|gethostname\(\)|platform\.node\(\)|runner\.name|RUNNER" "_NAME)"
                      r"[^\n]*?(==|!=|\s=\s|\s-eq\s)"
                      r"|(==|!=|\s=\s)\s*[^\n]*?(\$\(\s*hostname\b|gethostname\(\)|platform\.node\(\)|runner\.name\b|RUNNER" "_NAME\b)"
                  ),
              ),
              (
                  "MP3 private IPv4 literal",
                  re.compile(
                      r"(?<![0-9.])(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}"
                      r"|192\.168\.\d{1,3}\.\d{1,3})(?![0-9.]|/\d)"
                  ),
              ),
              (
                  "MP4 host-path prune",
                  re.compile(
                      r"(-prune|--exclude(-dir)?|--skip|--ignore|-not\s+-path|!\s+-path)\b[^\n]*?"
                      r"['\"]?/(home|Users|data|srv|mnt|Volumes|opt)/"
                      r"|['\"]?/(home|Users|data|srv|mnt|Volumes|opt)/[^\s'\"]*['\"]?\s+-prune\b"
                  ),
              ),
          ]

          def code_part(line: str) -> str:
              stripped = line.lstrip()
              if stripped.startswith("#"):
                  return ""
              # A trailing YAML comment is prose, not a pin. Only cut at " #" so a
              # '#' inside a shell string or URL fragment is not mistaken for one.
              cut = re.search(r"\s#\s", line)
              return line[: cut.start()] if cut else line

          root = pathlib.Path(".github/workflows")
          files = sorted(
              p for p in root.rglob("*") if p.is_file() and p.suffix in (".yml", ".yaml")
          ) if root.is_dir() else []
          findings = []
          for path in files:
              for number, line in enumerate(path.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                  code = code_part(line)
                  if not code.strip():
                      continue
                  for rule, pattern in RULES:
                      if pattern.search(code):
                          findings.append(f"  {path}:{number}: [{rule}] {line.strip()}")
          if findings:
              print(f"::error::Found {len(findings)} machine pin(s) in .github/workflows/** (OMN-19895):")
              print("\n".join(findings))
              print("")
              print("A check must not rely on a specific machine. Take the runner set from a")
              # OMN-19895 follow-up: this literal must never appear contiguously in
              # a run: block. GitHub's workflow template parser evaluates any dollar-
              # brace-brace expression it finds in a run script before the shell ever
              # sees it, and fromJSON(vars.X) against an unset variable fails the
              # whole workflow file with "Error reading JToken from JsonReader" (an
              # empty-string JSON parse). Splitting the token keeps the printed text
              # identical while keeping it out of GitHub's expression scanner.
              print("repository variable (runs-on: $" + "{{ fromJSON(vars.X) }}, no literal fallback),")
              print("take lab addresses from the deployment overlay, and assert what a runner must")
              print("BE, never which machine it is. There is no annotation escape for these rules.")
              sys.exit(1)
          print(f"No machine pins in {len(files)} workflow file(s).")
          MACHINE_PIN_SCAN
