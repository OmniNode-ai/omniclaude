#
# Reusable workflow: deploy-gate validator (DGM-Phase6, OMN-9734).
# Canonical source — all repos call this via uses: instead of running
# their own copy of validate_pr_deploy_required.py.
#
# Canonical validator: OMN-9685 (omnibase_core PR #902, 2026-04-25).
# Centralised: OMN-9734 (DGM-Phase6). Supersedes DGM-Phase2.
# OMN-20074: the cited ticket's contract is read from the caller's own
# contracts/OMN-<n>.yaml at the pull request head (the file its repo-evidence /
# dod-verify reads). No other repository's tree is checked out.
#
# Usage in caller repos:
#   jobs:
#     deploy-gate:
#       uses: OmniNode-ai/omniclaude/.github/workflows/deploy-gate-reusable.yml@main
#       secrets: inherit

name: Deploy Gate (reusable)

on:
  workflow_call:
    inputs:
      pr-number:
        description: PR number to validate (defaults to github.event.pull_request.number)
        type: number
        required: false
        default: 0
      contracts-dir:
        description: >
          Ignored. The contracts are read from the caller's own contracts/ at the
          pull request head. Kept so a caller that still passes it keeps resolving.
        type: string
        required: false
        default: contracts
      contract-source:
        description: >
          OMN-20074. Only "caller" is valid and it is the default: the cited
          ticket's contract is read from the caller's own contracts/OMN-<n>.yaml
          at the pull request head. Any other value fails the job.
        type: string
        required: false
        default: caller

jobs:
  # OMN-14260: a nested occ-preflight job here once escalated the caller
  # token's permissions and startup-failed every caller's deploy-gate. It stays
  # out; do not add a nested reusable without granting the caller job its
  # permissions first.
  deploy-gate:
    name: deploy-gate
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to ubuntu-latest; public forks default to ubuntu-latest
    # OMN-18205: the untrusted test is the FORK test, and only the fork test.
    # It used to also send every same-repo pull request whose base is `dev`
    # to the public class. That is not a trust boundary -- a same-repo pull
    # request is written by someone who can already push to this repository,
    # and the sibling pr-title reusable has always used the fork test alone.
    # What the extra clause actually did was pin every private repository's
    # required checks to GitHub-hosted runners, which the 2026-09-14 operator
    # ruling forbids and which the enterprise hosted-runner switch has since
    # made unrunnable. A genuine fork pull request still resolves to
    # OMNI_PUBLIC_PR_RUNS_ON_JSON, so the boundary OMN-16683 exists to hold
    # is unchanged.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || (github.event.repository.private && '["self-hosted","omnibase-ci"]' || '["ubuntu-latest"]'))
      }}
    timeout-minutes: 25

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7

      # The composite action lives in omniclaude (this repo), but the job's
      # GITHUB_WORKSPACE holds the *caller* repo's tree. Pull the composite
      # action from omniclaude at the workflow pin into a side path.
      - name: Resolve the deploy-gate pin
        id: pin
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy-gate pin is empty or is not a lowercase 40-hex commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$WORKFLOW_REPOSITORY" != "OmniNode-ai/omniclaude" ]; then
            echo "::error::workflow repository is '$WORKFLOW_REPOSITORY', not OmniNode-ai/omniclaude. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve the deploy-gate contract source
        env:
          CONTRACT_SOURCE: ${{ inputs.contract-source }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$CONTRACT_SOURCE" != "caller" ]; then
            echo "::error::contract-source is '$CONTRACT_SOURCE'; expected caller. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$EVENT_NAME" != "merge_group" ] && [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::contract-source caller reads the pull request head's contracts, but this '$EVENT_NAME' event carries no pull request head sha. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "::notice::deploy-gate contract source: $CONTRACT_SOURCE"

      - name: Fetch deploy-gate support scripts (omniclaude)
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OmniNode-ai/omniclaude
          ref: ${{ steps.pin.outputs.sha }}
          path: .omniclaude-deploy-gate
          persist-credentials: false
          sparse-checkout: |
            .github/actions/deploy-gate
          sparse-checkout-cone-mode: false

      - name: Assert the deploy-gate checkout is at the pin and carries its files
        if: github.event_name != 'merge_group'
        env:
          GATE_PIN: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          if ! checked_out_sha="$(git -C .omniclaude-deploy-gate rev-parse HEAD)"; then
            echo "::error::could not resolve the fetched deploy-gate commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$checked_out_sha" != "$GATE_PIN" ]; then
            echo "::error::deploy-gate checkout is at $checked_out_sha, expected $GATE_PIN. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ ! -f ".omniclaude-deploy-gate/.github/actions/deploy-gate/action.yml" ]; then
            echo "::error::.omniclaude-deploy-gate/.github/actions/deploy-gate/action.yml is missing from the deploy-gate checkout at $GATE_PIN. THE GATE DID NOT RUN."
            exit 1
          fi

      # OMN-20074: the caller's contract is its own, at the pull request head.
      - name: Checkout the caller's pull request head contracts
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr-head
          persist-credentials: false
          sparse-checkout: /contracts/
          sparse-checkout-cone-mode: false

      - name: Skip on merge_group
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: |
          echo "::notice::deploy-gate: merge_group event — skipped (validated on PR branch)."

      - name: Run deploy gate (canonical composite action)
        if: github.event_name != 'merge_group'
        uses: ./.omniclaude-deploy-gate/.github/actions/deploy-gate
        with:
          pr-number: ${{ inputs.pr-number != 0 && inputs.pr-number || github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          contracts-dir: .pr-head/contracts
          # OMN-14505: composite actions cannot read `vars` directly, so the
          # org variable is resolved here (job scope, where `vars` is valid)
          # and threaded through as an input.
          falsifiability-mode: ${{ vars.DEPLOY_GATE_FALSIFIABILITY || 'report' }}
