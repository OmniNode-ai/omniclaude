#
# Reusable workflow: deploy-gate validator (DGM-Phase6, OMN-9734).
# Canonical source — all repos call this via uses: instead of running
# their own copy of validate_pr_deploy_required.py.
#
# Canonical validator: OMN-9685 (omnibase_core PR #902, 2026-04-25).
# Centralised: OMN-9734 (DGM-Phase6). Supersedes DGM-Phase2.
# OCC contract resolution: OMN-11423 — contracts read from onex_change_control, not caller repo.
# OMN-20074: a caller that is cut over passes contract-source: caller, and the
# contract is read from its own contracts/OMN-<n>.yaml at the pull request head
# (the file its repo-evidence / dod-verify reads). The default stays "occ".
#
# Usage in caller repos:
#   jobs:
#     deploy-gate:
#       uses: OmniNode-ai/omniclaude/.github/workflows/deploy-gate-reusable.yml@main
#       secrets: inherit

name: Deploy Gate (reusable)

on:
  workflow_call:
    inputs:
      pr-number:
        description: PR number to validate (defaults to github.event.pull_request.number)
        type: number
        required: false
        default: 0
      contracts-dir:
        description: >
          Deprecated (OMN-11423). Contracts are now read from onex_change_control;
          this input is ignored. Remove it from your caller workflow.
        type: string
        required: false
        default: contracts
      contract-source:
        description: >
          OMN-20074. "occ" (default): the cited ticket's contract is read from
          onex_change_control, for callers not yet cut over. "caller": it is
          read from the caller's own contracts/OMN-<n>.yaml at the pull request
          head, and no change control tree is checked out. Any other value
          fails the job. The validator and its strictness are the same in both.
        type: string
        required: false
        default: occ

jobs:
  # OMN-14260: the nested cross-repo occ-preflight job added by #1879 (OMN-14249)
  # is REVERTED here. It ran in a reusable-within-reusable context (caller
  # deploy-gate.yml -> this reusable -> nested occ-preflight) and requested
  # job-level `permissions: pull-requests: read`. A nested reusable can only
  # narrow the token its caller job passed down; the caller `deploy-gate` job
  # grants no permissions block, so the request was a compile-time permissions
  # escalation -> the whole Deploy Gate workflow startup-failed (0 jobs) on every
  # infra/core/market caller, taking down the required `deploy-gate` context
  # org-wide. OCC-preflight gating is NOT lost: every caller repo already gates
  # its own `deploy-gate` job behind a top-level `occ-preflight` job
  # (infra #2229/OMN-14104, core local occ-preflight.yml, market inline), so the
  # nested job was redundant. Do NOT re-add it without granting pull-requests to
  # the caller deploy-gate jobs first (tracked in OMN-14260 follow-up).
  deploy-gate:
    name: deploy-gate
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    # OMN-18205: the untrusted test is the FORK test, and only the fork test.
    # It used to also send every same-repo pull request whose base is `dev`
    # to the public class. That is not a trust boundary -- a same-repo pull
    # request is written by someone who can already push to this repository,
    # and the sibling pr-title reusable has always used the fork test alone.
    # What the extra clause actually did was pin every private repository's
    # required checks to GitHub-hosted runners, which the 2026-09-14 operator
    # ruling forbids and which the enterprise hosted-runner switch has since
    # made unrunnable. A genuine fork pull request still resolves to
    # OMNI_PUBLIC_PR_RUNS_ON_JSON, so the boundary OMN-16683 exists to hold
    # is unchanged.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 25

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7

      # OMN-12564: the OCC checkout logic lives in omniclaude (this repo), but
      # the job's GITHUB_WORKSPACE holds the *caller* repo's tree. Pull the
      # hardened checkout script and the composite action from omniclaude at the
      # workflow pin into a side path.
      # The pin is validated `job.workflow_sha`: the commit of THIS workflow file,
      # exactly what the caller pinned in its `uses:` (same pattern as
      # kb-doc-gate-reusable.yml). omniclaude's live dev/main is never read, so a
      # merge here cannot change what a downstream caller's required check runs.
      - name: Resolve the deploy-gate pin
        id: pin
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy-gate pin is empty or is not a lowercase 40-hex commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$WORKFLOW_REPOSITORY" != "OmniNode-ai/omniclaude" ]; then
            echo "::error::workflow repository is '$WORKFLOW_REPOSITORY', not OmniNode-ai/omniclaude. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve the deploy-gate contract source
        env:
          CONTRACT_SOURCE: ${{ inputs.contract-source }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$CONTRACT_SOURCE" in
            occ|caller) ;;
            *)
              echo "::error::contract-source is '$CONTRACT_SOURCE'; expected occ or caller. THE GATE DID NOT RUN."
              exit 1
              ;;
          esac
          if [ "$CONTRACT_SOURCE" = "caller" ] && [ "$EVENT_NAME" != "merge_group" ] && [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::contract-source caller reads the pull request head's contracts, but this '$EVENT_NAME' event carries no pull request head sha. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "::notice::deploy-gate contract source: $CONTRACT_SOURCE"

      - name: Fetch deploy-gate support scripts (omniclaude)
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OmniNode-ai/omniclaude
          ref: ${{ steps.pin.outputs.sha }}
          path: .omniclaude-deploy-gate
          persist-credentials: false
          sparse-checkout: |
            scripts/deploy-gate/checkout-occ-contracts.sh
            .github/actions/deploy-gate
            .github/actions/deploy-gate/validate_pr_deploy_required.py
          sparse-checkout-cone-mode: false

      - name: Assert the deploy-gate checkout is at the pin and carries its files
        if: github.event_name != 'merge_group'
        env:
          GATE_PIN: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          if ! checked_out_sha="$(git -C .omniclaude-deploy-gate rev-parse HEAD)"; then
            echo "::error::could not resolve the fetched deploy-gate commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$checked_out_sha" != "$GATE_PIN" ]; then
            echo "::error::deploy-gate checkout is at $checked_out_sha, expected $GATE_PIN. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ ! -f ".omniclaude-deploy-gate/scripts/deploy-gate/checkout-occ-contracts.sh" ]; then
            echo "::error::.omniclaude-deploy-gate/scripts/deploy-gate/checkout-occ-contracts.sh is missing from the deploy-gate checkout at $GATE_PIN. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ ! -f ".omniclaude-deploy-gate/.github/actions/deploy-gate/action.yml" ]; then
            echo "::error::.omniclaude-deploy-gate/.github/actions/deploy-gate/action.yml is missing from the deploy-gate checkout at $GATE_PIN. THE GATE DID NOT RUN."
            exit 1
          fi

      - name: Resolve deploy-gate OCC evidence source
        if: github.event_name != 'merge_group' && inputs.contract-source == 'occ'
        id: resolve_occ_evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr-number != 0 && inputs.pr-number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::OCC evidence-source resolution requires GITHUB_TOKEN"
            exit 1
          fi

          if ! changed_files="$(gh pr diff "$PR_NUMBER" --name-only 2>/tmp/deploy-gate-gh-diff.err | tr '\n' ' ')"; then
            base_ref="${GITHUB_BASE_REF:-main}"
            echo "::notice::gh pr diff failed; falling back to local git diff against origin/${base_ref}"
            cat /tmp/deploy-gate-gh-diff.err || true
            git fetch origin "$base_ref" --no-tags
            changed_files="$(git diff --name-only "origin/${base_ref}" HEAD | tr '\n' ' ')"
          fi
          pr_body="$(gh pr view "$PR_NUMBER" --json body -q '.body')"

          python -m pip install pyyaml

          python "${GITHUB_WORKSPACE}/.omniclaude-deploy-gate/.github/actions/deploy-gate/validate_pr_deploy_required.py" \
            --changed-files "$changed_files" \
            --pr-body "$pr_body" \
            --resolve-occ-ref \
            --default-occ-ref dev \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout onex_change_control contracts (canonical contract source)
        if: github.event_name != 'merge_group' && inputs.contract-source == 'occ' && steps.resolve_occ_evidence.outputs.deploy_gate_required == 'true'
        shell: bash
        # OMN-12564: the OCC checkout is delegated to a standalone, unit-tested
        # script that bounds BOTH the fetch AND the checkout with a hard
        # `timeout`. The old inline step only bounded the fetch, so a wedged
        # blobless-partial-clone checkout (`git -C _occ checkout --force
        # FETCH_HEAD`) spun until the 25-min job timeout on #1786/#1788. The
        # script drops `--filter=blob:none` for a deterministic full-ref
        # checkout and, on stall, emits a diagnostic block (ref, fetch command,
        # elapsed, last git subprocess, process tree) so future hangs are
        # diagnosable from the log alone. The step-level `timeout-minutes` below
        # is the outer bound; the script is the inner, self-diagnosing
        # git-level bound.
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCC_REF: ${{ steps.resolve_occ_evidence.outputs.occ_ref }}
          OCC_REPO_URL: https://github.com/OmniNode-ai/onex_change_control.git
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::OCC contracts checkout requires GITHUB_TOKEN"
            exit 1
          fi

          bash "${GITHUB_WORKSPACE}/.omniclaude-deploy-gate/scripts/deploy-gate/checkout-occ-contracts.sh"

      # OMN-20074: a cut-over caller's contract is its own, at the pull
      # request head. No change control tree is checked out on this path, so
      # a companion's evidence there does not count.
      - name: Checkout the caller's pull request head contracts
        if: github.event_name != 'merge_group' && inputs.contract-source == 'caller'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr-head
          persist-credentials: false
          sparse-checkout: /contracts/
          sparse-checkout-cone-mode: false

      - name: Skip on merge_group
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: |
          echo "::notice::deploy-gate: merge_group event — skipped (validated on PR branch)."

      - name: Run deploy gate (canonical composite action)
        if: github.event_name != 'merge_group'
        uses: ./.omniclaude-deploy-gate/.github/actions/deploy-gate
        with:
          pr-number: ${{ inputs.pr-number != 0 && inputs.pr-number || github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          contracts-dir: ${{ inputs.contract-source == 'caller' && '.pr-head/contracts' || '_occ/contracts' }}
          contract-source: ${{ inputs.contract-source }}
          # OMN-14505: composite actions cannot read `vars` directly, so the
          # org variable is resolved here (job scope, where `vars` is valid)
          # and threaded through as an input.
          falsifiability-mode: ${{ vars.DEPLOY_GATE_FALSIFIABILITY || 'report' }}
