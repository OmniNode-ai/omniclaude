#
# Required-Check Skip-Vector Guard — local caller for omniclaude's own PRs.
# OMN-14854 (canary rollout; no fan-out to other repos in this PR).
#
# Produces required status check: "required-check-skip-guard / check-skip-vectors"
#
# FLIPPED TO REQUIRED (OMN-15178, operator ruling "Make it blocking"
# 2026-07-26T07:25Z): this context is now in required_status_checks on `dev`
# (gate met per plan: 2+ green runs of this workflow) — see
# .github/required-checks.yaml, where this context's manifest row is now
# `mode: REQUIRED`.
#
# IMPORTANT: this trigger MUST NOT carry a `paths:`/`paths-ignore:` filter
# (design spec section 4c). This is the one required-check workflow that is
# exempt from "narrow the trigger for efficiency" — a path filter here would
# be the exact self-referential skip-vector this guard exists to catch.
#
# SCHEDULE (OMN-15178): a `schedule:` trigger runs the guard daily against
# `dev` HEAD even absent new PR activity, so a required check does not go
# silently stale between pull requests. Staggered against omnimarket's
# schedule (04:30 UTC) to avoid both fan-out repos hitting the shared
# omniclaude reusable-workflow fetch at the same instant.

name: Required-Check Skip-Vector Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  required-check-skip-guard:
    needs: occ-preflight
    # if: always() (OMN-15178, vector-5 fix matching OMN-15112/OMN-15117
    # precedent): a `uses:`-only job cannot mix in an explicit
    # `needs.occ-preflight.result != success` exit-1 step (GHA forbids
    # combining `uses:` and `steps:` in one job body), so this guard's own
    # required check must run unconditionally rather than being silently
    # SKIPPED (which branch protection counts as passing) whenever the
    # schedule-triggered run's occ-preflight leg is anything other than a
    # clean success.
    if: always()
    uses: ./.github/workflows/required-check-skip-guard-reusable.yml
