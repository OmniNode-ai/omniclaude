name: Lane Identity Gate

# OMN-18260, phase 5 item 3 of the 2026-09-12 process-friction remediation plan.
#
# What this protects. A pre-push refusal on a branch claimed by another lane
# (OMN-18262) compares the claim holder against the pushing lane. Measured on
# 2026-09-13, no artifact records the pushing lane: zero commits carry a lane
# trailer across the last 200 commits of each of three worked repositories. This
# gate protects the module that supplies that missing operand — the registry,
# the trailer stamping, and the window check that fails a commit carrying no
# resolvable lane identity.
#
# The hook itself is exercised here, not merely imported: the tests drive real
# `git commit` calls through the installed copy, because the defect that mattered
# most in development — the installer rewriting the placeholder inside its own
# guard pattern, so the hook skipped the path it had just baked in — was
# invisible to every test that only read the script.

# NO `paths:` FILTER, DELIBERATELY (OMN-18288). This context is REQUIRED on
# `dev` (.github/required-checks.yaml), and a required context behind a path
# filter is skip-vector 1: a pull request touching only excluded paths never
# runs the job, the context never reports, and the pull request sits PENDING
# forever. The filter list that used to live here named four paths and was
# already wrong in the direction that matters -- `scripts/hooks/` is resolved
# at install time from whatever the installer copies, and the arming probe and
# the canary test were both gate inputs that no line named. Having no filter
# answers that more completely than any list can: every input, named or not yet
# written, triggers the gate.
on:
  push:
    branches: [main, dev, 'hotfix/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  lane-identity-gate:
    needs: occ-preflight
    # Skip-vector 5 (OMN-18288). `needs:` with no `if:` means the implicit job
    # condition is `success()` over `needs:`, so a failed or cancelled
    # occ-preflight SKIPS this job -- and a skipped job SATISFIES GitHub branch
    # protection. Requiring this context without `if: always()` would wire a
    # silent-pass bypass into the gate whose whole purpose is that an unproven
    # lane identity cannot pass quietly.
    if: always()
    name: Lane Identity Gate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Shell syntax of the stamping hook
        run: bash -n scripts/hooks/prepare-commit-msg-lane

      # uv sync, not a bare pytest install. This repo's tests/conftest.py imports
      # project dependencies, so `pip install pytest` alone fails at collection
      # with a ModuleNotFoundError -- which is a gate that cannot run, not a gate
      # that passed. Found on the first CI run of this workflow.
      - name: Install dependencies
        run: uv sync --frozen --group dev --python 3.13

      - name: Lane identity behaviour
        run: |
          git config --global init.defaultBranch main
          git config --global user.email ci@example.com
          git config --global user.name ci
          uv run pytest \
            tests/scripts/test_lane_identity.py \
            tests/scripts/test_lane_identity_arming_probe.py \
            tests/scripts/test_lane_identity_canonical_bake.py -q
