name: Public Skill Hygiene

# OMN-14105 / OMN-17993: this repository is public.
# plugins/onex/skills/ is published/public. aislop_sweep
# intentionally tolerates OmniNode-internal operating detail there (ticket
# refs, omni_home paths, # local-path-ok escapes) because it exists to keep
# our own dev loop clean, not to gate what an outside reader sees. This is a
# separate, stricter gate: operator identity, real hosts/IPs, machine-
# specific paths, and internal doc citations do not belong in a skill a
# stranger might read. Detect-only, no auto-fix.

# OMN-17993: NO paths: filter. The gate is a whole-tree invariant over the
# tracked set; a paths: filter scoped to plugins/onex/skills/ is exactly how it
# reported green over every HIGH public-exposure finding in this repository.
on:
  push:
    branches: [main, 'hotfix/**']
  pull_request:
    branches: [main, dev]
  merge_group:

permissions:
  contents: read

env:
  UV_HTTP_TIMEOUT: "600"

jobs:
  public-skill-hygiene:
    name: Public Skill Hygiene
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The scanned surface is `git ls-files`; a partial checkout would
          # shrink it silently.
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Scan the tracked tree for public-exposure hygiene violations
        working-directory: ${{ github.workspace }}
        run: uv run --with pyyaml python3 scripts/check_public_skill_hygiene.py
