#
# Doctrine-claim gate (reusable), OMN-18529. Each unbuilt, in_flight or blocked
# claim requires an HTML doctrine-claim marker naming type, ticket and role in
# the same prose block or table row; rewording cannot hide a claim. One marker
# names one ticket. Malformed markers, missing tickets or roles, and ticket-state
# contradictions refuse: in_flight requires started; unbuilt and blocked require
# non-terminal states. Unreadable input, missing credentials, an unreachable
# tracker, and ZERO claim sentences or markers also refuse.
#
# Usage in caller repos:
#   jobs:
#     doctrine-claim-gate:
#       uses: OmniNode-ai/omniclaude/.github/workflows/doctrine-claim-gate-reusable.yml@<immutable-sha>
#       with:
#         paths: CLAUDE.md
#       secrets:
#         linear_api_key: ${{ secrets.LINEAR_API_KEY }}
#
# Surfaced check context in the caller: `doctrine-claim-gate / doctrine-claim-gate`.
#
# ONE pin, not two: the checker checkout uses validated `job.workflow_sha`, the
# SHA this reusable workflow was resolved at, so the `uses:` SHA above is the
# single source of truth for both the workflow and the script. Pin to an
# omniclaude commit on `dev` that carries scripts/doctrine_claim_gate.py.
#
# Canonical checker: scripts/doctrine_claim_gate.py (this repo). The same script
# runs locally via the exported `doctrine-claim-gate` pre-commit hook
# (.pre-commit-hooks.yaml), so the local and CI verdicts cannot diverge. One
# implementation, one verdict -- the shape kb_doc_gate.py already uses across the
# same two repositories.
#
# THE CREDENTIAL IS REQUIRED AND ITS ABSENCE IS A FAILURE, not a skip. The
# nearest precedent in this repository, stale-todo-gate.yml, reads the same
# secret and prints a warning and exits 0 when it is missing -- a silent pass on
# a merge-gating path. This workflow deliberately does the opposite.

name: Doctrine Claim Gate

on:
  workflow_call:
    inputs:
      paths:
        description: Space-separated doctrine files to check.
        required: false
        type: string
        default: CLAUDE.md
      checker_ref:
        description: >-
          Optional full 40-hex omniclaude commit SHA the checker is read from.
          The default is job.workflow_sha, so the caller's `uses:` pin governs
          both. Branch names are refused.
        required: false
        type: string
        default: ""
    secrets:
      linear_api_key:
        description: Tracker credential. Its absence FAILS the gate.
        required: true

permissions:
  contents: read

jobs:
  doctrine-claim-gate:
    name: doctrine-claim-gate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v7

      - name: Resolve the gate pin
        id: pin
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          REF_OVERRIDE: ${{ inputs.checker_ref }}
        run: |
          set -euo pipefail
          resolved_pin="${REF_OVERRIDE:-$WORKFLOW_SHA}"
          if [[ ! "$resolved_pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::doctrine-claim pin is empty or is not a lowercase 40-hex commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$WORKFLOW_REPOSITORY" != "OmniNode-ai/omniclaude" ]; then
            echo "::error::workflow repository is '$WORKFLOW_REPOSITORY', not OmniNode-ai/omniclaude. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "sha=$resolved_pin" >> "$GITHUB_OUTPUT"
          echo "doctrine-claim pin: $resolved_pin"

      - name: Check out the checker at the pinned omniclaude ref
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omniclaude
          ref: ${{ steps.pin.outputs.sha }}
          path: .omniclaude-checker

      - name: Assert the doctrine-claim checkout is at the pin
        env:
          GATE_PIN: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          if ! checked_out_sha="$(git -C .omniclaude-checker rev-parse HEAD)"; then
            echo "::error::could not resolve the fetched doctrine-claim commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$checked_out_sha" != "$GATE_PIN" ]; then
            echo "::error::doctrine-claim checkout is at $checked_out_sha, expected $GATE_PIN. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "doctrine-claim checked out at $checked_out_sha"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Refuse when the tracker credential is absent
        env:
          LINEAR_API_KEY: ${{ secrets.linear_api_key }}
        run: |
          set -euo pipefail
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "::error::The doctrine-claim gate cannot resolve ticket state without a tracker credential, and it REFUSES rather than skipping. A gate that cannot read its input has not passed, it has not run."
            exit 1
          fi
          echo "Tracker credential present."

      - name: Run the doctrine-claim gate
        env:
          LINEAR_API_KEY: ${{ secrets.linear_api_key }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 - `paths` is a deliberate word-split list
          python3 .omniclaude-checker/scripts/doctrine_claim_gate.py ${{ inputs.paths }}
