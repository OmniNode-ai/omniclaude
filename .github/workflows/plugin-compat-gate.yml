#
# plugin-compat-gate.yml — CI gate: plugin ships only with plugin-compat.yaml
#
# DoD gate for OMN-8789 SD-02:
#   1. Fails if plugins/onex/plugin-compat.yaml is absent (hard fail, not advisory).
#   2. Validates YAML structure via pytest (schema tests in plugins/onex/tests/).
#
# When this fails:
#   - YAML absent: add plugins/onex/plugin-compat.yaml with full R-class node declarations.
#   - Schema test failure: fix plugin-compat.yaml schema — see test_plugin_compat_yaml.py.

name: Plugin Compat Gate

on:
  push:
    branches: [main, develop, 'hotfix/**']
    paths:
      - 'plugins/onex/**'
      - '.github/workflows/plugin-compat-gate.yml'
  pull_request:
    branches: [main, dev, develop]
    paths:
      - 'plugins/onex/**'
      - '.github/workflows/plugin-compat-gate.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  UV_CONCURRENT_DOWNLOADS: '1'
  UV_HTTP_TIMEOUT: '600'
  UV_SYNC_ATTEMPTS: '5'
  UV_SYNC_RETRY_DELAY_SECONDS: '10'
  UV_TORCH_BACKEND: cpu

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  plugin-compat-gate:
    needs: occ-preflight
    name: Plugin compat.yaml presence + schema
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Assert plugin-compat.yaml exists
        working-directory: ${{ github.workspace }}
        run: |
          COMPAT_PATH="plugins/onex/plugin-compat.yaml"
          if [ ! -f "$COMPAT_PATH" ]; then
            echo "::error file=${COMPAT_PATH}::plugin-compat.yaml is required but not found."
            echo "Every plugin release must ship with plugins/onex/plugin-compat.yaml"
            echo "declaring all R-class node topics and the runtime compatibility window."
            echo "See OMN-8789 for the schema specification."
            exit 1
          fi
          echo "OK: $COMPAT_PATH found"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Load cached venv
        if: ${{ vars.OMNI_ENABLE_VENV_CACHE_RESTORE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .venv
          key: uv-plugin-compat-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          attempt=1
          until uv sync --frozen --python "${PYTHON_VERSION}"; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::uv sync failed after ${attempt} attempt(s)"
              exit "$status"
            fi

            sleep_seconds=$((UV_SYNC_RETRY_DELAY_SECONDS * attempt))
            echo "::warning::uv sync attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed with exit ${status}; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Run plugin-compat.yaml schema tests
        working-directory: ${{ github.workspace }}
        run: |
          uv run pytest plugins/onex/tests/test_plugin_compat_yaml.py -v \
            --tb=short \
            -p no:warnings
