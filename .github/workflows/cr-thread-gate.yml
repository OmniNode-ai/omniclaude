name: CR Thread Gate
# Reusable CodeRabbit thread gate. Consumed cross-repo as:
#   uses: OmniNode-ai/omniclaude/.github/workflows/cr-thread-gate.yml@main
# Required status check string: "gate / CodeRabbit Thread Check"
# (produced by callers whose job key is named 'gate:' and uses this workflow)
#
# OMN-17146: this gate is now a NO-OP.
#
# CodeRabbit is being retired org-wide (decision 2026-08-29, OMN-16933).
# OMN-16933 landed the producer half of that retirement first: omniclaude#2069
# (051f96da6) deleted `scripts/check-unresolved-threads.sh` and the local
# callers from omniclaude `dev`. This reusable — still served from `main` and
# still consumed `@main` by callers in 11 repos — checked that script out with
# `ref: dev`, so every consumer started failing at `chmod: cannot access
# 'scripts/check-unresolved-threads.sh'`.
#
# The fix deliberately does NOT restore the script or re-point the checkout at
# `main`: re-pointing would reintroduce the CodeRabbit dependency this
# retirement exists to remove, and restoring the script on `dev` would reverse
# OMN-16933. Instead the job succeeds with a notice, keeping the composed
# contexts ("gate / CodeRabbit Thread Check",
# "cr-thread-gate / CodeRabbit Thread Check") reporting green so no branch
# protection or CI-summary umbrella is left requiring a context that can never
# report. Deleting the workflow and its callers, and removing the contexts from
# every repo's required_status_checks / EXPECTED_EXTERNAL_CONTEXTS, is tracked
# by OMN-16933 (and OMN-16934 / OMN-16389 for the node/skill and local-fork
# residuals).
#
# The `workflow_call` interface below is intentionally UNCHANGED — inputs and
# secrets stay declared so every existing caller keeps resolving without edits.
on:
  workflow_call:
    secrets:
      # OMN-16373: CROSS_REPO_PAT retiring. Kept declared (unused) so callers
      # that still pass a `secrets:` block keep resolving.
      CROSS_REPO_PAT:
        description: "Deprecated (OMN-16373), unused since OMN-17146: GitHub PAT with read:discussion scope."
        required: false
      github-token:
        description: "Deprecated, unused since OMN-17146."
        required: false
      onexbot-occ-app-id:
        description: "onexbot-occ-writer GitHub App id (org secret ONEXBOT_OCC_APP_ID). Unused since OMN-17146."
        required: false
      onexbot-occ-private-key:
        description: "onexbot-occ-writer GitHub App private key (org secret ONEXBOT_OCC_PRIVATE_KEY). Unused since OMN-17146."
        required: false
    inputs:
      repo:
        description: "Target repo name (owner/repo or bare name). Defaults to caller's github.repository. Unused since OMN-17146."
        required: false
        type: string
        default: ""
      pr-number:
        description: "Pull request number to check. Unused since OMN-17146."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gate:
    name: CodeRabbit Thread Check
    # OMN-14856/OMN-15120 vector-3: no job-level `if:` here. The reusable's job
    # must always run so the composed check run is always created; a skipped
    # `uses:` caller job produces zero check runs and wedges the required
    # context. That constraint survives the no-op.
    runs-on: >-
      ${{
        ((github.event_name == 'pull_request' && github.base_ref == 'dev') ||
         (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5
    steps:
      - name: CodeRabbit retired — gate is a no-op
        working-directory: ${{ github.workspace }}
        run: |
          echo "::notice::CodeRabbit retired (OMN-16933); gate is a no-op pending removal from required contexts."
          echo "OMN-17146: this reusable no longer checks out or executes"
          echo "scripts/check-unresolved-threads.sh — that script was deleted from"
          echo "omniclaude dev by omniclaude#2069 (051f96da6, OMN-16933) and the"
          echo "CodeRabbit dependency is deliberately not being reintroduced."
          echo "Removal of this workflow, its callers, and the composed contexts"
          echo "\"gate / CodeRabbit Thread Check\" and"
          echo "\"cr-thread-gate / CodeRabbit Thread Check\" from every repo's"
          echo "required_status_checks / EXPECTED_EXTERNAL_CONTEXTS is tracked by OMN-16933."
          exit 0
