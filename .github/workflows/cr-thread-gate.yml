name: CR Thread Gate
# Reusable workflow — call via:
#   uses: OmniNode-ai/omniclaude/.github/workflows/cr-thread-gate.yml@dev
# Required status check string: "gate / CodeRabbit Thread Check"
# (produced by callers whose job key is named 'gate:' and uses this workflow)
on:
  workflow_call:
    secrets:
      # OMN-16373: CROSS_REPO_PAT retiring. CROSS_REPO_PAT and github-token
      # stay declared (not removed — deletion deferred) so callers that
      # have not yet migrated their `secrets:` block keep working; the job
      # below now prefers a minted onexbot-occ-writer App token and falls
      # back to these only if the caller still passes them.
      CROSS_REPO_PAT:
        description: "Deprecated (OMN-16373): GitHub PAT with read:discussion scope for CR thread queries. Prefer onexbot-occ-app-id/onexbot-occ-private-key."
        required: false
      github-token:
        description: "Deprecated: pass onexbot-occ-app-id/onexbot-occ-private-key instead"
        required: false
      onexbot-occ-app-id:
        description: "onexbot-occ-writer GitHub App id (org secret ONEXBOT_OCC_APP_ID)"
        required: false
      onexbot-occ-private-key:
        description: "onexbot-occ-writer GitHub App private key (org secret ONEXBOT_OCC_PRIVATE_KEY)"
        required: false
    inputs:
      repo:
        description: "Target repo name (owner/repo or bare name). Defaults to caller's github.repository."
        required: false
        type: string
        default: ""
      pr-number:
        description: "Pull request number to check. Pass '0' or empty to skip (merge_group context)."
        required: false
        type: string
        default: ""

jobs:
  gate:
    name: CodeRabbit Thread Check
    runs-on: >-
      ${{
        ((github.event_name == 'pull_request' && github.base_ref == 'dev') ||
         (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Checkout omniclaude scripts
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omniclaude
          ref: dev
          sparse-checkout: scripts/check-unresolved-threads.sh
          sparse-checkout-cone-mode: false

      - name: Resolve repo name
        id: resolve-repo
        working-directory: ${{ github.workspace }}
        run: |
          REPO="${{ inputs.repo }}"
          [ -z "$REPO" ] && REPO="${{ github.repository }}"
          # Strip owner prefix if present (owner/repo -> repo)
          echo "repo=${REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: Resolve PR number
        id: resolve-pr
        working-directory: ${{ github.workspace }}
        run: |
          PR="${{ inputs.pr-number }}"
          if [ -z "$PR" ]; then
            PR="${{ github.event.pull_request.number }}"
          fi
          if [ -z "$PR" ]; then
            PR="${{ github.event.issue.number }}"
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      # OMN-16373: CROSS_REPO_PAT retirement — mint a short-lived
      # onexbot-occ-writer App installation token when the caller passes
      # App credentials. continue-on-error because older callers that
      # haven't migrated their `secrets:` block yet pass empty app-id/key,
      # which would otherwise hard-fail this step; the token-chain fallback
      # below covers that case (old CROSS_REPO_PAT caller, or plain
      # GITHUB_TOKEN for a same-repo read).
      - name: Mint onexbot-occ-writer app token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.onexbot-occ-app-id }}
          private-key: ${{ secrets.onexbot-occ-private-key }}
          owner: OmniNode-ai

      - name: Check unresolved CodeRabbit threads
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CROSS_REPO_PAT || secrets.github-token || secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          PR="${{ steps.resolve-pr.outputs.pr }}"
          if [ -z "$PR" ] || [ "$PR" = "0" ]; then
            echo "No PR number — skipping (merge_group context)."
            exit 0
          fi
          chmod +x scripts/check-unresolved-threads.sh
          COUNT=$(bash scripts/check-unresolved-threads.sh \
            "${{ github.repository_owner }}" \
            "${{ steps.resolve-repo.outputs.repo }}" \
            "$PR")
          echo "Unresolved CodeRabbit threads: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$COUNT unresolved CodeRabbit thread(s). Resolve all CR threads before merging."
            exit 1
          fi
          echo "All CodeRabbit threads resolved."
