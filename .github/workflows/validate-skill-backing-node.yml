---
# Skill Backing-Node Liveness — ValidateSkillBackingNode gate [OMN-10052]
#
# Canonical CI gate for validate_skill_backing_node.py.
# Required status check context: "Skill Backing Node / validate".
#
# Incident reference: 2026-04-27 — /onex:merge_sweep pointed at gutted
# node_merge_sweep for hours; cron ticked every 5 min against non-existent
# entrypoint. This gate blocks that class of regression.
#
# Two-step job:
#   1. Unit pytest for the validator itself (regression guard for the gate).
#   2. Repo self-scan: walks all SKILL.md files, verifies each declared
#      backing node exists and has a live handler.  Checks out omnimarket
#      as a sibling repo so the resolver can find nodes.
#
# The job runs on PRs that touch SKILL.md files, the validator, or the
# allowlist, and on every merge_group event (required status check).

name: Skill Backing Node

on:
  push:
    branches: [main, 'hotfix/**']
    paths:
      - 'plugins/onex/skills/**/*.md'
      - 'plugins/onex/skills/_lib/validate_skill_backing_node.py'
      - 'plugins/onex/skills/_lib/skill_backing_node_allowlist.yaml'
      - 'tests/unit/skills/_lib/test_validate_skill_backing_node.py'
      - '.github/workflows/validate-skill-backing-node.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'plugins/onex/skills/**/*.md'
      - 'plugins/onex/skills/_lib/validate_skill_backing_node.py'
      - 'plugins/onex/skills/_lib/skill_backing_node_allowlist.yaml'
      - 'tests/unit/skills/_lib/test_validate_skill_backing_node.py'
      - '.github/workflows/validate-skill-backing-node.yml'

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.6.1"

concurrency:
  group: skill-backing-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  validate:
    needs: occ-preflight
    name: validate
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 10

    steps:
      - name: Checkout omniclaude
        uses: actions/checkout@v7

      - name: Checkout omnimarket
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omnimarket
          path: _omnimarket
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install native build toolchain
        run: |
          if command -v cc >/dev/null 2>&1; then
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y build-essential
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y build-essential
            exit 0
          fi
          echo "::warning::C compiler not found and this runner cannot install build-essential; continuing so uv can use wheels or report the actual build failure"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --all-extras

      - name: Run ValidateSkillBackingNode unit tests
        working-directory: ${{ github.workspace }}
        run: |
          uv run pytest \
            tests/unit/skills/_lib/test_validate_skill_backing_node.py \
            -v

      - name: Self-scan omniclaude skill backing nodes
        # Pin OMNIMARKET_ROOT to the checked-out _omnimarket/ tree so an
        # ambient $OMNI_HOME on self-hosted runners can never shadow it.
        env:
          OMNIMARKET_ROOT: _omnimarket
        working-directory: ${{ github.workspace }}
        run: uv run python plugins/onex/skills/_lib/validate_skill_backing_node.py .
