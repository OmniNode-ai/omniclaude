#
# Required-Check Skip-Vector Guard (reusable). OMN-14854.
# Canonical source — all repos call this via uses: instead of running their
# own copy of validate_no_required_check_skip_vectors.py (mirrors
# deploy-gate-reusable.yml@main's single-source-of-validator pattern).
#
# Fails closed on any of four skip vectors against a REQUIRED-status-check
# manifest (.github/required-checks.yaml schema v3):
#   1. path-scoped pull_request/pull_request_target/merge_group trigger
#   2. ungated job-level `if:` on the job that IS the required context
#   3. ungated caller-job `if:` on a reusable-workflow call
#   4. missing pull_request/pull_request_target/merge_group trigger entirely
#
# Usage in caller repos:
#   jobs:
#     required-check-skip-guard:
#       uses: OmniNode-ai/omniclaude/.github/workflows/required-check-skip-guard-reusable.yml@main
#
# IMPORTANT (design spec section 4c — anti-self-wedge): the CALLER job's own
# pull_request/merge_group trigger in each repo's workflow file MUST NOT carry
# a `paths:`/`paths-ignore:` filter. This is the one required-check workflow
# that is exempt from "narrow the trigger for efficiency" — its entire job is
# to catch path-filter dodges, so it must never be dodgeable by one itself.

name: Required-Check Skip-Vector Guard (reusable)

on:
  workflow_call:
    inputs:
      manifest-path:
        description: Path to the required-checks manifest (schema v3)
        type: string
        required: false
        default: .github/required-checks.yaml
      workflows-dir:
        description: Path to the .github/workflows directory to scan
        type: string
        required: false
        default: .github/workflows

permissions:
  contents: read

jobs:
  check-skip-vectors:
    name: check-skip-vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: python -m pip install --quiet "pyyaml>=6.0.0"

      - name: Fetch validator (omniclaude canonical source)
        if: github.repository != 'OmniNode-ai/omniclaude'
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omniclaude
          ref: dev
          path: .omniclaude-skip-guard
          persist-credentials: false
          sparse-checkout: |
            .github/actions/required-check-skip-guard/validate_no_required_check_skip_vectors.py
            .github/actions/required-check-skip-guard/_workflow_model.py
          sparse-checkout-cone-mode: false

      - name: Run skip-vector validator
        env:
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          WORKFLOWS_DIR: ${{ inputs.workflows-dir }}
          IS_OMNICLAUDE: ${{ github.repository == 'OmniNode-ai/omniclaude' }}
        run: |
          set -euo pipefail
          if [ "${IS_OMNICLAUDE}" = "true" ]; then
            SCRIPT=".github/actions/required-check-skip-guard/validate_no_required_check_skip_vectors.py"
          else
            SCRIPT=".omniclaude-skip-guard/.github/actions/required-check-skip-guard/validate_no_required_check_skip_vectors.py"
          fi
          python "${SCRIPT}" --manifest "${MANIFEST_PATH}" --workflows-dir "${WORKFLOWS_DIR}"
