#
# Required-Check Skip-Vector Guard (reusable). OMN-14854.
# Canonical source — all repos call this via uses: instead of running their
# own copy of validate_no_required_check_skip_vectors.py (mirrors
# deploy-gate-reusable.yml@main's single-source-of-validator pattern).
#
# Fails closed on any of six skip vectors against a REQUIRED-status-check
# manifest (.github/required-checks.yaml schema v3):
#   1. path-scoped pull_request/pull_request_target/merge_group trigger
#   2. ungated job-level `if:` on the job that IS the required context
#   3. ungated caller-job `if:` on a reusable-workflow call
#   4. missing pull_request/pull_request_target/merge_group trigger entirely
#   5. ungated `needs:` cascade — no `if:` that provably runs regardless of the
#      needs result, so a dead upstream SKIPS the job (OMN-15057)
#   6. result triage that does not fail closed on every non-`success` value of
#      the `needs.<job>.result` the job reads — the layer-down question vector 5
#      cannot see, since `if: always()` SATISFIES vector 5 while guaranteeing the
#      fail-open path is reached (OMN-15304)
#
# Usage in caller repos:
#   jobs:
#     required-check-skip-guard:
#       uses: OmniNode-ai/omniclaude/.github/workflows/required-check-skip-guard-reusable.yml@dev
#
# Promotion note: until omniclaude dev is promoted to main, callers must use @dev
# and this reusable must fetch validator files from @dev. Re-pin both to @main
# only after the workflow and action paths exist on main.
#
# IMPORTANT (design spec section 4c — anti-self-wedge): the CALLER job's own
# pull_request/merge_group trigger in each repo's workflow file MUST NOT carry
# a `paths:`/`paths-ignore:` filter. This is the one required-check workflow
# that is exempt from "narrow the trigger for efficiency" — its entire job is
# to catch path-filter dodges, so it must never be dodgeable by one itself.

name: Required-Check Skip-Vector Guard (reusable)

on:
  workflow_call:
    inputs:
      manifest-path:
        description: Path to the required-checks manifest (schema v3)
        type: string
        required: false
        default: .github/required-checks.yaml
      workflows-dir:
        description: Path to the .github/workflows directory to scan
        type: string
        required: false
        default: .github/workflows

permissions:
  contents: read

jobs:
  check-skip-vectors:
    name: check-skip-vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: python -m pip install --quiet "pyyaml>=6.0.0"

      # The pin is validated `job.workflow_sha`: the commit of THIS workflow file,
      # exactly what the caller pinned in its `uses:` (same pattern as
      # kb-doc-gate-reusable.yml). omniclaude's live dev/main is never read, so a
      # merge here cannot change what a downstream caller's required check runs.
      - name: Resolve the check-skip-vectors pin
        id: pin
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::check-skip-vectors pin is empty or is not a lowercase 40-hex commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$WORKFLOW_REPOSITORY" != "OmniNode-ai/omniclaude" ]; then
            echo "::error::workflow repository is '$WORKFLOW_REPOSITORY', not OmniNode-ai/omniclaude. THE GATE DID NOT RUN."
            exit 1
          fi
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch validator (omniclaude canonical source)
        if: github.repository != 'OmniNode-ai/omniclaude'
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omniclaude
          ref: ${{ steps.pin.outputs.sha }}
          path: .omniclaude-skip-guard
          persist-credentials: false
          sparse-checkout: |
            .github/actions/required-check-skip-guard/validate_no_required_check_skip_vectors.py
            .github/actions/required-check-skip-guard/_workflow_model.py
          sparse-checkout-cone-mode: false

      - name: Assert the skip-guard checkout is at the pin and carries its files
        if: github.repository != 'OmniNode-ai/omniclaude'
        env:
          GATE_PIN: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          if ! checked_out_sha="$(git -C .omniclaude-skip-guard rev-parse HEAD)"; then
            echo "::error::could not resolve the fetched skip-guard commit. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ "$checked_out_sha" != "$GATE_PIN" ]; then
            echo "::error::skip-guard checkout is at $checked_out_sha, expected $GATE_PIN. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ ! -f ".omniclaude-skip-guard/.github/actions/required-check-skip-guard/validate_no_required_check_skip_vectors.py" ]; then
            echo "::error::.omniclaude-skip-guard/.github/actions/required-check-skip-guard/validate_no_required_check_skip_vectors.py is missing from the skip-guard checkout at $GATE_PIN. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ ! -f ".omniclaude-skip-guard/.github/actions/required-check-skip-guard/_workflow_model.py" ]; then
            echo "::error::.omniclaude-skip-guard/.github/actions/required-check-skip-guard/_workflow_model.py is missing from the skip-guard checkout at $GATE_PIN. THE GATE DID NOT RUN."
            exit 1
          fi

      - name: Run skip-vector validator
        env:
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          WORKFLOWS_DIR: ${{ inputs.workflows-dir }}
          IS_OMNICLAUDE: ${{ github.repository == 'OmniNode-ai/omniclaude' }}
        run: |
          set -euo pipefail
          if [ "${IS_OMNICLAUDE}" = "true" ]; then
            SCRIPT=".github/actions/required-check-skip-guard/validate_no_required_check_skip_vectors.py"
          else
            SCRIPT=".omniclaude-skip-guard/.github/actions/required-check-skip-guard/validate_no_required_check_skip_vectors.py"
          fi
          python "${SCRIPT}" --manifest "${MANIFEST_PATH}" --workflows-dir "${WORKFLOWS_DIR}"
