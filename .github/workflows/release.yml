name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    outputs:
      version: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Assert clean working tree
        working-directory: ${{ github.workspace }}
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Validate tag matches pyproject.toml version
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#v}"
          PKG_VERSION=$(python3 -c "
          import tomllib, sys
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          v = d.get('project', {}).get('version')
          if not v:
              raise SystemExit('ERROR: missing [project].version in pyproject.toml')
          print(v)
          ")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERROR: tag v${TAG} does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi
          echo "Version validated: $PKG_VERSION"

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Build wheel + sdist
        working-directory: ${{ github.workspace }}
        run: uv build

      - name: Verify dist artifacts exist
        working-directory: ${{ github.workspace }}
        run: |
          ls -la dist/
          ls dist/*.whl dist/*.tar.gz >/dev/null 2>&1 || {
            echo "ERROR: expected wheel + sdist in dist/"
            exit 1
          }

      - name: Verify PyPI dependency-pin resolvability (OMN-14070)
        working-directory: ${{ github.workspace }}
        # omnimarket 0.4.6 was published pinning a nonexistent
        # omnibase-compat==0.5.1 (OMN-14064) because nothing anywhere resolved
        # a package's declared [project.dependencies] pins against the real
        # PyPI index -- local/CI resolution is silently short-circuited by
        # [tool.uv.sources] git-rev overrides, which `uv build` bakes past
        # unverified into the wheel's real Requires-Dist metadata. This step
        # installs the just-built wheel with `uv pip install` (never
        # `uv sync`/`uv add`, so [tool.uv.sources] is structurally
        # unreachable) into a bare scratch venv with no project config, so a
        # broken pin fails the release *before* `uv publish` runs.
        run: |
          python3 scripts/ci/verify_pypi_pin_resolvability.py dist/

      - name: Publish to PyPI
        working-directory: ${{ github.workspace }}
        run: |
          uv publish --token "$UV_PUBLISH_TOKEN" dist/*.whl dist/*.tar.gz
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Generate checksums
        working-directory: ${{ github.workspace }}
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS.txt

      - name: Set release tag
        id: tag
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A newline in the dispatch input would forge extra GITHUB_OUTPUT
            # entries, so constrain it to the tag charset before writing it.
            case "$RELEASE_TAG" in
              ''|*[!A-Za-z0-9.+_-]*)
                echo "::error::release tag contains unsupported characters"
                exit 1
                ;;
            esac
            echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}

  plugin-artifact:
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Assert clean working tree
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code

      - name: Set version
        id: ver
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A newline in the dispatch input would forge extra GITHUB_OUTPUT
            # entries, so constrain it to the tag charset before writing it.
            case "$RELEASE_TAG" in
              ''|*[!A-Za-z0-9.+_-]*)
                echo "::error::release tag contains unsupported characters"
                exit 1
                ;;
            esac
            echo "version=${RELEASE_TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Package plugin artifact
        working-directory: ${{ github.workspace }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TMPDIR=$(mktemp -d)
          cp -r plugins/onex "$TMPDIR/"

          PLUGIN_JSON=$(find "$TMPDIR/onex" -name "plugin.json" | head -1)
          test -n "$PLUGIN_JSON" || {
            echo "ERROR: plugin.json not found in staged plugin artifact"
            exit 1
          }

          python3 -c "
          import json, pathlib
          p = pathlib.Path('$PLUGIN_JSON')
          d = json.loads(p.read_text())
          d['version'] = '$VERSION'
          p.write_text(json.dumps(d, indent=2) + '\n')
          "

          cd "$TMPDIR" && zip -r "$GITHUB_WORKSPACE/omniclaude-plugin-${VERSION}.zip" onex/
          rm -rf "$TMPDIR"
          echo "Plugin artifact: omniclaude-plugin-${VERSION}.zip"
          ls -la "$GITHUB_WORKSPACE/omniclaude-plugin-${VERSION}.zip"

      - name: Attach plugin artifact to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: omniclaude-plugin-*.zip

  # ---------------------------------------------------------------------------
  # Post-release: trigger Dockerfile.runtime pin cascade (OMN-5137)
  # ---------------------------------------------------------------------------
  # When omniclaude is released, notify omnibase_infra so its
  # plugin-pin-cascade workflow can bump Dockerfile.runtime pins automatically.
  #
  # OMN-16373: CROSS_REPO_PAT retired. repository_dispatch is gated on
  # Contents:write on the target repo, which the onexbot-occ-writer GitHub
  # App (org secrets ONEXBOT_OCC_APP_ID / ONEXBOT_OCC_PRIVATE_KEY) already
  # grants org-wide (same pattern as omnibase_infra's trigger-runtime-rebuild
  # job).
  notify-plugin-pin-cascade:
    name: Notify Plugin Pin Cascade
    needs: release
    if: ${{ !contains(needs.release.outputs.version, 'rc') }}
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Check onexbot-occ-writer App credentials are configured
        id: token_check
        env:
          APP_ID: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::ONEXBOT_OCC_APP_ID / ONEXBOT_OCC_PRIVATE_KEY are not configured. Skipping cross-repo dispatch." \
              "Provision the onexbot-occ-writer App org secrets to enable plugin pin cascade."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint onexbot-occ-writer app token
        id: app-token
        if: steps.token_check.outputs.has_token == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: omnibase_infra
          permission-contents: write

      - name: Dispatch plugin-release to omnibase_infra
        if: steps.token_check.outputs.has_token == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: OmniNode-ai/omnibase_infra
          event-type: plugin-release
          client-payload: >-
            {
              "package": "omninode-claude",
              "version": "${{ needs.release.outputs.version }}",
              "source_repo": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}"
            }
