name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    outputs:
      version: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Assert clean working tree
        working-directory: ${{ github.workspace }}
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Validate tag matches pyproject.toml version
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#v}"
          PKG_VERSION=$(python3 -c "
          import tomllib, sys
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          v = d.get('project', {}).get('version')
          if not v:
              raise SystemExit('ERROR: missing [project].version in pyproject.toml')
          print(v)
          ")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERROR: tag v${TAG} does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi
          echo "Version validated: $PKG_VERSION"

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Build wheel + sdist
        working-directory: ${{ github.workspace }}
        run: uv build

      - name: Verify dist artifacts exist
        working-directory: ${{ github.workspace }}
        run: |
          ls -la dist/
          ls dist/*.whl dist/*.tar.gz >/dev/null 2>&1 || {
            echo "ERROR: expected wheel + sdist in dist/"
            exit 1
          }

      - name: Verify PyPI dependency-pin resolvability (OMN-14070)
        working-directory: ${{ github.workspace }}
        # omnimarket 0.4.6 was published pinning a nonexistent
        # omnibase-compat==0.5.1 (OMN-14064) because nothing anywhere resolved
        # a package's declared [project.dependencies] pins against the real
        # PyPI index -- local/CI resolution is silently short-circuited by
        # [tool.uv.sources] git-rev overrides, which `uv build` bakes past
        # unverified into the wheel's real Requires-Dist metadata. This step
        # installs the just-built wheel with `uv pip install` (never
        # `uv sync`/`uv add`, so [tool.uv.sources] is structurally
        # unreachable) into a bare scratch venv with no project config, so a
        # broken pin fails the release *before* `uv publish` runs.
        run: |
          python3 scripts/ci/verify_pypi_pin_resolvability.py dist/

      - name: Publish to PyPI
        working-directory: ${{ github.workspace }}
        run: |
          uv publish --token "$UV_PUBLISH_TOKEN" dist/*.whl dist/*.tar.gz
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Generate checksums
        working-directory: ${{ github.workspace }}
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS.txt

      - name: Set release tag
        id: tag
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A newline in the dispatch input would forge extra GITHUB_OUTPUT
            # entries, so constrain it to the tag charset before writing it.
            case "$RELEASE_TAG" in
              ''|*[!A-Za-z0-9.+_-]*)
                echo "::error::release tag contains unsupported characters"
                exit 1
                ;;
            esac
            echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}

      # OMN-16289 / OMN-16343: main protection on a release-synced repo empties
      # required_status_checks and instead restricts updates to refs/heads/main
      # via a repository ruleset whose only bypass actor is the org app
      # onexbot-occ-writer. The workflow GITHUB_TOKEN is NOT an authorizable
      # identity for that ref (proven live: GH006 on the plain-GITHUB_TOKEN
      # push, omnibase_core 2026-08-21), so mint a short-lived installation
      # token for the app and move the ref with that identity instead.
      # Credentials come from the org secrets ONEXBOT_OCC_APP_ID /
      # ONEXBOT_OCC_PRIVATE_KEY.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        if: ${{ !contains(steps.tag.outputs.tag, 'rc') }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # A `permission-*` input REPLACES the installation's full permission
          # set with exactly what is listed, so both scopes must be named:
          # contents to move refs/heads/main at all, workflows because a
          # release tag can legitimately carry changes under .github/workflows/
          # (OMN-17272; omnibase_core run 34065670492 died on GH013 when
          # `contents: write` was dropped by naming `workflows` alone).
          permission-contents: write
          permission-workflows: write

      # OMN-16289: main = the last release. Once the release has published,
      # fast-forward main to the released tag's commit. Promotion PRs to main
      # are retired; this step is the only thing that advances the ref.
      - name: Sync main to release tag
        if: ${{ !contains(steps.tag.outputs.tag, 'rc') }}
        working-directory: ${{ github.workspace }}
        env:
          # Deliberately NOT named RELEASE_TAG, and deliberately NOT sourced
          # from `inputs.tag`. `tests/workflows/test_release_workflow_no_shell_injection.py`
          # polices the RELEASE_TAG vocabulary as the path a raw dispatch input
          # takes to the shell, and requires every such step to read
          # `inputs.tag`. This step needs the OPPOSITE: `inputs.tag` is empty
          # on the `push: tags:` trigger that a real release actually fires,
          # so reading it there would resolve the empty string and kill the
          # sync on every tag-push release. `steps.tag.outputs.tag` is the
          # value the `Set release tag` step already produced for both
          # triggers, behind that step's own charset guard -- derived and
          # validated, not raw input.
          SYNC_TAG: ${{ steps.tag.outputs.tag }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          TAG="$SYNC_TAG"
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          echo "Resolved tag $TAG -> commit $TAG_SHA"
          # The ref is moved through the REST API rather than `git push`, so no
          # git credential layer can override the push identity. actions/checkout
          # v7 no longer persists the workflow token in `--local` config: it
          # writes the AUTHORIZATION header into a separate file and pulls it in
          # through `includeIf.gitdir`, so the once-canonical
          # `git config --unset-all --local http.<origin>.extraheader` is a
          # no-op and a `git push` would still authenticate as
          # github-actions[bot] -- which the ruleset declines with GH013
          # (omnibase_core run 34065670492, 2026-09-06: mint SUCCESS, push
          # FAILURE). `"force": false` additionally makes GitHub enforce the
          # fast-forward server-side.
          case "$TAG_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *)
              echo "::error::resolved release SHA is not a full commit SHA"
              exit 1
              ;;
          esac
          printf '{"sha":"%s","force":false}' "$TAG_SHA" > update-main-ref.json
          http_code="$(curl -sS -o update-main-ref.out -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            --data @update-main-ref.json)"
          cat update-main-ref.out
          echo
          case "$http_code" in
            2*) ;;
            *)
              echo "::error::refs/heads/main update refused with HTTP ${http_code}"
              exit 1
              ;;
          esac
          echo "main fast-forwarded to $TAG_SHA ($TAG)"

  plugin-artifact:
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Assert clean working tree
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code

      - name: Set version
        id: ver
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A newline in the dispatch input would forge extra GITHUB_OUTPUT
            # entries, so constrain it to the tag charset before writing it.
            case "$RELEASE_TAG" in
              ''|*[!A-Za-z0-9.+_-]*)
                echo "::error::release tag contains unsupported characters"
                exit 1
                ;;
            esac
            echo "version=${RELEASE_TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Package plugin artifact
        working-directory: ${{ github.workspace }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TMPDIR=$(mktemp -d)
          cp -r plugins/onex "$TMPDIR/"

          PLUGIN_JSON=$(find "$TMPDIR/onex" -name "plugin.json" | head -1)
          test -n "$PLUGIN_JSON" || {
            echo "ERROR: plugin.json not found in staged plugin artifact"
            exit 1
          }

          python3 -c "
          import json, pathlib
          p = pathlib.Path('$PLUGIN_JSON')
          d = json.loads(p.read_text())
          d['version'] = '$VERSION'
          p.write_text(json.dumps(d, indent=2) + '\n')
          "

          cd "$TMPDIR" && zip -r "$GITHUB_WORKSPACE/omniclaude-plugin-${VERSION}.zip" onex/
          rm -rf "$TMPDIR"
          echo "Plugin artifact: omniclaude-plugin-${VERSION}.zip"
          ls -la "$GITHUB_WORKSPACE/omniclaude-plugin-${VERSION}.zip"

      - name: Attach plugin artifact to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: omniclaude-plugin-*.zip

  # ---------------------------------------------------------------------------
  # Post-release: trigger Dockerfile.runtime pin cascade (OMN-5137)
  # ---------------------------------------------------------------------------
  # When omniclaude is released, notify omnibase_infra so its
  # plugin-pin-cascade workflow can bump Dockerfile.runtime pins automatically.
  #
  # OMN-16373: CROSS_REPO_PAT retired. repository_dispatch is gated on
  # Contents:write on the target repo, which the onexbot-occ-writer GitHub
  # App (org secrets ONEXBOT_OCC_APP_ID / ONEXBOT_OCC_PRIVATE_KEY) already
  # grants org-wide (same pattern as omnibase_infra's trigger-runtime-rebuild
  # job).
  notify-plugin-pin-cascade:
    name: Notify Plugin Pin Cascade
    needs: release
    if: ${{ !contains(needs.release.outputs.version, 'rc') }}
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Check onexbot-occ-writer App credentials are configured
        id: token_check
        env:
          APP_ID: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::ONEXBOT_OCC_APP_ID / ONEXBOT_OCC_PRIVATE_KEY are not configured. Skipping cross-repo dispatch." \
              "Provision the onexbot-occ-writer App org secrets to enable plugin pin cascade."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint onexbot-occ-writer app token
        id: app-token
        if: steps.token_check.outputs.has_token == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: omnibase_infra
          permission-contents: write

      - name: Dispatch plugin-release to omnibase_infra
        if: steps.token_check.outputs.has_token == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: OmniNode-ai/omnibase_infra
          event-type: plugin-release
          client-payload: >-
            {
              "package": "omninode-claude",
              "version": "${{ needs.release.outputs.version }}",
              "source_repo": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}"
            }
