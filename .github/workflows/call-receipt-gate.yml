#
# Caller workflow that invokes the reusable receipt-gate on every PR targeting main.
#
# Receipt-gate (omnibase_core's .github/workflows/receipt-gate.yml) enforces
# "Enforcement by Receipt" (OMN-10411): every PR must cite a Linear ticket whose
# dod_evidence items all have PASS ModelDodReceipt artifacts at the canonical
# path on onex_change_control. Missing or failing receipts block merge.
#
# Required-status-check name (for branch-protection): `verify / verify`.
# Branch-protection update happens after Wave 1 PRs merge — see OMN-10418.

name: Receipt Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, dev]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  # OMN-15117 (OMN-15057 vector-5 shape, missed by #1931 because `verify / verify`
  # had no required-checks.yaml row for the guard to check): `needs: occ-preflight`
  # with no `if:` override means GitHub's implicit job-level `if:` — `success()`
  # evaluated over `needs:` — SKIPS this job on any occ-preflight failure/
  # cancellation, and a skipped job satisfies branch protection (skipped counts
  # as passing). `verify / verify` is live-required on `main` (the dev->main
  # promotion boundary), so that was a silent-pass bypass on the load-bearing gate.
  #
  # `if: always()` makes `verify` run unconditionally so it can never silently
  # skip-as-pass. This is a PARTIAL fix in isolation — a job whose body is
  # `uses:` (calls a reusable workflow) cannot also declare `steps:`, so there
  # is no way to insert an inline `needs.occ-preflight.result != 'success'` ->
  # `exit 1` guard step ahead of the call (unlike Shape-A jobs with their own
  # steps, e.g. main-target-guard.yml, url-authority-gate.yml). Real enforcement
  # does not depend on this job's own result: `occ-preflight / eligibility`
  # (produced unconditionally, no `needs`/`if`, by call-occ-preflight.yml) is
  # independently required on this repo's dev+main branch protection, so an
  # occ-preflight failure still blocks merge via that separate required context
  # even though this job decouples. Same precedent/rationale as omnibase_core#1499
  # applied to its own `deploy-gate`/`verify` jobs (identical `uses:`-only shape).
  verify:
    needs: occ-preflight
    if: always()
    # self-gating-ok: intentional cross-repo caller — omniclaude does not host
    # receipt-gate.yml itself; the reusable workflow lives in omnibase_core.
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@f5e51ad47c81e2136715752380224e7eba2f6eb0 # OMN-13902: pinned to commit-text receipt-gate fix; repoint to @main after the next core release ships
