#
# KB Doc Gate (reusable). OMN-16589 (pilot), OMN-17172 (fleet rollout).
#
# Keeps product-repo markdown inside the allowed set defined by the operator
# ruling of 2026-09-01 -- root README, CLAUDE.md/.claude, CHANGELOG*, LICENSE*,
# root SECURITY.md, .github/**, skills|commands|agents/**, and the tests/**
# fixture subtrees. Everything else is documentation whose home is the
# knowledge-base repo. Full statement of the rule, and the per-repo
# .kb-doc-gate.yaml schema, in scripts/kb_doc_gate.py.
#
# Two modes:
#   diff   (default) -- fails a PR that ADDS or MODIFIES markdown outside the
#                       allowed set. Deletions always pass; a rename is judged
#                       on its destination. This is the fleet default: it stops
#                       regrowth without blocking PRs against a repo's existing
#                       pre-migration doc sprawl.
#   strict           -- fails if ANY tracked markdown outside the allowed set
#                       exists on the branch. The end state for a repo whose
#                       KB Wave-4 migration (epic OMN-16602) has landed.
#
# Usage in caller repos:
#   jobs:
#     kb-doc-gate:
#       uses: OmniNode-ai/omniclaude/.github/workflows/kb-doc-gate-reusable.yml@<immutable-sha>
#       with:
#         mode: diff   # or 'strict'; a repo's own .kb-doc-gate.yaml 'mode:' wins if set
#
# Surfaced check context in the caller: `kb-doc-gate / kb-doc-gate` (caller job
# id / this job's name). That is the context registered in branch protection.
#
# ONE pin, not two: the validator checkout defaults to `github.job_workflow_sha`
# (the SHA this reusable workflow was resolved at), so the `uses:` SHA above is
# the single source of truth for both the workflow and the validator script.
# Pin to an omniclaude commit on `dev` that carries scripts/kb_doc_gate.py --
# NOT `@main`, which is release-synced and does not carry the gate yet.
# `validator_ref:` remains available as an explicit override.
#
# Canonical validator: scripts/kb_doc_gate.py (this repo). Same script also
# runs locally via the exported 'kb-doc-gate' pre-commit hook
# (.pre-commit-hooks.yaml) -- local and CI verdicts can never diverge.
#
# REQUIRED status check as of OMN-17172: registered in dev branch protection
# (main for omnistream) across the registry, and asserted through
# EXPECTED_EXTERNAL_CONTEXTS in scripts/ci/ci_summary_gate.py for the two repos
# that gate behind the single `CI Summary` umbrella (omnibase_infra,
# omnimarket). A caller that drops this workflow therefore wedges its own
# branch rather than silently losing the gate.

name: KB Doc Gate (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: >-
          Fallback mode when the caller repo's .kb-doc-gate.yaml does not set
          'mode' ('diff' or 'strict'). A config-file mode always wins over this
          input. An unrecognized value is an argparse error (exit 2) inside the
          validator, not a silent pass -- the gate fails closed.
        type: string
        required: false
        default: diff
      validator_ref:
        description: >-
          Optional override for the omniclaude ref used to fetch
          scripts/kb_doc_gate.py for external caller repos. Leave unset in
          normal use: the default is github.job_workflow_sha, which is already
          the exact SHA the caller pinned this reusable workflow to.
        type: string
        required: false

permissions:
  contents: read

jobs:
  kb-doc-gate:
    name: kb-doc-gate
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci; public forks / dev-base PRs default to ubuntu-latest
    runs-on: >-
      ${{
        ((github.event_name == 'pull_request' && github.base_ref == 'dev') ||
         (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository))
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 10
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is REQUIRED, not a nicety. The validator diffs
          # `origin/<base>...HEAD` (three-dot), which needs a merge base. At the
          # default depth 1 the checkout grabs one commit of the PR merge ref
          # and the base-ref fetch below grabs one commit of the base branch, so
          # the two histories share no ancestor and git aborts:
          #   subprocess.CalledProcessError: Command '['git','diff',
          #   '--name-status','-M','origin/dev...HEAD']' returned non-zero exit
          #   status 128
          # (omnimarket run 33035063242 -- the first run in which the validator
          # was fetched successfully and could get far enough to hit this).
          fetch-depth: 0

      - name: Fetch base ref
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          resolved_base_ref="${BASE_REF:-dev}"
          git fetch origin "${resolved_base_ref}:refs/remotes/origin/${resolved_base_ref}" --no-tags --quiet
          base_ref="refs/remotes/origin/${resolved_base_ref}"
          # Prove the merge base the validator's three-dot diff depends on
          # actually exists, and say so plainly if it does not -- otherwise the
          # failure surfaces as a bare git exit 128 inside a Python traceback.
          if ! git rev-parse --verify --quiet "${base_ref}^{commit}" >/dev/null; then
            echo "::error::base ref ${base_ref} was not fetched as a commit." \
                 "Check the caller base ref and fetch step. THE GATE DID NOT RUN."
            exit 1
          fi
          if ! git merge-base "${base_ref}" HEAD >/dev/null 2>&1; then
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              echo "::error::no merge base between origin/${resolved_base_ref} and HEAD." \
                   "The caller checkout is shallow; kb-doc-gate needs fetch-depth: 0." \
                   "THE GATE DID NOT RUN."
            else
              echo "::error::no merge base between origin/${resolved_base_ref} and HEAD." \
                   "Repository histories are unrelated or the base ref is not an ancestor-lineage peer." \
                   "THE GATE DID NOT RUN."
            fi
            exit 1
          fi
          echo "BASE_REF=${resolved_base_ref}" >> "$GITHUB_ENV"

      # OMN-16589: the validator lives in omniclaude (this repo). When called
      # from another repo, GITHUB_WORKSPACE holds the CALLER's tree (checked
      # out above), so pull just the script from the pinned omniclaude ref into
      # a side path -- mirrors deploy-gate-reusable.yml's support-script fetch.
      #
      # The default MUST be `github.job_workflow_sha`: for a job that runs a
      # reusable workflow, that context holds the commit SHA of THIS workflow
      # file -- i.e. exactly the SHA the caller pinned in its `uses:`. The two
      # obvious-looking alternatives are both wrong, and both have already
      # broken this gate in production:
      #   * `main` -- omniclaude main is release-synced and does not carry
      #     scripts/kb_doc_gate.py, so the sparse checkout silently produced an
      #     empty side path and every caller died at the next step with
      #     "python3: can't open file ... [Errno 2]" / exit 2.
      #   * `github.sha` -- inside a reusable workflow the `github` context is
      #     the CALLER's, so this resolves to a commit SHA in the caller repo
      #     (omnibase_core, omnimarket, ...) that does not exist in omniclaude.
      # `job_workflow_sha` keeps the validator source and the workflow source
      # on one immutable commit with a SINGLE caller-side pin, so the two can
      # never drift apart. `validator_ref` stays as an explicit override.
      - name: Fetch kb-doc-gate validator (omniclaude canonical source)
        if: github.repository != 'OmniNode-ai/omniclaude'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OmniNode-ai/omniclaude
          ref: ${{ inputs.validator_ref || github.job_workflow_sha }}
          path: .omniclaude-kb-doc-gate
          persist-credentials: false
          sparse-checkout: |
            scripts/kb_doc_gate.py
          sparse-checkout-cone-mode: false

      - name: Run kb-doc-gate
        env:
          MODE: ${{ inputs.mode }}
          SCRIPT_PATH: >-
            ${{ github.repository != 'OmniNode-ai/omniclaude'
                && '.omniclaude-kb-doc-gate/scripts/kb_doc_gate.py'
                || 'scripts/kb_doc_gate.py' }}
        run: |
          set -euo pipefail
          # Fail LOUD, not with a bare "python3: can't open file ... Errno 2".
          # A sparse checkout of a path that does not exist at the requested
          # ref SUCCEEDS and leaves an empty side path, so a bad validator ref
          # surfaces only here, as an exit-2 that reads like a gate verdict but
          # is actually "the gate never ran". Name the cause explicitly.
          if [ ! -f "${SCRIPT_PATH}" ]; then
            echo "::error::kb-doc-gate validator not found at ${SCRIPT_PATH}." \
                 "The omniclaude ref this workflow was fetched from does not" \
                 "carry scripts/kb_doc_gate.py. Pin the caller's 'uses:' to an" \
                 "omniclaude commit that contains the validator (or pass" \
                 "validator_ref explicitly). THE GATE DID NOT RUN."
            exit 1
          fi
          python3 "${SCRIPT_PATH}" \
            --base-ref "origin/${BASE_REF}" \
            --head-ref HEAD \
            --mode "${MODE}" \
            --repo-root .
