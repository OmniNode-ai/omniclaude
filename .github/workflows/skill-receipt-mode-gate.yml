#
# Skill Receipt-Mode Gate (OMN-13098).
#
# Runs the omnibase_core validator
# (`python -m omnibase_core.validators.skill_dispatch_receipt_mode`) against the
# whole plugins/onex/skills tree, tolerating the not-yet-migrated skills listed
# in .onex_ratchets/skill_receipt_mode_allowlist.yaml. The gate FAILS if:
#   - a non-allowlisted dispatch skill has a bare `onex run|node|run-node`
#     invocation, inline executable logic, a missing/invalid `skill_kind`, or a
#     `cat workflow_result.json` / "surface JSON verbatim" instruction;
#   - the allowlist grows, a listed skill is migrated (stale entry), or a listed
#     skill no longer exists.
#
# The allowlist shrinks to empty as Phase 4a migrations land; the file is then
# deleted and the gate becomes unconditional.
#
# Queue-safety: triggers on BOTH pull_request and merge_group so it cannot
# permanently wedge the merge queue once promoted to a required status check.
#
# Required-status-check name (when flipped): `skill-receipt-mode-gate / skill-receipt-mode-gate`

name: skill-receipt-mode-gate

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'plugins/onex/skills/**'
      - '.onex_ratchets/skill_receipt_mode_allowlist.yaml'
      - 'scripts/check_skill_dispatch_receipt_mode_wrapper.sh'
      - '.github/workflows/skill-receipt-mode-gate.yml'

permissions:
  contents: read

concurrency:
  group: skill-receipt-mode-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-receipt-mode-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checkout omnibase_core (provides the skill receipt-mode validator)
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/omnibase_core
          # The validator lands on omnibase_core dev in this same ticket
          # (OMN-13098). Track dev so omniclaude CI sees it once the paired
          # core PR merges; promote to main after dev→main promotion.
          ref: dev
          path: _omnibase_core
          token: ${{ github.token }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install omnibase_core (validator package) into a uv venv
        run: |
          set -euo pipefail
          uv venv .skill-receipt-venv --python 3.12
          # Build omnibase_core from the freshly-checked-out dev source
          # (./_omnibase_core) into a wheel, then install THAT wheel by path. The
          # validator (OMN-13098) lands on omnibase_core dev before any release bump,
          # so a published index wheel does not yet contain it — installing the
          # directly-built wheel is the only way to guarantee the dev source (with the
          # validator) is what gets installed, never a stale registry version.
          uv build --wheel --out-dir .skill-receipt-wheel ./_omnibase_core
          wheel="$(ls .skill-receipt-wheel/omnibase_core-*.whl)"
          echo "Installing locally-built wheel: ${wheel}"
          # --no-config / --no-sources make uv ignore omniclaude's own pyproject.toml
          # [tool.uv] + [tool.uv.sources] (which pin omnibase-core to a git rev / older
          # release). Without them, running `uv pip install` from the repo root applies
          # that pin and installs a stale omnibase-core (e.g. 0.44.0) that predates the
          # validator, instead of the locally-built dev wheel passed on the command line.
          # Transitive deps still resolve normally from the default index.
          uv pip install --python .skill-receipt-venv/bin/python \
            --no-config --no-sources --reinstall-package omnibase-core "${wheel}"
          # Hard assertion: the validator module must be importable, else the wrong
          # omnibase-core was installed and the gate result would be meaningless.
          .skill-receipt-venv/bin/python -c \
            'import omnibase_core.validators.skill_dispatch_receipt_mode'
      - name: Run skill receipt-mode gate
        run: |
          set -euo pipefail
          allowlist=".onex_ratchets/skill_receipt_mode_allowlist.yaml"
          if [ ! -f "$allowlist" ]; then
            echo "::notice::Ratchet allowlist absent — gate is unconditional (all dispatch skills must be receipt-mode)."
          fi
          .skill-receipt-venv/bin/python -m omnibase_core.validators.skill_dispatch_receipt_mode \
            --skills-root plugins/onex/skills \
            --allowlist "$allowlist"
