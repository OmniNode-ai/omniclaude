name: Hook Inventory Gate

# OMN-17020. Blocking gate on hook inventory parity.
#
# OMN-13244 unregistered the whole hook surface for a measurement baseline with
# no expiry, no re-enable ticket and no inventory of what went dark. The
# enforcing hook for the foreground rule then sat on disk, switched off, while
# that rule was corrected by hand ~61 times over 16 of 18 days
# (docs/tracking/2026-08-29-beta-off-the-rails-analysis.md, root cause RC-B).
# Nothing failed, because nothing was checking.
#
# This is the check. It fails CLOSED and names the hook when
# plugins/onex/hooks/contracts/hook_inventory.yaml, hooks.json and the scripts
# on disk stop agreeing, or when a declared disable outlives its own review
# date.
#
# Static mode only, deliberately. `--live` reads ONEX_HOOKS_MASK, which
# common.sh re-reads from ~/.omnibase/.env — a file no runner has. A check that
# passes because its input is absent is worse than no check, so the mask
# surface belongs to session_start_hook_parity.sh on the operator Mac, not
# here. Same boundary hook-edge-lane-gate draws.
#
# Detection that is not a merge gate gets ignored (CLAUDE.md rule 5), which is
# why this ships as a workflow and a pre-commit hook in the same change as the
# inventory it enforces.

# OMN-18530 AC8. No `paths:` filter, deliberately, on the same reasoning
# hook-edge-lane-gate records for itself. This context is now asserted by CI
# Summary's layer-4 external sweep, which WAITS for it on every pull request.
# A filtered gate under a context something waits for is skip-vector 1: a pull
# request touching only excluded paths never runs the job, the context never
# reports, and the pull request sits PENDING forever.
#
# The filter was also wrong on its own terms before that. It listed the hook
# tree and the checker but not `scripts/validation/`'s siblings, not this file,
# and not the disable-declaration review dates the gate enforces — those expire
# with the calendar rather than with a commit, so the one change that must
# re-run this gate is a change to nothing at all. The gate is a sub-second
# static read of one contract against one directory, so it runs on every pull
# request rather than buying either failure back.
on:
  push:
    branches: [main, dev, 'hotfix/**']
  pull_request:
    branches: [main, dev]

# OMN-19644: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  hook-inventory-gate:
    needs: occ-preflight
    # Skip-vector 5 (OMN-18530 AC8; same fix hook-edge-lane-gate took under
    # OMN-17204). `needs:` with no `if:` means the implicit job condition is
    # `success()` over `needs:`, so a failed or cancelled occ-preflight SKIPS
    # this job -- and a skipped job renders no check run at all, which reads to
    # CI Summary's layer 4 as the absent case rather than as a refusal. Wiring
    # the context without `if: always()` would put a silent-pass bypass into
    # the one gate whose entire purpose is that a switched-off hook stops
    # reading as green.
    if: always()
    name: Hook Inventory Gate
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0"

      - name: Validate hook inventory parity
        working-directory: ${{ github.workspace }}
        env:
          # The mask is a per-machine surface; clear any inherited value so a
          # runner cannot accidentally start reporting on one.
          ONEX_HOOKS_MASK: ''
        run: python scripts/validation/validate_hook_inventory.py
