#
# Wave D CI gate: runtime-change PRs must cite a ticket with deploy evidence.
# Ticket: OMN-8912 | Epic: OMN-8908 (contract-validation-in-CI)
# Root cause: OMN-8841 — Dockerfile.runtime changed, deploy never dispatched,
#             deploy-agent inactive 2 days undetected.
# DGM-Phase6 (OMN-9734): validator moved to composite action for single-source reuse.
#
# Required status check: "deploy-gate"
# Must pass before merging to main on all repos with runtime code.

name: Deploy Gate

on:
  pull_request:
    branches: [main, dev, develop]
  merge_group:
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number to validate"
        required: true

concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gate:
    # OMN-16878 (OMN-15057 vector 5): this context becomes a REQUIRED status
    # check on `dev` in the same change. `needs:` with no `if:` means GitHub's
    # implicit job-level `if:` is `success()` over `needs:` — a failed or
    # cancelled upstream job SKIPS this job, and a skipped job SATISFIES
    # branch protection. Requiring the context without this line would have
    # wired in a silent-pass bypass on the deploy gate itself. `if: always()`
    # is the same shape the already-required url-authority-gate.yml and
    # main-target-guard.yml use in this repo.
    if: always()
    name: deploy-gate
    # Lightweight required metadata gate: keep it hosted so merge sweeps do
    # not wait on the self-hosted fleet for deploy-evidence checks.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Skip on merge_group
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: |
          echo "::notice::deploy-gate: merge_group event — skipped (validated on PR branch)."

      - name: Get PR number
        if: github.event_name != 'merge_group'
        id: pr-number
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_INPUT: ${{ inputs.pr-number }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
        working-directory: ${{ github.workspace }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "pr_number=$PR_NUMBER_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$PR_NUMBER_EVENT" >> "$GITHUB_OUTPUT"
          fi

      - name: Run deploy gate
        if: github.event_name != 'merge_group'
        uses: ./.github/actions/deploy-gate
        with:
          pr-number: ${{ steps.pr-number.outputs.pr_number }}
          github-token: ${{ github.token }}
          # OMN-20074: this repository's own contracts/ in the pull request checkout.
          contracts-dir: contracts
          # OMN-14505: composite actions cannot read `vars` directly, so the
          # org variable is resolved here (job scope, where `vars` is valid)
          # and threaded through as an input.
          falsifiability-mode: ${{ vars.DEPLOY_GATE_FALSIFIABILITY || 'report' }}
