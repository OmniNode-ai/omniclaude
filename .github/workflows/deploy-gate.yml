#
# Wave D CI gate: runtime-change PRs must cite a ticket with deploy evidence.
# Ticket: OMN-8912 | Epic: OMN-8908 (contract-validation-in-CI)
# Root cause: OMN-8841 — Dockerfile.runtime changed, deploy never dispatched,
#             deploy-agent inactive 2 days undetected.
# DGM-Phase6 (OMN-9734): validator moved to composite action for single-source reuse.
#
# Required status check: "deploy-gate"
# Must pass before merging to main on all repos with runtime code.

name: Deploy Gate

on:
  pull_request:
    branches: [main, dev, develop]
  merge_group:
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number to validate"
        required: true

concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  deploy-gate:
    needs: occ-preflight
    name: deploy-gate
    # Lightweight required metadata/OCC gate: keep it hosted so merge sweeps do
    # not wait on the self-hosted fleet for deploy-evidence checks.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Skip on merge_group
        if: github.event_name == 'merge_group'
        working-directory: ${{ github.workspace }}
        run: |
          echo "::notice::deploy-gate: merge_group event — skipped (validated on PR branch)."

      - name: Get PR number
        if: github.event_name != 'merge_group'
        id: pr-number
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_INPUT: ${{ inputs.pr-number }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
        working-directory: ${{ github.workspace }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "pr_number=$PR_NUMBER_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$PR_NUMBER_EVENT" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve deploy-gate OCC evidence source
        if: github.event_name != 'merge_group'
        id: resolve-occ-evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr-number.outputs.pr_number }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          if ! changed_files="$(gh pr diff "$PR_NUMBER" --name-only 2>/tmp/deploy-gate-gh-diff.err | tr '\n' ' ')"; then
            base_ref="${GITHUB_BASE_REF:-main}"
            echo "::notice::gh pr diff failed; falling back to local git diff against origin/${base_ref}"
            cat /tmp/deploy-gate-gh-diff.err || true
            git fetch origin "$base_ref" --no-tags
            changed_files="$(git diff --name-only "origin/${base_ref}" HEAD | tr '\n' ' ')"
          fi
          pr_body="$(gh pr view "$PR_NUMBER" --json body -q '.body')"

          python .github/actions/deploy-gate/validate_pr_deploy_required.py \
            --changed-files "$changed_files" \
            --pr-body "$pr_body" \
            --resolve-occ-ref \
            --default-occ-ref dev \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout onex_change_control contracts
        if: github.event_name != 'merge_group' && steps.resolve-occ-evidence.outputs.deploy_gate_required == 'true'
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          OCC_REF: ${{ steps.resolve-occ-evidence.outputs.occ_ref }}
          OCC_REPO_URL: https://github.com/OmniNode-ai/onex_change_control.git
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash scripts/deploy-gate/checkout-occ-contracts.sh

      - name: Run deploy gate
        if: github.event_name != 'merge_group'
        uses: ./.github/actions/deploy-gate
        with:
          pr-number: ${{ steps.pr-number.outputs.pr_number }}
          github-token: ${{ github.token }}
          contracts-dir: _occ/contracts
