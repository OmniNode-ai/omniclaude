#
# OMN-10347 (extends OMN-9730 DGM-Phase4): Reusable workflow — mechanical block
# on ALL bracketed skip-gate bypass tokens, not only the deploy-gate form.
# Called from each repo via:
#
#   jobs:
#     call-reject-skip-token:
#       uses: OmniNode-ai/omniclaude/.github/workflows/reject-deploy-gate-skip.yml@main
#
# OMN-10422: Added merge_group trigger with explicit PR resolution.
# On merge_group, github.event.pull_request is null; the workflow resolves the PR
# from the queue head ref when GitHub exposes a pr-<number> segment.
# Cache is disabled on this job (invariant I9).
#
# OMN-20074: the skip-token approvals registry and the receipt-id comment that cited it are
# retired. There is NO escape hatch: a [skip-*] token on any scanned surface fails this check
# whatever else the PR body, title or commits say. (OMN-10971 had validated the comment
# against a central registry kept in change control; both are gone.)
#
# This is a REQUIRED status check. PRs containing any [skip-*] bypass token
# cannot merge.
#
# OMN-20073 (OCC retirement, epic OMN-20068): this reusable no longer runs the change-control
# preflight and the token scan no longer waits on it. The scan reads the PR body, title, commits
# and diff from the GitHub API and the allowlist from the pinned trusted ref, so it needs nothing
# from the preflight. A caller that drops the change-control required context keeps the scan.
# Callers pin this file by sha, so each one adopts the change by its own bump.
#
# CLAUDE.md Rule #10: Never bypass local gates.
# Plan: omni_home/docs/plans/2026-04-25-deploy-gate-matcher-narrowing.md Phase 4

name: Reject skip-gate bypass tokens

on:
  workflow_call:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

jobs:
  # advisory-ok: OMN-20073 enforced in every caller as the required context `<caller job id> / scan / reject-skip-gate-token` (omniclaude: `call-reject-skip-token / scan / reject-skip-gate-token`); this gate sees only job ids and names in this file and cannot see a caller prefix, and the preflight job that used to cover the file by name is what this change removes
  scan-skip-tokens:
    name: scan / reject-skip-gate-token
    # OMN-18205: the untrusted test is the FORK test, and only the fork test.
    # It used to also send every same-repo pull request whose base is `dev`
    # to the public class. That is not a trust boundary -- a same-repo pull
    # request is written by someone who can already push to this repository,
    # and the sibling pr-title reusable has always used the fork test alone.
    # What the extra clause actually did was pin every private repository's
    # required checks to GitHub-hosted runners, which the 2026-09-14 operator
    # ruling forbids and which the enterprise hosted-runner switch has since
    # made unrunnable. A public caller's genuine fork pull request still
    # resolves to OMNI_PUBLIC_PR_RUNS_ON_JSON (OMN-16683).
    # OMN-21216 (OMN-20074): since 2026-10-19 a private repository may not run
    # on a hosted label at all, fork pull requests included, and a hosted
    # default behind a variable counts. A private caller therefore never takes
    # the public arm and takes its own trusted variable with NO default: the
    # private-repo placement gate refuses a private caller where that variable
    # is unset, so a passing caller always has it. Public callers keep the
    # hosted default. Same shape as kb-doc-gate-reusable.yml.
    runs-on: >-
      ${{
        (!github.event.repository.private &&
         github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || github.event.repository.private
        && fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON)
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    timeout-minutes: 5

    steps:
      # OMN-13934: No `actions/checkout`. Every surface this job scans is sourced
      # from the GitHub API (event payload, `gh pr view`, `gh pr diff`), so it
      # needs neither working tree nor git history. The previous checkout used
      # `fetch-depth: 0` (full history + all tags); on a COLD self-hosted runner
      # that fetch alone exceeded the 5-minute timeout, cancelling the job (~5:11)
      # and wedging content-innocent PRs on this REQUIRED org-wide gate. Dropping
      # the checkout is the fix; `GH_REPO` gives `gh` its repo context without a
      # local remote.
      - name: Resolve PR body and metadata
        id: resolve-body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail

          write_outputs() {
            local body="$1"
            local pr_number="$2"
            local pr_author="$3"
            local body_file

            body_file="$(mktemp "${RUNNER_TEMP:-/tmp}/skip-token-body.XXXXXX")"
            printf '%s' "${body}" > "${body_file}"
            {
              printf 'body_path=%s\n' "${body_file}"
              printf 'pr_number=%s\n' "${pr_number}"
              printf 'pr_author=%s\n' "${pr_author}"
            } >> "${GITHUB_OUTPUT}"
          }

          if [[ "${EVENT_NAME}" == "merge_group" ]]; then
            # On merge_group, github.event.pull_request is null.
            # merge_group.head_sha is a synthetic queue commit, not the PR head
            # commit, so resolve via the queue ref's pr-<number> segment.
            HEAD_REF="${MERGE_GROUP_HEAD_REF:-}"
            PR_NUMBER_FROM_REF=""
            if [[ "${HEAD_REF}" =~ (^|/)pr-([0-9]+)- ]]; then
              PR_NUMBER_FROM_REF="${BASH_REMATCH[2]}"
            fi

            if [[ -n "${PR_NUMBER_FROM_REF}" ]]; then
              PR_JSON=$(gh pr view "${PR_NUMBER_FROM_REF}" --json body,author 2>/dev/null || true)
              BODY=$(printf '%s' "${PR_JSON}" | jq -r '.body // ""')
              AUTHOR=$(printf '%s' "${PR_JSON}" | jq -r '.author.login // ""')
              write_outputs "${BODY}" "${PR_NUMBER_FROM_REF}" "${AUTHOR}"
              exit 0
            fi

            echo "::notice::merge_group event did not expose a resolvable PR ref; skip-token scan already runs on pull_request events."
            echo "::notice::merge_group head_ref='${HEAD_REF}' head_sha='${MERGE_GROUP_HEAD_SHA:-}'"
            write_outputs "" "" ""
          else
            BODY="${PR_BODY:-}"
            AUTHOR="${PR_AUTHOR:-}"
            RESOLVED_PR="${PR_NUMBER:-}"
            if [[ -z "${BODY}" ]] && [[ -n "${RESOLVED_PR}" ]]; then
              PR_JSON=$(gh pr view "${RESOLVED_PR}" --json body,author 2>/dev/null || true)
              BODY=$(printf '%s' "${PR_JSON}" | jq -r '.body // ""')
              AUTHOR=$(printf '%s' "${PR_JSON}" | jq -r '.author.login // ""')
            fi
            write_outputs "${BODY}" "${RESOLVED_PR}" "${AUTHOR}"
          fi

      - name: Scan all PR surfaces for skip-gate bypass tokens
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESOLVED_BODY_PATH: ${{ steps.resolve-body.outputs.body_path }}
          RESOLVED_PR_NUMBER: ${{ steps.resolve-body.outputs.pr_number }}
          RESOLVED_PR_AUTHOR: ${{ steps.resolve-body.outputs.pr_author }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # OMN-10347: Broadened from the deploy-gate form to ALL bracketed skip tokens.
          # OMN-10969: Extended to scan PR title, commit messages, and changed file diff.
          # OMN-12696: Added committed agent session evidence under .onex_state/evidence.
          SKIP_PATTERN='\[skip-[a-zA-Z]'
          RULE_REF="CLAUDE.md Rule #10"
          TICKET_REF="OMN-20074"

          VIOLATIONS=()

          # ── Collect all surfaces ──────────────────────────────────────────────

          # Surface 1: PR body
          BODY=""
          if [[ -n "${RESOLVED_BODY_PATH:-}" && -f "${RESOLVED_BODY_PATH}" ]]; then
            BODY="$(cat "${RESOLVED_BODY_PATH}")"
          fi

          TITLE=""
          COMMIT_MESSAGES=""
          DIFF=""
          SESSION_EVIDENCE_DIFF=""

          if [[ -n "${RESOLVED_PR_NUMBER:-}" ]]; then
            # Surface 2: PR title
            TITLE="${PR_TITLE:-}"
            if [[ -z "${TITLE}" ]]; then
              TITLE=$(gh pr view "${RESOLVED_PR_NUMBER}" --json title --jq .title 2>/dev/null || true)
            fi

            # Surface 3: Commit messages in the PR
            COMMIT_MESSAGES=$(gh pr view "${RESOLVED_PR_NUMBER}" --json commits --jq '[.commits[].messageHeadline] | join("\n")' 2>/dev/null || true)

            # Surfaces 4 & 5 read the PR diff from the GitHub API (`gh pr diff`)
            # instead of a local `git diff`, so this job needs no checkout/history
            # (OMN-13934 — cold-runner fetch-depth:0 timeout). The awk filters
            # reproduce the prior git pathspecs exactly: added lines only, scoped
            # by file path, self-workflow excluded.
            PR_DIFF_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/skip-token-prdiff.XXXXXX")"
            gh pr diff "${RESOLVED_PR_NUMBER}" > "${PR_DIFF_FILE}" 2>/dev/null || true

            # Surface 4: Changed body-like file types (md, yaml, yml, txt), added
            # lines only, excluding this workflow file. Restricting to body-like
            # types avoids false positives on source/tests that legitimately
            # discuss skip tokens; the pre-commit hook applies the same filter.
            DIFF=$(awk '
              /^\+\+\+ / { p=$2; sub(/^b\//, "", p); f=p; next }
              /^--- / { next }
              /^diff --git / { f=""; next }
              /^\+/ { if (f != "" && f ~ /\.(md|yaml|yml|txt)$/ && f != ".github/workflows/reject-deploy-gate-skip.yml") print }
            ' "${PR_DIFF_FILE}" || true)

            # Surface 5: committed agent session evidence (any file type under
            # .onex_state/evidence/), added lines only. Scoped so source/tests can
            # still document the token matcher without tripping the required check.
            SESSION_EVIDENCE_DIFF=$(awk '
              /^\+\+\+ / { p=$2; sub(/^b\//, "", p); f=p; next }
              /^--- / { next }
              /^diff --git / { f=""; next }
              /^\+/ { if (f ~ /^\.onex_state\/evidence\//) print }
            ' "${PR_DIFF_FILE}" || true)
          else
            echo "::notice::No PR number available — skipping title, commit, and diff scans."
          fi

          # ── Per-surface skip-token scan ───────────────────────────────────────
          # OMN-20074: no escape hatch. A receipt-id comment on any surface does not
          # rescue a token, and no registry is read.
          check_surface() {
            local surface_name="$1"
            local content="$2"

            if [[ -z "$content" ]]; then
              return
            fi

            if echo "$content" | grep -qiE "$SKIP_PATTERN"; then
              VIOLATIONS+=("$surface_name")
            fi
          }

          check_surface "PR body" "${BODY}"
          check_surface "PR title" "${TITLE}"
          check_surface "commit messages" "${COMMIT_MESSAGES}"
          check_surface "changed file diff" "${DIFF}"
          check_surface "session evidence" "${SESSION_EVIDENCE_DIFF}"

          if [[ "${#VIOLATIONS[@]}" -eq 0 ]]; then
            echo "::notice::No [skip-*] bypass tokens found in any scanned surface (body, title, commits, diff, session evidence). OK."
            exit 0
          fi

          for surface in "${VIOLATIONS[@]}"; do
            echo "::error::$surface contains a [skip-*] bypass token."
          done
          echo "::error::Per $RULE_REF, there is no bypass. Fix the gate properly:"
          echo "::error::  1. Add dod_evidence with type: no_deployable_artifact (preferred)"
          echo "::error::  2. Narrow path patterns in validate_pr_deploy_required.py"
          echo "::error::Ticket: $TICKET_REF"
          exit 1

