# Verify this repository's shell boundary and distributable customer assets.
# Genuine combined CLI/model E2E lives in omnimarket and uses exact built wheels.
name: Onboarding Verify
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  fresh-mac:
    name: Fresh Mac onboarding
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install declared test dependencies
        run: uv sync --no-sources --group dev
      - name: Verify stock Bash dispatch and installed-wheel resources
        run: |
          uv run --no-sync python -m pytest --no-cov -q \
            --basetemp "$RUNNER_TEMP/onboarding-evidence" \
            tests/skills/test_thin_onboarding_bootstrap.py \
            tests/skills/test_customer_plugin_wheel.py \
            tests/skills/test_customer_asset_resolution.py \
            tests/scripts/test_install_gateway_dispatch.py
      - name: Keep repeatable package and dispatch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onboarding-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/onboarding-evidence/
          if-no-files-found: error
          retention-days: 30
