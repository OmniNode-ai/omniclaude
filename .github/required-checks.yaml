  # OMN-16878 (OMN-16876 census items 1-2). Three checks that ran on every PR
  # and could not block a merge: absent from branch protection AND from
  # scripts/ci/ci_summary_gate.py's EXPECTED_EXTERNAL_CONTEXTS. Flipped to
  # REQUIRED on dev in the same change, so this manifest matches live state.
  #
  # All three producer jobs gained `if: always()` in the same PR. Without it,
  # `needs: occ-preflight` with no `if:` lets a failed occ-preflight SKIP the
  # job, and a skipped job SATISFIES branch protection (OMN-15057 vector 5) —
  # requiring them as they stood would have wired in a silent-pass bypass.
  # This is why every row below can honestly carry `skip_semantics: never`.
  - name: "deploy-gate"
    mode: REQUIRED
    producer_kind: local
    workflow: deploy-gate.yml
    job_path: ["deploy-gate"]
    skip_semantics: never
    rationale: "OMN-16878: runtime-change PRs must cite a ticket with deploy DoD evidence (OMN-8912 gate, root cause OMN-8841). Ran 16/16 present and 16/16 green over merged dev PRs #2045-#2060 while unable to block anything. Non-vacuity proven: validate_pr_deploy_required.py exits 1 on a runtime-path diff whose PR body carries no deploy evidence, and 0 on a docs-only diff (OCC#7433, dod-nonvacuity-negative-tests). Corrects the omni_home CLAUDE.md claim that this context was already required here — it was not, in any form."

  - name: "receipt-honesty"
    mode: REQUIRED
    producer_kind: local
    workflow: receipt-honesty.yml
    job_path: ["receipt-honesty"]
    skip_semantics: never
    rationale: "OMN-16878: completes OMN-13328, whose OCC contract asserted omniclaude was 'already flipped' — live branch protection showed it never was. Ran 16/16 present and 16/16 green over #2045-#2060 while unable to block. Non-vacuity proven: the validator exits 1 on a gamed receipt (verifier == runner) and 0 on a real committed receipt. No-op by design on PRs that change no drift/dod_receipts/*.yaml — an explicit applicability guard in the workflow, not a silent pass."

  - name: "contract-validation"
    mode: REQUIRED
    producer_kind: local
    workflow: contract-validation.yml
    job_path: ["contract-validation"]
    skip_semantics: never
    rationale: "OMN-16878: completes OMN-13326, which claimed contract-validation was REQUIRED across all 6 repos; live readback showed omniclaude and omnibase_infra were never wired. Ran 16/16 present and 16/16 green over #2045-#2060 while unable to block. Non-vacuity proven: validate-yaml exits 1 on a schema-invalid contract and 0 on contracts/OMN-10041.yaml. Legitimately reports 'skipped' status internally when the branch carries no OMN-XXXX or no contract file, but the JOB always runs and always reports a conclusion, so skip_semantics is never."

  # OMN-17204. The hook edge's bus lane is now a declared contract
  # (plugins/onex/hooks/contracts/hook_edge_lane.yaml) instead of an answer
  # produced per invocation by shell sourcing order between ~/.omnibase/.env,
  # ~/.claude/settings.json and omnibase_infra's mac-dev overlay. That
  # undeclared fact cost three wrong conclusions (OMN-16162 flipped
  # Done -> Backlog on a wrong-lane probe, OMN-16996 was filed then falsified,
  # beta/GOAL.md row 0's hook clause could only ever fail). The gate shipped in
  # the same PR as the contract but landed advisory-only: absent from this
  # manifest AND from live branch protection, so a PR that deleted the resolver
  # out of a *_bus_mirror.sh went red here and merged anyway. A ticket whose
  # subject is "a rule nobody owns" cannot ship its own rule unenforced.
  #
  # Non-vacuity proven before admission, both directions, as unit tests rather
  # than a one-off run (tests/hooks/test_hook_edge_lane.py):
  #   - a *_bus_mirror.sh with the resolver deleted        -> exit 1
  #   - a *_bus_mirror.sh sourcing it BEFORE common.sh     -> exit 1
  #   - relay.required_network != known_lanes[lane].network -> exit 1 (this is
  #     the live OMN-17034 publisher/consumer split, made checkable)
  #   - a governed topic constant absent from the registry -> exit 1
  #   - the shipped tree                                    -> exit 0
  - name: "Hook Edge Lane Gate"
    mode: REQUIRED
    producer_kind: local
    workflow: hook-edge-lane-gate.yml
    job_path: ["hook-edge-lane-gate"]
    skip_semantics: never
    rationale: "OMN-17204: the hook edge's publish lane and the cloud relay's consume lane are one declared pairing; a mismatch must be a failing check, not a human reading two broker offsets. Path filters removed and `if: always()` added in the same change so the context reports on every PR (skip-vectors 1 and 5). Non-vacuity proven in tests/hooks/test_hook_edge_lane.py: the validator exits 1 on a dropped resolver, on resolver-before-common.sh ordering, on a relay/lane network split, and on a governed topic leaving the registry; 0 on the shipped tree."

  # OMN-18288. The Lane Identity Gate reported on `dev` from 2026-09-13 and
  # could not block anything: the context was absent from
  # required_status_checks, which is the advisory-detection gap CLAUDE.md
  # rule 5 names directly. Lane friction-p5 left it unclaimed at its TERMINAL
  # row (docs/tracking/ROLLING_WORK_LEDGER.md:7153) because arming a
  # commit-refusing hook fleet-wide would have frozen every worktree that
  # predates the mechanism -- a concern OMN-18273 answered separately by
  # defaulting the unregistered policy to `silent`.
  #
  # What this row makes blocking is the MODULE that supplies the missing
  # operand: the registry, the trailer stamping, the window check, the install
  # guard, and (OMN-18288) the per-clone arming probe. The pre-push refusal
  # downstream compares a claim holder against a pushing lane; without this
  # module the second operand does not exist, so a regression here silently
  # disarms every gate above it.
  #
  # Admitted with its path filters removed and `if: always()` added in the same
  # change (skip-vectors 1 and 5), proven RED before admission: with the row
  # present and the filters still in place,
  # validate_no_required_check_skip_vectors.py reported exactly
  # `vector-1-paths` and `vector-5-ungated-needs-cascade` on this context.
  - name: "Lane Identity Gate"
    mode: REQUIRED
    producer_kind: local
    workflow: lane-identity-gate.yml
    job_path: ["lane-identity-gate"]
    skip_semantics: never
    rationale: "OMN-18288: the lane identity module is the operand every downstream lane gate compares against, so a regression in it must fail a merge rather than report one. Non-vacuity is proven by the tests the job runs, which drive real `git commit` calls through the installed hook rather than importing the module: tests/scripts/test_lane_identity.py and tests/scripts/test_lane_identity_arming_probe.py."

  # OMN-18288, pre-existing divergence closed in passing. This context has been
  # live-required on `dev` since OMN-17172 and had no row here, so the hourly
  # privileged reconcile (required-check-manifest-reconcile.yml) failed on
  # EVERY run with `1 live required context(s) missing from manifest`. A
  # reconcile that is always red cannot report the divergence this change
  # introduces and then closes, so the row is added here rather than left for
  # a follow-up: the reconcile is the evidence surface for the row above it.
  # OMN-18777: the no-new-advisory-job gate. Its context was registered on live
  # branch protection before this row existed, and the manifest reconcile went
  # red on the next scheduled run (35412008973, 01:14:09Z) having been green at
  # 00:10:33Z (35408435728) -- the divergence window the header above warns
  # about, and the same failure the kb-doc-gate note below records. Recorded
  # here rather than left as a follow-up for the reason given there: a
  # reconcile that is always red cannot report the next divergence.
  - name: "advisory-job-gate / advisory-job-gate"
    mode: REQUIRED
    producer_kind: local
    workflow: advisory-job-gate.yml
    job_path: ["advisory-job-gate", "advisory-job-gate"]
    skip_semantics: never
    rationale: "OMN-18777: refuses an unannotated advisory workflow setting and a pull-request-reachable verification job in no enforcement surface. Called locally (`uses: ./.github/workflows/advisory-job-gate-reusable.yml`) because omniclaude hosts both the validator and the reusable. Live-required on dev since 2026-09-19."

  - name: "kb-doc-gate / kb-doc-gate"
    mode: REQUIRED
    producer_kind: local
    workflow: kb-doc-gate.yml
    job_path: ["kb-doc-gate", "kb-doc-gate"]
    skip_semantics: never
    rationale: "OMN-17172: document-placement gate, called locally (`uses: ./.github/workflows/kb-doc-gate-reusable.yml`) because omniclaude hosts both the validator and the reusable. Live-required on dev; row added under OMN-18288 to clear the manifest reconcile."

  # OMN-18790 wired the skip-count ratchet (omniclaude#2258, mechanism
  # OMN-18776) and registered it in GATE_JOBS/STRICT_SUCCESS_JOBS only — the
  # job's own header comment in ci.yml states the raw context was deliberately
  # NOT added to branch protection, on the reasoning that the CI Summary
  # umbrella already covers it. Live branch protection on dev disagrees: `gh
  # api repos/OmniNode-ai/omniclaude/branches/dev/protection/required_status_checks`
  # returns "Skip Count Ratchet (OMN-18776)" as a required context. The row
  # below records the manifest side of that live fact so the reconcile job
  # stops failing every push; it does not resolve the contradiction between
  # the code comment and the live protection setting, which is a design
  # question for OMN-18776/OMN-18790, not a manifest-drift question.
  - name: "Skip Count Ratchet (OMN-18776)"
    mode: REQUIRED
    producer_kind: local
    workflow: ci.yml
    job_path: ["skip-count-ratchet"]
    skip_semantics: never
    rationale: "OMN-18790/OMN-18776: skip-count baseline ratchet, direct job in ci.yml (`if: always()`, unconditional). Live-required on dev; row added under OMN-18790 to clear the manifest reconcile."
