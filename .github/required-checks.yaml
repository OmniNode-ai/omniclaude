    skip_semantics: neutral_ok
    rationale: "CodeRabbit thread resolution gate — legacy duplicate caller of the same reusable; consolidation tracked separately, not this ticket's scope. OMN-14856/OMN-15120 repair (mirrors omnibase_core@470d326dc / PR #1549): caller job 'cr-thread-gate' previously had an ungated `if:` including the dependabot-actor exemption — same vector-3 shape as 'gate / CodeRabbit Thread Check'. The dependabot-actor clause is now dropped and the issue_comment guard moved into the pr-number input; unlike the primary caller, this job still legitimately skips on `merge_group` (the sibling `merge-queue-compat` job is the dedicated merge_group producer for this composed context), which still posts a real check run with conclusion=skipped that branch protection accepts — hence skip_semantics stays neutral_ok, not never."

