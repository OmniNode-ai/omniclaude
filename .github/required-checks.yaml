# required-checks.yaml v3 (OMN-14854)
# Location: .github/required-checks.yaml
# Upgraded from v2 (OMN-2228) to schema v3: this file is now the OPERATIONAL
# input to the Required-Check Skip-Vector Guard (validate_no_required_check_skip_vectors.py).
#
# Exhaustive: every context in required_status_checks.contexts for omniclaude's
# `dev` branch has a `mode: REQUIRED` row below (fetched via
# `gh api repos/OmniNode-ai/omniclaude/branches/dev/protection/required_status_checks`,
# 57 contexts, verified 2026-07-20). The privileged reconcile job
# (required-check-manifest-reconcile.yml) fails closed if this file and live
# branch protection diverge in either direction.
#
# Do NOT rename/remove a REQUIRED row without following the Branch Protection
# Migration Safety procedure — flip branch protection first (or same PR), then
# update this file, so the reconcile job never observes a divergence window.
#
# `job_path` len 1 = Shape A (direct job); len 2 = Shape B/C
# ([caller_job_id, reusable_job_id]) per the design spec's context->job
# resolution algorithm (OMN-14854 ticket, spec section 1).
#
# `result_triage` (OMN-15304, optional; default `enforced`) — vector 6. A job
# rendering a REQUIRED context that reads `needs.<job>.result` must fail closed
# on every non-`success` value. `result_triage: waived` is the only opt-out and
# is honored ONLY when the row's `rationale` cites a tracking ticket
# (`OMN-xxxxx`); an unratified waiver is treated as enforced. It suppresses
# vector-6 findings only — never vectors 1-5.

