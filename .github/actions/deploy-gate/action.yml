#
# Composite action: run the deploy-gate validator.
# Called by omniclaude/.github/workflows/deploy-gate-reusable.yml
# Canonical source for all repos — DGM-Phase6 (OMN-9734).

name: Deploy Gate Validator
description: >
  Validates that PRs touching runtime paths cite a ticket with deploy DoD evidence.
  Canonical implementation: OMN-9685. Centralised: OMN-9734 (DGM-Phase6).

inputs:
  pr-number:
    description: PR number to validate
    required: true
  github-token:
    description: GitHub token for gh CLI access
    required: true
  contracts-dir:
    description: >
      Path to directory containing OMN-XXXX.yaml ticket contracts.
      Canonical source is onex_change_control (OMN-11423); the reusable
      workflow checks out OCC and passes _occ/contracts here.
    required: false
    default: _occ/contracts
  falsifiability-mode:
    description: >
      OMN-14505 rollout knob: "report" (default) computes the falsifiability
      verdict and logs a ::warning:: for vacuous deploy evidence, but the
      gate's exit status stays on the legacy substring rule. "enforce" makes
      falsifiability load-bearing. Composite actions cannot read the `vars`
      context directly, so callers resolve the org variable
      (`${{ vars.DEPLOY_GATE_FALSIFIABILITY || 'report' }}`) and pass it in
      here.
    required: false
    default: report

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.8.3"

    - name: Install pyyaml
      shell: bash
      run: python -m pip install pyyaml

    - name: Run deploy gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        CONTRACTS_DIR: ${{ inputs.contracts-dir }}
        ACTION_PATH: ${{ github.action_path }}
        # OMN-14505 rollout knob. "report" (the default) computes the falsifiability
        # verdict and logs a ::warning:: for every cited ticket whose deploy evidence
        # is vacuous, but the gate's EXIT STATUS stays on the legacy substring rule —
        # so landing this fix cannot wedge any of the 4 consuming repos. Flip to
        # "enforce" org-wide by setting the DEPLOY_GATE_FALSIFIABILITY org variable;
        # no code change required. Audit (OMN-14505): 1,140 of 1,167 deploy-gated
        # contracts (97.7%) currently declare NO falsifiable deploy probe, so
        # enforcing before the honest-probe path exists would jam every runtime PR.
        # Composite actions cannot reference the `vars` context directly (GitHub
        # Actions restriction — "Unrecognized named-value: 'vars'"), so the org
        # variable is resolved by the CALLER at job/workflow scope and threaded
        # through as the `falsifiability-mode` input instead.
        DEPLOY_GATE_FALSIFIABILITY: ${{ inputs.falsifiability-mode }}
      run: |
        if ! changed_files="$(gh pr diff "$PR_NUMBER" --name-only 2>/tmp/deploy-gate-gh-diff.err | tr '\n' ' ')"; then
          base_ref="${GITHUB_BASE_REF:-main}"
          echo "::notice::gh pr diff failed; falling back to local git diff against origin/${base_ref}"
          cat /tmp/deploy-gate-gh-diff.err || true
          git fetch origin "$base_ref" --no-tags
          changed_files="$(git diff --name-only "origin/${base_ref}" HEAD | tr '\n' ' ')"
        fi

        python "$ACTION_PATH/validate_pr_deploy_required.py" \
          --changed-files "$changed_files" \
          --pr-body "$(gh pr view "$PR_NUMBER" --json body -q '.body')" \
          --contracts-dir "$CONTRACTS_DIR"
