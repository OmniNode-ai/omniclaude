version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # These refs are re-pinned by hand under a ticket; tests/ci asserts their pins.
    # A Dependabot bump can only red the PR (omniclaude#2897, OMN-17427).
    ignore:
      - dependency-name: "OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml"
      - dependency-name: "OmniNode-ai/omnibase_core/.github/workflows/imperative-contract-guard.yml"
      - dependency-name: "OmniNode-ai/omnibase_core/.github/actions/validate-boundaries"
    groups:
      actions:
        patterns:
          - "*"
